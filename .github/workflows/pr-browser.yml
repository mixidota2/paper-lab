name: PR macOS Chrome review

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: pr-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  macos-chrome:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      LAB_BROWSER: macos-cdp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Identify reviewed checkout
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_TEST_SHA: ${{ github.sha }}
        run: |
          echo "PR head: $PR_HEAD_SHA"
          echo "Merge test: $MERGE_TEST_SHA"
          git rev-parse HEAD
      - name: Install locked validation dependencies
        run: uv sync --locked --extra dev --python 3.12
      - name: Install verified official Chrome distribution
        id: chrome_distribution
        shell: bash
        run: |
          set -o pipefail
          mkdir -p browser-review
          uv run --locked python tests/prepare_ci_chrome.py 2>&1 | tee browser-review/chrome-distribution.log
      - name: Required deterministic checks
        run: uv run --locked pytest -q -ra --fail-on-skip
      - name: Build every Lab in this checkout
        run: uv run --locked paper-lab build
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install locked DOM validation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate generated library HTML with real DOM events
        run: |
          npm run test:library-dom
          node tests/issue21-dom.cjs
      - name: Validate complete site and review plan without launching Chrome
        id: preflight
        shell: bash
        run: |
          set -o pipefail
          mkdir -p browser-review
          uv run --locked python tests/review_103.py --preflight --site site --out browser-review/preflight 2>&1 | tee browser-review/preflight.log
      - name: Preserve public build for independent browser preview
        id: build_preview
        if: ${{ success() && steps.preflight.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: public-site-${{ github.sha }}
          path: |
            site/index.html
            site/assets/
            site/papers/
            site/guides/
            site/figures/
            site/downloads/
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 7
      - name: Verify layout release in signed sandboxed Chrome
        id: layout_browser
        shell: bash
        env:
          UV_HTTP_TIMEOUT: '120'
        run: |
          set -o pipefail
          uv run --locked --with playwright==1.63.0 python tests/layout_release_browser.py 2>&1 | tee browser-review/layout-browser.log
      - name: Preserve preflight reports and failure logs
        if: ${{ !cancelled() && (steps.preflight.outcome != 'skipped' || steps.chrome_distribution.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-chrome-${{ github.sha }}
          path: browser-review/
          if-no-files-found: warn
          retention-days: 7
