name: PR macOS Chrome review

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: pr-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  macos-chrome:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      LAB_BROWSER: macos-cdp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Identify reviewed checkout
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_TEST_SHA: ${{ github.sha }}
        run: |
          echo "PR head: $PR_HEAD_SHA"
          echo "Merge test: $MERGE_TEST_SHA"
          git rev-parse HEAD
      - name: Install locked validation dependencies
        run: uv sync --locked --extra dev --python 3.12
      - name: Required deterministic checks
        run: uv run --locked pytest -q -ra --fail-on-skip
      - name: Build every Lab in this checkout
        run: uv run --locked paper-lab build
      - name: Validate complete site and review plan before launching Chrome
        id: preflight
        shell: bash
        run: |
          set -o pipefail
          mkdir -p browser-review
          uv run --locked python tests/review_103.py --preflight --site site --out browser-review/preflight 2>&1 | tee browser-review/preflight.log
      - name: Preserve public build for independent browser preview
        id: build_preview
        if: ${{ success() && steps.preflight.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: public-site-${{ github.sha }}
          path: |
            site/index.html
            site/assets/
            site/papers/
            site/guides/
            site/figures/
            site/downloads/
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 7
      # Existing official Chrome, direct minimal launch; no browser/OS installation.
      # Historical Linux failures remain in the PR and are not reclassified.
      - name: Verify signed Chrome and Seatbelt, then run CDP compatibility and Lab checks
        id: browser_review
        timeout-minutes: 18
        shell: bash
        run: |
          set -o pipefail
          uv run --locked --with playwright==1.63.0 python tests/review_103.py --run --site site --out browser-review/run 2>&1 | tee browser-review/runtime.log
      - name: Validate mandatory automatic report independently of publication
        if: ${{ !cancelled() && steps.browser_review.outcome != 'skipped' }}
        shell: bash
        run: uv run --locked python tests/review_103_report.py --site site --report browser-review/run/report.json --out browser-review/automatic-gate.json
      - name: Preserve review reports, screenshots, geometry and failure logs
        if: ${{ !cancelled() && steps.preflight.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-chrome-${{ github.sha }}
          path: browser-review/
          if-no-files-found: warn
          retention-days: 7
