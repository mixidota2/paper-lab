  title: 欧州のスーパーは期限間近の商品を集めて陳列した
  period: current
  domain: retail
  evaluation: observational
  publication_date: '2026-07-03'
  material: ワーキングペーパー（著者公開本文）
  task: この事例で店舗が決めるのは補充量ではなく、期限が近い商品を売り切るための陳列場所と価格である。
  scope: 著者は133店舗を39週にわたって観察した。集中陳列を行ったのは18店、動的値付けの3方式は各5店、介入しなかったのは100店だった。施策を行った期間は集中陳列が7週、価格施策が8〜18週だった。
  forecast: このカードは需要予測の精度を評価しない。予測器の詳しい仕様は未確認。
  policy: 集中陳列を行った店舗は通常どおり30%値引きし、対象商品を目立つ冷蔵売場に集めた。これは価格変更とは別の施策である。
  result: 著者の推定では、集中陳列で値引き商品の販売率は+3.81ポイント（p=.008）だった。金銭損失率の差は−0.13ポイント（p=.098）で、5%水準では統計的に有意ではなかった。価格施策の方式Aでは金銭損失率が−0.21ポイント（p=.032）で、他2方式は有意ではない。
  operation: 店舗選定は完全無作為ではない。著者は平行トレンドを仮定し、店舗と週の固定効果を入れた差の差分析を行った。価格施策は各方式5店と少ないため、店舗単位のwild cluster bootstrapで検定した。
  limitation: 著者は販売率を店舗・週ごとに「値引販売数÷値引シール貼付件数」で求めた。同じ商品群を追跡した指標ではない。著者は値引きした金額と、廃棄品を通常価格で数えた金額を足して、金銭損失とした。これは営業利益ではない。著者はこの損失を生鮮7部門の売上高で割って損失率を求めた。年換算額は売上仮定を置いた試算である。単一企業・短期の比較であり、効果の独立追試は未実施。
