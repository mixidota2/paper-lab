- id: waste-markdown
  comparison:
    decision: 期限間近商品の値下げ・陳列。店舗×商品の日次記録を店舗×週に集計する隣接事例。
    connection: 通常値引きを保つ集中陳列と動的値付けを比較。補充最適化や予測器自体の比較ではない。
    assessment: 店舗選定は完全無作為ではなくDiDで推定。販売率と金銭損失率は別指標で、営業利益ではない。
    conditions: 既存の値引シール運用を使う。集中陳列は冷蔵売場へ集約し、価格施策と分ける。
  followup:
    checked: '2026-11-18'
    scope: 著者公開稿§3.2–3.3、表4と結果説明を再読。導入・集計単位と指標を確認。SSRN本文と全文同一性は未確認。
  checked: '2026-11-17'
  company: 欧州スーパー（匿名）
  title: 値下げを深くする前に、見つけやすさを変える
  period: current
  domain: retail
  evaluation: observational
  publication_date: '2026-07-03'
  material: ワーキングペーパー（著者公開本文）
  task: 補充量ではなく、期限間近の商品を売り切る隣接判断。
  scope: 133店舗・39週。集中陳列18店、動的値付け3方式は各5店、未介入100店。集中陳列は7週、価格施策は8〜18週。
  forecast: 予測器の詳細は未確認。本カードは需要予測精度を評価しない。
  policy: 集中陳列は通常の30%値引きを保ち、商品を目立つ冷蔵売場へ集約。価格変更とは別の施策。
  result: 集中陳列の値引き商品販売率は+3.81ポイント（p=.008）。金銭損失率は−0.13ポイント（p=.098）で5%水準の有意差なし。方式Aは−0.21ポイント（p=.032）、他2方式は有意ではない。
  operation: 店舗選定は完全無作為ではない。店舗・週固定効果の差の差分析で、平行トレンドを仮定。価格施策は各5店と少ないため、店舗単位のwild cluster bootstrapで検定。
  limitation: 販売率は店舗週の値引販売数÷値引シール貼付件数で、同じ商品群の追跡ではない。金銭損失は値引額と廃棄品の通常売価換算額の合計で、営業利益ではない。損失率の分母は生鮮7部門の売上高。年換算額は売上仮定を置く試算。単一企業・短期の比較であり、効果の独立追試は未実施。
  sources:
  - label: 著者公開本文 §§3.2・4–6、表4・6（2026-07-03公開）
    url: https://www.researchgate.net/publication/408417190_Navigating_the_Waste-Markdown_Tradeoff_A_Field_Experiment_Comparing_Price_and_Information_Interventions
