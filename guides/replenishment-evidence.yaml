cards:
- id: zalando
  comparison:
    decision: ZalandoはEC販売者に商品ごとの補充量を提案する。過去データでの検証はarticle単位で、実装記事はSKU単位で集計している。
    connection: ZalandoはLightGBMが予測した分位点から需要シナリオを作り、モンテカルロ法で拡張(R,s,Q)方策を選ぶ。
    assessment: Zalandoは全提案採用を仮定し、提案どおりに補充した場合と人が判断した場合を計算で比較した。実店舗で利益が増えたかは測っていない。
    conditions: モデルは返品、納期、商品のライフサイクルを扱う。提案を実際に採るかは販売者が決める。
  followup:
    checked: '2026-11-18'
    scope: Labは企業ブログを読み直し、設計、目的関数、過去データでの評価、全提案を採用するという仮定を確認した。実装記事と対応する査読論文は今回取得し直していない。
  checked: '2026-11-02'
  company: Zalando
  title: Zalandoは需要予測からどう補充量を提案するか
  period: current
  domain: retail
  evaluation: backtest
  publication_date: '2026-01-15'
  material: 企業ブログ（効果量の出典）
  task: ZalandoはEC販売者に商品の補充を勧める。返品の発生や納期が一定ではないことも、提案を出すときに考慮する。
  scope: Zalandoは2023-10〜2024-09の過去データを使い、約200万article、800販売者を対象に試算した。実装記事が報告した500万SKUとは集計単位も対象範囲も異なる。
  forecast: Zalandoは2026年の発表で、LightGBMによる分位点予測を説明した。2025年の実装記事にはMLForecastとconformal inferenceの記述がある。モデルは売上と在庫の有無から需要を見積もる。ただし、品切れで売上に表れなかった需要をモデルがどの式で補ったかは、Labでは確認できていない。
  policy: Zalandoは拡張(R,s,Q)方策を使い、12週分をシミュレーションする。費用がある金額以下に収まる割合が75%以上になる最小の金額を求め、それが最も低くなる補充ルールを選ぶ。モデルは返品と納期も確率で扱う。Labは容量や最低発注量（MOQ）の詳しい条件を確認していない。
  result: Zalandoの報告では、人が判断した場合に比べて提案どおりに補充した場合の効果は、流通取引総額（GMV +22.11%）と物流費を引いた後のGMV（+21.95%）に表れた。これは全提案採用の仮想結果で、本番A/Bではない。粗利や会計上の利益が実際に増えたことを示す数字ではない。
  operation: Zalandoは2025-06-30の実装ブログで、500万SKUの週次予測を2時間未満で処理すると報告した。同じ記事は、日ごとの推奨と対話型の推奨も紹介している。Labは提案採用率や導入時の障害の定量評価を確認していない。
  limitation: 対応する査読論文は2025-12-19に出て、2026-01-30に図が訂正された。その本文は未取得なので、Labは効果を企業ブログでの報告として扱う。重点期間より前に出た実装記事は補助資料とする。
  sources:
  - label: 発表・効果量（2026-01-15）
    url: https://engineering.zalando.com/posts/2026/01/publication-replenishment-engine.html
  - label: 実装（2025-06-30、期間外の補助資料）
    url: https://engineering.zalando.com/posts/2025/06/inventory-optimisation-system.html
  - label: 対応論文（本文未取得）
    url: https://doi.org/10.1038/s41598-025-32537-2
- id: jd-orpr
  comparison:
    decision: JDの方式はSKU×配送センターごとに補充を決める。著者は在庫、販売、発注の日次データで評価した。
    connection: 著者は数理最適化で得た判断でニューラル方策を事前学習し、強化学習（RL）で調整した。方策が補助的に出す需要予測は、一つの値を返す点予測である。
    assessment: 著者は実運用で管理者が選んだ対象を傾向スコアでマッチングし、差の差分析（DiD）でも比較した。対象を無作為に割り付けた実験ではない。
    conditions: 方策は最低発注量（MOQ）、発注周期、納期を考慮する。現場で欠品しなければ得られたはずの販売をもとに、損失を評価したわけではない。
  followup:
    checked: '2026-11-18'
    scope: Labは著者HTML v2の§5と表3・4を読み直し、対象単位、比較群の選び方、指標、比較方法を確認した。付録はすべて読み直したわけではない。
  checked: '2026-11-02'
  company: JD ORPR
  title: JDは数理最適化で得た発注判断を学び、強化学習で調整する
  period: current
  domain: retail
  evaluation: observational
  publication_date: '2025-12-22'
  material: プレプリント（v2：2026-01-06）
  task: JDの方式は商品×配送センター（DC）の補充を決める。著者は数理最適化で得た判断（OR教師）をニューラル方策に学ばせ、強化学習手法のRLOOで調整した。
  scope: 2025年9月の本番比較は331 SKU、計3,899 SKU–DCを対象とした。管理者が対象を選び、著者は傾向スコアマッチング（PSM）で比較した。無作為化ではない。
  forecast: 方策は需要の補助出力として一つの値を予測する。欠品で観測できなかった需要をどう補正したかは未確認。
  policy: 著者はOR教師を使って方策を教師ありで事前学習し、その後にRLで調整した。方策はMOQ、発注周期、納期を扱う。新しい制約を任意に足しても満たせるという保証は未確認。
  result: 著者の単純比較では在庫回転日数が−5.27日、在庫有率が+2.29%（単位は原文表記）、保有費が−29.95%だった。追加の差の差分析（DiD）では在庫回転日数が−4.07日、在庫有率が+0.47%（同）で、保有費の前年比増加率の差が−18.35パーセントポイントだった。二つの比較は別の推定値を出している。率は原文の表記を保ち、相対的な変化率やポイントに換算しない。
  operation: 著者は、約93万パラメータのモデルをGPU1基で事前学習するのに1.5–2時間、強化学習に5–6時間かかったと報告した。推論費と実運用で人が修正した割合は未確認。
  limitation: 欠品がなければ売れたはずの数量から求める現場の損失（反実仮想欠品損失）は評価外だった。選定とマッチングをしても、観測していない要因が結果に影響した可能性は残る。無作為化A/Bと同じ意味での因果効果とは扱わない。
  sources:
  - label: 著者本文 §§3–5（v2）
    url: https://arxiv.org/html/2512.19001v2
- id: amazon-rme
  comparison:
    decision: 著者は設備の補修部品をどの拠点に置くかを決める。店舗に並べる商品の補充量は扱わない。
    connection: 著者はグラフニューラルネットワーク（GNN）で候補群の評価値を近似し、探索と集合分割を経て確率在庫MILPで評価し直す。需要予測器は未確認。
    assessment: 著者は企業データをモデルに入れ、節約額を計算して比較した。導入後に実際の支出がいくら減ったかを測ったものではない。
    conditions: 著者の評価は補修部品の拠点ネットワークと下位の在庫モデルを前提とする。実際の導入範囲は未確認。
  followup:
    checked: '2026-11-18'
    scope: Labは別研究の著者HTML v1の§6と表6・8を読み直した。指定DOIの本文は今回も取得できず、別研究の確認をもって調査完了とはしない。
  checked: '2026-11-02'
  company: Amazon RME共著
  title: Amazon RMEの共著研究は補修部品を置く拠点を決める
  period: current
  domain: maintenance
  evaluation: model
  publication_date: '2026-09-11'
  material: プレプリント（指定DOIとは別研究）
  task: 著者は物流拠点で設備の保全に使う補修部品を、どの拠点に置くかを検討した。店舗販売商品の補充とは対象が異なる。
  scope: 著者は企業ケースとして246物流拠点を扱った。この数字は店舗で顧客に販売するSKUの数ではない。
  forecast: 著者は最終案を確率在庫モデルで評価した。需要の予測器、予測が点・分位・分布のどれを返すか、欠品で見えなくなった需要の補正方法は未確認。
  policy: 著者はGNNで候補の評価値を近似し、候補を探索してから集合分割（set partitioning）を解く。最後に確率在庫MILPで最終案を評価する。納期・容量などの詳しい条件は、この要約では確認していない。
  result: 著者の評価では6反復で、比較法に対してモデル上の節約額が30.5%改善した。実際の総費用30.5%削減ではない。約99.8%というサービスの指標は、需要を満たす週の割合をシナリオ間で平均した値で、需要数量のうち満たせた割合（fill rate）とは異なる。
  operation: 著者は企業ケースをモデルで評価した。この評価は本番A/Bではない。実際にどこまで導入したか、導入後にいくら節約したか、計算にかかった時間は未確認。
  limitation: Labは指定DOI 10.1080/00207543.2026.2655026の全文を取得できていない。このカードには関連する別研究を載せている。指定原典の読了・同一性を主張しない。
  sources:
  - label: 読解対象の著者本文（別研究）
    url: https://arxiv.org/html/2609.12524v1
  - label: 指定DOI（全文未取得・上の本文と同一とは扱わない）
    url: https://doi.org/10.1080/00207543.2026.2655026
- id: alibaba
  comparison:
    decision: Alibabaの方式はSKUと倉庫の組み合わせごとに補充量を決める。販売用の在庫に加え、注文に対する供給者の応答も扱う。
    connection: Alibabaは供給者がいつ何割を納品するかを学習し、そのモデルと強化学習の補充方策を組み合わせる。需要予測がどの形式で値を返すかは未確認。
    assessment: 著者は実運用で自動発注と人手発注の対象をマッチングし、結果を比べた。無作為に割り付けた場合の因果効果とは扱わない。
    conditions: 著者は当初、回転の遅い商品を主な対象にし、販促祭の準備に入る前に実験を止めた。この結果をすべての商品に当てはめない。
  followup:
    checked: '2026-11-18'
    scope: Labは著者公開本文のImplementation ResultsとMARL比較を読み直し、SKU×倉庫という集計単位、マッチングの方法、期間、報告値を確認した。全文を読み直したわけではない。
  checked: '2026-11-02'
  company: Alibaba
  title: Alibabaは供給者の応答も学習して補充量を決める
  period: legacy
  domain: retail
  evaluation: observational
  publication_date: '2023-09-26'
  material: IJAA査読論文／著者公開本文
  task: AlibabaはTmall MartとFreshippoの自社在庫を補充する方式を開発した。供給者が発注にどう応じるかを教師あり学習でモデル化し、補充の判断を深層強化学習（DRL）で学ばせた。
  scope: 著者は2021年7〜11月の実運用で、MARLの対象となった40,000 SKU×倉庫の組み合わせをマッチングで比較した。当初は低回転の商品が中心で、実験は販促祭前に停止した。
  forecast: Alibabaの方式は供給者の応答モデルを使う。需要予測の出力形式と、欠品で観測できない需要の補正は未確認。
  policy: Alibabaは供給者の応答モデルと補充のRLを組み合わせた。Labは納期・発注制約の詳しい内容や計算時間を確認していない。
  result: 著者は人手による発注と比べて在庫日数が−37.45%だったと報告した。欠品については原文が「1.3% reduction」と記している。Labはこれが相対%かパーセントポイントか断定しない。
  operation: 著者は実運用での比較を報告したが、無作為化A/Bではない。今も使っているか、対象全体にどこまで広げたかは未確認。
  limitation: 著者は対象を選んで比較し、販促期間を含めなかったため、結果は小売全体に一般化しない。Labは重点期間外の比較事例として載せる。
  sources:
  - label: 出版社・刊行情報
    url: https://doi.org/10.1287/inte.2023.1160
  - label: 著者公開本文 pp.372–376
    url: https://www.researchgate.net/publication/374212093_AI_vs_Human_Buyers_A_Study_of_Alibaba%27s_Inventory_Replenishment_System
- id: jd-e2e
  comparison:
    decision: JDの方式は日ごとの在庫・販売と、注文日・到着日を使い、SKU×配送センターの発注量を決める。
    connection: モデルは需要RNNや納期MLPなどの出力を使って補充量を直接決める。事後に動的計画法（DP）で求めた解を教師とするため、教師ありE2EでありRLではない。
    assessment: 著者は自主参加で対象を集め、傾向スコアでマッチングして現場を比較した。期間内の費用差と差の差分析（DiD）は別々の推定値を出す。
    conditions: 理論上のモデルは、不足分をすべて後で渡し、注文の到着順が保たれると仮定する。本番の条件とは異なる。今も運用しているか、計算費はいくらかは未確認。
  followup:
    checked: '2026-11-18'
    scope: Labは著者稿の§5.2–5.3と表2–4を読み直し、群の選び方、日次データ、費用の比較方法を確認した。出版社の最終版とは全文を照合していない。
  checked: '2026-11-02'
  company: JD E2E
  title: JDは結果が分かった後の最適解を教師にして補充量を学ぶ
  period: legacy
  domain: retail
  evaluation: observational
  publication_date: '2022-12-13'
  material: Management Science（2023年2月号）／著者稿
  task: JDのモデルは、需要を扱うRNNと納期を扱うMLPなどを使い、商品×配送センター（DC）の補充量を直接出す。著者は実際の結果が分かった後に動的計画法で最適な補充量を求め、その値を正解としてモデルを学習させた。この方法は教師ありE2Eであり、強化学習（RL）ではない。
  scope: 著者稿では2020-03-30〜04-30の9,308 SKU、12 DCを比較した。著者は自主参加で集まった対象をマッチングした。無作為化ではない。
  forecast: 補充モデルは需要RNNと納期MLPを含む。需要予測が点と分布のどちらを返すか、欠品で観測できない需要をどう補正するかは、この要約では未確認。
  policy: 著者は事後にDPで求めた補充量を正解ラベルにし、モデルに補充判断を直接学ばせた。理論モデルは完全バックオーダー（不足分をすべて後で渡す）と到着順維持を仮定する。この仮定は本番条件と異なる。
  result: 著者は期間内の比較で総費用−40.4%を報告した。差の差分析（DiD）の結果は別に−637.24評価費用単位であり、会計利益ではない。Labは期間内比較とDiDの結果を同じ効果量に換算しない。
  operation: 著者は現場での比較を報告した。Labは教師データの生成、学習、推論にかかる計算費と、現在も運用が続いているかを確認していない。
  limitation: 出版社の最終版との全文照合は未完である。理論モデルが置いた条件が本番と完全に一致するとは扱わない。重点期間外の比較事例として載せる。
  sources:
  - label: 刊行情報
    url: https://doi.org/10.1287/mnsc.2022.4564
  - label: 著者稿 §§3,5
    url: https://alicemengqi.github.io/site/files/End_to_End_revision3-10.pdf
- id: fengyi-override
  comparison:
    decision: 著者は自販機の補充担当者が推奨量を減らせる範囲を比較した。担当者×機械×補充日のデータを使って評価した。
    connection: 著者は既存の予測と補充方式を変えず、担当者が減量できるSKU数だけを変えた。予測器どうしの比較ではない。
    assessment: 著者は担当者を無作為に割り付け、差の差分析（DiD）を行った。販売に統計的な有意差が出なかったことは同等性を証明しない。利益への効果は調べていない。
    conditions: 著者は担当者が減らせる品目数に機械ごとの上限を設けた。補充量の増加や倉庫欠品などの例外は認めており、推奨量の変更を一律に禁じたわけではない。
  followup:
    checked: '2026-11-18'
    scope: Labは著者HTML v1の§3.3–4と表1を読み直し、割付単位、データの集計方法、固定効果、報告値を確認した。§6の個別化シミュレーションは今回読み直していない。
  checked: '2026-11-17'
  company: Fengyi Technology
  title: Fengyiの実験は補充担当者が減らせる品目数を変えた
  period: current
  domain: retail
  evaluation: randomized
  publication_date: '2026-07-01'
  material: プレプリント、本文§§3–4・6を確認
  task: 著者は、自販機の補充担当者がシステムの推奨量をどの範囲まで減らせるようにするかを検証した。
  scope: 著者は2023-05-04から46日間、担当者553人を無作為に分けた。減量を禁じた群は221人、1台につき2 SKUまで減量できる群は223人、減量に上限がない群は109人だった。推奨量からの増量や、倉庫欠品などの例外は全群で認めた。
  forecast: 著者は既存の予測と、予測を受けて補充量を決める方式を維持した。予測器の詳細は未確認。
  policy: 担当者はどの品目の補充量を減らすかを選ぶ。著者は事前の試行をもとに、制限群の上限を機械ごとに2品目とした。
  result: 禁止群に比べ、制限群は在庫が約1.28%減り、販売数量には統計的な有意差が出なかった。無制限群は在庫が約1.95%、販売数量が約1.19%減った。いずれも補充対象SKUについて補充間隔内で平均した値を使う。率は著者がlog(数量+1)の係数を百分率として説明した値である。
  operation: 著者は差の差分析で、担当者ごとの差と、同じ都市の同じ日に共通する差を固定効果で考慮した。標準誤差は担当者単位で求めた。著者は実験前に観測した条件が群間で均衡するまで、無作為な割り付けをやり直した（再無作為化）。
  limitation: 販売数量に有意差が出なかったことは、販売減を否定する同等性証明ではない。利益改善は未検証。個別化方策で販売確率が制限群比で+9.1ポイントだったのはシミュレーションの結果であり、現場実験の結果ではない。
  sources:
  - label: 著者本文・表1（2026-07-01）
    url: https://arxiv.org/html/2607.00420v1
- id: waste-markdown
  comparison:
    decision: この関連事例で店舗が変えるのは、期限が近い商品の値下げ方法や陳列場所である。著者は店舗×商品の日次記録を店舗×週にまとめて比べた。
    connection: 著者は通常どおり値引きして商品を集めて陳列する方法と、価格を動的に変える方法を比べた。補充の最適化や予測器どうしを比べたわけではない。
    assessment: 著者は店舗を完全に無作為には選んでおらず、差の差分析（DiD）で効果を推定した。販売率と金銭損失率は別の指標で、どちらも営業利益を測らない。
    conditions: 店舗は既存の値引きシール運用を使う。集中陳列では商品を冷蔵売場に集め、価格を変える施策とは分けて評価した。
