question: 同じ需要が続いても、輸送容量が違うと未充足の注文はどれだけ残るか
summary: ISOMORPHの著者は、13拠点を結ぶ人工の物流網で、需要・未充足の注文・需要充足率・輸送路の利用率を予測するモデルを比較しました。Labでは需要を変えずに輸送容量だけを変え、翌日へ持ち越す注文を比べます。どちらの比較も、実店舗に最適な補充ルールを決めるものではありません。
