  scope: 出版社のページで書誌を確認しました。Labの計算は、式と図6について提供された照合記録を参照しています。原著の実験は再現していません。
core_idea:
  author_claim: |-
    著者は商品を何列並べるかによる需要の変化と、外した商品から移る需要を計算に入れました。商品ごとの必要な在庫を棚に置けるよう、扱う商品と面数を一緒に決めます。
  research_bot_interpretation: |-
    Labでは代替需要を足したあとに、商品ごとの棚在庫条件と棚幅の条件を確認しました。両方を満たす棚割りの中から、利益が最も高い案を選びます。棚在庫に合わせて需要を切り詰めた場合の利益は、元の需要を使った計算と分けます。
sections:
  overview: |-
    HübnerとKuhnは、店がどの商品を扱い、商品ごとに棚の正面を何列使うかを、補充の負担まで含めて決める方法を提案しました。モデルでは、商品の棚を広げると、目に入る機会と売場に置ける在庫が増えると考えます。商品を外したときは、その商品を買うはずだった人の一部が別の商品を選ぶと仮定します。著者はこの買い替えと、配送センターからの定期補充、バックヤードからの追加補充を一緒に扱いました。

    著者は食品小売店の飲料データを使い、扱っていない商品の需要と買い替えの割合には仮の値を置きました。この条件では、買い替えを最初から計画に入れた場合、買い替えを考えずに棚割りを決め、あとから需要と棚割りを調整する方式より、計算上の利益が最大14%高くなりました。棚を実際に変更して店舗の利益が14%増えたわけではありません。論文は2023年にオンラインで公開され、2024年の巻号に収録されました。
  problem: |-
    ### 商品を外すと、残した商品の棚に必要な在庫が変わる

    店がAを扱わなくなると、Aを買うはずだった人の一部は、代わりにBを買うかもしれません。店はBの棚に、もともとBを買う人の分だけでなく、Aから移る分も用意する必要があります。次の定期補充までに売れる数を見込まずに棚割りを決めると、店員がバックヤードから追加で棚に運ぶ回数が増えることがあります。

    著者は定期補充の間隔を固定し、次の定期補充までに見込む需要のうち、商品ごとに最低何割を棚に置くか決めました。例えば、Bの需要が5個で最低割合が0.8なら、Bの棚には4個以上必要です。著者が条件にしたのはこの個数です。補充する回数や作業費を直接計算したわけではありません。

    ### 売場での利益ではなく、同じ条件で計算した利益を比べた

    著者が使ったのは、食品小売店の飲料販売や棚のデータです。取り扱わない商品の需要や、他の商品へ移る割合、商品ごとの粗利には仮の値を置きました。買い替えを最初から計算に入れる方式と、買い替えを考えずに棚割りを決めてから調整する方式を比べたところ、最初から入れた方式の利益が計算上は最大14%高くなりました。実際の売場で棚を入れ替え、利益が14%増えたという結果ではありません。
  method: method.md
  why_it_might_work: |-
    店が扱う商品を変えると、買い替え先として残る商品も変わります。扱う商品の組み合わせごとに需要を計算すれば、その需要を見込むとどの商品に何面必要かを判断できます。
  evidence: |-
    一次資料：[原論文](https://link.springer.com/article/10.1007/s10696-023-09492-z)。著者は一つの売場の飲料データを使い、扱わない商品の需要、代替割合、粗利には仮の値を置きました。買い替えを先に織り込んだ案の計算上の利益は、買い替えなしで棚割りを決めたあとに調整する案と比べて最大14%高くなりました（表2）。店頭で売場を変更した結果ではありません。

    Labは2026年10月17日の出版社HTML第2〜5節の確認記録と、詳細な式・図6の照合仕様を使いました。すべての式を独立に照合したわけではありません。以下に出てくる利益24、16、1は、Labが作った別々の入力での結果です。
  executable_understanding: experiment.md
  results: |-
    ### 代替を考えずに決めた棚割りは、需要を足すと条件を満たさないことがある

    3商品の例では、別の商品から移った需要をあとから足すと、基準案の利益は21と計算されます。しかし、その案では商品ごとの最低棚在庫を確保できません。すべての条件を満たす案の中で、最も高い利益は24でした。棚在庫が足りない案の21は、条件を満たした計画の成績としては扱いません。

    別の2商品の例では、基準案も最も利益が高い案も、棚在庫の条件を満たします。基準案の利益は10で、最も良い案は16です。差の6を16で割ると37.5%になり、基準案の利益がどれだけ低いかを表します。実店舗で利益が37.5%増えたという意味ではありません。

    需要の一部を売上に含めないと決めれば、別の利益が出ます。ただし、需要を10に切り詰めて計算した利益20を、切り詰めずに条件を守った最大利益1と比べて、元の問題にもっと良い案があったとは言えません。
  what_we_verified: validation.md
  what_we_did_not_verify: |-
    Labでは原著の近似手順や非公開データを再現していません。店舗で欠品率や人件費がどう変わるか、需要をどの程度正確に予測できるかも調べていません。
  implementation: implementation.md
  mapping: mapping.md
