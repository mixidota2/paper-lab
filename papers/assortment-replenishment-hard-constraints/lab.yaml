question: 商品を棚から外したとき、買い替え先の棚には次の定期補充まで何個必要か
summary: HübnerとKuhnは、扱う商品とフェイス数を、買い替えによる需要と定期補充までの在庫を考えて一緒に決めました。実店舗の飲料データを使った数値実験では、買い替えを先に考慮した案の利益が、後から調整した案より計算上は最大14%高くなりました。
source_review:
  checked: '2026-10-16'
  url: https://link.springer.com/article/10.1007/s10696-023-09492-z
  scope: 出版社が公開した本文の第3〜5節、式(1)〜(9)、表2と図6・図9の説明を参照しました。店舗で棚を変更した実験ではありません。Labは原著の近似法を再現していません。
core_idea:
  author_claim: 著者らは、面数によって需要と棚在庫が変わり、商品を外すと需要の一部が残した商品へ移ると考えました。棚全体の幅と商品ごとの在庫を確かめながら、何を扱い、各商品を何面置くかを一緒に決めました。
  research_bot_interpretation: Labは、外した商品から移る需要を足してから、商品ごとの棚在庫条件と棚幅の条件を確認します。棚に収めるために需要を減らす場合は、需要を変えない計算と利益を分けて扱います。
sections:
  overview: |-
    HübnerとKuhnは、食品小売店が扱う商品と、各商品を棚の正面に何列並べるかを、補充の条件に合わせて決める方法を提案しました。著者らは、商品を外すと、一部の客は残った別の商品を買うと仮定しました。棚割りの候補ごとに、買い替えで増える需要も計算し、次の定期補充までの需要のうち、指定した割合を満たせる個数を、その商品の棚に置けるかを確かめました。

    著者らは、実店舗の飲料データを使い、買い替えの割合や、扱っていない商品の需要、商品ごとの粗利には仮の値を置きました。買い替えを最初から計算に入れた棚割りは、買い替えを考えずに棚割りを決めてから調整した方法に比べ、計算上の利益が最大14%高くなりました。この比較では実際に棚を変更しておらず、店舗の利益が14%増えたわけではありません。補充作業への影響も測っていません。
  problem: |-
    店が商品Aを扱わなくなると、Aを買っていた人の一部は、代わりにBを選ぶかもしれません。Bの棚に以前と同じ数しか置かなければ、次の定期補充より前に品切れし、店員がバックヤードから追加で運ぶ必要が出ることがあります。

    著者らは、次の定期補充までに見込む需要のうち、少なくとも何割を補充直後の棚に置くかを商品ごとに決めました。たとえばBの需要が5個で、最低割合が80%なら、補充直後の棚に4個以上必要です。この方法が直接決めるのは商品の棚在庫と面数です。補充の回数や作業費は直接計算しません。
  method: method.md
  why_it_might_work: 商品を外したときに買い替え先へ移る需要を、棚割りを決める前から計算すれば、選んだ商品に必要な面数を見積もれます。面数を増やせば置ける在庫は増えますが、ほかの商品が使える棚幅は減ります。買い替えが増えた商品に1面を足すのか、品揃えを変えるのかを、同じ制約の中で比べられます。
  evidence: |-
    ### 実店舗の販売データを使い、棚割り案の利益を計算した

    著者らは、食品小売店の飲料売場から、商品ごとの年間販売数と商品幅を取得しました。販売数を補充の回数で割り、次の補充までの需要として扱いました。扱っていない商品の需要、他の商品へ買い替える割合、商品ごとの粗利は、実店舗から得た値ではありません。著者らは一部を先行研究に基づいて設定しました。

    表2では、50商品を候補に、買い替えの需要を初めから考える方法と、棚割りを決めた後に反映する方法を比べました。一方は初めから買い替えを考え、棚在庫と棚幅の条件を守る案を求めます。もう一方は、買い替えを入れずに棚割りを決めてから、実際に見込む買い替え分を足し、棚在庫と棚幅の条件を守れるよう面数を調整します。最初から買い替えを入れた方法は、あとで調整した方法に比べ、計算上の利益が最大14%高くなりました。

    ### 棚在庫の下限を外すと、補充まで持たない商品が増えた

    論文の第5.3節では、次の定期補充までに見込む需要を棚だけで全て満たす条件と、棚在庫の下限を設けない条件も比べました。下限を外すと、計算上の利益は1〜8%高くなりました。その一方で、補充までの需要を棚在庫だけでは満たせない商品は67〜87%ありました。利益の計算には追加補充の作業費が入っていません。著者らは、実際の売場で作業時間や費用がどれだけ増えたかを測っていません。

    一次資料：[Hübner・Kuhn、原論文の第5節・表2・図9](https://link.springer.com/article/10.1007/s10696-023-09492-z)。
  executable_understanding: experiment.md
  results: |-
    ### 棚在庫が足りない案と、条件を満たす案の利益を分ける

    T1の3商品では、代替を考えずに選んだ案へ買い替え需要を戻すと、利益は21と計算されます。しかし、必要な数をAの棚に置けません。棚幅と商品別の在庫の条件をどちらも守る別の案では、利益24が最大でした。条件を満たさない案の21は、条件を満たした案と順位を比べません。

    T2の2商品では、基準案も最適案も条件を満たします。基準案の利益が10、最適案が16で、基準案は最適案より37.5%低くなりました。これは差の6を最適案の16で割った値です。実店舗の利益が37.5%増えたことを示しません。

    T3では、需要を10個に減らせば利益20になりますが、元の需要を使い条件を満たす案の最大利益は1でした。需要の前提が異なるため、利益20の案を元の問題の解にはできません。
  what_we_verified: validation.md
  what_we_did_not_verify: Labは、原著の近似手順と非公開データを使った計算を再現していません。店舗で棚を変えたときの欠品率、補充にかかる人件費、需要推定の精度も測っていません。
  implementation: implementation.md
  mapping: mapping.md
teaching_figures:
- kind: equations
  id: inventory-condition
  title: 各商品の棚に、次の補充までに必要な個数を置けるか
  after: method
  locator: 式(6)、(9)
  rationale: 棚在庫は、商品ごとに必要量を満たすかを判定します。別の商品の棚の余りは使いません。
  caption: fは、次の定期補充までに見込む需要のうち、補充直後の棚在庫で賄う最低割合です。欠品しない確率ではありません。
  source: https://link.springer.com/article/10.1007/s10696-023-09492-z
  steps:
  - name: 棚に置ける個数を求める
    formula: qᵢ = gᵢ kᵢ
    explanation: 1面に入る個数gに、横に並べる列数kを掛けると、その商品の棚に入る個数が分かります。
    formula_mathml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mi>q</mi><mi>i</mi></msub><mo>=</mo><mrow><msub><mi>g</mi><mi>i</mi></msub><msub><mi>k</mi><mi>i</mi></msub></mrow></mrow></math>
  - name: 必要な個数を入れられるか確かめる
    formula: qᵢ ≥ fᵢ Dᵢ
    explanation: 商品自身の需要と、外した商品から移る需要を足してDを求めます。棚に置く必要がある個数はDに最低割合fを掛けた値です。
    formula_mathml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mi>q</mi><mi>i</mi></msub><mo>≥</mo><msub><mi>f</mi><mi>i</mi></msub><msub><mi>D</mi><mi>i</mi></msub></mrow></math>
- kind: logic
  id: one-step
  title: 買い替え先も外すと、そこへ移った分は売上に入らない
  after: method
  locator: 式(2)〜(4)
  rationale: 買い替え先を扱わない場合も、モデルはその分を別の商品に振り分け直しません。
  caption: T4では、Aを外すと、8個分の需要が買い替えの割り振りの対象になります。4個分はB、2.4個分はCに向かい、1.6個分はどちらにも向かいません。
  source: https://link.springer.com/article/10.1007/s10696-023-09492-z
  rows:
  - label: Aを扱わない場合
    nodes:
    - title: Bを扱う
      text: Bの商品自身の需要は1個です。Aから向かった4個分を加えるので、Bの需要は5個になります。
    - title: Cも扱わない
      text: Cへ向かった2.4個分を売上に加えません。Bに送り直すこともありません。
