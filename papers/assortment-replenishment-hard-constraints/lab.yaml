question: 商品を減らした後の需要を棚在庫で受け止められるか
summary: ある商品を棚から外すと、その商品の需要の一部が残した商品に移ることがある。この代替需要を考えずに採用品を決めると、残した商品の棚在庫が足りなくなりうる。補充間隔を固定した合成例で、商品ごとに必要な棚在庫を確かめる。
source_review:
  checked: '2026-10-16'
  url: https://link.springer.com/article/10.1007/s10696-023-09492-z
  scope: 出版社HTMLの書誌を確認。詳細式・図6は提供された原典照合仕様を基に実装。原著実験の再現ではない。
core_idea:
  author_claim: 商品を横に並べる面数で需要が変わることと、採用しなかった商品から需要が移ることを計算に入れる。商品ごとに必要な棚在庫を確保できるよう、採用品と面数を選ぶ。
  research_bot_interpretation: 元の問題では、まず代替需要を足しても商品ごとの棚在庫条件と棚幅の条件を満たすか確かめ、条件を満たす案から利益が最大の案を選ぶ。需要を減らして在庫に収めた場合の利益は、元の需要を使う問題の最適値とは別に扱う。
sections:
  overview: |-
    HübnerとKuhnは、店がどの商品を扱い、商品ごとに棚の正面を何列使うかを、補充の負担まで含めて決める方法を提案しました。モデルでは、商品の棚を広げると、目に入る機会と売場に置ける在庫が増えると考えます。商品を外したときは、その商品を買うはずだった人の一部が別の商品を選ぶと仮定します。著者はこの買い替えと、配送センターからの定期補充、バックヤードからの追加補充を一緒に扱いました。

    著者は食品小売店の飲料データを使い、扱っていない商品の需要と買い替えの割合には仮の値を置きました。この条件では、買い替えを最初から計画に入れた場合、買い替えを考えずに棚割りを決め、あとから需要と棚割りを調整する方式より、計算上の利益が最大14%高くなりました。棚を実際に変更して店舗の利益が14%増えたわけではありません。論文は2023年にオンラインで公開され、2024年の巻号に収録されました。
  problem: 需要が移った先の商品に、必要な棚在庫を確保できるか。
  method: method.md
  why_it_might_work: どの商品を残すかで需要の移り先が変わる。採用品の組み合わせごとに需要を計算し直せば、その需要に対して棚在庫を確保できる面数も一緒に選べる。
  evidence: '一次資料：[原論文](https://link.springer.com/article/10.1007/s10696-023-09492-z)。


    原論文は単一カテゴリの実データを基に、未採用品の需要や代替率には生成した値を用いて評価しています。店舗導入の効果ではありません。2026年10月17日の追加調査でHTML本文§2〜5の関連箇所を確認した記録に基づきます。教材の詳細式・図6は提供された原典照合仕様に基づくため、全式の独立再照合が完了したとは扱いません。以下の24、16、1などは独自の合成入力の計算値です。'
  executable_understanding: experiment.md
  results: 3商品例では、代替需要を考えずに選んだ案は棚在庫の条件を満たしません。需要移転を含めて採用品と面数を選び直すと、利益は24になります。別の2商品例では、基準案も最適案も条件を満たします。基準案の利益は最適案より37.5%低くなります。この割合は、利益の差を最適案の利益で割った値です。需要を切り詰めて計算した利益20は、元の需要を使う問題での最適利益1とは比較できません。
  what_we_verified: validation.md
  what_we_did_not_verify: 実ブラウザー、原著の近似実装、非公開実データ、実店舗の人件費・欠品率・需要推定精度は未検証。
  implementation: implementation.md
  mapping: mapping.md
teaching_figures:
- kind: equations
  id: inventory-condition
  title: 必要在庫を商品ごとに確かめる
  after: method
  locator: 式(6)、(9)
  rationale: 別の商品の在庫が余っていても、対象商品の在庫不足は解消しない。
  caption: fは、固定した補充周期の需要のうち、棚在庫として確保する最低割合。欠品しない確率ではない。
  source: https://link.springer.com/article/10.1007/s10696-023-09492-z
  steps:
  - name: 棚在庫
    formula: qᵢ = gᵢ kᵢ
    explanation: gは1面当たりの個数、kは横の面数。
    formula_mathml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mi>q</mi><mi>i</mi></msub><mo>=</mo><mrow><msub><mi>g</mi><mi>i</mi></msub><msub><mi>k</mi><mi>i</mi></msub></mrow></mrow></math>
  - name: 必要量
    formula: qᵢ ≥ fᵢ Dᵢ
    explanation: 未採用品から移る分を含む総需要Dに最低棚在庫比率fを掛け、商品ごとの必要量を求める。
    formula_mathml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mi>q</mi><mi>i</mi></msub><mo>≥</mo><msub><mi>f</mi><mi>i</mi></msub><msub><mi>D</mi><mi>i</mi></msub></mrow></math>
- kind: logic
  id: one-step
  title: 未採用先への枝は再配分しない
  after: method
  locator: 式(2)〜(4)
  rationale: 代替先の採否が変わっても、元商品から各商品へ向かう需要の割合は変えない。
  caption: 合成例T4。Aの潜在需要8のうちBへ4、Cへ2.4、未配分1.6。
  source: https://link.springer.com/article/10.1007/s10696-023-09492-z
  rows:
  - label: A未採用
    nodes:
    - title: B採用
      text: B自身の需要1個に、Aから移る4個を加え、総需要を5個とする。
    - title: C未採用
      text: Cへ向かう需要2.4個は売上に含めず、Bへ配り直しません。
