question: |-
  商品を外して需要が移ると、残した商品には何面必要か
summary: |-
  商品を外すと、その商品を買うはずだった人の一部が、残した商品を選ぶことがあります。移ってくる需要を見込まないと、残した商品の棚在庫が足りなくなることがあります。補充間隔を固定した例で、どの商品を何面置けば必要な在庫を棚に入れられるかを確かめます。
