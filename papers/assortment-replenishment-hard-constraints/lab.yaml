question: 商品を減らした後の需要を棚在庫で受け止められるか
summary: 代替需要を考えずに採用品を決めると、残した商品の棚在庫が足りなくなることがある。固定補充周期の合成例で、商品別の条件を確かめる。
source_review:
  checked: '2026-10-16'
  url: https://link.springer.com/article/10.1007/s10696-023-09492-z
  scope: 出版社HTMLの書誌を確認。詳細式・図6は提供された原典照合仕様を基に実装。原著実験の再現ではない。
core_idea:
  author_claim: 需要の面数依存と未採用品からの代替需要を含め、商品別の棚在庫条件を満たす採用品と面数を選ぶ。
  research_bot_interpretation: 利益を比べる前に元需要で実行可能性を確かめる。需要を切り詰めた評価を元の制約問題の最適値と混ぜない。
sections:
  overview: オンライン公開2023年、巻号2024年の既刊論文。独自の小規模な説明用実験として扱う。
  problem: 需要が移った先の商品に、必要な棚在庫を確保できるか。
  method: method.md
  why_it_might_work: 採用品を変えるたびに需要を再計算すると、需要増を受け止めるための面数も同時に選べる。
  evidence: 一次資料の式と対応表を示す。以下の24、16、1などは独自の合成入力の計算値で、原論文の利益改善率ではない。
  executable_understanding: '<iframe title="品揃えと棚在庫の実験" src="../downloads/assortment-replenishment-hard-constraints/interactive.html"
    style="width:100%;height:1700px;border:1px solid #abc"></iframe>

    <p><a href="../downloads/assortment-replenishment-hard-constraints/interactive.html">実験を別ページで開く</a></p>'
  results: 3商品例では、代替需要を考えずに選んだ案は棚在庫の条件を満たしません。需要移転を含めて採用品と面数を選び直すと、利益は24になります。別の2商品例では両案が条件を満たし、基準案の利益は最適利益より37.5%低くなります。需要を切り詰めた例の利益20は、元の条件での最適利益1とは比較できません。
  what_we_verified: T1〜T4の手計算と独立計算を照合した。詳細な入力と候補、同率解はresults.jsonへ保存。
  what_we_did_not_verify: 実ブラウザー、原著の近似実装、非公開実データ、実店舗の人件費・欠品率・需要推定精度は未検証。
  implementation: Pythonのrun.pyは標準ライブラリのみ。[model.js](../downloads/assortment-replenishment-hard-constraints/model.js)と[interactive.js](../downloads/assortment-replenishment-hard-constraints/interactive.js)が画面の計算・描画を行う。
  mapping: mapping.md
teaching_figures:
- kind: equations
  id: inventory-condition
  title: 必要在庫を商品ごとに確かめる
  after: method
  locator: 式(6)、(9)
  rationale: 合計在庫では不足を判定できない。
  caption: fは欠品しない確率ではなく、固定周期需要の最低棚在庫比率。
  source: https://link.springer.com/article/10.1007/s10696-023-09492-z
  steps:
  - name: 棚在庫
    formula: qᵢ = gᵢ kᵢ
    explanation: gは1面当たりの個数、kは横の面数。
  - name: 必要量
    formula: qᵢ ≥ fᵢ Dᵢ
    explanation: 流入を含む総需要Dから、商品ごとの必要量を求める。
- kind: logic
  id: one-step
  title: 未採用先への枝は再配分しない
  after: method
  locator: 式(2)〜(4)
  rationale: 固定移転率を保つ。
  caption: 合成例T4。Aの潜在需要8のうちBへ4、Cへ2.4、未配分1.6。
  source: https://link.springer.com/article/10.1007/s10696-023-09492-z
  rows:
  - label: A未採用
    nodes:
    - title: B採用
      text: 4を回収。Bの自力需要1に足して5。
    - title: C未採用
      text: 2.4は失われ、Bへ再転送しない。
