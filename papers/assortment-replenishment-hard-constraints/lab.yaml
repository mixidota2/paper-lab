- kind: equations
  id: inventory-condition
  title: 必要在庫を商品ごとに確かめる
  after: method
  locator: 式(6)、(9)
  rationale: ある商品の棚に在庫が余っていても、別の商品の不足を補ったとは判定しません。
  caption: fは、次の定期補充までの需要のうち、周期の初めに棚へ置く最低割合です。欠品しない確率ではありません。
  source: https://link.springer.com/article/10.1007/s10696-023-09492-z
  steps:
  - name: 棚在庫
    formula: qᵢ = gᵢ kᵢ
    explanation: gは1面に入る個数、kは横に並べる面数です。掛けると商品ごとの棚在庫が分かります。
    formula_mathml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mi>q</mi><mi>i</mi></msub><mo>=</mo><mrow><msub><mi>g</mi><mi>i</mi></msub><msub><mi>k</mi><mi>i</mi></msub></mrow></mrow></math>
  - name: 必要量
    formula: qᵢ ≥ fᵢ Dᵢ
    explanation: ある商品の総需要Dには、外した商品から移ってくる分も含めます。総需要に最低割合fを掛けると、棚へ置く最低の個数が分かります。
    formula_mathml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mi>q</mi><mi>i</mi></msub><mo>≥</mo><msub><mi>f</mi><mi>i</mi></msub><msub><mi>D</mi><mi>i</mi></msub></mrow></math>
- kind: logic
  id: one-step
  title: 代替先の商品も外すと、その需要は売上に入らない
  after: method
  locator: 式(2)〜(4)
  rationale: この計算では、買い替え先の商品を外しても、別の商品へ向かう割合は増やしません。
  caption: 合成例T4では、Aを外すと代替の対象になる需要は8個です。4個はBへ、2.4個はCへ向かい、1.6個はどちらにも向かいません。
  source: https://link.springer.com/article/10.1007/s10696-023-09492-z
