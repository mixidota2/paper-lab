<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc"><title id="title">一つのモデルで候補を選び最終順位を付ける</title><desc id="desc">論文の図1と表4をもとに作成した。数字は本番の実験設定。教師は学習時だけ使う。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#59717f"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#193743;font-size:20px}.small{font-size:17px}.head{font-size:25px;font-weight:700}.edge{stroke:#59717f;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="640" height="640" rx="18" fill="#f3f7f8"/><text x="24" y="38" class="head">従来の推薦経路とGryphon-v2の比較</text><rect x="24" y="64" width="592" height="62" rx="10" fill="#dbeceb"/><text x="40" y="94" class="">従来は15超の生成器で約1万曲を集める</text><path class="edge" d="M320,126 L320,151"/><rect x="24" y="156" width="592" height="62" rx="10" fill="#dbeceb"/><text x="40" y="186" class="">3,000曲に絞り、最終順位を付ける</text><text x="24" y="272" class="head">Gryphon-v2は履歴を一度だけ読む</text><rect x="24" y="292" width="592" height="62" rx="10" fill="#dbeceb"/><text x="40" y="322" class="">履歴を共有エンコーダーで読む（最大2,048件）</text><path class="edge" d="M200,354 L200,388"/><rect x="24" y="394" width="350" height="89" rx="10" fill="#dbeceb"/><text x="40" y="424" class="">生成したSIDを対応する曲へ展開</text><text x="40" y="451" class="">1,024個のSIDから最大1,200曲</text><path class="edge" d="M374,436 L402,436"/><rect x="410" y="394" width="206" height="89" rx="10" fill="#dbeceb"/><text x="426" y="424" class="">順位付け部</text><text x="426" y="451" class="">各曲の最終順位</text><path class="edge" d="M518,354 L518,388"/><rect x="24" y="525" width="592" height="77" rx="10" fill="#f5e5cf"/><text x="40" y="555" class="">教師は最大8,000件の行動を読む</text><text x="40" y="582" class="">教師の採点は学習時だけ。配信時は教師を動かさない。</text></svg>