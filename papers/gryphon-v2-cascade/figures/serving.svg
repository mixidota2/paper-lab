<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc"><title id="title">最終 ranker まで配信経路から外す</title><desc id="desc">原典 Figure 1・Table 4 を基に再構成。教師は学習時のみ。候補数は著者の配信設定。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#59717f"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#193743;font-size:20px}.small{font-size:17px}.head{font-size:25px;font-weight:700}.edge{stroke:#59717f;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="640" height="640" rx="18" fill="#f3f7f8"/><text x="24" y="38" class="head">旧 cascade と Gryphon-v2</text><rect x="24" y="64" width="592" height="62" rx="10" fill="#dbeceb"/><text x="40" y="94" class="">旧：15超の候補生成器 → 約10000候補</text><path class="edge" d="M320,126 L320,151"/><rect x="24" y="156" width="592" height="62" rx="10" fill="#dbeceb"/><text x="40" y="186" class="">prerank → 3000候補 → 最終 ranker</text><text x="24" y="272" class="head">v2：履歴は一度だけエンコード</text><rect x="24" y="292" width="592" height="62" rx="10" fill="#dbeceb"/><text x="40" y="322" class="">共有 encoder  Eᵤ（最大2048イベント）</text><path class="edge" d="M200,354 L200,388"/><rect x="24" y="394" width="350" height="89" rx="10" fill="#dbeceb"/><text x="40" y="424" class="">SID decoder → 衝突展開</text><text x="40" y="451" class="">1024 SID → 最大1200曲</text><path class="edge" d="M374,436 L402,436"/><rect x="410" y="394" width="206" height="89" rx="10" fill="#dbeceb"/><text x="426" y="424" class="">Ranking Module</text><text x="426" y="451" class="">最終順位を出力</text><path class="edge" d="M518,354 L518,388"/><rect x="24" y="525" width="592" height="77" rx="10" fill="#f5e5cf"/><text x="40" y="555" class="">Teacher Ranker：最大8000イベント</text><text x="40" y="582" class="">学習時の教師スコアのみ。配信には入らない。</text></svg>