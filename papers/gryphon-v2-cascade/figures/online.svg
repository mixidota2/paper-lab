<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc"><title id="title">Yandex Musicの本番テスト</title><desc id="desc">論文の表2と第6節をもとに作成した。発表した差は推薦経路全体の実験結果。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#59717f"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#193743;font-size:20px}.small{font-size:17px}.head{font-size:25px;font-weight:700}.edge{stroke:#59717f;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="640" height="380" rx="18" fill="#f3f7f8"/><text x="24" y="38" class="head">従来の推薦経路からの相対差</text><text x="24" y="92" class="">7分以上聴く利用者数</text><rect x="24" y="108" width="423" height="34" rx="5" fill="#267d78"/><text x="467" y="134" class="">+1.41%</text><text x="24" y="185" class="">総聴取時間</text><rect x="24" y="201" width="486" height="34" rx="5" fill="#267d78"/><text x="518" y="227" class="">+1.62%</text><text x="24" y="277" class="small">1日7分以上を集計。各群は対象利用者の8%。</text><text x="24" y="313" class="">経路の置き換え、蒸留、オンライン更新を含む。</text><text x="24" y="346" class="small">各部品の効果は分けていない。長期や多様性も未検証。</text></svg>