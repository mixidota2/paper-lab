<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 550" role="img" aria-labelledby="title desc"><title id="title">候補数ではなく、候補源ごとの平均で学ぶ</title><desc id="desc">論文の§3.6〜3.7をもとに作成した。候補源ごとの平均絶対誤差を係数1で足す。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#59717f"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#193743;font-size:20px}.small{font-size:17px}.head{font-size:25px;font-weight:700}.edge{stroke:#59717f;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="640" height="550" rx="18" fill="#f3f7f8"/><text x="24" y="38" class="head">2種類の候補を同じ教師が採点する</text><rect x="24" y="65" width="286" height="87" rx="10" fill="#dbeceb"/><text x="40" y="95" class="">現在のデコーダー</text><text x="40" y="122" class="">生成したSIDを曲に展開：Gᵤ</text><rect x="330" y="65" width="286" height="87" rx="10" fill="#dbeceb"/><text x="346" y="95" class="">表示ログ</text><text x="346" y="122" class="">ログで表示した曲：Mᵤ</text><path class="edge" d="M165,152 L165,191"/><path class="edge" d="M473,152 L473,191"/><rect x="24" y="198" width="592" height="84" rx="10" fill="#dbeceb"/><text x="40" y="228" class="">教師と学生が同じ候補に点を付ける</text><text x="40" y="255" class="">タスクごとに点数の差の絶対値を取る</text><path class="edge" d="M165,282 L165,316"/><path class="edge" d="M473,282 L473,316"/><rect x="24" y="322" width="286" height="65" rx="10" fill="#dbeceb"/><text x="40" y="352" class="">生成候補の平均：Lroll</text><rect x="330" y="322" width="286" height="65" rx="10" fill="#dbeceb"/><text x="346" y="352" class="">表示曲の平均：Limpr</text><text x="24" y="431" class="head">L = LNTP + Lroll + Limpr</text><text x="24" y="473" class="">生成候補は90%超。損失の重みは90%ではない。</text><text x="24" y="508" class="small">ビーム探索に勾配は流さない。教師の点数を正解に使う。</text></svg>