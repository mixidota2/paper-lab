core_idea:
  author_claim: 著者は、履歴を読む部分、曲の識別子を出す部分、曲に順位を付ける部分を一つのモデルとして学習した。現在のモデルが生成した候補と過去に表示された曲を、学習時だけ使う教師が採点する。Yandex Musicの実験群は、このモデルだけで15を超える候補生成器と、別々に動いていた予備・最終ランキングを置き換えた。
  research_bot_interpretation: '[先行Gryphon](gryphon-ilsm.html)と比べ、次に聴く曲を予測する信号とは別に、最終順位を付ける教師の点数を学ぶことが大きな違いだ。TeacherRecallが高ければ、学生が教師の順位に近づいたことは分かる。ただし、教師の採点に偏りがあれば、学生もその偏りを学ぶ可能性がある。'
sections:
  overview: |-
    Yandexの著者は利用者の履歴を一度だけ符号化し、曲の候補を出す処理と最終順位を付ける処理で共有しました。学習時には、別の大きな教師モデルが候補生成で得た曲と過去に表示された曲の両方に点を付けます。Gryphon-v2はその点をまねて順位を学ぶため、配信時に教師モデルを動かす必要はありません。

    Yandex MusicのA/Bテストでは、実験群で従来の15を超える候補生成器と予備・最終ランキングを1つのモデルに置き換えました。著者によると、1日に7分以上聴く利用者が従来方式より1.41%増え、総聴取時間も1.62%伸びました。応答時間は同程度です。推薦システム全体を置き換えた比較なので、教師モデルから学ぶ方法だけで効果が出たとは言えません。
  problem: |-
    候補を生成する確率は、利用者が次に聴く曲を予測するために学ぶ。一方、最終順位は「いいね」や途中でのスキップなど、複数の目的を踏まえて決める。先行Gryphonは曲単位で点を付けられたが、本番では従来の最終ランキングを残していた。

    Gryphon-v2は、重い教師モデルが付けた点を軽い順位付け部に学ばせる。著者は教師が従来の最終ランキングを上回るA/Bテストの結果を得たと書くが、その比較の詳細は本論文に載せていない。教師単独の評価と、教師から学んだシステム全体の評価は分けて読む。
  method: method.md
  why_it_might_work: 表示ログから候補を選ぶと、以前のシステムが表示した曲を学びやすい。一方、現在の生成モデルを動かせば、そのモデルが配信時に出しそうな曲も教師から学べる。学習候補を両方から集めると、片方にだけ含まれる曲を扱える。ただし、混ぜればどの評価指標も上がるという一般則ではない。
  evidence: |-
    ### 学習に使う候補と、評価する候補

    論文の表3は、蒸留に何を使うかを変えた場合の点推定を示す。R@1000は生成済みの候補を再順位付けする前の再現率。TeacherRecall@10は、同じ生成候補内で、教師と学生の上位10曲がどれだけ重なるかを測る。WPAは既存システムが表示した曲のログを使い、いいね、再生、スキップ、低評価の順に付けたラベルについて、2曲の前後が合うかをラベル重みの差で加重する。

    | 蒸留に使う候補 | R@1000 | TeacherRecall@10 | WPA |
    | --- | ---: | ---: | ---: |
    | 現在の生成候補と表示ログ | 0.8615 | 0.5654 | 0.5892 |
    | 現在の生成候補のみ | 0.8610 | 0.5618 | 0.5730 |
    | 表示ログのみ | 0.8663 | 0.2983 | 0.5872 |

    表示ログだけを使うと教師の上位10曲に一致しにくい。生成候補だけを使うと表示ログ上のWPAが下がる。表は点推定を比べており、各差の有意性を示したわけではない。オンラインでは学習時はビームの幅を32にして候補を生成し、損失に平均絶対誤差（MAE）を使った。後から試したMSEが一部の指標で高かったことは、本番の勝敗を示さない。

    表1の学生のWPAは0.5892、教師は0.6199だった。学生のオフライン評価で使った学習期間は2週間、教師は1年であり、同条件での比較ではない。教師に近づくことと、独立のデータで利用者の好みに合うことも異なる。

    ### Yandex Musicの本番テスト

    著者は対象利用者の8%ずつを、互いに重ならない対照群と実験群へ割り当てた。対照群は15を超える候補生成器と予備・最終ランキングを使い、実験群はその経路を一つのモデルで置き換えた。1日に7分以上聴く利用者は1.41%、総聴取時間は1.62%増えた。著者は両方の差についてp<0.001と報告した。構造、蒸留、オンライン更新をまとめて変えた比較で、部品の効果は分けていない。

    従来の推薦経路と比べた応答時間は同程度で、ミリ秒単位の値は報告されていない。別の比較では、同じ生成モデルの後ろに重い教師をつないで配信する構成より、Gryphon-v2は約4倍の件数を処理した。約4倍は従来経路との応答時間の比較ではない。実験は一つの推薦面に限られ、全対象者に展開した効果や長期の効果は示していない。

    [一次資料：§5〜6、表1〜4](https://arxiv.org/html/2608.06213)
  executable_understanding: |-
    Labは2つの特徴を使う線形モデルに、固定した教師 `y=0.8x₁−0.6x₂` の点数を学ばせる。表示候補ではx₂を0、生成候補ではx₁を0にした。表示候補だけ、生成候補だけ、両方を使う3条件で、同じ初期値から2,400回ずつ更新した。式では候補源ごとに誤差の絶対値を求め、その候補源の件数で割る。二つの候補源を使う場合は、各平均を足す。全候補を一つの集合と見なして平均するわけではない。

    学習に使っていない座標上で、教師との誤差と曲の前後がそろう割合を測る。この割合は、教師が厳密に前後を付けた組のうち、学生も同じ順序を付けた組を数える。学生が同点なら一致に含めない。正解の順序は教師から作るので、利用者の反応をラベルに使う論文のWPAとは異なる。

    実行は `uv run papers/gryphon-v2-cascade/run.py`。同じIDに複数の曲が入る場合は[先行Gryphonの小実験](gryphon-ilsm.html#executable_understanding)でも確認できる。
  results: |-
    片方の候補だけで学ぶと、その候補から観測できない特徴の重みは初期値の0のまま残った。両方を使うと、二つの特徴の重みを教師の値へ近づけられた。人工例は片方ずつの候補で異なる特徴を隠すように作った。この改善の大きさから、論文の表3や本番の候補分布で起きる差を予測することはできない。

    曲数の上限は別の問題だ。たとえば3曲ずつ対応するSIDが3個あり、上限が8曲なら、生成確率が最も低いSIDの3曲をまとめて除くと、残りは6曲だ。最後の順位付け部は、その3曲に高い点を付けられたとしても候補へ戻せない。これは上限の仕様を説明する人工例で、論文の1,200曲の設定で6曲になったという意味ではない。
  what_we_verified: Labは線形の人工モデルで、候補源ごとに平均絶対誤差を求め、学習で見える特徴が変わると教師への一致も変わることを確かめた。候補を生成するモデルの学習や、現在のモデルで候補を作り直す処理は含まない。
  what_we_did_not_verify: Labは論文の本番評価、学習の規模、実際の応答時間を再現していない。A/Bテストから、蒸留などの部品単独の効果は分からない。著者は長期の満足度、アーティストの多様性、人気が低い曲のカタログをどれだけ扱えたか、露出が一部の曲に集中したかを評価していない。教師単独のA/Bの詳細、最終順位を決める重み、本番ログも独立に検証できない。
  implementation: '`fit()` は教師への絶対誤差の劣勾配をPython標準ライブラリで計算する。`evaluate()` は学習に使わなかった座標で誤差と前後の一致を集計する。論文§3.6の候補源ごとに平均する処理だけを取り出し、Transformer、複数タスク、配信デコーダー、オンライン更新は使わない。教師が誤ったときの利用者への影響は測らない。'
  mapping: |-
    | 論文の箇所 | Labの対応 | 扱わないもの |
    | --- | --- | --- |
    | [論文の§3〜5](https://arxiv.org/html/2608.06213) | 手法の式、訓練と配信の図、論文の比較値 | 著者の計算や本番結果の再現 |
    | §3.6：候補源ごとに平均する蒸留損失 | `run.py` で人工データを計算し、`results.json` に保存 | ニューラルモデルと本番データ |
    | 公式実装 | 論文中に、実行できる公開コードのURLを確認できなかった | 公式コードとの同等性 |
