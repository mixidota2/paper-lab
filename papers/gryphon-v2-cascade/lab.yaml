question: 重い教師モデルを配信時に動かさず、曲を選んで最終順位まで付けられるか
summary: Gryphon-v2は履歴を読む計算を共有し、曲の候補を出して最終順位を付ける。Yandex MusicのA/Bでは、従来の多段構成に比べ、1日に7分以上聴く利用者が1.41%、総聴取時間が1.62%増えたと著者は報告した。教師の点数を学ぶ方法だけを変えた比較ではない。
