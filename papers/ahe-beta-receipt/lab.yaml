  checked: '2026-11-25'
  url: https://arxiv.org/html/2611.24924v1
  version: v1
  scope: 第3・4節、表1〜4、付録E〜Gの関係箇所と著者のGitHub公開説明を確認した。著者コードの実行と査読状況の確認はしていない。
figures: []
core_idea:
  author_claim: |-
    著者は、模擬ユーザーが作業中に伝えた問題を実行記録で確かめ、根拠のある要件にまとめました。開発役が変更案を出すと、レビュー側は要件を満たしたかを検査し、承認が現在の変更案に対するものかを確かめました。ベンチマークの点数は採用後の評価に使い、変更案を選ぶ基準には使いませんでした。
  research_bot_interpretation: Labでは、成果物が正しいか、利用者に現行版が届いたかを別々に判定します。一方の判定だけでは見えない失敗を見つけられます。この判定だけで論文の合格率が上がったという意味ではありません。
sections:
  overview: |-
    著者は、エージェントが仕事を進める仕組み（ハーネス）を、基盤モデルを変えずに改善する方法を提案しました。模擬ユーザーとのやり取りから何が足りなかったかを調べ、実行記録で確認できた要件について変更案を作り、レビューを通った案を取り込みます。改善には使っていない38課題で、同じGLM-5.3-Flashを使う元の仕組みと比べると、課題の合格率は21.9%から33.3%に上がり、使ったトークン数は40.8%減りました。この合格率は課題の採点結果で、実際に利用者が成果を受け取った割合ではありません。
  problem: 成果物だけを採点すると、エージェントが結果を返さなかった場合でも合格になることがあります。利用者に返事が届いただけでは、成果物が正しいかも分かりません。仕組みを改良する段階では、承認を受けた変更案と現在の変更案が同じかどうかも区別します。
  method: method.md
  why_it_might_work: 著者は利用者側の記録と実行記録を照らし合わせ、複数の課題に共通する失敗を探しました。変更案の採用時には要件と版を照合するため、別の版のレビューを使い回しません。著者はどの変更が結果に寄与したかを主比較で切り分けていません。
  evidence: |-
    ### 38課題の比較

    著者は、改良に使わなかった38課題で、同じGLM-5.3-Flashを使う元の仕組みと改良後の仕組みを比べました。各課題を1試行につき1回実行し、3試行で平均した合格率は21.9%から33.3%に上がりました。模擬ユーザーの評価も、1〜4点の尺度で2.59から3.04に上がりました。合格率と模擬ユーザーの評価は、別の判定です。

    実行側が使ったトークンは、1課題あたり平均240万から142万に減りました。この比較には、模擬ユーザーや仕組みの開発に使った分は含まれません。著者は別に、改良にかかったトークンを約19.25億と報告しました。この合計は記録された範囲の下限です。改良済みの仕組みを別モデルのGLM-5.3に移した1回の比較では、合格率が上がる一方、1課題あたりの実行トークンも191万から199万に増えました。

    ### 返事が届かなかったセッションと人による比較

    第4.3節の集計では、テストに合格した137セッションのうち34では、模擬ユーザーに完了の返事が届きませんでした。これは改良後の仕組みを使った38課題だけの内訳ではありません。

    人による別の比較では、参加者が6課題から選び、25の匿名ラベルから集まった48組が有効でした。そのうち31組が改良後、7組が改良前を選び、9組が同程度、1組はどちらも選びませんでした。人による評点は1〜7点の別の尺度です。作業が終わったかは自己申告で、著者はコードの独立レビューを行っていません。改良前のエージェントだけが既存の修正コードか同等の実装を読んだ6組を除くと、42組中26組が改良後、6組が改良前を選びました。

    [一次資料：第4節、表1〜4、付録E〜G](https://arxiv.org/html/2611.24924v1)
  executable_understanding: 架空の集計レポートを使います。画面で例を選ぶと、検査の合否、受け取った版、レビューされた版が変わります。棒の1は条件を満たす場合、0は条件が成立しなかった場合を示します。論文の合格率を示す棒ではありません。
  results: この教材では、成果物の検査に通り、利用者が現行のB版を受け取ったと確認できた場合だけ、作業を完了と数えます。送信側が受理したという記録だけでは、受け取ったかは不明です。記録がない場合も未達とは断定せず、教材から再送はしません。B版が届いても検査に通っていなければ、作業は完了しません。変更案を採用するときも、旧版に対するレビューを現行版には使いません。
  what_we_verified: Labは架空の48通りで、成果物検査、受け取り、レビューの判定を計算しました。成果物の検査に通るのは24通りで、現行版の受け取りも条件にすると6通りでした。この数字は、教材で列挙した組み合わせの数です。実際の発生率は示していません。
  what_we_did_not_verify: Labは著者の試行を再現していません。どの変更が合格率や利用者の評価に寄与したかも確かめていません。実際の変更の採用、利用者への送信、安全性、実行速度、規模、運用への適用も検証していません。
  implementation: |-
    `run.py` はPythonの標準ライブラリで条件の組み合わせを列挙し、結果を `results.json` に保存します。画面は計算済みの例を切り替えるだけです。APIの呼び出し、通知、承認は行いません。
  mapping: mapping.md
