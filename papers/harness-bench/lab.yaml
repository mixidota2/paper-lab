summary: モデルの回答を外部の操作へつなぐ仕組みも評価対象にする。最終成果物、途中の行動、費用を分けて見るためのベンチマーク。
figures: []
core_idea:
  author_claim: |-
    著者は、言語モデルがどれだけうまく働くかを知るには、指示やツールを渡すハーネスとの組み合わせを評価する必要があると主張します。初版が対象とするのは、インターネットにつながない隔離環境で行う106の課題です。著者は最後にできた成果物に加え、ツールの使い方、途中の状態との整合、失敗からの復帰を採点します。

    [一次資料：初版 §3.4、§4.1–4.3](https://arxiv.org/html/2605.27922v1)
  research_bot_interpretation: |-
    Labの読み方です。実行環境を選んだり直したりするときは、総合点だけでなく、完了しなかった仕事とその理由を見ます。成果物が作られなかったのか、作られたものの要件を満たさなかったのかで、調べる箇所が変わるためです。ただし、総合点が高い環境の一機能を取り入れれば同じ改善が得られる、とはこの比較から言えません。
sections:
  overview: |-
    著者は、言語モデルに指示を渡し、ツールの実行を管理する仕組みをハーネスと呼び、モデルとハーネスの組み合わせを比べるHarness-Benchを提案しました。初版では課題ごとに、依頼文と最初のファイル、予算、制限時間、採点方法をそろえました。一方、モデルへの指示の渡し方、ツールの使い方、実行中の状態管理、失敗後の再試行はハーネスごとの方法を残しました。

    初版の表2では、6ハーネスそれぞれの総合点を106課題と8モデルの平均で示しました。NanoBotが76.2点で最も高く、OpenClawが52.4点で最も低く、差は23.8ポイントでした。総合点には成果物の完了度、制約違反の有無、実行過程の評価が含まれます。実行過程の採点には全実行で同じ外部の言語モデルを使いました。この点差は完了率の差でも、再試行など一つの機能だけの効果でもありません。Codexは同じ106課題で試しましたが、標準のGPT-5.4構成だけを評価したため別枠です。
  problem: |-
    正しい手順を説明しても、求められたファイルを保存しなければ仕事は終わりません。そこで著者は言語モデルだけでなく、モデルに指示を渡し、ツールを呼び出し、途中の状態を管理する仕組み（ハーネス）も比較しました。

    課題ごとに指示、初期ファイル、予算、制限時間、採点方法をそろえます。他方で、各ハーネス固有のツールの扱い方や、エラーからの復帰方法は残します。たとえば総合点に差が出ても、復帰の仕組みだけが差を生んだとは判断できません。
  why_it_might_work: |-
    形式や保存を機械的に検査すれば、モデルが使える内容を作ったのに、納品できない事態を防げる可能性があります。一方、形式が合い、保存もされていても、内容を裏付ける根拠があるとは限りません。下の小実験では形式と保存を直す効果と、それだけでは根拠の不足が直らないことを分けて調べます。
  evidence: |-
    ### 初版の比較で分かったこと

    著者は106課題それぞれについて、モデルを選べる6ハーネスと8モデルの全組み合わせを試しました。全体で5,088回の実行です。CodexはGPT-5.4を使う標準の構成で同じ106課題を実行し、著者は8モデルの比較には含めませんでした。

    初版表2の総合点は、モデルを選べる6ハーネスの中ではNanoBotが76.2点、OpenClawが52.4点で、差は23.8ポイントでした。総合点は完了度と実行過程を含むため、この差は完了率の差ではありません。Codexの80.4点は参考値で、8モデル平均の順位には含めません。

    実行過程には言語モデルによる判定が含まれます。また、表2は固定した課題群での集計で、信頼区間は示していません。ハーネス間で得点がどれほど違うかは、同じ設定で試行を繰り返した際のばらつきとは別です。

    [一次資料：初版 §3.4、§4.1–4.3、表2](https://arxiv.org/html/2605.27922v1)
  executable_understanding: |-
    Labは60件の架空の成果物を用意します。それぞれについて、形式が合うか、内容に根拠があるか、保存されているかを検査し、一つでも欠ければ不合格です。三つとも満たした成果物だけを1件と数えます。条件ごとに合格した件数を足すのではありません。

    「何も直さない」「形式だけを直す」「形式と保存を直す」の三つを比べます。どの条件でも、根拠がない成果物を合格にはしません。`uv run papers/harness-bench/run.py` を実行すると、全条件の結果を `results.json` に保存します。
  results: |-
    合格した成果物は何も直さない条件で24件、形式だけを直すと36件、形式と保存の両方を直すと48件です。最後の条件でも、根拠が足りない12件は不合格のままです。60件の架空の成果物につけた条件から計算した値であり、論文が測ったハーネスの性能ではありません。
  what_we_verified: |-
    **仕組みの確認：一部のみ（PARTIAL）。** Labのコードで確かめたのは、架空の成果物を一件ずつ検査すると、形式と保存を直した条件では合格件数が増えることです。根拠のない成果物は合格しません。論文の採点式全体や、ハーネスが実際にエラーから復帰するかは、この小実験では確認していません。
  what_we_did_not_verify: |-
    Labは原論文の106課題、8モデル、6ハーネス、Codexの比較を再実行していません。言語モデルが実行過程を人と同じように判定するか、集計方法を変えると順位が変わるか、課題別の結果にどれほどばらつきがあるかも検証していません。隔離した環境での結果が、通信障害や外部の状態変化がある実サービスに当てはまるかは分かりません。性能、規模を広げた場合の挙動、本番への適用はいずれも未検証（NOT TESTED）です。
  implementation: |-
    実行にはPythonの標準ライブラリだけを使います。`run.py` が `papers/_toy_common.py` の計算を呼び出し、各条件の件数と初期条件の表を `results.json` に書き出します。ブラウザーに表示する値も、このファイルと同じ計算結果です。

    論文と読み比べるための小実験なので、実際のハーネスや言語モデルは動かしません。106の課題や、実行過程を言語モデルで採点する手順も含みません。
  mapping: |-
    | 対象 | 原論文とLabの対応 |
    | --- | --- |
    | 原論文 | [初版 §3.4、§4.1–4.3・表2](https://arxiv.org/html/2605.27922v1)に採点式と比較条件がある。 |
    | 採点式の図 | 初版 §3.4の式を読みやすい順に並べた。公式実装ではない。 |
    | 総合点の図 | 初版表2の著者報告値。Labでハーネスを実行して得た値ではない。 |
    | 小実験 | `run.py` が `papers/_toy_common.py` を呼び、架空の成果物の検査結果を `results.json` に保存する。 |
    | 公式コード | Labは公式コードの実行や行単位の照合を行っていない。 |

    `results.json` の `explorer.frames` には、何を直したかで分けた教材の結果が入っています。各条件の `bars` が示すのは、形式・根拠・保存の三つをすべて満たした成果物の数です。論文が報告した6ハーネスの総合点は、このファイルには入っていません。
  method: method.md
question: 仕事が終わらない原因は、推論と実行のどちらにあるか
