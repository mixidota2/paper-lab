core_idea:
  author_claim: OR由来の補充ラベルでTransformer＋VAEを事前学習し、RLOOの複合報酬で業務目標へ合わせる。著者はオフライン評価とJD現場評価で改善を報告する。
  research_bot_interpretation: ORを教師データと報酬の両方へ組み込む設計。DeepStockの構造的な方策正則化や、SabreAgentの設計時LLMとは補完関係にある。
sections:
  overview: 'ORで作った補充ラベルを小型モデルへ学習させ、RLで業務目標へ合わせる。約0.93MパラメータのTransformer＋VAEを用い、JDの菓子3カテゴリで保有費用−29.95%、在庫回転日数−5.27日を報告した。対象はマネジャーが選んだ高自動化SKUで、全カタログの無作為実験ではない。


    本Labの焦点は、モデルを大きくする前にORの構造をラベルと報酬へ渡す設計にある。最小実験ではORラベル生成とRLOOの基準値だけを検算する。'
  problem: 需要、商品属性、販促、目標回転日数から補充を決める。異なる商品の量を比較するため、OR側では補充量を需要何日分かという整数の在庫日数に置き換える。欠品分は次期へ持ち越さず、売り逃しとして扱う。カテゴリ単位のOR指導とSKU単位の方策調整は粒度が異なる。
  why_it_might_work: '【Labの解釈】ORラベルで探索の出発点を絞り、RLOOで業務上の非対称な損失や販促対応を反映する分担が効きそうだ。著者は大型化に頼らない設計を強調している。ただし0.93Mという規模だけで、大型モデル一般への優位性や計算費用の優位を証明したわけではない。


    DeepStockは在庫構造をDRLの方策写像へ埋め込む。ORPRはORラベルによる事前学習とRL調整の組合せだ。SabreAgentとはJDのSupply Chain Tech Team Yという系譜を共有するが、SabreAgentのLLMは設計時に使い、実行時には固定した予測・OR成果物を動かす。'
  evidence: '一次資料の[提供PDF v2](https://arxiv.org/pdf/2512.19001v2)の表1・3・4、§4–5を参照。数値は著者報告。


    |評価|対象と結果|読み方|

    |---|---|---|

    |オフライン・表1|5,319 SKU、70,210 SKU–DC。JD online 3491 → ORPR 3153、総費用−9.68%|名称にonlineを含む比較対象も、この表ではシミュレーション|

    |PSM A/B・表3|331 SKU、3,899 SKU–DC、菓子3カテゴリ。TT −5.27日、in-stock +2.29%、保有費用−29.95%|2025年9月の約30日。+2.29%は原表表記を維持|

    |DiD・表4|TT −4.07日、in-stock +0.47pp。保有費用の前年比は対照+22.05%、処置+3.70%|前年比の差は−18.35pp。保有額が前年比18.35%減ったという意味ではない|


    PSMは回転日数と需要で対応付けた。著者はDiDを因果効果の裏付けとするが、Labでは未観測交絡や平行トレンドの検証が残ると読む。現場では反実仮想の欠品損失を測れず、欠品費用を評価から除外した。in-stockは欠品しなかった日数の割合であり、数量充足率とは異なる。'
  executable_understanding: '2カテゴリ×在庫日数1〜10日の100候補を全探索する。12日の合成需要に対し、3日ごとの発注、1日のリードタイム、単価1を固定した。各候補の期末在庫累計と売り逃しを計算し、許容損失を変えて最小在庫のラベルを選ぶ。


    比較対象は制約を変えた同一候補集合。TransformerやVAEの代替モデルは学習しない。別途、4つの固定報酬についてleave-one-out advantageを計算する。報酬への定数加算でadvantageが変わらないことを確かめる。'
  results: 制約を厳しくすると、選ばれる在庫日数と累計在庫が変わる。初日には入荷がないため、許容損失を十分小さくすると実行可能な候補がなくなる。図の「候補なし」は不具合ではなく、制約とシミュレーターの組合せによる結果だ。RLOOは基準値の算術だけを扱い、方策の改善を測っていない。
  what_we_verified: '**CONFIRMED — 局所検算**：在庫・販売・売り逃しの収支、100候補の制約判定、最小在庫の選択、RLOOの定数シフト不変性を確認した。


    **PARTIAL — メカニズム**：シミュレーションからORラベルを選ぶ部分に限定。ニューラル方策が制約を常に守るという保証は与えていない。'
  what_we_did_not_verify: '**NOT TESTED**：Transformer＋VAE学習、RLOO更新、KL制約、販促の専門家適応、JDの総費用・現場効果・大規模運用。30日・菓子3カテゴリという範囲を、DeepStockのTmall全カタログ展開と同一視しない。現場の欠品費用は著者評価にも含まれない。'
  method: method.md
  mapping: mapping.md
  implementation: '`UV_CACHE_DIR=/tmp/uv-cache uv run --no-project papers/orpr-or-guided-pretrain-reinforce-inventory/run.py`でresults.jsonを再生成する。Python標準ライブラリのみ。乱数・外部データ・GPUは使わない。


    HTMLはlab.yaml、method.md、mapping.md、run.py、results.jsonから生成する。README.mdは読み方と再実行手順をまとめる。図の生成元はpaper_lab/inventory02.py。公式実装は未実行。'
teaching_figures:
- id: or-label-equations
  kind: equations
  after: method
  title: 在庫日数を選び、許容損失でラベルを絞る
  source: https://arxiv.org/abs/2512.19001
  locator: §3.3, Equations (1)–(3); Figure 1
  caption: 一次資料の式を説明用に書き直した。下の小実験は限定した条件で対応関係を確かめる。
  rationale: 式の変数と図の操作を結び付ける。
  steps:
  - name: 単位をそろえる
    formula: Xᵢ = Σᵥ v Xᵢᵥ;  Σᵥ Xᵢᵥ = 1;  Xᵢᵥ ∈ {0,1}
    explanation: vは需要何日分かを表す。図の各点は2カテゴリの日数の組合せ。
  - name: 在庫を最小化
    formula: min Σᵢ,ᵥ Xᵢᵥ stockᵢᵥ  subject to  Σᵢ,ᵥ Xᵢᵥ lossᵢᵥ ≤ SALE(1−αloss)
    explanation: 図の縦線より左にある候補だけから、累計在庫が最小の点を選ぶ。
  - name: RLOOの基準値
    formula: Aⱼ = Rⱼ − Σₗ≠ⱼ Rₗ/(k−1)
    explanation: 自分を除く報酬平均を引く。小実験はこの算術まで。
