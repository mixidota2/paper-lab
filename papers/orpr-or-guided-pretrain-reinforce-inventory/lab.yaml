summary: ORラベルで事前学習し、RLOOで業務へ調整。約0.93Mの補充方策とJD菓子の現場評価。
question: 小型の補充方策に、ORと販促の業務知識をどう渡すか。
verification:
  mechanism: PARTIAL
  performance: NOT TESTED
