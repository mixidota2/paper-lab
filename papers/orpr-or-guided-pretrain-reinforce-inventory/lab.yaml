id: orpr-or-guided-pretrain-reinforce-inventory
title: 'ORPR: An OR-Guided Pretrain-then-Reinforce Learning Model for Inventory Management'
authors:
- Lingjie Zhao
- Xue Yu
- Yongzhi Qi
- Hao Hu
- Jianshen Zhang
- Yingzheng Ma
- Shuyu Han
- Wei Qi
- Zuo-Jun Max Shen
year: 2025
submitted: '2025-12-22'
topics:
- retail-supply
- ml-systems
urls:
  paper: https://arxiv.org/abs/2512.19001
  pdf: https://arxiv.org/pdf/2512.19001
  arxiv: https://arxiv.org/abs/2512.19001
verdict: Must
status: published
summary: |-
  ORPRでは、数理最適化で選んだ補充量を使い、約93万パラメータのモデルを事前学習する段階と、ルールやシミュレーションを使って強化学習で調整する段階を分けます。著者はJD.comの過去データの再計算と、実際に発注を変えた現場比較を報告しました。
question: |-
  売り逃しを抑え、在庫を減らす発注判断を、どうモデルに教えるか
verification:
  mechanism: PARTIAL
  performance: NOT TESTED
  scaling: NOT TESTED
  production_applicability: NOT TESTED
core_idea:
  author_claim: |-
    著者は売り逃しの上限を守る補充量を数理最適化で選び、Transformerと変分オートエンコーダー（VAE）を組み合わせたモデルに教えました。その後、補充候補の報酬を、ほかの候補の報酬と比べる強化学習（RLOO）で調整しました。
  research_bot_interpretation: |-
    最初に使う教師データは、売り逃しの上限などを守る候補から選びます。次の強化学習では、ルールや補充を再現するシミュレーションで候補を評価します。業務の知識をどこでモデルに渡すかは、二つの段階で異なります。
sections:
  overview: |-
    売り逃しを抑えながら在庫を減らすには、商品ごとにどれだけ補充すればよいのでしょうか。著者は需要の何日分を補充するかを数理最適化で求め、その判断を教師データにして補充モデルを学習しました。その後、シミュレーションなどで補充案を評価し、強化学習で判断を調整しました。

    JD.comの菓子3カテゴリを対象にした30日間の現場比較では、提案手法を使った331商品は、現行方式を使った類似商品に比べて、在庫回転日数が5.27日短く、在庫の保有費用が29.95%低くなりました。ただし、担当者は発注の自動化率が高い商品を優先して試験対象に選びました。無作為割り付けではなく、売り逃しによる損失も現場では測っていません。
  problem: |-
    たくさん補充すると、品切れで売り逃す数量を減らせる一方、商品を置いておく費用がかかります。商品によって売れる速さが違うため、著者は補充量を「需要の何日分か」にそろえ、カテゴリごとに候補となる整数の日数を一つ選びました。満たせなかった需要は翌日以降に繰り越さず、売り逃しとします。最適化で決める補充の目安はカテゴリ単位で、学習した補充方策を調整する単位は商品（SKU）です。
  why_it_might_work: |-
    著者がまず最適化した結果をモデルに教えると、モデルは補充候補を一から探さずに済みます。その後、強化学習で、在庫の保有と売り逃しをどう評価するかや、販促時の判断を反映できます。ただし、約93万パラメータという規模だけでは、別のモデルとの性能や計算費用の差は分かりません。

    DeepStockは在庫に関する知識をモデルの構造に組み込みます。ORPRは、その知識を教師データと報酬に使います。ORPRとSabreAgentはJDのSupply Chain Tech Team Yに由来しますが、SabreAgentで大規模言語モデルを使うのは設計時です。運用時は確定した予測と数理最適化を使います。
  evidence: |-
    ### 過去データの再計算と、実際に発注を変えた結果を分ける

    著者はまず、JD.comの菓子5,319商品について、過去のデータを使って補充量を計算し直しました。商品と配送センターの組み合わせは70,210件です。同じ需要予測の仕組みを使い、発注方法だけを変えて比較すると、表1の総費用はJDの現行方式が3,491、ORPRが3,153でした。現行方式からは約9.68%減りましたが、学習の手本にした数理最適化の方式は3,000でした。表に載っている費用は、実額が分からないように加工されています。

    次に著者は、2025年9月の30日間、菓子3カテゴリの331商品でORPRの発注判断を実際に使いました。JDの担当者は、これまでモデルの発注判断をそのまま採用する割合が高かった商品を優先しました。比較対象は、同じカテゴリで需要と在庫回転日数が近い商品です。対象を無作為に割り当てたわけではありません。

    この比較では、ORPRを使った商品の在庫回転日数が5.27日短く、在庫の保有費用は29.95%低くなりました（表3）。前年の同じ期間からの変化を比べた表4では、対照群の保有費用は22.05%増え、ORPRを使った群は3.70%増えました。差は18.35ポイントです。ORPRを使った群の費用が前年より下がったわけではありません。欠品しなければ何個売れたかは分からないため、著者は現場の評価に売り逃しの損失を含めませんでした。

    在庫回転日数の差は表3が−5.27日、前年からの変化を比べた表4が−4.07日です。欠品しなかった日の割合は、表3がY+2.29%、表4がY+0.47%と記します。Yの値が開示されていないため、この二つの値は原表どおり記し、相対変化とポイント差のどちらかに読み替えません。在庫あり日率は欠品しなかった日の割合で、何個の需要を満たしたかとは別です。

    著者は、2024年9月を介入前として、2025年9月との変化を比べました。この比較だけで、介入前に両群が同じように変化していたことや、観測されていない違いがないことは確かめられません。現場の評価は331商品と配送センターの3,899組が対象です。

    一次資料：[原論文v2、表1・3・4と§4〜5](https://arxiv.org/pdf/2512.19001v2)。
  executable_understanding: |-
    Labは2カテゴリに、12日間で合計80個の架空の需要を置きます。カテゴリごとに需要の1〜10日分から一つ選ぶので、候補は100通りです。3日ごとに発注し、翌日に入荷する設定で、商品の単価は1です。図で売り逃しの上限を動かすと、同じ候補の中から、上限を守り、日ごとの期末在庫を足した量が最も小さい案を選びます。

    別の計算では、4つの報酬について、それぞれから自分以外の報酬平均を引いた差を求めます。全報酬に同じ定数を足しても、この差は変わりません。ここで試すのはRLOOが使う差の計算までです。モデルの学習や補充判断の更新は行いません。
  results: |-
    売り逃しの上限が4個なら、条件を満たす20通りのうち、カテゴリAに需要7日分、Bに6日分を置く案の累計在庫が最も少なくなります。上限を1.6個にすると、初日の入荷が間に合わず4個を売り逃すため、どの案も条件を満たしません。候補がなければ、在庫が0という結果ではなく、条件を満たす案がないと表示します。

    報酬の例では、ほかの候補との報酬差は計算しましたが、この差を使えば補充が改善するかは調べていません。
  what_we_verified: |-
    **確認済み（CONFIRMED）**：日ごとの需要が販売と売り逃しに分かれ、在庫の収支が合うことを確かめました。100候補で上限を守るかを判定し、その候補の中で累計在庫が最も少ない案を見つけました。報酬は、全候補に同じ値を足しても差が変わりませんでした。

    **部分的に確認（PARTIAL）**：論文の仕組みのうち、補充候補をシミュレーションで調べ、教師データの目安を選ぶ考え方を扱います。学習したモデルが実行時に必ず上限を守るとは言えません。
  what_we_did_not_verify: |-
    **未検証（NOT TESTED）**：LabではTransformerとVAEを学習させず、RLOOで補充方策を更新していません。元の方策から大きく離れないための罰則や、販促で使う専門家の補充判断も実装していません。JDの費用、現場での効果、大規模な運用は再検証していません。菓子3カテゴリの30日間と、DeepStockで報告された、TmallでAlibaba自身が在庫を持つ全対象への展開は、対象の範囲が違います。
  method: method.md
  mapping: mapping.md
  implementation: |-
    再実行：`UV_CACHE_DIR=/tmp/uv-cache uv run --no-project papers/orpr-or-guided-pretrain-reinforce-inventory/run.py`。標準ライブラリだけで動き、乱数、外部データ、GPUは使いません。

    `run.py` は、人工例の計算結果と、著者が報告した値を別の項目に分けて `results.json` に保存します。図は `paper_lab/inventory02.py` で生成します。著者の公式実装は実行していません。
teaching_figures:
- id: or-label-equations
  kind: equations
  after: method
  title: 売り逃しの上限を守りつつ、累計在庫を減らす
  source: https://arxiv.org/abs/2512.19001
  locator: §3.3, Equations (1)–(3); Figure 1
  caption: 最初の2式は、補充候補から教師データを選ぶ条件です。最後は強化学習に使う報酬差の式です。
  rationale: 各式がどの値を選び、図の条件とどう対応するかを示します。
  steps:
  - name: カテゴリごとに需要何日分かを一つ選ぶ
    formula: Xᵢ = Σᵥ v Xᵢᵥ;  Σᵥ Xᵢᵥ = 1;  Xᵢᵥ ∈ {0,1}
    explanation: vは需要何日分か、Xᵢᵥの1はその候補を選んだことを表します。図の各点は、2カテゴリの補充日数の組合せです。
  - name: 売り逃しが上限以内の候補から在庫最小を選ぶ
    formula: min Σᵢ,ᵥ Xᵢᵥ stockᵢᵥ  subject to  Σᵢ,ᵥ Xᵢᵥ lossᵢᵥ ≤ SALE(1−αloss)
    explanation: 論文のSALEは計画期間の実売上です。Labは代わりに固定した架空の需要80を使います。図では売り逃しが縦線より右にある候補を除き、残りから累計在庫が最も少ない案を選びます。
  - name: 他の候補の平均と、自分の報酬を比べる
    formula: Aⱼ = Rⱼ − Σₗ≠ⱼ Rₗ/(k−1)
    explanation: 候補jの報酬から、ほかの候補の報酬平均を引きます。Labはこの差を求め、方策は更新しません。
- id: orpr-training
  kind: architecture
  after: core_idea
  title: 補充量の目安を作り、その目安から学んで業務に合わせる
  caption: 原論文の図1と第3節を整理しました。約93万パラメータは§3.4で著者が報告した値です。
  source: https://arxiv.org/abs/2512.19001
  locator: Figure 1; Sections 3.1–3.4
  rationale: 最初に補充の目安を用意し、次に教師データから学び、最後に報酬で判断を調整します。
  rows:
  - label: ラベル作成
    nodes:
    - title: 補充候補を試す
      text: 過去データで補充を再現し、候補ごとに累計在庫価値と売り逃しを計算します。
    - title: 数理最適化で選ぶ
      text: 売り逃しの上限を守る候補の中で、累計在庫価値が最も小さい日数の組み合わせを選びます。
  - label: 約93万パラメータの事前学習
    nodes:
    - title: Transformer
      text: 販売、商品属性、業務目標をまとめる部分と、需要を予測する部分を先に学習します。
    - title: VAEによる補充判断
      text: 需要予測までの重みを固定し、最適化で選んだ補充量を教師データにします。最後に全体を補充判断の損失で調整します。
  - label: 業務へ調整
    nodes:
    - title: RLOO
      text: ルールとシミュレーションで候補を採点し、元の方策から離れすぎないよう罰則を加えます。候補間の報酬差を更新に使います。
    - title: 販促対応
      text: 販促の補充案では、専門家が示した補充の目安も評価に使います。
- id: inventory-map
  kind: matrix
  after: why_it_might_work
  title: 在庫の知識をどの段階で使うか
  caption: 研究によって条件や規模が違うため、ここでは業務の知識をどこに使うかだけを比べます。
  source: https://arxiv.org/abs/2512.19001
  locator: Sections 2–3; related primary-source Labs
  rationale: 学習や設計で使う知識と、運用時に発注を決める仕組みを分けました。
  columns:
  - 業務知識を入れる場所
  - 運用時に補充を決めるもの
  rows:
  - label: ORPR
    cells:
    - 最適化で選んだ量を教え、その後は業務のルールやシミュレーションで補充案を評価する
    - 学習済みの補充モデル
  - label: DeepStock
    cells:
    - 在庫の性質を、強化学習するモデルの構造に組み込む
    - 在庫構造を組み込んだ補充モデル
  - label: SabreAgent
    cells:
    - 大規模言語モデルを設計時に使い、検証を終えた仕組みを固定する
    - 予測と数理最適化
  - label: InvEvolve
    cells:
    - 補充ルールをコードとして書き換え、信頼区間をもとに採用する案を選ぶ
    - 選んだ明示的な補充ルール
