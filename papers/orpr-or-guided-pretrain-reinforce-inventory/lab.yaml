id: orpr-or-guided-pretrain-reinforce-inventory
title: 'ORPR: An OR-Guided Pretrain-then-Reinforce Learning Model for Inventory Management'
authors:
- Lingjie Zhao
- Xue Yu
- Yongzhi Qi
- Hao Hu
- Jianshen Zhang
- Yingzheng Ma
- Shuyu Han
- Wei Qi
- Zuo-Jun Max Shen
year: 2025
submitted: '2025-12-22'
topics:
- retail-supply
- ml-systems
urls:
  paper: https://arxiv.org/abs/2512.19001
  pdf: https://arxiv.org/pdf/2512.19001
  arxiv: https://arxiv.org/abs/2512.19001
verdict: Must
status: published
summary: ORPRは、在庫を抱えすぎず、売り逃しも抑える発注を学ぶ方法です。数理最適化で求めた補充量を教師データにし、約93万パラメータのモデルを事前学習するのが最初の段階です。その後、強化学習で業務に合わせます。著者はJDの菓子を対象に現場評価を報告しています。
question: 売り逃しを抑えながら在庫を減らす方法を、どう補充モデルに教えるか
verification:
  mechanism: PARTIAL
  performance: NOT TESTED
  scaling: NOT TESTED
  production_applicability: NOT TESTED
core_idea:
  author_claim: 著者は、数理最適化で選んだ補充量を教師データにし、Transformerと変分オートエンコーダー（VAE）を組み合わせた補充モデルを事前学習します。その後、他の候補との報酬差を使う強化学習（RLOO）で業務目標に合わせます。著者はシミュレーションとJDの現場評価の両方で改善を報告しています。
  research_bot_interpretation: Labの読み方：最適化で補充判断の出発点を作り、強化学習では現場のルールとシミュレーションの結果を評価に使う設計です。最適化が教師データを作る段階と、報酬に基づいて行動を調整する段階を分けて読むと、どこに業務上の知識が入るかが分かります。
sections:
  overview: |-
    売り逃しを抑えながら在庫を減らすには、商品ごとにどれだけ補充すればよいのでしょうか。著者は需要の何日分を補充するかを数理最適化で求め、その判断を教師データにして補充モデルを学習しました。その後、シミュレーションなどで補充案を評価し、強化学習で判断を調整しました。

    JD.comの菓子3カテゴリを対象にした30日間の現場比較では、提案手法を使った331商品は、現行方式を使った類似商品に比べて、在庫回転日数が5.27日短く、在庫の保有費用が29.95%低くなりました。ただし、担当者は発注の自動化率が高い商品を優先して試験対象に選びました。無作為割り付けではなく、売り逃しによる損失も現場では測っていません。
  problem: 需要や商品属性、販促、目標とする在庫回転日数から、商品の補充量を決めます。商品によって販売数量が違うため、数理最適化では数量を「需要の何日分か」にそろえ、整数の日数から選びます。満たせなかった需要は翌日以降に繰り越さず、売り逃しとして扱います。最適化で補充の目安を決める単位はカテゴリ、方策を調整する単位は個別の商品（SKU）です。
  why_it_might_work: 'Labの解釈：まず、売り逃しの上限を満たす補充候補を教師データにすると、モデルは一から補充判断を探さずに済みます。次に、強化学習で、在庫を持ちすぎる損失と欠品する損失の違いや、販促時の判断を反映できます。ただし、約93万パラメータという規模だけでは、大型モデルより性能が高い、または計算費用が低いとは言えません。


    DeepStockは在庫特有の性質を補充モデルの構造に組み込みます。ORPRでは、その知識を補充の教師データと強化学習の評価に使います。ORPRとSabreAgentはJDのSupply Chain Tech Team Yに由来しますが、SabreAgentは大規模言語モデルを設計時に使い、運用では確定した予測と数理最適化を実行します。'
  evidence: '一次資料の[提供PDF v2](https://arxiv.org/pdf/2512.19001v2)の表1・3・4、§4–5にある著者報告です。


    | 評価 | 対象と結果 | 比較の読み方 |

    | --- | --- | --- |

    | シミュレーション・表1 | 5,319 SKU、商品と配送センター（SKU–DC）の組合せ70,210件。総費用はJD online 3491、ORPR 3153（9.68%減） | 比較対象の名称は「online」ですが、ここではシミュレーションの結果です。 |

    | 現場の対応付け比較・表3 | 菓子3カテゴリの331 SKU、3,899 SKU–DC。回転日数（TT）−5.27日、在庫あり日率（in-stock）+2.29%、保有費用−29.95% | 2025年9月の約30日。+2.29%は原表の表記です。 |

    | 介入前後の差の比較（DiD）・表4 | TT −4.07日、在庫あり日率 +0.47ポイント。保有費用の前年比は対照群+22.05%、ORPRを適用した群+3.70% | 保有費用の前年比の差は−18.35ポイント。前年比で保有費用が減ったという意味ではありません。 |


    表3の比較は、回転日数や需要の近い対象を対応付ける手法（PSM）を使います。著者は表4のDiDでも効果を裏づけていますが、観測できない違いが残っていないか、介入前に両群が同じ傾向で変化していたかは、なお確認が必要です。現場では、欠品しなければ売れた量を直接測れず、欠品費用は評価に含めていません。在庫あり日率は欠品しなかった日の割合で、需要数量のうち何個を満たしたかとは別です。'
  executable_understanding: 'Labでは、人工の12日分の需要を使います。2カテゴリそれぞれで1〜10日分から選ぶので、候補は100通りです。発注は3日ごと、入荷まで1日、単価は1に固定します。グラフで売り逃しの上限を切り替え、その上限を守る候補の中で、各日の期末在庫の合計が最も少ない組合せを探します。候補集合は変えず、制約だけを変えます。


    別の計算では、4つの固定報酬について、それぞれから自分以外の報酬平均を引いた差を求めます。全報酬に同じ定数を足しても、他候補との相対的な差は同じです。これで確認できるのはRLOOの基準値の計算までで、TransformerやVAE、代わりのモデルは学習しません。'
  results: 売り逃しの上限を厳しくすると、選ばれる在庫日数と在庫の累計が変わります。初日は入荷が間に合わず、上限を十分に下げると、100候補のどれも条件を満たしません。「条件を満たす候補なし」は制約を守れないことを示す結果です。RLOOでは候補同士の報酬差を計算しただけで、学習後の補充が改善したかは測っていません。
  what_we_verified: '**確認済み（CONFIRMED）**：需要が販売と売り逃しに分かれること、在庫の収支が合うことを確かめました。100候補の上限判定、在庫最小の選択、すべての報酬に同じ値を足したときに差が変わらないことも検算しました。


    **部分的に確認（PARTIAL）**：論文の仕組みのうち、補充候補をシミュレーションで評価し、教師データにする部分を扱います。ニューラルネットで学習した補充方策が、毎回制約を守るとは保証していません。'
  what_we_did_not_verify: '**未検証（NOT TESTED）**：TransformerとVAEの学習、RLOOでモデルを更新する処理、事前学習した方策からのずれを抑えるKL制約、販促の判断への専門家ラベルの利用。JDの総費用、現場への効果、大規模運用も再検証していません。菓子3カテゴリ・約30日の比較を、DeepStockで報告されたTmallの全カタログ展開と同じ範囲とみなしません。欠品費用は原論文の現場評価にも含まれません。'
  method: method.md
  mapping: mapping.md
  implementation: '再実行：`UV_CACHE_DIR=/tmp/uv-cache uv run --no-project papers/orpr-or-guided-pretrain-reinforce-inventory/run.py`。Pythonの標準ライブラリだけで動き、乱数、外部データ、GPUは使いません。


    `run.py`は検算結果と著者の報告値を分けて`results.json`に保存します。ページはこのJSONと`lab.yaml`、`method.md`、`mapping.md`、`run.py`を元に生成し、図は`paper_lab/inventory02.py`が作ります。公式実装は実行していません。'
teaching_figures:
- id: or-label-equations
  kind: equations
  after: method
  title: 売り逃しの上限を守りつつ、累計在庫を減らす
  source: https://arxiv.org/abs/2512.19001
  locator: §3.3, Equations (1)–(3); Figure 1
  caption: 原論文の数式を読みやすく並べ直しました。下のLabは、この考え方を小さな人工例で確かめます。
  rationale: 各変数が候補の選択にどう関わるかを、下の図と対応づけます。
  steps:
  - name: カテゴリごとに需要何日分かを一つ選ぶ
    formula: Xᵢ = Σᵥ v Xᵢᵥ;  Σᵥ Xᵢᵥ = 1;  Xᵢᵥ ∈ {0,1}
    explanation: vは需要何日分か、Xᵢᵥの1はその候補を選んだことを表します。図の各点は、2カテゴリの補充日数の組合せです。
  - name: 売り逃しが上限以内の候補から在庫最小を選ぶ
    formula: min Σᵢ,ᵥ Xᵢᵥ stockᵢᵥ  subject to  Σᵢ,ᵥ Xᵢᵥ lossᵢᵥ ≤ SALE(1−αloss)
    explanation: 売り逃しが上限を示す縦線の位置か、それより左にある候補を比べます。その中で累計在庫が最も少ない点を選びます。
  - name: 他の候補の平均と、自分の報酬を比べる
    formula: Aⱼ = Rⱼ − Σₗ≠ⱼ Rₗ/(k−1)
    explanation: 候補jの報酬から、自分を除く平均を引きます。Labで計算するのはこの差までです。
- id: orpr-training
  kind: architecture
  after: core_idea
  title: 補充量の目安を作り、その目安から学んで業務に合わせる
  caption: 原論文図1と§3の整理です。約93万パラメータは§4.1の著者記載です。
  source: https://arxiv.org/abs/2512.19001
  locator: Figure 1; Sections 3–4.1
  rationale: 教師データを作る段階、事前学習、強化学習を分けて示します。
  rows:
  - label: ラベル作成
    nodes:
    - title: 補充候補を試す
      text: 需要履歴を使い、候補ごとの累計在庫価値と売り逃しを求める。
    - title: 数理最適化で選ぶ
      text: 売り逃しの上限を守る候補から、在庫を最も少なくできる日数を選ぶ。
  - label: 約93万パラメータの事前学習
    nodes:
    - title: Transformer
      text: 販売、商品属性、業務目標の3種類の情報をまとめる。
    - title: VAEによる補充判断
      text: 数理最適化で選んだ補充量を教師データにする。
  - label: 業務へ調整
    nodes:
    - title: RLOO
      text: ルールとシミュレーションで評価し、KL制約で元の方策からのずれを抑える。
    - title: 販促対応
      text: 販促時は専門家が示した補充の目安にも合わせる。
- id: inventory-map
  kind: matrix
  after: why_it_might_work
  title: 在庫の知識をどの段階で使うか
  caption: Labの整理です。条件も規模も異なるため、性能の順位は示していません。
  source: https://arxiv.org/abs/2512.19001
  locator: Sections 2–3; related primary-source Labs
  rationale: 各研究が業務知識をどこに入れ、運用で何を動かすかを分けます。
  columns:
  - 業務知識を入れる場所
  - 運用時に補充を決めるもの
  rows:
  - label: ORPR
    cells:
    - 最適化で選んだ量を事前学習に使い、強化学習で業務目標に合わせる
    - 学習済みの補充モデル
  - label: DeepStock
    cells:
    - 在庫の性質を深層強化学習の方策の構造に組み込む
    - 在庫構造を組み込んだ補充モデル
  - label: SabreAgent
    cells:
    - 大規模言語モデルは設計時に使い、検証後に成果物を固定する
    - 予測と数理最適化
  - label: InvEvolve
    cells:
    - 補充ルールのコードを改良し、信頼区間を使って候補を選ぶ
    - 選んだ明示的な補充ルール
