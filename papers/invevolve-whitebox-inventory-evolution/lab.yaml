  method: method.md
teaching_figures:
- kind: equations
  id: inventory-response
  title: 不足への応答を二つの係数で変える
  after: method
  source: https://arxiv.org/pdf/2605.00369v4
  locator: §5.3.2、Fig. 5
  rationale: αの上限緩和とKpの比例応答を、CBSからの変更として読む。
  caption: 一次資料の方策式を再構成。係数を固定した応答曲線を実行可能な理解で示す。
  steps:
  - name: CBS：固定上限
    formula: Δ = max(0, S − IP); q = min(Δ, r)
    explanation: 不足が大きくても発注量はrを超えない。
  - name: Tilted-CBS：不足で上限を緩める
    formula: q = min(Δ, r_base + αΔ)
    explanation: α=0ならCBS。αが正なら大きな不足への補充を増やす。
  - name: Tilted-PIC：不足への反応も調整する
    formula: q = max(0, min(round(Kp Δ), r_base + αΔ))
    explanation: Kp<1なら比例応答を抑える。整数不足とKp=1の条件ではTilted-CBSに一致する。
