  title: 在庫不足から発注量を求める3つの式
  after: method
  source: https://arxiv.org/pdf/2605.00369v4
  locator: §5.3.2、Fig. 5
  rationale: 発注上限と、不足に掛ける係数の役割を式で比べます。
  caption: 原論文の発注式をもとにしています。続く図では、係数を固定し、不足量を変えたときの発注量を計算します。
  steps:
  - name: CBS：固定した発注上限
    formula: Δ = max(0, S − IP); q = min(Δ, r)
    explanation: 不足分を発注しますが、発注量は上限 r を超えません。
  - name: Tilted-CBS：不足に応じた発注上限
    formula: q = min(Δ, r_base + αΔ)
    explanation: α が正なら、不足が大きいほど発注上限を引き上げます。基準の上限が同じで α=0 ならCBSと同じです。
  - name: Tilted-PIC：不足に比例する発注量
    formula: q = max(0, min(round(Kp Δ), r_base + αΔ))
    explanation: 不足量に Kp を掛けてから丸め、発注上限を適用します。不足が整数で Kp=1 ならTilted-CBSと一致します。
