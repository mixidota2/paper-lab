core_idea:
  author_claim: BaseとCoeffで、モデルの出力を目標在庫や需要の係数に読み替えて発注量を出す。表せるルールの範囲は保ちつつ、強化学習が試す行動を在庫管理に合わせ、一つの発注ルールを全SKUへ展開する。
  research_bot_interpretation: 在庫の関係式を、学習する出力の意味に組み込む研究。設計やコードの更新に大規模言語モデル（LLM）を使うSabreAgent・InvEvolveとは、学習・設計の対象が違う。
source_review:
  checked: '2026-10-01'
  version: v1
  pdf_sha256: 69c504398868c208944edef726796f871d073b6d678523d50cd06608caa65d3a
  scope: 導入部、欠品需要推定、Fig. 3、Tables 1–2、§4を提供PDF本文で確認。
