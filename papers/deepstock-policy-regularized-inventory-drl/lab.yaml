teaching_figures:
- kind: equations
  id: action-remapping
  title: 目標在庫と需要の係数を使う発注式
  after: method
  source: https://arxiv.org/pdf/2603.19621v1
  locator: 導入部pp.3–4
  rationale: BaseとCoeffで出力をどう使うか、Bothでどう組み合わせるかを示します。
  caption: 原論文の発注式です。ネットワークには在庫状態も入力するため、モデルが返す目標在庫は全状態で同じとは限りません。
  steps:
  - name: Base：目標在庫と総在庫の差
    formula: q = max(μBase(I,x) − tot(I), 0)
    explanation: 出力を目標在庫にし、手元の在庫と入荷予定で足りない分だけ発注します。
  - name: Coeff：需要特徴の重み付き和
    formula: q = μCoeff(I,x)ᵀ feat(x)
    explanation: 需要の履歴と予測を短期・長期に分けた4つの特徴と、定数1にそれぞれ係数を掛けて足し、その合計を発注量にします。
  - name: Both：重み付き和を目標在庫に使う
    formula: q = max(μBoth(I,x)ᵀ feat(x) − tot(I), 0)
    explanation: 係数を掛けて足した値を目標在庫にし、そこから総在庫を引いて不足分を発注します。
- kind: matrix
  id: policy-design-map
  title: DeepStock、SabreAgent、InvEvolveの設計対象
  after: core_idea
  source: https://arxiv.org/pdf/2603.19621v1
  locator: 導入部。関連研究の一次資料は各Labページに掲載。
  rationale: 3つの研究が学習や設計で何を変更するかを比べます。
  caption: Labが各論文をもとに設計の違いを整理しました。同じ条件で性能を比べた表ではありません。
  columns:
  - 学習や設計で変えるもの
  - 発注量の求め方や候補の評価
  - 大規模言語モデル（LLM）の役割
  rows:
  - label: DeepStock
    cells:
    - 深層強化学習でモデルの重みを調整する。
    - モデルの出力をBaseやCoeffの式で発注量に変換する。
    - 使わない。
  - label: SabreAgent
    cells:
    - 数理最適化に渡す事前分布を設計する。
    - 運用では設計済みの数理最適化を使って発注量を求める。
    - 設計時に使う。
  - label: InvEvolve
    cells:
    - 人が読める発注コードを書き換える。
    - 評価の推定値を控えめに見積もる信頼下限（LCB）で候補を検証する。
    - 発注コードの候補を作り、更新する。
results: results.json
