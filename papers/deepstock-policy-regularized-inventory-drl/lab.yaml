teaching_figures:
- kind: equations
  id: action-remapping
  title: 目標と係数を発注量へ写す
  after: method
  source: https://arxiv.org/pdf/2603.19621v1
  locator: 導入部pp.3–4
  rationale: 目標在庫と需要規模を別々に読み、Bothで接続する。
  caption: 原論文の式を再構成。μは在庫にも依存し、固定の基準在庫への制限ではない。
  steps:
  - name: Base：目標から総在庫を引く
    formula: q = max(μBase(I,x) − tot(I), 0)
    explanation: ネットワークの出力を目標在庫として読む。
  - name: Coeff：需要特徴に係数を掛ける
    formula: q = μCoeff(I,x)ᵀ feat(x)
    explanation: 4つの需要特徴と定数1から発注量を作る。
  - name: Both：加重和を目標として読む
    formula: q = max(μBoth(I,x)ᵀ feat(x) − tot(I), 0)
    explanation: 需要規模と現在庫を同じ再写像で扱う。
- kind: matrix
  id: policy-design-map
  title: 在庫構造と学習器の交点に置く
  after: core_idea
