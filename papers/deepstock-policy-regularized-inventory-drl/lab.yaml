question: モデルの出力を目標在庫や需要の係数にすると、発注量はどう決まるか
summary: DeepStockでは、強化学習モデルの出力を目標在庫や需要の係数として使い、発注量を式で計算します。著者は、表せる発注ルールの範囲を狭めずに学習できると説明し、AlibabaがTmallで在庫を持つ商品のうち、同社が補充を管理する全対象に導入したと報告しました。Labは発注量を求める式だけを検証しました。
