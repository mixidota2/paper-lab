core_idea:
  author_claim: 著者はモデルの出力を目標在庫や需要の係数として使うと、在庫管理に沿った発注を学習中に試しやすくなり、表せる発注ルールの範囲は狭まらないと説明しています。同じモデルで複数の商品を扱います。
  research_bot_interpretation: DeepStockは、発注量の計算式をモデルの学習に組み込みます。大規模言語モデル（LLM）を使って発注方法の設計を変えるSabreAgentやInvEvolveとは、学習や設計で変更する対象が異なります。
source_review:
  checked: '2026-10-01'
  version: v1
  pdf_sha256: 69c504398868c208944edef726796f871d073b6d678523d50cd06608caa65d3a
  scope: 導入部、欠品需要推定、Fig. 3、Tables 1–2、§4を提供PDF本文で確認。
