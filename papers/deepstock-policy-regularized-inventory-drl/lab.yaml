question: 発注量でなく目標在庫を学ぶと、発注ルールの学習はどう変わるか
summary: DeepStockは、ニューラルネットワークの出力を目標在庫や需要の係数として読み、式で発注量を計算する。著者は、表せる発注ルールの範囲を狭めずに学習でき、Tmallの対象商品全体へ導入したと報告する。導入前後の比較、旧方式を続けた場合の推計、Labでの式の計算は、別々に確かめた結果である。
