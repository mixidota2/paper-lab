teaching_figures:
- kind: equations
  id: action-remapping
  title: 発注量を出す式に、目標在庫と需要の係数をどう使うか
  after: method
  source: https://arxiv.org/pdf/2603.19621v1
  locator: 導入部pp.3–4
  rationale: 出力を目標在庫と読む場合と、需要の係数と読む場合を分け、Bothで両者を組み合わせる。
  caption: 原論文の式を図にした。μには在庫状態も入るため、目標在庫は固定ではない。
  steps:
  - name: Base：目標から総在庫を引く
    formula: q = max(μBase(I,x) − tot(I), 0)
    explanation: 出力を目標在庫と読み、総在庫との差だけ発注する。
  - name: Coeff：需要特徴に係数を掛ける
    formula: q = μCoeff(I,x)ᵀ feat(x)
    explanation: 過去や予測の需要を表す4つの特徴と定数1に係数を掛けて足す。
  - name: Both：加重和を目標として読む
    formula: q = max(μBoth(I,x)ᵀ feat(x) − tot(I), 0)
    explanation: 需要の重み付き和を目標在庫にし、総在庫との差だけ発注する。
- kind: matrix
  id: policy-design-map
  title: 学習や設計で何を変えるか：DeepStock、SabreAgent、InvEvolve
  after: core_idea
  source: https://arxiv.org/pdf/2603.19621v1
  locator: 導入部；関連Labの一次資料は各ページ参照
  rationale: 3つの研究で、誰が何を決めるかを分けて読む。
  caption: 各Labが論文を読んで整理した表。条件をそろえた性能比較ではない。
  columns:
  - 変更する対象
  - 構造・検証
  - LLMの役割
  rows:
  - label: DeepStock
    cells:
    - 深層強化学習で発注ルールの重みを調整
    - BaseとCoeffの式でモデル出力を発注量に変換
    - 使わない
  - label: SabreAgent
    cells:
    - 数理最適化（OR）へ渡す設計時の事前分布
    - 運用中は設計済みの数理最適化を使う
    - 設計時に使う
  - label: InvEvolve
    cells:
    - 人が読める発注コード
    - 信頼下限（LCB）で候補を検証
    - 方策コードを進化させる
results: results.json
