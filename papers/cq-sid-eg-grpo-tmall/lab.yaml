question: Tmallはなぜ、商品一つずつではなく、似た商品をまとめた群を検索するのか
summary: TmallのCQ-SIDは検索語から商品群を選び、群の商品を既存の順位付けに渡す。著者は検索の2週間のA/Bテストで取引総額が1.15%増えたと報告した。全面導入後に生成経路にも帰属した購入72.63%は別の指標だ。
