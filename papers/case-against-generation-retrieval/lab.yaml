teaching_figures:
- kind: architecture
  id: teacher-student
  title: 学習時の教師と配信時の2塔を分ける
  after: method
  locator: 図1・§4–5
  rationale: 教師の同時入力と生徒の分離入力を空間的に対比する。
  caption: 矢印は情報の受け渡し。CEをオンラインの全商品検索で毎回呼ぶ構成ではない。
  rows:
  - label: 学習時だけの教師
    nodes:
    - title: ユーザー文 ＋ 商品文 → CE
      text: Qwen3-0.6Bで同時に符号化し、yes/noのlogit差を出す。
  - label: 同じ候補集合の分布を蒸留 ↓
    nodes:
    - title: ユーザー塔
      text: 共有LLM → 潜在トークン1段 → EOS → zᵤ
    - title: 商品塔
      text: 共有LLM → EOS → zᵢ。商品更新時に事前計算。
  - label: オンライン検索
    nodes:
    - title: zᵤ → ANN索引 ← zᵢ
      text: 内積が大きい実在商品のIDを返す。
  source: https://arxiv.org/html/2607.25346
- kind: equations
  id: distillation
  title: 教師の順位情報を生徒へ渡す
  after: method
  locator: 式(12)・(17)・(19)
  rationale: 何を蒸留するかを目的関数で具体化する。
  caption: 候補集合Cと温度Tを固定して比較する。θは生徒の学習パラメータ。
  steps:
  - name: 教師と生徒のスコア
    formula: 'sCE(u,i) = ℓyes(u,i) − ℓno(u,i)

      sTT(u,i) = zᵤᵀ zᵢ'
    explanation: 教師は組ごとの相互作用、生徒は独立に作った表現の内積。
  - name: 候補間の好みを移す
    formula: LKD = T² Σᵤ KL(qCE(·|u,C) ∥ pTT(·|u,C))
    explanation: qCEとpTTは各スコアを温度Tのsoftmaxに通した分布。正例だけでなく、候補間の相対関係を学ぶ。
  source: https://arxiv.org/html/2607.25346
