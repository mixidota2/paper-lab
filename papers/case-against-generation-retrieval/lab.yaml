teaching_figures:
- kind: architecture
  id: teacher-student
  title: 教師が学習時に評価し、Two-Towerが配信時に検索する
  after: method
  locator: 図1・§4–5
  rationale: 教師は利用者と商品を一緒に読む。検索モデルは両者を別にベクトルにする。この違いを図で示す。
  caption: 矢印は教師の評価が生徒に渡り、検索結果が作られる順序を示す。配信時にCross-Encoderを全商品に対して動かすわけではない。
  rows:
  - label: 学習時：教師が組ごとに評価する
    nodes:
    - title: Cross-Encoderに利用者文と商品文を入力
      text: 公開データの実験では、Qwen3-0.6Bが両方を一緒に読み、yesとnoのロジットの差を出す。
  - label: 学習時：生徒は同じ候補集合で教師に近づく
    nodes:
    - title: ユーザー塔
      text: 利用者塔は共有の言語モデルを使い、潜在表現の計算を1段加え、EOSから利用者ベクトルzᵤを得る。
    - title: 商品塔
      text: 商品塔は共有の言語モデルを使い、EOSから商品ベクトルzᵢを得る。商品を更新するときに先に計算する。
  - label: 配信時：索引で候補を探す
    nodes:
    - title: zᵤ → ANN索引 ← zᵢ
      text: 近似近傍検索（ANN）の索引は、内積の大きい実在商品のIDを返す。
  source: https://arxiv.org/html/2607.25346
- kind: equations
  id: distillation
  title: 生徒は候補間の関連度を教師から学ぶ
  after: method
  locator: 式(12)・(17)・(19)
  rationale: 学習では、正解の商品の点だけでなく、同じ候補集合での相対的な評価をそろえる。
  caption: 教師と生徒は同じ候補集合Cと温度Tを使う。θは生徒が学習するパラメーターを表す。
  steps:
  - name: 教師と生徒は別の方法で点を付ける
    formula: |-
      sCE(u,i) = ℓyes(u,i) − ℓno(u,i)
      sTT(u,i) = zᵤᵀ zᵢ
    explanation: 教師は利用者と商品を一緒に読んで点を付ける。生徒は別々に作ったベクトルの内積で点を付ける。
  - name: 生徒は候補への確率の配り方を教師に近づける
    formula: LKD = T² Σᵤ KL(qCE(·|u,C) ∥ pTT(·|u,C))
    explanation: 教師と生徒の各スコアに温度T付きのsoftmaxを使い、分布qCEとpTTを作る。生徒は正例だけでなく、候補間の相対的な評価を学ぶ。
  source: https://arxiv.org/html/2607.25346
