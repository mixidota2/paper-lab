summary: Metaの研究チームは言語モデルで利用者と商品をそれぞれベクトルに変え、ベクトル索引から推薦候補を探した。検索モデルは、利用者と商品を一緒に読む教師から、候補間の関連度を学ぶ。
figures: []
core_idea:
  author_claim: |-
    著者は、利用者と商品を同時に読むCross-Encoderを教師とし、同じ候補集合での評価をTwo-Towerへ移した。教師は関連性をyes/noで判定するほか、商品説明の次のトークンも予測する。Two-Towerは両側で同じエンコーダーを使い、各文の末尾からベクトルを作る。利用者側だけに潜在表現での推論を加えるので、商品側は配信前に計算できる。

    [一次資料：§4 / §5 / §6 / §7.2](https://arxiv.org/html/2607.25346)
  research_bot_interpretation: Labは、言語モデルで商品や利用者の意味を捉えながら、検索には索引を使う設計と読む。教師が候補を正しく並べても、検索モデルが同じ順序を保てるとは限らない。商品側の索引は更新まで古い情報を残しうる。生成による推薦全体の優劣を決める結果ではない。
sections:
  overview: |-
    Metaの研究チームは推薦候補を探す際に、言語モデルで商品IDを一つずつ生成する代わりに、利用者と商品をベクトルに変えて検索する方法を試しました。学習時は利用者の履歴と候補商品を同時に読む教師モデルが組ごとに評価します。検索時はその評価を学んだ二塔モデルが利用者と商品を別々に処理するので、商品ベクトルをあらかじめ索引に入れられます。

    Amazonの公開データ3種類では、二塔モデルが正解を候補の上位10件に含めた割合（Recall@10）は生成方式のOneRec-Thinkを4.3〜35.3%上回りました。ただし、正解が上位に来るほど高く評価するNDCGでは、二塔モデルが下回る条件もありました。著者は別の論文が報告したOneRec-Thinkの結果を使っており、両方式を同じモデル規模で学習し直して比較したわけではありません。
  problem: |-
    候補検索では、数百万件の商品から後段に渡す少数の候補を選ぶ。利用者と全商品を一組ずつ言語モデルに読ませると、検索のたびに商品数に応じた処理が要る。商品IDを順に生成する方式では、途中でどの枝を残すか、出力をどう実在の商品につなげるかも決めなければならない。

    Two-Towerは、利用者と商品を別々にベクトルへ変換する。推薦システムは商品側を前もって計算し、検索時に利用者のベクトルに近い商品候補を索引から取り出す。
  why_it_might_work: 教師のCross-Encoderは、利用者と商品を同時に読んで、検索モデルの内積だけでは表しにくい関係も評価できる。その評価をTwo-Towerがどこまで学べるかが要点になる。教師と生徒を同じ候補集合の中で比べる評価と、検索モデルが全商品から候補を拾えるかを測る評価は区別する。
  evidence: |-
    著者は§7.2.1で、Two-Towerが本番DLRMと同程度の正規化エントロピー（NE）に、本番DLRMの学習データ量の0.5%で達したと報告した。NEは低いほどよい予測損失であり、クリック率の改善を示す値ではない。学習データ量の比から、事前学習も含めた総費用の比は分からない。

    著者が§7.2.2で調べたモデルの古さへの耐性は、主に教師のCross-Encoderの結果である。検索を担うTwo-Towerにも同じ耐性があるとは言えない。著者は公開データでの比較を§6に、運用時にどこで計算するかを§5に示す。

    [一次資料：§4 / §5 / §6 / §7.2](https://arxiv.org/html/2607.25346)
  executable_understanding: |-
    Labは人工データの16候補を4つの枝に分けた。全候補から最高点を探す場合と、平均点が高い枝だけを残してから最高点を探す場合を比べる。枝幅は残す枝の数である。平均点が低い枝にも最高点の候補があり得るので、残す枝の数を変え、最高点の候補を見落とすか、いくつの候補を調べるかを確かめる。

    実行するには `uv run papers/case-against-generation-retrieval/run.py` を使う。コードは人工データを作り、比較した全条件を `results.json` に保存する。
  results: 次の表は初期条件と、条件を変えたときの計算結果を示す。Labの人工データで得た数値であり、論文の推薦モデルを実行して測った値ではない。
  what_we_verified: '**メカニズム：PARTIAL（部分的）**。Labが確かめたのは、枝の平均点を使って調べる候補を絞ると、枝幅によって最高点の候補を取り逃す場合があることと、そのとき調べた候補数である。この計算は原論文の推薦モデルを再現していない。'
  what_we_did_not_verify: '**Performance / Scaling / Production applicability: NOT TESTED**。Labは教師や検索モデルを学習せず、商品索引も動かしていない。教師の公開ベンチマークの成績は、検索モデルを本番で動かした結果とは別である。生成検索と比べるなら、商品集合、索引などの更新頻度、応答時間の上限をそろえて測る必要がある。'
  implementation: |-
    この計算に外部ライブラリは使わない。Labの `run.py` が `papers/_toy_common.py` の論文別の関数を呼び、画面で使う全条件と初期条件の表を出力する。

    このコードが表すのは枝を絞る計算だけである。言語モデル、学習、蒸留、近似近傍索引は実装せず、応答時間も実測していない。
  mapping: |-
    | 対象 | 何を参照し、Labで何を作ったか |
    | --- | --- |
    | 原論文 | [§4 / §5 / §6 / §7.2](https://arxiv.org/html/2607.25346) |
    | 図と数式 | Labが著者の仕組みを説明できる範囲に絞って描いた。公式実装を示すものではない。 |
    | 小実験 | `run.py` → `papers/_toy_common.py` → `results.json` |
    | 公式コード | Labは公式コードと行単位で照合していない。 |
