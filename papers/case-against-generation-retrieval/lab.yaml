  - {path: figures/paths.svg, title: "逐次生成と二塔 + ANN の経路", caption: "LLM を使うかと、ID を逐次生成するかは別の選択である。"}
  - {path: figures/distillation.svg, title: "cross-encoder から二塔への蒸留", caption: "教師の候補内 score 分布を、因子化した学生に移す。"}
