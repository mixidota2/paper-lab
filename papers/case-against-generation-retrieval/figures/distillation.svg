<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230"><style>text{font-family:sans-serif;fill:#18201d}.b{fill:#e9eee7;stroke:#245b49;stroke-width:2}.a{stroke:#ae4e2a;stroke-width:2}</style><text x="40" y="30" font-size="20" font-weight="bold">教師が付けた関連度を二塔モデルが学ぶ</text><rect class="b" x="60" y="75" width="180" height="65"/><text x="92" y="105">利用者と商品</text><text x="105" y="128">教師が一緒に読む</text><path class="a" d="M240 107h90"/><text x="250" y="95">候補ごとの</text><text x="250" y="128">関連度</text><path class="a" d="M330 107h90"/><rect class="b" x="420" y="75" width="210" height="65"/><text x="450" y="105">別々にベクトル化</text><text x="460" y="128">二塔モデルが学ぶ</text><text x="160" y="190" fill="#ae4e2a">学習後は利用者と商品を別々に計算できる</text></svg>
