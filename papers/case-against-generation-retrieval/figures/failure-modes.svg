<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230"><style>text{font-family:sans-serif;fill:#18201d}.b{fill:#e9eee7;stroke:#245b49;stroke-width:2}</style><text x="35" y="32" font-size="20" font-weight="bold">二つの方式で何が失敗しうるか</text><rect class="b" x="45" y="60" width="280" height="125"/><text x="70" y="92" font-size="18">商品IDを順に生成</text><text x="70" y="125">・記号を順に出す時間</text><text x="70" y="152">・無効なIDや古いID</text><rect class="b" x="430" y="60" width="280" height="125"/><text x="455" y="92" font-size="18">二塔モデルと商品索引</text><text x="455" y="125">・関連度の表し方に限界</text><text x="455" y="152">・索引に古い情報が残る</text><text x="335" y="125" font-size="22">≠</text></svg>
