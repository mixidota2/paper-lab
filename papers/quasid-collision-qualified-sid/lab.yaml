- id: qualified-margin
  kind: equations
  title: 符号の重なりから、ベクトルを離す損失を求める
  after: method
  locator: 式8–14 / Appendix A.2
  caption: 原論文と同じ条件で組を選び、群ごとに損失の平均を出す。
  rationale: 原論文と同じ条件で組を選び、群ごとに損失の平均を出す。
  steps:
  - name: 除外・式8
    formula: Mᵢⱼ = Mⁱ²ⁱᵢⱼ Mⁱᵗᵉᵐᵢⱼ; Mⁱᵗᵉᵐᵢⱼ = 𝟙[id(i) ≠ id(j)]
    explanation: Mⁱ²ⁱは、起点と対応する正例の組では0、それ以外では1になる。
  - name: 距離・式9–10
    formula: Hᵢⱼ = Σₗ₌₁ᴸ 𝟙[sᵢ⁽ˡ⁾ ≠ sⱼ⁽ˡ⁾]; Dᵢⱼ = 1 − eᵢᵀeⱼ
    explanation: eは、ベクトルzの長さを1にそろえたもの。
  - name: 衝突の2群
    formula: 'Ωfull = {(i,j): Hᵢⱼ=0 ∧ Mᵢⱼ=1}; Ωpartial = {(i,j): 0<Hᵢⱼ≤R ∧ Mᵢⱼ=1}'
    explanation: 同じ商品と正例を除き、全桁一致と一部一致に分ける。
  - name: hinge・式11–12
    formula: Lfull(i,j)=max(0,mfull−Dᵢⱼ); Lpartial(i,j)=max(0,mpartial−Dᵢⱼ)
    explanation: 下限は全桁一致が0.8、一部一致が0.5。組の距離が下限以上なら損失は0になる。
  - name: 群別平均・式13
    formula: LHaMR = λfull ΣΩfull Lfull / (|Ωfull|+ε) + λpartial ΣΩpartial Lpartial / (|Ωpartial|+ε)
    explanation: 各群の損失を足し、その群のpair数とεの和で割る。pairは商品の組を指す。εは正なので組がなくてもゼロで割らない。人工例の重みは0.2と0.1。
  - name: 総損失・式14
    formula: L = Lrec + Lrq + LHaMR + Lcl
    explanation: 元の特徴の再構成、残差量子化、対照学習、反発を一つの損失にまとめる。
  source: https://arxiv.org/html/2603.00632v1
