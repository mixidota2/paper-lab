  version: v1
core_idea:
  author_claim: |-
    著者は、学習中に引き離す組を選別するCVPMと、符号の重なり方に応じて離す距離を変えるHaMRを提案した。この二つを使い、行動履歴が示す商品の近さを保ちながら、別の商品が似た符号に集まりすぎるのを防ぐ。
  research_bot_interpretation: |-
    除外規則が守るのは、同じ商品と、学習データに正例として用意された組に限る。正例に入っていない似た商品も反発の対象になり得る。IDの重複が減ること、正解の商品が推薦候補に残ること、その商品が上位に出ることは、別の結果として測る必要がある。
sections:
  overview: |-
    生成型推薦では、商品を短い符号列（Semantic ID）で表します。別の商品に同じ符号が付くと、推薦モデルがその符号を出しても、どちらの商品かを区別できません。QuaSIDの著者は、同じ商品が繰り返し出た組と、行動履歴から近付けるよう指定した組（正例）を、引き離す対象から外しました。残った組では、違う桁が少ない組を選び、符号に変換する前のベクトルが近すぎると損失を加えます。全桁が同じ組には、一部だけが同じ組より大きな距離の下限を設けます。この方法は、正例に指定されていない商品が実際に似ているかどうかを判定するものではありません。

    著者は公開データの推薦モデルをTIGERにそろえ、符号の作り方を変えて比べました。Amazon Beautyでは、正解を上位に出せたかを測るNDCG@10が、RQ-Kmeansの0.0211からQuaSIDの0.0230に上がりました。別の比較では、組を除外する処理と、ベクトルを離す損失を一つずつ外すと、どちらの場合もNDCG@5が下がりました。

    Kuaishouの通販で5日間行った試験では、生成型の候補取得で符号の作り方を替えると、特定のシナリオの取引総額（GMV-S2）が対照群より0.55%増えました。既存の順位付けに符号から作った特徴量を加えた場合は、同じ指標が2.38%増えました。組の除外とベクトルを離す処理それぞれが、本番の取引総額をどれだけ増やしたかは分かりません。
  method: method.md
  problem: |-
    生成型推薦は、履歴から商品そのものではなく、商品を表す短い符号列（Semantic ID、以下SID）を予測する。異なる商品が同じ符号を持つと、モデルがその符号を当てても、それだけではどの商品を返せばよいか分からない。

    ただし、同じ商品が学習データに繰り返し登場するのは混同ではない。また、行動履歴から近付ける組として選んだ商品は、符号が似ているというだけで引き離すと、近付ける学習と逆向きの力がかかる。
  why_it_might_work: |-
    著者は、まずCVPMで同じ商品と、行動履歴から作った正例を除く。次に残った組について、SIDの同じ位置にある符号が何桁違うかを数える。この数をHamming距離という。HaMRは、違う桁がゼロの組に大きな距離の下限を、一部の桁だけが異なる組に小さな下限を使う。

    学習が直接調整するのは、符号の桁ではなく、量子化前のベクトルの向きだ。ベクトルがコサイン距離の下限まで離れると、その組の損失はゼロになる。しかし、二つのベクトルが依然として量子化器の同じ領域に入るなら、SIDは変わらない。
  evidence: |-
    ### 同じ推薦モデルで、SIDの作り方を比べた

    著者はAmazon BeautyとToys & Gamesのレビュー履歴を使った。記録が5件未満のユーザーと商品を除き、ユーザーごとの履歴から評価用の記録を取り分けた（leave-one-out）。商品テキストの埋め込みはSentence-T5-XXL、生成型推薦モデルはTIGERに統一した。公開データでは各3桁に256通り、本番設定では各4桁に1,024通りの符号を使った。

    [一次資料の表2](https://arxiv.org/html/2603.00632v1#S5)は、公開データで5つの乱数シードを使った平均を示す。正解が上位10件の何位に入ったかを反映するNDCG@10は、BeautyでRQ-Kmeansの0.0211からQuaSIDの0.0230に、Toysで0.0213から0.0225に上がった。表5では、著者がQuaSIDの構成を一つずつ外して比べた。BeautyのNDCG@5は、全構成で0.0193、組を除外するCVPMを外すと0.0181、ベクトルを離す損失HaMRを外すと0.0170だった。表5が測ったのは公開データでの推薦順位であり、本番の取引総額ではない。

    ### 符号の偏りが減っても、正解が入るとは限らない

    論文は、各SIDを持つ商品数を全商品数で割り、その頻度の分布からエントロピーを計算した。この値が高いほど、割り当てが一部のSIDに偏りにくい。ただし、ToysでSimRQはRQ-Kmeansよりエントロピーが高かった（9.3688対9.3460）が、NDCG@10は低かった（0.0190対0.0213）。表3は、QuaSID全体ではなく、HaMRだけを別の学習方式に加えた比較だ。たとえばRQ-OPQにHaMRを追加すると、Toysで正解が上位5件に入った割合（HR@5）が0.0228から0.0227に下がった。HaMRを足した方式の中には、QuaSIDよりエントロピーが高いものもあった。符号の分布、正解が入った割合、正解の順位はそれぞれ違う指標だ。

    ### 本番では、候補取得と順位付けを分けて比べた

    [表4と§5.4](https://arxiv.org/html/2603.00632v1#S5.SS4)では、Kuaishouがオンラインのトラフィックの約5%（2,000万人超）を介入群に無作為に割り付け、5日間比較した。生成型の候補取得では、SIDの作り方を替えるとGMV-S2が対照比で0.55%増えた。順位付けでは、既存モデルにSIDから作った特徴量を加えると同じ指標が2.38%増えた。GMV-S2は特定のシナリオでの取引総額であり、第2段の順位付けを指す名称ではない。著者はシナリオの詳しい内訳を示していない。二つの介入は別なので増加率は足せない。著者は本番でCVPMやHaMRだけを外した結果を示しておらず、どちらが取引総額をどれだけ増やしたかは分からない。

    通常の候補取得で、最初の48時間に再生が100回未満だった動画（100vv）の完了注文数は、対照比で6.42%増えた。600回未満の動画（600vv）では4.69%増えた。この区分は新規ユーザーを指さず、互いに排他的な群でもない。同じ100vvの行で、1,000露出あたりの取引総額（GPM）は0.21%増だった。注文数の伸びと露出あたりの取引総額の伸びは別に読む。著者は表4の結果をすべて有意と報告するが、信頼区間や正確なp値は示していない。
  executable_understanding: |-
    `uv run papers/quasid-collision-qualified-sid/run.py`

    Labは、履歴の起点となる3件と、対応する正例3件をつないだ架空の学習データを使う。この6件から順序付きの組を作り、同じ商品、対応する正例、全桁一致、一部一致、違う桁が多い組を区別する。二つ目の例では、一方のベクトルの向きを固定し、もう一方の角度を損失の勾配に従って80回更新する。
  results: |-
    CVPMなしでは全桁一致6組、一部一致16組が反発の計算に入った。CVPMを使うと、同じ商品と正例が除かれ、全桁一致2組、一部一致14組になった。これらの件数は、順番を入れ替えた組を別に数えている。角度だけを動かす例ではコサイン距離が約0.020から約0.823に増えた。どちらの例でもSIDを固定しているので、異なる商品が同じSIDを持つ状態は解消していない（NOT OBSERVED）。
  what_we_verified: |-
    Labは、除外の条件、比較する桁数の上限、群ごとの平均、空の群でも損失が有限になることを確認した（CONFIRMED）。全桁が一致する組は距離0.8、一部が一致する組は距離0.5で反発が止まる。確認できたのは角度を動かすところまでで、QuaSID全体の学習を再現したわけではない（Mechanism PARTIAL）。
  what_we_did_not_verify: |-
    Labでは、商品特徴の抽出、Swingによる正例づくり、残差量子化器とデコーダの学習、離散選択の勾配近似、TIGERの学習を実行していない。再割り当て後のSIDの重複、候補取得の精度、最終順位、GMVの再現、規模を大きくしたときの挙動は未検証（NOT TESTED）。表3の追加実験は、同じ勾配学習で損失を足せないRQ-Kmeansを対象にしていない。どの量子化器にもそのまま適用できるとはいえない。
  implementation: |-
    `qualified()`は、商品IDと並び順から式8の除外条件を調べる。`pair_loss()`は式11–12の損失を、`hamr()`は式13の群ごとの平均を計算する。全桁一致と一部一致を一緒に平均せず、二つの平均を別々に重み付けして足す。`angular_update()`は二次元ベクトルの片方だけを動かす。`results.json`には組ごとの距離、判定、損失を残す。
