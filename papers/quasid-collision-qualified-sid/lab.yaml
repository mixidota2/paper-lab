question: 同じSemantic IDを持つ商品を、学習でいつ引き離すべきか？
summary: QuaSIDは、同じ商品や行動履歴から作った正例を残し、それ以外でSemantic IDが似すぎた商品の表現を引き離す手法です。推薦モデルをTIGERにそろえた比較では、Amazon BeautyのNDCG@10がRQ-Kmeansの0.0211からQuaSIDの0.0230に上がりました。Kuaishouの本番試験では、候補取得と順位付けに別々に導入し、著者はそれぞれの効果を報告しました。
