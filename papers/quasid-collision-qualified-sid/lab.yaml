- id: qualified-margin
  kind: equations
  title: 離散の重なりを、連続空間の反発へ変える
  after: method
  locator: 式8–14 / Appendix A.2
  caption: 原式の条件付けと正規化を保ち、記号をUnicodeで表記。
  rationale: 原式の条件付けと正規化を保ち、記号をUnicodeで表記。
  steps:
  - name: 除外・式8
    formula: Mᵢⱼ = Mⁱ²ⁱᵢⱼ Mⁱᵗᵉᵐᵢⱼ; Mⁱᵗᵉᵐᵢⱼ = 𝟙[id(i) ≠ id(j)]
    explanation: Mⁱ²ⁱは対応するtrigger–target正例で0、それ以外で1。
  - name: 距離・式9–10
    formula: Hᵢⱼ = Σₗ₌₁ᴸ 𝟙[sᵢ⁽ˡ⁾ ≠ sⱼ⁽ˡ⁾]; Dᵢⱼ = 1 − eᵢᵀeⱼ
    explanation: eはzをL2正規化したvector。
  - name: 衝突の2群
    formula: 'Ωfull = {(i,j): Hᵢⱼ=0 ∧ Mᵢⱼ=1}; Ωpartial = {(i,j): 0<Hᵢⱼ≤R ∧ Mᵢⱼ=1}'
    explanation: 同一itemと正例を除いてから群へ入れる。
  - name: hinge・式11–12
    formula: Lfull(i,j)=max(0,mfull−Dᵢⱼ); Lpartial(i,j)=max(0,mpartial−Dᵢⱼ)
    explanation: mfull=.8 ≥ mpartial=.5。閾値以上へ離れたpairは0。
  - name: 群別平均・式13
    formula: LHaMR = λfull ΣΩfull Lfull / (|Ωfull|+ε) + λpartial ΣΩpartial Lpartial / (|Ωpartial|+ε)
    explanation: ε>0で空集合も扱う。toyの重みは.2 / .1。
  - name: 総損失・式14
    formula: L = Lrec + Lrq + LHaMR + Lcl
    explanation: 再構成とRQの忠実性、協調関係、反発を同時に最適化する。
  source: https://arxiv.org/html/2603.00632v1
