  version: v1
core_idea:
  author_claim: 著者は、反発対象を限定するCVPM（Conflict-Aware Valid Pair Masking）と、Hamming距離に応じたHaMR（Hamming-guided Margin Repulsion）を提案する。再構成・残差量子化・協調contrastive
    lossとともに学習し、推薦に必要な近さを保ちながら不適切な重なりを減らすと主張する（§4）。
  research_bot_interpretation: 「qualified」は意味の正しさを保証する認証ではない。同一IDと構築済み正例を除外した残りを候補衝突と扱う、観測可能な規則である。未観測の良い関係は残り得る。コードの一意性だけを目標にすると、一般化に役立つ共有まで消すため、推薦指標と合わせて評価したい。
sections:
  overview: QuaSIDは、SIDの重なりから反発対象を選ぶ学習法である。同一itemと協調正例をmaskで除き、完全衝突と部分衝突に異なる幾何マージンを課す。KuaishouはrankingのGMV-S2 +2.38%、cold-start
    retrievalの注文数+6.42%を報告する。衝突ゼロの保証と、害のある衝突を減らす学習を区別する。
  method: method.md
  problem: 同じSIDが付いた2例でも、異なる商品を誤って一緒にした場合と、同一商品の重複サンプリングでは意味が違う。協調学習で近付けたいtrigger–targetの正例もある。低いHamming距離をすべて反発させると、contrastive
    lossと逆向きの学習信号を作ってしまう。
  why_it_might_work: Hamming距離は離散コードでの混同を検出し、cosine距離は連続encoderへ勾配を渡す。両者をつなぐことで、単なる再構成誤差が見落とす混同へ圧力を掛けられる。CVPMは既知の良い重なりを保護する。もっとも、現在のコードが等しい理由を完全には分類できず、反発を強めすぎると意味の近さを壊す。
  evidence: '### 同じTIGERでtokenizerを比べる


    Amazon-BeautyとToys & Gamesの5-core、leave-one-out評価。文字属性はSentence-T5-XXLで埋め込み、全方式でTIGERを使う。5 seedsの平均で、offlineは3層×256コード、産業設定は4層×1024コード。Table
    2のBeauty NDCG@10はRQ-Kmeans 0.0211、QuaSID 0.0230。Toysは0.0213対0.0225である。


    Table 5でCVPMを外すとBeauty NDCG@5が0.0193→0.0181、HaMRを外すと0.0170になる。一方、Table 3のRQ-OPQ＋HaMRはToys HR@5が0.0228→0.0227へわずかに低下する。全方式・全指標の一律改善ではない。[Tables
    2–5](https://arxiv.org/html/2603.00632v1#S5)


    ### entropyを上げれば推薦が良くなるとは限らない


    SID composition entropyはコード利用の多様性である。ToysのSimRQはentropy 9.3688でRQ-Kmeansの9.3460より高いが、NDCG@10は0.0190で0.0213より低い。HaMRだけを足した方式で、QuaSIDよりentropyが高くなる例もある。意味・協調信号と識別の両方が要るという解釈を支えるが、相関だけで因果機構は確定しない。


    ### GMV-S2はシナリオ別の売上指標


    5日間、約5%のtraffic、2000万人超を含むtreatmentをランダム割付したA/B。GMV-S1/S2はシナリオ別のGMVであり、第二段rankerの改善率という意味ではない。rankingへのSID特徴追加はGMV-S2
    +2.38%、generative retrievalのtokenizer置換は+0.55%。介入位置が違うので足し合わせない。


    cold-startの100vv / 600vvは、最初の48時間でviewが100未満 / 600未満の動画。互いに排他的な群とは読めない。retrieval 100vvの注文数+6.42%は新規ユーザー全体の効果ではない。著者は表4の全結果を有意とするが、信頼区間や正確なp値は示していない。[§5.4、Table
    4](https://arxiv.org/html/2603.00632v1#S5.SS4)


    上記は一次資料の著者報告であり、このLabの合成実験値とは分けている。'
  executable_understanding: '`uv run papers/quasid-collision-qualified-sid/run.py`


    trigger3件とtarget3件を連結した6例で、同一item・構築正例・完全衝突・部分衝突・半径外を区別する。全ordered pairについてmaskと群別平均を計算し、maskなしと比較する。別の2次元例では一方の方向を固定し、hinge
    lossの勾配で他方の角度を80回更新する。'
  results: CVPMを有効にすると同一itemと構築正例の反発が0になる。完全衝突は距離0.8、部分衝突は0.5に達するとhingeが消える。角度の更新では連続距離が増えるが、固定したSIDは変わらない。したがってこの教材での離散衝突減少はNOT
    OBSERVEDである。これはQuaSID全体への反証ではなく、実装していない離散再割当の効果を計上しないための表示である。
  what_we_verified: CONFIRMED：CVPMの同一ID・正例除外、Hamming半径の境界、群ごとの平均、空集合でも有限のloss、0.8/0.5のhinge条件。Mechanism PARTIAL：encoderの角度に掛かる力まで。固定SIDでの衝突減少はNOT
    OBSERVED。
  what_we_did_not_verify: Performance / Scaling / Production applicabilityはNOT TESTED。Sentence-T5-XXL、Swingの正例構築、RQ
    codebook・decoderの学習、STE、TIGER、KuaishouのGMVは未検証。CVPMが真の意味衝突を完全に判定するとは確認していない。任意のquantizerにHaMRを足せるとも断定しない。Table
    3は同じend-to-end勾配学習に属さないRQ-Kmeansを除いている。
  implementation: '`qualified()` は連結batchの位置とitem IDから式8のmaskを作る。`pair_loss()` は式11–12、`hamr()` は式13の完全・部分集合をそれぞれ平均する。両群を一括で平均しない。`angular_update()`
    は片方を固定した2次元方向の更新で、全モデルのSGDではない。`results.json`にはpairごとの距離・判定・lossを残す。'
