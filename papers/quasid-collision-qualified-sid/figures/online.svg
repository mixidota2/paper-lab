<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 363" role="img" aria-labelledby="title desc"><title id="title">GMV-S2を比べた二つの変更</title><desc id="desc">生成型の候補取得ではトークナイザーを替え、順位付けではSID特徴を加えた。二つの介入は別々の比較であり、GMV-S2の増加率は足さない。</desc><rect width="440" height="363" rx="16" fill="#f4f7f6"/><g font-family="sans-serif" fill="#163b40"><text x="22" y="33" font-size="20" fill="#163b40">GMV-S2を比べた二つの変更</text><rect x="20" y="84" width="400" height="106" rx="9" fill="#dfede8"/><text x="33" y="110" font-size="17" fill="#163b40">生成型の候補取得</text><text x="33" y="149" font-size="30" fill="#163b40">+0.55%</text><text x="182" y="148" font-size="16" fill="#163b40">GMV-S2</text><text x="33" y="175" font-size="15" fill="#163b40">トークナイザーを替える</text><rect x="20" y="208" width="400" height="106" rx="9" fill="#dfede8"/><text x="33" y="234" font-size="17" fill="#163b40">順位付け</text><text x="33" y="273" font-size="30" fill="#163b40">+2.38%</text><text x="182" y="272" font-size="16" fill="#163b40">GMV-S2</text><text x="33" y="299" font-size="15" fill="#163b40">SIDの特徴を加える</text><text x="22" y="343" font-size="14" fill="#163b40">原論文 Table 4 の著者報告。2つの値は足さない。</text></g></svg>
