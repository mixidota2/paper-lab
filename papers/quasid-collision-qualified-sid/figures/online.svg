<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 363" role="img" aria-labelledby="title desc"><title id="title">同じGMVでも、介入位置が違う</title><desc id="desc">同じGMVでも、介入位置が違う。詳細は図の説明と本文を参照。</desc><rect width="440" height="363" rx="16" fill="#f4f7f6"/><g font-family="sans-serif" fill="#163b40"><text x="22" y="33" font-size="20" fill="#163b40">同じGMVでも、介入位置が違う</text><rect x="20" y="84" width="400" height="106" rx="9" fill="#dfede8"/><text x="33" y="110" font-size="17" fill="#163b40">Generative retrieval</text><text x="33" y="149" font-size="30" fill="#163b40">+0.55%</text><text x="182" y="148" font-size="16" fill="#163b40">GMV-S2</text><text x="33" y="175" font-size="15" fill="#163b40">tokenizerを置換</text><rect x="20" y="208" width="400" height="106" rx="9" fill="#dfede8"/><text x="33" y="234" font-size="17" fill="#163b40">Ranking</text><text x="33" y="273" font-size="30" fill="#163b40">+2.38%</text><text x="182" y="272" font-size="16" fill="#163b40">GMV-S2</text><text x="33" y="299" font-size="15" fill="#163b40">SID特徴を追加</text><text x="22" y="343" font-size="14" fill="#163b40">Table 4の著者報告。2つの値を足さない。</text></g></svg>
