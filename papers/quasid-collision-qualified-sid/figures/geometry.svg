<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 520" role="img" aria-labelledby="title desc"><title id="title">コードの重なりを、角度でほどく</title><desc id="desc">コードの重なりを、角度でほどく。詳細は図の説明と本文を参照。</desc><rect width="440" height="520" rx="16" fill="#f4f7f6"/><g font-family="sans-serif" fill="#163b40"><text x="22" y="33" font-size="20" fill="#163b40">コードの重なりを、角度でほどく</text><text x="22" y="62" font-size="15" fill="#163b40">QuaSID / Hamming → cosine margin</text><path d="M73 255 L265 255" fill="none" stroke="#628287" stroke-width="2"/><path d="M73 255 L73 78" fill="none" stroke="#628287" stroke-width="2"/><path d="M73 255 L232.37776133769628 212.29485755808406" fill="none" stroke="#be6238" stroke-width="2"/><circle cx="232.37776133769628" cy="212.29485755808406" r="5" fill="#be6238"/><path d="M73 255 L155.5 112.10580837556762" fill="none" stroke="#49749d" stroke-width="2"/><circle cx="155.5" cy="112.10580837556762" r="5" fill="#49749d"/><path d="M73 255 L105.99999999999994 93.33367697631024" fill="none" stroke="#087569" stroke-width="2"/><circle cx="105.99999999999994" cy="93.33367697631024" r="5" fill="#087569"/><text x="278" y="243" font-size="15" fill="#163b40">eᵢ（固定）</text><text x="22" y="297" font-size="22" fill="#163b40">D = 1 − cos θ</text><rect x="20" y="318" width="400" height="74" rx="9" fill="#e5e9f0"/><text x="32" y="345" font-size="18" fill="#163b40">部分：m = 0.5 → θ ≥ 60°</text><text x="32" y="374" font-size="18" fill="#163b40">完全：m = 0.8 → θ ≥ 78.46°</text><text x="22" y="420" font-size="16" fill="#163b40">同一item・協調正例は反発を除外。</text><text x="22" y="451" font-size="15" fill="#163b40">角度が開いてもSIDの一意性は保証しない。</text><text x="22" y="488" font-size="14" fill="#163b40">境界角はmarginから算出した説明用の値。</text><text x="134" y="108" font-size="15" fill="#087569">完全：78.46°</text><text x="181" y="145" font-size="15" fill="#49749d">部分：60°</text><text x="274" y="207" font-size="15" fill="#be6238">初期：15°</text></g></svg>
