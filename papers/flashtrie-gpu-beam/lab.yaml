core_idea:
  author_claim: |-
    著者は、整数トークン用の圧縮辞書Narrow-LOUDSと全段階をまとめて処理するCUDAカーネルにより、検索品質を保ちながら辞書探索を速め、同じ時間内で候補をより多く残せると報告しました（§2–4）。
  research_bot_interpretation: |-
    FlashTrieは辞書の照会だけでなく、候補を伸ばす処理と、照会後に上位の候補を残す処理もGPUで行います。本番A/Bでは候補数の上限も変えたため、収益差からGPUへの移行だけの効果は分かりません。
sections:
  problem: |-
    生成検索では、モデルが作ったID列が登録辞書にあるかを確かめます。探索の各段階で残す候補の上限をビーム幅と呼びます。ビーム幅を広げるほど、探索は辞書の多くの枝を調べます。CPUの圧縮辞書はメモリを節約しますが、ポインタをたどる処理、子の探索、ヒープでの候補の選別、GPUとのやり取りに時間がかかります。

    検索広告では、応答時間の制限内で候補を増やせるかが問題になります。同じビーム幅で検索品質を保てるかと、より広いビーム幅が収益につながるかは、別々に確かめる必要があります。
  evidence: |-
    ### 辞書探索の時間と、候補の検索品質を比べる

    表6の辞書8億件の条件で、ビーム幅を100から1,000に広げると、CPUの平均時間は9.0から46.3 msに、GPUの平均時間は0.6から1.9 msになりました。GPUの95パーセンタイルは0.6から2.8 msに、99パーセンタイルは0.7から3.3 msになりました。表6は各値を10回の測定の中央値として示します。要旨の「3 ms未満」を、すべてのパーセンタイルに当てはめることはできません。

    表1では、FlashTrieのP@100はビーム幅100の0.53から、幅1,000の0.78に上がりました。これは教師モデルによる候補評価で、広告のクリック率ではありません。著者は同じビーム幅でのCPUとGPUの精度差が0.001以内と報告しています。P@200について、脚注はビーム幅100のときP@100と同じと説明しますが、表の値は0.52と0.53です。この図はP@100だけを使います。

    ### 本番A/Bでは、辞書の処理方式と探索設定を同時に変えた

    著者は16日間の本番A/Bで、同じモデルと後段の順位付け・広告オークション・配信ペース制御を使いました。対照群はCPU版のMARISA-Optでビーム幅200、処置群はA100の10 GBの区画（MIG）でFlashTrieを動かし、幅600にしました（§4.8、表3、Appendix G）。

    英語の広告検索では、対照群に比べて収益が+0.71%、カバレッジが+0.22%、広告表示機会あたりの期待値（Impression Yield）が+0.21%、クリック数が+0.17%で、遅延は−32%でした。英語以外では同じ順に+0.68%、+0.25%、+0.37%、+0.20%、−32%でした。有意水準はα=0.05です。著者が監視した問題指標の差は±1%以内で、有意ではありませんでした。

    [STATIC](static-constrained-gr.html)の0.033 msは、探索1段階の制約処理が増やす時間です。FlashTrieの表6は要求ごとの辞書探索を、本番A/Bの−32%は検索サービスが要求を受けて候補集合を返すまでを測ります。NEZHAの無効SID対策と比べるときも、どのIDを有効とするかと、どこからどこまで測るかを揃える必要があります。

    <figure class="teaching batch17"><h3>辞書探索の時間から、条件を満たすビーム幅を読む</h3><div data-b17="slo"><label>辞書探索の99パーセンタイルの上限（この図の条件）<select data-control><option value="1">1 ms</option><option value="2">2 ms</option><option value="3" selected>3 ms</option><option value="4">4 ms</option></select></label><p data-output aria-live="polite">上限を3 msにすると、表で条件を満たす最大のビーム幅は700です。GPUの99パーセンタイルは2.8 msで、P@100は0.77です。</p><script type="application/json" data-values>[[100, 9, 0.6, 0.7, 0.53], [200, 14.9, 0.7, 0.9, 0.68], [300, 20.1, 0.9, 1.2, 0.72], [400, 25.3, 1.1, 1.6, 0.74], [500, 29.5, 1.4, 2, 0.75], [600, 33.4, 1.6, 2.6, 0.76], [700, 36.3, 1.6, 2.8, 0.77], [800, 40.5, 1.9, 3.2, 0.77], [900, 42.9, 1.9, 3.3, 0.78], [1000, 46.3, 1.9, 3.3, 0.78]]</script></div><div class="matrix-scroll" tabindex="0" role="region" aria-label="ビーム幅ごとの辞書探索時間と検索品質"><table><thead><tr><th>ビーム幅</th><th>CPU平均（ms）</th><th>GPU平均（ms）</th><th>GPU p99（ms）</th><th>P@100</th></tr></thead><tbody><tr><td>100</td><td>9</td><td>0.6</td><td>0.7</td><td>0.53</td></tr><tr><td>200</td><td>14.9</td><td>0.7</td><td>0.9</td><td>0.68</td></tr><tr><td>300</td><td>20.1</td><td>0.9</td><td>1.2</td><td>0.72</td></tr><tr><td>400</td><td>25.3</td><td>1.1</td><td>1.6</td><td>0.74</td></tr><tr><td>500</td><td>29.5</td><td>1.4</td><td>2</td><td>0.75</td></tr><tr><td>600</td><td>33.4</td><td>1.6</td><td>2.6</td><td>0.76</td></tr><tr><td>700</td><td>36.3</td><td>1.6</td><td>2.8</td><td>0.77</td></tr><tr><td>800</td><td>40.5</td><td>1.9</td><td>3.2</td><td>0.77</td></tr><tr><td>900</td><td>42.9</td><td>1.9</td><td>3.3</td><td>0.78</td></tr><tr><td>1000</td><td>46.3</td><td>1.9</td><td>3.3</td><td>0.78</td></tr></tbody></table></div><figcaption>著者は同じ教師モデルで検索要求13,000件の候補を採点し、要求ごとの上位100件の精度（P@100）を平均しました。論文の本文は、関連性を判定するしきい値や、候補が足りないとき・出力が空のときの分母を明示していません。<a href="https://arxiv.org/html/2607.10044v1">原論文§4.5・Appendix E</a>。図の値は表1・表6の公表値です。図で選ぶ上限は辞書探索に対する条件で、本番サービス全体の30 msのSLAとは対象が違います。表にない幅や機器の値は補っていません。</figcaption></figure>

    [一次資料：版を固定したPDF](https://arxiv.org/pdf/2607.10044v1)。確認した節・表とPDFのSHA-256は末尾の対応表に記載します。
  overview: |-
    広告検索では、辞書にあるキーワードだけを候補に残しながら、検索結果を短時間で返す必要があります。FlashTrieは、途中まで作った候補を伸ばし、辞書に照らして確認し、有力な候補だけ残す処理をGPUにまとめます。

    8億件のキーワード辞書を使い、各段階で残す候補の上限を1,000にした測定では、1リクエストの辞書探索は従来のCPU方式で平均46.3 ms、FlashTrieで平均1.9 msでした。FlashTrieの遅い側の目安である99パーセンタイルは3.3 msです。英語の広告検索を対象とした別の本番A/Bでは収益が0.71%増えましたが、この試験では処理先だけでなく探索で残す候補数も変えています。
  why_it_might_work: |-
    探索中の候補列は、同じ先頭部分を持つことがあります。Labの解釈では、辞書をGPUのメモリに置いておけば、その部分をGPU内で参照できます。GPUは候補列どうしと、各列に対する上位 K 件の提案の両方を並列に処理します。著者の図4では、ビーム幅を広げるにつれて、辞書をたどる処理よりも提案の検査に時間がかかるようになります。

    候補を増やしても、検索広告の収益が必ず伸びるわけではありません。増えた候補の関連性と、後段で扱える候補数にも左右されます。遅い要求に対する余裕を見積もるときは、平均だけでなく、99パーセンタイルなども確認します。
  method: method.md
  executable_understanding: |-
    Labは、前のトークンで次の確率が変わらない非自己回帰の人工例を用意しました。CPUで2段階の探索を行うと、候補を1件だけ残す設定は最終的に最も確率が高い列を途中で捨て、2件残す設定はその列を残します。また、位置ごとに使えるトークンだけを調べても、辞書にない列を除けないことがあります。この実験ではGPUの時間を測りません。
  results: |-
    以下は人工例を計算した結果です。著者が本番A/Bで測った値ではありません。
  what_we_verified: |-
    **Mechanism: PARTIAL**。Labは人工例で候補を絞る手順と、辞書にない列が残る条件を確かめました。`results.json`の`checks`で`CONFIRMED`とした項目は、この人工例だけに当てはまります。入力は`run.py`、出力は`results.json`で読めます。
  what_we_did_not_verify: |-
    **Performance / Scaling / Production applicability: NOT TESTED**。LabはCUDA、Narrow-LOUDSの圧縮率、辞書8億件の動作、教師モデルによる精度評価、30 msの本番SLA、収益効果を検証していません。ページの遅延上限の操作は、著者の公表表から条件を満たす測定行を選ぶもので、新しい測定ではありません。
  implementation: |-
    Pythonの標準ライブラリだけで動きます。リポジトリのルートで `uv run papers/flashtrie-gpu-beam/run.py` を実行すると、同じフォルダーの`results.json`を更新します。乱数も外部APIも使いません。

    [実行コード](../downloads/flashtrie-gpu-beam/run.py)・[全結果](../downloads/flashtrie-gpu-beam/results.json)・[README](../downloads/flashtrie-gpu-beam/README.md)・[方法](../downloads/flashtrie-gpu-beam/method.md)・[対応表](../downloads/flashtrie-gpu-beam/mapping.md)を保存できます。

    著者は査読後に公式実装を公開する予定だと記しています。Labが照合した一次資料からは取得できませんでした。MARISAは論文の比較対象です。
