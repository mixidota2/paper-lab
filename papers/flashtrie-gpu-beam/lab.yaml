teaching_figures:
- kind: equations
  id: method-equations
  title: 候補の採点・検査・選別を式で読む
  after: method
  caption: 三つの式は、探索が候補に点を付け、辞書で検査し、残す順番を示します。
  rationale: 候補の点数と、辞書に登録されているかどうかを区別します。
  source: https://arxiv.org/pdf/2607.10044v1
  locator: §2、Algorithm 1
  steps:
  - name: 採点
    formula: σ′=σ+log p(x_t|x_<t)
    explanation: 人工例では、前のトークンが何であっても、次の位置に同じ確率表を使います。
  - name: 制約
    formula: 'next={prefix+v : child(prefix,v) exists}'
    explanation: 探索は、現在までの候補列に続く枝が辞書にあるときだけ、提案を残します。
  - name: 選別
    formula: active=TopB(next)
    explanation: FlashTrieは候補をGPU上でまとめ、点数が高いものを上位 B 件まで残します。
