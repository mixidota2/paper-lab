question: FlashTrie：辞書探索をGPUに移すと、より多くの候補を残せるか
summary: FlashTrieは候補を伸ばし、圧縮辞書で検査し、上位の候補を残す処理をGPUにまとめます。辞書8億件の測定では平均0.6〜1.9 ms、99パーセンタイルは最大3.3 msでした。本番A/Bで報告された英語の収益+0.71%と遅延−32%は、辞書の処理方式と探索設定を同時に変えた結果です。
