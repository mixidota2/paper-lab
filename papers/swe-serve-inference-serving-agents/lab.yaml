question: 関数のテストを通った変更は、推論サーバーを起動しても動くか
summary: 著者らはSGLangを変更する53課題を用意し、そのうち19課題で実モデルを使うテストも行いました。19課題の同じ627件を採点し直すと、実モデルを使うテストを外しただけで合格率は45.9%から69.4%に上がりました。
