id: ra-dfl-risk-aware-decision-focused-inventory
title: Risk-Aware Decision-Focused Demand Forecasting for Multi-Channel Inventory Optimization under Promotion
  and Stock-Out Constraints
authors:
- Xuguang Zhang
- Yongbin Yang
- Ying Wang
year: 2026
submitted: '2026-09-10'
topics:
- demand-forecasting
- retail-supply
urls:
  paper: https://hbemdata.org/index.php/ojs/article/view/198
  pdf: https://hbemdata.org/index.php/ojs/article/download/198/176
  doi: https://doi.org/10.54097/ag16zy57
verdict: Radar
status: published
summary: M5の著者報告では、在庫配分の費用を使って需要予測を学ぶと、予測を先に学ぶ基準より費用が3.7%減った。一方、その基準予測に高費用時のリスクを考慮する配分だけを足すと9.7%増えた。欠品と販促は代理指標のため、実店舗の効果は未確認。
question: 費用が特に高くなる場合を考慮すると、在庫配分の費用は下がるか
verification:
  mechanism: PARTIAL
  performance: NOT TESTED
  scaling: NOT TESTED
  production_applicability: NOT TESTED
core_idea:
  author_claim: 著者は、需要の分位点とリスクの重みを予測し、その予測で在庫を配った結果から予測器を学習する。配分の平均費用と高費用側の平均（CVaR）を評価し、欠品時は観測売上を超えた発注に余剰の罰則をかけない。M5で、予測を先に学ぶ基準より費用が下がったと報告している。
  research_bot_interpretation: このLabで注目するのは、高費用側を考慮する判断を追加するだけでは、基準の費用がむしろ増えたことだ。観測売上と代理指標を使った評価であり、本文と表の不一致もある。導入を勧める結果ではなく、追って検証したい比較として扱う。
sections:
  overview: 'RA-DFLは、需要予測の正確さではなく、その予測で在庫を配った場合の費用を使って予測器を学習する。論文のM5実験では、LightGBMで需要の分位点を先に予測してから配分を決める基準手法（LightGBM-QR
    PTO）の平均費用4.903に対し、RA-DFLは4.721だった（3.7%減）。同じ基準予測に高費用側のリスクを考慮する配分だけを組み合わせると、5.380だった（9.7%増）。


    いずれも著者の報告値で、Labの再学習結果ではない。論文はHighlights in Business, Economics and Management（MSIED 2026、Vol.69）に掲載。販促・欠品は代理指標を使い、評価の需要は観測売上で代用している。本文の引用と表に確認が必要な点もあるため、読書判定はRadar（今後の検証を追う）とする。'
  problem: 同じ商品を販売する複数のチャネルに、限られた在庫容量を割り振る。余ったチャネルから足りないチャネルに在庫を移すことを横持ちと呼ぶ。この設定では販促時に欠品の罰則が大きくなる。在庫がA個しかなければ需要Dがそれ以上でも売上はA個、つまりy=min(D,A)でしか観測できない。欠品時に売上を需要そのものとみなすと、もっと売れたはずなのに追加在庫を余剰と判定してしまう。
  why_it_might_work: '【Labの解釈】需要予測の誤差が同じでも、どの販売先に置くべき在庫がずれたかで費用は異なる。配分後の平均費用に加えて、特に費用が高い場合の平均も学習に使えば、予測器が配分に重要な誤差を重く扱う余地がある。ただし、著者の基準手法にCVaRを使う配分を足した例では、費用は増えた。


    欠品時の余剰罰則を外すのは、売上より多く用意したことを過剰と誤判定しないためだ。罰則を外しても、実際にいくつ売れたはずかは分からない。'
  evidence: '一次資料は[出版社PDF](https://hbemdata.org/index.php/ojs/article/download/198/176)の表II–VII、図1、§6。下の数値は著者報告で、Labの検算値ではない。右列は在庫容量を共有するグループ全体で、費用が高い側の平均を見たCVaR。


    |M5の手法|平均費用|グループ全体のCVaR|

    |---|---|---|

    |LightGBM-QRで予測してから配分（PTO）|4.903|13.70|

    |同じ基準予測にCVaRを考慮する配分を追加|5.380|14.36|

    |DFL-EV|4.690|14.11|

    |RA-DFL|4.721|13.67|


    この1回の結果では、平均費用はDFL-EVが最小。乱数の初期値を変えた3回の平均ではRA-DFLが4.722 ± 0.002、DFL-EVが4.729 ± 0.034で、平均費用の優劣は断定しない。Stallionの費用はRA-DFLが48.4千、LightGBM-QRが48.2千、DFL-EVが47.8千だった。RA-DFLがどのデータや指標でも勝ったわけではない。


    欠品時の補正を外すと、M5の費用は4.721から4.776に増えた（p=0.003）。Stallionでは差を確認できなかった（p=0.25）。表Iで欠品と判定した割合はM5が12.3%、Stallionが1.3%。§5.8ではStallionを1.4%と記しているため、約1%と読む。いずれも真の欠品率ではない。


    本文はRA-DFLの需要充足率が学習法の中で最高とするが、表IIではLightGBM-QRが92.85%、RA-DFLが92.78%。ここでは表の値を採る。また、金融予測[43]、回路配置[44]、LLMの配信処理[45]、ネットワーク制御[46]からの類推（§2.3、§3.2、§3.4、§3.6）は、在庫実験の裏づけにはならない。掲載先の評価や引用文献の真偽は独立に検証していない。'
  executable_understanding: '**どちらに在庫を置くか。** 販売先は2つ、全体の容量は10です。固定した需要パターン10通りに対し、整数の配分候補66通りを比較します。保有費用1、欠品費用6、移送費用1、移送可能率0.4は共通です。リスク重みを0〜1で変え、平均費用と高い方20%の平均費用（CVaR₀.₈）のどちらを重く見ると配分が変わるかを確かめます。


    **欠品した日の売上から何を学べるか。** 在庫を移さない別の例で、真の需要10に対して売上は4です。売上を需要とみなすと、4を超える発注を過剰と扱います。欠品時にその罰則を外した損失と比べ、需要・売上・発注量を列挙して、補正後の損失が真の費用を超えないことも検算します。予測器の学習、需要の充足率に対する罰則、配分を微分して学習に戻す処理は含みません。'
  results: 配分図では、同じ需要と候補のまま、費用が高い場合を重く見ると何を選ぶかが分かる。Labは真の合成分布を与えており、予測が外れたままCVaRを追加すると費用が増える現象は検証していない。欠品補正の図では、売上4より発注を増やしても余剰の罰則がかからない。真の需要が10だったことを特定できるわけではない。
  what_we_verified: '**CONFIRMED（限定した計算）**：有限個の需要シナリオからのCVaR、容量内の整数配分の全探索、在庫移送がない場合に補正後の損失が真の費用を超えないこと。


    **PARTIAL（仕組みの一部）**：配分で平均費用と高費用側の費用をどう重みづけするか、欠品時に余剰の罰則を外すと何が変わるかを別々に確認した。一般の横持ちを含む命題2や、補正後の損失を最小にすれば偏りのない結果が得られるかは未確認。'
  what_we_did_not_verify: '**NOT TESTED（未検証）**：M5・Stallionの再学習、連続配分を求める層の最適値との隔たり0.32%、基準手法より3.7%低い費用とCVaR追加で9.7%増えた費用、実店舗の欠品・費用。Chronosなどの時系列基盤モデルと決定木系モデルを同じ条件で比較した実験でもない。


    価格が下がったときを販促、週内に売上ゼロが続いたときを欠品の代理としている。真の在庫の有無や買えなかった数量は観測していない。実務の手法として評価するには、観測の条件を確かめたうえで再現する必要がある。'
  method: method.md
  mapping: mapping.md
  implementation: '`UV_CACHE_DIR=/tmp/uv-cache uv run --no-project papers/ra-dfl-risk-aware-decision-focused-inventory/run.py`
    で `results.json` を作り直す。Python標準ライブラリのみを使い、乱数・外部データ・GPUは使わない。


    HTMLの本文・手法・論文との対応は `lab.yaml`、`method.md`、`mapping.md`、実験結果は `run.py` と `results.json`、図は `paper_lab/inventory02.py`
    が元になっている。READMEには読み方と実行手順がある。著者の実装は実行していない。'
teaching_figures:
- id: risk-equations
  kind: equations
  after: method
  title: 容量の制約、費用の重みづけ、欠品時の補正
  source: https://hbemdata.org/index.php/ojs/article/download/198/176
  locator: Equations (1)–(6); Figure 1
  caption: 論文の式を読み解くための図。下の実験は条件を絞って、一部の計算だけを確かめる。
  rationale: 式の記号と、配分図で変更できる条件を対応させる。
  steps:
  - name: 配分制約
    formula: q ≥ 0;  Σc q_c ≤ Q
    explanation: qは各販売先に置く数量、Qは全体の容量。Labは整数の組み合わせだけを比べる。
  - name: 配分の目的
    formula: min_q (1−w)E[C] + w CVaRα(C) + λ(β−F(q))⁺
    explanation: 原論文はα=0.9、充足率の目標β=0.95。Labではα=0.8を使い、目標を下回ったときの罰則は入れない。
  - name: 費用の裾
    formula: CVaRα(C) = min_η { η + E[(C−η)⁺]/(1−α) }
    explanation: 候補ごとに費用が高い側の平均を求める。図のwを変えると、その平均をどれだけ重く見るかが変わる。
  - name: 打切りの余剰項を消す
    formula: 'ρ=0: C̃(q,y,ξ) = h(1−ξ)(q−y)⁺ + b(y−q)⁺'
    explanation: 在庫を移さず（ρ=0）、欠品時（ξ=1）は売上を超えた発注の余剰罰則を外す。観測できなかった需要を求める式ではない。
- id: censoring-ablation
  kind: matrix
  after: evidence
  title: 欠品時の補正を外すと、M5では費用が増えた
  caption: 表I・IIIと§5.8。Stallionで欠品と判定した割合は表Iで1.3%、本文で1.4%。
  source: https://hbemdata.org/index.php/ojs/article/download/198/176
  locator: Tables I, III; Section 5.8
  rationale: データごとに、欠品と判定した割合と補正を外した結果を並べる。
  columns:
  - 欠品と判定した割合（代理指標）
  - 補正を外した結果
  rows:
  - label: M5
    cells:
    - 12.3%
    - 4.721 → 4.776、p=0.003
  - label: Stallion
    cells:
    - 約1%
    - p=0.25、有意な改善を確認できない
