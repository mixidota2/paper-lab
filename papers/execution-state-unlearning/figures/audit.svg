<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 666" role="img" aria-labelledby="title desc"><title id="title">回答に情報が出たかと、選択に使ったかを分ける</title><desc id="desc">教材で3種類の確認のうち一つでも文字列が出たかを見る。選択は、対象を渡さず最初から実行した場合と比べる。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#26745f"/></marker></defs><rect width="560" height="666" fill="#fbfcf7"/><g font-family="sans-serif"><text x="22" y="35" font-size="24" fill="#183c35" font-weight="bold">回答に出なくても、選択に影響は残る</text><text x="25" y="80" font-size="20" fill="#183c35" font-weight="normal">教材の結果：1は文字列が出た、または選択が違った</text><text x="224" y="130" font-size="19" fill="#183c35" font-weight="bold">文字列の検出</text><text x="393" y="130" font-size="19" fill="#183c35" font-weight="bold">選択の差</text><text x="25" y="203" font-size="20" fill="#183c35" font-weight="normal">元の記録を消す</text><rect x="235" y="171" width="83" height="48" rx="7" fill="#fae7df"/><text x="268" y="203" font-size="24" fill="#183c35" font-weight="normal">1</text><rect x="420" y="171" width="83" height="48" rx="7" fill="#fae7df"/><text x="453" y="203" font-size="24" fill="#183c35" font-weight="normal">1</text><text x="25" y="276" font-size="20" fill="#183c35" font-weight="normal">忘れるよう伝える</text><rect x="235" y="244" width="83" height="48" rx="7" fill="#fae7df"/><text x="268" y="276" font-size="24" fill="#183c35" font-weight="normal">1</text><rect x="420" y="244" width="83" height="48" rx="7" fill="#fae7df"/><text x="453" y="276" font-size="24" fill="#183c35" font-weight="normal">1</text><text x="25" y="349" font-size="20" fill="#183c35" font-weight="normal">文字列だけ消す</text><rect x="235" y="317" width="83" height="48" rx="7" fill="#e5f1e8"/><text x="268" y="349" font-size="24" fill="#183c35" font-weight="normal">0</text><rect x="420" y="317" width="83" height="48" rx="7" fill="#fae7df"/><text x="453" y="349" font-size="24" fill="#183c35" font-weight="normal">1</text><text x="25" y="422" font-size="20" fill="#183c35" font-weight="normal">後半をやり直す</text><rect x="235" y="390" width="83" height="48" rx="7" fill="#e5f1e8"/><text x="268" y="422" font-size="24" fill="#183c35" font-weight="normal">0</text><rect x="420" y="390" width="83" height="48" rx="7" fill="#e5f1e8"/><text x="453" y="422" font-size="24" fill="#183c35" font-weight="normal">0</text><rect x="25" y="485" width="510" height="114" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="41" y="517" font-size="22" fill="#183c35" font-weight="bold">文字列が出なくても、状態が同じとは限らない</text><text x="41" y="547" font-size="19" fill="#183c35" font-weight="normal">文字列を消しても、選ぶ候補がBのままの場合がある</text><text x="41" y="574" font-size="19" fill="#183c35" font-weight="normal">対象なしの実行と比べ、無関係な計算も残ったかを見る</text><text x="25" y="639" font-size="19" fill="#183c35" font-weight="normal">実モデルではなく、教材の決められた規則で得た結果。</text></g></svg>
