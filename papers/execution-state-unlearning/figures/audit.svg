<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 666" role="img" aria-labelledby="title desc"><title id="title">文字列と行動を別軸で監査する</title><desc id="desc">run.pyの初期条件に基づく。文字列probeは3種類のいずれかでの検出。行動の差は対象なしの全再実行を基準に測る。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#26745f"/></marker></defs><rect width="560" height="666" fill="#fbfcf7"/><g font-family="sans-serif"><text x="22" y="35" font-size="24" fill="#183c35" font-weight="bold">「言わない」と「判断に使わない」は別</text><text x="25" y="80" font-size="20" fill="#183c35" font-weight="normal">toyの監査：0は検出なし、1は検出あり</text><text x="224" y="130" font-size="19" fill="#183c35" font-weight="bold">文字列probe</text><text x="393" y="130" font-size="19" fill="#183c35" font-weight="bold">行動の差</text><text x="25" y="203" font-size="20" fill="#183c35" font-weight="normal">記録削除</text><rect x="235" y="171" width="83" height="48" rx="7" fill="#fae7df"/><text x="268" y="203" font-size="24" fill="#183c35" font-weight="normal">1</text><rect x="420" y="171" width="83" height="48" rx="7" fill="#fae7df"/><text x="453" y="203" font-size="24" fill="#183c35" font-weight="normal">1</text><text x="25" y="276" font-size="20" fill="#183c35" font-weight="normal">忘却指示</text><rect x="235" y="244" width="83" height="48" rx="7" fill="#fae7df"/><text x="268" y="276" font-size="24" fill="#183c35" font-weight="normal">1</text><rect x="420" y="244" width="83" height="48" rx="7" fill="#fae7df"/><text x="453" y="276" font-size="24" fill="#183c35" font-weight="normal">1</text><text x="25" y="349" font-size="20" fill="#183c35" font-weight="normal">全文字列除去</text><rect x="235" y="317" width="83" height="48" rx="7" fill="#e5f1e8"/><text x="268" y="349" font-size="24" fill="#183c35" font-weight="normal">0</text><rect x="420" y="317" width="83" height="48" rx="7" fill="#fae7df"/><text x="453" y="349" font-size="24" fill="#183c35" font-weight="normal">1</text><text x="25" y="422" font-size="20" fill="#183c35" font-weight="normal">選択的再実行</text><rect x="235" y="390" width="83" height="48" rx="7" fill="#e5f1e8"/><text x="268" y="422" font-size="24" fill="#183c35" font-weight="normal">0</text><rect x="420" y="390" width="83" height="48" rx="7" fill="#e5f1e8"/><text x="453" y="422" font-size="24" fill="#183c35" font-weight="normal">0</text><rect x="25" y="485" width="510" height="114" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="41" y="517" font-size="22" fill="#183c35" font-weight="bold">無漏洩だけでは全状態の一致を示せない</text><text x="41" y="547" font-size="19" fill="#183c35" font-weight="normal">行動だけBのまま残る場合がある</text><text x="41" y="574" font-size="19" fill="#183c35" font-weight="normal">無関係な計算の保持もreferenceと比べる</text><text x="25" y="639" font-size="19" fill="#183c35" font-weight="normal">実LLMの漏洩率ではなく、手書き状態機械の結果。</text></g></svg>
