<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 708" role="img" aria-labelledby="title desc"><title id="title">汚染前の状態へ戻り、後半を作り直す</title><desc id="desc">Lemma 1–2・Algorithm 1を再構成。ステップ数はtoy。KVそのものをCPU実験で実装したわけではない。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#26745f"/></marker></defs><rect width="560" height="708" fill="#fbfcf7"/><g font-family="sans-serif"><text x="22" y="35" font-size="25" fill="#183c35" font-weight="bold">T=12、τ=8 の説明用timeline</text><text x="22" y="76" font-size="20" fill="#183c35" font-weight="normal">実行済み：1〜7は共通、8〜12は再構成対象</text><rect x="22" y="98" width="37" height="45" rx="5" fill="#e5f1e8" stroke="#183c35"/><text x="29" y="129" font-size="18" fill="#183c35" font-weight="normal">1</text><rect x="65" y="98" width="37" height="45" rx="5" fill="#e5f1e8" stroke="#183c35"/><text x="72" y="129" font-size="18" fill="#183c35" font-weight="normal">2</text><rect x="108" y="98" width="37" height="45" rx="5" fill="#e5f1e8" stroke="#183c35"/><text x="115" y="129" font-size="18" fill="#183c35" font-weight="normal">3</text><rect x="151" y="98" width="37" height="45" rx="5" fill="#e5f1e8" stroke="#183c35"/><text x="158" y="129" font-size="18" fill="#183c35" font-weight="normal">4</text><rect x="194" y="98" width="37" height="45" rx="5" fill="#e5f1e8" stroke="#183c35"/><text x="201" y="129" font-size="18" fill="#183c35" font-weight="normal">5</text><rect x="237" y="98" width="37" height="45" rx="5" fill="#e5f1e8" stroke="#183c35"/><text x="244" y="129" font-size="18" fill="#183c35" font-weight="normal">6</text><rect x="280" y="98" width="37" height="45" rx="5" fill="#e5f1e8" stroke="#183c35"/><text x="287" y="129" font-size="18" fill="#183c35" font-weight="normal">7</text><rect x="323" y="98" width="37" height="45" rx="5" fill="#fae7df" stroke="#183c35"/><text x="330" y="129" font-size="18" fill="#183c35" font-weight="normal">8</text><rect x="366" y="98" width="37" height="45" rx="5" fill="#fae7df" stroke="#183c35"/><text x="373" y="129" font-size="18" fill="#183c35" font-weight="normal">9</text><rect x="409" y="98" width="37" height="45" rx="5" fill="#fae7df" stroke="#183c35"/><text x="416" y="129" font-size="18" fill="#183c35" font-weight="normal">10</text><rect x="452" y="98" width="37" height="45" rx="5" fill="#fae7df" stroke="#183c35"/><text x="459" y="129" font-size="18" fill="#183c35" font-weight="normal">11</text><rect x="495" y="98" width="37" height="45" rx="5" fill="#fae7df" stroke="#183c35"/><text x="502" y="129" font-size="18" fill="#183c35" font-weight="normal">12</text><text x="320" y="175" font-size="21" fill="#a94438" font-weight="normal">↑ zが初めて流入</text><rect x="25" y="210" width="510" height="105" rx="12" fill="#fae7df" stroke="#183c35" stroke-width="1.3"/><text x="41" y="242" font-size="22" fill="#183c35" font-weight="bold">記録だけ消す</text><text x="41" y="272" font-size="19" fill="#183c35" font-weight="normal">summary・plan・KVはzを読んで計算済み</text><text x="41" y="299" font-size="19" fill="#183c35" font-weight="normal">元入力の削除だけではその影響を消せない</text><path d="M280,315 L280,350" stroke="#26745f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="25" y="362" width="510" height="116" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="41" y="394" font-size="22" fill="#183c35" font-weight="bold">checkpoint 7へ戻す</text><text x="41" y="424" font-size="19" fill="#183c35" font-weight="normal">対象後のKV・派生状態を再利用しない</text><text x="41" y="451" font-size="19" fill="#183c35" font-weight="normal">1〜7の状態は対象なしの世界と共通</text><path d="M280,478 L280,516" stroke="#26745f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="25" y="527" width="510" height="115" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="41" y="559" font-size="22" fill="#183c35" font-weight="bold">8〜12を対象なしで再実行</text><text x="41" y="589" font-size="19" fill="#183c35" font-weight="normal">対象以外の観測を保ち、要約と計画も作り直す</text><text x="41" y="616" font-size="19" fill="#183c35" font-weight="normal">Fの呼出しは12 − 8 + 1 = 5回</text><text x="25" y="680" font-size="20" fill="#a94438" font-weight="normal">外部副作用を取り消す図ではない。</text></g></svg>
