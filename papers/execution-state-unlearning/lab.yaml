  locator: 式(1)・Definition 1・Theorem 1
  rationale: 入力、演算、出力と適用条件を具体化する。
  caption: 確率的生成では将来の行動分布の距離へ定義を緩める。ここで示す等号は決定的な場合。
  steps:
  - name: 状態の更新
    formula: Rₜ = F(Rₜ₋₁, oₜ ; θ)
    explanation: Rは会話履歴だけでなく、KVキャッシュや要約、まだ実行していない計画も含む。モデルのパラメータθは固定する。
  - name: 忘却の定義
    formula: U(RT, z) = R⁻ᶻT
    explanation: 右辺は観測からzを除いて最初から再実行した状態。文字列がないだけでは不足。
  - name: 同じ前半をつなぐ
    formula: R̃τ₋₁ = Rτ₋₁ ; R̃ₜ = F(R̃ₜ₋₁, o⁻ᶻₜ ; θ)
    explanation: 決定的な遷移と正しい反実仮想入力なら、帰納的に全再実行と一致する。
- kind: equations
  id: replay-cost
  title: 対象を受け取った後に、何回の処理が必要か
  after: method
  source: https://arxiv.org/html/2609.04875
  locator: Corollary 1・Algorithm 1
  rationale: 入力、演算、出力と適用条件を具体化する。
  caption: トークン数や経過秒数の式ではない。この計算では、対象を受け取った後の状態は、影響がないと分かる根拠がなければ再利用しないとする。論文が認める操作の範囲で、最悪の場合に必要な処理回数を示す。
  steps:
  - name: 直前へ戻れる場合
    formula: Cselective = T − τ + 1 ; Cfull = T
    explanation: τは対象の最初の流入ステップ。数えるのはFの呼出し回数。
  - name: checkpointが粗い場合
    formula: c < τ ; C = T − c ≥ T − τ + 1
    explanation: cがτ−1より前なら余分な前半も再実行する。正しさは保てても最小費用にはならない。
interactives: []
core_idea:
  author_claim: >-
    論文が対象にするのは、入力から作り直せる実行状態である。対象zを除いた入力で最初から実行した場合と同じ状態に戻すことを、忘却と定義する。提案法のProvenance-Guided Selective Replayは、zを初めて受け取った時点を記録から特定する。その直前の状態から、zを除いた入力で処理をやり直す。[一次資料：Definition 1・Algorithm 1](https://arxiv.org/html/2609.04875)
  research_bot_interpretation: >-
    保存した記録だけを管理しても、忘却の範囲は決まらない。要約、まだ実行していない計画、キャッシュまで含めて、どこまで作り直せるかを決める必要がある。一方、すでに人や外部サービスへ伝えた情報や、外部で実行した操作を取り消せるわけではない。導入前には、アプリがこの境界を区別しているかを確かめたい。
sections:
  overview: |-
    著者は、利用者が以前の情報を取り消したとき、元の記録だけを消しても、その情報を使って作った要約や判断が残る問題を調べました。提案手法は、取り消す情報を受け取る直前の状態に戻り、その情報を渡さずに処理をやり直します。情報の影響がないと分かる処理は再利用します。モデルの重みを変更する方法ではありません。

    取り消した好みを理由に候補を避けるかを調べた実験では、元の入力からその情報だけを消すと候補を避けた割合は80%でした。対象情報なしで最初から実行すると32%で、提案手法の結果も32%でした。その好みを示す文字列はどの条件でも回答に出ていません。記録に由来する言葉を返さなくても、選択に影響が残る場合があることを示しています。
  problem: >-
    エージェントが秘密を読んで返答し、その情報を要約や次の計画にも使ったとする。元の記録を削除しても、読み取った情報をもとに作った状態は別に残る。「その情報を忘れて」と伝えるだけでは、内部に値を残したまま返答に出さなくなることもある。論文は学習済みモデルの重みではなく、会話の実行中に作られた状態を扱う。[一次資料：Introduction・Method](https://arxiv.org/html/2609.04875)
  why_it_might_work: >-
    対象を受け取る直前までは、実際の入力と、対象を除いた場合の入力が同じなので、その時点の状態を再利用できる。同じ入力と状態から同じ結果が出ると仮定して、そこから対象を除いた入力を渡せば、対象を使って作った計画も作り直せる。要約を丸ごと捨てる方法に比べ、対象と無関係な情報も残しやすいと考えられる。
  evidence: |-
    ### 普段の返答で漏れなくても、判断への影響は残りうる

    主実験はLlama-3.1-8B-Instructを使用した。別のモデルとしてQwen2.5-7B-InstructとMistral-7B-Instruct-v0.3でも検証した。LongMemEval由来100例、ToolSandbox由来100例、AgentDojo由来80例を、秘密を受け取り、それを使って状態を作る脚本に変換している。元のベンチマークをそのまま実行した成績ではない。

    表2では、各評価セット30例に対して、忘却指示だけを出した条件のLeak@probesは1.00だった。これは6種類の確認のうち、1つでも漏れた事例の割合であり、すべての確認で100%漏れたという意味ではない。

    表3では、取り消した好みに沿って候補を避けた割合を、30例を2通りの提示順で調べて比べた。元の入力から対象を除く条件では0.80、対象なしで最初から実行した基準では0.32で、差は+0.48だった。理由の文字列が出た割合はどちらも0だった。基準値の0.32は実測値であり、0や0.5と仮定して差を出すわけではない。[一次資料：Experiments・表1–3](https://arxiv.org/html/2609.04875)

    ### 後半の処理をさらに省くには、対象の影響を見分ける必要がある

    表1で再計算したトークン数は、最初から実行すると1,235、前半のキャッシュを再利用すると202、選択的にやり直すと133だった。1,235を133で割ると約9.3倍になる。ただし、202から133への削減には、後半のどの処理が対象と無関係かを正しく見分けられるという強い仮定がある。対象を受け取った後の状態は、影響がないと分かる根拠がなければ再利用しないという前提だけでは、この追加削減は保証されない。また、乱数の種を独立にした監査で統計的な有意差が出なくても、行動分布が同じだと証明したことにはならない。[一次資料：表1・Exactness, Efficiency, and Generality](https://arxiv.org/html/2609.04875)
  executable_understanding: |-
    `uv run papers/execution-state-unlearning/run.py`

    同じ入力なら同じ結果になる12ステップの人工例で、8番目の観測に架空の秘密CANARY-731を入れる。会話履歴、記憶、要約、KVキャッシュに見立てた辞書履歴、選択肢Aを避けるフラグが残る。忘却とは無関係な計算が残るかを見るため、各観測のsafe_valueも合計する。

    記録の削除、忘却の指示、元入力からの除去、全層からの秘密文字列の除去、最初からの再実行、途中からの選択的な再実行を、対象を受け取った後の同じ状態から比べる。検出のための3種類の確認（task・introspection・summary）の反応はコードで決めている。実際のLLMの従い方や漏洩傾向を測る実験ではない。
  results: >-
    通常のタスクへの返答に対象を出さない条件でも、ほかの確認では検出され、判断に使うフラグも残った。全層から対象の秘密文字列を除く条件では、Leak@probesが0でも、選択はBのままだった。選択的な再実行は対象なしの全再実行と状態全体が一致し、忘却と無関係な合計78も残った。遷移の再計算は12回から5回に減った。対象を初めて受け取る位置がτ=1なら12回、τ=12なら1回になる。4ステップ終了時の保存状態までさかのぼる場合は8回になる。
  what_we_verified: >-
    Mechanism PARTIAL。対象を受け取る前の保存状態からやり直すと、対象なしで最初からやり直した場合と同じ辞書状態に到達した。対象の文字列が出たか、判断が異なるか、無関係な値が残ったか、状態全体が一致したかを別々に確認した。
  what_we_did_not_verify: >-
    Performance / Scaling / Production applicabilityはNOT TESTED。実際のattentionのKVキャッシュやLLM生成、影響の経路の自動特定、確率分布の同値性、外部への作用、トークン単位で影響の有無を見分ける処理は実装していない。Labの漏洩率は、コードで反応を決めた人工例の結果であり、論文の実測値を再現したものではない。
  implementation: >-
    advanceが状態遷移F、sanitizeが対象の秘密だけを除く処理、replayが後半の再計算、auditが検査を担当する。標準ライブラリだけで動き、モデルや外部APIとは通信しない。対象がどこで入ったかは観測データのsecretフィールドで分かるようにしており、影響の経路を自動では調べない。実行中に外部へ作用せず、論文のA2・A3は構成上満たす。
  method: method.md
  mapping: mapping.md
