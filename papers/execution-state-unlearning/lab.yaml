question: 記録を消した後も、エージェントの判断に影響は残るか
summary: 論文は、忘却対象を一度も受け取らなかった場合と同じ実行状態に戻すことを目指す。対象を受け取る直前の状態を再利用し、残りの処理をやり直す。対象の文字列が出るかと、判断に影響が残るかは別々に調べる。
