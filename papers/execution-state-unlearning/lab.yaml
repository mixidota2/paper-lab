summary: 元の記録だけを消しても、AIエージェントがその情報を使って作った要約や計画は残ります。著者は、情報を受け取る前の状態に戻り、その情報を渡さず後半をやり直す手法を提案しました。回答に情報が出るかと、選択に影響が残るかは別々に測ります。
