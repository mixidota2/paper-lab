core_idea:
  author_claim: |-
    著者は、取り消す情報を最初から渡さなかった場合と同じ内部状態に戻すことを、実行状態の忘却と定義します。提案手法は、情報の出所を記録して最初に入った時点を特定し、その手前から対象を除いた入力で残りをやり直します。[一次資料：定義1とアルゴリズム1](https://arxiv.org/html/2609.04875v1)
  research_bot_interpretation: |-
    取り消す範囲には、保存した元の記録だけでなく、その情報で作った要約、まだ実行していない計画、キャッシュも含めて考えます。ただし、エージェントがすでに外部に送った情報や、外部で確定した操作はこの方法では戻りません。実運用では、内部に残った影響を消す処理と、外部の操作を取り消す処理を分けて設計する必要があります。
sections:
  overview: |-
    利用者が以前伝えた情報を取り消しても、AIエージェントがその情報を使って作った要約や計画は、元の記録とは別に残ります。著者は、取り消す情報を受け取る直前の状態に戻り、その情報を渡さずに残りの処理をやり直す手法を提案しました。目標は、最初からその情報を受け取らなかった場合と同じ状態に戻すことです。モデルの重みは変えません。

    取り消した好みを使って候補を避けるかを調べた実験では、元の入力から好みを取り除いても、その好みをもとに作った要約などが残った条件では、候補を避けた割合が80%でした。好みを渡さずに最初からやり直した場合は32%で、提案手法も32%です。好みの理由を表す言葉は、いずれの条件でも出ていません。回答からその言葉が消えても、選択への影響は残り得ると著者は示しました。
  problem: |-
    エージェントが受け取った情報を、回答だけでなく要約や次の計画にも使ったとします。その情報を含む元の記録を削除しても、要約と計画は別に残ります。忘れるよう指示して回答に出なくなっても、その情報が内部の選択に影響することがあります。著者が対象にするのは、このように処理中に作られた状態であり、モデルの重みではありません。[一次資料：導入と方法](https://arxiv.org/html/2609.04875v1)
  why_it_might_work: |-
    取り消す情報を受け取る前は、実際の入力と、その情報を最初から渡さなかった場合の入力が同じです。そこで、著者はその時点の状態を使い直します。同じ入力と状態なら同じ結果が出て、後半でも正しい入力を再現できる場合は、対象の情報を使った要約や計画を作り直せます。要約を丸ごと捨てるより、対象に関係ない内容も残しやすいと考えられます。
  evidence: |-
    ### 回答に出なかった情報が、選択には影響していた

    主実験にLlama-3.1-8B-Instructを使い、Qwen2.5-7B-InstructとMistral-7B-Instruct-v0.3でも一部の結果を確かめています。著者はLongMemEvalの100例、ToolSandboxの100例、AgentDojoの80例を、対象の情報を受け取り、その情報をもとに状態を作る脚本に変えました。元の評価セットをそのまま実行した成績ではありません。

    表2では、各評価セットの30例について、六つの確認のうち一つでも対象の情報が出た場合を数えています。忘れるよう指示しただけの条件では、どの事例でも少なくとも一つの確認で対象が出ました（Leak@probes 1.00）。すべての質問で出たという意味ではありません。

    表3では、取り消した好みに沿って候補を避けた割合を、30例を二つの提示順で試して比べました。元の入力から好みを取り除いて、そこから作った状態を残した条件では80%でした。対象の情報を渡さず最初から実行した条件では32%で、提案手法の結果も32%です。好みの理由にあたる文字列が出た割合はいずれも0%でした。基準の32%は、対象なしで実行して観測した値で、0%や50%と仮定した値ではありません。[一次資料：実験と表1〜3](https://arxiv.org/html/2609.04875v1)

    ### 再計算したトークン数を比べる

    表1では、最初から実行した場合は平均1,235トークンを再計算しました。前半のキャッシュを使い直す比較手法は202、提案手法は133でした。提案手法は最初からの再実行の約9.3分の1です。202から133への追加の削減は、後半のどの処理が対象と無関係かを正しく特定できる場合の結果です。影響がないとわからない状態を残さないという条件だけで、この削減が保証されるわけではありません。また、別の乱数を使う試験で差が見つからなかったことは、行動の分布が同じだという証明ではありません。[一次資料：表1と正確さ・費用の実験](https://arxiv.org/html/2609.04875v1)
  executable_understanding: |-
    `uv run papers/execution-state-unlearning/run.py`

    同じ入力なら同じ結果になる12回の教材です。8回目の入力に、取り消し対象の架空の情報を入れます。教材は、その情報を履歴、記憶、要約、キャッシュに見立てた辞書に残し、候補Aを避ける印にも反映します。取り消しと関係のない計算が残るかを確かめるため、各入力のsafe_valueも合計します。

    対象の情報を受け取ったあとの同じ状態から、元の記録を削除する場合、忘れるよう指示する場合、元の入力から取り除く場合、各層の対象文字列だけを消す場合、最初からやり直す場合、対象を受け取る直前に戻ってやり直す場合を比べます。確認に対する三つの反応は教材の規則で決めています。実際の言語モデルや外部サービスには接続しません。
  results: |-
    教材では、普通のタスクの回答に対象が出なくても、別の確認で検出され、候補を選ぶ印も残りました。各層から対象の文字列だけを除くと検出は0ですが、選択はBのままです。対象の情報を渡さずに途中からやり直すと、最初からやり直した場合と辞書全体が一致しました。無関係な合計78も残り、状態の更新は12回から5回に減りました。対象が最初の入力なら12回、最後なら1回です。4回目の終了時点にしか保存状態がない場合は8回かかります。
  what_we_verified: |-
    仕組みの一部を確認しました（PARTIAL）。教材では、対象を受け取る前の保存状態を使ってやり直した結果が、対象を一度も渡さず最初からやり直した場合と同じでした。文字列が出たか、選択が違うか、無関係な値を残せたか、状態全体が一致したかを別々に検査しています。
  what_we_did_not_verify: |-
    性能、規模を広げた場合、本番への適用は未検証です（NOT TESTED）。教材は実モデルと実際のKVキャッシュを使いません。影響の経路の自動特定、異なる乱数での行動分布の同等性、外部操作の取り消し、トークン単位でどこに影響が及ぶかも確かめていません。文字列を検出した率は教材の規則から出た値であり、著者の実測値ではありません。
  implementation: |-
    advanceは状態を1回更新し、sanitizeは対象の情報だけを入力から除きます。replayが必要な範囲を再計算し、auditが対象なしの実行と比べます。コードはPythonの標準ライブラリだけで動き、モデルや外部APIには接続しません。入力データのsecret欄で対象の位置を示しているので、影響の経路を自動で推定する実装ではありません。外部操作を行わず、対象を除いた入力を同じ規則で再現できるため、教材では論文のA2・A3を満たします。
  method: method.md
  mapping: mapping.md
