- kind: equations
  id: replay-cost
  title: 対象を受け取ってから、状態を何回更新し直すか
  after: method
  source: https://arxiv.org/html/2609.04875
  locator: Corollary 1・Algorithm 1
  rationale: 入力、演算、出力と適用条件を具体化する。
  caption: この式が数えるのは状態の更新回数です。トークン数や経過時間ではありません。対象を受け取ったあとの状態は、影響がないとわからない限り使い回さないとします。この前提で必要になる最悪の場合の回数を示します。
  steps:
  - name: 対象を受け取る直前の状態を使える場合
    formula: Cselective = T − τ + 1 ; Cfull = T
    explanation: τは対象を初めて受け取った回です。式は状態を更新する関数Fの呼び出しを数えます。
  - name: 保存した状態が、対象を受け取る直前より前の場合
    formula: c < τ ; C = T − c ≥ T − τ + 1
    explanation: 保存時点cがτ−1より前なら、影響のない部分の処理もやり直します。結果が正しくても、必要な回数は最小ではありません。
