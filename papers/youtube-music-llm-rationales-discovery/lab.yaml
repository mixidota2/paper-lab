question: 知らない音楽を聴いてもらうには、候補を増やすことと理由を添えることのどちらが効くか
summary: YouTube Musicは、画面を返す処理とは別に、利用者に合うアーティストと推薦理由を作りました。2週間の比較では、発見欄での利用者の反応が22.43%増えました。候補を変えずに理由だけを外すと反応は減りましたが、候補を増やす機能だけを外した場合は明確な差が出ませんでした。
