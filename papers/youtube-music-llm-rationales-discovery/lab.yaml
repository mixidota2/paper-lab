core_idea:
  author_claim: YouTube Musicは推薦用プロフィールを画面の応答とは別に作ります。生成した名前を知識グラフのIDと照合し、すでに聴いたアーティストを除いて保存します。後の訪問では、既存の検索がそのアーティストの曲や動画を候補に加え、保存していた理由を添えます。
  research_bot_interpretation: Labでは、候補を増やすことと、候補に理由を添えることを分けて読みます。[Netflixの反実仮想観測](netflix-counterfactual-observability.html)も、ある候補がどれくらい出たかと、全体の結果がどれくらい変わったかを別々に見ています。ここでは理由文を添えられる候補だけを並べるため、ほかの推薦欄で同じ効果が出るとは限りません。
sections:
  overview: |-
    YouTube Musicの研究チームは、ホーム画面の「Your Daily Discover」で、知らないアーティストを見つけやすくする方法を試しました。従来は、よく一緒に聴かれるか、音などの特徴が似ているかを基準に候補を探し、「好きなアーティストのファン向け」のような定型文で理由を示していました。新方式では、利用者の好みのまとまりごとに、大規模言語モデルが新しい候補と推薦理由を事前に作ります。理由文は、新しい候補だけでなく従来の候補にも付けられます。

    2週間の本番実験で、著者はこの推薦欄での反応が22.43%増え（95%信頼区間は16.93〜27.93%）、発見や継続利用に関する指標が8.07%上がったと報告しています。候補と画面を変えずに理由文だけを外すと、候補の追加と理由文の両方を外したときと同程度に、利用者の反応が減りました。新しい候補を増やす機能だけを外した場合、反応に明確な差は出ていません。これらはこの推薦欄での結果で、YouTube Music全体の利用継続率ではありません。
  problem: |-
    利用者は見慣れないアーティストの名前だけでは、自分の好きな曲と何が似ているかが分かりません。そこで理由を作るとしても、ホームを開くたびに言語モデルで考えると画面の応答に時間がかかります。また、名前が実在するか、すでに聴いていないか、理由が実際に当てはまるかは別々に確認する必要があります。
  why_it_might_work: |-
    知らない曲でも、普段聴く曲とどこが似ているかが分かれば、利用者が試しに聴くことは考えられます。候補と理由を先に作って保存すれば、ホームを返すときに生成を待つ必要もありません。ただし、この実験は利用者が心理的に信頼したかを直接測っていません。知識グラフで実在を確認しても、音楽的な特徴や好みとの接点まで正しいとは限らないため、理由は別に確かめる必要があります。
  evidence: |-
    [一次資料：§3.3、§4、表1](https://arxiv.org/html/2609.23877v1)。YouTube Musicは従来の定型文を使う方式と、候補の追加と理由文の両方を使う方式を2週間比べました。

    | 何を測ったか | 著者の結果 | 範囲 |
    | --- | --- | --- |
    | 発見欄での利用者の反応（エンゲージメント） | 22.43%増、95%信頼区間 [16.93%, 27.93%] | ホームの発見欄に限る |
    | 発見・利用継続に関する指標 | 8.07%増、95%信頼区間 [0.90%, 15.24%] | 発見欄の指標で、サービス全体の継続率ではない |
    | 新しく候補を加える機能 | viewsは4.1%、独自性は74.00% | 論文ではviewsの分母が明らかでない |
    | 画面に候補を返す平均時間 | 0.3%増 | ミリ秒の値や遅い要求の指標（p99）は未掲載 |
    | 採点モデルが3点より高く付けた割合 | 64.8%から74.4% | 生成時の指示を見直した結果で、人が付けた評価ではない |

    著者は、一部の機能を外す別の比較も行いました。候補と画面の見た目を保ち、理由文だけを外すと、両方の機能を外した場合と同程度に反応が減りました。候補を追加する機能だけを外しても、反応に明確な差は出ませんでした。発見の指標はどちらか一方だけを外しても下がりました。論文にこの比較の効果量や信頼区間はなく、Labは推測で数値化していません。

    採点モデルが改善案を出すのは3点未満です。合格率の報告は3点より高い場合を数えており、ちょうど3点の扱いは論文から分かりません。
  executable_understanding: |-
    `uv run papers/youtube-music-llm-rationales-discovery/run.py`

    架空のアーティスト辞書と履歴を使います。辞書にない名前と、すでに聴いたアーティストを除きます。また、プロフィールがまだなければ従来方式を選び、生成後は保存済みの候補を使います。候補を同じにしたまま理由だけを隠す場合も試します。実際の反応をまねたデータを作って22.43%を再現する実験ではありません。
  results: |-
    3候補から、辞書に載っている、まだ聴いていない1候補だけが残りました。プロフィールがない場合は従来方式を選び、保存済みのプロフィールがあれば、その候補を返しました。理由を隠した場合にも候補IDは変わりません。利用者の反応がどう変わるかは、この計算では分かりません。
  what_we_verified: |-
    Labが確認したのは、架空の辞書と履歴による候補の除外、プロフィールがない場合の切り替え、候補IDを保ったまま理由だけを隠すことです。モデルの出力が正しいかは調べていません。
  what_we_did_not_verify: |-
    Geminiも、理由を採点するモデルも実行していません。利用者の信頼や反応、TPU費用、配信の処理時間、規模を広げた場合や本番での動作は確かめていません。理由文の誤りを防げる割合も測っていません。
  implementation: |-
    canonicalize()は小さな辞書で名前をIDに変え、すでに見たIDを除きます。serve()は、候補を返す条件と、理由を添える条件を分けます。実際の知識グラフや配信を再現するコードではありません。
  method: method.md
  mapping: mapping.md
