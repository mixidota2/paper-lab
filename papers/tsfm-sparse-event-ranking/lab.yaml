question: 数量の予測から、観測値が正になる時点を上位に並べられるか
summary: 著者らは、売上などの観測値が0より大きくなる時点を、時系列基盤モデルで上位に並べられるか調べました。12モデルの点予測は、学習不要の方法をAP skillで最大0.031上回りました。発生を学ぶ分類器を加えると30組中29組で点予測を上回りましたが、Favoritaでは6モデルとも過去の観測値から学んだLightGBMを下回りました。
