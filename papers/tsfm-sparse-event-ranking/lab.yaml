question: 数量予測の中央値で、需要が発生する日を選べるか
summary: 12 TSFMの点予測は参照比で最大+0.031 AP skill。発生probeは改善するが、Favoritaでは全てRaw LightGBMを下回る。中央値の情報消失と評価の対照を分けて読む。
