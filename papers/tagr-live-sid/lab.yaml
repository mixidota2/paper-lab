core_idea:
  author_claim: 著者らは広告へのIDの割り当てを毎分更新し、利用者の行動を複数の長さでまとめ、現在のモデルが生成した候補で定期的に学習しました。Kuaishouのライブ広告で、従来の候補検索（DLRM）より入室率が8.5%、カートのクリック率が7.4%、広告売上が16.1%上がったと報告しています（§4）。
  research_bot_interpretation: 広告IDの割り当て、行動履歴、学習は同じ周期で更新する必要がありません。一方、広告に割り当てるIDが変わると、学習に使う記録と検索用の索引が、同じ時刻の割り当てを参照する必要があります。本番で売上に差が出たのは複数の変更を組み合わせた結果で、IDの更新だけの効果ではありません。
sections:
  overview: |-
    Kuaishouのライブ広告では、同じ配信でも紹介する商品や映像が変わります。TAGRは検索に使えるIDの種類を固定し、広告が今どんな内容かを見て、配信中の広告に割り当てるIDを毎分選び直します。候補を選ぶモデルは入室履歴を複数の長さで読み、カートのクリックや注文は別に扱います。著者らは、一定の間隔で、その時点のモデルが生成した候補を使って学習します。

    著者らは本番トラフィックの10%を使い、4,000万人超の利用者を対象に複数週の無作為比較を行いました。後段の絞り込みと順位付けはそろえ、候補検索だけを従来のDLRMと比べました。TAGRの入室率は8.5%、カートのクリック率は7.4%、広告売上は16.1%高かったと報告しています。これらは従来方式に対する増加率で、IDの更新だけを試した結果ではありません。
  problem: 配信ルームの番号は同じでも、配信者が紹介する商品や映像は途中で変わります。配信開始時の内容を表したIDをそのまま使うと、利用者が今探している広告の内容とずれます。利用者側でも、配信を見に入ったときと商品を注文したときでは、次に見たい広告を考える手がかりが違います。
  why_it_might_work: モデルが生成できるIDの種類を固定しておけば、広告への割り当てだけを更新して現在の内容を索引に反映できます。また、報酬を高くする学習だけでなく、利用者が実際に次に選んだ広告を予測する学習も続けると、モデルは記録された行動から大きく離れにくくなる可能性があります。ただし、報酬を使う頻度を下げれば必ず良くなるわけではありません。変化が急なときは更新が間に合わないこともあります。
  evidence: |-
    ### 後段の絞り込みと順位付けをそろえた比較

    論文の表1では、どの方式も候補を後段で同じように絞り込み、順位を付けています。違うのは候補を最初に集める方式です。基準のDLRMは複数の経路で候補を集める二塔型の検索方式です。論文では本番全体の10%にあたるトラフィックを使い、4,000万人超の利用者を対象に複数週の比較を行いました（§4.3）。

    | 順に追加したもの | DLRMに対する広告売上の増加率 |
    | --- | ---: |
    | OneRec v2 | +6.1% |
    | 広告へのIDの割り当てを更新（LSID） | +9.9% |
    | 入室履歴を複数の長さで読む（MSI） | +11.2% |
    | 学習に使う記録に重みを付ける（MF-NTP） | +13.5% |
    | 実際の行動に近い候補を学ぶ（BA-GRPO） | +14.7% |
    | 広告の価値も学ぶ（VA-GRPO、TAGRの全機能） | +16.1% |

    全部の機能を使うと、入室率は8.5%、カートのクリック率は7.4%上がりました。いずれも相対的な増加率で、8.5ポイントや7.4ポイント増えたという意味ではありません。この表は機能を一定の順序で足した結果です。隣り合う行を引いても、各機能を単独で使ったときの効果にはなりません。また、評価形式が違うため、論文はDLRMのオフラインの検索精度（HR）を掲載していません。

    ### 複数の広告で使うIDの割合と、IDの変わりにくさは別に測る

    論文の表2では、固定IDのCprは1.42、Colは0.42、第1階層の安定率は100%でした。LSIDの全機能を使うと、順に1.01、0.02、90%でした。この安定率は、配信中にIDの第1階層が変わらなかった広告の割合です。IDのすべての階層が変わらなかった割合ではありません。LSIDには最終階層に配信者のハッシュを使う変更も含まれます。

    論文の式どおりに、広告をN件、割り当てに使ったIDをU種類、2件以上が使ったIDをM種類とすると、CprはN/U、ColはM/Uです。使われたIDには少なくとも1件、共有されたIDにはさらに1件以上の広告があるため、同じ集合を数えた場合はN≥U+M、したがってCpr≥1+Colになります。ただし表2のDynamic SIDはCprが1.36、Colが0.39で、この関係を満たしません。平均の取り方や対象が異なるかは論文からは分かりません。全機能の1.01と0.02も、丸める前の値を見ずには判断できません。

    表4の次ID予測の損失は、過去のモデルの候補を使う方式で1.79、現在のモデルの候補で毎回学ぶ方式で1.68、現在のモデルの候補を間隔を空けて使うIOPOで1.53でした。この表の安定性は損失が急増するかどうかで評価します。表2のIDの安定率とは別の指標で、表4に割合は載っていません。[一次資料：論文の実験（§4、表1〜4）](https://arxiv.org/html/2608.24034v1)
  executable_understanding: |-
    `uv run papers/tagr-live-sid/run.py`

    4件の広告に対し、固定した中心0、1、2、3のうち、現在の特徴に最も近い中心のIDを割り当てます。実験は、広告の特徴が4か所に分かれる場合と、すべてが1か所に集まる場合を比べます。最初のIDを維持する方法と、現在の特徴でIDを付け直す方法で、IDの共有、割り当ての維持率、現在の特徴と割り当てられた中心との二乗誤差を測ります。維持率は同じIDを保った広告の数を広告総数で割り、誤差も広告総数で平均します。

    別の実験では、次ID予測に見立てた目標を0、報酬側の目標を交互に+1と−1にします。報酬による更新を毎回加える場合と、5回に1回だけ加える場合の違いを見ます。
  results: 広告の特徴が分かれた場合、最初のIDを使うとCprは2、Colは1でした。IDを選び直すと、それぞれ1と0になりました。一方、特徴が1か所に集まる場合は、選び直すと全広告が同じIDになり、Cprは4、Colは1でした。IDを選び直せば共有が必ず減るわけではありません。別の実験で報酬による更新は毎回の条件で60回、5回に1回の条件で12回です。回数をそろえていないため、損失に差があっても、同じ計算量でIOPOが優れるとは言えません。
  what_we_verified: Labの合成実験では、固定したIDの候補から選び直すと、現在の特徴に合いやすくなる一方、最初と同じIDを保てない場合があることを確認しました。報酬を使う回数を減らすと、この数値例では次ID予測に見立てた学習が受ける影響も小さくなりました。報酬の質を測ったわけではないため、仕組みの一部を確かめた結果です。
  what_we_did_not_verify: Labは本番の売上、検索時間、秒間リクエスト数を測っていません。L20 GPUあたり毎秒2,500件超、検索100ミリ秒未満という数字は著者の報告です。合成実験はCPUで近い中心を選ぶだけで、学習したRQ-KMeans、配信者のハッシュ、利用者の行動で広告表現を学ぶ仕組み、GRPO、索引に反映されるまでの時間は扱いません。原著のCprとColの集計が異なるかどうかも未確認です。
  implementation: '`scenario()` は同じ変更後の特徴を使い、IDを変えない場合と変更する場合を比べます。`schedule()` は最初の20回を目標0への学習だけに使い、その後で報酬を使う更新を加えます。出力には各回の損失と更新回数を記録します。この実験は更新頻度を理解するための数値例で、GRPOそのものは実装していません。'
  method: method.md
  mapping: |-
    | 論文で扱うこと | Labで確認する方法 | ここでは扱わないこと |
    | --- | --- | --- |
    | [原著の手法](https://arxiv.org/html/2608.24034v1) | method.mdは入力から候補検索までを説明し、図は更新の順序を示します。 | 図は説明用に描き直しました。原図の再掲ではありません。 |
