question: ライブ配信で紹介する商品が変わったとき、検索用のIDをどう更新するか
summary: TAGRは利用できるIDの語彙を変えず、稼働中のライブ広告への割り当てを1分ごとに計算し直す。利用者の行動履歴から候補を生成し、既存の順位付けへ渡す。著者は4,000万人を超える利用者を対象に、本番トラフィックの10%で比較し、従来の候補検索より広告売上が16.1%増えたと報告した。
