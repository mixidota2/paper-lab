core_idea:
  author_claim: 著者はライブ広告へのIDの割り当て（LSID）、行動履歴から現在の意図を表すモデル（IAG）、現時点の生成モデルで定期的に選好を学ぶ方法（IOPO）を組み合わせた。Kuaishouの本番比較では従来の候補検索と比べ、広告を表示した後の入室率が8.5%、買い物かごのクリック率が7.4%、広告売上が16.1%増えたと報告した（§4）。
  research_bot_interpretation: Labでは、広告に割り当てるIDの更新、問い合わせ時点の行動履歴の利用、モデルの学習を別々に考える。語彙が固定でも割り当てが変われば、学習ログのIDと検索で使う索引を同じ時点で扱う必要がある。売上の差は、IDだけでなく、行動履歴の表現、ログの重み付け、選好を学ぶ方法も変えた結果だ。
sections:
  overview: |-
    Kuaishouのライブ配信では、同じ配信でも紹介する商品や映像が変わります。TAGRは候補検索に使うIDの語彙を固定したまま、配信中の広告に割り当てるIDを1分ごとに計算し直します。候補を生成するモデルには、利用者の行動を複数の時間幅でまとめて渡します。著者は一定の間隔で、モデルがその時点で生成した候補を使って選好を学習させます。

    下流の絞り込みとランキングをそろえた本番A/Bテストでは、著者は従来の候補検索（DLRM）に比べ、配信ルームへの入室率が8.5%、買い物かごのクリック率が7.4%、広告売上が16.1%増えたと報告しました。著者は本番トラフィックの10%を使って無作為比較を行い、4,000万人を超える利用者が試験に参加しました。売上の差は手法全体を入れ替えた結果で、IDの更新だけによる差ではありません。
  problem: 配信ルームが同じでも、紹介する商品や映像が変われば、その広告を探す利用者も変わる。配信開始時のIDを固定すると、今の内容と、IDが表している内容がずれる。利用者側でも、入室は注文より多く記録されるなど、行動の種類によって頻度や示す意図が違う。
  why_it_might_work: 語彙を固定すると、デコーダーが出せるトークンの集合を変えずに、広告の現在の内容を索引へ反映できる。選好を学ぶステップの合間に次トークンの予測を続けると、報酬の最大化に偏った生成モデルを、実際の行動に近づけられる可能性がある。ただし選好を学ぶ間隔を空けるほど良いわけではなく、環境が急に変わったときは追随が遅れる可能性がある。
  evidence: |-
    ### 既存の順位付けを残した本番比較

    著者は本番トラフィックの10%を使い、数週間にわたり4,000万人を超える利用者を無作為に割り付けた。従来はDLRMを使った二塔型の候補検索で、複数の検索経路を組み合わせる。表1では同じ下流の絞り込みと順位付けを使い、同等の条件のトラフィックで比較した。TAGRが最終ランカーまで入れ替えたわけではない。

    | 追加した構成 | 広告売上の相対差（DLRM比） |
    | --- | ---: |
    | OneRec v2 | +6.1% |
    | LSID | +9.9% |
    | MSIを追加 | +11.2% |
    | MF-NTPを追加 | +13.5% |
    | BA-GRPOを追加 | +14.7% |
    | VA-GRPOも追加した完全構成 | +16.1% |

    完全構成では広告の表示後に配信ルームへ入る率が8.5%、買い物かごのクリック率が7.4%増えた。これらは率のポイント差ではなく、従来方式に対する相対差だ。構成を順に追加した比較なので、数値を各部品単独の効果としては読めない。著者はDLRMのオフラインのHRを掲載していない。固定IDの検索と、生成モデルが上位IDを直接出す検索では、評価方法が違うためだ。

    ### 衝突率とIDの安定性

    表2では、使われたID1個あたりの平均広告数（Cpr）と、複数の広告を持つIDの割合（Col）を報告する。静的SIDの報告値はCprが1.42、Colが0.42で、完全なLSIDでは1.01と0.02だった。セッション中に第1階層が変わらなかった広告の割合は、静的SIDの100%に対して完全なLSIDでは90%。90%の広告でID全体が変わらなかったという意味ではない。また、完全なLSIDは最後の階層に配信者IDのハッシュも使う。表2で報告された広告売上の+3.8%は静的SIDとの比較で、表1のDLRM比+16.1%とは分母が違う。

    表2の値には、本文の定義だけでは説明できない箇所がある。広告がN件、使われたIDがU個、そのうち複数広告を持つIDがM個なら、すべての使用IDに少なくとも1件、衝突するM個には少なくとももう1件の広告がある。したがってN≥U+Mで、同じ母集団の件数から計算するならCpr（N/U）は1+Col（M/U）以上になる。

    一方、表のDynamic SIDでは1.36が1+0.39を下回り、Dynamic SID + Hの1.09と0.15、完全なLSIDの1.01と0.02、語彙サイズ128の1.14と0.16も同じ関係を満たさない。同じ方法で小数第2位へ丸めるだけなら、大小関係は逆転しない。集計した母集団や集計方法の違いがあるかは本文から確認できず、原因は分からない。

    ### 選好を学ぶ間隔の比較

    表4の次トークン予測の損失は、古い方策の候補を使う方式が1.79、現在の方策で連続して学ぶ方式が1.68、現在の方策で間欠的に学ぶIOPOが1.53だった。表の安定性は損失が急に増えなかった時間窓の割合で、IDの第1階層が保たれる割合とは異なる。著者は低・中・高を示しており、割合の実数は公開していない。

    [一次資料：§4、表1〜4](https://arxiv.org/html/2608.24034v1)
  executable_understanding: |-
    Labは中心を0、1、2、3に固定し、4件の広告を最も近い中心のIDに割り当てる。広告の特徴が広がる条件と、一か所に集まる条件で、割り当てを最初のままにする場合と更新する場合を比べた。割り当ての維持率は、元と同じIDを持つ広告の割合だ。二乗誤差は、広告の現在の特徴と割り当てた中心の差を二乗した平均だ。どちらも広告数を分母にする。ここでの維持率はID全体を比較するので、論文の第1階層だけを比較する数値とは違う。

    別の人工例では一つの数値を更新する。教師あり学習では数値を0に近づけ、追加更新では目標を+1と−1に交互に切り替える。最初の20ステップを準備に使い、その後に追加更新を毎ステップ行う場合と、5ステップに1回行う場合を比べた。

    リポジトリのルートで `uv run papers/tagr-live-sid/run.py` を実行すると、結果が `results.json` に保存される。
  results: |-
    特徴が広がる条件では、割り当てを変えない場合のCprは2、Colは1だった。割り当てを更新するとCprは1、Colは0になり、元と同じIDを保った広告は4件中1件だった。一方、特徴が同じ場所に集まる条件では、更新後のCprが4、Colが1になった。広告の特徴に合うよう更新しても、衝突が減るとは限らない。

    一つの数値を更新する人工例では、追加更新は60回と12回だった。教師あり学習の損失が小さくても、追加更新の回数が異なるため、同じ計算予算でIOPOが優れていることは示していない。
  what_we_verified: Labは人工データで、語彙を固定しても広告に割り当てるIDは変えられることを確かめた。広告の特徴の変わり方によって、割り当てを更新した際に衝突が増える場合も減る場合もあった。別の人工例では、追加更新の回数を減らすと教師あり学習の目標からのずれが小さくなったが、報酬モデルの品質は測っていない。
  what_we_did_not_verify: Labは本番の広告売上や検索の所要時間を再現していない。L20 GPU1台で2,500超QPS、検索全体が100 ms未満という数値は、著者の報告だ。Labの最近傍計算はCPUで動き、学習済みのRQ-KMeans、配信者のハッシュ、利用者の協調情報、GRPO、索引への反映時間を使わない。表2の数値が定義から導く関係を満たさない理由も確認できていない。
  implementation: '`scenario()` は、特徴が変わった同じ広告を使い、開始時の割り当てと更新後の割り当てを比較する。`schedule()` は準備の20ステップの後に追加更新を始め、全ステップの損失と追加更新の回数を保存する。数値を一つ動かす人工例であり、GRPOは実装していない。'
  method: method.md
  mapping: |-
    | 原論文の箇所 | Labの対応 | 扱わないもの |
    | --- | --- | --- |
    | [論文第1版の§2〜3](https://arxiv.org/html/2608.24034v1) | `method.md` と、論文をもとに描き直した図 | 著者の図の複製、公式コードとの一致 |
    | 論文のうち、IDの割り当てと更新の頻度 | `run.py` で人工データを計算し、`results.json` に保存する | 本番のデータ、ニューラルモデル、性能の再現 |
    | 公式実装 | 論文に、実行できる公式コードのURLを確認できなかった | Lab実装との同等性 |
