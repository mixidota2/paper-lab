question: ライブ配信で紹介する商品が変わるとき、候補検索は広告のIDをどう更新するか
summary: TAGRは、広告の検索に使えるIDの種類を固定したまま、配信中の広告に割り当てるIDを毎分見直します。Kuaishouでは後段の順位付けを変えずに候補検索を入れ替え、広告売上が16.1%増えたと著者が報告しました。
