<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 655" role="img" aria-labelledby="title"><title id="title">TAGRで広告のIDと行動履歴、方策を扱う手順</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#53758b"/></marker></defs><rect width="440" height="655" rx="12" fill="#f5f8fb"/><g font-family="sans-serif" fill="#183447"><text x="20" y="30" font-size="22" fill="#183447">TAGRはID・行動履歴・学習を別々に扱う</text><rect x="20" y="50" width="400" height="136" rx="9" fill="#e0edf2"/><text x="32" y="75" font-size="16" fill="#183447">稼働中の広告：IDを1分ごとに計算</text><text x="32" y="98" font-size="16" fill="#183447">映像と商品から、固定した語彙内でIDを選ぶ</text><text x="32" y="121" font-size="16" fill="#183447">LiveID A : (a,b,c) → (a,d,e)</text><text x="32" y="144" font-size="16" fill="#183447">両方向の索引に数秒以内で反映する</text><rect x="20" y="205" width="400" height="135" rx="9" fill="#e0edf2"/><text x="32" y="230" font-size="16" fill="#183447">配信要求：その時点までの行動履歴を読む</text><text x="32" y="253" font-size="16" fill="#183447">入室の履歴を1件、2件、10件ずつまとめる</text><text x="32" y="276" font-size="16" fill="#183447">いいね、カートのクリック、注文は分けて符号化</text><text x="32" y="299" font-size="16" fill="#183447">行動の表現と長期の利用者情報を渡す</text><text x="30" y="376" font-size="18" fill="#183447">学習：準備の後は一定間隔で選好を学ぶ</text><rect x="20" y="394" width="61" height="43" rx="9" fill="#cbe6df"/><text x="32" y="419" font-size="16" fill="#183447">NTP</text><rect x="88" y="394" width="61" height="43" rx="9" fill="#cbe6df"/><text x="100" y="419" font-size="16" fill="#183447">NTP</text><rect x="156" y="394" width="61" height="43" rx="9" fill="#f1d7bf"/><text x="168" y="419" font-size="16" fill="#183447">RL</text><rect x="224" y="394" width="61" height="43" rx="9" fill="#cbe6df"/><text x="236" y="419" font-size="16" fill="#183447">NTP</text><rect x="292" y="394" width="61" height="43" rx="9" fill="#cbe6df"/><text x="304" y="419" font-size="16" fill="#183447">NTP</text><rect x="360" y="394" width="61" height="43" rx="9" fill="#f1d7bf"/><text x="372" y="419" font-size="16" fill="#183447">RL</text><text x="20" y="470" font-size="16" fill="#183447">強化学習の回では、現在のモデルで候補を作る</text><text x="20" y="498" font-size="16" fill="#183447">合間は行動ログで次のトークンを予測して学ぶ</text><path d="M220 521L220 545" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="550" width="400" height="85" rx="9" fill="#e0edf2"/><text x="32" y="575" font-size="16" fill="#183447">配信時はビーム探索で256件のLSIDを生成</text><text x="32" y="598" font-size="16" fill="#183447">索引を引き、稼働中の広告に対応付ける</text><text x="32" y="621" font-size="16" fill="#183447">従来の絞り込みと順位付けへ渡す</text></g></svg>