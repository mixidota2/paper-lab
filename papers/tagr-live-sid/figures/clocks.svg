<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 655" role="img" aria-labelledby="title"><title id="title">TAGRが広告のID・行動履歴・学習を更新するタイミング</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#53758b"/></marker></defs><rect width="440" height="655" rx="12" fill="#f5f8fb"/><g font-family="sans-serif" fill="#183447"><text x="20" y="30" font-size="22" fill="#183447">TAGRは何をいつ更新するか</text><rect x="20" y="50" width="400" height="136" rx="9" fill="#e0edf2"/><text x="32" y="75" font-size="16" fill="#183447">広告へのIDの割り当て：毎分</text><text x="32" y="98" font-size="16" fill="#183447">配信場面と商品を見て、決まった候補からIDを選ぶ</text><text x="32" y="121" font-size="16" fill="#183447">広告AのLSID：(a,b,c) から (a,d,e) へ</text><text x="32" y="144" font-size="16" fill="#183447">LSIDと広告IDの索引に数秒で反映する</text><rect x="20" y="205" width="400" height="135" rx="9" fill="#e0edf2"/><text x="32" y="230" font-size="16" fill="#183447">行動履歴の更新：新しい行動があったとき</text><text x="32" y="253" font-size="16" fill="#183447">入室履歴は1件・2件・10件ずつにまとめる</text><text x="32" y="276" font-size="16" fill="#183447">いいね・カートのクリック・注文は別々に扱う</text><text x="32" y="299" font-size="16" fill="#183447">履歴と長期プロフィールを生成モデルに渡す</text><text x="30" y="376" font-size="18" fill="#183447">予測モデルの学習：一定間隔で報酬も使う</text><rect x="20" y="394" width="61" height="43" rx="9" fill="#cbe6df"/><text x="32" y="419" font-size="16" fill="#183447">NTP</text><rect x="88" y="394" width="61" height="43" rx="9" fill="#cbe6df"/><text x="100" y="419" font-size="16" fill="#183447">NTP</text><rect x="156" y="394" width="61" height="43" rx="9" fill="#f1d7bf"/><text x="168" y="419" font-size="16" fill="#183447">併用</text><rect x="224" y="394" width="61" height="43" rx="9" fill="#cbe6df"/><text x="236" y="419" font-size="16" fill="#183447">NTP</text><rect x="292" y="394" width="61" height="43" rx="9" fill="#cbe6df"/><text x="304" y="419" font-size="16" fill="#183447">NTP</text><rect x="360" y="394" width="61" height="43" rx="9" fill="#f1d7bf"/><text x="372" y="419" font-size="16" fill="#183447">併用</text><text x="20" y="470" font-size="16" fill="#183447">併用：現在のモデルで候補を生成し、報酬も使う</text><text x="20" y="498" font-size="16" fill="#183447">NTP：記録から次に選ばれた広告のIDを学ぶ</text><path d="M220 521L220 545" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="550" width="400" height="85" rx="9" fill="#e0edf2"/><text x="32" y="575" font-size="16" fill="#183447">ビーム探索で256個のLSIDを生成する</text><text x="32" y="598" font-size="16" fill="#183447">索引を使って、配信中の広告IDに変換する</text><text x="32" y="621" font-size="16" fill="#183447">候補を後段の絞り込みとランキングに渡す</text></g></svg>