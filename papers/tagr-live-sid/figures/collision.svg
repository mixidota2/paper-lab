<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 612" role="img" aria-labelledby="title"><title id="title">広告4件の例：IDが4種類に分かれる場合と1種類に集まる場合</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#53758b"/></marker></defs><rect width="440" height="612" rx="12" fill="#f5f8fb"/><g font-family="sans-serif" fill="#183447"><text x="20" y="30" font-size="20" fill="#183447">広告4件の例：IDの中心は0・1・2・3</text><text x="20" y="65" font-size="18" fill="#183447">最初に割り当てたID</text><rect x="20" y="81" width="92" height="63" rx="9" fill="#cbe6df"/><text x="32" y="106" font-size="16" fill="#183447">広告 A</text><text x="32" y="129" font-size="16" fill="#183447">ID 0</text><rect x="124" y="81" width="92" height="63" rx="9" fill="#cbe6df"/><text x="136" y="106" font-size="16" fill="#183447">広告 B</text><text x="136" y="129" font-size="16" fill="#183447">ID 0</text><rect x="228" y="81" width="92" height="63" rx="9" fill="#d5e4f5"/><text x="240" y="106" font-size="16" fill="#183447">広告 C</text><text x="240" y="129" font-size="16" fill="#183447">ID 1</text><rect x="332" y="81" width="92" height="63" rx="9" fill="#d5e4f5"/><text x="344" y="106" font-size="16" fill="#183447">広告 D</text><text x="344" y="129" font-size="16" fill="#183447">ID 1</text><text x="20" y="177" font-size="16" fill="#183447">Cpr = 2　Col = 1</text><text x="20" y="215" font-size="18" fill="#183447">特徴が分かれ、4件が別のIDになる</text><rect x="20" y="231" width="92" height="63" rx="9" fill="#cbe6df"/><text x="32" y="256" font-size="16" fill="#183447">広告 A</text><text x="32" y="279" font-size="16" fill="#183447">ID 0</text><rect x="124" y="231" width="92" height="63" rx="9" fill="#d5e4f5"/><text x="136" y="256" font-size="16" fill="#183447">広告 B</text><text x="136" y="279" font-size="16" fill="#183447">ID 1</text><rect x="228" y="231" width="92" height="63" rx="9" fill="#f1d7bf"/><text x="240" y="256" font-size="16" fill="#183447">広告 C</text><text x="240" y="279" font-size="16" fill="#183447">ID 2</text><rect x="332" y="231" width="92" height="63" rx="9" fill="#e4d9f0"/><text x="344" y="256" font-size="16" fill="#183447">広告 D</text><text x="344" y="279" font-size="16" fill="#183447">ID 3</text><text x="20" y="327" font-size="16" fill="#183447">Cpr = 1　Col = 0</text><text x="20" y="365" font-size="18" fill="#183447">特徴が集まり、4件が同じIDになる</text><rect x="20" y="381" width="92" height="63" rx="9" fill="#cbe6df"/><text x="32" y="406" font-size="16" fill="#183447">広告 A</text><text x="32" y="429" font-size="16" fill="#183447">ID 0</text><rect x="124" y="381" width="92" height="63" rx="9" fill="#cbe6df"/><text x="136" y="406" font-size="16" fill="#183447">広告 B</text><text x="136" y="429" font-size="16" fill="#183447">ID 0</text><rect x="228" y="381" width="92" height="63" rx="9" fill="#cbe6df"/><text x="240" y="406" font-size="16" fill="#183447">広告 C</text><text x="240" y="429" font-size="16" fill="#183447">ID 0</text><rect x="332" y="381" width="92" height="63" rx="9" fill="#cbe6df"/><text x="344" y="406" font-size="16" fill="#183447">広告 D</text><text x="344" y="429" font-size="16" fill="#183447">ID 0</text><text x="20" y="477" font-size="16" fill="#183447">Cpr = 4　Col = 1</text><text x="20" y="525" font-size="16" fill="#183447">Cpr：広告数を使ったIDの数で割る</text><text x="20" y="553" font-size="16" fill="#183447">Col：2件以上の広告が使うIDの割合</text><text x="20" y="590" font-size="16" fill="#183447">IDを更新しても、同じIDを使う広告は残ることがある。</text></g></svg>