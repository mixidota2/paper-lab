<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 530" role="img" aria-labelledby="title desc"><title id="title">モデルは代替候補だけに需要を配る</title><desc id="desc">著者はカテゴリごとに商品の選ばれやすさを求め、外した商品の代替候補だけに需要を配る。選択確率について置く仮定も示す。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217661"/></marker></defs><rect width="440" height="530" rx="12" fill="#fafcf7"/><rect x="20" y="20" width="400" height="78" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="48" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">モデルはカテゴリごとに効用を求める</text><text x="34" y="77" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">A、B、C、Dが買えたかと、売れた数を使う</text><path d="M220,99 L220,123" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="133" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="161" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">モデルはAの候補だけに配る</text><text x="34" y="190" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">S_A={B,C}。Aには配らない</text><text x="34" y="215" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">ρ_AB=e^ηB / (e^ηB+e^ηC)</text><rect x="20" y="270" width="400" height="103" rx="8" fill="#f7edda" stroke="none"/><text x="34" y="298" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">IIA：BとCの確率の比は一定</text><text x="34" y="327" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">ρ_AB / ρ_AC = e^(ηB−ηC)</text><text x="34" y="352" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">新しい候補で比が変わる場合は表せない</text><text x="20" y="426" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">使い道が似ている商品でも、</text><text x="20" y="451" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">客が同じ代替品を選ぶとは限らない。</text></svg>
