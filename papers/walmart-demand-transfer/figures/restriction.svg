<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 530" role="img" aria-labelledby="title desc"><title id="title">代替集合への制限とIIA</title><desc id="desc">代替集合への制限とIIA。説明と出典はLab本文と図注を参照。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217661"/></marker></defs><rect width="440" height="530" rx="12" fill="#fafcf7"/><rect x="20" y="20" width="400" height="78" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="48" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">カテゴリで効用ηを推定</text><text x="34" y="77" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">A / B / C / D の購入・利用可能性</text><path d="M220,99 L220,123" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="133" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="161" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">Aの代替集合だけへ制限</text><text x="34" y="190" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">S_A={B,C}、自己転移は0</text><text x="34" y="215" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">ρ_AB=e^ηB / (e^ηB+e^ηC)</text><rect x="20" y="270" width="400" height="103" rx="8" fill="#f7edda" stroke="none"/><text x="34" y="298" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">IIA：B対Cの比は固定</text><text x="34" y="327" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">ρ_AB / ρ_AC = e^(ηB−ηC)</text><text x="34" y="352" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">他の選択肢で比が変わる行動は表せない</text><text x="20" y="426" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">用途の近さで制限しても、群内の</text><text x="20" y="451" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">顧客選好まで同じとは限らない。</text></svg>
