<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 590" role="img" aria-labelledby="title desc"><title id="title">商品Aの需要100をどこへ送るか</title><desc id="desc">商品Aの需要100をどこへ送るか。説明と出典はLab本文と図注を参照。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217661"/></marker></defs><rect width="440" height="590" rx="12" fill="#fafcf7"/><rect x="20" y="20" width="400" height="78" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="48" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">撤去するA：需要100</text><text x="34" y="77" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">購入断念率20%、残り80を転移</text><path d="M110,124 L110,164" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><path d="M300,124 L300,164" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="174" width="190" height="78" rx="8" fill="#d7eadd" stroke="none"/><text x="34" y="202" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">Bへ60</text><text x="34" y="231" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">効用の比は3</text><rect x="230" y="174" width="190" height="78" rx="8" fill="#d7eadd" stroke="none"/><text x="244" y="202" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">Cへ20</text><text x="244" y="231" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">効用の比は1</text><rect x="20" y="300" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="328" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">失う需要20 / Dへの転移0</text><text x="34" y="357" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">Dは代替集合の外</text><text x="34" y="382" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">最終需要：B=120, C=60, D=30</text><text x="20" y="451" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">元の需要合計230 = 残る210 + 失う20</text><text x="20" y="476" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">ρと出発商品の需要量を掛け合わせる。</text><text x="20" y="501" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">仮定一致時の合成例。実測値ではない。</text></svg>
