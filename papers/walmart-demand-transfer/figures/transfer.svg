<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 590" role="img" aria-labelledby="title desc"><title id="title">商品Aの需要100はどう変わるか</title><desc id="desc">Aを外すと需要のうち20は購入につながらず、モデルは残り80をBに60、Cに20配る。候補でないDの需要は変わらない。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217661"/></marker></defs><rect width="440" height="590" rx="12" fill="#fafcf7"/><rect x="20" y="20" width="400" height="78" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="48" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">商品Aを外す前の需要は100</text><text x="34" y="77" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">20%は購入せず、モデルは残り80を配る</text><path d="M110,124 L110,164" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><path d="M300,124 L300,164" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="174" width="190" height="78" rx="8" fill="#d7eadd" stroke="none"/><text x="34" y="202" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">Bの需要に60を足す</text><text x="34" y="231" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">Bの重みは3</text><rect x="230" y="174" width="190" height="78" rx="8" fill="#d7eadd" stroke="none"/><text x="244" y="202" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">Cの需要に20を足す</text><text x="244" y="231" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">Cの重みは1</text><rect x="20" y="300" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="328" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">購入をやめる分は20</text><text x="34" y="357" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">Dは候補外なので、需要は移らない</text><text x="34" y="382" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">補正後はBが120、Cが60、Dが30</text><text x="20" y="451" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">元の需要合計230 = 残る210 + 失う20</text><text x="20" y="476" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">モデルは効用を指数に直し、80を3:1で配る。</text><text x="20" y="501" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">この図は人工例で、店舗の実測ではない。</text></svg>
