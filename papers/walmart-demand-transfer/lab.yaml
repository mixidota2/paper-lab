core_idea:
  author_claim: '著者は需要転移係数を明示的に算出するRestricted Logitを提案する。全品揃えの組合せごとに予測する代わりに、カテゴリ別の効用と商品間の代替集合を推定し、独立予測へ補正を加える。


    [一次資料：arXiv v1 本文](https://arxiv.org/pdf/2608.12680v1)'
  research_bot_interpretation: 既存の需要予測を品揃えの判断に使う前に、撤去による需要の移動を補う方法と読める。ただし販売記録だけでは、顧客が本来買いたかった商品と実際に買った代替商品を結び付けられない。予測誤差が減っても、需要が移る割合の正しさや、棚を変えた場合の売上効果までは分からない。
sections:
  overview: Walmartの著者らは、商品を棚から外したとき、残る商品に移る需要を見積もり、既存の商品別予測に加える方法を提案した。カテゴリごとに商品の選ばれやすさを学び、代替候補だけに需要を配る。100万品超の商品集合を扱うための設計だ。評価では過去の販売数との予測誤差を比較した。実際に棚を変えて売上への効果を測ったわけではない。
  problem: SAO（Store Assortment Optimization）は棚に何を置くかと、いくつ置くかを決める。商品Aを外したとき、Aの予測需要を全て失うとは限らない。代替品Bへ移る分があるからだ。全ての品揃えについて個別に予測すると組合せ数が膨らむため、商品ごとの独立需要予測と、撤去した商品の需要が残る商品へ移る割合を表す転移係数を分ける。
  method: method.md
  why_it_might_work: 既存の予測器を全品揃えに合わせて作り直さず、代替候補に限った係数で相互作用を加えられる。集合が重なっていてもカテゴリの効用を再利用できるのが計算上の利点だ。ただし代替集合が誤っていたり、特定ブランドの購入者だけ切替先が違ったりすると、制限して正規化する段階で誤差が入る。
  evidence: '### 過去の販売数を使った評価

    著者は1年の取引データで学習し、最後の2か月をテスト用に残したと記している。50カテゴリから代表的な拠点の結果を表IIに示す。実績は観測した販売数で、0.28→0.21はWMAPEが7ポイント下がったことを示す。


    | 店舗 | 独立予測 | DT補正 | 差 |

    | --- | ---: | ---: | ---: |

    | A | 0.28 | 0.21 | −0.07 |

    | B | 0.16 | 0.10 | −0.06 |

    | C | 0.02 | 0.03 | +0.01 |

    | D | 0.16 | 0.08 | −0.08 |

    | E | 0.18 | 0.07 | −0.11 |


    表の5拠点では4拠点で誤差が減り、Cでは増えた。WMAPEは需要が非負なら `Σ|予測−実績|/Σ実績` と読めるが、店舗ごとの件数・信頼区間・全カテゴリの重み付き集約値は表から確定できない。


    100万品超は扱う商品集合の規模であり、1つの棚の品数ではない。商品数に応じた計算時間やメモリの比較表はなく、規模を変えたときの性能の変化は再現できない。取引データから顧客が実際にどの商品へ切り替えたかは観測できないため、著者は予測誤差の改善を間接的な検証に使う（§V–VI）。


    [一次資料：arXiv v1 本文](https://arxiv.org/pdf/2608.12680v1)'
  executable_understanding: 'A/B/C/Dの4商品を用意し、Aの需要100のうち20%は購入断念、残りは効用の指数値による配分の重み3:1のB/Cへ流す。独立予測[100,60,40,30]からAを撤去すると、補正需要は[0,120,60,30]、失われる需要は20となる。Dは代替集合外で変わらない。


    効用はデータから学ばず、値をあらかじめ与える。補正と同じ規則で正解を作った場合と、好みを変えてBとCのどちらへ多く移るかが逆になる場合を比べる。人工例のWMAPEは論文表IIの再現ではない。'
  results: 人工例で、補正の仮定と同じ規則で正解を作ると、補正前のWMAPEは0.381、補正後は0になる。代替候補は変えずに顧客の好みだけ変えた対照では、補正の前後とも0.381。最初の例で誤差がゼロなのは正解を作る規則を最初から与えたためで、係数を学ぶ精度を示す数字ではない。
  what_we_verified: 需要の保存（残存需要＋購入断念＝撤去前需要）、集合外への転移ゼロ、購入断念後の正規化を確認した。同じ代替候補でも顧客の選好を変えると、補正しても誤差が残る。係数を与えた後の需要補正の仕組みは確認したが、データから係数を正しく推定できるかは検証していないため、理解の範囲はPARTIAL。
  what_we_did_not_verify: 効用や代替スコアの学習、需要の増加が欠品も引き起こすような場合、複数商品の同時撤去、100万品規模での計算量は未検証。人工例で誤差がゼロでも、それは正解を作る規則を補正にも使ったためで、予測性能の証拠ではない。実運用では代替集合の妥当性と欠品・販促・棚位置の影響を分け、棚変更を実験で評価する必要がある。
  implementation: 'リポジトリのルートで `uv run papers/walmart-demand-transfer/run.py` を実行する。Python標準ライブラリだけを使い、CPUで完了する。結果は同じディレクトリの
    `results.json` に保存する。


    乱数を使う実験はseedを固定した。数値は論文の測定値と別に集計している。'
