question: 商品を棚から外すと、その商品を買うつもりだった客は何を買うか
summary: Walmartの著者はある商品を棚から外したとき、どの代替品にどれだけ需要が移るかを見積もり、商品別の販売予測に加える方法を提案した。著者は100万品超を扱うために、カテゴリごとに計算した商品の選ばれやすさを使い回し、需要を配る先を代替候補に絞った。検証したのは過去の販売数をどれだけ正確に予測できるかで、棚を変えたときの売上効果ではない。
