question: 商品を棚から外したとき、その需要はどの商品へ移るか
summary: Walmartの著者らは、商品を棚から外したとき、残る商品に移る需要を見積もり、既存の商品別予測に加える方法を提案した。カテゴリごとに商品の選ばれやすさを学び、代替候補だけに需要を配る。100万品超の商品集合を扱うための設計だ。評価では過去の販売数との予測誤差を比較した。実際に棚を変えて売上への効果を測ったわけではない。
