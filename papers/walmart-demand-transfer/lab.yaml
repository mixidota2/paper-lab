core_idea:
  author_claim: |
    著者が提案したRestricted Logitは、棚から外す商品の需要のうち、残る各商品に移る割合を求める。著者は品揃えの組み合わせごとに販売数を予測する代わりに、カテゴリごとに求めた商品の効用と、商品ごとの代替候補を使って既存の予測を補正する。

    [一次資料：arXiv v1 本文](https://arxiv.org/pdf/2608.12680v1)
  research_bot_interpretation: 担当者は品揃えを決める前に、ある商品を外すと残る商品の販売数がどう変わるかを試算できる。ただし取引記録からは、客が本当は何を買うつもりで、代わりに何を買ったかは分からない。予測誤差が小さくなっても、移る割合の正しさや棚を変えた効果までは確かめられない。
sections:
  overview: |-
    Walmartの著者は、店がある商品を棚から外したときに、その需要の一部がどの商品へ移るかを予測する方法を提案しました。カテゴリごとに各商品が選ばれやすい度合いを推定し、代わりに選ばれうる商品にだけ需要を配ります。50カテゴリの過去データを調べ、論文が示した代表5拠点では、補正しない予測より誤差が小さくなった拠点が4つ、大きくなった拠点が1つでした。比べたのは過去の販売数との誤差で、棚を実際に変更したときの売上や、買い手が何に乗り換えたかを測った結果ではありません。
  problem: 品揃え最適化（SAO）では、店舗の担当者が何を棚に置き、いくつ置くかを決める。例えば商品Aを外しても、Aの需要をすべて失うとは限らない。一部の客が代わりにBを買うからだ。棚に置ける組み合わせが多いと、候補を一つずつ予測するのは難しい。著者は、商品ごとの販売予測と、外した商品から残る各商品に需要が移る割合を分けて求めた。
  method: method.md
  why_it_might_work: 著者の方法なら、既存の予測器を品揃えごとに作り直さずに、商品を外したときの影響を足せる。外す商品が違っても、カテゴリ内で学んだ効用を使い回せる。一方、候補の中に本当の代替先がなかったり、あるブランドの客だけが別の商品を選んだりする場合、モデルは需要を誤って配りうる。
  evidence: |
    ### 著者が過去の取引記録で比べたこと

    著者は、1年分の取引データで学習し、最後の2か月をテストに使ったと記している。公開本文だけでは、その2か月が1年のどこに含まれるかを厳密には確定できない。著者は50カテゴリの過去データを使い、表IIに代表的な5拠点の結果を載せた。各行は、需要の移動を加えない予測と、加えた予測のWMAPEを比べた値だ。0.28から0.21への変化は誤差が7ポイント減ったことを表す。

    | 店舗 | 移動を加えない予測 | 移動を加えた予測 | 差 |
    | --- | ---: | ---: | ---: |
    | A | 0.28 | 0.21 | −0.07 |
    | B | 0.16 | 0.10 | −0.06 |
    | C | 0.02 | 0.03 | +0.01 |
    | D | 0.16 | 0.08 | −0.08 |
    | E | 0.18 | 0.07 | −0.11 |

    5拠点のうち4拠点では誤差が減り、Cでは増えた。著者は、補正前の誤差が大きい拠点ほど誤差が大きく減りやすかったと報告する。Labの人工例ではWMAPEを「絶対誤差の合計÷実績の合計」として計算する。論文に掲載された式と表からは、販売実績がゼロの行の扱い、各拠点の件数、信頼区間、全カテゴリをまとめた値までは分からない。

    著者が示す100万品超は対象とする商品集合の大きさで、1つの棚に並ぶ数ではない。論文は商品数を変えたときの処理時間やメモリの比較を掲載していない。また、取引記録には客が実際に何から何へ切り替えたかが残らない。そのため著者は、過去の販売数との予測誤差を使って間接的に確かめた（§V–VI）。

    [一次資料：arXiv v1 本文](https://arxiv.org/pdf/2608.12680v1)
  executable_understanding: |
    LabはA、B、C、Dの四つの商品を用意し、撤去前の需要を順に100、60、40、30と置く。Aを外すと、その需要100のうち20は購入につながらない。モデルは残り80を、商品の効用を指数に直した重み3:1でBとCに配る。Bには60、Cには20が加わる。Dは候補に入っていないので変わらない。補正後の需要はAから順に0、120、60、30だ。

    Labは効用を最初に与え、データからは推定しない。補正と同じ配分で正解を作った場合と、候補は同じでも客がCを多く選ぶ場合を比べる。いずれも人工例であり、論文の表IIは再現しない。
  results: Labが予測と同じ規則で正解を作ると、WMAPEは補正前の0.381から0になった。対照例では候補を変えず、客がCを多く選ぶ正解を置いた。この場合、補正前も補正後も0.381だった。最初の例で誤差がゼロになったのは、正解と予測で同じ規則を使ったためだ。取引データから係数を学べることは示していない。
  what_we_verified: Labでは、撤去前の需要が「残る需要＋購入をやめた分」に等しく、候補外の商品には需要が移らないことを確かめた。モデルは購入をやめた分を除いた後、残りを候補内の重みに従って分けた。同じ候補でも客の選び方が変わると誤差が残った。与えた係数で予測を補正する処理までを試したので、検証の判定はPARTIALとした。
  what_we_did_not_verify: Labでは、効用や代替スコアの学習、需要が増えて欠品も増えるときの推定、複数商品の同時撤去、100万品規模の計算を試していない。人工例の誤差ゼロは、実データで正しく予測できる証拠ではない。店舗で使うなら、代替候補を確かめ、欠品、販促、棚の位置の影響と区別したうえで、棚を変えた効果を実験で測る必要がある。
  implementation: |
    リポジトリのルートで `uv run papers/walmart-demand-transfer/run.py` を実行する。プログラムはPython標準ライブラリだけを使い、CPUで計算し、同じディレクトリの `results.json` に結果を保存する。

    この例は固定値を使い、乱数は使わない。出力される値はLabの人工例の結果で、著者が過去の取引記録から求めた値とは別だ。
  mapping: mapping.md
