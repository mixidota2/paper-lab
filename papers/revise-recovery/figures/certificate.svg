<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="title desc"><title id="title">再利用の許可は commit まで暫定</title><desc id="desc">原典 Eq. (1)–(2)・§3.3 を基に再構成。実行開始後の変更と最終 read set を照合する。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#59717f"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#193743;font-size:20px}.small{font-size:17px}.head{font-size:25px;font-weight:700}.edge{stroke:#59717f;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="640" height="470" rx="18" fill="#f3f7f8"/><text x="24" y="38" class="head">安全な再利用には二段階の確認が必要</text><rect x="24" y="66" width="592" height="65" rx="10" fill="#dbeceb"/><text x="40" y="96" class="">revision 時：変更と依存を照合 → 回復計画</text><path class="edge" d="M320,131 L320,162"/><rect x="24" y="169" width="592" height="92" rx="10" fill="#dbeceb"/><text x="40" y="199" class="">実行中：snapshot 上で読み取りを記録</text><text x="40" y="226" class="">late read により依存が後から増える場合もある</text><path class="edge" d="M320,261 L320,293"/><rect x="24" y="300" width="592" height="92" rx="10" fill="#dbeceb"/><text x="40" y="330" class="">commit 時：最終証明書 × 開始後の全変更</text><text x="40" y="357" class="">親の版・effect 安全性も確認 → 公開または拒否</text><text x="24" y="438" class="small">証拠なし → suffix / restart。安全性を推測しない。</text></svg>