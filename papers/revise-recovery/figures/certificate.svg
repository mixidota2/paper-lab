<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="title desc"><title id="title">処理結果を反映する直前に、もう一度確認する</title><desc id="desc">論文の式(1)・(2)と§3.3をもとに、REVISEが実行開始後の変更と、実行中に記録した読み取りをどう照合するかを示す。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#59717f"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#193743;font-size:20px}.small{font-size:17px}.head{font-size:25px;font-weight:700}.edge{stroke:#59717f;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="640" height="470" rx="18" fill="#f3f7f8"/><text x="24" y="38" class="head">再利用できるかを二度確認する</text><rect x="24" y="66" width="592" height="65" rx="10" fill="#dbeceb"/><text x="40" y="96" class="">指示が変わったとき：変更と依存関係を照合する</text><path class="edge" d="M320,131 L320,162"/><rect x="24" y="169" width="592" height="92" rx="10" fill="#dbeceb"/><text x="40" y="199" class="">実行中：固定した入力を参照し、読み取りを記録する</text><text x="40" y="226" class="">変更のあとで初めて読み取る値もある</text><path class="edge" d="M320,261 L320,293"/><rect x="24" y="300" width="592" height="92" rx="10" fill="#dbeceb"/><text x="40" y="330" class="">結果の確定時：最終記録と実行開始後の変更を照合する</text><text x="40" y="357" class="">親の結果と外部への変更も確認し、反映を決める</text><text x="24" y="438" class="small">安全と確認できなければ、途中または最初からやり直す。</text></svg>