<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" role="img" aria-labelledby="title desc"><title id="title">予算を変えると、A、C、Fをやり直す</title><desc id="desc">Labの6処理を依存関係で結んだ図。赤い処理は予算変更の影響を受ける。青緑の処理は、有効だと確認できた場合に限って結果を再利用するか、実行を続ける。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#59717f"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#193743;font-size:20px}.small{font-size:17px}.head{font-size:25px;font-weight:700}.edge{stroke:#59717f;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="640" height="540" rx="18" fill="#f3f7f8"/><text x="24" y="38" class="head">予算を変えると、A、C、Fをやり直す</text><rect x="24" y="68" width="180" height="65" rx="10" fill="#f3cfca"/><text x="40" y="98" class="">A：予算</text><rect x="230" y="68" width="180" height="65" rx="10" fill="#dbeceb"/><text x="246" y="98" class="">B：都市</text><rect x="436" y="68" width="180" height="65" rx="10" fill="#dbeceb"/><text x="452" y="98" class="">E：文体</text><path class="edge" d="M114,133 L114,207"/><path class="edge" d="M320,133 L320,207"/><rect x="24" y="214" width="180" height="65" rx="10" fill="#f3cfca"/><text x="40" y="244" class="">C：Aを参照</text><rect x="230" y="214" width="180" height="65" rx="10" fill="#dbeceb"/><text x="246" y="244" class="">D：Bを参照</text><path class="edge" d="M114,279 L260,350"/><path class="edge" d="M320,279 L320,350"/><path class="edge" d="M526,133 L390,350"/><rect x="230" y="358" width="180" height="65" rx="10" fill="#f3cfca"/><text x="246" y="388" class="">F：出力を統合</text><text x="24" y="460" class="">途中からやり直す方式では6処理を再計算する。</text><text x="24" y="495" class="">REVISEは3処理を再計算し、B、D、Eを残す。</text></svg>