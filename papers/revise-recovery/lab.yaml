question: エージェントの実行中に指示が変わったとき、どの結果を使い回せるか
summary: 指示が変わると、REVISEは各処理が読んだ入力と分岐条件を調べ、影響を受けた処理だけをやり直す。安全に再利用できると確認できなければ、実行順の途中から、または最初からやり直す。
