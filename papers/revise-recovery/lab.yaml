core_idea:
  author_claim: 著者は、変更された入力を各処理の読み取り記録と照合し、影響を受けた処理を依存関係に沿って特定した。システムは完了済み、実行中、未着手の処理を区別する。著者の評価では、結果は最新の指示で最初からやり直した場合と一致し、一部の入力だけが変わる場合は、最初からまたは途中からやり直す方式よりもモデルを呼び出す回数が減った。
  research_bot_interpretation: Labでは、会話を読んで「この処理は変更と関係なさそうだ」と判断するだけでは、結果を使い回せないと考える。処理が参照した入力をすべて記録しても、その処理を選んだ分岐条件や、ツールに渡した値が記録から抜けていれば、結果を確定してよいとは言えない。安全だと判断できる記録がなければ、たとえ再計算が増えても、より広い範囲をやり直す必要がある。
sections:
  overview: |-
    著者は、AIエージェントの実行中に利用者が指示を変えたとき、どの作業を残せるかを調べました。提案手法のREVISEは、変わった入力を、それまでに各処理が読んだ値や、どの処理を実行するか決めた分岐条件と照合します。変更の影響を受けないと確認できた処理は、完了済みなら結果を再利用し、実行中なら続けます。結果やツールによる外部への変更を確定する直前にも、読み取った値や依存先の結果が有効かを確かめます。依存関係の記録が足りなければ、途中から、または最初からやり直します。

    著者の評価では、15,939回すべてで、最新の指示で最初からやり直した場合と結果が一致しました。LangGraphでは、同じ依存関係の情報を使い、最初に影響を受けた処理から後ろをすべてやり直す方式と比べました。REVISEはモデルの呼び出し回数を43.6%減らしましたが、依頼の完了までにかかった時間の中央値は5.9%の短縮でした。著者が一致を確かめたのは単一プロセス内の処理です。分散環境での障害復旧や、分散した複数の処理が同じ結果に合意できるかは調べていません。
  problem: |-
    ### 途中からすべてやり直すと、変更と無関係な処理もやり直すことになる

    旅行案を作る途中で利用者が予算を変えたとする。エージェントはホテルの選択と合計金額を計算し直す。一方、街の説明を書く処理が予算を参照していなければ、その結果を使い回せるかもしれない。実行順で最初に影響が出た処理からすべてやり直す方式（suffix）では、街の説明もそのあとに並んでいれば書き直すことになる。

    ただし、どの街の説明を書くかを予算で決めていたなら、街の説明も変更の影響を受ける。そのため、REVISEは処理が読んだ値だけでなく、どの処理を実行するか決めた分岐条件も記録する。著者が扱うのは、推論の精度を上げる方法ではなく、指示変更後も最新の指示に沿った結果を返す実行時の仕組みだ。
  method: method.md
  why_it_might_work: 比較対象のsuffix方式も、REVISEと同じ依存関係の記録を使う。違いは、最初に影響が出た処理より後ろでも、変更と無関係な処理の結果をREVISEなら残せることだ。変更が一部に限られ、処理どうしが独立し、依存関係の記録が細かいほど、やり直さずに済む処理は増える。処理がすべて直列につながっている場合や、変更が全体に及ぶ場合は、正しく動いても再計算を減らせない。
  evidence: |-
    ### 最新の指示で最初から実行した結果と一致したか

    著者は論文の表1で、15,939回すべての実行が、最新の指示で最初から実行した場合と同じ結果を返したと報告した。古い結果を返したり、古い指示に基づく変更を外部に反映したりした例は、いずれも0件だった。この数にはGPUに負荷をかけた15,000回と、指示の変更と結果確定の順序を入れ替えるなど、問題が起こりやすい状況を作った300回が含まれる。著者が確かめたのは、単一プロセス内で結果と外部への変更が最新の指示に沿うことだ。分散システムの合意や、プロセスが停止したあとの復旧は検証していない。

    ### モデルを呼んだ回数と、リクエストの完了時間を分けて読む

    著者は10ノードのLangGraphアプリで、SGLangを通してQwen3-14Bを呼び出し、3つのやり直し方を比較した。以下は論文の表5の値であり、Labの合成例の結果ではない。

    | やり直し方 | モデル呼び出し回数 | 生成トークン数 | リクエスト完了時間の中央値 |
    | --- | ---: | ---: | ---: |
    | 最初から実行 | 10.0 | 80.0 | 719 ms |
    | 最初に影響を受けた処理から後ろを実行（suffix） | 7.8 | 62.4 | 711 ms |
    | 影響を受けた処理だけを実行（REVISE） | 4.4 | 35.2 | 669 ms |

    著者はジョブ間で共有キャッシュを消していないため、呼び出し回数と生成トークン数を主な指標とし、モデルの処理にかかった時間は補助指標とした。LLMCompilerで変更が一部に限られる条件では、モデルの呼び出し回数は表と同じ順に平均6.00回、5.19回、3.56回だった。変更が全体に及ぶか、細かい依存関係を追えない条件では、REVISEも最初からやり直し、全方式が平均6.00回だった（論文の表7）。

    REVISEは、どの処理を再計算するかを決めるためにも時間を使います。LLMCompilerの評価で、この判断にかかった時間の中央値は0.207ミリ秒でした（付録A.3）。これとは別の試験で、結果を確定する直前の確認を800回測ったところ、中央値は0.0026ミリ秒でした（付録A.2）。どちらも仕組みの一部分を測った値で、依頼全体の完了までにかかった時間ではありません。

    著者はSWE-chatの実行記録から、処理が終わる前に指示を変更できる時間があることを確かめた。記録には完全な依存関係がないため、どれだけの処理を安全に再利用できるかは分からない。また、手作業で調べた30件は現れ方を分類するために選ばれたもので、発生率を推定する標本ではない。GPUの負荷が高い実験では、制限時間内に完了する処理が増えたが、通常の負荷でも同じ効果が出るとは言えない。[一次資料：§2、§4、Appendix A](https://arxiv.org/html/2609.00643v1)。
  executable_understanding: |-
    `uv run papers/revise-recovery/run.py`

    Labの合成例では、AからFまでの6個の処理を用意する。Aは予算を読み、CはAの結果を参照する。Bは都市を読み、DはBの結果を参照する。Eは文体を読む独立した処理で、FはC、D、Eの出力をまとめる。予算を変えるとA、C、Fの結果が使えなくなる。この例で、最初からやり直す方式、最初に影響を受けた処理から後ろをやり直す方式、影響を受けた処理だけをやり直す方式を比べる。比べるのは、やり直す処理の集合と、最新の入力から得られる結果だ。

    このコードは、すべての入力を変えた場合と、依存関係が不明（unknown）の場合も試す。別の確定処理の検査では、変更後に古い値を読む、親の結果が古い、依存関係の記録が足りない、外部に加える変更が安全でない、という4つの場合に確定を拒否する。変更の影響を受けず、確認条件を満たす別の処理は確定できる。変更と無関係な値を読んだ場合でも、親の状態や副作用の検査は省かない。このコードは、どの処理を止めるかの計画を出すだけで、並行実行中の処理を実際には中止しない。
  results: 予算だけを変えた場合、最初からやり直す方式とsuffix方式は6処理すべてを再計算した。影響を受けた処理だけを選ぶ方式は、A、C、Fの3処理を再計算した。どの方式の出力も、最新の入力で最初から計算した結果と一致した。すべての入力を変更した場合と、依存関係が不明の場合は、影響を受けた処理だけを選ぶ方式でも6処理を再計算した。Labでは各処理の単価が同じと仮定し、再計算数の差を時間やトークン数の削減率には換算していない。
  what_we_verified: 手法の一部を固定した処理グラフで確認した（Mechanism PARTIAL）。変更が依存関係に沿って伝わること、実行順の途中にある無関係な処理も残せること、依存関係が分からない場合は全体を再計算することを確かめた。結果の確定条件は5種類を試した。これらは、いずれも上の合成例で確認した結果だ。
  what_we_did_not_verify: Labでは、同じ入力でもLLMの出力が変わる場合、実行中に分岐が変わる場合、プロキシによる読み取りの記録、集合の要素が変わる場合を試していない。実行中の処理の中止、指示の変更と結果の確定が競合する場合、外部サービスへの変更、プロセス停止後の復旧も検証していない（NOT TESTED）。合成例では入力を単なる値として保持しており、実際のシステムで使う妥当性証明書やロックの代わりにはならない。論文は匿名化された実験用ファイルに言及しているが、Labではその公開先を確認できず、著者の実験は再実行していない。
  implementation: '`affected()` は、変更された値を読む処理を見つけ、その処理の出力に依存する後続処理をたどる。`execute()` は保存済みの結果を使い、影響を受けた処理だけを計算し直す。`commit_valid()` は結果の確定条件を、外部を変更しない関数で表す。Labのコードは、論文の§3が扱う範囲を説明するための合成モデルで、標準ライブラリだけを使う。REVISEの実行システムそのものではない。'
  mapping: |-
    | 論文で扱うもの | Labで用意したもの | Labが省いたこと・確認していないこと |
    | --- | --- | --- |
    | [原典HTML](https://arxiv.org/html/2609.00643v1)と提供されたPDF | 論文をもとに式と図を書き直した | 著者の実験結果とLabの合成例の結果を分けて示した |
    | 変更された処理を特定し、必要な処理だけをやり直す仕組み | `run.py` と `results.json` | ニューラルモデルと本番データは使っていない |
    | 公式コード | 論文中で実行できる公開先を確認できなかった | 公式実装と同じ挙動かは確認していない |
