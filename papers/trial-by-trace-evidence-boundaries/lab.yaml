source_review:
  checked: '2026-11-03'
  url: https://arxiv.org/html/2610.32285v1
  scope: Labは論文v1の§2〜4、§5.1〜5.2と集計を確認しました。§5.3のモデル別の表は確認したHTMLでは表本文を読めませんでした。著者のコードと原記録は取得していません。
core_idea:
  author_claim: 著者は成果物を見て課題の成否を判定し、実行記録や独立に観測した結果を使って基盤の動作を判定します。基盤と成果に不合格があった場合は、両方をつなぐ候補を別に記録します。
  research_bot_interpretation: 基盤の項目が0でも、条件を満たしていない場合と、判断に必要な記録がない場合があります。どこに0が付いたかを見てから、その理由と、成果に影響したかを別々に調べます。
sections:
  overview: |-
    著者は、エージェントが課題を終えたかと、エージェントを動かす実行基盤が期待どおりに働いたかを分けて評価しました。TraceTrial-Benchでは、成果物で課題の成否を、実行記録や実行後の環境の状態で基盤の動作を調べます。4種類の基盤、9種類のモデル、95課題を組み合わせ、それぞれから選んだ計3,420回を採点しました。

    成果の全項目が合格だったのは1,351回です。そのうち基盤にも不合格がなかったのは286回でした。残る1,065回は全3,420回の31.1%で、成果が合格でも基盤側に少なくとも一つの不合格がありました。不合格には証拠が見つからない場合も含まれ、基盤の欠陥を確認した件数とは限りません。
  problem: 処理が失敗したのに成功したと伝わっても、エージェントが別の手順で仕事を終える場合があります。成果物だけでは、途中で何が伝わったかは分かりません。
  method: method.md
  why_it_might_work: 処理が実際にどう終わったかと、エージェントが受け取った情報を別々に調べると、実行が失敗したのか、結果の伝え方が誤っていたのかを切り分ける手掛かりになります。証拠がなければどちらかに決めません。
  evidence: |-
    表6は、基盤の合格割合を実行ごとに出して平均する集計と、全実行の項目を合算する集計を分けています。実行ごとに平均した基盤の得点は59.8〜72.0%でした。成果だけで全項目に合格した割合39.5%や、両層で全項目に合格した割合8.4%とは別です。状態2は、成果の判定によって基盤の項目が変わります。したがって二つの点数は独立ではありません。

    [論文の要旨](https://arxiv.org/abs/2610.32285) · [一次資料：表4、式3・4・6、表6](https://arxiv.org/html/2610.32285v1)
  executable_understanding: 画面で基盤の1項目目を状態2にし、成果の1項目目を合格と不合格に切り替えます。同じ基盤の状態でも、成果の合否に応じて基盤の点が変わります。チェック欄に入力するのは、実行記録を読んで得た結果ではなく教材の仮定です。
  results: 配布する `results.json` は、成果の2状態、基盤の4状態、3個のチェック欄のオン・オフを組み合わせた64条件を収録します。論文が採点した3,420回の記録ではありません。
  what_we_verified: Labは仮定した記録を入力にして、各条件の得点、基盤の不合格、成果への影響を調べる候補が規則どおり変わることを確かめました。論文の採点器の正確さは測っていません。
  what_we_did_not_verify: Labは著者の実行や採点を再現せず、保存記録が正しいかも調べていません。原記録を読む人が、基盤の誤りが成果に伝わったか確認する工程は含みません。ローカルの意味検査は実ブラウザーでの操作検査ではありません。
  implementation: Pythonの `run.py` はNode.jsを呼んで64条件を計算し、`results.json` に保存します。操作画面も同じ `model.js` の計算を使います。外部APIは呼びません。
