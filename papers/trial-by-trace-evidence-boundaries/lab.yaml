question: 成果物が正しくても、途中で実行結果を誤って伝えたことはあるか
summary: 著者は成果物と、エージェントを動かす実行基盤を別々に採点しました。採点した3,420件の31.1%では、成果が全項目合格でも基盤に不合格の項目がありました。
verification:
