teaching_figures:
- id: evidence-boundaries
  kind: logic
  title: 採点と、原因を確かめる手順
  after: method
  source: https://arxiv.org/html/2610.32285v1
  locator: §3.4–3.5
  rationale: 記録がそろったか、何が不合格か、原因を確認できたかを分けます。
  caption: 候補になっても、それだけでは基盤の不合格が成果に影響したとは分かりません。
  rows:
  - label: 検証の順序
    nodes:
    - title: 記録と実行を照合
      text: 記録が調べたい実行から得られたか確認します。
    - title: 成果と基盤を採点
      text: 成果物と実行基盤の動作を別々に判定します。
    - title: 候補の条件を確認
      text: 事前に定めた基盤と成果の項目が両方0か確かめます。
    - title: 証拠を読んで原因を調べる
      text: 途中の情報の変化、出来事の順番、ほかの原因を調べます。
- id: layer-score
  kind: equations
  title: 成果が全項目合格でも総合は75点になる例
  after: evidence
  source: https://arxiv.org/html/2610.32285v1
  locator: §3.4 式3を使った自作例
  rationale: 成果と基盤それぞれの合格割合を合計点につなげます。
  caption: 各層に2項目ある架空の例です。論文の集計値ではありません。
  steps:
  - name: 成果は2項目とも合格
    formula: pA/nA = 2/2 = 1
    explanation: 成果の合格割合は2÷2で1です。
  - name: 基盤では2項目のうち1項目が合格
    formula: pH/nH = 1/2
    explanation: 基盤の合格割合は2分の1です。不合格の原因はまだ分かりません。
  - name: 成果と基盤に50点ずつ割り当てる
    formula: S = 50 × 1 + 50 × (1/2) = 75
    explanation: 成果は50点、基盤は25点で総合75点です。
