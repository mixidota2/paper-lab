core_idea:
  author_claim: 成果の判定と実行基盤の判定を分け、出所の異なる証拠を対応付ける評価を提案します。
  research_bot_interpretation: 合格と因果説明を別々に検討するための教材として読みます。
sections:
  overview: 論文の評価規則を説明する自作教材です。企業効果や作者実験を再現したものではありません。 [一次資料の書誌情報](https://arxiv.org/abs/2610.32285)。
  problem: 完成物だけの検査では、途中の情報伝達が正しかったか分かりません。
  method: method.md
  why_it_might_work: 外部の実状態とモデルに渡った情報を別に確かめると、異なる失敗を区別できます。
  evidence: 一次資料：原典§3.4表4・式3、§3.5式4/6との対応を確認しています。候補関係は因果証明ではありません。
  executable_understanding: 操作する数値は合成例です。実記録の整合性を検査する機能ではありません。
  results: 64条件は自作入力の組合せです。ダウンロードしたresults.jsonで各条件の数値を確認できます。
  what_we_verified: 限定例の数値と原典規則の対応を確認。判定器自体の信頼性は検証していません。
  what_we_did_not_verify: 実trace、測定整合性、因果伝播、原著実験、実ブラウザは未検証です。
  implementation: 標準Node.jsで計算し、uv経由のrun.pyから再生成します。外部APIは使いません。
