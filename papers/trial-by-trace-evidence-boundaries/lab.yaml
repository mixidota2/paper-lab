teaching_figures:
- id: evidence-boundaries
  kind: logic
  title: 判定から因果説明までの段階
  after: method
  source: https://arxiv.org/html/2610.32285v1
  locator: §3.4–3.5
  rationale: 異なる確度の判断を混同しない自作図。
  caption: 矢印だけで検証が済むわけではありません。
  rows:
  - label: 検証の順序
    nodes:
    - title: 測定整合性
      text: 実行結果と記録が対応しているか確かめる
    - title: 二層判定
      text: 成果と基盤を別に採点
    - title: 候補関係
      text: 事前に定めた基盤項目と成果項目がともに不合格か確かめる
    - title: 追加の検証
      text: 途中で何が変わったか、出来事の順番や他に考えられる原因を調べる
- id: layer-score
  kind: equations
  title: 同じ完成物でも二層の得点は異なる
  after: evidence
  source: https://arxiv.org/html/2610.32285v1
  locator: §3.4 式3を使った自作例
  rationale: 成果だけの合格と両層合格の違いを数値で示す。
  caption: 各層2項目。論文の実験集計ではありません。
  steps:
  - name: 成果は全項目合格
    formula: pA/nA = 2/2 = 1
    explanation: 成果の2項目はともに合格。
  - name: 基盤に1項目の不合格
    formula: pH/nH = 1/2
    explanation: 不合格の原因が確定したという意味ではない。
  - name: 層を等重みで平均
    formula: S = 50 × 1 + 50 × (1/2) = 75
    explanation: 成果全項目合格でも総合100点にはならない。
