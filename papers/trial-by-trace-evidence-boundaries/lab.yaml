- id: layer-score
  kind: equations
  title: 同じ完成物でも二層の得点は異なる
  after: evidence
  source: https://arxiv.org/html/2610.32285v1
  locator: §3.4 式3を使った自作例
  rationale: 成果だけの合格と両層合格の違いを数値で示す。
  caption: 各層2項目。論文の実験集計ではありません。
  steps:
  - name: 成果は全項目合格
    formula: pA/nA = 2/2 = 1
    explanation: 成果の2項目はともに合格。
  - name: 基盤に1項目の不合格
    formula: pH/nH = 1/2
    explanation: 不合格の原因が確定したという意味ではない。
  - name: 層を等重みで平均
    formula: S = 50 × 1 + 50 × (1/2) = 75
    explanation: 成果全項目合格でも総合100点にはならない。
