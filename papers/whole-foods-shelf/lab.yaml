teaching_figures:
- kind: equations
  id: elasticity
  title: 立地が変わると面積の価値も変わる
  after: method
  locator: PDF 式(2)–(3)・§3.1
  rationale: 面積反応を具体的なモデルで説明する。
  caption: 原式を弾力性eにまとめた等価な表記。xは地理属性、sは部門面積。係数の数値は非公開。
  steps:
  - name: 部門iの需要
    formula: log dᵢ(s,x) = log αᵢ + eᵢ(x) log sᵢ + Σⱼ≠ᵢ eᵢⱼ(x) log sⱼ + τᵀx
    explanation: eᵢは自部門、eᵢⱼは他部門の面積への反応。補完・代替の関係を係数で表す。
  - name: 地理属性で弾力性を変える
    formula: eᵢ(x) = βᵢ + Σₗ γₗ xₗ
    explanation: 面積を1%変えたときの需要の変化率を、商圏などの条件に応じて変える。
  source: https://cdn.amazon.science/32/d1/6c82b85045a9bc0927e744698688/scipub-approval152129-41212433-a-framework-to-optimize-shelf-space-allocations-for-physical-stores.pdf
- kind: equations
  id: allocation
  title: 短期・長期の価値から費用を引く
  after: method
  locator: PDF 式(6)・§3.3
  rationale: 最適化対象と制約を具体化する。
  caption: hᵢ,Tは購買の長期効果、pᵢは平均価格、cᵢ,kは費用。原式を括弧で整理した。
  steps:
  - name: 目的関数
    formula: maxₛ Σᵢ { dᵢ(s,x)[ωpᵢ + (1−ω)hᵢ,T(x)] − Σₖ cᵢ,k(s,x) }
    explanation: ωを0〜1で動かし短期と長期の価値を調整する。長期効果の推定誤差も配分へ伝わる。
  - name: 面積の制約
    formula: Σᵢ sᵢ ≤ S,    lᵢ ≤ sᵢ ≤ uᵢ
    explanation: Sは総面積、lᵢとuᵢは部門別の下限・上限。実際には費用上限や商品政策の規則も加わる。
  source: https://cdn.amazon.science/32/d1/6c82b85045a9bc0927e744698688/scipub-approval152129-41212433-a-framework-to-optimize-shelf-space-allocations-for-physical-stores.pdf
- kind: logic
  id: evidence-boundary
  title: 推定の3段階で、未確認の箇所が違う
  after: method
  locator: PDF §3–4
  rationale: シミュレーションを実店舗の因果効果へ読み替えない。
  caption: 数値を創作せず、公開資料で追える範囲を示す。
  rows:
  - label: 需要反応
    nodes:
    - title: DHGL
      text: 面積と地理属性の相互作用を選択・再推定。これは正則化の偏りへの対処。
  - label: 長期効果
    nodes:
    - title: 購買を処置とする因果推定
      text: 詳細な実証結果は本文にない。交絡の調整を独立確認できない。
  - label: 推奨配分
    nodes:
    - title: 制約内でのシミュレーション
      text: 改装と新店を別条件で評価。実店舗の増収は未検証。
  source: https://cdn.amazon.science/32/d1/6c82b85045a9bc0927e744698688/scipub-approval152129-41212433-a-framework-to-optimize-shelf-space-allocations-for-physical-stores.pdf
