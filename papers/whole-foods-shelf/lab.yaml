teaching_figures:
- kind: equations
  id: elasticity
  title: 著者のモデルでは、商圏によって面積の係数が変わる
  after: method
  locator: PDF 式(2)–(3)・§3.1
  rationale: 各部門の販売数量を見積もる式と、商圏の特徴がその式に入る場所を示す。
  caption: sは各部門の面積、xは商圏の特徴を表す。図は原論文の式を、面積弾力性eを使って書き直した。
  steps:
  - name: 部門iの週販売数量を見積もる
    formula: log dᵢ(s,x) = log αᵢ + eᵢ(x) log sᵢ + Σⱼ≠ᵢ eᵢⱼ(x) log sⱼ + τᵀx
    explanation: eᵢは部門iの面積、eᵢⱼは他部門jの面積に対する反応を表す。他部門の係数の符号で、販売が増える向きか減る向きかが分かる。
  - name: 商圏の特徴から面積の係数を求める
    formula: eᵢ(x) = βᵢ + Σₗ γₗ xₗ
    explanation: モデルは人口などの商圏の特徴xを使い、同じ部門でも店舗によって面積に対する販売数量の反応が変わるようにした。
  source: https://cdn.amazon.science/32/d1/6c82b85045a9bc0927e744698688/scipub-approval152129-41212433-a-framework-to-optimize-shelf-space-allocations-for-physical-stores.pdf
- kind: equations
  id: allocation
  title: 著者の最適化は、面積と費用の条件を守って配分を選ぶ
  after: method
  locator: PDF 式(6)・§3.3
  rationale: 配分案を比べるときの評価式と、その案が守る条件を示す。
  caption: pᵢは部門iの平均単価、hᵢ,Tは購買後の長期価値、cᵢ,kは費用を表す。
  steps:
  - name: 各配分案の店舗全体の価値を計算する
    formula: maxₛ Σᵢ { dᵢ(s,x)[ωpᵢ + (1−ω)hᵢ,T(x)] − Σₖ cᵢ,k(s,x) }
    explanation: 著者は短期の単価と長期価値の比重をωで決める。長期価値の推定が変われば、最適化が選ぶ配分も変わりうる。
  - name: 配分案が総面積と部門別の条件を満たすか確かめる
    formula: Σᵢ sᵢ ≤ S,    lᵢ ≤ sᵢ ≤ uᵢ
    explanation: Sは店舗の総面積、lᵢとuᵢは部門iの下限と上限である。著者はこのほかに費用の上限と販売上のルールも設けた。
  source: https://cdn.amazon.science/32/d1/6c82b85045a9bc0927e744698688/scipub-approval152129-41212433-a-framework-to-optimize-shelf-space-allocations-for-physical-stores.pdf
- kind: logic
  id: evidence-boundary
  title: 論文は販売の見積もりと配分案の評価を別々に行う
  after: method
  locator: PDF §3–4
  rationale: 需要、購買後の価値、配分案のそれぞれについて、著者が何を比較したかを示す。
  caption: 図は公開論文をもとにLabが作成した。配分案の比較はシミュレーションである。
  rows:
  - label: 面積と販売数量
    nodes:
    - title: 著者は面積に対する販売数量の係数を推定した
      text: 著者は商圏の特徴を選んで回帰し直した。この回帰は罰則による係数の偏りに対処する。面積と販売の両方を左右する要因が残っていないかは別に確かめる必要がある。
  - label: 購買と将来の店舗売上
    nodes:
    - title: 著者は商品群を買った場合と買わなかった場合を比べた
      text: 公開論文は部門別の詳しい検証結果を載せていない。Labは、著者が買う人と買わない人の違いをどこまで調整したかを確かめていない。
  - label: 配分案の売上
    nodes:
    - title: 著者は改装と新店設計で異なる制約を設けた
      text: 著者は既存手法と比べた売上の差をシミュレーションで示した。店頭で配分を変えた結果は測っていない。
  source: https://cdn.amazon.science/32/d1/6c82b85045a9bc0927e744698688/scipub-approval152129-41212433-a-framework-to-optimize-shelf-space-allocations-for-physical-stores.pdf
