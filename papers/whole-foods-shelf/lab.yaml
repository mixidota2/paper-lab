core_idea:
  author_claim: '立地で変わる面積弾力性、購買が将来の店舗売上へ与える効果、業務制約の3つを組み合わせる。面積モデルは階層的な変数選択後に回帰をやり直す。長期効果には傾向スコアによる重み付けなどを挙げ、短期の価値と重みを付けて目的関数へ入れる。


    [一次資料：PDF §2–4 / 式(2)・(6)](https://cdn.amazon.science/32/d1/6c82b85045a9bc0927e744698688/scipub-approval152129-41212433-a-framework-to-optimize-shelf-space-allocations-for-physical-stores.pdf)'
  research_bot_interpretation: 面積モデルの正則化の偏りを減らす操作と、面積配分の交絡を除く操作は同じではない。また長期効果の処置は商品群からの購買であって、棚の拡張そのものではない。購入する人の違いを十分に調整できたかが重要になる。
sections:
  overview: 部門ごとの面積に対する需要反応を推定し、制約の下で売場を配分する。Whole Foodsの報告値は、シミュレーションで見積もった改善余地を表す。
  problem: '同じ部門でも、商圏や店舗の条件によって面積を増やす価値は違う。ほかの部門の面積も販売に影響するため、人気順に広げるだけでは全店の目的値を最大化できない。


    この論文が直接最適化するのは商品群・部門への面積配分。入口や奥といった店内の位置の最適化は、今後の拡張として挙げられている。'
  why_it_might_work: 地理変数と面積の相互作用を使えば、新店舗にも周辺条件に応じた反応を推定できると考えられる。ただし過去に広い面積が与えられた理由をモデルが取り逃すと、観測相関を最適化してしまう。
  evidence: 'Amazon Scienceの公開PDF全4ページを2026-09-07に確認。§4.2は改装で7.5%、新店設計で6.7%の潜在的な売上改善を報告する。§1はシミュレーションと明記。§3.2は長期因果効果の詳細な実証結果を省略している。DOIはPDFの書誌情報で10.1145/3764919.3770880を確認した。


    [一次資料：PDF §2–4 / 式(2)・(6)](https://cdn.amazon.science/32/d1/6c82b85045a9bc0927e744698688/scipub-approval152129-41212433-a-framework-to-optimize-shelf-space-allocations-for-physical-stores.pdf)'
  executable_understanding: '総面積100を2部門へ分け、各部門10以上の制約の下で目的値を全探索する。面積への反応を変えると、最適な配分がどう動くかを見る。


    実行：`uv run papers/whole-foods-shelf/run.py`。合成データの作り方と比較条件はコード内に記載し、図の全条件の結果を `results.json` へ保存する。'
  results: 初期条件の計算値と全条件の結果を示す。合成データ上の小実験であり、論文モデルの性能を測った値ではない。
  what_we_verified: '**メカニズム：PARTIAL（部分的）**。確認したのは、このLabで明記した仮定の下での計算と条件による変化。原論文の機構全体を確認した意味ではない。


    総面積100を2部門へ分け、各部門10以上の制約の下で目的値を全探索する。面積への反応を変えると、最適な配分がどう動くかを見る。'
  what_we_did_not_verify: PDFへのアクセス制限は今回解消した。ただし売上の絶対値は図で非公開・正規化され、因果効果の詳細結果やデータも本稿にはない。実店舗での無作為比較、代替購買、補充と面積の同時最適化は確認していない。
  implementation: '標準ライブラリだけで実行できる。入口は各Labの `run.py`、計算本体は `papers/_toy_common.py` にある。関数は論文IDごとに独立し、ブラウザー用の全条件と初期条件の表を同時に出力する。


    意図して省いたもの：DHGL推定、長期因果効果、部門間の代替・補完、実店舗データ。'
  mapping: '| 対象 | 原典とLabの対応 |

    | --- | --- |

    | 原論文 | [PDF §2–4 / 式(2)・(6)](https://cdn.amazon.science/32/d1/6c82b85045a9bc0927e744698688/scipub-approval152129-41212433-a-framework-to-optimize-shelf-space-allocations-for-physical-stores.pdf)
    |

    | 手法の図と数式 | 上記の仕組みを説明用に簡略化。公式実装ではない |

