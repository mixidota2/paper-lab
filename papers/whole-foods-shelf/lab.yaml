summary: Liらは、各部門の面積を変えたときの販売数量を商圏ごとに見積もり、費用と売場の制約を守る配分を選んだ。Whole Foods Marketの事例では、シミュレーション上の売上が既存手法より改装で7.5%、新店設計で6.7%高かった。
figures: []
core_idea:
  author_claim: |-
    著者は、ある部門の面積が1%変わると、各部門の週販売数量が何%変わるかを推定した。このときの変化率を面積弾力性と呼ぶ。著者は、商圏の特徴によって面積弾力性が変わるようにモデルを組み、さらに商品群を買った後の店舗売上への効果も別に見積もる方法を提案した。最後に、短期と長期の価値を合わせ、費用を引いた値が最も高くなる配分を探した。

    [一次資料：Amazon Scienceの公開PDF](https://cdn.amazon.science/32/d1/6c82b85045a9bc0927e744698688/scipub-approval152129-41212433-a-framework-to-optimize-shelf-space-allocations-for-physical-stores.pdf)
  research_bot_interpretation: もともと売れる部門に広い面積が割り当てられていたなら、過去のデータに現れる面積と販売数量の関係だけでは、面積を広げた結果とは言えない。著者の回帰手順は、罰則が係数を小さくする問題に対処している。また、購買後の長期効果は、商品群を買う場合と買わない場合を比べた値であり、棚を広げた場合の効果ではない。
sections:
  overview: |-
    Liらは店舗の立地に合わせて、各部門にどれだけ売場を配るかを決める方法を提案しました。人口などの商圏の特徴を使い、自部門や他部門の面積を変えたときの週販売数量を見積もります。ある商品群を買う場合と買わない場合を比べ、その後の店舗売上の差を推定するモデルも提案しています。著者はこの長期の見込みを短期の売上や費用と組み合わせ、店舗全体にとって有利な面積の配分を探します。部門別の長期効果の詳しい検証結果は論文に掲載されていません。

    Whole Foods Marketの事例で、著者は既存店の改装案と新店案を別々にシミュレーションしました。改装案は部門の面積を変えられる範囲を限ったものです。新店案では過去の部門面積の分布と費用をもとに条件を設定しました。既存手法と比べ、シミュレーション上の売上は改装案で7.5%、新店案で6.7%高くなりました。改装や出店のあとに測った売上ではありません。比較手法の具体名と対象店舗数も論文には記載されていません。
  problem: |-
    一つの部門を広げると、店舗の面積に余裕がなければ別の部門を狭める必要がある。しかも、部門を広げたときに販売数量がどれだけ変わるかは、店舗が置かれた商圏によって違う。部門ごとの現在の売上を並べるだけでは、店舗全体にとってよい配分は分からない。

    著者が決めるのは各部門にどれだけ面積を配るかである。各部門を入口側や奥側のどこに置くかは、今後の課題とした。
  why_it_might_work: 新店には自店の販売履歴がない。著者のモデルは周辺の商圏を入力にするため、既存店の情報をもとに新店でも面積に対する販売の反応を見積もれる。ただし、過去の割り当て理由がデータに表れていないと、モデルが面積の効果と部門の人気を区別できないおそれがある。
  evidence: |-
    著者は、Whole Foods Marketの改装案と新店案を別々にシミュレーションした。改装案では部門の面積を変えられる範囲を絞り、新店案では過去の面積分布と費用の条件を使った。既存手法と比べた売上改善の見込みは、改装が7.5%、新店設計が6.7%だった（§1、§4.2）。

    公開論文では、具体的な比較手法、対象店舗数、評価期間、集計の分母、信頼区間を確認できない。図1では販売の絶対値が伏せられ、図2では係数が0〜1に変換されている。購買後の長期効果についても、部門別の詳しい検証結果は掲載されていない。

    [一次資料：Amazon Scienceの公開PDF](https://cdn.amazon.science/32/d1/6c82b85045a9bc0927e744698688/scipub-approval152129-41212433-a-framework-to-optimize-shelf-space-allocations-for-physical-stores.pdf)
  executable_understanding: |-
    教材では総面積100をA部門とB部門に分け、どちらにも10以上を配る。操作図でA部門の面積弾力性を変えると、A部門の面積を10から90まで1ずつ動かした81案を比べられる。A部門を1広げれば、B部門は1狭くなる。

    棒グラフは、50ずつ配る案と、点数が最も高い案を比べる。折れ線は、A部門の面積ごとの点数を示す。点数は教材の式で計算しており、売上の金額を表さない。
  results: A部門の面積弾力性を0.5とした初期条件では、等分案の点数は268.7006で、点数が最も高い案は269.0716だった。Labは等分案も候補に加えて最大値を選ぶため、最大値は等分案を下回らない。店舗で増収したかどうかは、この比較からは分からない。
  what_we_verified: '**メカニズム：PARTIAL（部分的）**。Labは、仮定したA部門の面積弾力性を変えると、同じ面積制約の中でどの配分が選ばれるかを確かめた。確認したのは教材の計算であり、著者のモデル全体ではない。'
  what_we_did_not_verify: Labは著者の需要推定や購買後の長期効果を再現していない。実店舗で部門を広げたときの売上や、各部門の面積を変えたときに他部門の販売がどう変わるかも検証していない。面積と補充を同時に最適化する場合は、論文でも今後の課題である。
  implementation: リポジトリの最上位で `uv run papers/whole-foods-shelf/run.py` を実行すると、教材が全条件の結果を `results.json` に書く。コードはPythonの標準ライブラリだけで動き、実店舗データは使わない。論文のDHGLや購買の長期効果は実装していない。
  mapping: mapping.md
