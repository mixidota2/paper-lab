teaching_figures:
- kind: equations
  id: elasticity
  title: 商圏が違うと、同じ面積の変更でも販売の反応は変わる
  after: method
  locator: PDF 式(2)–(3)・§3.1
  rationale: 需要モデルが、自部門と他部門の面積、商圏の条件をどう使うかを式で示す。
  caption: 原式と同じ関係を弾力性eにまとめた。xは地理属性、sは部門面積を表す。著者は係数の数値を公開していない。
  steps:
  - name: モデルが部門iの販売数量を求める
    formula: log dᵢ(s,x) = log αᵢ + eᵢ(x) log sᵢ + Σⱼ≠ᵢ eᵢⱼ(x) log sⱼ + τᵀx
    explanation: eᵢは自部門、eᵢⱼは他部門の面積が変わったときの反応を表す。モデルは部門同士の補完と代替を、係数で扱う。
  - name: 商圏の条件によって面積弾力性を変える
    formula: eᵢ(x) = βᵢ + Σₗ γₗ xₗ
    explanation: 面積を1%変えたときの需要の変化率を、店舗周辺の条件に応じて変える。
  source: https://cdn.amazon.science/32/d1/6c82b85045a9bc0927e744698688/scipub-approval152129-41212433-a-framework-to-optimize-shelf-space-allocations-for-physical-stores.pdf
- kind: equations
  id: allocation
  title: 最適化は短期と長期の価値を合わせ、費用を差し引く
  after: method
  locator: PDF 式(6)・§3.3
  rationale: 面積を選ぶ計算が、何を大きくし、何を守るかを分けて示す。
  caption: hᵢ,Tは購買の長期効果、pᵢは平均価格、cᵢ,kは費用を表す。図では原式の括弧を整理した。
  steps:
  - name: 配分案を比べるための目的関数
    formula: maxₛ Σᵢ { dᵢ(s,x)[ωpᵢ + (1−ω)hᵢ,T(x)] − Σₖ cᵢ,k(s,x) }
    explanation: ωを0〜1で変えると、短期と長期のどちらを重く見るかが変わる。長期効果の推定に誤差があれば、選ぶ配分にも影響する。
  - name: 担当者が守る面積と業務上の条件
    formula: Σᵢ sᵢ ≤ S,    lᵢ ≤ sᵢ ≤ uᵢ
    explanation: Sは総面積、lᵢは部門別の下限、uᵢは上限を表す。著者は費用の上限と販売上の規則も制約に入れる。
  source: https://cdn.amazon.science/32/d1/6c82b85045a9bc0927e744698688/scipub-approval152129-41212433-a-framework-to-optimize-shelf-space-allocations-for-physical-stores.pdf
- kind: logic
  id: evidence-boundary
  title: 需要の推定、購買の長期効果、配分の評価で根拠を分ける
  after: method
  locator: PDF §3–4
  rationale: シミュレーション結果を、店舗で面積を変えた因果効果には読み替えない。
  caption: 図はLabが公開資料から確認できた範囲を示す。著者が示さなかった数値は補っていない。
  rows:
  - label: 部門の面積を変えたとき
    nodes:
    - title: 著者はDHGLで需要を推定する
      text: 地理条件を選んで回帰し直す。この方法は罰則で係数が小さくなる偏りに対処するが、交絡を調整したことにはならない。
  - label: 商品群を買ったとき
    nodes:
    - title: 著者はその後の店舗売上への効果を考える
      text: 公開本文は詳しい実証結果を示していない。Labは買う人と買わない人の違いをどう調整したかを独立に確認できない。
  - label: 部門に面積を配るとき
    nodes:
    - title: 著者は制約を置いてシミュレーションする
      text: 著者は改装と新店設計を別の条件で比較した。実店舗で売上が増えたかは検証していない。
  source: https://cdn.amazon.science/32/d1/6c82b85045a9bc0927e744698688/scipub-approval152129-41212433-a-framework-to-optimize-shelf-space-allocations-for-physical-stores.pdf
