summary: Liほかは、商圏に応じて部門の売場面積と販売数量の関係を見積もり、費用や業務の制約を守る配分を選ぶ。Whole Foodsの報告値は、改装と新店設計のシミュレーションで得た売上改善の見込みである。
figures: []
core_idea:
  author_claim: |-
    著者は、自部門と他部門の面積を変えた割合に対して需要がどれだけの割合で変わるかを、面積弾力性として見積もる。商圏による反応の違いを捉えるため、使う変数を階層的に選び、回帰し直す。これとは別に、商品の購買がその後の店舗売上に及ぼす効果を考える。著者は傾向スコアに基づく重み付けなどを挙げ、短期の価値と購買の長期効果に重みを付けて目的関数に入れ、業務制約の範囲で面積を配る。

    [一次資料：PDF §2–4 / 式(2)・(6)](https://cdn.amazon.science/32/d1/6c82b85045a9bc0927e744698688/scipub-approval152129-41212433-a-framework-to-optimize-shelf-space-allocations-for-physical-stores.pdf)
  research_bot_interpretation: 著者が係数を小さく抑える罰則を外して推定し直しても、広い棚を与えたから売れたのか、人気があったから棚も売上も大きいのかは別に確かめる必要がある。後者を分ける交絡の調整は、正則化の偏りへの対処とは異なる。また長期効果で比べるのは商品群を買う場合と買わない場合で、棚を広げる場合と広げない場合ではない。買う人と買わない人の違いを十分に調整できたかが重要になる。
sections:
  overview: |-
    Liらは、売場の広さに上限がある実店舗で、どの部門にどれだけ面積を配れば売上が増えるかを調べました。商圏ごとに、各部門の面積を変えたときの販売数量を見積もり、費用と売場の規則を守る配分を選びます。Whole Foodsの事例で、著者は改装の案で7.5%、新店の案で6.7%の売上改善を見込みました。いずれもシミュレーションの推定値です。公開論文では、比較相手の具体的な手法や評価店舗数を確認できず、実店舗でその分の売上が増えたことは示していません。
  problem: |-
    店舗担当者がある部門を広げると、ほかの部門に使える面積が減ることがある。さらに、ほかの部門の面積も販売数量に影響し、面積を広げたときの反応は立地によって変わる。現在の販売上位の部門から広げるだけでは、店舗全体の目的値を最大にする配分は分からない。

    著者が選ぶのは、商品群・部門ごとに使う面積である。入口や奥など、各部門を店内のどこに置くかは今後の課題としている。
  why_it_might_work: 商圏などの地理条件をモデルに入れれば、実績がまだない新店でも、その周辺条件から面積への反応を見積もれる。ただし、人気があったため過去に広い面積を割り当てた場合、その事情をモデルが扱えなければ、面積の効果ではなく過去の売上との相関で配分を選ぶおそれがある。
  evidence: |-
    Labは2026-09-07にAmazon Scienceの公開PDF全4ページを確認した。著者は§4.2で、改装で7.5%、新店設計で6.7%の売上改善の見込みを報告した。§1はシミュレーションと明記している。公開本文には、比較手法の具体名、対象店舗数、評価期間、改善率の分母、信頼区間がない（§4.2、p4）。購買の長期効果の詳しい実証結果も§3.2では省略されている。

    Labの教材では、等分50/50を含む候補を同じ式で採点し、最大値を選ぶ。そのため、選んだ値が等分以上になるのは計算の構成上の性質であり、店舗で売上が増えた証拠ではない。原典の書誌にあるDOIは10.1145/3764919.3770880である。

    [一次資料：PDF §2–4 / 式(2)・(6)](https://cdn.amazon.science/32/d1/6c82b85045a9bc0927e744698688/scipub-approval152129-41212433-a-framework-to-optimize-shelf-space-allocations-for-physical-stores.pdf)
  executable_understanding: |-
    Labは総面積100を2部門で使い、各部門に少なくとも10を割り当てる。操作図でA部門の面積に対する需要の反応を変えると、計算は制約内の候補をすべて採点して配分を選び直す。A部門を広げると、その分だけB部門が狭くなる。

    棒グラフは等分と選んだ配分の目的値を比べ、折れ線は候補ごとの目的値を示す。目的値は教材の式で計算した点数であり、実売上ではない。手元で試すには `uv run papers/whole-foods-shelf/run.py` を実行する。コードは合成データと比較条件を定め、図で選べる全条件の結果を `results.json` に保存する。
  results: 表は初期条件の値、操作図は反応を変えたときの候補と計算値を示す。数値は合成データに基づくもので、論文モデルの性能ではない。
  what_we_verified: '**メカニズム：PARTIAL（部分的）**。Labは、総面積100・2部門・各10以上という条件で、A部門が面積にどう反応するかを変えると、選ばれる配分と点数がどう変わるかを確かめた。これは教材の式の計算であり、原論文の仕組み全体や実売上は検証していない。'
  what_we_did_not_verify: 著者の図は絶対売上を示さず、比較できるよう値を正規化している。購買の長期効果を計算した詳細な結果やデータは公開論文にない。Labは実店舗での無作為比較、代替購買の検証、補充と面積の同時最適化を確認していない。
  implementation: |-
    この教材はPythonの標準ライブラリだけで動く。個別の `run.py` が `papers/_toy_common.py` の論文別の関数を呼び、操作図の全条件と初期条件の表を出力する。

    コードは制約を満たす面積の組合せを採点する。DHGLによる推定、購買の長期効果、部門間の代替・補完は実装せず、実店舗データも使わない。
