<svg xmlns="http://www.w3.org/2000/svg" width="940" height="410" viewBox="0 0 940 410" role="img" aria-labelledby="title desc">
<title id="title">著者は、販売数量と費用を見積もって面積を配る</title>
<desc id="desc">論文の処理を4段階で説明する。商圏に応じた需要と購買後の効果を推定し、制約の中で配分を選ぶ。</desc>
<rect width="940" height="410" fill="#f3f7fa"/>
<g font-family="Noto Sans CJK JP, sans-serif" fill="#15304a">
<text x="26" y="41" font-size="24" font-weight="700">著者は、販売数量と費用を見積もって面積を配る</text>
<rect x="26" y="63" width="888" height="69" rx="10" fill="#fff" stroke="#a6b7c7"/>
<text x="44" y="90" font-size="18" font-weight="700">1　面積と商圏から販売数量を見積もる</text>
<text x="44" y="114" font-size="16">著者は、自部門と他部門の面積を入力にする。商圏が違えば面積への反応も変わる。</text>
<rect x="26" y="145" width="888" height="69" rx="10" fill="#fff" stroke="#a6b7c7"/>
<text x="44" y="172" font-size="18" font-weight="700">2　購買後の店舗売上への影響を別に考える</text>
<text x="44" y="196" font-size="16">著者は、商品群を買った場合と買わなかった場合の将来の店舗売上を比べる。</text>
<rect x="26" y="227" width="888" height="69" rx="10" fill="#fff" stroke="#a6b7c7"/>
<text x="44" y="254" font-size="18" font-weight="700">3　配分が守る条件を決める</text>
<text x="44" y="278" font-size="16">総面積、部門ごとの面積、費用、販売上のルールで、選べる配分を絞る。</text>
<rect x="26" y="309" width="888" height="69" rx="10" fill="#fff" stroke="#a6b7c7"/>
<text x="44" y="336" font-size="18" font-weight="700">4　店舗全体の価値が最も高い配分を探す</text>
<text x="44" y="360" font-size="16">著者のモデルは、短期と長期の価値に重みを付け、費用を引いた結果を比べる。</text>
</g>
</svg>
