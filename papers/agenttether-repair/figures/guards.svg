<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 675" role="img" aria-labelledby="title"><title id="title">終了後の診断と再実行中の介入</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#53758b"/></marker></defs><rect width="440" height="675" rx="12" fill="#f5f8fb"/><g font-family="sans-serif" fill="#183447"><text x="20" y="30" font-size="21" fill="#183447">終了後の診断</text><rect x="20" y="48" width="400" height="92" rx="9" fill="#e0edf2"/><text x="32" y="73" font-size="16" fill="#183447">実行記録から処理のつながりを作る</text><text x="32" y="96" font-size="16" fill="#183447">二つの検出器が見つけた異常を診断役に渡す</text><text x="32" y="119" font-size="16" fill="#183447">診断役は原因、ずれた箇所、修正案を示す</text><path d="M220 143L220 165" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="170" width="400" height="64" rx="9" fill="#e0edf2"/><text x="32" y="195" font-size="16" fill="#183447">直したことと残った問題を記録する</text><text x="32" y="218" font-size="16" fill="#183447">次の試行では残った問題を伝える</text><text x="20" y="272" font-size="21" fill="#183447">やり直し中の介入</text><rect x="20" y="290" width="400" height="65" rx="9" fill="#e0edf2"/><text x="32" y="315" font-size="16" fill="#183447">同じ操作の繰り返しや、修正の抜けを探す</text><text x="32" y="338" font-size="16" fill="#183447">ツールの結果を返すときや返答を確定する前</text><path d="M220 357L220 379" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="384" width="400" height="110" rx="9" fill="#e0edf2"/><text x="32" y="409" font-size="16" fill="#183447">手掛かりが修正指示と一致するか確かめる</text><text x="32" y="432" font-size="16" fill="#183447">間隔を空け、回数と指示の量を抑える</text><text x="32" y="455" font-size="16" fill="#183447">必要な修正が終わったら介入を止める</text><text x="32" y="478" font-size="16" fill="#183447">予定の状態変更後は繰り返しだけを止める</text><path d="M220 497L220 519" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="524" width="400" height="65" rx="9" fill="#e0edf2"/><text x="32" y="549" font-size="16" fill="#183447">ツールの結果に修正指示を添える</text><text x="32" y="572" font-size="16" fill="#183447">または利用者役のメッセージを差し込む</text><text x="20" y="623" font-size="16" fill="#183447">介入が正しい操作を妨げることもある。</text><text x="20" y="650" font-size="16" fill="#183447">銀行業務で介入により13件が成功、3件が失敗</text></g></svg>