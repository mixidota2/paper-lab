<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 675" role="img" aria-labelledby="title"><title id="title">診断とguardつき介入</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#53758b"/></marker></defs><rect width="440" height="675" rx="12" fill="#f5f8fb"/><g font-family="sans-serif" fill="#183447"><text x="20" y="30" font-size="21" fill="#183447">終了後の診断</text><rect x="20" y="48" width="400" height="92" rx="9" fill="#e0edf2"/><text x="32" y="73" font-size="16" fill="#183447">完了trace → CTG → 異常の証拠</text><text x="32" y="96" font-size="16" fill="#183447">HGT ＋ Isolation Forest → 診断LLM</text><text x="32" y="119" font-size="16" fill="#183447">原因・転換点・回復ヒント</text><path d="M220 143L220 165" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="170" width="400" height="64" rx="9" fill="#e0edf2"/><text x="32" y="195" font-size="16" fill="#183447">Repair Memory : fixed / unresolved</text><text x="32" y="218" font-size="16" fill="#183447">次の試行のguidanceへ</text><text x="20" y="272" font-size="21" fill="#183447">再実行中の介入</text><rect x="20" y="290" width="400" height="65" rx="9" fill="#e0edf2"/><text x="32" y="315" font-size="16" fill="#183447">Check：loop / drift / 未実施の修正</text><text x="32" y="338" font-size="16" fill="#183447">tool return または text response</text><path d="M220 357L220 379" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="384" width="400" height="110" rx="9" fill="#e0edf2"/><text x="32" y="409" font-size="16" fill="#183447">Decide：証拠 ＋ active guidance</text><text x="32" y="432" font-size="16" fill="#183447">cooldown・回数上限・最小介入</text><text x="32" y="455" font-size="16" fill="#183447">完了後は停止</text><text x="32" y="478" font-size="16" fill="#183447">期待した書込後はloop以外を抑制</text><path d="M220 497L220 519" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="524" width="400" height="65" rx="9" fill="#e0edf2"/><text x="32" y="549" font-size="16" fill="#183447">Inject：tool resultへ追記</text><text x="32" y="572" font-size="16" fill="#183447">またはsynthetic user message</text><text x="20" y="623" font-size="16" fill="#183447">介入を増やすほど良いわけではない。</text><text x="20" y="650" font-size="16" fill="#183447">Banking：helped 13件 / hurt 3件</text></g></svg>