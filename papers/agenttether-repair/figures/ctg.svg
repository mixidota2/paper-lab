<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 610" role="img" aria-labelledby="title"><title id="title">処理のつながりから失敗の原因を探す</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#53758b"/></marker></defs><rect width="440" height="610" rx="12" fill="#f5f8fb"/><g font-family="sans-serif" fill="#183447"><text x="20" y="30" font-size="20" fill="#183447">失敗した処理から逆にたどる</text><rect x="115" y="50" width="210" height="48" rx="9" fill="#e0edf2"/><text x="127" y="75" font-size="16" fill="#183447">TU0：口座一覧を取得</text><path d="M165 100L108 131" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M280 100L330 131" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="136" width="195" height="70" rx="9" fill="#f1d7bf"/><text x="32" y="161" font-size="16" fill="#183447">TU1：口座を間違える</text><text x="32" y="184" font-size="16" fill="#183447">失敗の原因</text><rect x="235" y="136" width="185" height="70" rx="9" fill="#e0edf2"/><text x="247" y="161" font-size="16" fill="#183447">TU2：別の情報を読む</text><text x="247" y="184" font-size="16" fill="#183447">失敗の原因とは別</text><path d="M110 210L110 255" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M325 210L325 255" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="260" width="195" height="70" rx="9" fill="#f1d7bf"/><text x="32" y="285" font-size="16" fill="#183447">TU3：送金を試みる</text><text x="32" y="308" font-size="16" fill="#183447">TU1の口座番号を使う</text><rect x="235" y="260" width="185" height="70" rx="9" fill="#e0edf2"/><text x="247" y="285" font-size="16" fill="#183447">TU4：読み取りに失敗</text><text x="247" y="308" font-size="16" fill="#183447">エラー数が最多</text><path d="M110 334L110 377" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="382" width="195" height="65" rx="9" fill="#f1d7bf"/><text x="32" y="407" font-size="16" fill="#183447">TU5：最後に失敗する</text><text x="32" y="430" font-size="16" fill="#183447">ここで失敗が分かる</text><text x="20" y="488" font-size="16" fill="#183447">最後に失敗したのはTU5</text><text x="20" y="518" font-size="16" fill="#183447">エラー数が最も多いのはTU4</text><text x="20" y="548" font-size="16" fill="#183447">使ったデータを逆にたどるとTU1</text><text x="20" y="587" font-size="15" fill="#183447">TU1からTU3への線がないと、TU3を選んでしまう。</text></g></svg>