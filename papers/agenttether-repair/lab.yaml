core_idea:
  author_claim: 著者は、エージェントが何を見て、何をし、何が起きたかを処理ごとに記録します。処理の間で同じデータやエラーの特徴が現れる箇所をつなぎ、原因の候補を絞ります。次の実行では、残った問題を記録から引き継ぎ、必要なときだけその場で修正を促します。著者はモデルと環境を変えず、最大3回やり直した場合を評価しました（§III〜IV）。
  research_bot_interpretation: 失敗のきっかけを見つける力と、伝えた修正を最後まで守る力は分けて確かめたいところです。同じデータを使った処理を線で結ぶと、どこを調べるか決めやすくなります。ただし、その線だけで失敗の原因は確定しません。処理の結果を受け取ってから指示を加えても、すでに起きた変更は戻せません。
sections:
  overview: |-
    著者は、LLMエージェントのモデルを変えずに、失敗した仕事をやり直す仕組みを作りました。AgentTetherは、最初の実行を終えたあとに記録をたどり、失敗につながったと考えられる箇所を探します。その結果を次の実行に渡すだけでなく、実行が診断結果から外れたと判断したときは、途中で修正を促します。終了後の診断と、再実行中の介入を分けて比較しました。

    Qwen3.7-maxを使ったτ-benchの銀行業務で、最初に失敗した83件を調べました。終了後の診断だけでは39件、その診断に途中の介入を加えると49件が成功に変わりました。一方、診断だけなら成功し、介入を加えると失敗した課題も3件ありました。49件は初回失敗のうち修復できた件数で、銀行業務の全課題に対する成功率ではありません。
  problem: |-
    エージェントが最初に口座を間違え、後の処理でも同じ口座番号を使って送金しようとすると、最後に出たエラーだけを調べても原因を見落とします。一方、原因を伝えてやり直しても、エージェントが長い手順の途中でその指示を守らなくなることがあります。著者はこの二つを分けて扱いました。まず、失敗した実行の記録を調べます。次に、やり直しの途中で必要なときだけ修正を促します。
  why_it_might_work: |-
    後の処理がどのデータを受け取ったかを逆にたどると、エラーが目立つ箇所と、エラーが始まった箇所を分けて調べられます。すでに直したことを記録に残せば、次の試行では残った問題に集中できます。診断役と検証役が見誤ることもあります。正しい操作を誤って止めれば、介入しない場合よりも成績が悪くなります。
  evidence: |-
    ### 最初に失敗した課題を、最大3回やり直す

    著者はQwen3.7-maxで小売、航空、銀行業務の261課題を試しました。初回に失敗した123件だけをやり直し、方法ごとに最大3回まで試しました。銀行業務では97件のうち83件が最初に失敗しました。以下は、その83件に対する論文の表Iの結果です。

    | 銀行業務でのやり直し方 | 修復数 / 83 | 修復率 | 平均時間 |
    | --- | ---: | ---: | ---: |
    | 手掛かりを与えずやり直す | 22 | 26.51% | 21.38分 |
    | 評価役による最終結果の評価だけを渡す | 17 | 20.48% | 17.19分 |
    | エージェント自身に振り返らせる（Reflexion） | 22 | 26.51% | 19.36分 |
    | 終了後の診断だけを渡す | 39 | 46.99% | 17.88分 |
    | 終了後の診断に、やり直し中の介入を加える | 49 | 59.04% | 20.88分 |

    3領域とも途中で介入した方法を使うと、初回失敗123件のうち85件（69.11%）が成功に変わりました。GPT-5.4の銀行業務では、初回失敗86件のうち56件（65.12%）を修復しました。二つのモデルは最初に失敗した課題が違うため、この割合でモデルの優劣は比べられません。

    ### 介入で直った課題と、介入で失敗に変わった課題

    銀行業務では、介入を加えたときだけ成功した課題が13件あり、診断だけなら成功していた課題が3件ありました。差は10件です（対応のある比較のMcNemar検定、p=0.021）。小売は差が1件、航空は0件でした（表III）。銀行業務の13件では平均11.3回、3件では平均29.3回介入しました。これは成功か失敗かが変わった課題だけの集計で、実際の業務でどれくらい介入するかを示す数値ではありません。

    ### 診断で原因に近づいても、指示を守り続けるとは限らない

    著者は、銀行業務の失敗で、論文が正解とする手順のうち最初に違反した箇所と、各方法が選んだ箇所の距離を比べました。処理の単位（TU）で測った距離の中央値は、提案手法で5.5、直近の処理を選ぶ方法で6.0、エラーの件数で選ぶ方法で10.0でした。依存をたどる方法でも、原因の位置が毎回一致するわけではありません（§IV-B）。

    また、終了後の診断だけを使った173回のやり直しについて、修正指示に初めて違反するまでの長さも調べました。一度でも違反すると、それ以降は違反したままと数えます。まだ違反していない実行の割合が50%を下回ったのは、全領域を合わせると13回目のツール呼び出し、銀行業務では8回目でした。各呼び出しで、毎回独立に指示を守った割合を示した図ではありません（図3）。

    [一次資料：論文の評価（§II、§IV、表I〜III）](https://arxiv.org/html/2607.06273v1)
  executable_understanding: |-
    `uv run papers/agenttether-repair/run.py`

    Labは、原因が分かっている6つの処理を用意しました。TU1で間違った口座を選び、TU3がその口座番号を使って、最後のTU5が失敗します。別の経路のTU4には、最も多くエラーを入れました。最後に失敗した処理を選ぶ方法、エラーの多い処理を選ぶ方法、失敗から逆に依存関係をたどる方法を比べます。

    別の計算では、指示がどれだけ残っているかを表す架空の値を使います。値は一手順ごとに0.82倍になります。介入する設定では、値が0.55を下回り、前の介入から3手順以上たった場合に、値を1.0へ戻します。
  results: |-
    最後の失敗を選ぶ方法はTU5、エラー数で選ぶ方法はTU4を選びました。依存をたどる方法は、この例での原因であるTU1を選びました。ただし、TU1とTU3を結ぶ線を消すと、間違ってTU3を選びます。

    介入する設定では4、8、12手順目に、架空の値が1.0へ戻りました。Labが計算したのは、最初に決めた減衰と介入の規則を使った場合の値です。論文の図3が数えた最初の違反までの時間でも、モデルが指示を守り直す確率でもありません。
  what_we_verified: |-
    Labは、原因を設定した例で、依存をたどるとTU1を見つけられることと、線が欠けると選択を間違えることを確かめました。介入の判定については、手掛かりがあるか、問題が残っているか、前の介入から十分に間隔が空いたか、修正が完了していないかを確認しました。状態を書き換えた後は、同じ処理の繰り返しを止める場合だけが候補になります。その場合も、ほかの条件は省きません。
  what_we_did_not_verify: |-
    Labは、論文で使ったHGT、Isolation Forest、診断・検証用の言語モデルを動かしていません。τ-benchの修復率も、実際の業務での介入率も再現していません。著者が論文に掲載したコードへのリンクは確認しましたが、公式コードは実行していません。ツールが動いてから修正を促す方法で、送金などの変更を事前に防げるとは言えません。
  implementation: |-
    `localize()` は、最後に失敗した処理から依存を逆にたどり、異常と分かっている処理のうち最も早く起きたものを選びます。論文の検出器や診断モデルを置き換える実装ではありません。`guard()` は介入を許す条件をまとめ、`adherence()` は架空の指示の値が減って戻る過程を計算します。
  method: method.md
  mapping: |-
    | 論文で著者が行ったこと | Labで対応するもの | Labが確かめていないこと |
    | --- | --- | --- |
    | [§IIIと図4](https://arxiv.org/html/2607.06273v1)で、失敗原因の診断と途中の介入を示す | 手法の説明と、流れを整理した二つの図 | 図は考え方を説明するために描き直し、著者の図を複製していません。 |
    | §IVで、モデルが課題を修復できるかを比べる | 配布するコードと結果のファイルは、依存や介入条件を別の人工例で説明します。 | 論文のデータ、学習済みモデル、修復率は再現していません。 |
    | 論文に著者のコードの参照先を載せる | Labも論文にあるリンクを載せています。 | 掲載コードは実行しておらず、Labの計算と同じかは確かめていません。 |
