question: 失敗の原因を伝えた後、再実行で同じミスを防げるか
summary: AgentTetherは、失敗したエージェントの記録から原因を探し、やり直しが修正指示から外れたとき、条件を満たす場合だけ修正を促します。τ-benchの銀行業務で最初に失敗した83件のうち、診断だけなら39件、途中の介入も加えると49件を修復できました。介入によって失敗に変わった課題もあります。
