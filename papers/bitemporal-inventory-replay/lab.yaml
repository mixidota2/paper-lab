question: 報告の受領日と発生日が違うとき、在庫計算のどこをコードに任せるか
summary: 著者は、受領締切までの在庫と、決めた予定を適用した将来の在庫を求める課題で、モデルとコードの分担を比べた。合成履歴でGPT-5.4 miniが将来の3項目をすべて当てた割合は、生の報告で56.8%、コードで選んだ報告では86.5%だった。
