core_idea:
  author_claim: コードが先に報告を選ぶと、モデルは締切より後に届いた報告や古い版を使わずに済みます。後でコードが将来予定を適用すると、将来を計算する部分の間違いは防げます。ただし、モデルが返した開始時の在庫は修正しません。著者は、どの間違いが多いかはモデルによって違うと報告しました。
  research_bot_interpretation: 受領締切で報告を選ぶ規則と在庫の規則がすでに決まっていれば、どちらもコードで計算できます。モデルがその状態を扱う既存の仕組みを評価するときは、報告を選ぶ間違い、過去の在庫を求める間違い、将来予定を適用する間違いを分けて測ると、修正する箇所を決めやすくなります。
sections:
  overview: |-
    著者は、後から届いたり訂正されたりする報告から在庫を計算する課題を使い、モデルの前、後、呼び出しの中のどこにコードを置くかを比較しました。受領の締切を過ぎた報告は使わず、締切までに見えていた最新版を発生順に適用します。その在庫を出発点に、入力として与えた将来の入荷と需要を適用します。著者は12通りのモデル設定に計36,672件の要求を送りました。

    合成履歴では、GPT-5.4 miniが将来の3項目をすべて当てた割合は、生の報告を渡したときの56.8%から、コードで報告を選んで渡すと86.5%になりました。選択済みの報告からモデルが過去の在庫を答え、コードが将来を計算する条件では94.8%でした。ただし、後ろのコードは開始時の在庫を直しません。小売の条件でも実データは需要量だけに使っており、需要予測や実店舗の発注効果を測った結果ではありません。
  problem: |-
    商品が動いた日と、担当者が報告を受け取った日は一致するとは限りません。後から届いた訂正が、数量だけでなく発生日を変えることもあります。受領締切までの在庫を再現するには、二つの日付を分けて記録する必要があります。

    売り切れたときに売れなかった分を翌日に持ち越さないと、入荷と需要の順番によって結果が変わります。入荷と需要の合計が合っていても、順番を取り違えると在庫や売り逃しは合いません。
  method: method.md
  why_it_might_work: |-
    コードは同じ報告と規則から同じ在庫を計算できます。先に報告を選べば、モデルが受領時刻や版番号を見間違える場面を減らせますが、渡した報告から在庫を計算する仕事は残ります。

    将来の計算をコードに移すと、開始の在庫が正しければ将来予定を正しく適用できます。開始の在庫が怪しいときは、別に過去の報告を選び直し、在庫を確かめる必要があります。
  evidence: |-
    一次資料：[著者論文v1の§2〜4、表1〜2](https://arxiv.org/html/2611.14671v1)。

    ### 将来の3つの値をすべて当てた割合

    表1で数えたのは、最終在庫、将来の売り逃し総数、最初に売り逃しが出る時刻の三つが合った回答です。過去の二つの値を含む全5項目の正答率ではありません。著者は合成96履歴と小売需要48区間の一つひとつで2回答を取り、同じモデル設定と入力条件の中で採点しました。表の一つの値につき、合成は192回答、小売は96回答です。回答がない場合、形式が違う場合、回答を拒否した場合、出力が途中で終わった場合も不正解にしました。

    表1ではツールの選択をモデルに任せています。OpenAIとオープンウェイトのモデルには提供元が許す低い推論設定を使い、Anthropicは拡張思考なしと4,096トークンの設定を区別しました。

    | データとモデル | 生の報告 | 選択済みの報告 | モデルが過去を答え、コードが将来を計算 | 過去の正解を渡し、モデルが将来を計算 |
    |---|---:|---:|---:|---:|
    | 合成・GPT-5.4 mini | 56.8% | 86.5% | 94.8% | 94.8% |
    | 合成・GLM-5.3 Flash | 55.7% | 64.1% | 87.0% | 58.9% |
    | 合成・GPT-5.4 | 98.4% | 98.4% | 83.9% | 91.1% |
    | 小売需要・GPT-5.4 mini | 14.6% | 82.3% | 表1に記載なし | 89.6% |

    コードを足せばどのモデルでも正答率が上がるわけではありません。たとえばGLM-5.3 Flashは、過去の正解を渡す場合より、選択済みの報告を渡す場合の方が高い値でした。コードに任せる処理だけでなく、モデルに見せる情報や答え方も条件によって変わります。著者は別の日に同じ条件を再実行したときに8.9ポイント動いた例を挙げ、約9ポイント未満の差は確定的に扱っていません。

    小売需要の条件で実データを使ったのは、FreshRetailNetの店舗データから選んだ48区間の需要量です。在庫、入荷、報告の遅れと訂正はシミュレーションです。実店舗へ導入した結果とは読みません。

    ### 推論の量を指定することと、回答の方法を変えること

    表2の合成履歴・選択済み報告では、GPT-5.4 miniの推論設定を低から高にすると、回答ツールだけを使わせた条件では76.0%から34.9%へ下がりました。ツールの選択をモデルに任せた条件では86.5%から93.2%へ上がりました。ここでの高低は提供元に指定する設定で、モデル間で実際の計算量をそろえた値ではありません。

    合成の生の報告を対象に、ツールの選択は自動のまま、コード実行ツールを使えるようにした比較では、miniの将来3項目の正答率は34.9ポイント上がりました。回答ツールを強制した条件との比較も論文にありますが、その差には回答方法の違いも含まれます。コード実行を利用できることだけの差とは分けます。

    ### 在庫が間違っても、売り逃しの有無だけは当たる場合

    著者はminiについて、開始時の在庫を間違えた208件のうち166件では、売り逃しが起きるかどうかは正しかったと報告しました。これは付録Dの事後分析です。売り逃しの有無が合っても、在庫の数量まで合ったとは言えません。
  executable_understanding: experiment.md
  results: 同じ3日目の在庫を求めても、受領締切が2日目なら0個、4日目なら3個、6日目なら5個になりました。将来の入荷と需要は同じです。4日目と6日目を締切にしたとき、将来の売り逃しはどちらも0個ですが、最終在庫はそれぞれ1個と3個でした。
  what_we_verified: Labの人工例では、未着の報告は使わず、届いた訂正版を選び、その版の発生日を使うことを確認しました。訂正で発生日が対象日を過ぎたら、古い版は戻しません。同じ将来予定でも、開始の在庫が違えば在庫や売り逃しが変わることも確かめました。
  what_we_did_not_verify: Labはモデルの正答率、推論設定の差、規模を増やした際の性能、実店舗での運用を試していません。著者が公開したコードやログは、Labでは実行や再集計をしていません。
  implementation: Python標準ライブラリだけを使う `run.py` が、受領締切までの報告を選び、発生順に在庫を計算します。計算した3ケースを `results.json` に記録します。記事の操作欄では、計算済みの結果を締切ごとに切り替えます。
