<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 585" role="img" aria-labelledby="title desc">
  <title id="title">生成から予備順位付けへ状態を渡す</title>
  <desc id="desc">従来方式は候補だけを予備順位付けに渡す。OneRankerは内部で生成時の状態も渡し、学習時には確率分布を生成側に教える。その後の精密ランキングは残る。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#53758b" />
    </marker>
  </defs>
  <rect width="440" height="585" rx="12" fill="#f5f8fb" />
  <g font-family="sans-serif" fill="#183447">
    <text x="20" y="30" font-size="20" fill="#183447">従来：候補を探し、別のモデルで並べる</text>
    <rect x="20" y="48" width="400" height="60" rx="9" fill="#e0edf2" />
    <text x="32" y="73" font-size="16" fill="#183447">候補を予備順位付けに渡す</text>
    <text x="32" y="96" font-size="16" fill="#183447">候補を生成したときの状態は渡さない</text>
    <text x="20" y="147" font-size="20" fill="#183447">OneRankerは内部の3段をつなぐ</text>
    <rect x="20" y="166" width="320" height="65" rx="9" fill="#e0edf2" />
    <text x="32" y="191" font-size="16" fill="#183447">第1段：履歴から興味を表す</text>
    <path d="M180 232L180 255" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <rect x="20" y="259" width="320" height="92" rx="9" fill="#e0edf2" />
    <text x="32" y="284" font-size="16" fill="#183447">第2段：タスクと商品の中心を使う</text>
    <text x="32" y="307" font-size="16" fill="#183447">興味と価値を別の出力で予測する</text>
    <text x="32" y="330" font-size="16" fill="#183447">商品の大まかな特徴から候補を探す</text>
    <path d="M180 352L180 379" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <rect x="20" y="382" width="320" height="85" rx="9" fill="#e0edf2" />
    <text x="32" y="407" font-size="16" fill="#183447">第3段：候補の広告価値を採点する</text>
    <text x="32" y="430" font-size="16" fill="#183447">第1段と第2段の状態を再利用する</text>
    <text x="32" y="453" font-size="16" fill="#183447">候補ごとに点を出す</text>
    <path d="M345 426L395 426L395 300L345 300" fill="none" stroke="#b95a43" stroke-width="3" marker-end="url(#arrow)" />
    <text x="356" y="369" font-size="18" fill="#b95a43">DC</text>
    <text x="20" y="510" font-size="16" fill="#183447">DC：学習中だけ、候補の確率を生成側に教える</text>
    <text x="20" y="540" font-size="16" fill="#183447">既存の精密ランキングは、この後に残る。</text>
    <text x="20" y="563" font-size="16" fill="#183447">置き換えたのは候補検索と予備順位付け。</text>
  </g>
</svg>
