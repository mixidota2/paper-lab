<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 615" role="img" aria-labelledby="title desc">
  <title id="title">各トークンが参照できる相手</title>
  <desc id="desc">行は読む側、列は読まれる側。タスクは自分までのタスクと全中心を読む。中心は全タスクと自分を読み、他の中心は読まない。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#53758b" />
    </marker>
  </defs>
  <rect width="440" height="615" rx="12" fill="#f5f8fb" />
  <g font-family="sans-serif" fill="#183447">
