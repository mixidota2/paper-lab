    <rect x="357" y="342" width="34" height="30" rx="4" fill="#237d85" stroke="#aec1ca" />
    <text x="20" y="420" font-size="16" fill="#183447">行は読む側、列は読まれる側</text>
    <text x="20" y="450" font-size="16" fill="#183447">各タスクは自分までのタスクと全中心を読む。</text>
    <text x="20" y="480" font-size="16" fill="#183447">中心は全タスクと自分だけを読む。</text>
    <rect x="20" y="505" width="400" height="90" rx="9" fill="#e0edf2" />
    <text x="32" y="530" font-size="16" fill="#183447">F1とF2は商品のグループの中心。</text>
    <text x="32" y="553" font-size="16" fill="#183447">架空の広告や、実際の候補IDではない。</text>
    <text x="32" y="576" font-size="16" fill="#183447">第3段で実際の候補を細かく採点する。</text>
