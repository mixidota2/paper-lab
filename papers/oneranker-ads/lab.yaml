question: 広告の候補を探すモデルに、順位付けの情報をどう渡すか
summary: TencentのOneRankerは、広告候補の生成と予備順位付けを一つのモデルにまとめる。候補を生成したときの情報を順位付けで使い、学習時には順位付けの情報を生成側へ戻す。既存の精密ランキングは残した。
