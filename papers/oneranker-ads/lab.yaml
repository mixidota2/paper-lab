core_idea:
  author_claim: 著者は、興味と価値の出力を分け、商品のグループを代表する点を使って候補を生成する。候補単位の順位付けは生成途中の表現を利用し、学習では候補ごとの点を確率分布へ変えて生成側に教える。著者はWeixin Channelsで広告候補検索と予備順位付けを置き換え、その2段を対象に全面展開したと報告した（§3、§4.4）。
  research_bot_interpretation: 候補から外れた広告は、後段のモデルでは順位に戻せない。生成側に順位付けの情報を返すと、候補を選ぶ段にも価値の情報を渡せる。ただし、教師の予測や候補集合が偏っていれば、両段の出力が近づいても利益が上がるとは限らない。Gryphon-v2と比べる場合は、モデルの数より、配信のどの段を置き換えたかを先に見る。
sections:
  overview: |-
    Tencentの著者は広告の候補検索と予備ランキングを1つのモデルにまとめました。OneRankerは利用者の興味を捉える出力と広告の価値を見積もる出力を分け、候補を生成したときの表現を使って広告ごとの順位を付けます。従来の配信システムから置き換えたのはこの2段階で、後段の精密ランキングは変えていません。

    Weixin ChannelsのA/Bテストでは、配信の5%を対象にした段階で、クリックやコンバージョンを目的とする広告の流通総額（GMV-Normal）が従来方式より1.3427%増え、広告費も0.7190%増えました。[改訂版（v4）の評価](https://arxiv.org/html/2603.02999v4#S4.SS4)で著者が報告した2%増は、全面展開後に一部を従来方式に戻した別の比較でのGMV-Normalの変化です。いずれも広告全体の流通総額や利益がその割合で増えたことを示す数字ではありません。
  problem: よくクリックされる広告と、広告価値が高い広告は一致するとは限らない。一つの出力で両方を予測すると、興味の強い候補を拾うことと、価値の高い候補を拾うことが競合し得る。一方、生成と順位付けを完全に別のモデルにすると、順位付けで使う価値の情報が生成側に届かない。OneRankerは共有する情報と、分けて学ぶ出力を決める。
  why_it_might_work: 興味の出力を残し、広告価値を扱う別の出力を作ると、価値を学習する際に一つの出力で両方を表す必要がなくなる。商品のグループの中心を使うと、候補すべてを詳しく調べる前に、利用者が商品空間のどの領域を好むかを表せる。これは設計に基づく解釈で、両タスクが共有層に与える勾配の競合まで解消するとは限らない。
  evidence: |-
    一次資料：[第3版の表2–4](https://arxiv.org/html/2603.02999v3)、[第4版の§4.1–4.4](https://arxiv.org/html/2603.02999v4)。

    ### オフラインでは30件の候補を固定して、採点の違いを比べた

    第4版の§4.1では、従来の配信経路で精密ランキングまで進んだ30候補を共通で使う。表2のHR@5は、この候補集合のうち、正解が上位5件に入る割合だ。配信時に全カタログから500件を選ぶ精度とは異なる。

    | 構成 | HR@5 | NDCG@5 |
    | --- | ---: | ---: |
    | 第2段から候補の特徴とタスクの出力分離を外す | 0.5066 | 0.7275 |
    | 第2段から候補の特徴だけを外す | 0.5203 | 0.7285 |
    | 第2段まで | 0.5448 | 0.7440 |
    | 第3段の順位付けのみ | 0.6157 | 0.7849 |
    | 第2段の状態を第3段へ渡さず、分布を近づける損失だけを追加 | 0.6161 | 0.7858 |
    | 第2段の状態を渡し、分布を近づける損失は外す | 0.6173 | 0.7865 |
    | すべて使う | 0.6213 | 0.7904 |

    第3版の説明と表2では、0.6161と0.6173に対応する構成が食い違っていた。第4版は表に合わせて説明を直した。第3段の順位付けのみを基準にすると、第2段の状態を渡すだけでHR@5が0.16ポイント、分布を近づける損失を使うだけで0.04ポイント上がった。両方を使った差は0.56ポイントだった。第2段までの構成と第3段の順位付けのみの差の方が大きい。表3では、第2段のcross-attentionを先に行う設計を外すと0.5277、トークンの種類ごとに参照先を分けるマスクを外すと0.5335になった。

    ### 本番では候補検索と予備順位付けを置き換え、精密ランキングは残した

    Weixin Channelsの対照は、GPRで候補を探し、別に学習したモデルが予備順位を付ける既存方式だ。どちらの条件でも、その後の精密ランキングは共通だ。表4のGMV-Normalは、クリックやコンバージョンを目的にした広告の取引総額で、広告全体の取引総額とは異なる。

    | 試験段階 | GMV-Normalの相対変化 | 95%信頼区間 | 全GMVの相対変化 |
    | --- | ---: | --- | ---: |
    | 5% | +1.3427% | [0.1637%, 2.5216%] | +0.4067% |
    | 20% | +0.6446% | [0.2139%, 1.0754%] | +0.7796% |
    | 80% | +0.3500% | [0.0188%, 0.6812%] | +0.0843% |

    5%と80%の段階では、全GMVの信頼区間に0が含まれる。5%段階では広告費が0.7190%増えた。著者は配信を広げると伸び率が小さくなった理由を、配信対象の範囲の違いで説明しているが、本文から補正方法は分からない。

    [第4版の§4.4](https://arxiv.org/html/2603.02999v4#S4.SS4)では、全面展開後に5%を従来方式へ戻す別の試験を行い、GMV-Normalが2%増えたと報告した。上の表とは別の比較で、同じ節に信頼区間は示されていない。広告全体の取引額や利益の伸びを示した値ではない。なお、第3版の会議名やDOIにはひな型の文字列が残っており、出版先の確定には使わない。
  executable_understanding: |-
    リポジトリの最上位から `uv run papers/oneranker-ads/run.py` を実行する。最初の人工例は、同じ入力xに対して興味ではx、価値では−xを正解とし、一つの出力を共有する場合と、別々の出力を使う場合の損失を求める。

    次の例では候補を4件に固定する。教師の点からsoftmaxで得た確率に近づくよう、交差エントロピーで生成側の点を200回更新する。温度は1、学習率は0.2だ。
  results: |-
    一つの出力を共有すると、興味と価値の平均二乗誤差はどちらも2.5だった。出力を分けると、どちらも0になった。出力を分けられる人工例での結果であり、利用者の興味を広く拾えるようになったという測定ではない。

    4候補を固定した例では、教師と生成側の上位2件の集合が、更新前は重ならず、更新後は同じになった。不一致率は教師の上位集合のうち、生成側の上位に入らない候補の割合だ。集合内の並び順の一致は測らない。結果ファイルには途中の確率とKLも保存した。
  what_we_verified: '**仕組みの検証：一部のみ（Mechanism: PARTIAL）**。Labは、相反する目標を一つの出力で表した場合の誤差と、同じ候補の中で教師の確率に近づける更新を確かめた。タスク用トークン、参照範囲を決めるマスク、商品のグループを表すトークンの効果は検証していない。'
  what_we_did_not_verify: Labは、本番の広告価値（eCPM）、取引総額、興味をどれだけ広く拾えるか、規模を増やした場合の性能、応答時間を検証していない（NOT TESTED）。教師の予測確率の校正、候補外の高価値広告、共有層で複数タスクが与える勾配も調べていない。図3の曲線から細かな数字は読み取らず、上位集合が近づくという著者の観察にとどめる。
  implementation: '`conflict()` は一つの出力を使う場合と分けた場合の最小損失を求める。`align()` は教師の分布を固定し、交差エントロピーの勾配p−qで生成側の点を更新する。出力を分ける例と、順位付けの分布に近づける例は別の人工実験だ。'
  method: method.md
  mapping: |-
    | 原論文の箇所 | Labで扱う内容 | 確認していないこと |
    | --- | --- | --- |
    | [第3版と第4版の手法](https://arxiv.org/html/2603.02999v4) | 方法と図で、入力の共有と分布を近づける学習を説明した。 | 図はLabの説明用で、原図を転載したものではない。 |
    | 出力分離と確率分布の模倣 | `run.py` で人工例を計算し、`results.json` に保存する。 | 本番データやニューラルモデル、論文の成績は再現していない。 |
    | 公式実装 | 確認した原論文には、実行可能な公式コードへのリンクが見当たらなかった。 | 公式実装との同等性は未検証。 |
