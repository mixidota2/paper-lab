question: 推薦の設定を試すとき、いつ次の候補に移り、何を次の実験に残すか
summary: TaobaoのPILOTは、推薦実験の進行、候補の提案、過去の結果の整理を3つの役に分けます。5つの実験グループでの前後比較では、商品詳細ページへの訪問数が最も伸びたグループの値は、共通基準に対してROAMで+1.00%、PILOTで+1.40%でした。各役の寄与を分ける比較は未実施です。
