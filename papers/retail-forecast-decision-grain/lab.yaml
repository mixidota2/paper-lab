question: 予測誤差が小さいモデルは、カテゴリ計画や発注でも良いのか
summary: 販促計画の条件をそろえた比較でも、商品からカテゴリへの合計や、窓の平均順序、超過・不足費用によって順位は変わります。訂正されたカテゴリ費用と単期発注損失を、操作できる合成例で確かめます。
