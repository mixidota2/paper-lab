teaching_figures:
- id: plan-state
  kind: architecture
  title: 過去の売上をまとめた状態から、販促計画を使う場合と使わない場合を予測する
  after: method
  source: https://arxiv.org/pdf/2610.25170v1
  locator: §4 Figure2・Eq.3–4
  rationale: world modelは、同じ過去の状態から、販促計画を使う場合と使わない場合を別々に進める。
  caption: Labは初版の手順を図にした。liftは計画の有無による予測値の差で、実際の販促が売上を変えた量ではない。
  rows:
  - label: 過去
    nodes:
    - title: Transformer
      text: モデルは過去の売上・価格・暦を状態 s_t にまとめる。
  - label: 将来
    nodes:
    - title: 計画 p
      text: モデルは計画 p を使って、将来の状態 s_(t+h)(p) を作る。
    - title: 計画なし p⁰
      text: モデルは計画なしの p⁰ も、同じ遷移で将来の状態 s_(t+h)(p⁰) に進める。
  - label: 読出し
    nodes:
    - title: log予測
      text: log ℓ + baseline(p⁰) + readout(p) − readout(p⁰)
- id: cost-order
  kind: equations
  title: 商品を足し、期ごとの絶対誤差を取り、最後に評価期間を平均する
  after: method
  source: https://arxiv.org/pdf/2610.25170v1
  locator: §5 Eq.7
  rationale: カテゴリ内で商品を足す順序と、各評価期間の値を平均する順序を分ける。
  caption: pは評価期間より前の平均単価である。分母が0の場合、費用の比率は未定義になる。
  steps:
  - name: カテゴリ内合計
    formula: y_nt = Σ_(i∈n) y_it
    explanation: 同じ期について、カテゴリ内の実績を足し、同じ商品の予測も別に足す。
  - name: 窓内の費用
    formula: C_k = Σ_n p_n Σ_t |y_nt − ŷ_nt| / Σ_n p_n Σ_t y_nt
    explanation: 各期の絶対誤差を足し、単価を掛けてから、同じ単価で求めた実績売上の合計で割る。
  - name: 窓間の報告値
    formula: C̄ = (1/K) Σ_k C_k
    explanation: 評価期間ごとの比率を、同じ重みで平均する。全期間で分子と分母を別々に足したあとで割る方法（pool）ではない。
