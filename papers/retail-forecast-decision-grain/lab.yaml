verdict: Worth Reading
status: draft
question: 商品別の予測がよく当たるモデルは、カテゴリの売上計画や発注でも有利か
summary: 商品ごとの予測がよく当たるモデルでも、カテゴリの計画費用や発注の損失が最小とは限らない。Labは初版の計算を人工例で試し、第3版で条件を変えた評価とは分けて説明する。
verification:
  mechanism: PARTIAL
  performance: NOT TESTED
  scaling: NOT TESTED
  production_applicability: NOT TESTED
source_review:
  checked: '2026-11-09'
  url: https://arxiv.org/pdf/2610.25170v1
  scope: 指定した論文本文、著者のCSVと訂正式のコードを読みました。補足資料全体や全ての図の画素は確認せず、著者モデルも実行していません。
core_idea:
  author_claim: 著者が初版で比べた公開データでは、商品別の予測、カテゴリの計画、発注に置いた費用のどれを測るかで、最も成績がよいモデルが変わる場合があった。
  research_bot_interpretation: Labは、予測誤差の小ささだけで採用を決めない。各モデルに与える販促情報、実績と予測を合計する順番、費用の定義をそろえて比較する手順を示す。
sections:
  overview: |-
    著者は、小売の需要予測で、商品ごとの予測誤差が小さいモデルを選べば、カテゴリの計画や商品の発注でも費用を抑えられるかを調べました。4つの公開データ源を9つの評価単位に分け、LightGBMなどのモデルと、複数の予測を平均する方法を比べました。商品・店舗ごとの予測誤差では、平均する方法が9つのうち7つで最小でした。一方、カテゴリの計画費用や、余りと不足に重みを付けた発注の費用で比べると、最も費用の低いモデルは変わりました。元データに在庫の記録がないため、欠品で売れなかった需要は分かりません。
  problem: 小売では、担当者が商品・店舗ごとに発注し、別の単位でカテゴリの計画を立てる。商品ごとに予測誤差が小さくなっても、カテゴリ全体で誤差が小さくなるとは限らない。余りと不足の費用に差があれば、発注で採用するモデルも変わる場合がある。
  method: method.md
  why_it_might_work: Labは、順位が変わる理由を分けて説明する。同じカテゴリの商品を先に足すと、ある商品の過大予測を、別の商品の過小予測が打ち消す場合がある。これとは別に、旧式は売上が0の組でも誤差が残ると、小さな定数で割るので値が極端に大きくなる。
  evidence: evidence.md
  executable_understanding: experiment.md
  results: Labが保存したのは、画面の初期条件で計算した値と、1期分の発注損失9例である。著者のCSVでどのモデルの費用が最小だったかは、検証・根拠の節に分けて載せた。
  what_we_verified: Labは、自作の式が境界値を扱えること、計算し直しても保存値と一致すること、著者のCSVの一部から最小値を集計できることを確認した（CONFIRMED）。手法全体を再現したわけではない（PARTIAL）。
  what_we_did_not_verify: Labは著者モデルを学習・実行していない。実店舗の利益や運用時の性能も測っていない。補足資料全体や全図の画素は確認できていない（NOT TESTED）。教材の当初の検証では、実ブラウザーで画面を動かしていない。
  implementation: READMEに載せたコマンドをuvで実行すると、Labのコードが人工例の結果を作り直す。外部APIや学習済みモデルには接続しない。
