teaching_figures:
- id: plan-state
  kind: architecture
  title: 著者は、同じ過去から販促計画ありとなしの予測を作った
  after: method
  source: https://arxiv.org/pdf/2610.25170v1
  locator: §4 Figure2・Eq.3–4
  rationale: world modelが同じ履歴を使って、二つの計画のもとで将来の状態を別々に更新する流れを示す。
  caption: 初版の手順。liftは計画を変えたときの予測値の差で、実店舗の販促で増えた売上を測った値ではない。
  rows:
  - label: 過去をまとめる
    nodes:
    - title: Transformerが過去を状態にまとめる
      text: モデルは過去の売上・価格・暦を読み、状態 s_t にまとめる。
  - label: 将来の状態を作る
    nodes:
    - title: 予定どおり価格や販促を変える
      text: モデルは計画 p を使い、将来の状態 s_(t+h)(p) を作る。
    - title: 販促計画がない場合を作る
      text: モデルは計画なしの p⁰ でも同じ処理を繰り返し、将来の状態 s_(t+h)(p⁰) を作る。
  - label: 予測値に直す
    nodes:
    - title: 計画ありとなしの差を足す
      text: log ℓ + baseline(p⁰) + readout(p) − readout(p⁰)
- id: cost-order
  kind: equations
  title: 著者は、商品を足してから各期の誤差を求める
  after: method
  source: https://arxiv.org/pdf/2610.25170v1
  locator: §5 Eq.7
  rationale: カテゴリ内で数量を足す段階、誤差を金額に直す段階、評価期間を平均する段階を示す。
  caption: pは評価期間より前の平均単価を表す。分母が0なら費用の比率は出ない。
  steps:
  - name: 実績と予測を別々に合計する
    formula: y_nt = Σ_(i∈n) y_it
    explanation: 同じ期・カテゴリ・店舗について、商品の実績を足す。予測も同じ範囲で別に足す。
  - name: 期間の誤差を、実績を金額にした合計で割る
    formula: C_k = Σ_n p_n Σ_t |y_nt − ŷ_nt| / Σ_n p_n Σ_t y_nt
    explanation: 各期の絶対誤差を足し、過去の単価で金額に直す。同じ単価を実績に掛けた合計で割る。
  - name: 期間ごとに計算した比率を平均する
    formula: C̄ = (1/K) Σ_k C_k
    explanation: 著者は、各期間の比率を同じ重みで平均した。全期間で分子と分母を足して最後に割る方法（pool）とは異なる。
