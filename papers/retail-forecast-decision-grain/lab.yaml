teaching_figures:
- id: plan-state
  kind: architecture
  title: 過去状態から、計画あり・なしの予測を作る
  after: method
  source: https://arxiv.org/pdf/2610.25170v1
  locator: §4 Figure2・Eq.3–4
  rationale: world modelの計画あり・なしの状態展開と予測経路を示す。
  caption: 自作説明図。liftは予測上の差で、因果効果ではありません。
  rows:
  - label: 過去
    nodes:
    - title: Transformer
      text: 売上・価格・暦 → 状態 s_t
  - label: 将来
    nodes:
    - title: 計画 p
      text: gated transition → s_(t+h)(p)
    - title: 計画なし p⁰
      text: 同じ遷移 → s_(t+h)(p⁰)
  - label: 読出し
    nodes:
    - title: log予測
      text: log ℓ + baseline(p⁰) + readout(p) − readout(p⁰)
- id: cost-order
  kind: equations
  title: 合計・絶対値・平均の順序を固定する
  after: method
  source: https://arxiv.org/pdf/2610.25170v1
  locator: §5 Eq.7
  rationale: カテゴリ・期・窓の順序を分離する。
  caption: pは窓より前の平均単価。分母0は未定義です。
  steps:
  - name: カテゴリ内合計
    formula: y_nt = Σ_(i∈n) y_it
    explanation: まず商品をまとめ、同じ期の予測と比較する。
  - name: 窓内の費用
    formula: C_k = Σ_n p_n Σ_t |y_nt − ŷ_nt| / Σ_n p_n Σ_t y_nt
    explanation: 各期の絶対誤差を足し、単価で重み付けする。
  - name: 窓間の報告値
    formula: C̄ = (1/K) Σ_k C_k
    explanation: 窓ごとの比率を同じ重みで平均。poolとは異なる。
