source_review:
  checked: '2026-11-09'
  url: https://arxiv.org/pdf/2610.25170v1
  scope: 指定本文と公式CSV・訂正式コードを読解。全補足・全図画素・原モデル実行は未検証。
core_idea:
  author_claim: 同じ公開データでも、意思決定の粒度と費用の定義によって最良モデルが変わる。
  research_bot_interpretation: 予測精度の単一順位だけで採用を決めず、販促入力・集約順序・費用を固定して再評価するための資料。
sections:
  overview: 4公開データ源・9パネルを比較したv1を扱います。本文の原著報告と自作合成例を分けて表示します。
  problem: 商品別の誤差を減らしても、カテゴリの合計や非対称な発注費用が同じように改善するとは限りません。
  method: method.md
  why_it_might_work: カテゴリ内で反対方向の誤差が相殺されることと、ゼロ売上を小さな定数で割ることを分けると、評価式の変更で順位が変わる理由が見えます。これはLabの解釈です。
  evidence: evidence.md
  executable_understanding: experiment.md
  results: 保存値は初期合成例と9つの単期損失です。公表CSVの勝数は証拠節に分離しています。
  what_we_verified: CONFIRMED：自作式・境界・再生成一致と、条件を限定した公式CSVの最小値集計。Mechanism全体はPARTIAL。
  what_we_did_not_verify: 原モデル学習・推論、実店舗利益、運用性能、全補足と全図の画素監査はNOT TESTED。実ブラウザーも未検証。
  implementation: READMEのuv手順で再生成します。外部APIや学習済みモデルを呼びません。
