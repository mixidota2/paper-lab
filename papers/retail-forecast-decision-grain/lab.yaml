  arxiv: https://arxiv.org/abs/2610.25170
  official_code: https://github.com/karthik-iyer-au/retail-world-models
verdict: Worth Reading
status: draft
question: 商品別の予測がよく当たるモデルは、カテゴリの売上計画や発注でも有利か
summary: 販促計画を同じ条件で使っても、商品をカテゴリにまとめる順番、評価期間の平均の取り方、余りと不足の費用によって、モデルの順位は変わります。カテゴリの費用を測る訂正式と、1期分の発注損失を、自作の例で確かめます。
verification:
  mechanism: PARTIAL
  performance: NOT TESTED
  scaling: NOT TESTED
  production_applicability: NOT TESTED
source_review:
  checked: '2026-11-09'
  url: https://arxiv.org/pdf/2610.25170v1
  scope: 指定した論文本文、著者のCSVと訂正式のコードを読みました。補足資料全体や全ての図の画素は確認せず、著者モデルも実行していません。
core_idea:
  author_claim: 同じ公開データでも、商品別かカテゴリ別か、どんな費用を測るかによって、最も成績がよいモデルは変わりうる。
  research_bot_interpretation: 予測精度だけで採用を決めず、入力する販促計画、売上を合計する順番、費用の定義をそろえて比較し直すための教材です。
sections:
  overview: 4つの公開データ源を9つの評価単位に分けて比較した論文の第1版を扱います。論文の報告とLabの自作例を分けて紹介します。
  problem: 商品別の予測誤差が減っても、カテゴリ全体の予測が同じように改善するとは限りません。商品が余る場合と足りない場合で費用が違うと、発注で選ぶモデルも変わりえます。
  method: method.md
  why_it_might_work: 同じカテゴリ内で商品をまとめると、過大予測と過小予測が打ち消し合う場合があります。一方、旧式では売上が0でも誤差が残ると、小さな定数で割るため値が大きくなります。この2つを分けて考えると、順位が変わる理由が分かります。これはLabの解釈です。
  evidence: evidence.md
  executable_understanding: experiment.md
  results: 保存した値は、教材の初期条件での計算結果と、1期の発注損失9例です。著者のCSVで費用が最小だった回数は、検証・根拠の節に分けて載せています。
  what_we_verified: 確認済み（CONFIRMED）は、自作の式の計算、境界値、再生成と保存値の一致、著者のCSVの一部を使った最小値の集計です。手法全体の確認は一部（PARTIAL）です。
  what_we_did_not_verify: 著者モデルの学習・推論、実店舗の利益、運用時の性能、補足資料全体と全ての図の画素は未検証（NOT TESTED）です。実ブラウザーでも確認していません。
  implementation: READMEのコマンドをuvで実行すると、教材の計算結果を再生成できます。外部APIや学習済みモデルは使いません。
figures: []
interactives: []
teaching_figures:
- id: plan-state
  kind: architecture
  title: 過去状態から、計画あり・なしの予測を作る
  after: method
  source: https://arxiv.org/pdf/2610.25170v1
  locator: §4 Figure2・Eq.3–4
  rationale: world modelの計画あり・なしの状態展開と予測経路を示す。
  caption: 自作説明図。liftは予測上の差で、因果効果ではありません。
  rows:
  - label: 過去
    nodes:
    - title: Transformer
      text: 売上・価格・暦 → 状態 s_t
  - label: 将来
    nodes:
    - title: 計画 p
      text: gated transition → s_(t+h)(p)
    - title: 計画なし p⁰
      text: 同じ遷移 → s_(t+h)(p⁰)
  - label: 読出し
    nodes:
    - title: log予測
      text: log ℓ + baseline(p⁰) + readout(p) − readout(p⁰)
- id: cost-order
  kind: equations
  title: 合計・絶対値・平均の順序を固定する
  after: method
  source: https://arxiv.org/pdf/2610.25170v1
  locator: §5 Eq.7
  rationale: カテゴリ・期・窓の順序を分離する。
  caption: pは窓より前の平均単価。分母0は未定義です。
  steps:
  - name: カテゴリ内合計
    formula: y_nt = Σ_(i∈n) y_it
    explanation: まず商品をまとめ、同じ期の予測と比較する。
  - name: 窓内の費用
    formula: C_k = Σ_n p_n Σ_t |y_nt − ŷ_nt| / Σ_n p_n Σ_t y_nt
    explanation: 各期の絶対誤差を足し、単価を掛けて、実績の売上金額の合計で割る。
  - name: 窓間の報告値
    formula: C̄ = (1/K) Σ_k C_k
    explanation: 評価期間ごとの比率を同じ重みで平均する。全期間の分子・分母をまとめて割る方法（pool）とは異なる。
