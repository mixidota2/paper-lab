core_idea:
  author_claim: 著者は、小売の予測を商品・店舗ごとに評価した場合と、カテゴリに集計して誤差や費用を評価した場合で、最もよい方式が変わると報告した。
  research_bot_interpretation: Labは、予測誤差、実績と予測を足し合わせる順番、余りと不足に置く費用を分けて考える。同じ販促情報を各方式に渡し、それぞれの用途で比べる。
sections:
  overview: |-
    IyerとDabbeeruは、販売数の予測を商品・店舗ごとに評価した場合と、カテゴリにまとめて評価した場合とで、誤差が最も小さいモデルは変わるかを調べました。著者は価格や販促の計画を予測に使いました。4つの公開データ源のうち、Dominick’sは6つの商品カテゴリに分け、M5、Frat、Favoritaを加えた9つの単位で比較しました。

    初版では、将来の状態を1期ずつ更新するworld model、LightGBM、価格や販促の計画を入力したTimesFMの予測を、同じ重みで平均しました。商品×店舗の予測では、この平均の誤差が9つのうち7つで最小でした。カテゴリ×店舗の計画では、著者は同じカテゴリ・店舗の商品の販売実績と予測を、期ごとにそれぞれ足しました。その差の絶対値を過去の単価で金額に換算して足し、販売実績を同じ単価で換算した合計で割りました。これは予測誤差を比べる指標で、店舗が実際に支払った費用ではありません。訂正後の指標が最も小さかったのは、8つのうち4つで3モデルの平均、3つでLightGBM、残る1つでworld modelでした。

    第3版では、調整したworld modelとLightGBMの2モデルを平均しました。この平均は、9つの評価単位をそれぞれ3通りの集計方法で比べたとき、27通りのうち22通りで誤差が最小でした。一方、調整に使わなかった最終期間では、平均が最小だったのは8つのうち3つです。初版とはモデルの組み合わせや評価条件が違うため、この件数の差はモデルの改善幅を示しません。論文が予測したのは販売数で、欠品がなければ売れた数量や、予測を導入すると店舗の利益がどれだけ変わるかは分かりません。
  problem: 発注担当者は商品と店舗ごとに個数を決め、カテゴリの担当者は複数の商品をまとめて売上を計画する。商品ごとの誤差が減っても、それをまとめた値の誤差が減るとは限らない。不足と余りにかかる費用が違えば、発注側のモデル選びも変わりうる。
  method: method.md
  why_it_might_work: 同じカテゴリの商品を先に足すと、ある商品の過大予測と別商品の過小予測が打ち消し合う場合がある。一方、旧式は売上0の組に誤差が残ると、小さな定数で割るため評価値が極端に大きくなる。教材では、その二つを別の操作で確かめる。
  evidence: evidence.md
  executable_understanding: experiment.md
  results: 配布する results.json には、架空の初期値を使って求めた評価の比率と、1期分の発注損失9例を収録した。各項目の意味は対応表で説明する。著者の公開表から数えた件数は「検証・根拠」に示す。
  what_we_verified: Labは、教材の式を境界値でも計算し、再生成した値が保存済みの数値と一致することを確認した。著者の公表表から、費用が最小だった件数も数えた（CONFIRMED）。著者の手法全体との照合は部分的である（PARTIAL）。
  what_we_did_not_verify: Labは著者モデルを学習・実行していない。実店舗の利益や運用時の性能は測っていない。補足資料全体、すべての図の描画、今回の実ブラウザーでの操作も、教材の数値検査では確認していない（NOT TESTED）。
  implementation: READMEのコマンドを実行すると、Labのコードが架空の売上と予測から結果を作り直す。モデルの学習、外部APIへの接続、実データの取得は行わない。
