source_review:
  checked: '2026-10-27'
  url: https://arxiv.org/html/2610.35496v1
  scope: 公開された本文と表I〜IIIを確認した。著者の実行ログと分析コードは未確認。
core_idea:
  author_claim: 著者は、コーディングエージェントの履歴を削るとき、解決数だけではなく、同じ情報を取り直す手間と、前回の入力を安く再利用できなくなる費用も測る必要があると指摘した。
  research_bot_interpretation: Lab では、短くなった入力の量と、割引を失って通常単価になる入力の量を分けて数える。著者の実行とは別に、固定の記号列で計算を追う。
sections:
  overview: |-
    著者は、コーディングエージェントが過去の推論やツールの出力を消すと、解決する課題の数と費用がどう変わるかを調べた。SWE-bench Verified の100課題で、同じモデルを使う2種類のエージェントを比較した。削除する範囲・単位・量・タイミングを変えた42条件と削除なしの基準を合わせて、9,400回の実行を調べた。

    直近2ターンを残した42評価では、削除なしより解決した課題数が有意に減ったのは5評価だった。すぐに削ると、19評価に増えた。また、著者は、残した出力よりも消した出力の方が、後から読み直されやすいことを確認した。

    直近2ターンを残した42評価では、すべての入力を同じ単価で数えると、26評価で費用の推計値が下がった。一方、前回と同じ入力の先頭を安く再利用できる料金を使うと、費用が下がった評価はなかった。途中の履歴を書き換えると、最初に変わった位置より後ろを通常単価で数え直すためだ。
  problem: 長い作業では、エージェントはモデルを呼ぶたびに、それまでの推論とツールの結果を送る。古い情報を消せば次の入力は短くなる。ただし、入力の途中を変えると、それより後ろに残した情報まで安い単価で再利用できなくなる。消した情報が次の操作に必要なら、モデルは同じファイルをもう一度読むこともある。その分の呼び出しと出力まで含めなければ、費用が減ったか判断できない。
  method: method.md
  why_it_might_work: モデルへの費用を、通常の入力、安く再利用した入力、出力に分けると、履歴を変えた結果を説明できる。以前と同じ入力が後ろに残っていても、途中が変わればその部分は通常単価になる。次の呼び出しで変更後の履歴をそのまま使えば、その変更済みの部分はまた再利用の対象になる。
  evidence: evidence.md
  executable_understanding: experiment.md
  results: |-
    Lab の作例の初期設定では、過去の2記号を消すと、延べ入力は72から66に減った。再利用料金を90%割り引くと、合計費用は87.00から87.30へ増えた。割引をなくすと、132.00から126.00へ減った。これは作例の料金単位での比較で、著者の推計額や実際の請求額ではない。

    配布ファイルの `results.json` は、著者の主な集計を `reported` に、Lab が計算した144条件の結果を `synthetic` に収める。
  what_we_verified: Lab は、前回と先頭から一致する記号を数え、再利用する入力と通常の入力を分ける計算を確かめた。作例では、同じ履歴を消しても、再利用の割引を使うかどうかで、削除前後の費用の大小が入れ替わる。追加の読み取りで呼び出しと出力が増える条件も確認した。
  what_we_did_not_verify: Lab は著者の9,400回を実行していない。モデルの性能や待ち時間、キャッシュの最小長、失効や追い出し、書き込み料金、本番運用の費用は未検証だ。著者が配布した実行ログと分析コードも確認していない。別の料金や要約方法でも結果が同じになるとは言えない。
  implementation: '`README.md` のコマンドをリポジトリの直下で実行する。Python が144条件の費用を計算する。ブラウザーは選んだ条件の結果を JavaScript で表示し、外部サービスへは接続しない。'
