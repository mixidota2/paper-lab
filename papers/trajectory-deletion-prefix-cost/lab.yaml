question: 履歴を短くすると、モデルに払う費用も減るのか
summary: 著者は、古い推論やツールの出力を消して、必要な情報を読み直す回数と費用を調べた。直近2ターンを残した42評価で、再利用の割引を含めると費用が下がった評価はなかった。
verification:
