status: draft
question: 最後の追加と自己テストが通っても、なぜ機能全体は壊れたままなのか
summary: 以前の実装漏れ、後の変更による回帰、自己テストの期待値の誤りを分ける。3段階の自作プログラムを動かし、局所の合格と最終コードへの受入検査の違いを追う。
