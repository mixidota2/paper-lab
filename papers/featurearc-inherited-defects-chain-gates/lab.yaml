source_review:
  checked: '2026-10-28'
  url: https://arxiv.org/html/2610.37434v1
  scope: 'HTML版の§I〜VIII、表I〜IV、図の説明を確認しました。著者のコードや個別の実行データの配布先は確認できていません（NOT OBSERVED）。'
core_idea:
  author_claim: '著者は、最後の追加を調べる検査とは別に、機能全体を最終コードで調べる必要があると結論づけています。'
  research_bot_interpretation: 'この論文は、実装者が自分で行う検査と、機能全体が要求を満たすかを判断する検査を分ける例として読む価値があります。モデルの採用順位を決めるための比較としては勧めません。'
sections:
  overview: |-
    FeatureArcの著者は、コードを書くエージェントが一つの機能に要件を少しずつ足したとき、それまでの要件も最終コードで満たせるかを調べました。53のリポジトリから選んだ73課題を、合計263段階に分けています。10種類のエージェントは、自分が前の段階で書いたコードを引き継ぎます。著者は外部の採点結果を途中で知らせず、失敗してもコードを元に戻しませんでした。

    初めの段階で、その段階の要件を満たした割合は62.7%でした。最後に、最終コードが全段階の要件を満たした割合は28.5%です。最後の追加だけを調べる検査に通った273回のうち、69回は機能全体の検査で不合格でした。最後に頼んだ変更が動いても、前の段階で頼んだことまで動くとは限りません。
  problem: 'たとえば、表示は正しく直せても、その前に呼ぶ絞り込みが閾値と同じ値を落とすなら、利用者には求めた結果が届きません。求められた最後の変更が動くことと、それまでの要求も含めて動くことは別です。'
  method: method.md
  why_it_might_work: '仕様に書いた具体例と実際の戻り値を比べれば、実装と自己テストが同じ読み違いをしている場合にも気づけます。ただし、用意した例を全部通っても、どんな入力でも正しく動くとは限りません。'
  evidence: evidence.md
  executable_understanding: experiment.md
  results: 'results.json の reported 欄は著者が集計した数値です。synthetic 欄は、この教材が5種類の実装を修正なし・固定の修正ありで動かした記録です。教材の集計値は例の選び方で変わるので、論文の成功率とは比べません。'
  what_we_verified: '教材では、前の段階の状態を引き継ぐこと、最後の追加が合格しても全体で落ちること、途中で失敗してから全体が直る場合を検査しました。最終コードは、機能全体用の二組のテストが両方通った場合にのみ合格にします。割合の分母が0の場合も検査しています。'
  what_we_did_not_verify: '著者の10構成のうち、9構成はClaude Code、1構成はCodexで動いており、実行基盤の差がモデルの差と一緒に入ります。信頼区間は課題を引き直して計算したもので、乱数を変えてモデルを繰り返し動かした結果ではありません。前の段階に落ちたか、自分のテストが通ったかで分ける比較は観察であり、不具合を直す効果の推定ではありません。著者は実行記録をモデルの多数決で分類し、一部を著者が結果を見ずに確認しました。初めの段階と最終コードでは検査範囲が違うため、段階の合格を独立な確率として扱いません。また、最初に落ちたまま回復しなかった36.2%には回復例が入らないため、初めの合格率62.7%を100%から引いた値とは違います。社内の評価に使われていても、実際の利用者への効果が測られたわけではありません。'
  implementation: 'READMEの手順で結果と表示用HTMLを作り直せます。計算はPythonの標準ライブラリで行います。画面は保存した記録をJavaScriptで読み、外部には通信しません。著者の配布物は実行していません。'
