- id: and
  kind: equations
  title: その段階の検査と、最終コードでの検査を分ける
  after: method
  source: https://arxiv.org/html/2610.37434v1
  locator: §II-B・IV-D
  rationale: どの二組を、どの時点のコードで調べるかを示します。
  caption: 式の「∧」は、二組とも合格するという意味です。合格の確率を掛け合わせる式ではありません。
  steps:
  - name: 段階k
    formula: Gₖ = F2Pₖ(Sₖ₊₁) ∧ P2Pₖ(Sₖ₊₁)
    explanation: この段階で追加した動作と、残すべき既存動作を、両方とも変更後のコードで調べる。
  - name: 最終
    formula: Gchain = F2Pchain(Sₙ) ∧ P2Pchain(Sₙ)
    explanation: 最終コードを機能全体用の別のテストで調べる。途中で失敗しても、最後までに直していれば合格できる。
