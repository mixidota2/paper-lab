status: draft
question: '最後の追加が自分のテストに通ったとき、最終コードはそれまでの要求も満たしているか。'
summary: 'FeatureArcは、一つの機能を広げていくエージェントを評価しました。10構成をまとめると、初めの段階の合格率は62.7%、全段階の要件を最終コードで満たした割合は28.5%でした。'
verification:
