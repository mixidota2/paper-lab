core_idea:
  author_claim: 著者は、検索した人の目的と商品のつながりを三つの段階で使います。商品IDを作る段階では、商品説明に加えて、同じ検索でクリックされた商品や過去の検索語を使います。学習時には商品情報から検索文を作り、表示の少ない商品に学習例を補うためです。最後に、関連性を基準に候補を比べ、比較できる候補の中で購入などの実績も考慮します。
  research_bot_interpretation: Labでは、[VARG](varg-tmall-value-generative-retrieval.html)との違いを、生成後の候補がどこに渡るかに注目します。VARGは商品IDの第3要素に取引上の価値の順位を入れ、候補を既存の最終順位付けに渡すための枠を設ける方式です。ICEGRは検索との一致をID作成から追加学習まで保ち、一部の候補を最終結果に直接入れます。A/Bテストの対象や既存システムが異なるため、取引総額の変化だけで両者の優劣は判断できません。
sections:
  overview: |-
    Baiduの研究チームは、通販商品の検索で、探しているものに合う商品を生成モデルで見つける方法「ICEGR」を提案しました。たとえば、口紅とネックレスは別の種類の商品でも、「恋人への贈り物」という同じ検索で選ばれます。ICEGRは過去の検索と商品のつながりを商品IDに反映し、表示が少ない商品には学習用の検索文を作って補います。どちらの商品も検索に十分合い、関連性に大きな差がないときは、過去のクリック、支払いの有無、取引額を手がかりに、どちらを優先するかを学びます。

    Baiduは本番トラフィックの20%を対象に、既存の検索だけを使う群と、同じ仕組みに5億パラメータのICEGRを加える群を2週間比較しました。試験群では、ICEGRが生成した上位候補のうち一定数を最終結果に直接入れ、残りは既存の関連性検査と順位付けに回しました。論文の報告では、既存の検索だけを使う群に比べて、商品表示1回あたりのクリック率が3.52%上がり、注文数が15.96%、取引総額が7.53%増えました。この比較では経路を一式追加したため、学習方法や直接表示がどれだけ寄与したかは分かりません。
  problem: |-
    商品の説明文だけを見れば、口紅とネックレスは別の種類の商品です。それでも、贈り物を探す人にはどちらも候補になりえます。商品IDを商品説明だけから作り、学習時には商品とIDの対応だけを覚えさせると、検索文と商品のこうした関係を学びにくくなります。

    検索ログだけで学習すると、もともと表示が少ない商品の例が足りません。さらに、検索との一致を確かめずに人気や売上を優先すると、目的から外れた商品が上位に来ることがあります。クリックの記録には、そもそもどの商品が表示されたかの影響も含まれます。
  why_it_might_work: |-
    Labの解釈です。同じ検索語で選ばれた商品を結び付けると、説明文は似ていなくても同じ用途で選ばれる商品を近付けられます。元の商品表現を毎回混ぜ、過去の検索語が少ない商品ではその検索語の重みを抑える設計です。ただし、こうした調整でクリックログの人気の偏りまで除けるとは限りません。

    作った検索文を学習に使えば、表示が少ない商品にも検索文とIDの組を用意できます。その文が実際の利用者と同じ言葉遣いをするとは限りません。また、取引の実績を使う場合も、関連性が近い商品に対象を絞れば、検索に合わない商品を実績だけで優先しにくくなります。
  evidence: |-
    ### 検索ログを使った評価

    著者は約3か月のBaiduの検索ログを時刻順に分け、最後の1日を評価に回しました。ログ全体には1,280万種類の検索文と1,460万種類の商品があります。商品IDや学習例は評価日の前のデータだけで作り、評価日から抽出した2万種類の検索文で、クリックされた商品をどれだけ上位に出せるかを比べました。対照のProdGRは既存の生成検索モデルです。

    | 対照に順に加えたもの | Recall@20 | NDCG@20 |
    | --- | ---: | ---: |
    | ProdGR（対照） | 0.4247 | 0.2318 |
    | 学習用の検索文を作る（SQE-SFT） | 0.4954 | 0.2784 |
    | 検索の目的を商品IDに反映する（IA-SID） | 0.5006 | 0.2841 |
    | 関連性を考慮して選好を学習する（RCPO） | 0.5169 | 0.2935 |

    上位20件に入った正解商品の割合（Recall@20）は相対で21.7%、正解の出る順番も考慮した指標（NDCG@20）は26.6%上がりました。この順序で加えたときは、Recall@20の改善幅の76.7%がSQE-SFTを加えた段階で生じています。順番を変えても同じ割合になる、あるいは各部品が単独でこの差を生む、という結果ではありません。

    別の比較では、検索文と商品を対応付けて学習したモデルの代わりに元のモデルを使うと、Recall@20は0.4179になりました。また、RCPOの比較対象や他の条件をそろえて係数βを固定すると、NDCG@20は相対で7.36%下がりました。

    ### 本番では既存の検索に経路を追加した

    Baiduは5億パラメータのICEGRを既存の多段階検索に追加し、本番トラフィックの20%を対象に2週間のA/Bテストを行いました。この20%は試験全体が対象とした割合で、群ごとの配分は論文に記載されていません。試験群では、生成した上位候補から一定数を最終表示に直接入れ、残りを既存の関連性検査と順位付けに回しました。対照群では既存の多段階検索（MCA）だけを使いました。

    | 指標 | 対照群からの相対変化 |
    | --- | ---: |
    | 商品の表示回数 | +8.84% |
    | クリック率 | +3.52% |
    | ロングクリック率（Long-click Rate） | +5.27% |
    | 商品詳細ページの閲覧数 | +8.75% |
    | 注文数 | +15.96% |
    | 取引総額（GMV） | +7.53% |

    クリック率は、商品がクリックされた回数を商品が表示された回数で割った値です。注文数は注文の件数であり、注文に至った割合ではありません。この表は経路の追加と表示方法を合わせた結果です。直接表示する件数や、各指標の信頼区間は表5からは分かりません。ログでProdGRと比べた評価や、VARGが最終順位付けに枠を持つ本番比較とは、対照も設定も異なります。

    [一次資料：初版 §4.1–4.5、表2–5](https://arxiv.org/pdf/2608.29652v1)
  executable_understanding: |-
    実行コマンドは `uv run papers/icegr-baidu-intent-generative-retrieval/run.py` です。Labは口紅・ネックレス・修理という架空の3候補を置き、同じ検索で選ばれたと仮定した口紅とネックレスだけをつなぎます。つながった相手の数値を3回取り入れ、毎回、自分の元の数値も混ぜます。

    別の計算では、取引の得点だけで選んだ場合と、まず検索との関連性で絞った場合を比べます。論文の式9については、候補間の得点差を変えたときに係数がどう動くかを計算します。
  results: |-
    Labの架空例では、口紅とネックレスの距離が√2から約0.486に縮まりました。取引の得点だけで選ぶと贈り物と無関係な修理が残ります。関連性が0.8以上の候補に限ると、ネックレスが選ばれます。この足切りは考え方を説明するための簡略化で、論文の方法で比較用の組を作ったわけではありません。

    式9で候補間の得点差を−1、0、+1とすると、もとの係数βに掛ける倍率はそれぞれ1.8、1、0.2です。この値は式から計算したもので、BaiduのA/Bテストの結果ではありません。
  what_we_verified: '**仕組みの確認：一部のみ（PARTIAL）。** Labでは、つながった商品の数値を取り入れながら元の表現を残す式3を、小さな例で実行しました。元の表現の重みを1にすると表現が変わらないことも確認済みです。式9では倍率が0.2〜1.8の範囲に入り、試した得点差の範囲で、差が大きくなるほど倍率が上がらないことを確かめました（CONFIRMED）。'
  what_we_did_not_verify: Labは8Bの商品表現モデル、0.5Bの検索モデル、0.6Bの関連性モデルを学習していません。作った検索文の質、商品IDを割り当てる量子化、選好学習が収束するか、BaiduのA/Bテストも独立に検証していません。原論文からモデルの規模は確認できますが、出発点になった学習済みモデルの固有名は確認できません。性能・規模を広げた場合の挙動・本番への適用はいずれも未検証（NOT
    TESTED）です。
  implementation: '`propagate()` はつながりの重みを、つながった双方の商品の重みの合計で調整してから、式3を計算します。`beta_factor()` は式9で元のβに掛ける倍率を返します。関連性の閾値0.8はLabがこの架空例に設定した値です。論文の量子化、比較に使う候補の組の抽出、教師あり学習は実装していません。'
  method: method.md
  mapping: mapping.md
teaching_figures:
- kind: equations
  id: intent-equations
  title: 商品IDに検索の目的を残し、追加学習で選好を調整する
  after: method
  locator: Eqs. 2–5, 9–11
  rationale: 商品表現を作る式と、候補の優先度を学ぶ式を分ける。
  caption: 論文初版の式を読みやすい順に並べた図。Labで求めた性能値ではない。
  source: https://arxiv.org/pdf/2608.29652v1
  steps:
  - name: 同じ検索でクリックされた商品をつなぐ
    formula: wᵢⱼ = Σq √(nᵢq nⱼq)
    explanation: 検索文ごとに二商品のクリック数の幾何平均を求め、足し合わせる。商品説明の類似度だけでつなぐわけではない。
  - name: 元の商品表現を残す
    formula: Hᵗ = (1−αg) ÂHᵗ⁻¹ + αgX
    explanation: αgは0.2。更新を3回行い、毎回、つながった商品の表現と元の商品表現を混ぜる。
  - name: 候補の得点差に応じて係数を決める
    formula: βeff = β · clip(1 + log((2−Δr)/(2+Δr)), 0.2, 1.8)
    explanation: Δrは優先する候補ともう一方の合成得点の差。得点差が取得できなければ倍率は1とする。
  - name: 候補どうしの比較と正解の学習を合わせる
    formula: L = −E[log σ(βeff Δθ) + ηsft log πθ(s⁺|q)/|s⁺|]
    explanation: Δθは、学習中のモデルと固定した比較用モデルの対数確率の差を、優先する候補ともう一方で比べた値。後半の項は優先するSIDの学習。
