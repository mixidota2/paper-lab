  rationale: 意図を表現へ入れる場所と、選好を制御する場所
  caption: 一次資料を学習用に再構成。著者報告とLabの計算を区別する。
  source: https://arxiv.org/pdf/2608.29652v1
  steps:
  - name: query共通edge
    formula: wᵢⱼ = Σq √(nᵢq nⱼq)
    explanation: 同queryからのco-clickを使う。content類似度だけではない。
  - name: 元表現へのanchor
    formula: Hᵗ = (1−αg) ÂHᵗ⁻¹ + αgX
    explanation: αg=0.2、3 step。graphだけへ流れ切らない。
  - name: margin係数
    formula: βeff = β · clip(1 + log((2−Δr)/(2+Δr)), 0.2, 1.8)
    explanation: Δrは正例・負例のcomposite score差。欠損時は倍率1。
  - name: 選好loss
    formula: L = −E[log σ(βeff Δθ) + ηsft log πθ(s⁺|q)/|s⁺|]
    explanation: Δθはpolicy/referenceの正負log比差。
