teaching_figures:
- id: request-paths
  kind: architecture
  title: 事前準備と現在の要求を分ける
  after: method
  source: https://arxiv.org/html/2611.04259v1
  locator: Figure 2、§4、§5.7
  rationale: 準備済みデータの空の先頭部分と固定済みの先頭部分、未準備の場合に使う別モデルを区別します。
  caption: 深さが正で、準備済みデータを見つけられなかった場合だけ、非同期での準備を依頼します。現在の検索は7Bモデルの計画を待ちません。
  rows:
  - label: 非同期
    nodes:
    - title: queryのみ → 7B CellPlan
      text: ReuseCutで固定する深さを選び、生成した先頭部分と得点を保存
  - label: prepared
    nodes:
    - title: d=0の空root または d>0のprefix
      text: 検索時の履歴 → PathKD済みのLeafFill → 第4層のすべての枝を採点
    - title: BudgetCut → 併合順位
      text: 採点した後に残す枝を選択。第4層の推論は省略しない
  - label: cold
    nodes:
    - title: 別の0.5B E2E → 応答
      text: 検索時の履歴で全層を生成。深さが正で準備済みデータがない場合は、別途準備を依頼
- id: units-and-mixture
  kind: equations
  title: 枝数と混合の重みを分ける
  after: evidence
  source: https://arxiv.org/html/2611.04259v1
  locator: Eq.3、Eq.21、Table5、Appendix D
  rationale: 固定する深さ、検索語の種類数、ログの行数、正解の回収率で使う分母を区別します。
  caption: 遅延の推計は平均に限ります。品質も、準備済みと未準備の値をPで重み付けして推計する仮定を示します。
  steps:
  - name: オンライン計算
    formula: T(d) = t₀ + Σ[t=d+1..4] Tₜ(Mₜ; θ) + tᵣ
    explanation: Mₜは採点する枝の数です。所要時間は深さだけでは決まりません。
  - name: 混合平均の投影
    formula: M̂(P) = P M₁ + (1−P) M₀
    explanation: Pは準備済みのログ行が占める割合です。検索語の種類を数えた割合Qとは異なります。
  - name: 検索語を同じ重みで数える指標
    formula: HR = mean(正解を1つ以上取得); Recall = mean(取得した正解数 / 全正解数)
    explanation: SIDを単位に評価します。正解が複数ある場合、正解が1つ入ったかと、正解を何割拾えたかは別の問いです。
