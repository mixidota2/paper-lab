teaching_figures:
- id: request-paths
  kind: architecture
  title: 検索の前に準備する処理と、検索を受けた後の処理
  after: method
  source: https://arxiv.org/html/2611.04259v1
  locator: Figure 2、§4、§5.7
  rationale: 準備済みで根から補う場合と、準備がなく別モデルで全層を作る場合を区別します。
  caption: 予測した深さが正で未準備の検索語だけを、後で準備するキューへ入れます。今回の検索は待ちません。
  rows:
  - label: 検索前の準備
    nodes:
    - title: 検索語だけを7Bへ渡す
      text: ReuseCutが深さを決め、CellPlanがその深さまでの先頭番号と点を保存します。
  - label: 準備済みの検索
    nodes:
    - title: 固定した先頭か、深さ0の根から補う
      text: 現在の履歴から小さなモデルが残りの番号を作る。第4層の葉をすべて採点します。
    - title: 採点後に枝を選ぶ
      text: BudgetCutは最終順位へ入る枝を選びます。第4層の採点は省きません。
  - label: 準備がない検索
    nodes:
    - title: 別の0.5Bモデルがその場で答える
      text: 現在の履歴を使って全層を作ります。予測した深さが正なら、次回用の準備も依頼します。
- id: units-and-mixture
  kind: equations
  title: 処理時間と検索品質で分母を区別する
  after: evidence
  source: https://arxiv.org/html/2611.04259v1
  locator: Eq.3、Eq.21、Table5、Appendix D
  rationale: 先頭を固定する深さ、採点する枝の数、準備済みの割合は別々の値です。
  caption: 準備済みと未準備の混合は平均の推計です。検索品質も、同じ重みで端点を混ぜるという仮定を置きます。
  steps:
  - name: 検索時の処理時間
    formula: T(d) = t₀ + Σ[t=d+1..4] Tₜ(Mₜ; θ) + tᵣ
    explanation: Mₜは層tで採点する枝の数です。深さが同じでも、採点する枝の数で時間は変わります。
  - name: 混合した平均の見積もり
    formula: M̂(P) = P M₁ + (1−P) M₀
    explanation: Pは準備済みの検索が占めるログ行の割合です。検索語の種類を数えるQとは異なります。
  - name: 検索語ごとのHRとRecall
    formula: HR = mean(正解を1つ以上取得); Recall = mean(取得した正解数 / 全正解数)
    explanation: 正解のSIDが一つでもあるかを数える指標と、正解のSIDを何割拾ったかを数える指標を分けます。
