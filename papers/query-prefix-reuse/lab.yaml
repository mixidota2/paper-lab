core_idea:
  author_claim: ReuseGRは7Bモデルで商品コードの先頭部分を用意し、同じ検索語なら計算を使い回します。0.5Bモデルは検索時に利用者の履歴を読み、先頭より後ろを作ります。
  research_bot_interpretation: 事前計算で応答時の仕事を減らせますが、あとから使う履歴に合う商品が、先に決めた経路の下に残っている必要があります。候補の集合と応答時間は別々に確かめます。
sections:
  overview: |-
    著者は、検索語が同じなら使い回せる計算と、利用者の履歴に応じてやり直す計算を分けるReuseGRを提案しました。7Bモデルは検索語だけから商品コード（SID）の先頭を用意します。検索が来ると、0.5Bモデルがそのときの履歴から残りを補います。先頭を用意していない検索語では、別の0.5Bモデルがその場で全部の番号を作るため、大きなモデルの準備を待ちません。

    著者が先頭などを準備した44,225件の検索語で比べると、すべてをその場で0.5Bモデルが作る方式に対し、上位100件に正解のSIDが一つでも入る割合が81.99%から85.82%になりました。平均応答時間は117.00 msから71.45 msに短くなりました。これは全件で事前準備が使える条件で、実際の検索全体の応答時間を測った値ではありません。

    検索広告の14日間のA/Bテストでは、1,000要求当たりの売上が1.05%、クリック率が0.93%増えました。1要求当たりの注文数は0.78%高かったものの、確かな増加と判断できる結果ではありませんでした。
  problem: ある利用者が欲しい商品が、検索語だけで先に決めた経路の外にあると、その後に履歴を読んでも候補に戻りません。逆に先頭を一つも決めなければ、検索ごとに同じ計算を繰り返します。事前に固定する深さに加え、検索時に何本の枝を採点するかも処理時間に影響します。
  method: method.md
  why_it_might_work: 同じ検索語では、検索語だけから求めた経路を何度も作る必要はありません。著者は先に固定した経路の下で、現在の履歴に合う商品コードを小さなモデルに探させます。選んだ範囲の外に正解がある場合、この工夫だけでは候補に入れられません。
  evidence: |-
    ### すべての検索語で準備済みの条件

    著者は検索広告ログから44,225種類の検索語を評価しました。検索語ごとの基準の履歴を使い、各検索語を等しく重み付けした結果を3シードで平均しました。処理時間はA100 1枚で一度に1要求を処理して測りました。表1のReuseGRはすべての検索語で事前準備が使えます。

    | 方式 | SIDのHR@100 | SIDのRecall@100 | 平均応答時間 |
    |---|---:|---:|---:|
    | 検索時に0.5Bで全層を生成 | 81.99% | 45.53% | 117.00ms |
    | 検索時に7Bで全層を生成 | 85.71% | 50.96% | 168.88ms |
    | 準備済みのReuseGR | 85.82% | 46.05% | 71.45ms |

    HRは上位100件に正解のSIDが一つでも入った検索語の割合です。Recallは、検索語ごとに正解のSIDを何割回収したかを求めて平均します。ReuseGRのHRは7B方式と近い一方、Recallは50.96%から46.05%に下がっています。どちらも商品へ展開する前の指標です。

    ### 履歴の違いだけを見た別の評価

    表4では286,046件のログ行を同じ重みで平均しました。キャッシュと重みを固定し、実際の履歴を使うとHR@100は88.95%。基準の履歴は88.34%、履歴を空にすると87.88%、入れ替えた履歴は87.52%でした。表1は検索語ごとの平均なので、表4の値を表1の続きとして引き算しません。

    ### 準備済みと未準備が混ざる条件

    表5のQは準備済みの検索語を種類で数えた割合、Pは準備済みの検索が占めるログ行の割合です。Static QではQが20.97%、Pが36.87%です。準備の有無で検索語を分けて測ったHR@100は82.38%。同じQとPを使い、準備済みと未準備の全体値をPで補間すると83.40%と推計されます。表5の100.21msも、準備済みと未準備の平均を混ぜた推計です。実際に混ざった要求の応答時間を測ったわけではありません。

    ### 本番の検索広告を14日間比べた結果

    著者は利用者単位のA/Bテストを行い、各群にトラフィックの10%ずつを割り当てました。利用者は各群で約1,280万人です。候補を集める他の経路、候補枠、後段の順位付け、入札は変えていません。1,000要求当たりの売上（RPM）は1.05%増え、95%信頼区間は+0.58〜+1.52%でした。クリック率は0.93%増え、区間は+0.62〜+1.24%でした。

    1要求当たりの注文数の差は+0.78%でしたが、p値は0.2104で、増加を確認できたとは言えません。クリック当たりの注文率は−0.21%でした。候補生成経路のタグは重複するため、その比率は経路だけの因果効果ではありません。準備済みの割合だけから本番の効果は予測できません。

    一次資料：[著者論文第1版 §5、表1・4・5、付録D・E](https://arxiv.org/html/2611.04259v1#S5)。[論文の書誌情報](https://arxiv.org/abs/2611.04259)。
  executable_understanding: experiment.md
  results: |-
    著者が付録Dで示した準備済み経路の内訳は、準備済みデータを読む処理0.18ms、入力を読み第3層まで展開する処理67.01ms、第4層の採点3.84ms、枝を選んで順位に並べる処理0.42msです。合計は71.45msでした。

    検索語1種類の準備に88msかかり、100万種類のうち10%を毎日作り直すと、A100の計算時間は1日約2.44時間です。1回の利用で117.00−71.45＝45.55msを節約できると置くと、2回の利用で88msを超えます。この計算は一度に1要求を処理する条件での時間の比較で、機器の費用、処理待ち、準備済みデータが古くなる影響は含みません。また、準備済みと未準備のP95は86.40msと132.50msですが、この2値から混合時のP95は出せません。
  what_we_verified: Labは人工の木で、どの経路を使うか、固定した先頭部分の下に目標が残るか、葉の採点と枝の選択の順序を確認しました。保存したJSONから同じ条件を読み出し、公表値の算術も確かめました。確認したのはこの範囲で、論文の仕組み全体ではありません。
  what_we_did_not_verify: Labは著者のモデルの学習、推論、商用ログ、実店舗、本番での応答時間、P99を再現していません。モデル成果物と商用ログは確認できませんでした。論文の準備済み経路では7Bの最上位の粗いコードで履歴を絞りますが、比較方式と未準備経路はログ上の検索語との一致で絞ります。ほかの処理も変わったので、先頭の再利用だけの効果には分けられません。最近のLLMを使う二塔型モデルとの比較もなく、検索語がないフィードへの適用は未検証です。
  implementation: '`uv run run.py` を記事のフォルダで実行すると `results.json` を作ります。`model.js` はPythonと同じ範囲の値を一つずつ受け取ります。`interactive.js` が画面に渡す情報や保存ファイルの内容は、ブラウザの画面要素を模した環境で確認します。この確認だけでは、本物のブラウザでの表示や端末への書き込みは判断できません。'
