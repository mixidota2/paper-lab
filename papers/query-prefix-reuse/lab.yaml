question: 同じ検索語で使い回せる計算はどこまでか
summary: ReuseGRは商品コードの先頭を検索語ごとに用意し、利用者の履歴を使う計算は検索時に行う。全件で事前準備を使った比較では、SIDのヒット率が81.99%から85.82%になり、平均応答時間は117.00msから71.45msに短くなった。
