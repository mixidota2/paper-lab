source_review:
  checked: '2026-11-09'
  url: https://arxiv.org/html/2611.08252v1
  scope: HTML版の本文§1–7、表1–11、付録A、図1–5のキャプションと、公式実装の設定を読みました。PDFの全画素と公式実装全体は確認しておらず、公式コードも実行していません。
core_idea:
  author_claim: 著者は、学習とモデル選択に使わなかった系列も最終評価に含め、系列で分ける検証が役立つかを調べました。最終誤差の見積もり、良いモデルを選べた割合、選んだモデルの予測誤差は別々に測ります。
  research_bot_interpretation: 検証方法を選ぶ前に、運用で新しい系列を予測するかと、予測時点でどの履歴を使えるかを決めます。論文の結果は、どの場面でも系列分割の方がよいという意味ではありません。
sections:
  overview: |-
    著者は、複数の時系列で学んだ予測モデルを未学習の系列にも使う場合、モデルをどう選ぶとよいかを調べました。11のデータセットと10種類のニューラルネットワークを使い、同じ系列を時間で分ける検証と、時間だけでなく系列も分ける検証を比べました。未学習の系列をテストに含めた実験では、系列も分けて検証した方が、選んだモデルの予測精度は高くなりました。一方、テスト時にどのくらい誤るかを見積もる精度では、時間だけで分ける方法がわずかに上回りました。

    [一次資料の書誌情報](https://arxiv.org/abs/2611.08252)。
  problem: 最終評価の誤差を正確に見積もれる検証方法が、いつも最良のモデルを選べるとは限りません。また、系列を別々にしても、前処理で評価対象の情報を使ったり、予測時点で知らなかった値を渡したりすれば、情報漏れは残ります。
  method: method.md
  why_it_might_work: |-
    学習に使わなかった系列でモデルを選ぶと、新しく加わる系列を予測する場面に近い条件になります。ただし論文と合成例で「未学習」というのは、学習と選択に入れなかったという意味です。予測を出す時点で過去の観測値を入力します。履歴のない系列は評価していません。
  evidence: evidence.md
  executable_understanding: experiment.md
  results: |-
    合成例は10系列それぞれで起点を5つ使い、各起点から先の4点を予測します。保存する予測は起点と系列の組で50件、誤差は合計200件です。同じ時点を別の起点から予測するため、1系列あたり8時点を等しく数える平均とは異なります。

    論文の表3に載った丸め済みの値では、HoldoutのMASEがTime-CVより小さいのは11データセット中7件です。差の合計0.271のうちWeatherが0.195を占めます。この内訳だけでは、統計的に有意な差やWeatherを除くべき理由は分かりません。
  what_we_verified: |-
    合成例で、学習できる時点の上限、最終評価を選択に使わないこと、誤差の集め方、共通尺度Qを確かめました。保存JSONの数値も検算しました。原論文の方式が一般に優れることは確認していません。
  what_we_did_not_verify: |-
    著者のモデルや公式コードは実行していません。PDFの全画素、実店舗、在庫費用、追加学習なしの時系列基盤モデルは検証対象外です。生成HTMLのDOMを検査しても、実ブラウザーの各画面幅で表示を確認したことにはなりません。
  implementation: |-
    実行コードと補助ファイル（table3.json）を同じフォルダーへ保存してください。Python 3.10以上で `python3 run.py --out series-cv-results.json` を実行します。合成予測と論文の表からの集計を分けて保存します。`model.js` は合成例をブラウザーで計算し、`table3.json` は原論文の掲載値を持ちます。公式コードやAPIには接続しません。
