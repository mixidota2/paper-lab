teaching_figures:
- id: selection-boundaries
  kind: logic
  title: 選択の段階ごとに利用できる情報を区切る
  after: method
  source: https://arxiv.org/html/2611.08252v1
  locator: §3–4を説明する独自の10系列例
  rationale: 原著の実験設定と混同せず、ラベル上限と予測時contextを別々に確認する。
  caption: H〜Jは選択・fitから除外しますが、予測時の過去8点は入力できます。
  rows:
  - label: 自作例の選択と最終評価
    nodes:
    - title: 内側の選択
      text: A〜Eのラベル≤84でfit、t85〜88でscale選択
    - title: 外側の選択
      text: A〜Eのラベル≤88でrefit、F〜Gのt89〜92でモデル選択
    - title: 最終fit
      text: A〜Gのラベル≤92。testを選択へ戻さない
    - title: 固定重みの予測
      text: 全系列でorigin92〜96、各4点。過去contextだけを更新
- id: labels-and-weights
  kind: equations
  title: ラベルの終点と、誤差平均の分母を確認する
  after: evidence
  source: https://arxiv.org/html/2611.08252v1
  locator: §4の評価尺度とAppendix Aを踏まえた独自例
  rationale: originとラベル上限、系列共通Q、重複窓の重みを区別する。
  caption: p=8、h=4は教材の設定で、原著の全データセット共通設定ではありません。
  steps:
  - name: 学習ラベルを上限までに収める
    formula: origin + h ≤ cutoff → origin ≤ cutoff − 4
    explanation: 内側84、外側88、最終92に対し、最後の学習originは80、84、88。
  - name: 共通尺度で割る
    formula: MASE = mean(|actual − prediction|) / Q
    explanation: Qは全in-setの季節ナイーブ誤差の平均。教材の季節長は4。Q=0では未定義とし、欠損値は拒否。
  - name: 重なる窓を平均する
    formula: 5 × 4 = 20 errors per series; weights = (1,2,3,4,4,3,2,1)
    explanation: 8時点を等重みにする評価とは分母と重みが違う。どちらも自作例として併記。
