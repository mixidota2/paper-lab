status: draft
question: 学習に使わなかった系列も予測するとき、どの系列と時点でモデルを選ぶか
summary: 著者は、同じ系列を時間で分ける検証と、時間に加えて系列を分ける検証を比べました。学習に使わなかった系列も評価すると、系列を分ける方法で選んだモデルの予測誤差は小さくなりました。ただし、最終誤差の見積もりには、時間だけで分ける方法の方が近い値を出しました。
