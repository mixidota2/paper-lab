verdict: Worth Reading
status: draft
question: 学習していない系列にも予測するなら、どの系列と時点でモデルを選ぶか
summary: データを系列と時点で分け、モデル選択に使う正解値、予測時に入力する過去の観測値、最後の評価に使う正解値を区別します。論文の表3では、データセットごとの結果が平均にどう影響するかを確かめます。
verification:
