teaching_figures:
- id: selection-boundaries
  kind: logic
  title: 学習から最終評価までに使う値
  after: method
  source: https://arxiv.org/html/2611.08252v1
  locator: §3–4を説明する独自の10系列例
  rationale: 学習に使える正解値と、予測時に入力できる観測値は別です。
  caption: H〜Jは選択にも学習にも使いません。予測する時点では、直近8点を入力します。
  rows:
  - label: 合成例での学習、選択、評価
    nodes:
    - title: 内側で傾きの係数を選ぶ
      text: 系列A〜Eの時点84までの正解値で学習し、時点85〜88の誤差で傾きに掛ける係数を選ぶ
    - title: 外側でモデルを選ぶ
      text: 系列A〜Eの時点88までの正解値で学習し直し、系列F〜Gの時点89〜92の誤差でモデルを選ぶ
    - title: 選んだモデルを学習し直す
      text: 系列A〜Gの時点92までの正解値で学習する。最終評価の結果はモデル選択に使わない
    - title: 学習した重みのまま予測する
      text: 全系列で時点92〜96を起点に、それぞれ先の4点を予測する。更新するのは入力となる過去の観測値だけ
- id: labels-and-weights
  kind: equations
  title: 学習できる起点と誤差の集め方
  after: evidence
  source: https://arxiv.org/html/2611.08252v1
  locator: §4の評価尺度とAppendix Aを踏まえた独自例
  rationale: 起点の上限、共通の誤差尺度Q、同じ時点を再度数える場合を分けます。
  caption: 過去8点から先の4点を予測するのは、Labで決めた条件です。
  steps:
  - name: 学習ラベルを上限までに収める
    formula: origin + h ≤ cutoff → origin ≤ cutoff − 4
    explanation: 正解値を内側で84、外側で88、最終学習で92まで使うと、最後の予測起点は順に80、84、88です。
  - name: 共通尺度で割る
    formula: MASE = mean(|actual − prediction|) / Q
    explanation: Qは学習対象をまとめて求めた季節ナイーブ予測の平均絶対誤差です。Labは季節の長さを4とし、Q=0ではMASEを定義しません。
  - name: 重なる窓を平均する
    formula: 5 × 4 = 20 errors per series; weights = (1,2,3,4,4,3,2,1)
    explanation: 1系列につき20件の誤差を直接平均する値と、8時点を等しく数える値を両方示します。
