source_review:
  checked: '2026-11-09'
  url: https://arxiv.org/html/2611.08252v1
  scope: HTML版の本文§1–7、表1–11、付録A、図1–5のキャプションと、公式実装の設定を読みました。PDFの全画素と公式実装全体は確認しておらず、公式コードも実行していません。
core_idea:
  author_claim: 未学習系列も運用対象に含む場合、系列で分けた検証がモデル選択と誤差推定に役立つかを比較しています。
  research_bot_interpretation: 分割方式の優劣を一律に決めず、運用対象の系列と、選択時点で利用できる情報を先に定める教材として読みます。
sections:
  overview: 同じ系列の過去で学習し未来を評価すること自体はリークではありません。未学習系列を含む運用かどうかで評価対象が変わります。この教材は独自の合成例であり、10ニューラル構造の学習を再現しません。[一次資料の書誌情報](https://arxiv.org/abs/2611.08252)。
  problem: 検証誤差の推定が良いことと、最終的に良いモデルを選べることは同じではありません。系列を分けても前処理や未来情報の漏洩が自動的になくなるわけではありません。
  method: method.md
  why_it_might_work: 【解釈】学習に含めない系列で選択すれば、未知の系列へ移す場面に近い評価になります。ただし、学習に使わない系列でも、予測時に過去の観測値を入力します。過去の観測値が一つもない系列の予測は評価していません。
  evidence: evidence.md
  executable_understanding: experiment.md
  results: 自作例では、10系列それぞれで予測の起点を5つ設け、各起点から先の4時点を予測して、計200件の誤差を集計します。同じ時点を複数の起点から予測するため、8時点を同じ重みで集計した誤差とは異なります。論文の表3に掲載された丸め値を比べると、Holdoutは11データセットのうち7つでTime-CVよりMASEが小さく、改善幅の合計0.271のうちWeatherが0.195を占めます。この内訳だけでは、統計的に有意な差があるとも、Weatherを除くべきだとも言えません。
  what_we_verified: CONFIRMEDは、自作例での分割の境界、モデル選択と最終評価の分離、共通の尺度Q、誤差の集計、保存したJSONの検算に限ります。原著の手法が一般に優れると確認したわけではありません。
  what_we_did_not_verify: 原モデルの学習・推論、全公式実装、PDF全画素、実店舗、在庫費用、TSFM zero-shot、実ブラウザー表示はNOT TESTED。著者実験の再現物はNOT OBSERVEDです。
  implementation: run.pyをuv経由で実行しresults.jsonを再生成します。model.jsは同じ自作計算をブラウザー用に実装。table3.jsonは原著の公開表示値です。公式コードやAPIは実行しません。
