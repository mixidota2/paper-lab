core_idea:
  author_claim: 未学習系列も運用対象に含む場合、系列で分けた検証がモデル選択と誤差推定に役立つかを比較しています。
  research_bot_interpretation: 分割方式の優劣を一律に決めず、運用対象の系列と、選択時点で利用できる情報を先に定める教材として読みます。
sections:
  overview: 同じ系列の過去で学習し未来を評価すること自体はリークではありません。未学習系列を含む運用かどうかで評価対象が変わります。この教材は独自の合成例であり、10ニューラル構造の学習を再現しません。[一次資料の書誌情報](https://arxiv.org/abs/2611.08252)。
  problem: 検証誤差の推定が良いことと、最終的に良いモデルを選べることは同じではありません。系列を分けても前処理や未来情報の漏洩が自動的になくなるわけではありません。
  method: method.md
  why_it_might_work: 【解釈】学習に含めない系列で選択すれば、未知の系列へ移す場面に近い評価になります。ただし、新しい系列にも予測時の過去contextを与えます。履歴ゼロのcold startを評価しているわけではありません。
  evidence: evidence.md
  executable_understanding: experiment.md
  results: 自作例は10系列、5 origin、各4 stepの200誤差です。同じ対象時点の重複があるため、8時点等重みの誤差とは異なります。公表Table3のHoldoutは7/11勝、改善合計0.271のうちWeatherが0.195です。これは有意差や除外の妥当性を証明しません。
  what_we_verified: CONFIRMEDは自作の境界、選択とtestの分離、共通Q、集計、保存JSONの検算範囲です。原著の一般的な優位性を確認した意味ではありません。
  what_we_did_not_verify: 原モデルの学習・推論、全公式実装、PDF全画素、実店舗、在庫費用、TSFM zero-shot、実ブラウザー表示はNOT TESTED。著者実験の再現物はNOT OBSERVEDです。
  implementation: run.pyをuv経由で実行しresults.jsonを再生成します。model.jsは同じ自作計算をブラウザー用に実装。table3.jsonは原著の公開表示値です。公式コードやAPIは実行しません。
