teaching_figures:
- id: selection-boundaries
  kind: logic
  title: 選択の段階ごとに利用できる情報を区切る
  after: method
  source: https://arxiv.org/html/2611.08252v1
  locator: §3–4を説明する独自の10系列例
  rationale: 原著の実験設定と混同せず、ラベル上限と予測時contextを別々に確認する。
  caption: 系列H〜Jはモデル選択にも学習にも使いません。ただし、各系列を予測するときは直近の8点を入力できます。
  rows:
  - label: 自作例の選択と最終評価
    nodes:
    - title: 内側の選択
      text: 系列A〜Eの時点84までの正解値で学習し、時点85〜88の誤差で傾きに掛ける係数を選ぶ
    - title: 外側の選択
      text: 系列A〜Eの時点88までの正解値で学習し直し、系列F〜Gの時点89〜92の誤差でモデルを選ぶ
    - title: 最終fit
      text: 系列A〜Gの時点92までの正解値で学習する。最終評価の結果はモデル選択に使わない
    - title: 固定重みの予測
      text: 全系列で時点92〜96を起点に、それぞれ先の4点を予測する。更新するのは入力となる過去の観測値だけ
- id: labels-and-weights
  kind: equations
  title: ラベルの終点と、誤差平均の分母を確認する
  after: evidence
  source: https://arxiv.org/html/2611.08252v1
  locator: §4の評価尺度とAppendix Aを踏まえた独自例
  rationale: originとラベル上限、系列共通Q、重複窓の重みを区別する。
  caption: p=8、h=4は教材の設定で、原著の全データセット共通設定ではありません。
  steps:
  - name: 学習ラベルを上限までに収める
    formula: origin + h ≤ cutoff → origin ≤ cutoff − 4
    explanation: 学習に使う正解値の上限が内側で84、外側で88、最終学習で92なら、学習に使える最後の予測起点は順に80、84、88となる。
  - name: 共通尺度で割る
    formula: MASE = mean(|actual − prediction|) / Q
    explanation: Qは学習対象の全系列で求めた季節ナイーブ予測の平均誤差。教材では季節の長さを4とする。Q=0の場合は尺度を定義せず、欠損値は受け付けない。
  - name: 重なる窓を平均する
    formula: 5 × 4 = 20 errors per series; weights = (1,2,3,4,4,3,2,1)
    explanation: 8時点を等重みにする評価とは分母と重みが違う。どちらも自作例として併記。
