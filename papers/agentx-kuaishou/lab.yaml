question: 推薦の改善案を増やしたとき、何件が本番導入の候補まで進むか
summary: Kuaishouは人が改善案を審査し、エージェントが実装・実験を進めるAgentXを試しました。3ワーカーが3週間で出した374案のうち10件が本番導入の候補になりました。1ワーカー・1週あたりの同時実験数は人手の8倍でしたが、1案あたりの展開率は人手のほうが高い結果でした。
