question: |-
  通知する動画を、動画の内容や、利用者が好む投稿者からどう探すか
summary: |-
  KuaishouのHGenPushは、動画の内容から探す経路と、利用者が好む投稿者の動画を探す経路を使います。両経路の候補は、予備の順位付けを通さず既存の最終モデルへ渡します。著者の本番A/Bテストでは、全構成を従来方式と比べたとき、1日あたりのアクティブ利用者数が0.181%増えました（p=0.04）。通知のクリック率の差は+1.577%でしたが、5%水準で有意ではありませんでした（p=0.11）。
