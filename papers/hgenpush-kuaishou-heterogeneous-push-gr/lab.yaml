core_idea:
  author_claim: |-
    著者は、フィードの長期・短期の行動と、通知を送った記録・開いた記録を、同じデコーダーで読みます。その結果を動画経路と投稿者経路へ渡します。前のコードを参照して次のコードを作るChained-MTPと、クリック後の再生や共有などを学習に取り込むUCPAを組み合わせます。
  research_bot_interpretation: |-
    [PushDualGen](pushdualgen-kuaishou.html)は動画のコードと通知文を結びます。HGenPushが結ぶのは、動画を直接探す経路と利用者が好む投稿者から動画へ戻す経路です。[VARG](varg-tmall-value-generative-retrieval.html)と同様、予備の順位付けを省いても、最後にどの候補を選ぶかは順位付けモデルが決めます。
sections:
  overview: |-
    KuaishouのHGenPushは通知で届ける動画の候補を二つの経路で探します。動画から探す経路は、動画の特徴を3段階で表したコード（SID）を生成します。投稿者から探す経路が生成するのは、利用者が好みそうな投稿者を表す2段階のコードと、動画の特徴を表す最初のコードの組み合わせです。この経路の目的も、投稿者を通知することではなく、その投稿者の動画を探すことです。

    両方の経路から得た候補は、予備の順位付けを経ずに、最終的な順位を決めるモデルへ渡ります。著者が従来の通知システムと比較したA/Bテストでは、両経路を使う構成で1日あたりのアクティブ利用者数が0.181%増えました。同じ構成では、通知のクリック率とアプリ利用時間の差は5%水準で統計的に有意ではありませんでした。
  problem: |-
    似た動画を投稿していても、利用者は特定の投稿者に繰り返し反応することがあります。動画の内容だけで候補を探すと、その投稿者を好む利用者に届かない場合があります。一方、好みの投稿者を見つけるだけでは、その人のどの動画を通知するかは決まりません。

    候補を表す複数のコードを作るときにも、両方の条件を満たす必要があります。各段のコードを独立に選ぶと、前の段で絞った内容と後の段が合わないことがあります。反対に、コードを一つ出すたびに大きなモデルを回し直すと、候補を探す処理に時間がかかります。
  why_it_might_work: |-
    クリックを手がかりに、投稿者の表現を、その投稿者の動画に反応する利用者の関心に近づけます。動画内容だけでは捉えにくい、特定の投稿者を選ぶ傾向を表せるようにするためです。

    Chained-MTPは、先に計算した利用者の関心に、前の段までに出したコードの埋め込みを足してから、次のコードを選びます。毎回Transformerを回し直さなくても、次のコードを、すでに選んだコードに応じて変えられます。論文が「自己回帰を避ける」と述べているのは、大きなデコーダーを毎段で繰り返す処理についてです。推論時に前のコードと無関係に全段を予測するわけではありません。
  evidence: |-
    ### 本番比較で確認したのは、全構成の1日あたりの利用者数の差

    [一次資料PDFの§4・表1、3〜6](https://arxiv.org/pdf/2607.03362v1)に、Kuaishouの著者が報告した結果があります。

    表6は、各構成をKuaishouの従来の多段階の通知システムと比べた結果です。動画経路、クリック後の行動を使う学習方法（UCPA）、投稿者経路の順に構成を加えると、従来方式に対する1日あたりのアクティブ利用者数（DAU）の点推定は+0.126%、+0.153%、+0.181%でした。最後の+0.181%（p=0.04）は全構成のDAUの相対差で、通知をクリックした人数の増加ではありません。v3とv2の差の0.028ポイントも、投稿者経路だけの効果として独立に検定された値ではありません。

    著者が定義した通知のクリック率（CTR）は、その日に受け取った通知全体で測る指標です。全構成の点推定は+1.577%でしたが、p=0.11なので5%水準では上昇を確認できません。1日あたりのアプリ総利用時間も+0.148%（p=0.75）で有意ではありません。ただし、差がないと証明したわけでもありません。実験期間、各群への配信割合、信頼区間は本文から確認できません。

    ### 動画のコードを当てる精度と、候補を作る速さは別の指標

    過去のログでは、正解の識別子が生成した上位100件に入った割合（HitRate@100）を測りました。コードの後ろにある動画を展開した後の再現率でも、最終的に通知した動画の精度でもありません。表3のHitRate@100は動画経路の指標で、処理件数（QPS）は両経路を含むモデルが装置1台で1秒に処理できた最大件数です。

    | コードを作る方法 | 動画のHitRate@100 | 装置1台の最大QPS |
    | --- | ---: | ---: |
    | 各段を独立に予測（Parallel-MTP） | 0.1150 | 2.40千件/秒 |
    | Transformerで前の段に条件付け（DeepSeek-MTP） | 0.3954 | 1.27千件/秒 |
    | 前のコードの埋め込みを足す（Chained-MTP） | 0.3915 | 1.70千件/秒 |

    著者の比較では、Chained-MTPはDeepSeek-MTPよりHitRate@100がわずかに低い一方、最大QPSは約33.86%高くなりました。実際の通知を送り終えるまでの時間を測った比較ではありません。

    表4では、クリックだけで学習した場合のHitRate@100は0.3964、UCPAを加えると0.3915で、正解のコードを当てる指標は少し下がりました。一方、表5はクリックだけの方式とUCPAを加えた方式を本番で比べる別の実験です。著者は、通知からの再生時間が0.43%、共有率が7.57%増えたと報告しました。この表に各指標のp値は示されていません。
  executable_understanding: |-
    Labは、動画のコードと、投稿者のコードに動画の最初のコードを足した組み合わせを、別々の一覧で引きます。得られた動画を一つの集合にまとめ、重複を消して、すべてを同じ人工の最終スコアで並べます。

    もう一つの計算では、利用者の関心を表す数値を固定し、前に選んだコードの埋め込みだけを変えます。次のコードの確率が変わることを確かめます。モデルを学習したり、推薦の精度を測ったりはしません。
  results: |-
    人工データでは、動画の完全なコードで探すとv1が見つかり、投稿者のコードと動画の先頭コードで探すとv1とv2が見つかります。両経路をまとめて重複を消すと2件です。別の動画コードに属するv3は、同じ投稿者を表すコードでも入りません。人工の最終スコアではv2、v1の順になります。

    前のコードを変える計算では、次に1番目のコードを選ぶ確率が約0.711から約0.250へ変わりました。同じ利用者の関心でも、前のコードで後の確率が変わることを示す人工例です。
  what_we_verified: |-
    Labは、投稿者と動画の先頭コードの組み合わせで候補を絞れること、同じ動画が両方に出たときに一度だけ残すこと、すべての候補を同じスコアで並べることを確かめました。前のコードの埋め込みが次の確率に影響することも確認しました。重複を消す規則はLabで決めたもので、著者が本番で使った規則を再現したわけではありません。
  what_we_did_not_verify: |-
    Labは16層のデコーダー、投稿者のコードを作る量子化、クリックで利用者と投稿者の表現を近づける学習、GSISPOの更新を再現していません。論文のGPUでの最大QPSや本番のDAUも、独立には測っていません。表6の全構成の通知クリック率は、原論文の数値でも5%水準では有意ではありません。
  implementation: |-
    `retrieve()` は、動画の完全なコードと投稿者・動画の混合コードを、別々の辞書で検索します。`token_probs()` は、論文の式14で使うニューラルネットを簡単な計算に置き換えます。利用者の関心と前のコードの埋め込みを足し、その結果から次のコードの確率を求めます。`run.py` は標準ライブラリだけで動き、同じフォルダーに `results.json` を保存します。
  method: method.md
  mapping: mapping.md
teaching_figures:
- kind: equations
  id: chained-tokens
  title: 利用者の関心に、前のコードの情報を足す
  after: method
  locator: Eqs. 14, 21–24
  rationale: 前のコードを使って次を選ぶ式と、生成したコード列の学習に使う式を区別します。
  caption: 原論文の式を、コードを作る処理と、その確率を学習に使う処理に分けました。
  steps:
  - name: k番目のコードを選ぶ確率
    formula: p(sₖ | h,s<ₖ) = softmax(FFNₖ(h + Σⱼ<ₖ Embⱼ(sⱼ)))
    explanation: 共有デコーダーが出した利用者の関心hは、コードを作る途中では変えません。先に選んだコードの埋め込みをhに加えるので、前のコードが違えば次のコードの確率も変わります。
  - name: コード列全体で、更新前後の確率比を求める
    formula: w = exp[(1/L) Σₖ log(pθ(sₖ|h,s<ₖ)/pold(sₖ|h,s<ₖ))]
    explanation: 各段のコードについて、新しいモデルと古いモデルの確率の比を求めます。比の対数を平均し、指数を取ります。比そのものの算術平均ではなく、幾何平均になります。
  - name: 確率比を制限し、学習の重みに使う（GSISPO）
    formula: L = −(1/G) Σg sg(clip(wg,1−ε,1+ε)) Âg log πθ(sg|h)
    explanation: 確率比wを範囲内に収め、定数として、相対的な報酬とコード列の対数確率に掛けます。通常のPPOのように、比を掛けた目的関数の候補同士を比べて小さい方を取る処理とは異なります。
  source: https://arxiv.org/pdf/2607.03362v1
