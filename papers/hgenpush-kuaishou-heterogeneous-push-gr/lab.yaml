teaching_figures:
- kind: equations
  id: chained-tokens
  title: 固定anchorへ前SIDの意味を累積する
  after: method
  locator: Eqs. 14, 21–24
  rationale: 固定anchorへ前SIDの意味を累積する
  caption: 一次資料を説明用に再構成。数値は著者報告であり、Labの追試結果ではない。
  steps:
  - name: token k
    formula: p(sₖ | h,s<ₖ) = softmax(FFNₖ(h + Σⱼ<ₖ Embⱼ(sⱼ)))
    explanation: hは共有decoderが作った固定interest。prefixが変われば後tokenも変わる。
  - name: sequence比
    formula: w = exp[(1/L) Σₖ log(pθ(sₖ|h,s<ₖ)/pold(sₖ|h,s<ₖ))]
    explanation: tokenの確率比を算術平均しない。
  - name: GSISPO
    formula: L = −(1/G) Σg sg(clip(wg,1−ε,1+ε)) Âg log πθ(sg|h)
    explanation: clipはimportance weightに置く。通常のPPO clipと同じ操作ではない。
