question: UniVA：配信できる広告を探しながら、見込まれる価値で候補を選ぶ
summary: TencentのUniVAは、広告の識別子の末尾に広告主の目標と入札額の区分を入れる。モデルは識別子を一段ずつ生成しながら、配信できる枝だけを残し、生成ロジットと価値予測で候補を比べる。著者はWeChat ChannelsのA/Bテストで、本番対照より取引総額（GMV）が1.50%増えたと報告した。実験に使ったトラフィックの割合は初版が5%、第2版が20%と記載している。
