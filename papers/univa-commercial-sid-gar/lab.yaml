zed": true, "candidates": [{"path": "B/b1", "score": -0.253856, "valid": true}, {"path": "A/a1", "score": -2.126928, "valid": true}], "valid_count": 2}, {"alpha": 1.0, "width": 3, "personalized": false, "candidates": [{"path": "X/x1", "score": -0.181913, "valid": false}, {"path": "X/x2", "score": -2.181913, "valid": false}, {"path": "B/b1", "score": -3.181913, "valid": true}], "valid_count": 1}, {"alpha": 1.0, "width": 3, "personalized": true, "candidates": [{"path": "B/b1", "score": -0.253856, "valid": true}, {"path": "A/a1", "score": -2.126928, "valid": true}, {"path": "B/b2", "score": -2.253856, "valid": true}], "valid_count": 3}]}</script><p class="source-note">この画面はrun.pyが計算したresults.jsonを使う。論文の性能は再現していない。JavaScriptを無効にすると初期設定の結果を表示する。</p></div>
  results: |-
    16件の人工広告では、同じグループ内での入札額の分散が675.1875から63.125に下がった。全件に同じ意味prefixを与えたうえでグループを細かくした結果であり、本番で分け方が優れている証拠ではない。

    探索幅1、価値の係数0のとき、配信条件を探索後に適用する方法では、配信できないX/x1だけが最終候補に残り、有効な経路は0本になる。探索前に配信条件を適用するとA/a1が残る。探索前に除外したまま価値の係数を0.5にすると、今度はB/b1が残る。候補を採点するときの価値の扱いと、そもそも選べるかどうかは別の処理だ。

    また、Aの下でa1だけが配信できるとき、事前に除外するとa1の条件付き確率は1で、その段の対数確率は0になる。事後に除外する方式では、配信できないa2も正規化の分母に入るため、a1の同じ段での対数確率は0未満だ。除外の順序は候補数だけでなく、残った経路のスコアも変える。
  what_we_verified: Labは固定入力で、商用属性ごとに入札区間を作る処理、固定した価値を生成ロジットに足す処理、prefixごとの正規化を実行した。配信できない枝を除く時点と探索幅によって、どの経路が残るかも比較した。入力と全条件の結果はresults.jsonに収録した。
  what_we_did_not_verify: LabはRQ-KMeans+、HSTU、MoE/MoR、PPO、MCTS、商用トークンの語彙の最適配分を学習・再現していない。実際の入札、サービスで使う配信条件の判定、eCPMシミュレーター、GMV、遅延も検証していない。従来の順位付けの工程をすべて除けるか、入札の変動に合わせてCSIDを更新できるか、長期満足度や公平性がどう変わるかも未検証だ。
  method: method.md
  mapping: mapping.md
  implementation: リポジトリのルートで `uv run papers/univa-commercial-sid-gar/run.py` を実行すると、コードと同じ場所に `results.json` が生成される。ダウンロードした
    `run.py` だけでも動く。Python標準ライブラリを使い、乱数やGPUは使わない。
teaching_figures:
- kind: architecture
  id: csid-anatomy
  title: 広告の意味と商用属性を一つの識別子で表す
  after: problem
  locator: 図2・式1–8
  caption: 原論文の第2版をもとにLabが図を描き直した。UniVAは商用属性の組ごとに入札額の区間を決める。
  rationale: 原論文の第2版をもとにLabが図を描き直した。UniVAは商用属性の組ごとに入札額の区間を決める。
  rows:
  - label: 広告の意味を表す2段
    nodes:
    - title: SID₁ / SID₂
      text: UniVAは画像など複数種類の特徴をRQ-KMeans+で離散化し、上位2段に意味のまとまりを残す。
  - label: 商用属性を表す末尾
    nodes:
    - title: 属性の組 k
      text: UniVAは最適化目標、ROI目標、業種を組み合わせ、件数が少ない組を予備区分にまとめる。
    - title: 属性の組ごとに決める入札額の区間
      text: UniVAは件数がほぼ等しい区間を作り、属性の組と区間を合わせて末尾のトークンψ(k, bin)にする。
  - label: 同じ識別子を持つ広告から1件を選ぶ
    nodes:
    - title: 識別子が同じ広告のうち、その要求で配信できるもの
      text: UniVAはその要求で配信可能な集合I(x)との共通部分を取り、残った広告のうち入札額が最大のものを返す。
  source: https://arxiv.org/pdf/2605.05803v2
- kind: equations
  id: gar-math
  title: GARの価値予測と配信条件の式
  after: method
  locator: v2 式6・16・19・23–24
  caption: UniVAは次のトークンに価値スコアを足し、配信できない枝を除いてから確率を計算する。
  rationale: UniVAは次のトークンに価値スコアを足し、配信できない枝を除いてから確率を計算する。
  steps:
  - name: CSID
    formula: sᴸ = ψ(k, bₖ(bid))
    explanation: 上位L−1段は広告の意味を表す。末尾は属性の組と、その組での入札額の区間を表す。
  - name: GAR
    formula: ℓ_GAR[a] = o_gen[a] + αₗ qφ(s<l,a;x)
    explanation: qは、現在の配信要求で次のトークンを選んだ後に見込まれるリターンだ。α=0にすると配信時に価値を足さなくなるが、強化学習で更新した生成方策は残る。
  - name: 配信
    formula: log π̃(a) = log softmax(ℓ_GAR + mₓ)[a]
    explanation: UniVAは有効な枝でmₓを0、無効な枝で−∞にする。残った枝で確率を計算し、経路に沿った対数確率の和で候補を選ぶ。
  - name: RL
    formula: L_RL = L_PPO + λᵥ E[(qφ − Ĝ)²]
    explanation: UniVAはeCPMからリターンの教師値を計算する。PPOで生成方策を更新し、別の損失で価値ヘッドの予測を教師値に近づける。
  source: https://arxiv.org/pdf/2605.05803v2
