core_idea:
  author_claim: 著者は、識別子・探索・配信の各段階で商用価値や配信条件を扱うため、Commercial SID、Generation-as-Ranking（GAR）、要求ごとの探索木を組み合わせた。第2版の表2では、広告データで上位100件に正解が含まれた割合（HR@100）が、GPRにSIDデコーダを追加した基準より相対37.04%高かった。
  research_bot_interpretation: Labが注目したのは、生成し終えた後に広告を並べ直すのではなく、価値が見込める識別子の候補を生成の途中で残す点だ。比較対象は先行する広告向け生成推薦のGPRを使った構成であり、複数の候補生成器がある従来の配信システムを丸ごと置き換える実験ではない。
sections:
  overview: |-
    Tencentの研究チームは、広告の内容が似ていても、入札額や広告主の目標が違えば、表示したときに見込まれる価値は変わると考えました。UniVAは、その違いを広告の識別子（SID）の末尾に表します。モデルが候補を選ぶときは、識別子を出す確率と、その候補がもたらす価値の予測を組み合わせます。その時点で配信できない広告につながる候補は、探索の途中で外します。

    WeChat ChannelsのA/Bテストで、著者は完全な構成の取引総額（GMV）が従来方式より1.50%増えたと報告しています。この構成では学習方法と候補の選び方を一緒に変えており、どちらか片方の効果ではありません。同じ実験のトラフィックの割合は初版に5%、第2版に20%と記載され、変更の理由は本文からは分かりません。
  problem: |-
    広告の内容が似ていても、広告主の最適化目標やROI目標、業種、入札額は異なる。識別子が意味だけを表す場合、収益の見込みが異なる広告が同じ識別子に集まる。モデルが生成確率だけで候補を絞る場合は、価値が見込める識別子を最後まで生成する前に捨てることがある。先に全体の探索木で候補を絞り、後から配信条件を確認する方式では、配信できない枝に探索の枠を使ってしまう。

    論文は広告向けの生成推薦を扱う。取引総額（GMV）は広告に帰属する取引額の合計で、入札額や広告プラットフォーム自体の収益とは異なる。
  why_it_might_work: UniVAは商用属性と入札額の区分を識別子に含め、同じ区分の広告を一つの枝にまとめる。モデルは枝を選ぶたびに価値を予測するため、生成確率だけでは途中で落ちる候補も残せる。配信条件はその予測とは別に判定し、探索の枠を配信できる枝に使う。3つの処理はそれぞれ、異なる段階で候補を失う問題に対応する。
  evidence: |-
    ### 広告データでのオフライン比較

    第2版の表2で、著者はGPRにSIDデコーダを載せた構成を基準に、HR@100の相対的な改善率を比べた。Commercial SIDだけを足すと+5.78%、Sparse MoEまで順に加えると+18.40%、eCPMを使う強化学習とGARを加えると+32.01%、完全構成では+37.04%だった。完全構成ではデコーダのパラメーター数も62Mから80Mへ、計算量も8.5Gから23.2G FLOPsへ増えた。この表からGAR単独の寄与は分からない。広告属性がないAmazonのIndustrialとOfficeでは、著者はCommercial SIDを使わず、レビューの評価点を利用者の満足度の代わりに用いた。

    ### 同じ探索幅で何本の有効な経路が残ったか

    第2版の§4.4で、著者は価値と生成のスコアを混ぜる同じ方法を使い、探索幅を300にそろえた。配信できるかを探索後に判定した場合は有効な識別子の経路が48本、配信できない枝を探索前に外した場合は300本残った。平均入札額は1.29から11.44に増えた。ここで数えたのは識別子の経路であり、個別の広告数やGMVではない。どの配信要求でも300本残るという結果でもない。

    ### WeChat ChannelsのA/Bテストと版ごとの記載

    [初版の表3](https://arxiv.org/pdf/2605.05803v1)は2026年3月7〜11日のテストにトラフィックの5%を使ったと記載し、GARなしでGMV +1.03%、GARありで+1.50%と報告した。[第2版の表4と§4.5](https://arxiv.org/pdf/2605.05803v2)は同じ期間について20%と記し、V0からV3まで順に+0.22%、+0.36%、+1.03%、+1.50%と報告した。比率の記述が変わった理由は本文からは分からない。

    第2版では、V3はV2から学習方式をGRPOからPPOへ変え、同時に配信時のGARを有効にした。+1.50%は同時期の本番対照からの相対的な増加で、GARだけの効果ではない。ROI目標で運用する広告を除いたGMV(normal)は、完全構成で+1.42%だった。

    [一次資料：UniVA 第2版の本文と付録](https://arxiv.org/pdf/2605.05803v2)
  executable_understanding: |-
    Labは16件の人工広告に同じ意味のprefixを与え、商用属性で2群に分けた。次に、どちらの群も件数が均等になるよう入札額を2区間に分け、広告の入札額が同じ区分の中でどの程度ばらつくかを計算した。

    別の人工例では、探索木の2段それぞれで、固定した生成ロジットに固定した価値スコアを加える。候補になる枝の中でsoftmaxを取り、経路に沿って対数確率を足す。下の画面では、価値の係数、残す候補数、配信できない枝を除く時点を切り替えられる。価値は仕組みを示すために固定した値で、モデルが学習した値ではない。

    <div class="paper-probe teaching" data-paper-probe="univa-commercial-sid-gar"><h3>配信条件と価値の係数を変えて候補を見る</h3><p>人工の探索木では、配信できるAとBのうち、Aは生成ロジットが高く、Bは価値が高い。Xは配信できない。Labは2段それぞれの対数確率を足して候補を比べる。</p>
    <div class="probe-controls"><label>価値の係数 α<select data-alpha><option>0</option><option>0.25</option><option selected>0.5</option><option>1</option></select></label><label>beam幅<select data-beam><option>1</option><option selected>2</option><option>3</option></select></label><label><input type="checkbox" data-mask checked>探索前に無効枝を除く</label></div>
