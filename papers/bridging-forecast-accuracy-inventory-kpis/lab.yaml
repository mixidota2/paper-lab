core_idea:
  author_claim: 著者が公開したTruckPartsでは、補修部品の需要を人工的に生成し、モデルの予測を使って在庫費用と充足率を計算できます。著者は、予測誤差と費用の関係が需要の条件によって変わると報告しました。
  research_bot_interpretation: Accuracy Is Not Serviceが示したのは、「誤差だけでは運用上の良し悪しは分からない」という点です。TruckPartsを使うと、費用と充足率を加えてモデルを比較できます。試験環境での順位を実際の店舗に当てはめるのではなく、需要の仮定や在庫ルールを変えても同じ順位になるかを調べるために使えます。
sections:
  overview: |-
    著者はトラックの補修部品について、予測誤差が小さいモデルほど在庫費用も低くなるかを調べました。部品の故障から48条件の人工需要を作り、2年分の需要で7モデルを学習しました。残りの1年は、各モデルの予測を同じ補充ルールに入れて費用を比べました。

    平均絶対誤差は、表の表示桁ではXGBoostとRandom Forestが0.43、Crostonが0.52です。一方、48条件の総費用を足すと、最も安かったのはCrostonでした。この実験では部品の単価や納期をそろえ、供給量に上限を置いていません。実際の販売店でも同じ順位になることは確かめていません。
  problem: 補修部品は、需要がない日が続いたあと、ある日にまとめて必要になることがあります。著者は需要の変化4種類、車両数の範囲4種類、部品寿命の範囲3種類を組み合わせ、48条件を設定しました。各条件で4販売店の3年分の需要を作りました。販売店で計測した需要は使っていません。
  why_it_might_work: 平均絶対誤差（MAE）は、実績と予測の差の絶対値を平均した値です。予測が1個多くても、1個少なくても、同じ誤差になります。保管費は売れ残りで増え、欠品が起きれば緊急便などの費用もかかります。著者の試験環境では、保管・発注・緊急便・輸送・サービス不足の費用を足し、予測が同じでも費用がどう変わるかを確認できます。
  evidence: |-
    一次資料（論文v2のTable 1）で著者が報告したMAEは、丸めるとXGBoostとRandom Forestがともに0.43で、Crostonは0.52です。同じ順で総費用は約8.2×10⁵、7.5×10⁵、7.4×10⁵でした。MAEはシナリオごとの値を平均し、標準偏差も示しています。費用は全シナリオの合計です。図で指標を切り替えると、どのモデルの値が小さいかを比べられます。

    図6(a)では、一つの点が「一つの需要条件で一つのモデルを使った結果」に当たります。全条件の点をまとめると、平均絶対誤差（MAE）と費用の順位相関は0.95でした。一方、同じ需要条件でモデル間の順位相関を求め、48条件の値を平均すると−0.16です。条件をまとめたときの関係だけでは、ある条件でモデルを替えると費用が下がるかは分かりません。論文本文が示したRMSEと費用の条件内相関の平均は−0.06です。Labはこの相関を再計算していません。
  executable_understanding: |-
    `UV_CACHE_DIR=/tmp/uv-cache uv run --no-project papers/bridging-forecast-accuracy-inventory-kpis/run.py`

    Labでは、毎日ゼロと予測するZeroと、需要があった日の数量と発生間隔から予測するCrostonを比べます。最初の730日でCrostonを学習し、次の365日はどちらの予測値も固定します。両モデルに同じ需要と補充ルールを使い、欠品1個の費用を1、5、20、50に変えます。Zeroはこの小実験の比較対象で、XGBoostなどの木モデルの代わりではありません。
  results: |-
    欠品1個の費用を変えても、モデルの予測と補充ルールは変えません。どの条件でも平均絶対誤差はZeroが0.537、Crostonが0.855です。Zeroは196個が欠品し、保管費は0でした。Crostonは欠品を49個に減らし、需要196個のうち147個（75%）をすぐに満たしました。代わりに保管費が945かかりました。

    欠品1個の費用を1と置くと、総費用はZeroが196、Crostonが994です。50と置くと、Zeroが9,800、Crostonが3,395になり、安いモデルが入れ替わります。両者の総費用が等しくなる単価は約6.43です。Crostonが減らした欠品147個で、増えた保管費945を割ると求められます。この単価は、この人工需要と補充ルールに限った値です。
  what_we_verified: CONFIRMED：毎日、前日の在庫に入荷を足し、販売分を引くと日末の在庫になります。販売数量と欠品数量の合計が当日の需要に一致することも確認しました。欠品単価50ではZeroの誤差が小さく、Crostonの総費用が低くなりました。確認できた仕組みはこの範囲に限ります（PARTIAL）。論文の需要生成と費用計算をすべて再現したわけではありません。
  what_we_did_not_verify: Labは、性能、規模を拡大したときの挙動、実務で使えるかを検証していません（NOT TESTED）。著者の48条件、7モデル、費用シミュレータも再実行していません。著者は人工需要を使い、すべての販売店と部品に同じ在庫ルールの設定を使いました。価格、初期在庫、納期は共通で、供給者の容量に上限はありません。この結果は、販促と欠品がある状況での時系列基盤モデル（TSFM）と勾配ブースティング決定木（GBDT）の比較や、実店舗の棚割りを変える無作為化比較試験（RCT）の根拠には使えません。
  implementation: run.pyはPythonの標準ライブラリだけで動きます。croston()が需要の発生間隔と発生日の数量から予測を出し、simulate()が同じ補充ルールで在庫、欠品、費用を計算します。results.jsonには、著者の報告値をreported、Labの計算結果をframesとして保存しています。ページの生成にはlab.yaml、method.md、mapping.md、results.jsonを使います。
  method: method.md
  mapping: mapping.md
