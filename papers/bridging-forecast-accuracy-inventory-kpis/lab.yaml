- kind: equations
  id: objective
  title: 予測誤差と、在庫や欠品にかかる費用は別の指標
  after: method
  locator: Section 4; Lab run.py
  source: https://arxiv.org/pdf/2601.21844v2
  rationale: 同じ予測を予測誤差と費用で比べる
  caption: Labの説明用実験で使う計算。原論文の費用モデルを再現した式ではありません。
  steps:
  - name: 予測誤差
    formula: MAE = mean(|d − f|)
    explanation: 実際の需要dと予測fの差を絶対値にして平均します。
  - name: 説明用の在庫目標
    formula: S = ceil(5f)
    explanation: 予測fを5倍して切り上げます。両モデルとも同じルールで補充します。
  - name: 説明用の費用
    formula: C = Σ I + p Σ U
    explanation: Iは日末在庫、Uは欠品個数、pは欠品1個の費用です。
