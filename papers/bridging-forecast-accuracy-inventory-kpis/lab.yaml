- kind: equations
  id: objective
  title: Labが予測誤差と在庫費用を計算する式
  after: method
  locator: Section 4; Lab run.py
  source: https://arxiv.org/pdf/2601.21844v2
  rationale: 同じ予測から誤差と費用を別々に求める。
  caption: ここで使うのはLabの小実験の式で、原論文の費用計算の再現ではない。
  steps:
  - name: 予測誤差
    formula: MAE = mean(|d − f|)
    explanation: 各日の需要dと予測fの差の絶対値を求め、日数で平均する。
  - name: 説明用の在庫目標
    formula: S = ceil(5f)
    explanation: 予測fを5倍し、整数に切り上げて目標を決める。両モデルで同じ式を使う。
  - name: 説明用の費用
    formula: C = Σ I + p Σ U
    explanation: 毎日、日末在庫Iに保管費、欠品個数Uに単価pを掛けた額を計上し、全日分を足す。
