core_idea:
  author_claim: 著者は、補修部品の需要を人工的に作り、予測結果から在庫費用と充足率までを計算できる公開ソフトウェアTruckPartsを提供しました。予測の外れと費用の関係は、需要の条件によって変わると報告しています。
  research_bot_interpretation: Labの読み方：Accuracy Is Not Serviceが示した「誤差だけでは運用上の良し悪しは分からない」という問題を、費用と充足率で試せる環境です。現場でどのモデルが優れるかの証拠ではありません。需要の作り方や在庫ルールの仮定を変えて、結論がどこで変わるかを調べる出発点です。
sections:
  overview: 予測の外れが小さいモデルでも、欠品まで含めると費用が高くなることがあります。著者はトラックの補修部品の需要を人工的に作り、7モデルを同じ在庫ルールで比較しました。平均絶対誤差が小さかったのはXGBoostとRandom Forest、総費用が最も低かったのはCrostonです。
  problem: 補修部品は、需要がない日が多く、売れる日にまとめて必要になることがあります。著者は時間とともに需要傾向が変わる条件4種類、車両数の範囲4種類、部品寿命の範囲3種類を掛け合わせ、48の条件を作りました。各条件で、4販売店の3年分を人工的に生成します。店舗で観測した需要の比較ではありません。
  why_it_might_work: 平均絶対誤差（MAE）は実績と予測の差を絶対値にして平均します。同じ1個なら、多く予測しても少なく予測しても同じ誤差です。在庫費用では、持ちすぎれば保管費がかかり、足りなければ欠品や緊急便につながります。著者の試験環境では、保管・発注・緊急便・輸送・サービス不足の費用を通して、同じ予測でも費用がどう違うかを確認できます。
  evidence: '一次資料の著者報告（v2 Table 1）では、XGBoostとRandom ForestのMAEは丸めるとともに0.43、Crostonは0.52です。一方、総費用はそれぞれ約8.2×10⁵、7.5×10⁵、7.4×10⁵でした。MAEはシナリオごとの値を平均し、ばらつきは標準偏差で示しています。費用は全シナリオの合計です。図では指標を切り替え、順位の違いを確認できます。


    著者は、MAEと費用の順位相関を全体では0.95、シナリオごとに計算して平均すると−0.16と報告しています（Figure 6）。本文では、二乗平均平方根誤差（RMSE）と費用についても、シナリオ内の平均が−0.06です。需要の規模が違う条件をまとめた相関だけでは、個々の条件でどのモデルを選ぶべきか分かりません。Labはこれらの相関を再計算していません。'
  executable_understanding: '`UV_CACHE_DIR=/tmp/uv-cache uv run --no-project papers/bridging-forecast-accuracy-inventory-kpis/run.py`


    Labの小実験では、毎日ゼロと予測するZeroと、需要が発生した日の数量と発生間隔から予測するCrostonを比較します。最初の730日でCrostonを学習し、次の365日はどちらの予測値も固定します。需要と補充ルールは共通です。欠品1個の費用を1、5、20、50に切り替えると、どちらの費用が低いかが変わります。ZeroはXGBoostなどの木モデルの代わりではありません。'
  results: Labの実験では、MAEはZeroが0.537、Crostonが0.855で、欠品単価を変えても同じです。欠品単価50では、総費用がZeroの9,800に対しCrostonは3,395でした。需要数量のうち即時に満たせた数量の割合（充足率）は、それぞれ0%と75%です。欠品単価1では総費用が196と994になり、今度はZeroの方が低くなります。Crostonがいつも有利なのではなく、欠品を減らす価値と在庫を持つ費用の兼ね合いで変わります。
  what_we_verified: CONFIRMED：毎日、前日の在庫と入荷から販売分を引くと残在庫になり、販売分と欠品分を足すと需要に一致することを確かめました。欠品単価50で、誤差ではZero、費用ではCrostonが有利になることも確認しました。仕組みの確認範囲はPARTIALです。原論文の需要生成や費用計算をすべて再現したわけではありません。
  what_we_did_not_verify: 性能・規模を増やした場合の挙動・実務への適用はNOT TESTEDです。著者の48条件、7モデル、費用シミュレータは再実行していません。原論文も人工需要で評価し、在庫ルールのパラメータは全販売店・部品で固定しています。価格、初期在庫、納期を共通とし、供給者の容量には上限を置きません。販促と欠品を含む時系列基盤モデル（TSFM）対勾配ブースティング決定木（GBDT）の比較や、実店舗で棚割りを変えた無作為化比較試験（RCT）の根拠には使えません。
  implementation: run.pyはPythonの標準ライブラリだけで動きます。croston()は需要があった日の数量と発生間隔から次の予測値を求め、simulate()は同じ補充ルールで在庫・欠品・費用を計算します。results.jsonのreportedには著者の報告値、framesにはLabの実験結果を保存しています。ページはlab.yaml、method.md、mapping.md、results.jsonから生成します。
