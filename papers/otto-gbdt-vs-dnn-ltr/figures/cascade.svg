<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 545" role="img" aria-labelledby="title desc"><title id="title">検索結果の並べ替えが比較対象</title><desc id="desc">商品候補を探し、緑の枠で採点して並べ替える。比較するのは並べ替えの方式。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217661"/></marker></defs><rect width="440" height="545" rx="12" fill="#fafcf7"/><rect x="20" y="20" width="400" height="78" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="48" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">リクエスト</text><text x="34" y="77" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">検索語・利用者や端末の情報</text><path d="M220,99 L220,122" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="132" width="400" height="78" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="160" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">候補生成</text><text x="34" y="189" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">検索リクエストに対して候補を返す</text><path d="M220,211 L220,234" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="244" width="400" height="103" rx="8" fill="#d7eadd" stroke="none"/><text x="34" y="272" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">比較対象：候補の並べ替え</text><text x="34" y="301" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">LambdaMART または TT / CR / TR</text><text x="34" y="326" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">同じ商品候補を採点して並べ替える</text><path d="M220,347 L220,370" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="380" width="400" height="78" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="408" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">検索結果を表示</text><text x="34" y="437" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">クリック・注文・売上で評価</text><text x="20" y="507" font-family="sans-serif" font-size="16" font-weight="normal" fill="#193b36">候補を探す処理の変更は、この実験の対象外。</text></svg>
