<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 680" role="img" aria-labelledby="title desc"><title id="title">三つの結合方式</title><desc id="desc">三つの結合方式。説明と出典はLab本文と図注を参照。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217661"/></marker></defs><rect width="440" height="680" rx="12" fill="#fafcf7"/><rect x="20" y="20" width="400" height="128" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="48" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">TT：最後に内積</text><text x="34" y="77" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">商品 x_p → 3層backbone → h_p</text><text x="34" y="102" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">文脈 x_c → 線形層 → h_c</text><text x="34" y="127" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">score = h_cᵀ h_p</text><rect x="20" y="190" width="400" height="128" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="218" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">CR：最初に特徴を連結</text><text x="34" y="247" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">[商品 x_p, 文脈 x_c]</text><text x="34" y="272" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">→ 3層backbone → h_z</text><text x="34" y="297" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">→ scoring layer</text><rect x="20" y="360" width="400" height="128" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="388" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">TR：候補同士にも自己注意</text><text x="34" y="417" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">全候補と文脈 → MHSA → h_t</text><text x="34" y="442" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">CR表現 h_z と (1+h_t) ⊙ h_z</text><text x="34" y="467" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">→ scoring layer</text><text x="20" y="556" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">共通：カテゴリ・単語の埋め込み</text><text x="20" y="581" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">TR：位置符号化なし、1層・1head</text><text x="20" y="606" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">採用：TT＋CE（注文順位を維持）</text></svg>
