<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 680" role="img" aria-labelledby="title desc"><title id="title">商品と検索時の文脈を組み合わせる方法</title><desc id="desc">Two-Towerは商品と文脈を別々に処理します。Cross-Encoderは先につなぎ、Transformerは候補どうしの関係も使います。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217661"/></marker></defs><rect width="440" height="680" rx="12" fill="#fafcf7"/><rect x="20" y="20" width="400" height="128" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="48" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">Two-Tower：最後に内積を取る</text><text x="34" y="77" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">商品 x_p を3層に通し、h_p を得る</text><text x="34" y="102" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">文脈 x_c を線形層に通し、h_c を得る</text><text x="34" y="127" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">点数 = h_cᵀ h_p</text><rect x="20" y="190" width="400" height="128" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="218" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">Cross-Encoder：先に特徴をつなぐ</text><text x="34" y="247" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">商品 x_p と文脈 x_c を連結</text><text x="34" y="272" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">3層のネットワークで h_z を得る</text><text x="34" y="297" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">採点する層に渡す</text><rect x="20" y="360" width="400" height="128" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="388" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">Transformer：候補どうしを参照</text><text x="34" y="417" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">候補どうしの自己注意で h_t を得る</text><text x="34" y="442" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">(1+h_t) ⊙ h_z で表現を調整</text><text x="34" y="467" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">採点する層に渡す</text><text x="20" y="556" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">全方式がカテゴリと単語の埋め込みを使う</text><text x="20" y="581" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">Transformer：位置符号化なし、1層・1ヘッド</text><text x="20" y="606" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">本番の比較はTT＋CEとLambdaMART</text></svg>
