core_idea:
  author_claim: |-
    著者はOTTOの本番で使うLightGBM LambdaMARTと三つの深層モデルを比べました。Softmax交差エントロピーで学習したTwo-Towerでは、検索ログ上の注文の順位指標が既存方式と表示精度で同じになり、クリックの順位指標と商品価値の指標は上がりました。著者はこの構成を本番のA/Bテストに選びました。

    [一次資料：arXiv v1 本文](https://arxiv.org/html/2507.20753v1)
  research_bot_interpretation: 比較したのは、カテゴリや単語の埋め込みを含む構成全体です。木と深層モデルの学習方法の差に絞って調べるなら、木モデルにも同じ埋め込みを渡し、候補や比較条件をそろえる必要があります。
sections:
  overview: |-
    OTTOの研究チームは、通販の検索結果を並べ替える方法として、木を使う既存のLambdaMARTと、複数のニューラルネットを比べました。Two-Towerは検索と商品を別々に数値で表し、その組み合わせから商品を順位付けします。著者は、このモデルをSoftmax交差エントロピーで学習し、本番で既存方式と8週間比較しました。

    Two-Towerの群は、既存方式よりクリック総数が1.86%、売上が0.56%増えました。販売点数は著者の報告では同程度でした。一方、候補商品どうしの関係を使うTransformerは別の検索ログ評価で、注文された商品を上位に置く指標が既存方式より1.48%低く、本番のA/Bテストには含まれていません。
  problem: |-
    通販の検索では、まず検索語などから商品候補を探します。この論文が扱うのは、その候補に点数を付けて表示順を決める処理（Learning-to-Rank）です。Two-Towerで商品を探したり、近似最近傍検索を使ったりする研究ではありません。

    学習には、表示した商品がクリックされたか、注文されたかの記録を使います。どちらのラベルにも、同じ一覧で正例が複数ある場合があります。表示される商品と順位は、すでに動いている検索の仕組みに左右されます。ログ上の順位指標だけで、実際に売上が増えるかは判断できません。
  method: method.md
  why_it_might_work: |-
    Two-Towerは、商品の情報と検索時の文脈を別々のベクトルに変え、内積で候補ごとに点数を付けます。商品と検索時の文脈だけで十分な点数を付けられるなら、候補どうしの関係を計算する利点は小さいかもしれません。これはLabの解釈であり、候補どうしの比較が一般に不要だと示した結果ではありません。
  evidence: |-
    ### 検索ログの上位15件を比べた結果

    著者はOTTOの匿名化したデータを時系列順に分け、学習に4,300万件、テストに70万件のサンプルを使いました（§6）。利用者数や商品数ではありません。利用者が検索結果をスクロールした深さの中央値に合わせて、上位15件を評価しました。

    NDCGは、正例を上位に並べるほど高くなる順位の指標です。著者はクリックされた商品と注文された商品をそれぞれ正例とする指標を別々に計算しました。AIV（Average Item Value）は商品価値を使う売上の代理指標で、実際の売上ではありません。

    | 損失とモデル | クリックのNDCG | 注文のNDCG | AIV |
    | --- | ---: | ---: | ---: |
    | CE・Two-Tower | +4.32% | 0.00% | +2.28% |
    | CE・Cross-Encoder | +4.32% | −0.30% | +2.28% |
    | CE・Transformer | +2.16% | −1.48% | +2.89% |
    | RankNet・Two-Tower | +3.70% | −1.48% | +2.28% |
    | RankNet・Cross-Encoder | +4.63% | −0.59% | +2.37% |
    | RankNet・Transformer | +3.09% | −1.78% | +3.16% |

    表1の値は、本番のLightGBM LambdaMARTに対する相対差です。パーセントポイントの差ではありません。Two-TowerとCEを組み合わせたときの注文の0.00%は、表に載った精度での差です。同等性を確認したものではありません。クリックの偏りや損失係数は著者が挙げた原因候補で、順位指標の差をそれらだけに帰すことはできません。

    ### 本番で8週間比べた結果

    A/Bテストでは、CEで学習したTwo-Towerだけを本番のLambdaMARTと比べました。Cross-EncoderとTransformerは含まれていません。著者によると、クリック総数は+1.86%（t検定、p < 0.0001）、売上は+0.56%（p < 0.01）で、販売点数は同程度でした。販売点数が同じ効果だと確かめたわけではありません。割り付けの規模と信頼区間の正確な端点は本文から確認できません。

    著者は深層モデルの学習・配信費用が高いものの、効果に比べて小さいと述べています。具体的な費用や応答時間は示していません。売上の増加から、利益が増えたとは判断できません。

    [一次資料：arXiv v1の§6、表1、図1](https://arxiv.org/html/2507.20753v1)
  executable_understanding: |-
    Labでは一つの検索一覧に8商品を置き、それぞれに特徴を二つ与えます。二つ目の特徴が最大の商品は注文とクリックの正例です。一つ目の特徴が最大の別の商品も、クリックの正例にします。両方が同じ商品ならクリックの正例は1件です。

    二つの特徴から一つの点数を求める線形モデルを使い、クリック損失に掛ける係数αだけを変えます。学習は乱数シード19で作った160一覧、テストは別のシード20で作った240一覧です。各条件で250回更新し、更新幅を決める学習率は0.3に固定します。図でαを選ぶと、テストの上位3件で計算したクリックと注文のNDCGを見比べられます。Two-Towerや木モデルを比べる例ではありません。
  results: |-
    注文のNDCG@3は、αを0、0.25、0.5、0.75、1に変えると、0.980009、0.924700、0.841611、0.723308、0.599897の順に下がりました。クリックのNDCG@3は0.752〜0.767程度で、係数を増やしても一方向には上がりませんでした。学習で小さくするCEと、順位を評価するNDCGは別の量です。
  what_we_verified: 人工のテストではクリック損失にかける係数を変えると、両方に使う点数の重みが変わり、注文の順位指標も変わりました。同じ係数を掛ければ両方の順位指標が維持される、とは言えない例です。仕組みの確認はこの範囲に限ります（Mechanism PARTIAL）。
  what_we_did_not_verify: |-
    LabではOTTOのデータ、埋め込みの学習、LambdaMART、配信費用、売上効果を確かめていません。論文のTransformerで注文の順位指標が下がった原因も特定していません。合成例では、クリックと注文の正例をどう作るかが変われば、αと順位指標の関係も変わり得ます。実際の導入では同じ特徴、候補、配信予算で比較し、利用者を対象としたA/Bテストでも確かめる必要があります。
  implementation: |-
    リポジトリでは `uv run papers/otto-gbdt-vs-dnn-ltr/run.py` を実行します。配布した `run.py` だけを使うなら、保存したフォルダで `python run.py` を実行します。Pythonの標準ライブラリだけで動き、同じフォルダの `results.json` に結果を保存します。乱数シードを固定し、五つの係数に同じ一覧を使います。
  mapping: mapping.md
