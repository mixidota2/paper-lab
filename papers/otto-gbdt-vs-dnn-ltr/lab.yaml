question: 検索で見つけた商品を並べ替えるとき、Two-Towerは本番のLambdaMARTより良い結果を出せるか
summary: OTTOは、見つけた商品を並べ替えるTwo-TowerをSoftmax交差エントロピーで学習し、本番のLambdaMARTと8週間比べました。既存方式よりクリック総数が1.86%、売上が0.56%増え、販売点数は著者の報告では同程度でした。Transformerは別の検索ログ評価に含まれましたが、本番の比較には入っていません。
