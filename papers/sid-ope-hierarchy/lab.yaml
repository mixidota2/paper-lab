- kind: equations
  id: bias-bound
  title: グループ内で商品を選ぶ違いは重み付けに反映されない
  after: method
  caption: 重みで再正規化しないグループ単位のIPSが対象。平均の量子化誤差だけでは上限を決められない。
  source: https://arxiv.org/pdf/2608.28905v1
  locator: 命題3.1
  rationale: 重みで再正規化しないグループ単位のIPSが対象。平均の量子化誤差だけでは上限を決められない。
  steps:
  - name: 重要度重み
    formula: wᵢ = πₑ(Cᵢ|xᵢ) / π₀(Cᵢ|xᵢ)
    explanation: グループの出現率を新方策に合わせる。グループ内の商品選択は既存方策のまま。
  - name: 条件付きバイアス上限
    formula: '|Bias| ≤ 2 L_q δ_max,ℓ E[TV_in,ℓ]'
    explanation: 報酬の変化とグループ内での商品選択の違いが小さいほど、偏りの上限も小さい。確率が既知であることなど、命題の条件を満たす必要がある。
