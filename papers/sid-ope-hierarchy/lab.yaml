core_idea:
  author_claim: |-
    著者は、Semantic ID（SID）の先頭が同じ商品をグループにまとめ、過去の配信ログで新しい推薦方策を評価した。同じ数に分ける通常のクラスタリングでも誤差に有意差はなく、SIDの木を使う利点は、デコーダの出力からグループの選択確率を計算でき、グループの細かさも変えられる点にある。

    [一次資料：論文初版](https://arxiv.org/pdf/2608.28905v1)
  research_bot_interpretation: |-
    SIDの木は商品を生成するだけでなく、何をひとまとめにして評価するかを決める道具にもなる。ただし、同じグループ内の商品の入れ替えを評価したいなら、まとめる前の違いを測る必要がある。商品集合やSIDの割り当てから変える施策を、この方法でそのまま比較することはできない。
sections:
  overview: |-
    著者は新しい推薦の仕組みのクリック率などを、過去の配信記録から推定する方法を調べました。新しい仕組みでよく出る商品でも、過去の配信は少ない場合があります。そこで、同じ符号で始まる商品IDをまとめ、新旧の仕組みがそのグループを表示する確率の比で、過去の記録を重み付けしました。

    無作為に商品を表示したKuaiRandを使った制御実験では、著者は同じ推定方法（SNIPS）を使い、誤差の指標（RMSE）が商品単位の0.155からグループ単位の0.087に下がったと報告しています。ただし、0.087は正解が分かる別の検証データでグループの細かさを選んだ結果です。同じ数のグループなら、木構造を使う方法が通常のクラスタリングより正確だという結果は得られませんでした。また、同じグループ内で表示する商品だけを変える場合は、グループにまとめるとその違いを見落とします。
  problem: |-
    新しい推薦方策を配信する前に、既存の方策が残したログから、その方策の報酬を推定する。これをオフ方策評価（OPE）という。商品単位のIPSは、ユーザーなどの条件xが同じとき、その商品aを出す新方策の確率を既存方策の確率で割り、ログに残った報酬に掛ける。重みは `πₑ(a|x)/π₀(a|x)` だ。新方策がよく出す商品を既存方策がめったに出さないと、少数の大きな重みが推定値を左右する。既存方策が一度も出し得ない商品については、そのログだけで商品単位の効果は識別できない。

    論文が想定するのは、両方の方策が同じ商品集合とSIDの木を使う変更だ。デコーダや順位付けのルールを変える場合でも、比較に使う確率は実際に選ばれる商品に対応している必要がある。候補生成器を変えて別の商品が評価対象に入る場合や、SIDを割り当て直して木が変わる場合は対象外だ。
  method: method.md
  why_it_might_work: |-
    SIDの最初の数桁が同じ商品をまとめ、そのグループを出す確率で重みを計算する。従来は別の商品の記録だったものを同じグループで使えるため、重みが少数の記録に集中しにくくなる。一方、重みを変えても、グループの中でどの商品を出していたかは既存方策のままだ。

    新旧の方策が同じグループの中で商品を入れ替え、入れ替えの前後でクリックされやすさが違うと、推定に偏りが出る。評価の粒度を細かくすればこの違いを残せるが、記録が少ないと推定は不安定になりやすい。
  evidence: |-
    ### 本番ログでは重みの集中を調べた

    著者は、本番の探索配信で1位に表示した約1,700万件を使い、商品単位の重みの集中を調べた。付録表5の設定の一つでは、有効標本数（ESS）が元のログ件数の約0.003倍だった。

    候補の記録も残る約29,000件では、最もスコアが高い候補を選ぶ方策を評価した。最も細かいグループから最も粗いグループに切り替えると、ESSはログ件数の0.167倍から0.300倍へ、約1.8倍になった。選択確率を求めるときは、記録された候補だけの重みを足して分母にした。全商品から選ぶ確率ではない。本番では新方策の真の報酬が分からないため、この結果は重みの状態を示すだけで、推定の正しさや施策の改善効果を確認したものではない。

    ### 推定の誤差は、正解を作れる別の実験で測った

    KuaiRandの無作為露出ログを二つに分け、一方で新旧の方策を作り、もう一方でクリックの生成と基準となる真値を決めた。7,339商品を対象に、各回5,000件のログを作って200回試した。表1aのSNIPSでは、商品単位のRMSEが0.155、グループ単位が0.087だった。ただし後者は、別の検証用シミュレーションで真値を見てグループの深さを選んでいる。

    表3では、真値を使わずにログから深さを選ぶSLOPEをMIPSに適用した。ログが5,000件のとき、RMSEは0.109だった。真値で深さを選んだSNIPSは0.086で、深さの選び方だけでなく推定器も違う。0.086と表1aの0.087は別の乱数で試した結果だ。同じ埋め込みを同じ数のグループに分けた比較では、SIDの木が通常のk-meansより正確とはいえなかった（表1b）。Amazonの追加実験は自分から評価を投稿した人のデータを使っており、独立した因果的な検証とは扱わない。

    ### A/Bテストに回す方策を選べるか

    著者は深さ3に固定して16種類の方策を順位付けし、真値で並べた順位と比べた（表2）。グループ間で表示確率を変える方策では、グループ単位の評価の方が、真値で決めた順位に近かった。例えばログ1,000件の場合、順位の一致度（Kendallの順位相関）は商品単位の0.08に対し、グループ単位は0.13だった。5,000件では0.15と0.18だった。どちらの件数でも、相関は完全な一致を表す1から遠かった。一方、同じグループ内で商品を替えるだけなら、商品単位の評価が同じか、それ以上に真値の順位に近かった。シミュレーションで選んだ方策の損失差は信頼区間で区別できず、この結果だけで、どの方策を本番に出すべきかは決められない。

    [一次資料：論文初版、§4.2–4.4と付録A](https://arxiv.org/pdf/2608.28905v1)
  executable_understanding: |-
    Labは架空の64商品を4分木に並べた。既存方策は、各グループを選んだ後、その中の先頭商品を97%の確率で出す。評価する方策は、グループの選び方と、その中で選ぶ商品の両方を変える。1回につき600件のログを作り、250回繰り返した。それぞれのログを使い、深さ0から3までIPSとSNIPSを計算する。深さ0は全商品を一つにまとめ、深さ3では商品ごとに評価する。

    有効標本数ESSは `(Σw)²/Σw²` で求める。重みが少数の記録に集まるほど小さくなる。ESSが増えても実際のログが増えたわけではなく、推定の偏りが消えたことを意味しない。RMSEは、試行ごとの推定値と真値との差を二乗して平均し、その平方根を取る。併せてIPSの分散と期待値の偏り、観測できたグループの割合を保存する。グループの確率は、条件付き確率の積と、その下にある商品の確率の和が一致するかも確かめる。
  results: |-
    商品ごとに評価したときの平均ESSは5.519件相当で、深さ1の4グループでは151.423件相当だった。SNIPSのRMSEは0.280から0.102に下がった。一方、全商品を一つにまとめると、すべての記録の重みが等しいためESSは600件相当になったが、RMSEは0.340に悪化した。同じグループにまとめすぎると方策間の違いが見えなくなる。これらはすべてLabの人工データの結果だ。
  what_we_verified: |-
    Labは、グループにまとめると重みの集中が減っても、まとめすぎると推定に偏りが残ることを人工例で確かめた。既知の分布からIPSの期待値と真値の差を計算し、有限のログで測ったRMSEとは区別した。正規化済みの人工的な木では、条件付き確率の積と、選べる商品の確率の和も一致した。
  what_we_did_not_verify: |-
    SIDの学習、埋め込み上で報酬が滑らかに変わるという仮定、SLOPE、OffCEM、本番ログの配信確率の復元は試していない。人工例では、全商品の確率が既知でゼロより大きい。既存方策が出せない商品の報酬を、ログなしで特定できることは示していない。Labは全ての深さの結果を示しており、真値で選んだ深さでの実運用成績は報告しない。
  implementation: |-
    リポジトリのルートで `uv run papers/sid-ope-hierarchy/run.py` を実行する。Pythonの標準ライブラリだけでCPU上で動き、スクリプトと同じフォルダーに `results.json` を保存する。乱数シードは固定している。JSONにあるのはLabの人工例の結果で、論文の測定値は入れていない。
  mapping: mapping.md
