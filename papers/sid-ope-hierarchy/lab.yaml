question: 過去の配信ログが少ない商品をまとめると、新しい推薦方策をどこまで評価できるか？
summary: 過去の配信ログで商品ごとの記録が少なくても、Semantic IDの先頭が同じ商品をまとめると、推薦方策の評価が安定する場合があります。ただし、同じグループ内で表示する商品だけが変わると、その効果を見落とします。論文の制御実験では、木構造の有無よりも、商品をまとめること自体が誤差の改善につながりました。
