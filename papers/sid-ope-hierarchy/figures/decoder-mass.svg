<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 460" role="img" aria-labelledby="title desc"><title id="title">段ごとの確率から群の確率を求める</title><desc id="desc">段ごとの確率から群の確率を求める。説明と出典はLab本文と図注を参照。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217661"/></marker></defs><rect width="440" height="460" rx="12" fill="#fafcf7"/><rect x="20" y="20" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="48" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">デコーダが出す条件付き確率</text><text x="34" y="77" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">P(c₁=0)=0.4</text><text x="34" y="102" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">P(c₂=1 | c₁=0)=0.25</text><path d="M220,124 L220,148" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="158" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="186" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">先頭が01になる確率</text><text x="34" y="215" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">P(01)=0.4 × 0.25 = 0.10</text><text x="34" y="240" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">先頭が01の全商品の確率を足した値と同じ</text><text x="20" y="323" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">説明用の値。確率を正規化した木を使う。</text><text x="20" y="348" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">木を使わない場合は商品ごとの確率を足す。</text><text x="20" y="373" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">木では、グループまでの確率だけを掛ける。</text></svg>
