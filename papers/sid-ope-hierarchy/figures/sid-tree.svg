<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 510" role="img" aria-labelledby="title desc"><title id="title">接頭辞で束ねるSID tree</title><desc id="desc">接頭辞で束ねるSID tree。説明と出典はLab本文と図注を参照。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217661"/></marker></defs><rect width="440" height="510" rx="12" fill="#fafcf7"/><rect x="130" y="15" width="180" height="78" rx="8" fill="#e9f1ea" stroke="none"/><text x="144" y="43" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">全catalog</text><text x="144" y="72" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">深さ0：1群</text><path d="M220,94 L110,135" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="145" width="180" height="78" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="173" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">prefix 0</text><text x="34" y="202" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">深さ1の群</text><path d="M220,94 L330,135" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="240" y="145" width="180" height="78" rx="8" fill="#e9f1ea" stroke="none"/><text x="254" y="173" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">prefix 1</text><text x="254" y="202" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">深さ1の群</text><path d="M110,224 L60,265" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="275" width="80" height="65" rx="8" fill="#e9f1ea" stroke="none"/><text x="44" y="315" font-family="sans-serif" font-size="20" font-weight="normal" fill="#193b36">00</text><path d="M110,224 L160,265" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="120" y="275" width="80" height="65" rx="8" fill="#e9f1ea" stroke="none"/><text x="144" y="315" font-family="sans-serif" font-size="20" font-weight="normal" fill="#193b36">01</text><path d="M330,224 L280,265" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="240" y="275" width="80" height="65" rx="8" fill="#e9f1ea" stroke="none"/><text x="264" y="315" font-family="sans-serif" font-size="20" font-weight="normal" fill="#193b36">10</text><path d="M330,224 L380,265" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="275" width="80" height="65" rx="8" fill="#e9f1ea" stroke="none"/><text x="364" y="315" font-family="sans-serif" font-size="20" font-weight="normal" fill="#193b36">11</text><text x="20" y="389" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">図は2分木の概念図（toyは4分木）。</text><text x="20" y="414" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">浅くすると観測を共有できる。</text><text x="20" y="439" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">同じ群の商品の違いは見えなくなる。</text></svg>
