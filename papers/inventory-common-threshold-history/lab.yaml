source_review:
  checked: '2026-11-02'
  url: https://arxiv.org/html/2610.41475v1
  scope: Webで§1.1・Theorem 1.1、§2の単位別費用分解、§3.1〜3.2の方策、§4.1〜4.3、§5を読解。全証明・付録の独立検証は未完。ローカル原本bytes/hashは未取得。
core_idea:
  author_claim: 条件付き確率を正確に求められる在庫モデルで、期待費用の近似保証を2からe/(e−1)へ改善する共通閾値方策を示す。
  research_bot_interpretation: Worth Reading。予測の更新と過去に計算した費用比率の記録を分ける設計が有用。ただし店舗の売上改善や実運用の実証ではなく、仮定を置いた期待費用の保証として読む。
sections:
  overview: 2026年10月30日付のarXiv v1を扱う。以下の計算と図は自作であり、著者コードの再現ではない。
  problem: 今すぐ発注すれば保管費がかかり、待てば未納費がかかる。毎期予測が変わる場合、現在の予測だけで過去の費用比率まで書き換えると、論文が定義する発注規則から外れる。
  method: method.md
  why_it_might_work: 各単位で未納費と保管費の期待値の比率を積み上げ、同じ閾値を使うと、先の単位から順に発注する形を保てる。履歴を保持する規則と閾値の分布の組合せが重要で、単にランダムに発注すれば保証されるわけではない。
  evidence: evidence.md
  executable_understanding: experiment.md
  results: results.jsonは自作需要木の96条件と、閾値分布を積分した期待費用、1期間の5条件を格納する。論文の上界と、この小規模計算の値を区別する。
  what_we_verified: CONFIRMED：有限木の条件付き確率、費用分解、同じ情報に適応する有限DP、閾値の等号、ゼロ分母、再生成の一致。数学的保証の全証明は検証していないため、Mechanism全体はPARTIAL。
  what_we_did_not_verify: 著者コードはNOT OBSERVED。原本ファイルのbytes/hashは未取得。大規模計算、実データの予測推定、計算時間の一般的保証、店舗効果はNOT TESTED。手動ブラウザー・実機の表示確認もNOT TESTED。
  implementation: README.mdのuvコマンドで再生成する。Pythonが条件付き確率と発注を計算し、JavaScriptは保存済み条件を選んで表示する。外部API・乱数による実験・実発注は使わない。
