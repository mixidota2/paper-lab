teaching_figures:
- id: historical-clock
  kind: timeline
  title: 第2期の予測が変わっても、第1期の比率は残す
  after: method
  source: https://arxiv.org/html/2610.41475v1
  locator: §2.1〜2.2、§3.1〜3.2
  rationale: 第1期に分かっていたことと、第2期に新しく分かったことを分けます。
  caption: Labが作成した図です。全期間・全単位に同じ閾値ρを使います。発注した期の費用には、その期の未納費βを加えません。
  rows:
  - label: 開始前
    nodes:
    - title: 全期間で使う閾値ρを1回選ぶ
      text: F(x) = (exp(x)−1)/(e−1)
  - label: 第1期
    nodes:
    - title: 第1期の観測H₁から二つの費用を見積もる
      text: z₁ = β₁/α₁。z₁ ≥ ρなら発注。
  - label: 第2期
    nodes:
    - title: 第2期の観測H₂から第2期の費用を見積もる
      text: z₂ = β₁/α₁ + β₂/α₂。最初の比率はH₁で計算した値を残す。
- id: tight-equations
  kind: equations
  title: 発注する確率を使って、1期間の期待費用を求める
  after: evidence
  source: https://arxiv.org/html/2610.41475v1
  locator: §4.3
  rationale: 需要が起きる確率を下げたとき、費用の倍率がどこまで上がるかを示します。
  caption: 論文の式をLabの図にまとめました。需要が1個になる確率は0<ε<1/2、保管費と未納費は各1です。
  steps:
  - name: 1個発注する確率
    formula: q = F(ε/(1−ε))
    explanation: 保管費の期待値は1−ε、未納費の期待値はεです。累計はこの1期分の比率だけです。
  - name: 発注する場合としない場合の費用を平均する
    formula: E[C_CT] = ε + (1−2ε)q
    explanation: 発注しない場合の期待費用はε、発注する場合は1−εです。それぞれが起きる確率を掛けて足します。
  - name: 同じ情報を使う最適方策と比べる
    formula: E[C_CT] / OPT → e/(e−1)  （ε → 0）
    explanation: 最適方策は発注せず、期待費用はεです。倍率は平均費用同士を比べたもので、1本の需要経路に対する倍率ではありません。
