status: draft
question: |-
  予測が更新されたとき、以前の発注判断に使った費用の比率も計算し直すべきか
summary: |-
  このLabでは、発注を待つと生じる未納費と、今発注すると生じる保管費を1個ずつ比べます。各期に計算した費用の比率を足し、共通の閾値に達したら発注します。過去の比率を残す場合と、予測が変わるたびに計算し直す場合の違いを、合成データで確かめます。
