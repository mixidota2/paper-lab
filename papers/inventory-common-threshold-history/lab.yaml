core_idea:
  author_claim: 著者は、累積需要の条件付き確率が正確に分かるモデルで、共通の閾値を使って発注する方法を提案しました。期待総費用の上限は、同じ情報を使う最適方策の2倍からe/(e−1)倍に改善します。
  research_bot_interpretation: 予測は更新しても、以前の観測情報で計算した費用の比率は残します。この区別が発注判断にどう表れるかが読みどころです。店舗の売上や費用を測った研究ではありません。
sections:
  overview: |-
    著者は、需要が分からない状態で定期的に発注し、在庫を持つ費用と、注文を待たせる費用の合計を抑える方法を提案しました。発注を待つ費用と、先に発注するとかかる費用を商品1個ずつ見積もります。この方法では、何個目の発注にも同じ乱数で決めた閾値を使います。累積需要の条件付き確率を正確に求められ、需要の上限も分かる理論モデルで、期待総費用は最適な発注方法の約1.58倍以下になると証明しました。従来の上限は2倍です。実店舗で費用が減ったという結果ではありません。
  problem: 発注が早いと、商品が売れるまで保管費がかかります。発注が遅いと、注文を受けても商品を届けられず、未納費がかかります。各期の予測を使うとしても、今期の予測で以前の費用まで見積もり直すかどうかで、いつ発注するかが変わります。
  method: method.md
  why_it_might_work: 商品に累積の発注順で番号を付けると、後ろの番号ほど保管費の見積もりは小さくならず、未納費の見積もりは大きくなりません。同じ閾値を使えば、後ろの商品を発注する前に、それ以前の商品も発注の条件を満たします。この性質だけで費用の上限が決まるわけではありません。証明には、過去の比率を残す規則と、閾値を引く確率分布も使います。
  evidence: evidence.md
  executable_understanding: experiment.md
  results: 配布するresults.jsonには、自作の需要木で閾値を固定した96条件の結果と、閾値の分布全体で平均した費用を収録しています。論文に沿って計算した1期間の例は別に5条件あります。どちらの数値も定理の上界そのものではありません。
  what_we_verified: Labは、この有限の需要木で、履歴ごとの条件付き確率、費用を1個ずつ分けて求めた期待値、将来を見ない動的計画法による最適費用を照合しました。費用比率の累計が閾値と等しい場合、分母が0の場合、保存結果を同じコードで再生成できることも確かめました。定理の証明全体は確かめていません。
  what_we_did_not_verify: 著者コードと、原本ファイルのバイト列やハッシュは確認していません。大規模な計算、実データから確率を予測する工程、一般的な実行時間、実店舗での効果は未検証です。画面の動作は自動検査しましたが、実機で手動操作してはいません。
  implementation: README.mdのコマンドで計算をやり直せます。Pythonが条件付き確率と発注量を計算し、JavaScriptは選んだ条件の保存結果を表示します。実験に乱数や外部APIは使わず、実際の発注も行いません。
