  arxiv: https://arxiv.org/abs/2610.41475
verdict: Worth Reading
status: draft
question: 予測が更新されたとき、待つ判断の履歴は残すべきか
summary: 未納を持ち越す費用と、早く発注して保管する費用の比率を、計算時点の情報のまま積み上げます。一度選んだ共通の閾値に達したら発注する規則を、需要の分岐を表す小さな木と1期間の例で追います。
