teaching_figures:
- id: historical-clock
  kind: timeline
  title: 新しい予測は当期の増分に使う
  after: method
  source: https://arxiv.org/html/2610.41475v1
  locator: §2.1〜2.2、§3.1〜3.2
  rationale: 過去の条件付き比率を維持する規則を時系列で示す。
  caption: 自作図。ρは全期間・全単位で共通。停止した期のβは払わない。
  rows:
  - label: 開始前
    nodes:
    - title: ρを一度選ぶ
      text: F(x) = (exp(x)−1)/(e−1)
  - label: 第1期
    nodes:
    - title: H₁でα₁とβ₁を求める
      text: z₁ = β₁/α₁。z₁ ≥ ρなら発注。
  - label: 第2期
    nodes:
    - title: H₂で当期分だけ求める
      text: z₂ = β₁/α₁ + β₂/α₂。左の項はH₁のまま。
- id: tight-equations
  kind: equations
  title: 発注する確率から、1期間の期待費用へ
  after: evidence
  source: https://arxiv.org/html/2610.41475v1
  locator: §4.3
  rationale: 理論上界と1条件の数値の関係を示す。
  caption: 原典の式を自作の説明図にしたもの。0<ε<1/2、保管費と未納費は1。
  steps:
  - name: 閾値に達する確率
    formula: q = F(ε/(1−ε))
    explanation: α=1−ε、β=εなので時計はε/(1−ε)。
  - name: 需要と閾値の両方で平均
    formula: E[C_CT] = ε + (1−2ε)q
    explanation: 発注しない場合の費用εと、発注する場合の費用1−εを確率で重み付けする。
  - name: 同じ情報の最適方策と比較
    formula: E[C_CT] / OPT → e/(e−1)  （ε → 0）
    explanation: OPT=ε。単一の需要経路に対する倍率ではない。
