core_idea:
  author_claim: |-
    著者は、意味と行動から求めた履歴の重みをGFSAで混ぜ、同じ混合比でGRCAの対照損失も調整すると、新商品に足りない行動情報を補いながら、成熟商品の行動に基づく表現を保てると主張する（§3）。
  research_bot_interpretation: |-
    SIDは候補の順位付けにも使える。混合比wは、掲載日数だけで決めず、商品のIDベクトルと統計特徴から学習する。新商品では商品内容の比率を上げたいという設計意図と、全商品で日数に応じた単調な変化を実測したという主張は別だ。
sections:
  problem: |-
    新商品はクリックや購入の履歴が少なく、商品のIDベクトルを十分には学習できない。一方、人気商品は行動の記録が多い。商品内容を強く混ぜると、行動から読み取れる細かな嗜好の違いを弱める場合がある。全商品に同じ混合比を使うと、この違いを反映できない。

    GateSIDが受け取るのは、すでに選ばれた候補商品とユーザー履歴だ。候補商品と履歴のSIDを使ってattentionを計算する。SIDを1トークンずつ生成して候補を探す生成推薦（GR）とは、入出力も遅延の要因も異なる。
  evidence: |-
    ### オフライン評価：何を測り、どの商品を比べたか

    §4.1–4.2・表1。10億件を超える本番ログを時系列で分け、最新日を検証・テストに使う。クリック率（CTR）と、表示からクリックを経て支払いに至る率（CTCVR）の予測を、AUC・GAUCで評価する。掲載20日未満を新商品（cold-start）、300日超を人気商品（popular）とする。AUCの表には0–1で示す値もあるため、百分率のポイント差と相対改善率を分けて読む。

    表2は固定平均、連結してMLPに渡す方式（Concat+MLP）、学習した混合比を使う方式、および混合比の入力を変えた比較。表3–4では画像やテキストから得た表現とSID、attentionの構成、コードブック設定を比べる。表5は全商品に同じ対照整列を掛ける方式と、商品ごとに強さを変えるGRCAの比較だ。これらは順位付けモデルの比較であり、SIDを使えば生成推薦へ移行すべきだという証拠ではない。

    ### オンライン評価：2週間、総トラフィックの20%

    §4.8。著者報告はGMV +2.6%、CTR +1.1%、注文 +1.6%、追加遅延5ms未満。掲載20日未満の新商品群ではGMV +5.6%。この5.6%の分母は新商品群であり、全体のGMVを5.6ポイント押し上げたという意味ではない。原文で確認できるのは総トラフィックの20%を使ったことまでで、それぞれの群に20%ずつ割り当てたとは書かれていない。信頼区間、p値、追加遅延のパーセンタイルは未報告。

    [QuaSID](quasid-collision-qualified-sid.html)は表現の品質、[GLIDE](glide-spotify-sid.html)は新規対象の候補生成を扱う。GateSIDと比べると、商品内容の表現を候補取得に使う場合と、取得済みの候補を採点する場合を比べられる。

    [一次資料：版を固定したPDF](https://arxiv.org/pdf/2603.22916v2)。参照箇所とSHA-256は末尾の対応表に記載した。
  overview: |-
    Alibaba Internationalの研究チームは、クリックや購入の記録が少ない新商品を推薦候補の中でどう順位付けするかを調べました。GateSIDは、商品の画像や説明をもとにした識別子（SID）と、実際の行動から学んだ商品表現を使います。二つの表現で過去の行動を別々に参照し、掲載日数や表示回数などに応じて結果を混ぜます。GateSIDが変えたのは候補の順位付けで、候補を探す方法ではありません。

    総トラフィックの20%を使った2週間のA/Bテストで、著者は従来方式より取引総額（GMV）が全体で2.6%、掲載20日未満の商品に限ると5.6%増えたと報告しています。追加の遅延は5ミリ秒未満でした。ただし、実験したのは一つのECサービスです。商品内容を表す特徴だけを加えた効果ではなく、GateSID全体を導入した結果です。

    <figure class="teaching batch17"><h3>SIDを使う場所：GateSIDは候補の順位付け</h3><div class="matrix-scroll" tabindex="0" role="region" aria-label="比較表"><table><thead><tr><th>設計</th><th>入力</th><th>出力</th><th>SIDの役割</th></tr></thead><tbody><tr><td>GateSID</td><td>ユーザー履歴＋候補商品</td><td>CTR・CTCVRの予測スコア</td><td>候補と履歴の意味特徴</td></tr><tr><td>生成推薦</td><td>ユーザー文脈＋prefix</td><td>次のSIDトークン</td><td>候補を探すために出力する列</td></tr></tbody></table></div><figcaption>§3・図2に基づく役割の比較。SIDを使うだけでは、候補を生成していることにはならない。</figcaption></figure>
  why_it_might_work: |-
    【Labの解釈】内容が近い商品でSIDを共有すると、行動が少ない商品も共有コードブックを更新する勾配を利用できる。GFSAで同じ履歴位置の重みを2種類の履歴に使えば、商品内容側と行動側が別々の位置を参照して生じるずれを減らせる。

    成熟商品では、GRCAの損失に小さいwを掛けると、同じ商品の行動表現を商品内容側の表現に過度に近づけず、行動から得た違いを残しやすい。ただし、行動が少ないときにどの信号が役立つかは商品領域に依存する。wの解釈には、掲載日数だけでなく露出・クリックの偏りも関わる。
  method: method.md
  executable_understanding: |-
    2組のattentionを求める前のスコア（logits）と、両方の履歴のベクトルは固定する。wを0から1まで動かし、混ぜた重みを両方の履歴に適用した結果と、同じwを掛けた対照損失（InfoNCE）を計算する。商品の掲載日数などからwを学習する実験ではない。
  results: |-
    以下はLabの人工実験で計算した値だ。著者がオンラインで報告した数値とは別である。
  what_we_verified: |-
    **Mechanism: PARTIAL**。人工条件で計算手順と境界条件を確認した。results.jsonのchecksでCONFIRMEDとしたのは、各項目に書いた範囲だけだ。

    run.pyで入力を、results.jsonで全出力を確認できる。
  what_we_did_not_verify: |-
    RQ-VAEの学習、wを決めるモデルの学習、CTR・CTCVRの順位付け学習、AUC、本番のGMV、追加遅延の5ms制約は検証していない（NOT TESTED）。この人工実験で確認したのは、固定したwで2組の重みを混ぜる計算であり、本番で新商品の成績が改善するかは確認していない。

    **Performance / Scaling / Production applicability: NOT TESTED**。一次資料の報告値を照合しただけでは、本番の効果を独立して再現したことにはならない。
  implementation: |-
    標準ライブラリだけで動く独立実験だ。リポジトリのルートから `uv run papers/gatesid-coldstart-ranking/run.py` を実行すると、同じフォルダーのresults.jsonを更新する。乱数や外部APIは使わない。

    [実行コード](../downloads/gatesid-coldstart-ranking/run.py)・[全結果](../downloads/gatesid-coldstart-ranking/results.json)・[README](../downloads/gatesid-coldstart-ranking/README.md)・[方法](../downloads/gatesid-coldstart-ranking/method.md)・[対応表](../downloads/gatesid-coldstart-ranking/mapping.md)を保存できる。

    確認した論文とarXivの書誌には、取得できる公式実装への案内を確認できなかった。公式コードを独立して実行していない（NOT TESTED）。非公開だと確認したわけではない。
  mapping: mapping.md
teaching_figures:
- kind: equations
  id: method-equations
  title: 重みを決め、混ぜ、学習に使う式
  after: method
  caption: wを決める式、履歴の重みを混ぜる式、対照損失にwを掛ける式を分けて読む。
  rationale: 同じwでも、履歴の重みを混ぜる役割と、損失に掛ける役割は異なる。
  source: https://arxiv.org/pdf/2603.22916v2
  locator: 式4–11
  steps:
  - name: gate
    formula: w=σ(MLP([e_item ⊕ F_stat]))
    explanation: 候補商品のIDベクトルと、掲載期間・露出・クリックなどの統計特徴からwを学習する。
  - name: GFSA
    formula: S_fused=w S_sid+(1−w)S_item
    explanation: 商品内容と行動から別々に求めた履歴位置の重みを混ぜる。同じ重みを2種類の履歴に掛けて別々に集約する。
  - name: GRCA
    formula: L=L_rank+λ·mean_i[w_i ℓ_cl(i)]
    explanation: 同じ商品の内容と行動の表現を近づける対照損失にも、混合比wを掛ける。商品ごとの重み付き損失を平均して順位付けの損失へ加える。
