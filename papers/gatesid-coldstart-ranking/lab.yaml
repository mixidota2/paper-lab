question: |-
  GateSIDは、購入履歴の少ない商品をどう順位付けするか
summary: |-
  GateSIDは、候補商品のクリックや支払いを予測します。商品内容から作った識別子（SID）と、利用者の行動から学んだ商品IDの表現で、履歴の参照先を別々に求めます。候補の掲載期間や露出などから学んだ比率で、二つの参照先の重みを混ぜます。候補を探す方法ではありません。Alibaba Internationalの著者による2週間のA/Bテストでは、従来方式に比べて取引総額が全体で2.6%、掲載20日未満の商品群で5.6%増え、追加の遅延は5ミリ秒未満でした。実験には総トラフィックの20%を使いました。
