core_idea:
  author_claim: 著者はGFSAで意味側と行動側のattention分布を共有し、同じgateでGRCAの対照整列強度を調整すれば、cold-startを補いつつ成熟商品の協調表現を保てると主張する（§3）。
  research_bot_interpretation: SIDの利点を生成推薦の利点と同一視しない例だ。gateは日数だけの決め打ち関数ではなく、ID embeddingと統計特徴から学習する。新商品に大きいgateが望ましいという設計意図と、全商品で単調なgate曲線が測れたという主張を分ける。
sections:
  problem: '新商品はクリックや購入履歴が少なく、ID embeddingが十分に育たない。一方、人気商品には豊かな協調信号があり、意味表現を強く混ぜると細かな嗜好差を消す場合がある。全商品で固定の融合比を使うことが問題になる。


    GateSIDは候補商品を既に持つranking段で動く。target商品と履歴のSIDを使ってattentionを計算するため、SIDをtokenごとに生成して候補を探すGRとは入出力も遅延要因も異なる。'
  evidence: '### rankingの指標とcohort


    §4.1–4.2・表1。10億超のproduction logsを時間で分割し、最新日をvalidation/testに使う。CTR、CTCVRのAUC/GAUCを評価。cold-startは掲載20日未満、popularは300日超。AUCの表には0–1表記もあり、差のpercentage
    pointと相対liftを混ぜない。


    表2は固定平均、Concat+MLP、gate融合とgate入力のablation。表3–4はmultimodal表現とSID、attention構成、codebook設定の比較。表5は一律の対照整列とGRCAを比較する。これらは「SIDを使えば必ずGRへ移行すべき」という証拠ではない。


    ### オンラインは2週間・総traffic 20%


    §4.8。GMV +2.6%、CTR +1.1%、Order +1.6%、追加遅延5ms未満。掲載20日未満の新商品でGMV +5.6%。新商品効果の分母はそのcohortであり、全体GMVへの5.6ポイント寄与ではない。本文は総trafficの20%と記すが、各armへ20%ずつとまでは記していない。CI、p値、latency
    percentileは未報告。


    [QuaSID](quasid-collision-qualified-sid.html)の表現品質、[GLIDE](glide-spotify-sid.html)のcold-start候補生成と併せて読むと、意味表現をどこで使うかを比較できる。GateSIDの役割は候補にscoreを付ける側である。


    [一次資料：版を固定したPDF](https://arxiv.org/pdf/2603.22916v2)。図表の箇所とSHA-256は末尾の対応表を参照。'
  overview: 'GateSIDはSIDをranking特徴として使い、商品の成熟度に応じて意味と行動のattentionを混ぜる。生成decodeの手法ではない。Alibaba Internationalの2週間・総traffic
    20%のA/BでGMV +2.6%、新商品（20日未満）+5.6%、追加遅延5ms未満を報告する。


    <figure class="teaching batch17"><h3>SIDを使う場所：GateSIDはranking側</h3><div class="matrix-scroll" tabindex="0" role="region"
    aria-label="比較表"><table><thead><tr><th>設計</th><th>入力</th><th>出力</th><th>SIDの役割</th></tr></thead><tbody><tr><td>GateSID</td><td>ユーザー履歴＋候補商品</td><td>CTR
    / CTCVR score</td><td>候補と履歴の意味特徴</td></tr><tr><td>生成推薦</td><td>ユーザー文脈＋prefix</td><td>次SID token</td><td>候補を辿る出力列</td></tr></tbody></table></div><figcaption>§3・図2に基づく役割の比較。SID利用そのものが生成decodeを意味するわけではない。</figcaption></figure>'
  why_it_might_work: '【解釈】意味の近い商品でSIDを共有すると、希少商品も共有codebookへのgradientを使える。GFSAで同じ履歴位置の重みを両表現へ適用すれば、意味と行動が別々の履歴だけを参照するずれを減らせる。


    GRCAをgateで弱めれば、成熟商品の表現を過度に同じ意味clusterへ引き寄せにくい。ただしどの信号がcold-startで有効かは商品領域に依存する。gateの解釈には日数だけでなく露出・クリックの偏りも関わる。'
  method: method.md
  executable_understanding: 固定した2種類のattention logitsと履歴embeddingを使い、wを0から1まで動かす。共有attentionを両履歴へ適用した結果と、同じwで重み付けしたInfoNCEを計算する。成熟度からwを学習した曲線は作らない。
  results: 人工実験の計算値を下に示す。著者のオンライン報告とは別のデータである。
