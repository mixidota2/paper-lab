  source: https://arxiv.org/pdf/2603.22916v2
  locator: 式4–11
  steps:
  - name: gate
    formula: w=σ(MLP([e_item ⊕ F_stat]))
    explanation: ID表現と掲載期間・露出・クリックなどから学習。
  - name: GFSA
    formula: S_fused=w S_sid+(1−w)S_item
    explanation: 同じ分布を両方の履歴表現へ適用する。
  - name: GRCA
    formula: L=L_rank+λ·mean_i[w_i ℓ_cl(i)]
    explanation: 意味の比率と整列の強さを同じgateで制御。
