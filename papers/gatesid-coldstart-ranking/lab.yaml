question: |-
  GateSID：商品情報と行動履歴を候補の順位付けに使う
summary: |-
  GateSIDは、すでにある候補商品のクリックや注文を予測する。商品内容を表す識別子（SID）と行動履歴から、履歴を参照する重みを別々に求める。2組の重みは、商品の掲載期間や露出・クリックなどから学習した比率で混ぜる。候補を生成する手法ではない。Alibaba Internationalの著者は、総トラフィックの20%を使った2週間のA/Bテストで、取引総額（GMV）が全体で+2.6%、掲載20日未満の新商品群で+5.6%、追加遅延は5ms未満だったと報告している。
