core_idea:
  author_claim: |-
    著者は、商品の内容と行動から別々に求めた履歴の重みを混ぜる方法（GFSA）を提案しました。同じ混合比で、学習時に内容と行動の表現を近づける強さも調整します（GRCA）。新商品では少ない行動を商品内容で補い、行動の多い商品では履歴から学んだ違いを残す狙いです。
  research_bot_interpretation: |-
    この方法は、候補を探す段階を変えなくても、順位付けにSIDを使える例です。商品内容をどれだけ重く見るかは、掲載日数だけで決まりません。モデルは候補商品のIDの表現と、露出などの統計を合わせて混合比を求めます。
sections:
  problem: |-
    新商品はクリックや購入の記録が少ないため、行動だけから商品IDの表現を学ぶのは難しくなります。一方、行動が十分に集まった商品では、見た目や説明が似ていても、利用者の選び方の違いを履歴から学べます。商品内容と行動をすべての商品で同じ比率で混ぜると、この違いを扱えません。

    GateSIDは、ほかの仕組みが見つけた候補商品を受け取り、利用者の行動履歴を使って採点します。SIDを使っていても、SIDトークンを順に出して候補を探す方式とは動作が異なります。入力と出力が違うため、同じ遅延を測っているとは限りません。

    <figure class="teaching batch17"><h3>GateSIDは手元の候補を採点し、生成推薦は候補を探す</h3><div class="matrix-scroll" tabindex="0" role="region" aria-label="既存候補の順位付けと候補生成の比較"><table><thead><tr><th>設計</th><th>入力</th><th>出力</th><th>SIDの役割</th></tr></thead><tbody><tr><td>GateSID</td><td>利用者の行動履歴と、取得済みの候補商品</td><td>候補ごとのクリックと支払いの予測値</td><td>候補と履歴に登場した商品の内容を表す特徴量</td></tr><tr><td>生成推薦</td><td>利用者に関する情報と、すでに出力したトークン列</td><td>次のSIDトークン（繰り返して候補を探す）</td><td>候補と対応づける出力の列</td></tr></tbody></table></div><figcaption>論文の§3と図2に基づき、GateSIDの入力と出力を、SIDを順に出す候補生成と比べました。同じSIDでも使う目的が違います。</figcaption></figure>
  overview: |-
    Alibaba Internationalの研究チームは、クリックや購入の記録が少ない新商品を推薦候補の中でどう順位付けするかを調べました。GateSIDは、商品の画像や説明をもとにした識別子（SID）と、実際の行動から学んだ商品表現を使います。二つの表現で過去の行動を別々に参照し、掲載日数や表示回数などに応じて結果を混ぜます。GateSIDが変えたのは候補の順位付けで、候補を探す方法ではありません。

    総トラフィックの20%を使った2週間のA/Bテストで、著者は従来方式より取引総額（GMV）が全体で2.6%、掲載20日未満の商品に限ると5.6%増えたと報告しています。追加の遅延は5ミリ秒未満でした。ただし、実験したのは一つのECサービスです。商品内容を表す特徴だけを加えた効果ではなく、GateSID全体を導入した結果です。
  method: method.md
  why_it_might_work: |-
    内容が近い商品に同じSIDのコードが付くと、順位付けモデルの学習では、それらの商品でコードの埋め込みを共有できます。履歴の少ない商品だけでは十分に更新できない埋め込みも、同じコードを使う別の商品から学べます。

    二つの表現で履歴のどこを参照するかが違っても、GFSAでは、混ぜた後の重みを両方に掛けます。同じ行動をそれぞれの商品表現で読み取れるので、二つの履歴の着目先がずれにくくなります。行動情報が十分な商品では、GRCAの損失に小さい混合比を掛けると、行動から学んだ表現を商品内容へ寄せる力を弱められます。

    ただし、どちらの情報が役立つかは扱う商品によって変わります。混合比には、掲載期間だけでなく露出やクリックの分布も関わります。論文図4は学習した重みの傾向を示すもので、どの商品でも掲載日数に合わせて単調に下がるという規則ではありません。
  evidence: |-
    ### 過去のログでは、新商品と掲載期間の長い商品を分けて比較した

    著者は10億件を超える本番ログを日時で分け、最後の1日を検証とテストに使いました（§4.1）。クリック（CTR）と支払い（CTCVR）の予測について、全体で正例を上に並べる指標（AUC）と、利用者ごとの順位を集計した指標（GAUC）を測りました。表1の「新商品」は掲載20日未満、「人気商品」は掲載300日超です。後者は、売れた数ではなく掲載日数で分けた集団です。

    たとえば表1の支払いのGAUCは、掲載20日未満でGateSIDが0.6306、比較手法で最も高いSaviorRecが0.6297でした。掲載300日超では0.6541と0.6516です。どちらも順位の指標で、注文率ではありません。比較手法に対する差は、掲載300日超の方が大きく出ました。表に載っている0〜1の値をそのまま比べ、指標の差と相対的な改善率を混同しないようにします。

    表2では、著者は二つの表現の混ぜ方として、固定平均、連結してニューラルネットに渡す方法（Concat+MLP）、商品ごとに学習した比率を使う方法を比較しました。比率を決める入力を、商品IDの表現だけ、商品の統計だけ、両方の3通りでも比べました。表3と4では、画像やテキストから直接作った表現とSID、履歴の参照方法、コードの候補数を比べます。表5では、同じ強さで全商品を学習する対照損失と、商品ごとに強さを変えるGRCAを比べました。これらは候補の順位付けの比較です。

    ### 本番では、従来の順位付けと2週間比べた

    総トラフィックの20%を使ったA/Bテストでは、著者は取引総額が全体で2.6%、クリック率が1.1%、注文が1.6%増え、追加の遅延は5ミリ秒未満だったと報告しました（§4.8）。掲載20日未満の商品だけで比べると、取引総額は5.6%増えました。これは、その商品群の取引総額を分母にした変化率で、全体の伸びに5.6ポイント寄与したという意味ではありません。各群への配分、オンライン指標の信頼区間とp値、遅延の何パーセンタイルを測ったかは記載されていません。

    [QuaSID](quasid-collision-qualified-sid.html)は商品表現の品質を、[GLIDE](glide-spotify-sid.html)は新しい対象を候補に入れる方法を扱います。GateSIDとあわせて読むと、同じ商品内容の表現でも、候補を探すときと手元の候補を採点するときでは役割が異なると分かります。

    [一次資料：版を固定したPDF](https://arxiv.org/pdf/2603.22916v2)。確認した節・表とPDFのSHA-256は末尾の対応表にあります。
  executable_understanding: |-
    Labは、3件の行動からなる履歴を用意し、商品内容で照合したときと、行動から学んだ表現で照合したときのスコアを固定します。スライダーで混合比wを0、0.25、0.5、0.75、1から選ぶと、同じ履歴のどこを重く見るかがどう変わるかを確認できます。混ぜた重みは二つの履歴に同じように掛けます。

    Labは固定した正例と負例から対照損失（InfoNCE）を求め、同じwを掛けます。掲載日数やクリックからwを学ぶ工程はありません。
  results: |-
    この表は、Labが人工データで計算した値です。論文のA/Bテストやログで測った予測精度ではありません。
  what_we_verified: |-
    人工データでは、w=0で行動側の重みだけが残り、w=1で商品内容側の重みだけが残ります。途中の値では、混ぜた重みの合計が1になり、対照損失に掛けた分はwに比例して増えました。Labで確かめたのは、これらの式と境界での動作です。入力はrun.py、計算結果と確認範囲はresults.jsonにあります。
  what_we_did_not_verify: |-
    Labは、商品内容をSIDに変えるRQ-VAE、混合比を決めるモデル、クリックと支払いを予測する順位付けモデルを学習していません。本番でのAUCや取引総額、処理規模、追加遅延が5ミリ秒未満だったことも、独立には検証していません。確認したのは人工データで混合比を固定した場合の計算であり、実際の新商品の順位が良くなるとは、この計算だけでは言えません。
  implementation: |-
    標準ライブラリだけで実行できます。リポジトリのルートから `uv run papers/gatesid-coldstart-ranking/run.py` を実行すると、コードと同じフォルダーにresults.jsonを書き出します。乱数や外部APIは使いません。

    [実行コード](../downloads/gatesid-coldstart-ranking/run.py)、[全結果](../downloads/gatesid-coldstart-ranking/results.json)、[実行手順](../downloads/gatesid-coldstart-ranking/README.md)、[手法の説明](../downloads/gatesid-coldstart-ranking/method.md)、[原論文とLabの対応](../downloads/gatesid-coldstart-ranking/mapping.md)を保存できます。

    調べた論文とarXivの書誌には、公式コードを取得できるリンクがありませんでした。Labでは著者のコードを実行していません。コードが非公開と確認したわけではありません。
  mapping: mapping.md
teaching_figures:
- kind: equations
  id: method-equations
  title: 商品ごとの混合比を、履歴の参照と学習に使う
  after: method
  caption: 同じwを使う三つの式です。最初の式がwを決め、次の二つの式がそれぞれ別の処理にwを使います。
  rationale: 履歴のどこを見るかと、二つの商品表現をどれだけ近づけるかを区別します。
  source: https://arxiv.org/pdf/2603.22916v2
  locator: 式4–11
  steps:
  - name: 混合比を求める
    formula: w=σ(MLP([e_item ⊕ F_stat]))
    explanation: 混合比を出すモデルに、候補商品のIDの表現と、掲載期間や露出、クリックの記録を渡します。
  - name: 履歴の参照先の重みを混ぜる（GFSA）
    formula: S_fused=w S_sid+(1−w)S_item
    explanation: 商品内容で求めた重みにw、行動で求めた重みに1−wを掛けて足します。結果を二つの履歴に共通して掛け、それぞれの表現を別に集約します。
  - name: 対照損失にも同じ混合比を掛ける（GRCA）
    formula: L=L_rank+λ·mean_i[w_i ℓ_cl(i)]
    explanation: 学習時、同じ商品の内容と行動の表現を近づける損失にwを掛けます。ここで商品ごとの重み付き損失を平均して順位付けの損失へ加えるとき、λで全体の強さを調整します。
