teaching_figures:
- id: mixed-degree-barriers
  kind: equations
  after: method
  title: 発注が届く順番と、必要な微分の回数
  caption: 式1–2、11–16。発注の影響は、輸送中在庫と手元在庫に同時には現れません。
  source: https://arxiv.org/abs/2609.11817
  locator: §II–III, Equations (1), (2), (11)–(16)
  rationale: 到着の遅れがあるため、手元在庫では発注率が式に現れるまでに2回微分します。
  steps:
  - name: 発注はまず輸送中へ
    formula: dL/dt = u − b_in(L,g)
    explanation: 発注率uが式に直接出ます。輸送中の空きhᴸを1回微分すると、uへの制約を作れます。
  - name: 手元在庫には入荷として届く
    formula: dX/dt = b_in(L,g) − b_out(X,d)
    explanation: この式にuはありません。発注で輸送中在庫Lが変わり、それが手元への入荷に影響するので、もう1回微分します。
  - name: 現在の余裕に到着の勢いを加える
    formula: h₁ = ∇h·f + γh;  h ≥ 0, h₁ ≥ 0
    explanation: 開始時と上限変更時に、今の空きhと変化を含むh₁がともに0以上か確かめます。図の微分式では、作用順序を示すために雑音を省いています。
- id: theory-versus-implementation
  kind: matrix
  after: why_it_might_work
  title: 安全性の定理と、実装で確認すべき条件
  caption: 定理5、§IV-C、表II。連続時間で保証を得るための条件と、離散的な数値実装で起きた違反を比べます。
  source: https://arxiv.org/abs/2609.11817
  locator: Theorem 5, §IV-A–C, Table II
  rationale: 違反率0.815を、定理で保証が成立する条件と区別して読みます。
  columns:
  - 理論の条件
  - 実装・評価での確認点
  rows:
  - label: 時間
    cells:
    - 連続時間の状態制約
    - 週次のEuler–Maruyama離散化
  - label: 予算切替
    cells:
    - 切替後の上限でもhとh₁がともに0以上
    - 現在の容量内という条件だけでは足りない
  - label: 集計制約
    cells:
    - バリア不等式を満たす制御
    - QPではs_aで集計上限を罰則付きで緩める
  - label: 観測値
    cells:
    - 定理の前提充足は別途確認が必要
    - 手元容量の違反率0.815、M1=0.050
