teaching_figures:
- id: mixed-degree-barriers
  kind: equations
  after: method
  title: 発注が届く順番と、必要な微分の回数
  caption: 原論文の式1–2、11–16を整理。輸送中と手元で同じ次数のバリアを使わない。
  source: https://arxiv.org/abs/2609.11817
  locator: §II–III, Equations (1), (2), (11)–(16)
  rationale: 入荷の遅れから相対次数2が必要になる理由を式で追う。
  steps:
  - name: 発注はまず輸送中へ
    formula: dL/dt = u − b_in(L,g)
    explanation: uが直接現れる。輸送中の余裕hᴸを1回微分すれば、発注の制約を作れる。
  - name: 手元在庫には入荷として届く
    formula: dX/dt = b_in(L,g) − b_out(X,d)
    explanation: uはまだ現れない。Lの変化を通じて作用するため、もう1回微分する。
  - name: 現在の余裕に到着の勢いを加える
    formula: h₁ = ∇h·f + γh;  h ≥ 0, h₁ ≥ 0
    explanation: 2つの初期条件が必要。予算切替時にも新しい集合で確認する。雑音項は上の作用順序の説明では省略した。
- id: theory-versus-implementation
  kind: matrix
  after: why_it_might_work
  title: 安全性の定理と、実装で確認すべき条件
  caption: 定理5と§IV-C、表IIを対応させる。連続時間の主張を数値結果へ無条件に移さない。
  source: https://arxiv.org/abs/2609.11817
  locator: Theorem 5, §IV-A–C, Table II
  rationale: 保証の前提と違反率0.815を同じ画面で読めるようにする。
  columns:
  - 理論の条件
  - 実装・評価での確認点
  rows:
  - label: 時間
    cells:
    - 連続時間の状態制約
    - 週次のEuler–Maruyama離散化
  - label: 予算切替
    cells:
    - 切替後の拡張安全集合に入る
    - 現在の容量内という条件だけでは足りない
  - label: 集計制約
    cells:
    - バリア不等式を満たす制御
    - QPに緩和変数s_aを入れる
  - label: 観測値
    cells:
    - 定理の前提充足は別途確認が必要
    - 手元容量の違反率0.815、M1=0.050
