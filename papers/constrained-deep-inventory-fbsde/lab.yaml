summary: 手元に空きがあっても、輸送中の商品が届くと容量を超える場合があります。到着の遅れを発注計算に組み込む方法と、著者の50商品実験で充足率0.562、手元容量の違反率0.815だった結果を読みます。
question: 倉庫の今の在庫が容量内でも、到着待ちの商品があると発注の判断はどう変わるか。
verification:
  mechanism: PARTIAL
