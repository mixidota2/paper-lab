teaching_figures:
- id: mixed-degree-barriers
  kind: equations
  after: method
  title: 発注が輸送中と手元の在庫に伝わる順番
  caption: 原論文の式(1)・(2)、(11)〜(16)に基づきます。順番を示すため、図の微分式から雑音は外しています。
  source: https://arxiv.org/abs/2609.11817
  locator: §II〜III、式(1)・(2)、(11)〜(16)
  rationale: 発注率が在庫の変化の式に現れるまでに必要な微分回数を比べます。
  steps:
  - name: 発注で輸送中の在庫が増える
    formula: dL/dt = u − b_in(L,g)
    explanation: 発注率uは輸送中在庫の変化に直接出ます。輸送中の空きを1回微分すると、発注率に対する条件を作れます。
  - name: 入荷で手元の在庫が増える
    formula: dX/dt = b_in(L,g) − b_out(X,d)
    explanation: 手元在庫には入荷と販売が影響します。式をもう一度微分すると、輸送中在庫を通して発注率が出ます。
  - name: 空きと、空きが減る速さを確かめる
    formula: h₁ = ∇h·f + γh;  h ≥ 0, h₁ ≥ 0
    explanation: 初期と上限の切り替え時は、今の空きhと、その変化を含むh₁がともに0以上かを確かめます。
- id: theory-versus-implementation
  kind: matrix
  after: why_it_might_work
  title: 定理の条件と、実装で許す違反
  caption: 定理3・5は条件を満たす連続時間の制御を扱います。表IIは週単位で計算した実験の結果です。
  source: https://arxiv.org/abs/2609.11817
  locator: 定理3・5、§IV-A〜C、表II
  rationale: 発注計算に解があることと、元の容量を守ることを区別します。
  columns:
  - 定理が扱う条件
  - 著者の実装と評価
  rows:
  - label: 時間
    cells:
    - 各時点で状態と制御の条件を守ることを前提にします。
    - Euler–Maruyama法で週単位に区切ります。
  - label: 上限の切り替え
    cells:
    - 切り替え後の条件でもhとh₁がともに0以上であることを求めます。
    - 今の在庫が新しい容量内というだけでは足りません。
  - label: 集計枠と発注上限
    cells:
    - バリア不等式を守る制御を想定します。
    - 集計枠はs_a、発注上限はs_uで緩め、商品ごとの発注下限は緩めません。
  - label: 手元容量の評価
    cells:
    - 定理の前提を各経路で満たすかは、別に確かめる必要があります。
    - 違反率は0.815、違反なしも含む容量に対する平均超過量M1は0.050でした。
