core_idea:
  author_claim: 著者は、店の状態をすべては見られないエージェントが、あとから届く情報に合わせて判断を変えられるか調べました。判断前の情報収集、目に見えやすい条件だけで選ぶ傾向、以前の判断の追跡を分けて調べています。
  research_bot_interpretation: RetailBenchは、運営中にLLMが複数の業務を判断する試験です。設計時に発注方策を探すInvEvolveや、設計後に固定した方策で在庫を制御するSabreAgentとは、LLMの役割と評価単位が異なります。
sections:
  overview: |-
    RetailBenchの著者は言語モデルにシミュレーター内の1店舗を任せ、何日間営業を続けられるかを調べました。エージェントは価格、補充する量、棚に並べる商品、仕入先を決めます。ある日の判断は後日の売上、返品、資金繰りに影響します。

    著者は7つのモデルそれぞれで、営業を続けた日数を優先して試行を1つ選びました。上限の180日まで営業できたのはGPT-5.5とDeepSeek-V4-Proです。選ばれた試行で最も高かった純資産はGPT-5.5の24,350.98で、シミュレーターの内部情報を使えるルール方式の131,510.42の約19%でした。これらは選んだ試行の値で、各モデルの平均や実店舗の成績ではありません。
  problem: |-
    著者はDominick’sの小売データをもとに、96商品・20カテゴリを設定しました。各商品に仕入先が5社あり、棚に置ける商品は40種類、店に置ける在庫は15,000個までです。初期現金は30,000、家賃は1日600で、どちらもシミュレーター内の通貨単位です。

    エージェントは需要やニュースの影響を直接知ることができないため、照会ツールで在庫や販売、仕入先の条件などを調べます。価格、発注、棚をその日に変えると、後日の販売・返品・現金が変わります。
  why_it_might_work: |-
    仕入れ値が安くても、返品が増えると、その後の返金で収入が減ります。棚に商品を置かなければ、販売機会がなくなります。売れない日にも家賃はかかります。このシミュレーターでは、こうした効果を時間がたった後まで追えます。ただし、行動と成績が一緒に変わっても、個々の行動だけの影響は分かりません。
  evidence: |-
    [一次資料（原論文v3）の表1](https://arxiv.org/html/2603.16453v3)では、比較用のOracle Policyの最終純資産は131,510.42、累積販売数量は267,998個でした。選ばれたLLM試行ではGPT-5.5（ReAct）の純資産24,350.98が最も高く、DeepSeek-V4-Pro（Plan-and-Act）の販売数量164,417個が最多でした。販売数量は売れた個数で、売上金額ではありません。2モデルは180日まで営業し、Kimi-K2.6は130日、残る4モデルは58〜73日で終了しました。

    著者はモデルごとに、利用できる実行方式での有効な試行から1件を選びました。営業日数を優先し、同じ日数なら最終純資産、そこも同じなら累積販売数量で比べます。全試行を平均した結果ではありません。費用の制約で、GPT-5.5にはReActだけを使いました。Oracle PolicyはLLMには見えない情報を使えるルール方式で、LLMと同じ観測条件でも、実現できる成績の厳密な上限でもありません。

    §5.2で全LLM試行の発注明細を集計すると、同じ商品の候補のうち品質が最も高い仕入先を選んだ割合は21.5%、価格が最も低い先を選んだ割合は55.6%でした。この2つは別々の指標です。LLMは品質を直接確認できず、返品率や顧客評価を手掛かりにします。著者は1日に対象とした商品を、選ばれたLLM試行で0.95〜7.89種類、Oracle Policyで38.00種類と報告しました。本文5.3節は照会と操作の両方、付録A.5の式(20)は状態を変えた操作だけと説明しており、照会だけの商品の扱いは記述が揃っていません。売れた種類数や個数とは別の指標です。
  executable_understanding: |-
    操作図では価格・潜在需要・家賃・初期現金・期間をそろえ、仕入先A・Bの原価と返品率を変えられます。現金が負になっても計算を続ける基本会計と、手元資金の範囲で仕入れるモードがあります。仕入れの支払い・販売・返金・家賃のうち、どこで日末現金に差が出たかを明細で読めます。
  results: |-
    旧固定例で1日8商品を扱うと、30日後の現金は安値の仕入先が−7,800、低返品率の先が−4,200です。1日38商品では19,200と36,300になります。返品を見込んだ1個あたりの粗利が3と4.5で異なるためです。現金が負でも計算を続けるので、営業を続けられた日数とは区別します。

    仕入先AとBを入力する図では、初期条件で30日進めると、残る現金はAが3,000、Bが12,000です。Bの返品率を20%にすると同額になります。現金で買える数が限られるモードでは、粗利が高い仕入先でも購入数が少なく、日末現金が低くなる条件があります。いずれも、この人工例の条件で期待値を使って計算した結果です。
  what_we_verified: |-
    Labは旧固定例の収支、手計算との同点境界の一致、条件を変えたときの順位の逆転を確かめました。手元現金で買える上限、停止後は取引がないこと、価格や販売数が0の場合、同じ条件の仕入先で全期間の結果が一致することも確認しました。検証したのは簡易会計です。公式シミュレーターの運営は再実行していません。
  what_we_did_not_verify: |-
    公式環境でLLMに180日間運営させる試験は再実行していません。納期・賞味期限・ニュース・隠れた需要・棚での商品代替も検証していません。大きな店舗でも同じ結果になるか、実店舗の利益がどう変わるかは分かりません。Labは実店舗でのA/Bテストや、棚割りを無作為に変えた比較ではありません。
  implementation: |-
    Pythonの `evaluate()` とブラウザの `model.js` は同じ会計を計算します。基本会計は手元現金による発注上限がありません。手元資金モードは前払い・即日納品で、日末の現金が初めてマイナスになると、翌日から営業を止めます。付録A.4のOracle Policyの停止条件は負の現金を10日連続で記録することです。`main()` は著者報告を `reported`、旧固定例の日ごとの結果を `frames`、仕入先比較を `reference` に保存します。
  mapping: |-
    mapping.md
  method: |-
    method.md
