core_idea:
  author_claim: データに基づく部分観測の店舗環境で、長期の一貫した意思決定を評価する。不完全な情報収集、表面的な判断、継続する方策の欠如という3種の失敗を診断する。
  research_bot_interpretation: 研究地図では「運用中に複数の店舗業務を操作するLLMの評価」に置く。InvEvolveの設計時の発注方策探索や、SabreAgentの設計後に固定する在庫制御とは、LLMの役割も評価単位も異なる。
sections:
  overview: RetailBenchは、価格・補充・棚・仕入先・資金繰りを180日間つなぐ店舗運営の評価環境である。LLMの最良選択実行でも、最終純資産は特権情報を使うOracle Policyの約19%だった。個々のツール操作が正しくても、店を続けられるとは限らない。
  problem: Dominick’sの実データを基に96商品・20カテゴリを構成する。各商品には5仕入先があり、棚は40商品、在庫容量は15,000個。初期資金30,000、家賃は1日600である。需要やニュースの内部効果は隠され、エージェントは照会ツールで状態を調べる。価格変更、発注、棚の変更が、その後の販売・返品・現金残高に影響する。
  why_it_might_work: 解釈：仕入れの安さだけを選ぶと、返品による将来の収入減を見落とす。棚へ載せない商品は販売機会を失い、売れない日も家賃はかかる。こうした遅れて現れる結果を同じ環境で測れる点に価値がある。行動診断と成績の関連は、各失敗要因の因果効果を単独で証明するものではない。
  evidence: '一次資料の著者報告（v3 Table 1）：Oracle Policyは純資産131,510.42、販売数量267,998。GPT-5.5 ReActは純資産24,350.98でLLM中の最高値、DeepSeek-V4-Pro
    Plan-and-Actは販売数量164,417で最高値だった。販売数量の単位は個で、売上金額ではない。両モデルは180日を完走し、Kimi-K2.6は130日、残る4モデルは58〜73日で終了した。


    各モデルにつき、利用可能な枠組みから生存日数を優先し、同点なら純資産、販売数量の順で選んだ実行を掲載する。全実行の平均ではない。GPT-5.5は費用の制約でReActのみ。Oracleは隠れた情報を使う非LLMの参照方策であり、同じ観測条件のエージェントではない。


    §5.2・§5.3・Figure 3の診断では、全LLM実行の平均QualityFirstは21.5%、PriceFirstは55.6%。行動対象商品数は1日0.95〜7.89商品で、Oracleの38.00商品から離れている。この商品数は販売された商品数とも異なる。'
  executable_understanding: 同じ価格・潜在需要・家賃・初期現金・日数で、仕入先A/Bの原価と返品率だけを独立に変えます。基本会計と、手元資金で仕入れるモードを切り替え、日別台帳で差の生じる場所を追ってください。品質という名前で勝者は決まりません。
  results: 人工例で1日8商品を扱うと、30日後の現金はPriceFirstが−7,800、QualityFirstが−4,200。38商品なら19,200と36,300になる。安い仕入先との差は返品後の単位粗利3対4.5から生じる。負の現金でも計算を続けるため、生存日数の再現には使えない。
    新比較の初期条件ではAの30日後現金は3,000、Bは12,000。Bの返品率を20%にすると同点になる。これらは明示した期待値会計だけの結果である。
  what_we_verified: CONFIRMED：旧固定例の収支検査に加え、手計算の同点境界、順位逆転、資金上限、停止後無取引、ゼロ販売・ゼロ価格、同一仕入先の全軌跡一致を局所検査する。MechanismはPARTIAL。公式シミュレータと実ブラウザの操作はNOT
    TESTED。
  what_we_did_not_verify: Performance / Scaling / Production applicabilityはNOT TESTED。公式環境、LLM、180日運営、納期、賞味期限、ニュース、隠れた需要、棚内の代替効果は再実行していない。実店舗のA/Bテストや棚割りの無作為化比較試験でもない。単一の固定環境で選んだ実行から、モデル一般の平均成績や現場の利益を予測しない。
  implementation: evaluate()とmodel.jsが同じ局所会計を実行する。基本会計は借入無制限、資金制約モードは前払い・即日納品とし、現金が負になった日末で停止する。これは付録A.4のOracleが10日連続の負現金で停止する規則とは異なる。main()は著者報告reported、旧固定例frames、新比較referenceを分離して保存する。
  mapping: mapping.md
  method: method.md
