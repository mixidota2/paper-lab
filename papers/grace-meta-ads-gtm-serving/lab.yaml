    explanation: 配下の条件を一つのmatcherへまとめる。
  - name: 要求別の候補token
    formula: pass(p,u) = 1[(mask(p) AND mask(u)) = mask(u)]
    explanation: 近似検査と、IDがカタログ上で有効かを調べるCDの両方を通る枝を残す。
  - name: k-way
    formula: passₖ(p,u) = ORⱼ pass(partitionⱼ(p),u)
    explanation: 分割した先でも、どの条件を同じ広告が満たすかは分からない。分割すると条件の照会回数も増える。
