  title: 途中の枝を残す照合と、広告ごとの判定は別
  after: method
  locator: §4.1–4.3
  rationale: 途中の枝を残す照合と、広告ごとの判定は別
  caption: 式は国や年齢をビットで表す部分です。広告ごとの最終照合は式に含めていません。
  source: https://arxiv.org/pdf/2608.00938v1
  steps:
  - name: 集約
    formula: mask(p) = ORₐ∈A(p) mask(a)
    explanation: その枝からたどれる広告のビットを一つにまとめます。
  - name: リクエストごとに次の候補を選ぶ
    formula: pass(p,u) = 1[(mask(p) AND mask(u)) = mask(u)]
    explanation: カタログに存在し、利用者に必要な全ビットを持つ枝を残します。
  - name: 枝の中をさらに分ける
    formula: passₖ(p,u) = ORⱼ pass(partitionⱼ(p),u)
    explanation: 一つでも照合を通るグループがあれば枝を残します。どの条件が同じ広告に属するかは分からず、グループを増やすと照会も増えます。
