core_idea:
  author_claim: Metaの著者は、広告を表す識別コードの候補を伸ばすたびに、カタログ内に実在するかと、配信条件を満たす可能性があるかを調べます。それとは別に、同じ利用者の情報を複数の候補が参照するようにGPUの処理を組み直します。
  research_bot_interpretation: '[STATIC](static-constrained-gr.html)や[FlashTrie](flashtrie-gpu-beam.html)と読み比べると、カタログにある候補だけを生成すること、今回配信できる広告に絞ること、生成を速くすることを別々に評価できます。'
sections:
  overview: |-
    Metaの著者は、広告候補を生成する途中で、広告主が指定した配信条件を使って候補を絞る方法を提案しました。GRACEは同じ識別コードの先頭を持つ広告の配信条件をまとめ、該当する広告がない枝は生成の途中で除きます。残った候補は広告ごとに条件を確認します。実在する広告だけを生成できる既存の制約と比べ、最終的に配信条件を満たした候補の割合は23.55%から40.42%に上がりました。著者は3,000万件の識別コードを使いましたが、利用者の位置には人工データを使っています。通過率は、広告を見た人の反応や売上を測った値ではありません。

    著者はGPUの生成処理も見直しました。候補数を固定した測定では、生成ループのP99が197.7ミリ秒から17.8ミリ秒に下がりました。候補数を途中で変え、配信条件の照会なども加えた別の測定では、推論全体のP99は53.6ミリ秒でした。前者の17.8ミリ秒は、配信条件の確認を含む推論全体の時間ではありません。
  problem: |-
    広告主は、国や年齢などで広告を配信する相手を指定できます。生成モデルが実在する広告のコードだけを出しても、そのときの利用者に配信できる広告が残るとは限りません。広告を生成し終えてから配信条件を確かめると、限られた候補枠を配信できない広告に使います。

    途中のコードからたどれる広告の条件を一つにまとめると、少ない計算で照合できます。ただし、国の条件を広告Aが満たし、年齢の条件を広告Bが満たす場合にも、まとめた条件には両方が含まれます。GRACEはこの照合で候補を絞りますが、最後に広告を一件ずつ調べる処理は残します。
  method: method.md
  why_it_might_work: |-
    生成中に配信できる広告がない枝を外せば、同じ候補数の上限でも、配信できる広告へつながる別の枝を試せます。一方、一つの枝に広告を集めすぎると、ほぼすべての条件が枝に登録され、照合で候補が減らなくなります。枝を細かく分けると、今度は照合が増えます。著者は、枝に含まれる条件の多さだけでなく、最後に通った広告の割合と処理費用も比べました。
  evidence: |-
    ### 最終検査を通った広告の割合

    著者は3,000万件のSIDを対象に、カタログにあるコードだけを生成する方式（CD）と、配信条件も途中で照合する方式（CD＋GTM）を比べました。利用者の特徴はモデルの評価データを使い、位置は1人あたり64件をランダムに置きました。生成したコードを広告へ展開し、CPU側で広告ごとに条件を確認します。表3で、全リクエストの通過率は23.55%から40.42%に上がりました。差は16.87パーセントポイントです。配信条件の判定を通った広告の割合であり、クリック率や売上を測った値ではありません。

    リクエストごとの広告数で分けた行を読む場合は、区分にも注意が要ります。著者は最終検査の前に残った広告数で区分していますが、GTMを加えると生成されるコードが変わるので、同じ利用者が同じ区分に入るとは限りません。静的に分割した方式の全体通過率は40.27%、動的に分割した方式は40.45%でした。未分割の40.42%に対する大きな改善は見られず、著者は照会や保存の費用も考えて未分割を選びました。

    ### どこまで含めて時間を測ったか

    表6では、NVIDIA GH200で16リクエストをまとめて処理しました。各段階の候補数をそろえた比較では、生成ループのP99（99%の処理がその時間内に終わる値）が197.7ミリ秒から17.8ミリ秒に下がりました。同じ比較で推論全体のP99は220.1ミリ秒から40.5ミリ秒に下がりました。これらの測定にGTMのすべての処理は入りません。

    これとは別に、生成の段階ごとに候補数を変え、配信条件の照会と照合を加えた設定では、生成ループのP99が27.3ミリ秒、推論全体のP99が53.6ミリ秒でした。表6でいう推論全体には入力から広告ごとの最終照合までが入ります。著者は、処理の前に16件がそろうまで待つ時間を約30ミリ秒とし、別枠で扱っています。特定の注意計算だけを測った68.0倍や23.4〜25.8倍は、推論全体が速くなった倍率ではありません。

    [一次資料：GRACEの論文 §6、表2〜6](https://arxiv.org/html/2608.00938v1#S6)。
  executable_understanding: |-
    Labは4件の広告に国と年齢の配信条件を与えます。読む順番を決めるスコアと、残せる枝の上限2本をそろえ、配信条件を途中で使うかだけを変えます。「利用者の国と年齢」の選択欄では、枝をまとめて調べた結果と、広告ごとの最終照合を見比べられます。
  results: |-
    合成例で米国の成人を選ぶと、途中で配信条件を使わない探索では、最後の照合を通った広告は0件でした。途中でも条件を調べると、配信できる広告cの枝を残せたため、最後の照合を通った広告は1件でした。

    別の枝には、米国の若年層向け広告と、カナダの成人向け広告があります。枝に登録した条件だけを見ると、米国の成人にも配信できそうに見えます。しかし広告を一件ずつ確認すると、どちらも対象外です。Labが8ビットに縮めたブルームフィルターでも、登録していない場所が照合を通る例を確認しました。
  what_we_verified: |-
    合成例の4種類の利用者について、配信できる広告を含む枝が、ビットをまとめた照合を通ることを確認しました。広告ごとに調べると対象外になる枝や、通過する広告が0件から1件に変わる例も記録しました。論文の仕組みの一部を確認した検査です。
  what_we_did_not_verify: |-
    Labは、著者のGPUコード、キャッシュ、実際の配信条件やリクエストを使っていません。論文の通過率や推論時間を再測定していません。広告の表示、クリック、売上、費用が変わるかも検証していません。
  implementation: |-
    Python標準ライブラリだけで動きます。`run.py` を保存した場所で `python3 run.py` を実行すると、同じ場所に `results.json` を書き出します。`union()` は広告の条件を枝ごとにまとめ、`match()` は利用者に必要なビットがそろうかを確認します。`bloom()` はSHA-256で求めた3つの位置を使う説明用の関数です。論文の実装と同じハッシュ方式を使ったわけではありません。
  mapping: mapping.md
