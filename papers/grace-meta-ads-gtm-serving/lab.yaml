question: 広告の候補を作る途中で、今回の条件で配信できるかをどう調べるか
summary: Metaの著者は、広告候補を生成しながら配信条件を調べました。最後に広告を一件ずつ確認したところ、条件を満たした広告の割合は23.55%から40.42%に上がりました。著者はGPUで候補を生成する処理も見直しました。候補数を固定して測った17.8ミリ秒と、配信条件の照合を含む推論全体の53.6ミリ秒は、測った範囲が異なります。
