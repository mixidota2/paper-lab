<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 648" role="img" aria-labelledby="title desc"><title id="title">どの試行を次の基準にするか</title><desc id="desc">中央の担当が案を検討、実装、学習、評価する。主指標と補助指標が条件を満たす場合だけ、変更を残す。</desc><rect x="0" y="0" width="440" height="648" rx="16" fill="#f4f7f6"/><g font-family="sans-serif"><text x="22" y="34" font-size="21" fill="#163b40">どの試行を次の基準にするか</text><text x="22" y="59" font-size="14" fill="#163b40">GoogleのRecEvolve（Algorithm 1）</text><rect x="20" y="82" width="400" height="74" rx="9" fill="#dfede8"/><text x="32" y="111" font-size="17" fill="#163b40">仮説を出し、試す価値を検討する</text><text x="32" y="137" font-size="15" fill="#163b40">中央の担当が実験の履歴を渡す</text><path d="M220 158 V173 M215 168 L220 173 L225 168" fill="none" stroke="#628287" stroke-width="2" stroke-linecap="round"/><rect x="20" y="176" width="400" height="74" rx="9" fill="#dfede8"/><text x="32" y="205" font-size="17" fill="#163b40">変更して学習前に確認する</text><text x="32" y="231" font-size="15" fill="#163b40">確認に通らなければ変更前へ戻す</text><path d="M220 252 V267 M215 262 L220 267 L225 262" fill="none" stroke="#628287" stroke-width="2" stroke-linecap="round"/><rect x="20" y="270" width="400" height="74" rx="9" fill="#dfede8"/><text x="32" y="299" font-size="17" fill="#163b40">分散クラスタで候補を学習する</text><text x="32" y="325" font-size="15" fill="#163b40">失敗したらログから学び、変更前へ戻す</text><path d="M220 346 V361 M215 356 L220 361 L225 356" fill="none" stroke="#628287" stroke-width="2" stroke-linecap="round"/><rect x="20" y="364" width="400" height="74" rx="9" fill="#dfede8"/><text x="32" y="393" font-size="17" fill="#163b40">主指標と補助指標を確かめる</text><text x="32" y="419" font-size="15" fill="#163b40">主指標は必要な幅を超え、補助指標は下限以上</text><path d="M220 441 V455 H115 V466 M220 455 H324 V466" fill="none" stroke="#628287" stroke-width="2" stroke-linecap="round"/><rect x="20" y="468" width="193" height="100" rx="9" fill="#c9e7db"/><rect x="226" y="468" width="194" height="100" rx="9" fill="#f3e3d3"/><text x="32" y="496" font-size="16" fill="#163b40">両方を満たす</text><text x="32" y="522" font-size="15" fill="#163b40">採択して変更を記録</text><text x="32" y="548" font-size="15" fill="#163b40">新しい構成を基準にする</text><text x="238" y="496" font-size="16" fill="#163b40">どちらかが不足</text><text x="238" y="522" font-size="15" fill="#163b40">採択しない</text><text x="238" y="548" font-size="15" fill="#163b40">変更前の基準に戻す</text><path d="M115 572 V590 H324 V572" fill="none" stroke="#628287" stroke-width="2" stroke-linecap="round"/><text x="30" y="620" font-size="17" fill="#163b40">結果を残し、次の仮説を試す</text></g></svg>
