<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 460" role="img" aria-labelledby="title desc"><title id="title">スコアを変えずに負例だけ減らす</title><desc id="desc">候補8,000件と1,000件で、同じ正例とスコアを使う。負例を減らすと正例は上がりやすくなる。点は個々の候補を示すものではない。</desc><rect x="0" y="0" width="440" height="460" rx="16" fill="#f4f7f6"/><g font-family="sans-serif"><text x="22" y="34" font-size="21" fill="#163b40">スコアを変えずに負例だけ減らす</text><text x="22" y="59" font-size="14" fill="#163b40">Labの人工例。正例は両方で同じ。</text><rect x="20" y="84" width="400" height="104" rx="9" fill="#e5e9f0"/><text x="32" y="111" font-size="16" fill="#163b40">候補8,000件：正例1件と負例7,999件</text><circle cx="40" cy="134" r="4" fill="#6f839c"/><circle cx="61" cy="134" r="4" fill="#6f839c"/><circle cx="82" cy="134" r="4" fill="#6f839c"/><circle cx="103" cy="134" r="4" fill="#6f839c"/><circle cx="124" cy="134" r="4" fill="#6f839c"/><circle cx="145" cy="134" r="4" fill="#6f839c"/><circle cx="166" cy="134" r="4" fill="#6f839c"/><circle cx="187" cy="134" r="4" fill="#6f839c"/><circle cx="208" cy="134" r="4" fill="#6f839c"/><circle cx="229" cy="134" r="4" fill="#6f839c"/><circle cx="250" cy="134" r="4" fill="#6f839c"/><circle cx="271" cy="134" r="4" fill="#6f839c"/><circle cx="292" cy="134" r="4" fill="#6f839c"/><circle cx="313" cy="134" r="4" fill="#6f839c"/><circle cx="40" cy="157" r="4" fill="#6f839c"/><circle cx="61" cy="157" r="4" fill="#6f839c"/><circle cx="82" cy="157" r="4" fill="#6f839c"/><circle cx="103" cy="157" r="4" fill="#6f839c"/><circle cx="124" cy="157" r="4" fill="#6f839c"/><circle cx="145" cy="157" r="4" fill="#6f839c"/><circle cx="166" cy="157" r="4" fill="#6f839c"/><circle cx="187" cy="157" r="4" fill="#6f839c"/><circle cx="208" cy="157" r="4" fill="#6f839c"/><circle cx="229" cy="157" r="4" fill="#6f839c"/><circle cx="250" cy="157" r="4" fill="#6f839c"/><circle cx="271" cy="157" r="4" fill="#6f839c"/><circle cx="292" cy="157" r="4" fill="#6f839c"/><circle cx="313" cy="157" r="4" fill="#6f839c"/><circle cx="359" cy="149" r="8" fill="#23705e"/><rect x="20" y="202" width="400" height="104" rx="9" fill="#dfede8"/><text x="32" y="229" font-size="16" fill="#163b40">候補1,000件：正例1件と負例999件</text><circle cx="40" cy="252" r="4" fill="#6f839c"/><circle cx="61" cy="252" r="4" fill="#6f839c"/><circle cx="82" cy="252" r="4" fill="#6f839c"/><circle cx="103" cy="252" r="4" fill="#6f839c"/><circle cx="124" cy="252" r="4" fill="#6f839c"/><circle cx="145" cy="252" r="4" fill="#6f839c"/><circle cx="166" cy="252" r="4" fill="#6f839c"/><circle cx="359" cy="267" r="8" fill="#23705e"/><path d="M220 190 V201 M215 196 L220 201 L225 196" fill="none" stroke="#628287" stroke-width="2" stroke-linecap="round"/><text x="22" y="345" font-size="17" fill="#163b40">負例が減ると、正例の順位は上がり得る</text><text x="22" y="378" font-size="14" fill="#163b40">大きな緑の点は正例、灰色の点は負例の模式図。</text><text x="22" y="401" font-size="14" fill="#163b40">点の数や間隔は、候補数やスコアを表さない。</text><text x="22" y="438" font-size="14" fill="#163b40">論文では人間が比較条件の変化に気づき、元に戻した。</text></g></svg>
