core_idea:
  author_claim: GoogleのRecEvolveは中央の担当が最良構成と実験履歴を持ち、仮説の発案、レビュー、実装を専門の担当に振り分けます。主指標と補助指標を確認し、両方の条件を満たした変更だけを次の基準にします。
  research_bot_interpretation: コードを元に戻す機能だけでは、評価の難しさが変わったことは見抜けません。比較の前に、同じ問題を同じ採点方法で解いたかを確かめる必要があります。論文の別の試行では、人間がバッチ縮小による評価条件の変化を見つけて変更を戻しました。候補の照合まで自動でできた事例とは扱いません。
sections:
  overview: |-
    Googleの研究チームは、本番で使うコンテンツ推薦の候補検索モデルを改良する方法としてRecEvolveを提案しました。対象は利用者とコンテンツの特徴を別々に計算する二塔型モデルです。中央の担当が仮説の作成、レビュー、実装、学習と評価をつなぎ、主指標と補助指標の条件を満たした変更だけを次の基準にします。

    著者は5系列を並行して約2日で41件を試しました。複数の変更を積み重ねた最終構成では、オフラインの上位50件の順位の指標（NDCG@50）が0.4796から0.5751に上がりました。著者は、本番の比較で満足度の指標も従来モデルより3.77%増えたと報告しました。別の探索では、正例と比べる候補が減ったために指標が上がり、人間がその変化に気づきました。その試行は元に戻し、最終構成の改善には含めていません。
  method: method.md
  problem: |-
    コンテンツ推薦の二塔型モデルには、候補ごとの点の差をどれだけ効かせるか、どんな視聴を重く扱うか、特徴をどう組み合わせるかなど、変更できる箇所があります。著者の実験では1回の学習に3時間以上かかりました。人間だけで案を出して順に試すと、検証できる数が限られます。

    実験の判断を自動化しても、採点方法が変われば数字だけが改善することがあります。モデルの変更を速く試すだけでなく、変更前後を同じ条件で比べる必要があります。
  why_it_might_work: |-
    中央の担当がその案に関係する知識と履歴を渡せば、発案や実装の担当は毎回すべての記録を読む必要がありません。仕様、レビュー、学習ジョブ、分析が残るため、何を試したかを後で確かめ、途中から再開できます。

    変更を重ねる方式は、温度と視聴時間の重みのように互いに影響する設定を続けて試せます。ただし、記録が残っていても次の担当がそれを使うとは限りません。著者は以前に失敗した仮説が再提案された例も報告しました。
  evidence: |-
    ### 最終構成では、何を組み合わせて比較したか

    著者は分散TPUで5つの系列を並行させ、約2日で41件を完了しました。各実験には3時間以上かかりました。初めは短い学習で候補を探し、有力な候補を200万ステップの学習で確認しました。

    | 表1の構成 | NDCG@50 | MRR@50 |
    |---|---:|---:|
    | 基準モデル | 0.4796 | 0.3514 |
    | 温度も学習する構成（試行2） | 0.4996 | 0.3626 |
    | 視聴時間で損失に重みを付けた構成（試行18） | 0.5529 | 0.4173 |
    | 学習率の下げ方まで変えた最終構成（試行40） | 0.5751 | 0.4440 |

    NDCG@50は相対で約19.9%改善しました。表1は41件の実験結果をすべて並べた表ではありません。採択した温度、視聴時間による重み、利用者側の特徴の組み合わせ（DCN V2）、ゲート付き全結合、学習率の調整などを順に足した構成から、著者が4点を取り上げました。図4が学習途中に追った指標はMAP@50で、この表のNDCG@50とは別です。

    ### 本番の満足度と、新しいコンテンツが見つかるまでの時間

    表2で著者は満足度が3.77%、Unique Contentが7.44%増えたと報告しました。Cold-Start Improvementの−16.50%は、新しいコンテンツが見つかるまでの時間が短くなったという意味です。新規利用者への推薦精度が下がったという意味ではありません。満足度の細かな算出式、発見の判定、A/Bの期間や割付比率、信頼区間は本文に十分示されていません。

    ### 短く試すだけでは残る問題

    最終構成を選んだ実験とは別に、バッチを約8,000から約1,000に変えると指標が上がった試行がありました。人間が、モデルの表現ではなく、評価で比べる負例の数が変わったことに気づいて元に戻しました。ほかにも、短い学習で最大3.0の学習率を好む例、過去に失敗した案を再び試した例、試行40の後で新しい案から改善しなくなった例が報告されています。著者が今後の案として挙げた二段階の代理評価は、実装済みの機能ではありません。

    一次資料：[著者論文 §4〜6、表1〜2、図3〜4](https://arxiv.org/html/2609.01622v1#S4)
  executable_understanding: |-
    Labは乱数の種を変えた4組について、128件の検索ごとに正例1件と負例7,999件のスコアを一度だけ作ります。候補数を1,000、2,000、4,000、8,000件とするときは、同じ正例と同じ負例列の先頭だけを使います。正例の点も負例の点も付け直しません。正例が50位に入らなかった検索は、NDCG@50を0として平均に含めます。

    別の人工例では、事前確認の失敗、学習の失敗、候補数の変更、補助指標の悪化、同じ条件での改善を順に試します。採択した場合だけ、次の試行で比較する基準を更新します。
  results: |-
    正例のスコアが同じでも、候補を8,000件から1,000件に減らすと、平均NDCG@50は0.11386686から0.36055062へ上がりました。モデルを学習し直していないので、変わったのは評価の難しさです。

    学習の結果を残すか判定する例では、候補数を照合しないと、候補を減らした試行が採択されます。前の試行と候補数が同じかを確認すると、その試行は不採択になり、前の基準が残ります。この確認はLabの提案です。候補の件数が同じでも、候補の内容が違えば比較の難しさは変わり得ます。
  what_we_verified: 同じ負例列から候補を取ると、負例が増えても正例の順位が上がらないことを確認しました。不採択なら前の構成を保持し、補助指標が下限を割った候補は主指標が伸びても採択しないことも、人工の例で確かめました。
  what_we_did_not_verify: Labは指標を計算し、採択の分岐を確認しました。Googleの非公開モデル、エージェントの発案と実装、分散TPU、版管理の操作、本番の満足度は再現していません。基盤LLMの具体名・規模、プロンプト全文、公式実装は本文と書誌では確認できません。人間が探索した場合と比べた因果的な効果や、計算費用に見合う改善も検証していません。
  implementation: '`uv run papers/recevolve-autonomous-rec/run.py` をリポジトリのルートで実行します。`candidate_probe()` は固定したスコアからNDCG@50を算出します。`decide()`
    は主指標と補助指標を確認し、Labの候補数の照合も行います。`lifecycle()` は辞書で採択前後の基準を記録するだけで、Gitは操作しません。結果はコードと同じ場所の `results.json` に保存します。'
