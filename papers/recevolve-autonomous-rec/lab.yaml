- id: keep-rule
  kind: equations
  title: 探索する構成と、変更を採択する条件
  after: method
  locator: 式1–2 / Algorithm 1 / §5.2（最終段はLab導出）
  caption: 論文の探索と採択の式に続けて、Labで候補数の影響を調べる式を示します。
  rationale: モデルの探索と、比較で順位を求める処理を分けて読みます。
  steps:
  - name: 評価したい構成（式1）
    formula: M* = argmax M∈ℳ f(M,𝒟)
    explanation: すべての構成を学習して評価するには費用がかかるため、試す案を選びます。
  - name: 次に試す構成（式2）
    formula: Mₜ ← π(𝒦ₜ, {M₁,…,Mₜ₋₁})
    explanation: πは知識と試した構成から次の案を選ぶ抽象的な表現です。特定の強化学習の実装を指しません。
  - name: 変更を残す条件（Algorithm 1）
    formula: γ(ΦNS) > τ + ε  ∧  γ(ΦAux) ≥ Threshold
    explanation: 主指標が最良値と必要な改善幅の合計を超え、補助指標が下限以上なら、記録と基準を更新します。
  - name: 正例が何位かを求める式（Lab）
    formula: rank = 1 + Σⱼ 𝟙[sⱼ ≥ s⁺]; NDCG@K = 𝟙[rank ≤ K] / log₂(rank+1)
    explanation: 正例1件を使い、同点の負例も正例より前に数える。負例を除くだけなら正例の順位は悪くなりません。これは論文の番号付きの式ではありません。
  source: https://arxiv.org/html/2609.01622v1
