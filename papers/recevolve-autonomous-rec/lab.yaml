summary: GoogleのRecEvolveは、コンテンツ推薦モデルの改良案を実装して評価し、条件を満たした変更を積み重ねる。著者は41件を試し、最終構成でNDCG@50が0.4796から0.5751、本番で満足度が3.77%増えたと報告した。
