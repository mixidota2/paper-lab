question: フィードの候補を取り出す処理と詳しく採点する処理で、どの情報と計算を共有できるか
summary: UNIQUEは、フィードに載せる記事や動画の候補を集め、同じモデルで採点する。Mobile Baiduで旧方式と1週間比べると、視聴時間は0.96%、配信量は1.08%増えたと著者は報告した。候補取得サービスのP99は89 msだった。
