- kind: equations
  id: flat-distance
  title: 同じ数のコードを、階層で選ぶ場合と一度に選ぶ場合
  after: method
  locator: Eqs. 7–11, 25
  rationale: 同じ容量での比較、距離の補正、学習で使う4項を並べる。
  caption: 一次資料を説明用に再構成。数値は著者報告であり、Labの追試結果ではない。
  steps:
  - name: 同容量で比べる
    formula: 128 × 128 hierarchical → 16,384 flat codes
    explanation: 実運用の比較。階層を用いるRQ-VAEと階層を持たないコードは、容量が同じでも、候補を探す順序と割り当ての誤差の伝わり方が異なる。
  - name: 頻度で距離を補正
    formula: dⱼ(z) = ‖z̄ − eⱼ‖² (pⱼ / (1/M))^τ
    explanation: τ=0では距離が最も近いコードを選ぶ。正のτでは、一様な使用率より多く使われるcodeの距離を大きくし、そのコードに割り当てにくくする。p=0の場合に実装がどう扱うかは本文で確定できない。
  - name: 共有する学習
    formula: L = Ldisc + α Lgen + η Lcode + β Lquant
    explanation: クリック率などを予測する損失、コード生成、DSSMによるコード学習、量子化の4項。
  source: https://arxiv.org/pdf/2609.23718v1
