core_idea:
  author_claim: EQNは利用者の行動を学習に使い、記事や動画を階層のないコードに割り当てる。TDNはUIGNが用意した履歴と、候補コードや候補コンテンツの情報をTransformerの処理の早い段階で組み合わせる。著者は、階層をなくすと上位の割り当ての誤りが下位に伝わる問題を避けられ、コードの予測と候補の採点で表現を共有すると、段階の間で情報が失われにくくなると説明する。
  research_bot_interpretation: |-
    [Sona](sona-yandex-music.html)は段階的な推薦処理を置き換え、[VARG](varg-tmall-value-generative-retrieval.html)は事前の順位付けを迂回する。[LIGE-GR](lige-gr-meta-listwise.html)は候補の並び全体を評価する段階を加える。これに対し、UNIQUEは候補を集める処理の中に粗い順位付けと詳しい採点を残し、候補の取得と採点でモデルを共有する。[GenPage](genpage-netflix-homepage.html)や[OGR](ogr-once-generated-ranked.html)のように、推薦の列やページ全体を最適化するものではない。[UniRec](unirec-chain-of-attribute.html)とは、モデルがどの情報と計算を共有し、何を出力するかを比べられる。
sections:
  overview: |-
    Baiduの研究チームは、アプリのフィードに載せる記事や動画を探す処理と、見つけた候補を採点する処理に、同じモデルを使う方法を提案しました。UNIQUEは利用者の履歴をもとに、まず見てもらえそうなコンテンツのグループを選びます。次に、グループから取り出した候補をベクトルの内積で絞り、残った候補ごとに履歴の異なる部分を参照して採点します。モデルは共有しますが、配信時には候補を段階的に絞ります。

    Baiduはアプリの候補取得部分で、以前の方式とUNIQUEを1週間比べました。著者の報告では、視聴時間の合計が0.96%、コンテンツの配信量が1.08%増えました。候補取得サービスの応答時間は99パーセンタイルで89ミリ秒でした。この値は推薦画面全体の応答時間ではありません。
  problem: RQ-VAEのようにコードを階層で決めると、最初の割り当てが変わったときに、後の段階で処理する残差も変わる。よく見られるコンテンツが一部のコードに集中する問題もある。また、候補を取得するモデルと採点モデルを別々に学習すると、採点に使った利用者の反応を候補取得の表現に直接反映しにくい。UNIQUEは階層をなくし、コードの割り当てにも利用者の行動を使う。採点とコード予測の両方を、共通の表現の学習に使う。
  why_it_might_work: |-
    階層のないコードなら、一つ前の階層の選択が次の選択を制約しない。候補コードごとに利用者の履歴に付ける重みを変えれば、一つの利用者ベクトルを全候補と照らし合わせる方式より、候補ごとに異なる反応を拾える可能性がある。各候補は他の候補を参照しないため、同じ計算に別の候補を加えても参照先は変わらない。

    一方、システムは各コードを採点し、選んだコードに属するコンテンツを取り出し、コードとコンテンツの更新時期をそろえる必要がある。使用率によって距離を補正すると、補正前に最も近かったコードが選ばれないこともある。コードごとの件数が均等に近づくこと自体は、推薦の質が上がった証拠ではない。
  evidence: |-
    [一次資料PDF §4 / Tables 2–6](https://arxiv.org/pdf/2609.23718v1)の著者報告を、実サービスと公開データに分けて読む。

    | 評価 | 著者が報告した結果 | 測定条件 |
    | --- | --- | --- |
    | Mobile BaiduでのA/Bテスト | 視聴時間の合計 +0.96%、配信量 +1.08%、利用継続率 +0.70% | 旧運用の候補取得方式と1週間比較。相対変化で、著者の内部検定はp<0.05 |
    | 候補取得サービスの応答時間 | P80 35 ms、P99 89 ms、MFU 44.23% | NVIDIA L20約400基に1基1インスタンスを配置し、TensorRTのFP16で推論 |
    | ピーク時の候補取得 | 約10,000 QPS、平均37 ms | 候補取得サービスのリクエスト数と応答時間。推薦全体の値ではない |
    | KuaiRand-Pureでの評価 | HR@50 0.1510、CTR-AUC 0.7252 | 利用者27,285人、コンテンツ7,583件。利用者ごとに時系列で最後の1件を評価に使う |
    | 階層のあるコードに変更 | HR@50 0.1421、CTR-AUC 0.7190 | Table 3。同じ公開データでほかの損失項と最適化設定を維持 |
    | 実運用のコードを比較 | コードごとの件数の分散1510.85→389.57、コード内で最も多いカテゴリの平均構成比65.43→78.08% | 128×128の階層ありと階層なしの比較。どちらも16,384コード |

    P80とP99は応答時間の80・99パーセンタイル、QPSは1秒当たりのリクエスト数、MFUはGPUの演算能力に対するモデルの利用率を表す。HR@50は上位50件に正解が入った割合、CTR-AUCはクリックの有無を見分ける精度の指標。

    公開データでは、候補と履歴を処理の早い段階で組み合わせない場合はHR@50が0.1398、候補間の参照を遮る仕組みを外した場合は0.1456、コードを予測する学習目標を外した場合は0.1374だった。構成要素を一つずつ変えた結果であり、実運用で各要素が改善にどれだけ寄与したかは切り分けていない。

    実運用の実験では、視聴時間は新規利用者で1.44%、利用頻度が高い群で1.11%、低い群で0.29%増えた。論文は、登録から14日以内を新規、週5日を超えて利用した人を高頻度、週2日未満を低頻度と定義した。全体の改善率が各利用者に同じように当てはまるわけではない。

    論文の§1は導入を2026年2月、§4.1.2は同年1月としており、月を確定できない。著者はトラフィックの割付比、信頼区間、MFUの計算の内訳を明記していない。P99の89 msも、旧方式を同じ機器や負荷で測り直した比較値ではない。
  executable_understanding: |-
    `uv run papers/unique-baidu-unified-retrieval-ranking/run.py` で二つの人工例を計算する。最初の例は、正規化した2次元のベクトル一つを、式11の距離補正を使って四つのコードのどれかに割り当てる。次の例は、候補が利用者の入力列だけを参照する場合と、他の候補も参照する場合で、余分な候補を足したときに同じ候補の出力が変わるかを比べる。モデルを学習して、UNIQUEとRQ-VAEの精度を比べる実験ではない。
  results: |-
    `results.json` は、τ=0とτ=1で選ばれたコードと、補正前後の距離を記録する。τ=0ではコード0を選ぶ。人工例の使用率を与えてτ=1にすると、補正距離はコード0が1.12、コード1が0.32となり、コード1を選ぶ。利用者の入力列だけを見る計算では、候補を追加しても元の候補の出力は変わらない。他候補も参照する対照では出力が変わる。この計算はHRやAUCの改善を示すものではない。
  what_we_verified: Labで確かめたのは、τ=0なら元の距離で最近傍を選ぶこと、τを正にして使用率で補正すると割り当て先が変わる場合があること、利用者の入力列だけを参照すると候補を追加しても元の候補の出力が変わらないことの3点（CONFIRMED）。実測ではなく人工例なので、仕組み全体としては一部の確認にとどまる（PARTIAL）。
  what_we_did_not_verify: Labは実運用での性能、件数を増やしたときの性能、導入の可否を検証していない（NOT TESTED）。DSSMの学習、コードを指数移動平均で更新したときの収束、同条件でのRQ-VAEとの比較、GPUのMFU、A/Bテストはいずれも未実施。コードをすべて採点する費用や、特定のコードに候補が集中した場合に遅い応答が増えるかも測っていない。
  implementation: |-
    `assign()` は正規化したコンテンツとコードの距離に、一様な場合を基準とした使用率のτ乗を掛ける。`attention()` は学習済みの射影を使わず、入力をそのまま単一ヘッドのattentionで処理する。四つのコードは固定しているため、実運用で報告されたコードごとの件数の分散は再現対象に含めない。
  method: method.md
  mapping: mapping.md
