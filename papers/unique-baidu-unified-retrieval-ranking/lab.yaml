- kind: equations
  id: flat-distance
  title: 同じコード数での階層の有無と学習の式
  after: method
  locator: Eqs. 7–11, 25
  rationale: コードの容量をそろえた比較と、距離・学習の式を示す。
  caption: 一次資料を説明用に再構成。数値は著者報告であり、Labの追試結果ではない。
  steps:
  - name: 同容量で比べる
    formula: 128 × 128 hierarchical → 16,384 flat codes
    explanation: 実運用ではどちらも16,384コードで比較した。RQ-VAEは階層ごとにコードを割り当てるので、上位の割り当てが後の計算に影響する。
  - name: 頻度で距離を補正
    formula: dⱼ(z) = ‖z̄ − eⱼ‖² (pⱼ / (1/M))^τ
    explanation: τ=0なら補正前の距離で最も近いコードを選ぶ。τが正のときは一様な場合より使用率の高いコードの距離を大きくし、選ばれにくくする。使用率p=0の扱いは論文からは分からない。
  - name: 共有する学習
    formula: L = Ldisc + α Lgen + η Lcode + β Lquant
    explanation: 学習では、クリックなどの予測、コードの生成、DSSMによるコードの学習、量子化の4項を足し合わせる。
  source: https://arxiv.org/pdf/2609.23718v1
