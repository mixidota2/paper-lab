- kind: equations
  id: demand-cost
  title: フェイスと代替は別の経路で利益を変える
  after: method
  locator: 原典 §3.1、式(1)/(4)
  rationale: 需要変化と補充費の分母を分ける。
  caption: Aは採用品の集合。i∈Aは採用品iだけを合計する意味です。qᵢは基礎需要（個／期間）、fᵢは横の面数、dᵢは1面の奥行き個数、UとBは未採用品と採用品の基礎需要合計です。
  source: https://dergipark.org.tr/tr/download/article-file/4435791
  steps:
  - name: 需要の2成分
    formula: Dᵢ = qᵢ fᵢ^β + s qᵢ U / B
    explanation: 前半は陳列量による需要、後半は非採用品からの流入。
    formula_mathml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mi>D</mi><mi>i</mi></msub><mo>=</mo><mrow><msub><mi>q</mi><mi>i</mi></msub><msup><msub><mi>f</mi><mi>i</mi></msub><msub><mi>β</mi><mi>i</mi></msub></msup><mo>+</mo><mfrac><mrow><mi>s</mi><msub><mi>q</mi><mi>i</mi></msub><mi>U</mi></mrow><mi>B</mi></mfrac></mrow></mrow></math>
  - name: 費用を引く
    formula: Z = Σ(i∈A) [pᵢDᵢ − rDᵢ/(fᵢdᵢ) − c]
    explanation: フェイスを増やすと補充費も変わる。β=0でも選択が変わりうる。
    formula_mathml: <math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mi>Z</mi><mo>=</mo><mrow><munder><mo>∑</mo><mrow><mi>i</mi><mo>∈</mo><mi>A</mi></mrow></munder><mo>[</mo><msub><mi>p</mi><mi>i</mi></msub><msub><mi>D</mi><mi>i</mi></msub><mo>−</mo><mfrac><mrow><mi>r</mi><msub><mi>D</mi><mi>i</mi></msub></mrow><mrow><msub><mi>f</mi><mi>i</mi></msub><msub><mi>d</mi><mi>i</mi></msub></mrow></mfrac><mo>−</mo><mi>c</mi><mo>]</mo></mrow></mrow></math>
