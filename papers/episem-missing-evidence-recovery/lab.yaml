- id: evidence-world
  kind: logic
  title: 事実は見えなくしても、採点の基準は変えない
  after: method
  source: https://arxiv.org/html/2610.31650v1
  locator: §3・Fig 1
  rationale: 図では、見える情報と実際の許可条件を分ける。
  caption: 教材の二つの読み取り手段を比べる自作図。
  rows:
  - label: 同じ依頼
    nodes:
    - {title: 禁止世界 / 許可世界, text: 依頼とツールは共通。許可条件だけが違う。}
