question: '操作してよいかを判断する事実が見えないとき、エージェントは情報を確かめ、禁止側では止まり許可側では依頼を完了できるか。'
summary: 'EpiSEM-Benchは、同じ依頼が許可される場合と禁止される場合を組にし、両方で同じ事実を隠してAIエージェントを評価しました。6分野の300組で条件をそろえると、別の照会手段を使える場合は、違反を一度でも起こした課題の割合が10モデルすべてで下がりました。'
