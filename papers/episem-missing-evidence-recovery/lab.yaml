source_review:
  checked: '2026-10-25'
  url: https://arxiv.org/html/2610.31650v1
  scope: '本文§3、式(1)(2)、表1、付録B・C・EをHTML版とPDF版で照合しました。著者コードと実モデルの実行は確認していません。論文は10月22日付で、告知は10月23日です。'
core_idea:
  author_claim: '著者は、同じ情報を隠した禁止側と許可側で、エージェントが別の手段から事実を取り戻し、適切に行動できるかを測ります。禁止側で止まり、許可側で依頼を終えた場合だけ、両側での回収が成功したと数えます。'
  research_bot_interpretation: 'Labでは、ツールが正しい値を返したかだけでなく、判断に必要な事実がそろったか、実行を確定する前に得たか、許可された依頼も止めていないかを分けて測ると、失敗の理由を見つけやすいと考えます。'
sections:
  overview: |-
    EpiSEM-Benchの著者は、AIエージェントが操作の可否を確かめるために必要な事実を、ツールから受け取れないときの行動を調べました。著者は、同じ依頼が許可される場合と禁止される場合を組にして、どちらでも同じ事実を隠します。著者はこの組を6分野で300組用意し、通常のツールからは得られない情報を、別の手段で確かめられる場合と、そうでない場合を比べました。

    同じ事実を隠した条件にそろえると、別の照会手段がある場合は、禁止された操作の実行を一度でも確定した課題の割合が、10モデルすべてで下がりました。低下幅は0.7〜45.3ポイントでした。一方、隠れた事実を確かめてから、禁止側で止まり許可側で依頼を完了できた割合は、モデルによって0.0〜58.4%でした。禁止された操作が減ることと、必要な情報を自分で集めて適切に判断できることは、同じではありません。論文では、別の照会手段が隠れた事実をすべて正しく返す場合を評価しています。
  problem: 'すべての依頼を拒否すれば、禁止された支払いは起きません。ただし、許可された支払いも完了できません。また、許可側で操作を完了しただけでは、必要な事実を確かめたか、確認せずに進めてたまたま条件を満たしていたかはわかりません。'
  method: method.md
  why_it_might_work: '著者は、エージェントに事実を隠しても実際の許可条件を変えません。両側の成功を求めるため、すべて拒否する規則も、確かめずにすべて実行する規則も成功になりません。ただし、別の照会手段が隠れた事実をすべて正しく返すことが前提です。'
  evidence: evidence.md
  executable_understanding: experiment.md
  results: '教材で常に拒否する規則を選ぶと、禁止された操作をした課題は0（UCR 0）で、安全境界は最大（SBM 100%）です。その反面、完全情報での許可側の完了率（Full SWS）も、回収後に両側で成功した割合（PUR）も0です。別の照会手段があるREで、事実を照会してから判断する規則は、許可側と禁止側の両方で成功します。重要な事実が1個だけ欠けたときに照会する規則では、課題ごとに割合を出して等しい重みで平均するので、PURは (2/3+3/7)/2=54.76% です。全条件を一括で数えた 5/10=50% とは異なります。いずれも著者が報告したモデルの成績ではありません。'
  what_we_verified: '確認済み（CONFIRMED）：仮想の2課題で全480条件を確認しました。通常の読み取りでは必要な事実が戻らず、別の照会を行うと隠していた事実がすべて戻り、操作を確定したあとには照会しないことを確かめました。UCRが課題ごとに失敗の有無を数えること、SBMが「失敗なし」とするには全組み合わせが必要なこと、PURが両側での成功を求め、各課題を等しい重みで平均することも確認しました。教材が扱うのは論文の評価設計の一部です（PARTIAL）。'
  what_we_did_not_verify: '著者の300課題で実際のモデルを動かしたり、順位が繰り返し安定するか、実APIや本番で安全に動くか、信頼区間がどれくらいかを確かめたりはしていません（NOT TESTED）。参照資料では著者コードの公開先を確認できませんでした（NOT OBSERVED）。論文は有効な照会で隠れた事実がすべて正しく返ると仮定し、温度0を指定して各条件を1回試します。追加で試す組み合わせはモデルによって異なります。'
  implementation: 'Pythonの run.py が計算結果を results.json に保存します。ブラウザーでは model.js が同じ規則を動かし、interactive.js が許可側と禁止側の経過や全課題の集計を表示します。再実行する手順はREADMEに、原典の式と教材を照合する場所や省いた条件は mapping.md にまとめています。'
  mapping: mapping.md
