teaching_figures:
- id: evidence-world
  kind: logic
  title: エージェントに事実を隠しても、採点には実際の状態を使う
  after: method
  source: https://arxiv.org/html/2610.31650v1
  locator: §3・Fig 1
  rationale: エージェントが知っていることと、実際に満たしている条件を分けて示します。
  caption: この図は、教材で使う二つの確認方法を比べています。
  rows:
  - label: 同じ依頼
    nodes:
    - {title: 禁止される側と許可される側, text: 両側で依頼と道具は同じです。実際に許可条件を満たすかだけが違います。}
    - {title: 許可側でも禁止側でも、同じ事実を隠す, text: エージェントがいつもの方法で読み直しても、その事実はわかりません。}
  - label: 実行前
    nodes:
    - {title: REでは、もう一つの手段で照会できる, text: エージェントが有効な照会を行うと、隠した事実がすべて戻ります。}
    - {title: 許可側と禁止側で判断する, text: 禁止側では止まり、許可側では依頼を完了します。実行を確定したら処理は終わるため、あとで照会する予定でも判断は戻せません。}
- id: paired-denominators
  kind: equations
  title: 同じ5件が成功しても、どの単位で集計するかで割合が変わる
  after: results
  source: https://arxiv.org/html/2610.31650v1#S3.E2
  locator: 式(2)を自作の2タスクに適用
  rationale: 課題ごとに成功割合を出す場合と、すべての条件をまとめて数える場合を比べます。どちらも成功したのは同じ5件です。
  caption: この教材では、重要な事実が1個だけ欠けたときに照会する規則を使います。著者が評価したモデルの成績ではありません。
  steps:
  - name: 課題ごとに、両側で成功した条件を数える
    formula: 'payment: 2/3、export: 3/7'
    explanation: この規則が成功するのは、重要な事実を1個だけ隠したときです。1個以上を隠す条件は、重要な事実が2個の課題で3通り、3個の課題で7通りあります。
  - name: 各課題の割合を同じ重みで平均する（PUR）
    formula: '(2/3 + 3/7) / 2 = 23/42 ≈ 54.76%'
    explanation: 隠し方が3通りでも7通りでも、課題ごとに求めた割合を同じ重みで平均します。
  - name: 全課題の条件をまとめて数える場合
    formula: '(2 + 3) / (3 + 7) = 50%'
    explanation: 条件が7通りある課題の影響が大きくなります。論文のPURとは異なる集計です。
