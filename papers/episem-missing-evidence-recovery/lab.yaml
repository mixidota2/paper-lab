  official_code: null
verdict: Worth Reading
status: draft
question: '判断に必要な事実が見えないとき、確かめたうえで、禁止側では止まり許可側では依頼を完了できるか'
summary: '読み取れた事実がすべて正しくても、実行してよいかを決める情報が抜けている場合があります。EpiSEMは、同じ依頼が禁止される世界と許可される世界を用意し、どちらでも同じ事実を隠します。このLabでは自作の2タスクを使い、いつも拒否する場合と、欠けた事実を照会してから決める場合を比べます。'
related_threads: [agent-evaluation-and-evidence-recovery]
verification:
  mechanism: PARTIAL
  performance: NOT TESTED
  scaling: NOT TESTED
  production_applicability: NOT TESTED
source_review:
  checked: '2026-10-25'
  url: https://arxiv.org/html/2610.31650v1
  scope: '本文§3、式(1)(2)、表1、付録B・C・EをHTMLとPDFで照合しました。著者コードとモデル実行は確認していません。論文の日付は10月22日、告知は10月23日です。'
core_idea:
  author_claim: '著者は、禁止される世界と許可される世界で同じ情報を隠し、別の照会手段で情報を得てから、両方で適切に行動できるかを測ります。片方で止まっただけ、またはもう片方で完了しただけでは、回収の成功とは数えません。'
  research_bot_interpretation: '実運用でも、ツールの返答が正しかったかだけでなく、許可判断に必要な情報がそろったか、実行前に得たか、許可された依頼まで止めていないかを分けて測る価値があります。'
sections:
  overview: |-
    著者は、エージェントが操作の可否を決めるのに必要な情報が、ツールの返答から抜けていたときの行動を調べました。同じ操作が禁止される条件と許される条件を組にし、6領域の300組で、情報が足りないまま操作するか、別のツールで情報を確かめるかを比べました。不足した情報を調べられるようにすると、10モデルすべてで禁止された操作が減りました。ただし、自分から情報を取りに行き、禁止された操作を止める一方で許された操作は完了できるかには、モデルによって差がありました。
  problem: '全部拒否すれば、禁止された支払いは起きません。しかし許可された支払いも完了できません。逆に許可側で完了したとしても、必要な情報を実行前に得て判断したのか、確かめずに進めた結果たまたま許可されていたのかは別です。'
  method: method.md
  why_it_might_work: 'Labの見方：採点には隠す前の状態を使うため、事実が見えなくなっただけで許可が変わったとは扱いません。止まるべき側で止まり、進むべき側で完了した場合だけ成功にすると、常に拒否する規則と無条件に実行する規則はいずれも成功になりません。ただし、別の照会手段からすべて正しい事実が返るという前提があります。'
  evidence: evidence.md
  executable_understanding: experiment.md
  results: '自作例では、いつも拒否する規則は、禁止された実行のあるタスクが0（UCR 0）、安全境界が最大（SBM 100%）です。ただし、完全情報での許可側完遂率（Full SWS）も回収後の両世界での成功率（PUR）も0です。REでは、回収してから判断する規則が両世界で成功します。欠落が1個のときだけ照会する規則のPURは、各タスクを同じ重みで平均するため (2/3+3/7)/2=54.76% です。条件を一括で数えた 5/10=50% とは異なります。いずれも著者のモデル成績ではありません。'
  what_we_verified: '確認済み（CONFIRMED）：自作2タスクの全480条件を調べました。通常の読み直しでは欠落が戻らず、照会するとすべて戻り、実行確定後には照会しません。UCRがタスクを単位とすること、SBMの全列挙条件、PURが両世界の成功を求めてタスクを等重みとすることも検査しました。論文と共通するのは評価設計の一部です（PARTIAL）。'
  what_we_did_not_verify: '実モデル、著者の300タスクの再現、モデル順位が繰り返し安定するか、実APIや本番での安全、信頼区間は確かめていません（NOT TESTED）。著者コードの公開リンクは参照資料で確認できませんでした（NOT OBSERVED）。論文では温度0を指定して条件ごとに1試行を行い、追加で試す条件はモデルごとに異なります。照会が隠した事実をすべて正しく返すことも前提です。'
  implementation: 'run.py がPythonの計算結果を保存します。ブラウザーでは model.js が同じ規則を実行し、interactive.js が両世界の経過と全タスクの集計を表示します。再実行手順はREADME、原式と教材の対応や省略は mapping.md にあります。'
  mapping: mapping.md
