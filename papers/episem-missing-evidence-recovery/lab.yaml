- id: paired-denominators
  kind: equations
  title: 回収成功5件でも、集計の仕方で割合が変わる
  after: results
  source: https://arxiv.org/html/2610.31650v1#S3.E2
  locator: 式(2)を自作の2タスクに適用
  rationale: タスクごとに割合を出す場合と、すべての条件を一括で数える場合を、同じ成功件数で比べる。
  caption: 自作の「1個欠落時だけ回収」方策。著者のモデル成績ではない。
  steps:
  - name: タスクごとに、両世界で成功した条件を数える
    formula: 'payment: 2/3、export: 3/7'
    explanation: 重要な事実を1個だけ隠した条件で成功する。1個以上を隠す組み合わせは、重要な事実が2個のタスクで3通り、3個のタスクで7通りある。
  - name: タスクごとの割合を等しい重みで平均する（PUR）
    formula: '(2/3 + 3/7) / 2 = 23/42 ≈ 54.76%'
    explanation: 隠し方の多いタスクも少ないタスクも、最後の平均では同じ重みにする。
  - name: 全条件を一括で数えた場合
    formula: '(2 + 3) / (3 + 7) = 50%'
    explanation: 7通りの条件を持つタスクに大きな重みがかかる。これは論文のPURとは別の集計。
