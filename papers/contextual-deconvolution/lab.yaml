teaching_figures:
- kind: equations
  id: inverse
  title: 観測した販売数を平常需要と一時変化に分ける
  after: method
  locator: 式(1)–(3)
  rationale: 目的関数の各項がどのような分解を選ぶかを示します。
  caption: 観測値をb、平常時の需要をx、限られた日に起きる変化をzと書きます。
  steps:
  - name: 平常時の需要に販促などの一時変化が加わる
    formula: b = x + Az + ε
    explanation: 行列Aは、zで表した変化が当日と後日にどれだけ表れるかを計算します。εは観測値に混ざる雑音です。
  - name: Aを決めたあとにxとzを求める
    formula: minₓ,𝓏  ‖b − x − Az‖₂² + λsmooth ‖Lx‖₂² + λsparse ‖z‖₁
    explanation: 第1項は観測値との差を、第2項は平常需要の前日からの変化を、第3項は一時変化の大きさの合計を抑えます。罰則の重みλを変えると選ぶ分解も変わります。
  - name: 販促の影響が発生日から何日続くかを表す
    formula: A = Σₘ Σₖ φₘ(k) Sₖ diag(fₘ)
    explanation: fₘは種類mの出来事が起きる日を示します。Sₖは影響が出る日をk日ずらします。行列Aは影響が出た日ではなく出来事が始まった日を起点にします。
  source: https://arxiv.org/pdf/2607.25664v1
- kind: matrix
  id: impulse
  title: 一つの販促が当日と後日の販売数に与える影響
  after: method
  locator: 式(3)・表1
  rationale: 一つの出来事への反応を、発生からの日数ごとに並べます。
  caption: φ(k)は発生からk日後の反応です。この表は一つの出来事だけを表し、実測値は使っていません。著者のモデルは複数の出来事の影響を足します。
  columns:
  - 出来事が起きた日にz=1
  - 出来事が起きない
  rows:
  - label: 当日
    cells:
    - φ(0)
    - '0'
  - label: 翌日
    cells:
    - φ(1)
    - '0'
  - label: 2日後
    cells:
    - φ(2)
    - '0'
  - label: 3日後
    cells:
    - φ(3)
    - '0'
  corner: 影響が出る日
  source: https://arxiv.org/pdf/2607.25664v1
- kind: equations
  id: kernel
  title: 販促直後の増加と後日の反動減を表す式
  after: method
  locator: 表1・§3.3
  rationale: 数式で表せる反応と、データで確認した反応を分けます。
  caption: 著者はM5では販促後に遅れて残る負の反応を確認していません。この図は式が表せる変化の説明です。
  steps:
  - name: 増加と減少を別の指数関数で表す
    formula: |-
      φ(k) = α exp(−k/τ₁) − β exp(−k/τ₂)
      α > β > 0,  τ₁ < τ₂
    explanation: 当日は正の成分の方が大きく、日がたつとゆっくり小さくなる負の成分が残ります。著者は負の成分を含まない指数減衰とも比べました。
  source: https://arxiv.org/pdf/2607.25664v1
