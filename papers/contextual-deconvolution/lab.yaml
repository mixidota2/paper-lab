summary: 著者は平常時の需要と販促による一時変化を分けて予測する。予測の変動を抑えても、品切れの費用が重い条件では在庫の総費用が増えることがある。
figures: []
core_idea:
  author_claim: |-
    著者は、平常時の需要は滑らかに変わり、大きな一時変化が起こる時点は少ないと仮定して、観測系列を二つに分ける。販促後の反応を表す作用素はデータから推定し、反応を学ぶ情報の一部を商品間で共有する。将来を予測するときは、平常需要の推移を延ばし、予定が分かっている販促の効果を加える。

    [一次資料：§3.1–3.3 / §4 / Appendix R.6](https://arxiv.org/pdf/2607.25664v1)
  research_bot_interpretation: 発注担当者は、予測の変動が減っただけで発注が改善したとは判断できない。急増を抑えて見積もると、品切れが増え、保管費が下がっても総費用が上がることがある。論文は二つの費用を分けて示している。
sections:
  overview: |-
    著者は、販促の前後で販売数が大きく動くとき、平常時の需要と販促に伴う変化を分けて予測する方法を提案しました。今後の販促日程を使い、販促の影響がいつ出るかを平常時の予測に加えます。M5の在庫シミュレーションでは、保管の単価が欠品の単価の約2割を上回ると、調整済みのXGBoostより総費用が低くなりました。保管の単価がその水準を下回ると、販促中の需要を十分に見込めず、むしろ総費用が高くなりました。この境目はM5での推定値で、他の店舗や業態でも同じとは限りません。
  problem: |-
    予測モデルが販促中の急増を平常時の新しい水準と解釈すると、販促後も高い予測を出す。逆に、需要全体を滑らかにすると、販促中に確保すべき数量まで減らすおそれがある。

    Contextual Deconvolution（CD）は、観測値を平常時の基礎需要と一時的な変化に分ける。販促後の何日間に影響が残るかを反応の形で表す。長い反応が見られない商品に、一律に長い反応を当てはめる手法ではない。
  why_it_might_work: 一時的な増加を基礎需要に入れなければ、予測から上流へ不要な変動を伝えずに済む可能性がある。ただし、観測値を同じように説明する分解は複数ある。モデルは正則化で、基礎需要がなめらかで、大きな一時変化の回数が少ない分解を優先する。販促効果がすぐ消えるデータでは、反応の形を複雑にしたことより、基礎需要を安定させたことが効いた可能性がある。
  evidence: |-
    著者はM5でTuned XGBoostと比べ、保管単価を欠品単価で割った値が約0.20より大きいところで、CDの在庫総費用が低くなると報告した。境界の95%区間は0.17〜0.25である（Abstract・§4）。これはシミュレーション結果であり、Favoritaや他の業態にそのまま当てはめない。

    v1ではp13–14と図2が1000 SKU、p10の表3が100 SKUと記すため、対象件数は確定しない。Appendix U p39はVR=Var(forecast)/Var(actual)という非負の比を定義した直後に負値を説明する。Labは指標の定義を推測せず、比較を留保する。§3.3のM5では、販促後の負の反応はデータから検出されず、反応の形の仮定にとどまる。

    [一次資料：§3.1–3.3 / §4 / Appendix R.6](https://arxiv.org/pdf/2607.25664v1)
  executable_understanding: |-
    Labは8期分の需要を固定し、期ごとに変える在庫と、毎期同じ在庫を比べる。品物が余った数と足りなかった数にそれぞれの単価を掛け、合計を棒グラフで示す。操作する費用比は保管単価を欠品単価で割った値である。在庫は次の期に持ち越さず、費用比を変えても需要や在庫の数量は変わらない。

    `uv run papers/contextual-deconvolution/run.py` を実行すると、コードにある合成データと比較条件を使い、図の全条件の結果を `results.json` に保存する。
  results: 表は初期条件、操作図は費用比を変えたときの総費用を示す。どちらも固定した人工データの計算で、論文のモデル性能ではない。
  what_we_verified: '**メカニズム：PARTIAL（部分的）**。Labは、同じ8期の需要と二つの在庫系列で、余剰と不足のどちらを重く見るかによって総費用の大小が入れ替わることを確かめた。各期は独立で在庫を持ち越さない。論文の手法を再現したわけではない。'
  what_we_did_not_verify: Labは作用素の推定、固定した作用素での凸最適化、M5とFavoritaの評価、論文の費用境界を再現していない。発注担当者が実用性を比べるなら、同じ将来の販促カレンダーを各モデルに渡し、実際の欠品率も測る。予測に使う滑らかさの指標は、発注数量の分散とは別である。
  implementation: |-
    Pythonの標準ライブラリだけで動く。個別の `run.py` が `papers/_toy_common.py` の論文別関数を呼び、操作図の全条件と初期条件の表を出力する。

    この計算は、固定した需要と在庫から費用を出す。需要の分解、販促反応の学習、在庫の持ち越し、論文データは扱わない。
  mapping: mapping.md
  method: method.md
question: 販促で需要が急増するとき、予測を滑らかにすると在庫費用は下がるか
