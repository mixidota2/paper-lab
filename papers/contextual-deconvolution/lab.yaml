teaching_figures:
- kind: equations
  id: inverse
  title: モデルが観測値を平常需要と一時変化に分ける
  after: method
  locator: 式(1)–(3)
  rationale: どの条件で一つの分解を選ぶかを、目的関数の各項で説明する。
  caption: bは観測値、xは滑らかな基礎需要、zは限られた日に起こる一時変化（ショック）。説明図では記号を短くしている。
  steps:
  - name: 基礎需要に一時変化と観測雑音が加わる
    formula: b = x + Az + ε
    explanation: ある日の一時変化zが作用素Aを通ると、当日だけでなく後日の観測値にも影響する。εは観測雑音を表す。
  - name: Aを固定し、基礎需要と一時変化を求める
    formula: minₓ,𝓏  ‖b − x − Az‖₂² + λsmooth ‖Lx‖₂² + λsparse ‖z‖₁
    explanation: 第1項は観測値との差を小さくする。第2項は基礎需要の日ごとの差、第3項は一時変化が多い分解を抑える。罰則の重みλを変えると選ぶ分解も変わる。
  - name: 販促が始まった日の条件から、その後への影響を計算する
    formula: A = Σₘ Σₖ φₘ(k) Sₖ diag(fₘ)
    explanation: fₘは出来事の種類mのカレンダー、Sₖは影響をk日ずらす行列。Aは結果が表れる日ではなく、出来事が起きた日の条件を使う。
  source: https://arxiv.org/pdf/2607.25664v1
- kind: matrix
  id: impulse
  title: 販促当日と後日に、どれだけ影響が残るか
  after: method
  locator: 式(3)・表1
  rationale: 一つの出来事の影響を、日ごとに表へ並べる。
  caption: φ(k)は発生からk日後の反応。この表は一つの出来事だけを示し、実測値は入れていない。著者のモデルは複数の出来事を重ねる。
  columns:
  - 発生日にz=1
  - イベントなし
  rows:
  - label: 当日
    cells:
    - φ(0)
    - '0'
  - label: 翌日
    cells:
    - φ(1)
    - '0'
  - label: 2日後
    cells:
    - φ(2)
    - '0'
  - label: 3日後
    cells:
    - φ(3)
    - '0'
  corner: 反応が表れる日
  source: https://arxiv.org/pdf/2607.25664v1
- kind: equations
  id: kernel
  title: 反動減を表せる式でも、M5で反動減を確認したわけではない
  after: method
  locator: 表1・§3.3
  rationale: 式で表せる形と、データから確認できた形を分ける。
  caption: これはカーネルの形の説明であり、M5で販促後の負の反応を測った図ではない。
  steps:
  - name: 二つの指数関数を引き算する
    formula: |-
      φ(k) = α exp(−k/τ₁) − β exp(−k/τ₂)
      α > β > 0,  τ₁ < τ₂
    explanation: 当日は正の成分が大きい。負の成分の方がゆっくり消えるため、後日にはそちらが残る。論文は負の成分がない指数減衰とも比べている。
  source: https://arxiv.org/pdf/2607.25664v1
