summary: 著者は平常時の需要と販促による変化を分けて予測しました。M5では保管費が下がりましたが、販促日の欠品費が増え、保管単価が低い条件では総費用が増えました。
figures: []
core_idea:
  author_claim: |-
    著者は、平常時の需要は日ごとに大きく変わらず、大きな一時変化が起きる日は少ないと仮定しました。販促当日から何日後まで影響が残るかを過去の販売数から推定し、観測が少ない商品では同じカテゴリなどのデータも使います。将来の販売数を求めるときは、平常時の需要を先へ延ばし、日程が分かっている販促の影響を足します。

    [一次資料：手法と評価条件](https://arxiv.org/html/2607.25664v1#S3)
  research_bot_interpretation: 発注担当者がこの手法を検討するときは、平常日に減らせる余剰と販促日に増える不足を分けて見ます。余剰が減って浮く費用より欠品で失う費用が大きければ、総費用は増えます。
sections:
  overview: |-
    著者は、販促で販売数が急に増えたとき、その増加を普段の需要の伸びと区別する方法を提案しました。過去の販売数から平常時の需要と販促による一時変化を分け、予測では平常時の需要に、日程が分かっている販促の影響を加えます。

    著者はM5の販売データを使った在庫シミュレーションで、同じ将来の販促日程を渡した調整済みXGBoostと比べました。提案手法は保管費を抑えましたが、販促日の需要を少なく見積もったため欠品費が増えました。総費用が低くなったのは、保管単価が欠品単価の約2割を上回る条件です。この境界はM5で求めた値で、他の店舗や業態にそのまま使えるとは限りません。
  problem: 予測モデルが販促中の販売増を平常時の需要の伸びと見なすと、販促が終わっても高い予測を出し続けます。一方、予測全体を滑らかにすると、販促日に必要な在庫まで減らすおそれがあります。著者は普段の需要と一時的な増減を別々に表しました。
  why_it_might_work: 一つの販売数の系列を説明できる平常需要と一時変化の組み合わせは、いくつもあります。著者は平常需要の日ごとの差が小さく、大きな一時変化が少ない組み合わせを選びます。M5の商品をまとめて推定した反応とFavoritaの反応は、主に販促当日に出ました。前後の日も考慮する方法と、当日のみを使う方法の結果は大きく変わりませんでした。一方、M5の趣味用品では後日までの反応を表すと、予測誤差や安全在庫が小さくなりました。
  evidence: |-
    著者はM5で、同じ将来の販促予定を両手法に渡し、調整済みXGBoostと比べました。在庫シミュレーションでは補充に7日かかり、欠品の単価を1個あたり10ドルに固定しました。提案手法は保管費を減らしましたが、欠品費が増えました。総費用が安い手法が入れ替わる保管単価と欠品単価の比は約0.20で、商品を再抽出して求めた95%区間は0.17〜0.25でした。Favoritaで同じ境界になるかは示していません。

    論文v1の§4.4と図2は1,000商品、表3は100 SKUと書いています。件数は確定しません。Appendix Uでは予測の分散を実績の分散で割ると定義した直後に負の値を説明しています。定義どおりなら比は負にならないため、負の値を同じ指標として解釈しません。著者はM5で販促後に負の反応が残ったことも確認していません。後日の反動減は式で表せる形の一つです。

    [一次資料：実験条件と比較](https://arxiv.org/html/2607.25664v1#S4)
  executable_understanding: |-
    Labは同じ8期の需要に対して、期ごとに数量を変える在庫と毎期同じ数量を置く在庫を比べます。需要を超えた数量に保管単価を、足りなかった数量に欠品単価を掛け、8期分を足します。図で変える費用比は保管単価を欠品単価で割った値です。費用比を動かしても需要と在庫数量は変わりません。

    `uv run papers/contextual-deconvolution/run.py` を実行すると、図で使う費用が `results.json` に保存されます。
  results: 表は最初に表示する費用比0.20の結果です。数量を変える在庫は13.6、毎期同じ数量を置く在庫は38.4です。教材で両方の費用が等しくなる比は8/9で、論文の約0.20とは別です。
  what_we_verified: '**メカニズム：PARTIAL（部分的）**。Labは需要と在庫の数量を8期分固定し、余った数量と足りなかった数量に単価を掛けました。保管単価を上げると、総費用が安い在庫の置き方が入れ替わります。在庫は期をまたいで持ち越しません。この計算は論文の発注シミュレーションを再現したものではありません。'
  what_we_did_not_verify: Labは販促の反応を表す行列を推定せず、需要を分ける凸最適化も行っていません。M5とFavoritaでの予測精度、論文で総費用が入れ替わる条件、実店舗での効果は未検証です。実際に比べるなら、各モデルに同じ将来の販促日程を渡し、予測の分散、発注量の分散、実際の欠品率を別々に調べます。
  implementation: 個別の `run.py` はPythonの標準ライブラリと `papers/_toy_common.py` を使います。共通の関数が、決めておいた8期の需要と二つの在庫系列から費用を計算します。論文データの取得、販促反応の推定、需要の分解、翌期への在庫の持ち越しは行いません。
  mapping: mapping.md
  method: method.md
question: 販促がある商品で予測の変動を抑えると、在庫の総費用はどう変わるか
