  pdf_sha256: 606cdee79be0bf17313e811f920f364f3be1e729e50ce13f18f70b013e3552f3
  url: https://arxiv.org/pdf/2608.02276v1
core_idea:
  author_claim: 修正役は失敗の記録を読み、エージェントの周囲で動くコードの変更を提案します。著者らは、変更後も同じモデルに同じ一群の課題を解かせ、修正前後の成績の差で修正役を学習しました。[一次資料：§3](https://arxiv.org/html/2608.02276v1)
  research_bot_interpretation: この論文は、課題を解くモデル自体ではなく、周りのコードを直すモデルを学習させています。解くモデルの重みを固定していても、受け取る情報や、環境まで届く操作は変わります。そのため、成功率の差は、モデルの重みを変えずに実行方法を変えたときの結果です。
sections:
  overview: |-
    著者らは、課題を解くエージェントの重みを固定し、その周囲で動くコードを直す別のモデルを学習しました。修正役は元のエージェントが失敗した記録を読み、判断の前、行動の直前、結果を受け取った直後などで実行する処理を提案します。著者らは、元は成功した課題も含めて同じ課題を解き直し、修正前後の結果の差を修正役の学習に使いました。

    WebShop、ALFWorld、DBBenchの成功率を同じ重みで平均すると、44.3%から53.6%へ9.3ポイント上がりました。別の実験では、完成した修正から行動直前や結果を受け取った直後の処理を外すと、成功率が特に下がりました。一つずつ外したときの差を足しても、全体の改善になるわけではありません。
  problem: エージェントは、次に何をすべきか分かっていても、道具が受け付けない形式で引数を送り、同じ失敗を繰り返すことがあります。指示文を足すだけでは、提案した操作が実行される直前に間違いを止められるとは限りません。著者らは、失敗の記録を使い、どの段階に処理を足すかを別のモデルに学ばせました。
  method: method.md
  why_it_might_work: 行動の直前に引数の形式を確かめれば、受け付けられない操作をそのまま環境へ渡さずに済みます。返答を受け取った後には、状況を読み直し、同じ操作を繰り返すのを避ける手がかりを渡せます。ただし、どちらが役立つかは元のモデルがどのように失敗するかで変わります。
  evidence: |-
    ### 表1では、三つの環境の成功率を同じ重みで平均した

    著者らはWebShopとALFWorldで500課題ずつ、DBBenchで300課題を評価しました。解く側のQwen3.5-9Bをそのまま使うと、三つの環境の平均成功率は44.3%でした。修正役を教師付き学習だけで学習すると46.4%、実行結果でも学習したHarness-R1では53.6%でした。9.3は相対的な増加率ではなく、成功率同士の差を示すポイントです。

    著者らは解くモデル自体を別に教師付きで学習した場合も比べました。その場合は59.2%で、そのモデル向けに別途学習したHarness-R1を組み合わせると64.2%でした。Reflectionの値は、1回目に失敗した課題をやり直せる条件で合格した割合です。他方式の1回限りの結果とは直接比べません。

    ### 図4bでは、完成した修正から一箇所ずつ外した

    図4bの全修正ありは53.1%、一切の修正なしは44.2%です。表1の53.6%と44.3%とは別の実験です。修正を固定し、判断前だけを外すと52.5%、初期化だけを外すと52.2%、結果を受け取った直後だけを外すと49.8%、行動直前だけを外すと49.2%でした。処理が互いに補う場合があるので、差を足して各処理の独立した効果とは見なしません。

    ### 初めての課題にも効くかは、別の比較で見た

    図4aでは、著者らは環境ごとに10件の失敗を修正役に見せ、残りの計1,270課題に修正を適用しました。三つの実験条件の平均では、成功率が8.9ポイント上がり、条件間の標準偏差は1.5ポイントでした。最初に失敗を見せた課題をそのまま解き直す比較とは別です。

    [一次資料：表1、§4、図4、付録表G.1](https://arxiv.org/html/2608.02276v1)
  executable_understanding: |-
    Labでは、商品を検索する固定プログラムを使います。開始時の状態がない、商品名の別表記が合わない、引数に大文字が入る、結果が入れ子になっている、という4種類の失敗を用意しました。修正役は学習せず、記録で見つけた失敗に合わせて、あらかじめ用意した処理を選びます。

    失敗の調査に使う20課題と、商品IDが異なる別の20課題を分けました。後者で、全部の処理を使う場合と、一つだけ外す場合を比べます。元は成功していた課題も集計に入れます。商品IDを変えても故障の種類は同じです。
  results: 別の商品IDを使う20課題では、修正なしで4件（20%）、全部の処理を使うと20件（100%）が成功しました。一つだけ外すと、どの処理を外しても16件（80%）でした。4種類の失敗を同数ずつ用意したため、減った件数は同じです。論文で行動直前の影響が大きかった結果を再現したわけではありません。
  what_we_verified: 課題を解く関数を変えなくても、その前後で使う処理を変えると成功する課題が変わりました。処理を外すと、それに対応する失敗が戻ることも確かめました。別の20課題では商品IDを変えましたが、失敗の種類は変えていません。
  what_we_did_not_verify: LabはLLMを起動せず、モデルの学習や自由なコード生成も行いません。未知の失敗に対処できるか、本番で安全に扱えるかは測っていません。決めた種類の失敗だけを扱うため、この例の100%を他の仕事に当てはめることはできません。
  implementation: リポジトリのルートから `uv run papers/harness-r1/run.py` を実行します。プログラムは標準ライブラリだけを使い、乱数や外部サービスは使いません。各条件の結果を同じフォルダの `results.json` に保存します。
  mapping: mapping.md
