core_idea:
  author_claim: '著者は失敗trajectoryのbatchから実行可能なoverlayを生成し、同じ全課題を固定targetで再実行した改善をengineerの報酬にする。既存の編集器をpromptで使うだけでなく、編集方策の重みを実行結果で更新する点を提案する。


    [一次資料：arXiv v1 本文](https://arxiv.org/pdf/2608.02276v1)'
  research_bot_interpretation: Multi-Harness RLが課題を解く方策のcreditを変えるのに対し、こちらは修正を提案する方策を学習する。改善の所在が異なる。実行hookを通じてtargetの行動自体を変更できるため、「重みを固定した」は「同じ情報・操作条件で能力だけが上がった」と同義ではない。
sections:
  overview: Harness-R1は課題を解くtargetを固定し、その周囲の実行コードを直す9B engineerをSFT＋GRPOで学習する。3ベンチマークの平均成功率は44.3%から53.6%へ上昇。行動直前とfeedback後の介入が除去実験で大きく効いた。
  problem: '入力が少し違うだけで止まる。たとえばLLMが正しい商品を選んでいても、toolが受け付けない引数形式を送り、戻ってきたエラーも読めなければ、同じ失敗を繰り返す。固定の自己反省promptを追加しても安定して改善するとは限らない。


    そこでHarness-R1は、失敗記録を読む別モデルに、どこへ実行可能な修正を入れるかを学習させる。修正器を育てる研究だ。'
  method: method.md
  why_it_might_work: '行動前のvalidationは、モデルが誤る引数形式を環境へ渡す前に直す。feedback後には回復を試みる。この二つの処理が協調すれば、誤った操作の繰り返しを避けながら、次の判断に使う観測も読みやすい形へ戻せる。


    promptを書き足すだけでは、操作が実行される瞬間の条件までは固定できない。どの介入が効くかは、失敗分布とtargetによる。'
  evidence: '### 主表と介入位置の除去実験は、測定条件が異なる

    表1はWebShop 500、ALFWorld 500、DBBench 300課題で成功率を評価し、3環境を等重みで平均する。default 44.3%、SFT-only engineer 46.4%、Harness-R1
    53.6%。default比は+9.3 ppで、相対9.3%ではない。直接targetをSFTした場合も59.2%→64.2%となる。


    図4bは固定patchの介入位置を一つずつ除く別の分析。full 53.1%、判断前なし52.5%、初期化なし52.2%、feedback後なし49.8%、行動直前なし49.2%、介入なし44.2%だった。ここに表1の53.6%を混ぜない。除去の差を足して総効果にすることもできない。


    未見課題への図4aでは疎な失敗証拠からの平均改善+8.9 ppを報告する。これは主表のsame-batch目的とは別の根拠だ。Reflectionは2episodeのsuccess@2で、他のsuccess@1と単純順位比較できない。公式コードのURLは本文に明記されているが、このLabは大規模モデルを実行していない。


    [一次資料：arXiv v1 本文](https://arxiv.org/pdf/2608.02276v1)'
  executable_understanding: '固定スクリプトのtargetが商品lookupを行う。session未設定、alias、引数の大文字、入れ子feedbackという4故障を、別のルールベースengineerが失敗traceから見つけ、対応するhookを有効にする。修正後は最初から成功していた課題も再評価する。


    証拠用20課題と、商品IDを変えた20課題を分ける。全hookと一箇所ずつ外した場合を比較する。実行処理は変わるがtarget関数は同じ。engineerの重み学習はなく、SFT/GRPOの再現とは呼ばない。'
  results: 未見IDの20課題では、baseの成功率0.2が全hookで1.0になる。いずれか一つのhookを外すと0.8へ戻る。4故障型を同数で作ったため除去差は等しく、論文のpre-action優位を再現した数値ではない。
  what_we_verified: 'targetは同じ関数のまま。周辺hookを変えると成否が変わり、故障に対応するhookを外すと改善が失われることを確認した。元の成功例への回帰も全batchで調べた。


    確認した移植は未知の商品IDまでで、故障型は同じだ。'
  what_we_did_not_verify: LLM、learned engineer、patchコードの自由生成、GRPO、未知の故障への汎化、本番適用性は未検証。toyの規則が識別できる故障だけを作っているため、100%成功しても現実の汎用修正能力を意味しない。自由なruntime編集を本番へ導入するなら、権限の範囲と回帰評価を別途検証する必要がある。
  implementation: 'リポジトリのルートで `uv run papers/harness-r1/run.py` を実行する。Python標準ライブラリだけを使い、CPUで完了する。結果は同じディレクトリの `results.json`
    に保存する。


    乱数を使う実験はseedを固定した。数値は論文の測定値と別に集計している。'
  mapping: mapping.md
