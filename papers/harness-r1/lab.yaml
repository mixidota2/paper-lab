teaching_figures:
- kind: equations
  id: patch-reward
  title: 失敗の記録だけを見せ、採点は全課題で行う
  after: method
  caption: 修正役は失敗した課題の記録だけを読みます。採点には元は成功した課題も含めます。
  source: https://arxiv.org/pdf/2608.02276v1
  locator: 式1、Algorithm 1
  rationale: 修正役は失敗した課題の記録だけを読みます。採点には元は成功した課題も含めます。
  steps:
  - name: 同じ全課題の報酬差
    formula: Δ_B(P) = meanᵢ∈B [Rᵢᴾ − Rᵢ⁰]
    explanation: 修正後の報酬から修正前の報酬を引き、同じ課題すべてで平均します。元は成功した課題を失敗させれば、その悪化も入ります。
  - name: 同じ記録から作った8候補の比較
    formula: A_k = (r_k − μ_B) / σ_B ; K=8
    explanation: 各候補の報酬を、8候補の平均と標準偏差でそろえます。その値を使って、修正役の重みだけを更新します。
