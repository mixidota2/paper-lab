question: 失敗の記録を見せると、別のモデルが実行コードの直し方を学べるか
summary: 著者らは課題を解くモデルの重みを固定し、実行コードを直す別のモデルを学習しました。修正前と修正後に同じ課題を解かせた結果、三つの環境を同じ重みで平均した成功率は44.3%から53.6%に上がりました。
