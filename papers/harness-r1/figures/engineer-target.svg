<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 625" role="img" aria-labelledby="title desc"><title id="title">修正を提案するモデルだけを学習する</title><desc id="desc">修正を提案するモデルだけを学習する。説明と出典はLab本文と図注を参照。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217661"/></marker></defs><rect width="440" height="625" rx="12" fill="#fafcf7"/><rect x="20" y="20" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="48" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">修正役の9Bモデルが失敗の記録を読む</text><text x="34" y="77" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">記録を見て、実行コードの変更を提案する</text><text x="34" y="102" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">教師付き学習の後、実行の結果でも学ぶ</text><path d="M220,124 L220,148" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="158" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="186" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">確認した修正を実行コードに反映する</text><text x="34" y="215" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">開始時・判断前・行動直前・結果を受け取った後</text><text x="34" y="240" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">課題を解くQwen3.5-9Bの重みは固定する</text><path d="M220,262 L220,286" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="296" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="324" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">同じモデルに全課題を解き直させる</text><text x="34" y="353" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">もとは成功した課題も解き直し、悪化を数える</text><text x="34" y="378" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">報酬＝修正後と修正前の差を全課題で平均</text><path d="M405,399 L405,445" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><polyline points="405,445 35,445 35,565" fill="none" stroke="#217661" stroke-width="2"/><text x="55" y="490" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">この報酬で、修正役だけを学習する。</text><text x="55" y="515" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">課題を解くモデルの重みは変えない。</text><text x="55" y="540" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">初めての課題にも効くかは、別に確かめる。</text></svg>
