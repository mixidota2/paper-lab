<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 625" role="img" aria-labelledby="title desc"><title id="title">更新するのはengineerの重み</title><desc id="desc">更新するのはengineerの重み。説明と出典はLab本文と図注を参照。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217661"/></marker></defs><rect width="440" height="625" rx="12" fill="#fafcf7"/><rect x="20" y="20" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="48" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">失敗batch → 9B engineer</text><text x="34" y="77" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">失敗packetからoverlayを一度生成</text><text x="34" y="102" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">SFT → GRPOで編集方策を学習</text><path d="M220,124 L220,148" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="158" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="186" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">検証済みoverlay → runtime</text><text x="34" y="215" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">初期化 / 判断前 / 行動直前 / feedback後</text><text x="34" y="240" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">target Qwen3.5-9Bの重みは固定</text><path d="M220,262 L220,286" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="296" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="324" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">同じ全batchをtargetで再実行</text><text x="34" y="353" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">元の成功例も含めて回帰を測る</text><text x="34" y="378" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">reward = mean(R_patch − R_base)</text><path d="M405,399 L405,445" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><polyline points="405,445 35,445 35,565" fill="none" stroke="#217661" stroke-width="2"/><text x="55" y="490" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">改善rewardをengineerの学習へ戻す。</text><text x="55" y="515" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">target自身へは逆伝播しない。</text><text x="55" y="540" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">未見課題への転移は別途測定する。</text></svg>
