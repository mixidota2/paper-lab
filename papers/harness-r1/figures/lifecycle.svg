<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 650" role="img" aria-labelledby="title desc"><title id="title">一つの判断の周囲に入るhook</title><desc id="desc">一つの判断の周囲に入るhook。説明と出典はLab本文と図注を参照。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217661"/></marker></defs><rect width="440" height="650" rx="12" fill="#fafcf7"/><rect x="20" y="20" width="400" height="78" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="48" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">Episode init</text><text x="34" y="77" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">最初のcontext・memory・状態を準備</text><path d="M220,100 L220,129" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="140" width="400" height="78" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="168" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">Pre-decision</text><text x="34" y="197" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">判断前に手順と制約を入力</text><path d="M220,220 L220,249" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="260" width="400" height="78" rx="8" fill="#f7edda" stroke="none"/><text x="34" y="288" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">固定targetが行動を提案</text><text x="34" y="317" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">targetの重みを変えずに実行する</text><path d="M220,340 L220,369" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="380" width="400" height="78" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="408" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">Pre-action</text><text x="34" y="437" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">引数の正規化・書換え・拒否</text><path d="M220,460 L220,489" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="500" width="400" height="78" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="528" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">Post-feedback</text><text x="34" y="557" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">環境の返答を解析・停滞から回復</text><text x="20" y="621" font-family="sans-serif" font-size="16" font-weight="normal" fill="#193b36">feedback後は次の判断へ。hookを除去して比較。</text></svg>
