<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 650" role="img" aria-labelledby="title desc"><title id="title">実行の4箇所に処理を足す</title><desc id="desc">実行の4箇所に処理を足す。説明と出典はLab本文と図注を参照。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217661"/></marker></defs><rect width="440" height="650" rx="12" fill="#fafcf7"/><rect x="20" y="20" width="400" height="78" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="48" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">課題の開始時</text><text x="34" y="77" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">最初に使う情報と状態を用意する</text><path d="M220,100 L220,129" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="140" width="400" height="78" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="168" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">モデルが判断する前</text><text x="34" y="197" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">モデルに手順と制約を伝える</text><path d="M220,220 L220,249" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="260" width="400" height="78" rx="8" fill="#f7edda" stroke="none"/><text x="34" y="288" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">課題を解くモデルが操作を提案する</text><text x="34" y="317" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">モデルの重みは変えない</text><path d="M220,340 L220,369" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="380" width="400" height="78" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="408" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">提案された操作を実行する直前</text><text x="34" y="437" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">引数をそろえるか、操作を止める</text><path d="M220,460 L220,489" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="500" width="400" height="78" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="528" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">実行した結果を受け取った直後</text><text x="34" y="557" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">結果を調べ、止まっていれば次の判断を助ける</text><text x="20" y="621" font-family="sans-serif" font-size="16" font-weight="normal" fill="#193b36">返答を受けたら次の判断に進む。</text></svg>
