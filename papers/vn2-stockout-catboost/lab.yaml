teaching_figures:
- kind: equations
  id: mask-scale
  title: 欠品した週を除き、販売数の桁が違う商品をまとめて学習する
  after: method
  locator: §6.1–6.2
  rationale: 著者が販売履歴をどう加工してモデルに渡すかを式で示します。
  caption: 著者は直近53週で欠品していない週が45週以上あれば、その平均を使います。それまでは、観測を始めてからその週までの平均を使います。
  steps:
  - name: 在庫があった週の販売数を需要の代わりに使う
    formula: 'yᵉᶠᶠₜ = yₜ  （在庫あり）

      yᵉᶠᶠₜ = NaN  （欠品）'
    explanation: NaNはその週の需要が分からないという印です。需要が0個という意味ではありません。
  - name: 欠品しなかった週の販売数で、商品の尺度を求める
    formula: scaleₜ = max(53 × mean_nonmissing(yᵉᶠᶠₜ₋₅₂:ₜ), 1)
    explanation: 著者は欠品のない週の平均に53を掛け、結果が1より小さければ1とします。販売履歴から作った数値と、学習で予測する需要の値をこの尺度で割ります。
  - name: 予測する週ごとに別のモデルを学習させる
    formula: D̂ₜ₊ₕ = scaleₜ × CatBoostₕ(featuresₜ),  h ∈ {1,2,3}
    explanation: 著者はhが1、2、3のそれぞれにCatBoostを学習させます。予測時は尺度を掛けて元の個数に戻します。
  source: https://arxiv.org/html/2601.18919
- kind: timeline
  id: arrival
  title: 今週末に注文した商品は3週先の初めに届く
  after: method
  locator: §2・§7
  rationale: 著者がどの週の需要予測を、発注量の計算のどこで使うかを示します。
  caption: 注文してから届くまでの2週間に、過去の注文が入荷し、販売で在庫が減ります。図では発注数を整数にする処理や費用の係数は示していません。
  rows:
  - label: t週末
    nodes:
    - title: 注文量を決める
      text: 著者は手元の在庫、過去に注文してまだ届いていない数量、3週分の需要予測を使います。
  - label: t+1 / t+2
    nodes:
    - title: 商品が届くまでの在庫を見積もる
      text: その週に届く数量を足して、需要予測を引きます。需要のほうが多ければ、翌週へ持ち越す在庫は0個です。
  - label: t+3週の開始
    nodes:
    - title: 今回の注文が到着
      text: 発注量は、費用から求めた目標在庫と、今回の注文が届く直前に残る在庫との差で決まります。到着前の在庫が目標以上なら注文しません。
  source: https://arxiv.org/html/2601.18919
