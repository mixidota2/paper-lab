summary: |-
  VN2の勝者は欠品週の販売数を需要の代わりに使わず、1週先から3週先までを3つのCatBoostで予測しました。商品が届く直前の在庫と欠品・保管の費用を見て発注量を決め、公式シミュレーションの費用を基準方式より13.2%減らしました。
figures: []
core_idea:
  author_claim: |-
    著者は予測する週ごとにCatBoostを1つずつ用意し、どのモデルも全店舗・商品の販売履歴で学習させました。欠品した週の販売数は欠損です。著者は在庫があった週の販売数を使って特徴量を作り、費用の比から求めた目標在庫と到着前に残る在庫の差で発注量を決めました。

    [一次資料：§2、§6、§7](https://arxiv.org/html/2601.18919v1)
  research_bot_interpretation: |-
    欠品週を除いても、その週に何個売れたはずかは分かりません。需要の多い週ほど欠品しやすいなら、残った週の平均は全週の需要の平均より低くなり得ます。
sections:
  overview: |-
    VN2の在庫計画コンテストでは、2週間後に届く商品を毎週発注し、欠品と保管にかかる費用の合計を競います。著者は、欠品した週の販売数を需要の代わりに使いませんでした。1週先、2週先、3週先の需要を予測するCatBoostを1つずつ、計3つ学習しました。どのモデルも、全店舗・商品の販売履歴をまとめて学んでいます。著者は商品が届く直前の在庫を見積もり、欠品と保管の費用に応じた目標在庫との差から発注量を決めました。

    著者の方式は、公式シミュレーション全6回の総合で1位でした。季節性を考慮した13週の移動平均で需要を予測し、4週間分の在庫を確保する基準方式と比べ、評価に使った費用は4.334ユーロから3.763ユーロへ13.2%下がりました。実店舗で測った結果ではありません。
  problem: |-
    店に8個しかなければ、20個の需要があっても販売数は8個で止まります。販売数をそのまま需要として学ぶと、よく欠品する商品ほど需要を低く見積もり、その予測で次の発注を減らすおそれがあります。

    VN2で週末に発注した商品が届くのは、3週先の初めです。それまでの2週間に、過去の注文が入荷し、販売で在庫が減ります。著者は商品が届く直前に残る個数を見積もって、発注量の計算に使いました。
  why_it_might_work: |-
    大量に売れる商品は、同じ割合の予測誤差でも、個数の差が大きくなります。店舗と商品の組ごとに需要の値の尺度をそろえると、大量に売れる商品の誤差ばかりが学習に影響するのを抑えられると著者は考えました。また、需要予測が同じでも、欠品をどれほど避けたいかで発注量と費用は変わります。モデルの予測誤差と、発注後にかかる費用は別々に比べる必要があります。
  evidence: |-
    著者は公式シミュレーションの全6回で総合1位だったと報告しています。13.2%の費用差は、季節性を考慮した13週の移動平均と4週間分の在庫を使う基準方式との比較です。需要を予測してから発注するまでの方式全体を比べたため、CatBoostや欠品週を除く処理だけで費用がどこまで下がったかは判断できません。

    [一次資料：§2.3、§6、§7、§8](https://arxiv.org/html/2601.18919v1)
  executable_understanding: |-
    この実験は8週分の需要をあらかじめ決め、各週に用意する在庫の数を変えます。在庫を使い切った週は、需要が在庫を上回ったかを販売記録だけでは判断できません。8週すべての販売数の平均と、在庫を使い切った週を除いた販売数の平均を比べます。除外後に1週も残らなければ、平均は出せません。

    `uv run papers/vn2-stockout-catboost/run.py` を実行すると、在庫数を変えた全条件の結果が `results.json` に入ります。
  results: |-
    各週の在庫を20個にすると、8週の需要の平均は20個ですが、8週の販売数の平均は19.375個です。在庫を使い切らなかった3週に絞ると、販売数の平均は約18.33個になります。需要が大きかった週が除かれたため、残った週の平均は全8週の需要の平均より低くなりました。在庫を22個にすると、全週で需要と販売数が一致します。それでも22個売れた2週を除くと、残った6週の平均は19.3333個です。ここで使ったのは架空の需要で、VN2のモデルや発注の成績ではありません。
  what_we_verified: |-
    **メカニズム：PARTIAL（部分的）**。Labでは、在庫を使い切った週を除くと残った週の平均を計算できることを確かめました。ただし、残った週の平均は8週全体の需要の平均を表しません。全週で在庫を使い切ったときは、計算に使える週が残りません。
  what_we_did_not_verify: |-
    Labでは、公式の在庫シミュレーターを動かしたり、CatBoostを学習したりしていません。店で別の商品を買う行動や、売れずに終わった個数、発注の最小単位、配送の遅れも再現していません。競技で下がった費用を、そのまま実店舗の削減幅とはみなせません。
  implementation: |-
    `run.py` は、標準ライブラリだけで動く `papers/_toy_common.py` の計算を呼び出します。計算の対象は、各週に同じ在庫数を用意したときに8週分の架空の需要のうち何個売れるかです。図と表の説明はVN2用の `run.py` が付けます。CatBoost、商品の規模をそろえる処理、2週間の配送、費用に応じた発注量の計算は含めていません。
  mapping: |-
    | 対象 | 原典とLabで扱う範囲 |
    | --- | --- |
    | 論文 | [競技の条件、予測モデル、発注規則](https://arxiv.org/html/2601.18919v1) |
    | 記事の図と数式 | 著者の方法を説明するために作った。公式の実装ではない。 |
    | 操作図の数字 | `run.py` が `papers/_toy_common.py` の計算を呼び、結果を `results.json` に書く。 |
    | 公式コード | Labでは公式実装と各行を比べていない。 |
  method: method.md
question: |-
  欠品した週の販売数では需要が分からないとき、次の発注量をどう決めるか
interactives:
- kind: explorer
  title: 在庫を使い切った週を除くと、販売数の平均はどう変わるか
  caption: 8週分の架空の需要は変えず、毎週の在庫の上限だけを変えます。在庫を使い切った週は、売れた数だけでは、需要が在庫と同じだったのか、それを上回ったのかが分かりません。この図ではその週を除き、残った週の販売数を平均します。1週も残らなければ、平均は出せません。
