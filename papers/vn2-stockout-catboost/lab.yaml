teaching_figures:
- kind: equations
  id: mask-scale
  title: 欠品を欠損へ変え、系列の規模をそろえる
  after: method
  locator: §6.1–6.2
  rationale: モデル前処理が方法の核心。
  caption: 式は論文の表記を整理。初期の短い履歴には拡大窓平均のwarm-startを用いる。
  steps:
  - name: 販売をそのまま目的変数にしない
    formula: 'yᵉᶠᶠₜ = yₜ  （在庫あり）

      yᵉᶠᶠₜ = NaN  （欠品）'
    explanation: NaNは0個の需要ではない。実効需要は観測できた週の販売を使う代理値。
  - name: 53週の規模で割る
    formula: scaleₜ = max(53 × mean_nonmissing(yᵉᶠᶠₜ₋₅₂:ₜ), 1)
    explanation: 十分な非欠品履歴がある場合の式。特徴と目的変数を同じ尺度へそろえる。
  - name: 3つの予測先を直接学習
    formula: D̂ₜ₊ₕ = scaleₜ × CatBoostₕ(featuresₜ),  h ∈ {1,2,3}
    explanation: 各hは別の回帰器。h=1の予測値をh=2へ入力する再帰予測ではない。
  source: https://arxiv.org/html/2601.18919
- kind: timeline
  id: arrival
  title: 今日の発注が効くのはt+3週の開始
  after: method
  locator: §2・§7
  rationale: 予測と意思決定を時間軸で接続する。
  caption: 論文の配送条件。図では在庫投影の細かな丸めや費用係数を省略する。
  rows:
  - label: t週末
    nodes:
    - title: 注文量を決める
      text: 手持ち・輸送中在庫と3週分の需要予測を参照。
  - label: t+1 / t+2
    nodes:
    - title: 到着前の在庫を投影
      text: 予測需要による消費と予定入荷を反映。
  - label: t+3週の開始
    nodes:
    - title: 今回の注文が到着
      text: 到着時の残在庫を目標在庫と比べて不足分を補う。
  source: https://arxiv.org/html/2601.18919
