question: 期限間近の値引き品が売れたとき、値引きが本当に増やした販売数は分かるか
summary: 欧州の食品小売676店舗を調べた著者は、多くの商品で、値引き品が売れた日の総販売数が基準の予測を上回ったと報告した。ただし、値引き価格で売れた数は総販売数の一部であり、値引きそのものが販売を増やしたとは限らない。Labでは、売れた数が同じでも、値引きで増えた数が異なる二例を比べる。
