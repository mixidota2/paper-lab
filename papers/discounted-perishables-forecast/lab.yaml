teaching_figures:
- id: residual-and-markdown-count
  kind: timeline
  title: 二つの回帰は、値引き品が売れたかどうかで行を分ける
  after: method
  source: https://arxiv.org/html/2602.04464v1
  locator: §3・式1〜3
  rationale: 値引きの有無を記録した実験ではなく、販売結果で二つの集合を作ることを示す。
  caption: 1行は、商品の種類、店舗、営業日の組み合わせ。二つの回帰で使う曜日、予測と朝の在庫は同じ。
  rows:
  - label: 値引き販売が0個
    nodes:
    - title: 基準を学習する
      text: 実際の総販売数を曜日・予測・朝の在庫から推定する。
  - label: 値引き販売が1個以上
    nodes:
    - title: 総販売数から基準を引く
      text: 実際の総販売数から1本目の回帰の予測を引く。
    - title: 残差を回帰する
      text: 曜日・予測・朝の在庫と値引き販売数を並べ、残差との傾きを求める。
- id: total-is-regular-plus-discounted
  kind: equations
  title: 総販売数と通常価格の販売数では、傾きが1だけ違う
  after: results
  source: https://arxiv.org/html/2602.04464v1
  locator: §3・式1〜3からのLabの算術
  rationale: 値引き販売数が結果の内訳でもあることを明示する。
  caption: 同じ行と同じ説明変数で回帰した場合の関係。値引きの因果効果を表す式ではない。
  steps:
  - name: 総販売の内訳
    formula: Y = R + D
    explanation: 総販売数Yは、通常価格での販売数Rと値引き販売数Dの合計。
  - name: Dの係数の関係
    formula: slope(Y ~ X + D) = 1 + slope(R ~ X + D)
    explanation: Xは曜日、予測、朝の在庫。左右とも同じ観測行を使い、説明変数XとDは変えない。
