core_idea:
  author_claim: 著者は、値引き品が売れた日の総販売数を予測と比べた。多くの商品で、実際の販売数が基準の予測を上回っていた。著者は、値引き販売のうち通常需要として数える割合を、すべての商品で一律に決める運用を見直すよう提案した。
  research_bot_interpretation: 店が何個に値引きシールを貼ったかは、値引き品が何個売れたかからは分からない。値引き品を買った人が、通常価格でも買ったかどうかも分からない。Labは、販売数の内訳を回帰した結果だけで、通常需要に何個を含めるかは決められないと考える。
sections:
  overview: |-
    著者は、期限が近い食品の値引き販売のうち、どれだけを通常需要に含めるかを調べました。欧州の食品小売676店舗のデータを使い、値引き品が1個も売れなかった記録から、商品別に販売数を予測する式を作りました。次に、値引き品が売れた記録を使い、実際の総販売数と予測との差が、値引き価格で売れた個数とどう関係するかを回帰で調べました。

    図2(a)に掲載した1,077品目のうち92.2%では、商品ごとの平均で、総販売数が予測を上回りました。一方、データには店が何個を値引き価格で出したかは記録されていません。値引きの有無を無作為に決めた研究でもないため、予測との差から、値引きで増えた販売数は分かりません。
  problem: 店は翌日の発注に使う需要予測で、通常価格なら何個売れるかを見積もる。値引きしたから売れた分まで通常需要として数えると、発注しすぎるおそれがある。通常価格でも売れた分まで除くと、店は必要な数より少なく発注するおそれがある。
  method: method.md
  why_it_might_work: 曜日、店が使っていた予測値、朝の在庫数を回帰に入れると、その三つが同じ条件で、基準より何個多く売れたかを比べられる。ただし、著者は値引き品が売れた日と売れなかった日を、期限までの日数などもそろえて比べたわけではない。
  evidence: evidence.md
  executable_understanding: experiment.md
  results: 人工例の一つ目では、値引き品が売れた日に値引きによって販売数が平均2個増え、残差を使った回帰の傾きは1だった。二つ目では、もともとよく売れる日に値引き品も売れただけで、値引きによる増加は0個だった。それでも、記録に残る販売数は一つ目と同じなので、回帰の傾きも同じ1だった。通常価格で売れる分がそのまま値引き品に置き換わった三つ目では、総販売数は変わらず、傾きは0だった。
  what_we_verified: 'CONFIRMED：Labは人工例で二段階の回帰を実行した。同じ記録と説明変数を使えば、目的変数を残差から総販売数に替えても、値引き販売数の係数は変わらなかった。実装と論文の対応を確認できた範囲は一部（PARTIAL）。'
  what_we_did_not_verify: Labは著者の非公開データを入手しておらず、個別のt検定も再計算していない。値引きすることで実店舗の売れ行き、廃棄、利益、予測や発注の結果がどう変わるかは調べていない。値引き幅を変えた場合の比較も行っていない。
  implementation: Pythonのスクリプトは、標準ライブラリを使って人工例を最小二乗法で解く。ブラウザでも、JavaScriptが同じルールでデータを作り、回帰を計算する。実行コマンドはREADMEに掲載した。
  mapping: mapping.md
