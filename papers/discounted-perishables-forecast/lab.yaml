question: 期限間近の値引き品が売れたとき、値引きが本当に増やした販売数は分かるか
summary: 著者が集計した商品では、値引き品が売れた日の販売が基準の予測を上回る商品が多かった。だが、値引き品が売れた数は総販売数の一部だ。同じ正の傾きでも、値引きで販売が増えた場合と、売れ行きのよい日に値引き品も売れただけの場合がある。Labでは同じ観測値が生まれる二例を比べる。
source_review:
  checked: '2026-11-25'
  url: https://arxiv.org/html/2602.04464v1
  scope: 一次資料の§2〜5、式1〜3、図2、版の日付を照合した。元データと著者コードは未確認。
verification:
  mechanism: PARTIAL
  performance: NOT TESTED
  scaling: NOT TESTED
  production_applicability: NOT TESTED
core_idea:
  author_claim: 欧州の食品小売の観測データでは、値引き品が売れた日の総販売数が基準の予測を上回る商品が多かった。著者は、値引き販売を通常需要に戻す割合を全商品で一律にする考え方を見直すよう提案する。
  research_bot_interpretation: 値引き品が何個売れたかは、店が何個を値引きの対象にしたかとは違う。総販売数に含まれる値引き販売数との関係だけでは、通常需要として何個を残すべきかは決められない。
sections:
  overview: |-
    著者は、期限が近い食品の値引き販売を、通常の需要予測にどのように含めるかを調べました。欧州の食品小売676店舗で、値引き価格で売れた個数がゼロの日の記録から、商品ごとに販売数の基準を作りました。値引き品が売れた日の総販売数を基準と比べると、図2(a)に載った1,077商品のうち92.2%で、実績は予測を平均で上回りました。ただし、値引きの有無を無作為に決めた研究ではなく、この差から値引きで販売が何個増えたかは分かりません。
  problem: 店が翌日の発注を決めるとき、値引きがなければ買わなかった分まで通常需要に足すと、在庫を多く持つ可能性がある。反対に、値引きがなくても買う人の分まで除けば、通常需要を低く見積もりうる。
  method: method.md
  why_it_might_work: 曜日、店の予測、朝の在庫を使うと、その条件で普段どれだけ売れるかを記録から見積もれる。ただし、値引き品が売れなかった行と売れた行で、売れ行きに影響する条件をすべてそろえたわけではない。
  evidence: evidence.md
  executable_understanding: experiment.md
  results: 最初の二つの人工例では残差を使った回帰の傾きは同じ1だが、値引きが増やした販売数は平均2個と0個に分かれる。通常価格から値引きへ同じ個数が移るだけで、総販売数が変わらない場合、傾きは0になる。
  what_we_verified: 'CONFIRMED：人工例で二段階の回帰を実行し、同じ説明変数なら総販売数を使っても値引き販売の傾きが変わらないことを確認した。論文の方法との対応はPARTIAL。'
  what_we_did_not_verify: 著者の非公開データや個別のt検定、値引きの因果効果、廃棄や利益の変化、実店舗の予測・発注での性能は検証していない。値引き幅を変えた場合の比較も含めない。
  implementation: Python標準ライブラリで人工例の最小二乗法を計算する。画面は同じデータの作り方と回帰をJavaScriptで実行する。実行手順はREADMEを参照。
  mapping: mapping.md
