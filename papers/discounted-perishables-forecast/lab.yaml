- id: total-is-regular-plus-discounted
  kind: equations
  title: 総販売数を使うと、通常価格で売れた数を使うより傾きが1大きい
  after: results
  source: https://arxiv.org/html/2602.04464v1
  locator: §3・式1〜3からのLabの算術
  rationale: 総販売数には、説明変数に使った値引き販売数も含まれている。
  caption: Labは同じ記録と説明変数を使い、目的変数だけを替えて比べた。式は値引きが販売数を何個増やしたかを表さない。
  steps:
  - name: 総販売の内訳
    formula: Y = R + D
    explanation: 総販売数Yには、通常価格で売れた数Rと値引き価格で売れた数Dの両方が入る。
  - name: Dの係数の関係
    formula: slope(Y ~ X + D) = 1 + slope(R ~ X + D)
    explanation: Xは曜日、店の予測値、朝の在庫数を表す。左右で同じ記録を使い、説明変数XとDはそのままにする。
