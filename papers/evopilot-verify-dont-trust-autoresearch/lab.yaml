question: 二つの実験結果をモデルの比較に使うには、何をそろえればよいか
summary: 著者は動画検索モデルの再採点を評価し、出力件数がそろわない比較を退けました。重みと出力件数を固定した比較では、再採点による当たり率の伸びは3.20ポイントです。別のオンライン実験では、選んだモデルの指標が相対で0.66%上がりました。
