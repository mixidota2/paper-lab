core_idea:
  author_claim: 著者は実験の終了とモデルどうしの比較の成立を分けます。担当者が実行前に条件を決め、終了後に成果物から読み取った条件と照合します。条件が違うか必要な証拠がなければ、その差をモデルの効果として扱いません。
  research_bot_interpretation: '[AURA](aura-disney-agentic-rec-diagnosis.html)はモデルのどこを調べるかを考えます。[PILOT](pilot-experiment-lifecycle.html)は実験を途中で止めたり再開したりします。EvoPilotが扱うのは、その結果を比較に使えるかどうかです。[AgentX](agentx-kuaishou.html)のように結果を見て変更を採用する場合にも、先に比較条件を確かめられます。'
sections:
  overview: |-
    EvoPilotは、ある動画の後に見る動画を探す検索モデルの開発で、実験結果を公平に比べるための仕組みです。担当者が実験計画を承認し、実行後には計画どおりの出力が得られたかを確かめます。実行が最後まで終わっても、指標の測り方が両群でそろっていなければ、モデルの良し悪しは判断できません。

    候補を再採点する部分を追加した初期実験では、当たり率が22ポイント下がったという結論が出ました。しかし、両群が同じ候補数を指定したにもかかわらず、実際に評価に使った候補数は異なっていました。最初に問題を見つけたのは人の確認で、自動検査を強化したのはその後です。評価条件をそろえた後の別のオフライン比較では、著者は当たり率が3.20ポイント上がったと報告しています。
  problem: 実験に使ったコードが分かり、両条件で指標が一つずつ得られても、数値が同じものを測ったとは限りません。たとえば、再採点を切った条件だけが候補を3000件返し、オンにした条件は600件しか返さないとします。3000件の中の方が正解を含めやすく、両群の当たり率の差を再採点の効果としては読めません。
  why_it_might_work: EvoPilotではエージェントが実験を提案し、人が共通条件と変えてよい項目を決めます。実行後には、提案者とは別の検査が成果物を読みます。次回も条件を守れるよう、過去の注意書きを出力件数などの照合に使う検査へ変えます。それでも、出力の数え方が意図した指標に合うかは人が確かめます。
  evidence: |-
    一次資料は[原論文 §5・表1〜6](https://arxiv.org/html/2609.21257v1)です。以下は著者の報告です。

    著者は約37日間に7つの研究の方向を調べ、担当者が20回の実験計画を承認しました。運用記録がそろう9回では、29条件すべてで終了状態が残り、27条件で科学的な結果を得ました。残る2条件はメモリ不足でした。27/29は記録がそろう部分の値で、全20回の成功率ではありません。この9回で記録された作業は、学習22回、評価用の公開22回、評価27回の計71工程です。条件によっては、学習せず既存の成果物を使って評価だけを行いました。

    再採点の初期実験では両群とも上位3000件を集めて600件を返す設定でしたが、再採点なしの評価器は3000件を残しました。再採点ありは600件でした。当たり率が22ポイント落ちたように見えても、著者は再採点の効果とは認めません。著者は対照側でKを600から1に変えても当たり率がほぼ動かないことを確かめ、候補を評価器に渡すときと指標を計算する直前の両方でK件に絞る処理を足しました。

    修正後に両群を3000件から600件に絞った比較では、当たり率が4.8ポイント上がりました。この試行は元のモデルも変更したため、複数の変更をまとめた差です。さらに後の比較では学習済みの重みと最終3000件を固定しました。再採点なしは候補3000件、ありは6000件です。再採点なしなら候補を増やしても上位3000件が変わらないため、著者はこの運用点で再採点を有効にした効果を3.20ポイントと報告しました。比較の条件を変えても同じ差が出るとは示していません。別の比較で使った±0.36ポイントは運用上のばらつきの目安で、信頼区間ではありません。

    別の本番A/Bテストではアカウントを無作為に分け、7日間の結果を別の7日間の事前データで調整しました。米国とカナダで対象となる動画検索セッションのうち、定めた利用行動を満たした割合（GSRR）は相対で0.66%上がりました。0.66ポイントではありません。また、利用者に出したモデルの効果であり、EvoPilotを使うと開発が速くなることを測った実験ではありません。悪影響を確認する指標の値は、著者が分析に使ったデータには残っていません。著者によると、テスト後に再採点が既定になりましたが、切り替え後の効果は別に測っていません。

    著者は保存した正常な比較と、条件や証拠を壊した比較を10組用意しました。検査は正常な10件を通し、不成立の10件を退けました。このうち3組は研究期間後に加えた検査を再現したものです。最初の件数の誤りは人が見つけており、この再現だけで現場の見逃し率や誤って退ける率は分かりません。
  executable_understanding: 配布の `run.py` をPythonで実行します。指定した最終件数が1件の場合と600件の場合で当たり率が変わるかを、同じ100件の人工データで比べる例です。もう一つの例では再採点のオン・オフだけを変更してよいと決め、二つの実験の記録を六通り比較します。
  results: 指定件数を無視する評価器はどちらの指定でも3000件を残し、正解を100件中100件含みます。指定を守る評価器では、1件を残すと100件中1件、600件を残すと100件中20件が当たります。比較の例では、機械検査は条件がそろう1組を通し、残り5組を退けました。退けた理由は、最終件数が違う、評価器が違う、データが違う、許可した変更が行われていない、証拠が足りない、の五つです。許可外の違いがないだけでは不十分です。検査は、許可した変更が実際には起きていない場合も拒否します。人の確認は未実施のままです。
  what_we_verified: 人工例では指定を600件から1件に減らしても、壊れた評価器の当たり率は変わりません。出力件数を確認すると、指定が反映されていないと分かります。二つの実行記録を照合し、五つの不成立の比較を退けることも確かめました。機械検査と人の判断を分ける仕組みのうち、実行したのは機械検査までです。
  what_we_did_not_verify: Labは本番の学習、数億件の動画索引、37日間の運用を再現していません。著者が報告した当たり率の3.20ポイント増とオンライン指標の相対0.66%増も再測定していません。人工例の記録から計算したハッシュは、遠隔の成果物が本物であることを証明しません。
  implementation: '`evaluate()` は候補の順位と件数から当たり率を計算します。`verify()` は両群の実行記録を読み、必要な項目、終了状態、変更した項目を確認します。`durable_record` には両群の記録、許可した差分、判定、人の確認状況を保存します。遠隔での実行と再開、同時更新の制御、操作権限はこの例に含めていません。'
  method: method.md
  mapping: mapping.md
teaching_figures:
- kind: timeline
  id: incident
  title: 出力件数を直し、再採点の効果を測り直す
  after: evidence
  locator: §5.2–5.3 / Table 6
  rationale: 同じ当たり率でも、比較の条件が違うと意味が変わります。
  caption: 原論文の著者報告です。Labの人工例から得た値ではありません。
  source: https://arxiv.org/pdf/2609.21257v1
  rows:
  - label: 最初の比較
    nodes:
    - title: 設定はどちらも600件
      text: 再採点なしの評価器だけが3000件を残した。
    - title: 見かけ上22ポイント減
      text: 条件がそろわず、再採点の効果にはできない。
  - label: 原因の確認
    nodes:
    - title: 人が比較を確認
      text: 指標に入れた実際の件数が違うと分かった。
    - title: Kを1にして試す
      text: 旧評価器の当たり率はほぼ変わらなかった。
  - label: 評価器の修正後
    nodes:
    - title: 4.8ポイント増
      text: 元のモデルも変更したため、再採点だけの差ではない。
    - title: 3.20ポイント増
      text: 重みと最終件数を固定し、選んだ運用点で再採点を比較した。
  - label: 別の検証
    nodes:
    - title: オンラインで相対0.66%増
      text: 選んだモデルを7日間のA/Bテストで比較した。
    - title: 事後に自動検査を試す
      text: 保存した例を使い、新しい検査が件数の誤りを退けるか確認した。
- kind: equations
  id: admission
  title: 比較に使う前に、機械と人が別のことを確かめる
  after: method
  locator: Eq. 3 / §5.1
  rationale: 機械は実行記録を照合し、人は指標の意味を確かめます。
  caption: 原論文の比較条件とオンライン指標を読み解くための式です。
  source: https://arxiv.org/pdf/2609.21257v1
  steps:
  - name: 二つの実験を比較に使う条件
    formula: A(c,t;R) = 1[VerifyR(c,t)] × 1[ReviewR(c,t)]
    explanation: 機械検査と人の確認が両方通ったときだけ使います。
  - name: 実際の利用で測る割合
    formula: GSRR = qualifying eligible pivot sessions / eligible pivot sessions
    explanation: 対象セッションのうち、定めた利用行動を満たす割合です。
  - name: 比較群を基準にした相対差
    formula: lift = (GSRRt − GSRRc) / GSRRc
    explanation: 差を比較群の割合で割るため、0.66%増と0.66ポイント増は異なります。
- kind: matrix
  id: proof-layers
  title: 実験が終わっても、比べられるとは限らない
  after: problem
  locator: Table 1 / §4.2
  rationale: 実験の完了、出所、比較条件、指標の意味を別々に確認します。
  caption: 原論文の表1と第4.2節をもとに、どこまで判断できるかを整理しました。
  source: https://arxiv.org/pdf/2609.21257v1
  columns:
  - 確認できること
  - まだ保証しないこと
  rows:
  - label: 実験の完了
    cells:
    - 実験が終わり、指標が残った。
    - 二つの実験が同じ条件で指標を測ったか。
  - label: 使ったコードと設定の記録
    cells:
    - 実際に使ったコードや設定をたどれる。
    - 変更した項目が事前に許可されていたか。
  - label: 比較条件の機械検査
    cells:
    - 成果物を読み、許可した違いだけが生じたか確かめる。
    - 指標が意図したものを測っているか。
  - label: 人による確認
    cells:
    - 指標の意味や例外を判断する。
    - 次の実験で起きるすべての誤りを防げるか。
