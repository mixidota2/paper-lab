summary: ReSTは、行動履歴を使う側の予測にも正解から直接勾配が届くようにして学習する。配信時は、同じ要求に含まれる候補が行動履歴の計算結果を共有する。
figures: []
core_idea:
  author_claim: |-
    ReSTは、各行動のValueをまとめる前とまとめた後に別々の重みを掛ける。行動の順番と経過時間は別の回転埋め込みで表し、残差の正規化で深いモデルの学習を安定させる。

    学習時は主損失に、履歴を使う側でコンバージョン率を予測する損失と、履歴側と非系列側の表現をそろえる損失を加える。配信時は、計算量の大きい履歴エンコーダーを配信要求につき1回実行し、各候補のデコーダーに同じ出力を渡す。

    [一次資料：§2.3–2.6・§3.4–3.5](https://arxiv.org/html/2609.01240)
  research_bot_interpretation: Labでは、入力する行動の件数を増やすことと、学習中に履歴を処理する部分へ直接勾配が届くことを別に考える。UniPinRecは推薦の異なる段階をまたいで計算を共有する。一方、ReSTは順位付けの段階で、同じ配信要求の候補に履歴の計算結果を使い回す。共有する範囲が違うので、二つの手法が競合するとは限らない。
sections:
  overview: |-
    ReSTは一人の利用者の履歴を何度も読み直す代わりに、1回の計算結果を複数の候補広告で使い回す順位付けモデルです。候補ごとに異なる部分だけを別に計算します。学習では、通常の順位付けの目標に加えて、履歴を処理する部分にも直接信号が届くようにしました。

    広告を実際に配信した1週間のA/Bテストで、順位付けの精度指標AUCは1.31%、収益に関連する指標Advvは11.93%上がりました。応答時間は99パーセンタイルで50 ms以内でした。数値は複数の変更を組み合わせたシステム全体の比較で、補助的な学習だけの効果や、実収益の増加率ではありません。
  problem: |-
    推薦に使う行動には、たまたま押したクリックも含まれる。行動と行動の間は数秒のことも数日のこともあり、文章の次の単語を予測する場合のように、各位置に正解ラベルがそろっているわけではない。

    行動履歴以外の属性だけで正解を予測できると、モデルはその情報を使って主損失を下げられる。履歴の中に役立つ情報があっても、それを処理する部分に十分な学習信号が届かないことがある。著者はこの状態をsequence starvationと呼ぶ。入力を長くするだけでは、履歴を使う学習信号は増えない。
  why_it_might_work: 履歴を使う側の予測を正解と直接比べると、主ヘッドが履歴以外の特徴だけで正解に近づいた後も、その側に勾配を送れる。ただし、主損失と補助損失の勾配は同じ向きとは限らない。学習に使っていないデータで予測が良くなるかは、データや損失の重みによって変わる。
  evidence: |-
    ### 学習中の勾配と、配信で繰り返す計算

    著者は図2で、履歴側のCVR損失の重みを0.1にすると、履歴エンコーダーの平均勾配ノルムが3倍を超えたと報告した。§3.4では損失や構成を変えた場合の精度も比べた。勾配ノルムの比は行動履歴に学習信号が届いたことを示すもので、オンラインのAUCや収益の増加率ではない。

    同じ利用者の履歴を学習で使い回す処理を、すでに最適化した学習基盤に加えると、著者の条件では処理できる学習データ量が同じ時間で5.8倍になった。本番側では、候補間の共有によって、一つの配信要求に対する系列処理部分の推論コストを最大で約20分の1に抑えた。5.8倍と20分の1は、学習と配信の別々の測定だ。システム全体の応答が20倍速くなったわけではない。

    ### TikTok Shop Adsの本番テスト

    著者は利用者を無作為に割り付け、1週間のA/Bテストで処置群に本番トラフィックの20%を割り当てた。既存のDLRMを対照にし、処置群では、そのモデルの行動履歴を扱う部分をReSTに換えた。P99の応答時間の予算は50 msで、著者によれば提案構成はこの条件を満たした。

    著者は、配信中に測ったAUCが+1.31%、広告主価値の指標Advvが+11.93%だったと報告した。Advvの差はp<0.01だった。比較したのはReSTの構成全体で、履歴側の補助損失だけを変えた実験ではない。Advvは収益に関係する指標で、実際の売上や広告主の利益の増加率とは区別する。

    [一次資料：§2.5–2.6・図2・§3.4–3.5・表5](https://arxiv.org/html/2609.01240)
  executable_understanding: |-
    Labは履歴以外の特徴を使う主予測が、すでに正解に近い一例を計算した。正解は1、履歴を使う側の予測は0.20、主予測は0.92だ。この地点で予測値を固定し、履歴側の予測が少し変わったときに二乗損失がどう変わるかを求める。論文の損失は二値交差エントロピーであり、この小実験では二乗損失に置き換えた。実際のモデルの重みは更新しない。

    `uv run papers/rest-sequence-ranking/run.py` を実行すると、補助損失の重みごとの計算結果を `results.json` に保存する。
  results: |-
    重みλが0のとき、履歴側の予測値に対する主損失の勾配の絶対値は0.016だ。λを0.20にすると、補助損失も足した勾配の絶対値は0.336になる。この人工例では二つの勾配が同じ向きだったため、大きさが増えた。

    主予測が履歴側の予測の変化に逆向きに反応する別の人工例では、主損失の勾配を+0.024、重み0.015を掛けた補助損失の勾配を−0.024にできる。このとき足し合わせた勾配は0になる。最初の例とは条件が違い、ReSTの本番モデルで打ち消しが起きたという意味ではない。
  what_we_verified: Labは、予測値を固定した地点での計算で、二乗損失から履歴側の予測に届く勾配を比較した。二つの損失の勾配が同じ向きなら絶対値が増え、逆向きなら打ち消し合う条件があることを確かめた。機構の一部だけを確かめた実験であり、論文のモデルの学習後の精度は測っていない。
  what_we_did_not_verify: Labは実際のモデルで、どの履歴が役立つか、補助損失が学習後の精度をどれだけ変えるかを検証していない。履歴の長さ自体を比べるには、対象期間、行動の新しさ、ノイズの量もそろえる必要がある。モデルが特定の行動に依存するかを調べる場合は、履歴の差し替えや削除によって予測がどう変わるかを別に測る。
  implementation: |-
    リポジトリのルートで `uv run papers/rest-sequence-ranking/run.py` を実行する。Python標準ライブラリを使う。計算本体は `papers/_toy_common.py` のReST用の関数にあり、初期条件の集計とブラウザーで表示する全条件を同じ `results.json` に保存する。

    LabはTransformer、DGA、RoTE、SRNを実装せず、実際の行動データやGPUを使わない。
  mapping: |-
    | 何を読むか | 原論文とLabの対応 |
    | --- | --- |
    | 原論文の手法と評価 | [第2節と第3節](https://arxiv.org/html/2609.01240)で手法、部品を変えた比較、本番テストを説明する。 |
    | 手法の図と数式 | Labは原論文の仕組みを簡略化して描いた。公式実装ではない。 |
    | 人工例の計算 | `run.py` が `papers/_toy_common.py` のReST用の計算を実行し、結果を `results.json` に保存する。 |
    | 公式コード | Labは公式コードとの行単位の照合を行っていない。 |
  method: method.md
question: 行動履歴を読むモデルを、学習でも配信でも使えるようにするには何が必要か
