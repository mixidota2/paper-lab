teaching_figures:
- kind: architecture
  id: asymmetric
  title: 履歴を処理した結果を同じ配信要求の候補で使う
  after: method
  locator: 図1・§2.3–2.6
  rationale: 履歴側と候補側で分ける処理と、学習にだけ使う処理を示す。
  caption: Labは論文の図を元に、履歴エンコーダーTと候補デコーダーCを分けて示す。各候補は同じ配信要求で計算したHを参照する。
  rows:
  - label: 履歴の処理は配信要求ごとに1回
    nodes:
    - title: 履歴エンコーダーT
      text: TはDGA、RoPEとRoTE、SRNで行動履歴を処理し、Hを出力する。
  - label: 同じHを各候補のKeyとValueに使う
    nodes:
    - title: 候補AのデコーダーC
      text: Cは候補AのQueryでHを参照し、候補Aの表現を作る。
    - title: 候補BのデコーダーC
      text: Cは候補Aと同じHを使い、候補BのQueryで候補Bの表現を作る。
  - label: 配信時に動く主ヘッドと、学習専用の補助ヘッド
    nodes:
    - title: 主ヘッドでCVRを予測
      text: 主ヘッドは候補ごとの系列表現と、履歴を用いないDLRMの特徴を合わせる。
    - title: 学習時に補助ヘッドでCVRを予測
      text: 補助ヘッドは履歴で条件付けた出力と候補広告の特徴を使う。主ヘッドの非系列の利用者・文脈特徴は直接受け取らない。これに加え、系列側と非系列側の表現をそろえる損失も使う。
  source: https://arxiv.org/html/2609.01240
- kind: equations
  id: dual-gates
  title: 行動をまとめる前後の2か所で重みを掛ける
  after: method
  locator: 式(2)・(3)・(6)
  rationale: 履歴エンコーダーがアテンションの前後で重みを掛ける場所を示す。
  caption: Xは入力の行動系列、σはsigmoid、⊙は要素ごとの積。Wは学習する射影行列。
  steps:
  - name: 集約前のValueゲート
    formula: V′ = σ(XWgv) ⊙ (XWV)
    explanation: 個々の行動のValueに重みを掛け、その行動が集約結果にどれだけ入るかを調整する。
  - name: 因果attentionで集約
    formula: H = softmax(QKᵀ / √d + Mcausal) V′
    explanation: 因果マスクMcausalを使い、それぞれの位置から後の位置を参照できないようにする。アテンションの重みはsoftmaxで計算する。
  - name: 集約後の出力ゲート
    formula: DGA(X) = (H ⊙ σ(XWgo)) Wo
    explanation: 集約結果のどの成分を出力へどれだけ渡すかを調整する。集約前とは別のパラメーターを使う。
  source: https://arxiv.org/html/2609.01240
