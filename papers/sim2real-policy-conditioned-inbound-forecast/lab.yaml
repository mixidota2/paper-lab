summary: Amazon所属のWangらは、新しい発注ルールを模擬運用して入荷予測器を学習させました。導入済みの2事例を振り返ると、旧ルールの実績で学んだ同じ構造の予測器よりも、全商品の総入荷量を予測する誤差が点推定で小さくなりました。
question: 新しい発注ルールを使った実績がまだないとき、倉庫に届く総量をどう予測するか
