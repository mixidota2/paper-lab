summary: 発注ルールを替えると入荷量も変わる。新ルールで模擬した注文と入荷を学習データに使い、旧ルールの実履歴で学ぶ場合と比べた。Amazonの2事例で予測誤差の改善幅は異なった。
question: 発注ルールを替えた日の入荷量を、実績がそろう前にどう予測するか
