summary: "Amazonの著者らは、発注ルールを変更した二つの事例で、新ルールの模擬データと旧ルールの実績で学んだ入荷予測器を比べた。新ルールの実績に対する総入荷の予測誤差は、模擬データで学んだほうが点推定では小さかった。"
question: "新しい発注ルールの実績がない間に、そのルールで運用したときの入荷量をどう予測するか"
