question: 画像から補った検索語を、需要と購入へどう結び付けるか
summary: SAM-D2Qは商品画像とタイトルから検索語を生成し、AliExpressの転置索引を拡張する。21日間・4%トラフィックのA/BでGMV +3.38%、Pay
  Count +2.27%を報告した。GMVは方向を示す値で、有意差確認はPay CountとCVRに限られる。
source_review:
