- kind: equations
  id: new-terms
  title: 商品名にない単語を評価する報酬
  after: method
  caption: 学習時は商品の関連性、検索需要と購入の見込み、視覚属性を得点にする。条件を満たさない候補は報酬を0にする。
  source: https://arxiv.org/pdf/2609.04961v1
  locator: §4.1–4.3
  rationale: 検索語が商品名に加える情報に着目する。
  steps:
  - name: 新規語
    formula: Δ(q,Tᵢ) = Vq ∖ VTᵢ
    explanation: 生成した検索語のうち、商品名にない単語だけを商業価値の計算に使う。
  - name: 需要と購入
    formula: E(t,c) = PV(t,c) × CVR(t,c)
    explanation: 論文はカテゴリの平均成約率で平滑化し、検索PVを掛けた上で対数にする。カテゴリのPVに応じて全体の値を組み合わせる。
  - name: 複合報酬
    formula: U(q,i) = I_gate × (λ₁R_sem + λ₂R_biz + λ₃R_vis)
    explanation: 商品との関連性が低いか、有用な新しい語がない場合は報酬全体を0にする。GRPOは同じ商品から生成した候補の間で報酬を標準化する。
