question: SAM-D2Q：商品名にない検索語を画像から補う
summary: SAM-D2Qは商品画像と商品名から検索語を作り、AliExpressの既存の転置索引に加える。著者によれば、21日間の本番A/Bテストで決済件数は2.27%、成約率は0.53%増え、サービスの95%水準の確認を通過した。取引総額（GMV）の+3.38%は方向を示す値として報告された。
