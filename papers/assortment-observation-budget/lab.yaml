teaching_figures:
- id: observation-plan
  kind: timeline
  title: 提示の種類を先に固定し、観測後に最終集合を選ぶ
  after: method
  source: https://arxiv.org/html/2610.40557v1
  locator: §3、Theorem 5.1・6.1
  rationale: 観測予算と決定時点を混同しないための自作図。
  caption: (3,2,1)に限定したB/C。Aは観測しない。全て最終品揃えの評価。
  rows:
  - label: A：観測0
    nodes:
    - title: 収益順の区切り
      text: 除外側と包含側の最大損失を比較 → [2]
  - label: B：種類1
    nodes:
    - title: '[1]をm回'
      text: 購入割合 ≥ 2/3 → [1]、それ以外 → [2]
  - label: C：種類2
    nodes:
    - title: '[1]と[2]をτ回ずつ'
      text: 平均収益が最大の群。最大値 < 1なら[3]。余りは判断に不使用。
- id: exact-expectation
  kind: equations
  title: 一つの観測経路から、確率で重み付けした後悔へ
  after: evidence
  source: https://arxiv.org/html/2610.40557v1
  locator: §2.3を使ったLab独自の有限例
  rationale: 単一路の後悔と期待後悔の違いを計算で示す。
  caption: 自作計算：r=(3,2,1)、v=(1,1,1)、Cのm=2。理論上界や店舗成果ではない。
  steps:
  - name: 全情報の基準
    formula: R* = max(3/2, 5/3, 3/2) = 5/3
    explanation: 同じ真の選好で最終品揃えを最適化する。
  - name: 最終集合の確率で平均
    formula: E[R] = (1/2)(3/2) + (1/3)(5/3) + (1/6)(3/2) = 14/9
    explanation: 非購入を含む全6観測経路を、最終集合ごとにまとめた確率。
  - name: 期待後悔
    formula: R* − E[R] = 5/3 − 14/9 = 1/9
    explanation: たまたま[1]を選んだ単一路の後悔1/6とは異なる。
