source_review:
  checked: '2026-11-03'
  url: https://arxiv.org/html/2610.40557v1
  scope: Web HTMLの§2–3、§5 Theorem 5.1、§6 Theorem 6.1を読解。付録の全証明は未検証。原本bytes/hashと著者コードは未取得。
core_idea:
  author_claim: 顧客の選好が分からない場合に、限られた品揃え実験をもとに最終品揃えを選ぶと、最悪の場合にどれだけ後悔が生じるかを明らかにする。
  research_bot_interpretation: Worth Reading。顧客を観測する回数mと、試す品揃えの種類数dを分けて設計するための教材として読む。実店舗で成果が出たことを示す研究ではない。
sections:
  overview: 対象は2026年10月29日提出のv1です。Labで行ったのは数式の検算と限られた条件での計算で、著者コードや店舗実験の再現ではありません。 [論文の書誌情報](https://arxiv.org/abs/2610.40557)。
  problem: 顧客の好みが分からないとき、どの品揃えを試し、最後に何を売ればよいのでしょうか。同じ商品の購入を何度観察しても、提示しなかった商品を顧客がどれだけ好むかは直接分かりません。
  method: method.md
  why_it_might_work: 観測しないAは、商品を売らないことで生じる損失と、売ることで生じる損失の釣り合いを収益だけで判断します。B/Cは観測前に用意した品揃えを試し、決められた規則で最終品揃えを選びます。一つの品揃えで観測を重ねることと、試す品揃えを増やすことは別です。
  evidence: evidence.md
  executable_understanding: experiment.md
  results: Labは96条件の期待後悔を丸めずに有理数で計算・保存し、論文が示す一般の最悪時保証とは分けて表示します。
  what_we_verified: CONFIRMED：有限例の計算、境界値と同率の扱い、観測予算の上限、結果の再生成、画面の表示と判断規則の対応を確認しました。一般理論との対応は一部を確認しました（PARTIAL）。
  what_we_did_not_verify: >-
    著者コードと原本のバイト列・ハッシュは未取得です（NOT OBSERVED）。
    全証明、大規模な計算の性能、店舗での効果、ブラウザーでの手動操作は検証していません（NOT TESTED）。
  implementation: run.pyは標準ライブラリだけを使います。再実行にはuvを使います。詳しい手順はREADME、論文との対応はmappingを参照してください。外部APIや実際の顧客データは使いません。
