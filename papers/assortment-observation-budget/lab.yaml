question: 同じ品揃えを多くの顧客に試すことと、試す品揃えを増やすことは同じか
summary: 顧客を観測せず収益順のどこまでを売るか決める規則と、1種類・2種類の品揃えを試してから決める規則を比べます。3商品の厳密計算で、観測数によって最適な品揃えからの期待収益の差（後悔）がどう変わるかを確かめます。
