core_idea:
  author_claim: 顧客の選好が分からないとき、店は限られた回数だけ品揃えを試してから、最後に売る商品を選ぶ。著者はこのとき、未知の選好について最悪の場合に生じる期待収益の差を調べた。
  research_bot_interpretation: Labは、顧客を観測する回数mと、試す品揃えの種類数dを分けて考える教材としてWorth Readingと評価した。実店舗で効果が出たことを示す研究ではない。
sections:
  overview: |-
    著者は、商品が売れたときの収益は分かるものの、顧客がどの商品を買いたがるかは分からない店を想定しました。著者のモデル（多項ロジット）では、顧客は提示された商品の一つを買うか、何も買わないかを選びます。著者は試す品揃えを観測前に決め、試験結果から最終案を選ぶ規則と合わせて評価しました。この規則で選ぶ品揃えと、顧客の好みを知って選んだ最適な品揃えとの期待収益の差を、各試験結果の確率で重み付けして平均します。著者は、未知の好みの中でこの差が最も大きくなる場合でも、差を小さくできる試し方を求めました。

    商品ごとの収益によっては、顧客1人の選択を見るだけでも最悪時の差が縮まります。一方、収益が異なる商品が3つ以上あると、同じ品揃えを何度試しても、最悪時の差は残ります。著者は、複数の品揃えで差をゼロに近づけるには、最も収益が低い商品を除く各商品について、その商品を含み、より収益が低い商品を含まない品揃えを用意する必要があると示しました。その条件を満たせば、各品揃えを試す回数を増やすと最悪時の差がゼロに近づく規則があります。これはモデル上の結果で、実店舗の売上を測ったものではありません。

    [論文の書誌情報](https://arxiv.org/abs/2610.40557)。
  problem: 店が顧客の好みを知らないとき、何を試し、最後に何を売ればよいのでしょうか。同じ品揃えを何度提示しても、その品揃えに入らなかった商品を顧客がどれだけ好むかは直接分かりません。
  method: method.md
  why_it_might_work: 観測を行わないAは、商品を外す場合と含める場合の最大損失を、各商品の収益だけで比べます。BとCは観測前に提示する品揃えを決め、観測が終わってから所定の規則で売る品揃えを選びます。同じ品揃えを何度も試すと、その品揃えの反応を詳しく調べられます。種類を増やすと、別の品揃えへの反応も調べられます。
  evidence: evidence.md
  executable_understanding: experiment.md
  results: Labは選好と観測数などを変えた96条件の期待後悔を、丸めずに分数で計算して保存しました。論文が保証する最悪時の値と、Labが選好を固定して求めた値は分けて表示します。
  what_we_verified: Labは有限例の計算、境界値と同率の扱い、観測予算の上限、結果の再生成、画面と判断規則の対応を確認しました（CONFIRMED）。一般理論との対応については一部を確認しました（PARTIAL）。
  what_we_did_not_verify: >-
    Labは著者コードと原本ファイルのバイト列・ハッシュを取得していません（NOT OBSERVED）。
    すべての証明、大規模な計算の性能、店舗での効果、ブラウザーでの手動操作は検証していません（NOT TESTED）。
  implementation: 配布するrun.pyはPythonの標準ライブラリだけで動きます。リポジトリで再実行する手順にはuvを使います。手順はREADME、論文の式とコードの対応はmappingを参照してください。外部APIや実際の顧客データは使いません。
