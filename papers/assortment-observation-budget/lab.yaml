question: 同じ品揃えを試す顧客を増やすことと、試す品揃えの種類を増やすことは同じか
summary: >-
  顧客の購入を観測せず、収益が高い順に何商品まで売るかを決める規則と、1種類または2種類の品揃えを試してから決める規則を比べます。
  3商品の例で観測数を変え、各規則で選んだ品揃えの期待収益が最適な品揃えの収益にどれだけ届かないか（期待後悔）を厳密に計算します。
