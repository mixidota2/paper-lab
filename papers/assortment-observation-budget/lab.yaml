core_idea:
  author_claim: 未知の顧客選好のもとで、限られた品揃え実験から最終品揃えを決める最悪時後悔を特徴付ける。
  research_bot_interpretation: Worth Reading。観測数mと品揃え種類数dを区別する設計の教材として読む。店舗成果の実証ではない。
sections:
  overview: 2026年10月29日提出のv1。以下は自作の数式検算と有限例であり、著者コードや店舗実験の再現ではありません。 [論文の書誌情報](https://arxiv.org/abs/2610.40557)。
  problem: 顧客の好みが分からないとき、何を試し、何を最終的に売るか。同じ商品の購入を何度観察しても、提示しなかった商品への選好は直接は見えません。
  method: method.md
  why_it_might_work: Aは収益だけで除外と包含の損失を釣り合わせます。B/Cは事前に決めた提示集合から観測し、決められた規則で最終集合を選びます。観測の種類と量は別の資源です。
  evidence: evidence.md
  executable_understanding: experiment.md
  results: 計算値はすべて自作。96条件の期待後悔を厳密有理数で保存し、一般の最悪時保証とは別に表示します。
  what_we_verified: CONFIRMED：有限計算、等号・同率、予算上限、再生成、表示と判断規則の対応。一般理論との対応はPARTIAL。
  what_we_did_not_verify: 著者コードと原本bytes/hashはNOT OBSERVED。全証明、大規模性能、店舗効果、手動ブラウザーはNOT
    TESTED。
  implementation: run.pyは標準ライブラリ、再実行はuv。詳細はREADMEとmapping。外部APIや実際の顧客データは使いません。
