teaching_figures:
- id: observation-plan
  kind: timeline
  title: 観測の前に試す品揃えを決め、観測後に売る品揃えを選ぶ
  after: method
  source: https://arxiv.org/html/2610.40557v1
  locator: §3、Theorem 5.1・6.1
  rationale: Labは、どの品揃えを何回試すかと、最後に何を選ぶかを分けて図にした。
  caption: この図のBとCでは3商品の収益を(3,2,1)に限る。Aは顧客を観測しない。どの規則でも、最後に選んだ品揃えを評価する。
  rows:
  - label: A：観測しない
    nodes:
    - title: 収益順に売る商品の数を決める
      text: 商品を外すときの最大損失と、商品を含めるときの最大損失を比べ、[2]を選ぶ
  - label: B：1種類を試す
    nodes:
    - title: '[1]をm回提示'
      text: 購入した顧客の割合が2/3以上なら[1]、2/3未満なら[2]を選ぶ
  - label: C：2種類を試す
    nodes:
    - title: '[1]と[2]をτ回ずつ提示'
      text: それぞれの平均収益を比べ、高い方が1未満なら[3]を選ぶ。1以上なら平均収益が高かった方を選び、同率なら[1]を選ぶ。余った観測は判断に使わない。
- id: exact-expectation
  kind: equations
  title: 一つの観測結果での後悔と、全結果を平均した期待後悔
  after: evidence
  source: https://arxiv.org/html/2610.40557v1
  locator: §2.3を使ったLab独自の有限例
  rationale: Labは一つの観測結果で生じる後悔と、起こりうる全結果を平均した期待後悔を分けて計算した。
  caption: Labの計算例。r=(3,2,1)、v=(1,1,1)、Cのm=2。論文の理論上の上限や店舗での成果は表していない。
  steps:
  - name: 選好を知っている場合の最適期待収益
    formula: R* = max(3/2, 5/3, 3/2) = 5/3
    explanation: 評価用の選好を知っているとし、[1]・[2]・[3]のうち期待収益が最も高い品揃えを選ぶ。
  - name: Cが品揃えを選ぶ確率で重み付け
    formula: E[R] = (1/2)(3/2) + (1/3)(5/3) + (1/6)(3/2) = 14/9
    explanation: Labは非購入も含めた全6経路を、Cが最後に選ぶ品揃えごとに分ける。各品揃えの期待収益に、その品揃えを選ぶ確率を掛けて足す。
  - name: 期待後悔
    formula: R* − E[R] = 5/3 − 14/9 = 1/9
    explanation: 期待後悔の1/9は、観測の結果として[1]を選んだ一つの経路だけで生じる後悔1/6とは異なる。
