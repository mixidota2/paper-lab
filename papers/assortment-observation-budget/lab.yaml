question: 店が最後に売る商品を決めるには、同じ品揃えを何度も試すのと、違う品揃えを試すのとで何が違うか
summary: >-
  店が3商品の中から最後に売る品揃えを選ぶとします。顧客の購入を観測せずに決める方法と、1種類または2種類の品揃えを提示して購入を観測する方法を比べます。
  Labは観測数を変え、各方法で選んだ品揃えの期待収益が、顧客の選好を知っていれば得られた最適な期待収益にどれだけ届かないかを計算します。観測結果ごとのこの差を、その結果が起こる確率で重み付けした平均が「期待後悔」です。
