teaching_figures:
- id: observation-plan
  kind: timeline
  title: 観測の前に試す品揃えを決め、観測後に売る品揃えを選ぶ
  after: method
  source: https://arxiv.org/html/2610.40557v1
  locator: §3、Theorem 5.1・6.1
  rationale: 自作図で、観測に使う回数と、最終品揃えを選ぶタイミングを分けて示す。
  caption: B/Cは3商品の収益が(3,2,1)の場合に限定する。Aは顧客を観測しない。いずれも最後に選ぶ品揃えを評価する。
  rows:
  - label: A：観測0
    nodes:
    - title: 収益順の区切り
      text: 商品を外す場合と含める場合の最大損失を比べ、[2]を選ぶ
  - label: B：種類1
    nodes:
    - title: '[1]をm回'
      text: 購入した割合が2/3以上なら[1]、それ未満なら[2]を選ぶ
  - label: C：種類2
    nodes:
    - title: '[1]と[2]をτ回ずつ'
      text: 最大の平均収益が1未満なら[3]を選ぶ。それ以外は平均収益の高い群の品揃えを選ぶ。同率なら[1]。余った観測は選ぶときに使わない。
- id: exact-expectation
  kind: equations
  title: 一つの観測経路と、確率で重み付けした期待後悔
  after: evidence
  source: https://arxiv.org/html/2610.40557v1
  locator: §2.3を使ったLab独自の有限例
  rationale: 一つの観測経路で生じる後悔と、全経路を平均した期待後悔の違いを計算で示す。
  caption: Labの計算例。r=(3,2,1)、v=(1,1,1)、Cのm=2。理論上界や店舗での成果ではない。
  steps:
  - name: 全情報の基準
    formula: R* = max(3/2, 5/3, 3/2) = 5/3
    explanation: 評価に使う真の選好が分かっているとして、収益が最も高い品揃えを選ぶ。
  - name: 最終集合の確率で平均
    formula: E[R] = (1/2)(3/2) + (1/3)(5/3) + (1/6)(3/2) = 14/9
    explanation: 非購入を含む全6観測経路を、最後に選ぶ品揃えごとに分ける。品揃えごとに、その収益と選ばれる確率を掛けて足す。
  - name: 期待後悔
    formula: R* − E[R] = 5/3 − 14/9 = 1/9
    explanation: 期待後悔1/9は、観測の結果として[1]を選んだ一つの経路の後悔1/6とは異なる。
