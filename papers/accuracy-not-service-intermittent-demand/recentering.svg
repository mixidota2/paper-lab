<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" role="img" aria-label="人工データ10点で、ゼロを含む平均と、正の需要だけの平均を比べる図"><title>人工データ10点で、ゼロを含む平均と、正の需要だけの平均を比べる図</title><rect width="700" height="500" fill="#f8fafc"/><g font-family="sans-serif" font-size="14" fill="#17324d"><text x="35" y="32" font-size="21">ゼロを含める場合と除く場合の平均（人工データ10点）</text><rect x="65" y="350" width="28" height="2" fill="#348cac"/><text x="77" y="376">1</text><rect x="123" y="350" width="28" height="2" fill="#348cac"/><text x="135" y="376">2</text><rect x="181" y="350" width="28" height="2" fill="#348cac"/><text x="193" y="376">3</text><rect x="239" y="350" width="28" height="2" fill="#348cac"/><text x="251" y="376">4</text><rect x="297" y="270" width="28" height="80" fill="#348cac"/><text x="309" y="376">5</text><rect x="355" y="350" width="28" height="2" fill="#348cac"/><text x="367" y="376">6</text><rect x="413" y="350" width="28" height="2" fill="#348cac"/><text x="425" y="376">7</text><rect x="471" y="350" width="28" height="2" fill="#348cac"/><text x="483" y="376">8</text><rect x="529" y="110" width="28" height="240" fill="#348cac"/><text x="541" y="376">9</text><rect x="587" y="350" width="28" height="2" fill="#348cac"/><text x="599" y="376">10</text><path d="M45 318.0 H650" stroke="#995526" stroke-dasharray="7 4"/><text x="400" y="308.0" fill="#995526">ゼロを含む平均 0.8</text><path d="M45 190 H650" stroke="#9550a0" stroke-dasharray="7 4"/><text x="300" y="180" fill="#9550a0">正の需要だけの平均 4.0</text><text x="35" y="423">標準偏差はゼロを含むと1.833、正の需要だけだと2.0</text><text x="35" y="450">Labは元の単位に戻せることを確認した。Chronos-2は実行していない。</text></g></svg>