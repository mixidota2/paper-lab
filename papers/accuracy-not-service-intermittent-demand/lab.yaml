  steps:
  - name: lead-time需要
    formula: Yᵢ = Σₕ yᵢ,o+h ; Ŷᵢ = H r̂ᵢ
    explanation: 月ごとの誤差とlead-time全体の誤差は違う。
  - name: 固定方策のstock target
    formula: Sᵢ = max(0, μ̂ᵢ(L+R) + z σ̂ᵢ√(L+R))
    explanation: 同じσならΔS=(L+R)Δμ。保証は在庫目標まで。
  - name: 全明細が揃って初めて成功
    formula: COFR = |Q|⁻¹ Σq 1[minⱼ∈Iq Fqj = 1]
    explanation: 1明細でも不足すればその注文は失敗。
  - name: 正規化の変更
    formula: x̂nz = (x − E[x|x>0]) / std(x|x>0)
    explanation: 統計は学習contextだけ。逆変換も同じ統計を使う。
