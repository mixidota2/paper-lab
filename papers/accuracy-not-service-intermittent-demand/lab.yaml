question: 需要予測の誤差が小さくても、注文を完納しにくくなるのはなぜか
summary: 需要がない月の多い部品について、著者は同じ補充規則で38の予測手法を比べた。20,330件の実注文では、予測精度が高い手法ほど、注文の全明細をそろえられる割合は低い傾向があった（順位相関ρ=−0.555）。別の実験では、Chronos-2の入力を整える方法を変えると、論文独自の誤差指標（MASE）は悪化したが、注文の完納率（COFR）は54%から63%に上がった。実験ごとに対象品目が違うため、在庫費用を含めて比較するには条件をそろえる必要がある。
