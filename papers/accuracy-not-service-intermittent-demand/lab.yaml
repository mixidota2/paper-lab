core_idea:
  author_claim: 同一在庫方策で手法を比較すると、間欠需要の強い部品契約で精度順位とservice順位が逆転する。偏りの方向を診断し、Chronos-2の非ゼロ条件付き正規化でserviceを改善する。
  research_bot_interpretation: '[Contextual Deconvolution](contextual-deconvolution.html)は在庫費用との整合、[VN2](vn2-stockout-catboost.html)は予測と発注policyの組を問う。本論文は固定policyで予測の偏りを切り分ける。[ChronosFlow-ICGPS](https://arxiv.org/abs/2605.14840)は発注量に依存して打ち切られた需要を生成補完する研究で、観測需要に対する正規化補正とは問題が異なる。これらを接続するなら、潜在需要の回復、COFR、在庫費用を別々に評価したい。'
sections:
  overview: 少しずつ外す予測より、余分に見積もる予測の方が注文を完納できる場合がある。本論文の対象は月次の間欠・塊状需要を持つ物流部品。38手法を同じ補充規則へ入れると、20,330件の実注文で精度と完納の順位が逆向きになった。これは「精度を捨てればよい」という結論ではない。追加在庫を含む意思決定の評価が必要になる。
  problem: 精度benchmarkは4,021品目、注文評価はそのうち3,828品目・41 platform。Chronos補正の集計は4,558品目で、同じ分母ではない。1注文の全明細が揃った場合だけ成功と数えるCOFRでは、一品の不足が注文全体の失敗になる。RAFとM5には実multi-item
    order logがないため、3領域の比較には品目単位のfill proxyを使う。
  why_it_might_work: '解釈: ゼロが多い履歴では平均が小さくなり、絶対誤差を減らす予測は需要の山を低く見積もりやすい。平均予測を上げれば同じ分散・safety
    factorの在庫目標は上がる。ただし完納できない注文を棄却して在庫を保存する規則では、目標が大きいほど実現COFRが必ず上がるとは限らない。論文のProposition
    1も保証するのはstock targetの順序だけである。'
  evidence: '一次資料の著者報告。


    [PDF §III–IV、Tables III–VII](https://arxiv.org/pdf/2609.13840v1)。著者報告の注文順位相関はρ=−0.555、95%
    bootstrap CI [−0.78,−0.26]、n=38。8 model classへまとめた感度分析は−0.88だが、独立な追試ではない。


    | 評価 | 工業部品 | RAF | 月次M5 |

    | --- | ---: | ---: | ---: |

    | 品目fill proxyとの順位相関 | −0.582 | −0.173 | +0.359 |


    符号は領域によって変わる。RAFの一部手法は有効品目数が異なるavailable-case比較で、Prophetに代わりiMAPAを含む。M5は疎な250品目を選んでも部品ほど間欠的ではない。


    | Chronos-2 / Table V | 標準 | 非ゼロ条件付き |

    | --- | ---: | ---: |

    | pooled MASE | 0.831 | 0.948 |

    | fill proxy @90%目標 | 77.5% | 92.0% |

    | signed bias | −2.52 | −0.10 |

    | 注文COFR（§IV-D） | 54% | 63% |


    90%はpolicyの目標で、実現充足率でも信頼水準でもない。Table VIの別origin集合では0.834→0.955、77.8→92.4%となる。提示数値と異なる再測定値を混ぜない。補正後も80-of-80契約基準は満たさない。


    RUFは5,000品目の公開合成panel。実品目の集約templateから発生×量を生成し、class・zero率の一致を最大10回で検査する。非cold-startの84%がgateを通る。周辺分布と依存の整合は認証対象だが、機密の実注文そのものではない。38手法でρ=−0.47、補正MASE
    0.765→0.807とproxy +17.6〜21.4 ppを報告する。LabではRUF全38手法を再実行していない。'
  executable_understanding: '`uv run papers/accuracy-not-service-intermittent-demand/run.py`。固定seedの4品目・144人工注文を同一順序・同一補充規則でreplayし、予測倍率を変えてMAE・COFR・平均在庫を測る。別に正規化と逆変換、全ゼロ・単一正値の端点を確認する。公式公開CSVによる38手法の順位散布図は著者集計の再描画であり、この人工replayとは別。'
  results: 人工replayでは予測倍率0.5→4でCOFR 47.9→97.9%、平均在庫9.01→34.95単位。ここではMAEも3.98→2.36へ改善するので、論文の精度逆転はNOT
    OBSERVED。設計した人工需要が同じregimeを再現するとは限らない。一方、注文[3],[1],[1]に初期在庫2と3を与える反例では、COFRが2/3→1/3へ低下する。在庫目標の大小と注文完納の単調性を区別できる。
    公開CSVの順位から相関を再計算するとρ=-0.555264。これは著者集計の確認であり、生データからの再現ではない。
  what_we_verified: Mechanism PARTIAL。正規化の往復と全ゼロ時の有限性、同一policyの在庫保存・補充・完納判定、stock
    target増加がCOFR単調増加を保証しない反例を確認。局所条件はCONFIRMED。人工replayの精度逆転はNOT OBSERVED。
  what_we_did_not_verify: Performance / Scaling / Production applicability NOT TESTED。Chronos-2の重みをロードせず、内部表現の変化による改善は検証していない。実注文・RUF生成・38手法の学習、bootstrap
    CI、在庫金額の最適化も未実行。CSVの順位再計算は凍結集計の算術監査であり、機密panelの追試ではない。
  implementation: '`normalize()`はEqs. 6–7の中心とscaleおよび逆変換。`replay()`は受入→全明細判定→失敗棄却→補充という順序を実装。Labのlead=2・4品目は原典のL=6/R=1から縮小した。人工実験は通常MAEを使い、論文独自のMASEを名乗らない。'
