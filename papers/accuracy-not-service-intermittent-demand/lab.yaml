core_idea:
  author_claim: 著者は補充規則を固定し、予測手法だけを変えて、予測精度と注文完納率の順位を比べた。部品の実注文では、二つの順位は逆向きの傾向を示した。また、Chronos-2の正規化に使う平均と標準偏差を、需要があった期間だけで計算すると、注文完納率が上がった。
  research_bot_interpretation: '[Contextual Deconvolution](contextual-deconvolution.html)は在庫費用を考慮した予測を扱い、[VN2](vn2-stockout-catboost.html)は予測と発注規則の組み合わせを比べる。この論文では発注規則を固定したので、予測の違いに注目できる。[ChronosFlow-ICGPS](https://arxiv.org/abs/2605.14840)は欠品で観測できなかった需要を補う研究で、観測済みの需要を正規化し直すこの手法とは役割が違う。組み合わせを試すなら、欠品で隠れた需要をどこまで復元できたか、注文完納率、在庫費用を別々に評価したい。'
sections:
  overview: 注文を完納するには、注文に含まれる品目を一つも欠かせない。需要がない月の多い物流部品では、予測誤差を小さく抑える手法が、需要のある月に必要な在庫を用意できるとは限らない。著者が同じ補充規則で38手法を比較した20,330件の実注文では、誤差の順位と完納率の順位が逆向きの傾向を示した。多く持てば費用もかかるため、予測精度、完納率、在庫量を並べて判断する必要がある。
  problem: 予測精度の比較には4,021品目を使い、実注文の評価にはそのうち3,828品目・41のプラットフォームを使った。Chronos-2の正規化を変えた実験は4,558品目を集計した。全明細が揃った注文数を全注文数で割るCOFRでは、一品でも足りない注文は完納に数えない。RAFとM5には複数品目を束ねた実注文の記録がない。そこで3つのデータを比べる表では、品目ごとの需要を在庫でどの程度満たせたかを表す代理指標（fill
    proxy）を使う。
  why_it_might_work: Labの解釈。需要ゼロの月が多いと、絶対誤差を小さくする予測は需要が集中する月を低く見積もりやすい。予測のばらつきと安全係数を変えずに平均予測を上げれば、計算上の目標在庫は増える。ただし、この補充の再現では、完納できない注文を受け付けず、その分の在庫は後の注文に使う。先の注文を完納できるようになった結果、後の複数の注文が完納できなくなる場合もある。論文の命題1が保証するのは、実際の完納率ではなく、計算上の目標在庫の増減までである。
  evidence: |-
    一次資料の[原論文 §III–IV、表III–VII](https://arxiv.org/pdf/2609.13840v1)で著者が報告した結果。

    工業部品の実注文では、予測精度と完納率の順位相関はρ=−0.555だった（38手法。再標本化で求めた95%信頼区間は[−0.78,−0.26]）。手法を8種類にまとめて計算し直しても−0.88だったが、同じ研究データを使った結果である。

    | 順位相関の比較 | 工業部品 | RAF | 月次M5 |
    | --- | ---: | ---: | ---: |
    | 予測精度と品目の充足を表す代理指標 | −0.582 | −0.173 | +0.359 |

    この3つの値は、注文全体ではなく品目ごとの評価である。RAFは手法によって評価できた品目数が異なり、Prophetの代わりにiMAPAを含む。月次M5は需要がまばらな250品目を選んでも、工業部品ほど需要ゼロの期間が多くない。

    | Chronos-2の正規化（表V、注文COFRは§IV-D） | 全期間から計算 | 需要のあった期間だけから計算 |
    | --- | ---: | ---: |
    | 全品目の誤差を先に合計して比を取るMASE | 0.831 | 0.948 |
    | 品目の充足を表す代理指標（方策の目標90%） | 77.5% | 92.0% |
    | 符号付きの予測の偏り | −2.52 | −0.10 |
    | 注文の完納率（COFR） | 54% | 63% |

    90%は補充規則に設定した目標で、実際に達成した割合でも信頼水準でもない。別の予測開始時点を使った表VIでは、MASEが0.834→0.955、充足の代理指標が77.8→92.4%と報告されている。補正後も80-of-80の契約基準を満たさなかった。

    公開データRUFは、実品目をまとめた特徴から需要の有無と量を生成した、5,000品目の人工データである。需要パターンの分類と需要ゼロの割合を最大10回確認し、新規品目を除いたデータの84%がチェックを通過した。分布やデータの依存関係を確かめたもので、機密の実注文記録ではない。著者は、38手法の順位相関がρ=−0.47、正規化の変更でMASEが0.765→0.807、品目の充足を表す代理指標が17.6〜21.4ポイント上がったと報告している。LabはRUFで38手法を再実行していない。
  executable_understanding: '`uv run papers/accuracy-not-service-intermittent-demand/run.py`。4品目の人工データで乱数の初期値を固定し、144件の注文を同じ順序と補充規則で処理する。予測に掛ける倍率を変えて、平均絶対誤差（MAE）、注文完納率（COFR）、平均在庫を比べる。別の計算で、正規化の前後で値を元に戻せるかや、すべてゼロ・正の値が1件だけの場合を確かめる。38手法の順位散布図は著者の公開CSVから作ったもので、人工注文の結果とは別である。'
  results: 人工注文では、予測の倍率を0.5から4へ上げると、完納率は47.9%から97.9%、平均在庫は9.01から34.95単位になった。平均絶対誤差も3.98から2.36に減ったため、論文のように誤差と完納率が反対方向に動く現象は見られなかった（NOT
    OBSERVED）。一方、必要数量が順に[3]、[1]、[1]の3注文では、初期在庫2なら先頭を断って後の2件を完納できるが、初期在庫3では先頭を完納して残り2件を断る。完納率は2/3から1/3に下がる。別途、著者公開CSVの順位を使って再計算した相関はρ=−0.555264だった。生データを使った追試ではない。
  what_we_verified: 仕組みの一部を確認した（PARTIAL）。人工データでは、正規化した値を元に戻せること、すべてゼロの入力でも計算が有限になること、補充規則に従って在庫と完納を計算できることを確認した。また、初期在庫を増やすと完納率が下がる具体例も確認した（これらの条件ではCONFIRMED）。一方、144件の人工注文では、論文が報告した予測精度と完納率の順位の逆転は見られなかった（NOT
    OBSERVED）。
  what_we_did_not_verify: '予測性能、大規模データでの動作、実際の業務に使えるかは未検証（Performance / Scaling / Production applicability: NOT
    TESTED）。Chronos-2の学習済み重みを読み込んでいないため、正規化でモデルの予測がどう変わるかは確認していない。実注文の処理、RUFの生成、38手法の学習、再標本化による信頼区間の推定、在庫金額の最適化も行っていない。公開CSVでの計算は、著者が出した順位から相関を求め直したもので、非公開の実注文を使った追試ではない。'
  implementation: '`normalize()` は原論文の式6–7に対応し、中心と尺度で値を変換してから元に戻す。`replay()` は入荷、全明細の在庫確認、不足した注文の取り消し、補充の順に処理する。Labは入荷待ち2期間・4品目に縮小しており、原論文の入荷待ち6か月・確認間隔1か月とは違う。人工データの誤差は通常の平均絶対誤差（MAE）で測り、原論文独自のMASEとは区別する。'
  method: method.md
  mapping: mapping.md
teaching_figures:
- kind: equations
  id: decision
  title: 予測から注文の完納を測るまで
  after: method
  locator: Eqs. 1–7
  rationale: 誤差の計算、目標在庫、完納の判定を別々に追う。
  caption: 一次資料の式を学習用に並べた図。論文の報告値やLabの計算結果ではない。
  source: https://arxiv.org/pdf/2609.13840v1
  steps:
  - name: 発注してから到着するまでの総需要
    formula: Yᵢ = Σₕ yᵢ,o+h ; Ŷᵢ = H r̂ᵢ
    explanation: 月ごとのずれを平均するのではなく、品目ごとに到着までの実績と予測の合計を比べる。
  - name: 補充規則が決める目標在庫
    formula: Sᵢ = max(0, μ̂ᵢ(L+R) + z σ̂ᵢ√(L+R))
    explanation: 予測の標準偏差σを固定すると、平均予測μの変化分に(L+R)を掛けた分だけ目標在庫が動く。ただし下限の0に達していない範囲の話で、注文完納率の保証ではない。
  - name: すべての明細がそろった注文だけを数える
    formula: COFR = |Q|⁻¹ Σq 1[minⱼ∈Iq Fqj = 1]
    explanation: 1明細でも在庫が不足した注文は完納に数えない。
  - name: 需要のある期間から正規化の基準を求める
    formula: x̂nz = (x − E[x|x>0]) / std(x|x>0)
    explanation: 平均と標準偏差は予測を始める時点までの学習用データから求め、元の単位に戻すときにも同じ値を使う。
