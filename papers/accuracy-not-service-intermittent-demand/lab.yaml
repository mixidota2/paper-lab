question: 予測誤差が小さい手法でも、注文を完納できないのはなぜか
summary: 部品の実注文20,330件を同じ補充規則で処理した著者の比較では、38手法の予測誤差と完納率の順位相関は−0.555だった。別の実験で、著者がChronos-2の入力の正規化を変えると、誤差は悪化したが完納率は54%から63%に上がった。発注に使う手法は誤差だけでなく、同じ条件での完納率と在庫費用も見て選ぶ。
