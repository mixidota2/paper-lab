core_idea:
  author_claim: 著者は同じ補充規則に38手法の予測を入れ、予測誤差と注文完納率の順位を比べた。部品の実注文を処理する再現では、誤差が小さい手法ほど完納率が低い傾向があった。別の実験では、Chronos-2に渡す値の平均と標準偏差を需要があった期間だけから求めると、完納率が上がった。
  research_bot_interpretation: '[Contextual Deconvolution](contextual-deconvolution.html)は在庫費用を考慮した予測を扱い、[VN2](vn2-stockout-catboost.html)は予測と発注規則の組み合わせを比べる。この論文では同じ補充規則を使うため、予測の違いに注目できる。[ChronosFlow-ICGPS](https://arxiv.org/abs/2605.14840)は欠品で見えなかった需要を補う。今回の手法はすでに観測した需要の正規化を変える。両者を組み合わせるなら、需要の復元、注文完納率、在庫費用を別々に評価する。'
sections:
  overview: 部品の注文を完納するには、同じ注文に含まれる品目を全部そろえなければならない。需要がない月の多い物流部品を対象に、著者は同じ補充規則で38手法を比較した。20,330件の実注文を処理する再現では、予測誤差が小さい手法ほど、注文を完納できた割合は低い傾向があった。在庫を多く持てば費用もかかる。予測誤差、完納率、在庫費用を分けて見ると、発注に使う手法を選びやすい。
  problem: 著者は予測精度の全体比較で4,021品目を対象にした。そのうち3,828品目の予測を使って20,330件の実注文を処理し、41のプラットフォームで完納を調べた。Chronos-2の補正実験は4,558品目で、対象は異なる。注文完納率（COFR）は全明細を満たした注文数を全注文数で割る。RAFとM5には複数品目を束ねた注文記録がない。そこで3データの比較では、品目ごとに需要があった期間のうち、全量を満たせた期間の割合を使う。注文全体の成否ではないため、論文は品目別の代理指標（fill
    proxy）として扱う。
  why_it_might_work: Labの解釈。需要ゼロの月が多いと、絶対誤差を抑える予測は、需要が集中した月を低く見積もることがある。予測のばらつきと安全係数を変えなければ、平均予測を上げたとき、計算上の目標在庫は下がらない。ただし、在庫が少なくて先の注文を断れば、その在庫を後の注文に回せる。先の注文を受けられるようになって在庫を使い切ると、後に来た複数の注文を断ることもある。論文の命題1が扱うのは目標在庫の動きであり、実際の完納率が上がるとは限らない。
  evidence: |-
    一次資料：[原論文の§III–IV・表III–VII](https://arxiv.org/html/2609.13840v1)。以下は著者の結果であり、Labが非公開の注文を使って再計算した結果ではない。

    各手法で同じ安全係数を使い、補充規則の目標を80%としたとき、工業部品の予測誤差と注文完納率の順位相関は−0.555だった（38手法、再標本化で求めた95%信頼区間[−0.78, −0.26]）。似た手法をまとめて8種類を比べた場合は−0.88。同じ注文データの別の集計である。各手法で費用を最小にする係数を選んだ場合は−0.278（p=0.09）まで弱まった。誤差が小さい手法ならどの条件でも完納率が低くなる、という結果ではない。

    | 予測誤差と品目別代理指標の順位相関 | 工業部品 | RAF | 月次M5 |
    | --- | ---: | ---: | ---: |
    | 順位相関 | −0.582 | −0.173 | +0.359 |

    この表は注文全体でなく品目ごとの結果を比べる。RAFはProphetの代わりにiMAPAを含み、評価できた品目数が手法によって異なる。月次M5は需要がまばらな250品目を選んでいるが、工業部品ほど需要ゼロの期間が多くない。

    | Chronos-2の入力を正規化する方法（表V、注文完納率は§IV-D） | 全期間の値から平均と標準偏差を求める | 需要が正の期間だけから求める |
    | --- | ---: | ---: |
    | 誤差を先に合計して比を取るMASE | 0.831 | 0.948 |
    | 品目別代理指標（補充規則の目標90%） | 77.5% | 92.0% |
    | 符号付きの予測の偏り | −2.52 | −0.10 |
    | 注文完納率（COFR） | 54% | 63% |

    目標90%は補充規則に渡した値で、達成率や信頼水準ではない。予測開始時点の異なる表VIでは、MASEは0.834から0.955、品目別代理指標は77.8%から92.4%になった。補正後も41のプラットフォームのうち80%以上で完納率80%以上を達成する契約基準（80-of-80）には届いていない。

    著者の公開データRUFは実品目の集計上の特徴をもとに需要の有無と量を生成した、5,000品目の人工データである。需要パターンとゼロ需要の割合が合うかを最大10回まで調べ、新規品目を除く84%が基準を満たした。非公開の実注文そのものではない。論文はRUFでも、38手法の順位相関が−0.47、正規化を変えたときのMASEは0.765から0.807、品目別代理指標は17.6〜21.4ポイント上昇したと報告する。Labはこれらの実験を再実行していない。
  executable_understanding: '`uv run papers/accuracy-not-service-intermittent-demand/run.py` を実行する。Labは乱数の初期値を固定し、4品目・144件の人工注文を、同じ順序と補充規則で処理する。平均予測に掛ける倍率を変え、平均絶対誤差（MAE）、完納率（COFR）、平均在庫を比べる。別の計算では正規化した値を元に戻し、すべてゼロの場合や正の値が1点だけの場合も確かめる。38手法の散布図は著者の公開CSVを使い、人工注文の結果とは分けた。'
  results: 架空の144件の注文では予測倍率を0.5から4に上げると、完納率は47.9%から97.9%、平均在庫は9.01から34.95単位になった。この両端では平均絶対誤差も3.98から2.36に下がった。論文が報告したように、誤差が改善する一方で完納率が下がる逆転は、この例では観測しなかった（NOT
    OBSERVED）。必要数量が順に[3]、[1]、[1]の3注文では、初期在庫が2なら最初の注文を断り、残り2件を完納する。初期在庫が3なら最初の注文に在庫を使い、後ろ2件を断る。完納率は2/3から1/3に下がる。Labは別に著者公開CSVの順位から相関を計算し、−0.555264を得た。非公開の注文を使った追試ではない。
  what_we_verified: 仕組みは一部を確認した（PARTIAL）。人工データで、正規化した値を元に戻せること、入力がすべてゼロでも有限の値を返すこと、補充規則に沿って在庫と完納を計算できることを確かめた。在庫を増やすと完納率が下がる3注文の例も確認した（この条件ではCONFIRMED）。144件の人工注文では、論文と同じ順位の逆転は見られなかった（NOT
    OBSERVED）。
  what_we_did_not_verify: 予測性能、大規模データでの動作、本番への適用は未検証（NOT TESTED）。LabはChronos-2の学習済みモデルを使っていないため、正規化を変えた後の予測は調べていない。非公開注文の処理、RUFの生成、38手法の学習、信頼区間の推定、在庫金額の最適化も行っていない。公開CSVから求め直したのは著者が報告した順位の相関である。
  implementation: '`normalize()` は論文の式6–7に沿って中心と尺度で変換し、元の単位へ戻す計算を確かめる。`replay()` は入荷、注文の全明細の在庫確認、不足時の取り消し、補充を順に行う。Labは4品目・入荷待ち2期間に縮めた。論文の基本設定は入荷待ち6か月・確認間隔1か月である。人工データの誤差は平均絶対誤差（MAE）で、論文が使ったMASEとは異なる。'
  method: method.md
  mapping: mapping.md
teaching_figures:
- kind: equations
  id: decision
  title: 予測誤差、目標在庫、完納率はどう計算するか
  after: method
  locator: Eqs. 1–7
  rationale: 同じ予測から誤差と目標在庫を別々に求め、注文の成否を判定する。
  caption: 著者が示した式をLabで並べた。論文の実測値や小実験の結果を示す図ではない。
  source: https://arxiv.org/pdf/2609.13840v1
  steps:
  - name: 発注から入荷までの需要を足す
    formula: Yᵢ = Σₕ yᵢ,o+h ; Ŷᵢ = H r̂ᵢ
    explanation: 品目ごとに入荷までの実績需要と予測需要をそれぞれ足して比べる。月ごとの誤差の平均ではない。
  - name: 補充規則から目標在庫を求める
    formula: Sᵢ = max(0, μ̂ᵢ(L+R) + z σ̂ᵢ√(L+R))
    explanation: 標準偏差σを固定し、目標在庫が下限0にかからない範囲では、平均予測μの変化に(L+R)を掛けた分だけ目標在庫が動く。注文完納率の変化はこの式からは決まらない。
  - name: 全明細をそろえた注文を数える
    formula: COFR = |Q|⁻¹ Σq 1[minⱼ∈Iq Fqj = 1]
    explanation: 全明細がそろった注文の数を、全注文数で割る。一つでも不足した注文は分子に入れない。
  - name: 需要があった期間から平均と標準偏差を求める
    formula: x̂nz = (x − E[x|x>0]) / std(x|x>0)
    explanation: 予測開始時点までに需要があった期間の値を使う。予測を元の単位へ戻すときにも同じ平均と標準偏差を使う。
