<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 690" role="img" aria-labelledby="title desc"><title id="title">prefixを落とす前にアイテムの証拠を入れる</title><desc id="desc">run.pyの履歴x・beam幅1を図示。数値はtoyであり論文の測定値ではない。target eは評価にだけ使い、順位作成には渡さない。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#26745f"/></marker></defs><rect width="560" height="690" fill="#fbfcf7"/><g font-family="sans-serif"><text x="22" y="35" font-size="24" fill="#183c35" font-weight="bold">幅1のtoy：target e のSIDは100</text><rect x="22" y="67" width="246" height="100" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="38" y="99" font-size="22" fill="#183c35" font-weight="bold">通常のbeam</text><text x="38" y="129" font-size="19" fill="#183c35" font-weight="normal">累積確率の順位</text><text x="38" y="156" font-size="19" fill="#183c35" font-weight="normal">prefix 0 の質量0.72</text><rect x="292" y="67" width="246" height="100" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="308" y="99" font-size="22" fill="#183c35" font-weight="bold">削減前にISD支援</text><text x="308" y="129" font-size="19" fill="#183c35" font-weight="normal">Q(x) = [e, f, a]</text><text x="308" y="156" font-size="19" fill="#183c35" font-weight="normal">prefix 1をeが支える</text><text x="23" y="207" font-size="18" fill="#183c35" font-weight="normal">token 1</text><rect x="22" y="222" width="246" height="84" rx="12" fill="#fae7df" stroke="#183c35" stroke-width="1.3"/><text x="38" y="254" font-size="22" fill="#183c35" font-weight="bold">0 → a,b,c,d</text><rect x="292" y="222" width="246" height="84" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="308" y="254" font-size="22" fill="#183c35" font-weight="bold">1 → e,f,g,h</text><path d="M145,306 L145,341" stroke="#26745f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M415,306 L415,341" stroke="#26745f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="23" y="346" font-size="18" fill="#183c35" font-weight="normal">token 2</text><rect x="22" y="361" width="246" height="84" rx="12" fill="#fae7df" stroke="#183c35" stroke-width="1.3"/><text x="38" y="393" font-size="22" fill="#183c35" font-weight="bold">00 → a,b</text><rect x="292" y="361" width="246" height="84" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="308" y="393" font-size="22" fill="#183c35" font-weight="bold">10 → e,f</text><path d="M145,445 L145,480" stroke="#26745f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M415,445 L415,480" stroke="#26745f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="23" y="485" font-size="18" fill="#183c35" font-weight="normal">token 3</text><rect x="22" y="500" width="246" height="84" rx="12" fill="#fae7df" stroke="#183c35" stroke-width="1.3"/><text x="38" y="532" font-size="22" fill="#183c35" font-weight="bold">000 → a</text><rect x="292" y="500" width="246" height="84" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="308" y="532" font-size="22" fill="#183c35" font-weight="bold">100 → e</text><text x="25" y="627" font-size="18" fill="#a94438" font-weight="normal">左：最初にeが消える → 最後の並べ替えでは救えない</text><text x="25" y="661" font-size="19" fill="#183c35" font-weight="normal">右：生成できたeを最終候補として採点できる</text></g></svg>
