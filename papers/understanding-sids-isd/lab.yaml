teaching_figures:
- kind: equations
  id: prefix-support
  title: 候補を絞る前に商品の順位を使う
  after: method
  source: https://arxiv.org/html/2607.24995
  locator: §5.1–5.2・式(15)–(16)
  rationale: 外部順位からどの先頭部分に点を足すかを示す。
  caption: 論文§4.3は生の点数を混ぜて効果を調べる診断。§5のISDは、点数ではなく順位を組み合わせる。
  steps:
  - name: 外部の順位を一度だけ作る
    formula: Q(h) = TopJᵢ s(h,i),  i ∉ h
    explanation: 観測した履歴hから、まだ消費していない商品を順位付けする。評価用の正解は入力しない。
  - name: 先頭部分につながる商品の最上位
    formula: 'rᵢₜₑₘ(p) = min { rQ(i) : i ∈ Q(h) ∩ Sₚ }'
    explanation: 先頭部分pにつながり、外部の上位にも入る商品から最上位の順位を使う。該当する商品がなければ∞とする。
  - name: 二つの順位から点を計算して候補を絞る
    formula: F(p) = 1/(κ + rdec(p)) + 1/(κ + rᵢₜₑₘ(p))
    explanation: デコーダーは累積確率で順位を付ける。二つの順位にκを足した逆数を足し、上位B個を残す。∞の項は0として扱う。
- kind: equations
  id: post-order
  title: 生成で残せる商品と、最後に上位へ置く商品
  after: method
  source: https://arxiv.org/html/2607.24995
  locator: §4.1・§5.2.2・式(9)・(17)
  rationale: 生成中に落とす操作と、候補の中で並べる操作を分ける。
  caption: 先頭部分を絞る処理と、生成した商品の順位を変える処理は、別々に評価する。
  steps:
  - name: 各段で残った商品
    formula: 'Rℓ = ⋃ { Sₚ : p ∈ Bℓ }'
    explanation: 先頭部分を外すと、それで始まるIDを持つ商品は、その後の生成で選べない。
  - name: 生成済みの商品を並べ替える
    formula: Fitem(i) = 1/(κ + rSID(i)) + 1/(κ + rQ(i))
    explanation: 外部順位にない商品の第2項は0だ。生成していない商品を新たに追加しない。
