core_idea:
  author_claim: 著者は、SIDが大まかな商品の分類を保つ一方で、元の表現での細かな近さや、説明の順序を変えたときのIDの一致を保てない場合があると報告した。生成途中で消える商品を測り、別の商品順位で探索を補うISDを提案した。[一次資料：§3〜5](https://arxiv.org/html/2607.24995)
  research_bot_interpretation: 商品の意味が近いかと、探索で正解の商品を残せるかは別の問いだ。どの生成段で候補が何件消えるかを測ると、最後の順位付けを変えるべきか、その前の候補選びを変えるべきかを判断しやすい。この見方はSpotifyのR-KMeansにも使えるが、Amazonの結果をSpotifyの本番にそのまま当てはめることはできない。
sections:
  overview: |-
    著者は、商品内容を記号の列にした識別子（SID）が、元の商品表現の情報をどれだけ保つかを調べました。元の表現で近かった10商品のうち、SIDを使っても近いと判定された商品は平均32.2%でした。生成モデルが途中である記号列を候補から外すと、その続きに当たる商品は後から選べません。そこでISDは、別の方法で付けた商品順位を使い、上位の商品に対応する記号列が候補から落ちにくくします。候補を絞ったあとの並べ替えにも、同じ商品順位を使います。

    Amazon Reviewsのベビー用品で、TIGERにUniSRecの順位を使ったISDを加えると、上位10件の順位を測るNDCG@10が0.0295から0.0387へ、相対で31.2%上がりました。これは試した中で最も大きな改善です。同じデータでも単純な統計に基づく順位を渡した場合は、上位20件に正解が入る割合が下がりました。ISDは探索を補う方法で、IDを作り直す方法ではありません。
  problem: 生成途中の先頭部分を探索候補から外すと、その先頭部分で始まるIDを持つ商品がすべて消える。最後に精度の高い順位付けモデルを使っても、入力されなかった商品は戻せない。推薦の最終順位だけ見ても、生成のどの段階で候補が消えたかは分からない。[一次資料：§4.1](https://arxiv.org/html/2607.24995)
  why_it_might_work: 別の順位で上位になった商品につながる先頭部分に点を足すと、生成確率だけで絞ったときに落ちる候補が残る場合がある。一つの商品の順位で、同じ先頭を持つ候補全体が残りやすくなる。外部の順位が誤っていても同じ処理が働く。商品を多く含む先頭部分が有利になるか、外部順位に入らない新商品が不利になるかは別に測りたい。
  evidence: |-
    ### 商品の近さと、同じ商品を認識できる割合

    著者は、元のエンコーダーで近い10商品を、SIDから復元した表現で平均32.2%取得できたと報告した。説明に含まれる事実はそのままで並び順だけを変えると、完全なSIDが変わった商品は平均38.4%だった。復元した表現でどの近傍が残るかと、同じ商品に同じIDが付くかは別の指標だ。

    表2では、近傍が残る割合は構成と商品領域で13.8〜45.1%、完全なIDが変わる割合は14.0〜73.5%。OfficeでSentence-T5を使うと、RQ-VAEでは近傍が13.8%残り、53.9%のIDが変わった。同じエンコーダーのRQ-KMeansでは31.5%と29.3%だった。

    並べ替えた説明から元の商品を1位にできた割合は、要旨と§3.1.4では99.57%と記されている。一方、表1のSentence-T5ではOfficeとScientificはどちらも99.51%だった。どの集計条件の違いなのかは本文から確認できないため、一つの値として扱わない。

    ### 生成の途中に残る商品を測る

    著者は別の順位付けで正解商品が上位10件に入った履歴に絞り、その正解がSID生成の途中で消えないかを調べた。図4で3番目の意味トークンまで残った割合は、TIGERではOfficeの35.4%、Scientificの24.4%だった。これは元の表現と近傍が重なる割合でも、全履歴を対象とした最終推薦の正答率でもない。

    ### 外部順位の作り方と指標で結果が変わる

    著者はAmazon ReviewsのBaby、Office、Scientificを使い、利用者の最後の行動をテスト、その一つ前を検証、それ以前を学習に使った。表3の最大の改善はBabyでTIGERにUniSRecの順位を加えた場合。NDCG@10は0.0295から0.0387へ、相対で31.2%上がった。一方、Babyで外部順位を単純な学習統計から作ると、Recall@20は0.0866から0.0745に下がった。

    表5は、絞る前と生成後のどちらで順位を使うかを分けた。TIGERでは生成後の並べ替えが改善の大部分を占める条件もある。ScientificのLIGERでは両段階を使うと、NDCG@10は0.0880から0.0927へ上がるが、Recall@10は0.1291から0.1266へ下がる。別の評価では、変更したIDの意味トークンが途中まで残っても、末尾の衝突解決トークンを学習していないため、完全なIDを取れた割合が0だった。先頭を残すことだけで、最終結果が良くなるとは限らない。

    [一次資料：§3〜6、表1〜5・図4](https://arxiv.org/html/2607.24995)
  executable_understanding: |-
    Labは8商品に3桁の固定IDと生成確率を与えた。外部の順位は、評価に使わない人工の遷移表の回数から作る。9件の正解商品は順位の作成とデコードに渡さず、評価にだけ使う。通常のビーム探索、並べ替えだけ、生成途中の支援だけ、両方を使う条件、外部順位を逆にした条件を比較した。

    ビーム幅を1、2、4、8にして、各桁を通過した正解商品の割合と人工のNDCG@2を計算する。1件の評価で正解は1商品とした。上位2件に入れば、その順位rankに対し1/log₂(rank+1)を加える。上位2件に入らなければ0で、9件の平均を取る。残存率も9件すべてを分母にする。論文の条件付き残存率Kℓと、Labの全9件の残存率では分母が異なる。

    実行は `uv run papers/understanding-sids-isd/run.py`。
  results: |-
    ビーム幅2で通常の探索は9件中3件の正解を最後まで残した。生成中の支援と生成後の並べ替えを両方使うと、9件中5件を残した。人工のNDCG@2は0.292326から0.473540になった。外部順位をあえて逆にした条件では、最後まで残った正解はなく、NDCG@2は0だった。

    幅8で全商品を生成できる場合は、生成中に支援を加えても残る商品は増えない。この条件の違いは、生成した商品を並べ替えるときに出る。いずれもLabが固定した小さな確率表での結果で、本番の改善率は示さない。
  what_we_verified: Labは有限の人工の木で、累積した生成確率での探索、順位から計算した点を足して候補を残す処理、生成した商品の並べ替えを計算した。外部順位を逆にした場合と、すべての商品のIDが残る場合も実行し、生成後の並べ替えでは商品集合が変わらないことを確認した。
  what_we_did_not_verify: Labはエンコーダーや量子化の学習、実商品の説明順を変えたときの結果、SASRec、UniSRec、TIGER、LIGERの性能を再現していない。Amazonのデータでの精度や本番の負荷も測っていない。人工のIDには衝突を解決する末尾トークンがない。
  implementation: '`SIDS` と `PROBS` が商品のIDと固定の生成確率、`TRAIN` が順位を作る人工の遷移表、`TEST` が評価例だ。`decode()` は各段で前のビームから伸ばせる全候補を順位付けし、支援点を足した後に上位を残す。最後は生成した商品だけを並べ替える。`results.json`
    には各候補の累積確率、融合点、最後まで残る集合を保存する。'
  method: method.md
  mapping: mapping.md
