question: 外部の商品順位は、生成途中で正解が消えるのを防げるか
summary: 商品を短い識別子（SID）に変えると、大まかな内容のまとまりは残るが、元の表現で近い商品がすべて近いままとは限らない。ISDは別の方法で付けた順位を使い、探索途中で候補を残す処理と、最後に並べ替える処理を補う。
