summary: HEARは、エージェントを管理する側が入力の再利用予定を、推論側が途中計算の保存状況を伝える取り決めです。SCBenchでは、保存済みの計算を使いつつ長く待った要求を保護すると、全要求の完了が481秒から299秒に短くなりました。回答の正しさではなく、処理時間を比べた結果です。
question: 次に使う入力の予定と推論側に今残っているキャッシュを、どう結び付けるか
