question: Yandex Musicは、曲を探す処理と順位付けを一つのモデルでどう行ったか
summary: Sonaは最大8,192件の履歴を候補検索と採点で共有し、計算を多くかけるのは直近2,048件に絞る。スマートスピーカーのMy Vibeを対象に各群15%・7日間で比べ、著者は主指標のActive Usersが対照群より4.53%、総再生時間が6.30%増えたと報告した。全利用者への展開や推薦に出る曲の範囲の改善は未解決である。
