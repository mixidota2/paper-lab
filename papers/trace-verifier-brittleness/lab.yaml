core_idea:
  author_claim: 著者は点数だけでは差の理由が分からないと指摘しました。条件を一つ変えて実行し、操作や最終状態を比べます。次に同じ記録を、疑う箇所だけ直した採点器に渡します。操作そのものが変わったのか、採点規則が同じ操作を違って扱ったのかを分ける手順です。
  research_bot_interpretation: 公開前に点数が下がったときは、変更前後の操作と最終状態、採点規則だけ変えたときの点数、同じ条件を繰り返したときのばらつきを並べます。点差だけを見るより、直す場所を判断しやすくなります。
sections:
  overview: |-
    著者は、エージェントの点数が変わったときに、行動と採点方法のどちらが原因かを調べる方法を提案しました。元の条件と一つだけ変えた条件で同じ課題を実行し、操作や最終状態を比べます。次にエージェントを動かし直さず、疑わしい採点規則だけを変えて同じ記録を採点します。

    25件の人工課題では、ツールの名前だけを替えると、同じ操作をしたスクリプトの点数が平均0.250下がりました。採点時に元の名前に読み替えると差はなくなりました。一方、名前が変わると操作が変わるように作った別のスクリプトには、同じ再採点をしても点差が残りました。公開ベンチマークでは、同じ条件を繰り返しても15〜36%の課題で合否が変わりました。一度ずつ比べるだけでは、変更の影響と普段のばらつきを見分けられません。
  problem: 在庫を8から5に直す課題を考えます。正しく書き込んでも、呼び出したツールの名前が違うだけで減点されることがあります。一方、名前が変わったために書き込み自体が省かれたなら、点数を直しても在庫は正しくなりません。点数だけでは、どちらが起きたのか分かりません。
  method: method.md
  why_it_might_work: 保存した記録を使えば二度目の採点中に操作が変わることはありません。操作と状態を一つずつ比べたうえで、疑わしい採点規則だけを直して点差が消えるかを確かめます。記録で同じとみなした操作が実際に同じ効果を持つかは、別に確かめます。
  evidence: evidence.md
  executable_understanding: experiment.md
  results: 必要な操作をするスクリプトでは、別名を元の名前に読み替えた操作列と、最終状態のハッシュが一致します。元の名前だけを見る採点では1.00から0.50に下がり、名前を読み替えて採点すると1.00に戻ります。書き込みを省く案は、名前を読み替えても0です。これはLabが決めた規則での結果で、論文の0.250とは異なります。
  what_we_verified: '**CONFIRMED（教材で確認）**：名前を替えても必要な操作をした場合は、操作列と状態のハッシュが一致しました。同じ記録を採点し直すと点だけが変わります。書き込みを省いた場合には再採点でも失敗が残りました。この範囲で論文の診断手順を表しました（PARTIAL）。'
  what_we_did_not_verify: Labは言語モデルを動かし直したときのばらつき、採点の正確さ、学習中に採点の抜けが見つかるか、本番の失敗率を調べていません（NOT TESTED）。確認した公開コードではStudy 2・3の記録を見つけられませんでした（NOT OBSERVED）。記録が存在しないという意味ではありません。既存ベンチマークの採点には言語モデルの判定が含まれ、一致した判定が正解とは限りません。
  implementation: '`uv run papers/trace-verifier-brittleness/run.py --test` で検査し、`--test` を外すと12条件の結果と画面を生成します。Pythonは標準ライブラリだけを使い、ブラウザーは生成済みの結果を表示します。著者のコードとモデルAPIは実行しません。詳しい手順はREADMEと対応表に載せています。'
