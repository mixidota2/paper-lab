question: 点数が変わったのは、エージェントの行動が変わったからか、採点方法が変わったからか
summary: 著者は条件を変えた実行と、同じ記録の再採点を比べました。ツール名だけで減点される場合と、操作が変わって失敗する場合を区別します。
