id: trace-verifier-brittleness
title: 'TRACE: Diagnosing Verifier Brittleness in Agentic Evaluation'
authors: [Radhika Gaonkar]
year: 2026
arxiv_id: '2610.11678'
submitted: '2026-10-08'
topics: [ai-agents]
