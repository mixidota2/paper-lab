question: |-
  失敗を正しく予測できれば、実行途中の介入で成功は増えるか
summary: |-
  失敗を見分けるAUROCが約0.94でも、介入で成功が減る場合があった。著者は同じ課題を介入ありとなしで比べ、失敗から成功に変わった件数と、成功から失敗に変わった件数を数えた。HotPotQAでMiniMax-M2.1を巻き戻すと64%から38%に下がり、ALFWorldでQwen-3-8Bに警告を加えると5.8%から8.6%に上がった。いずれもベンチマークで得た結果だ。
