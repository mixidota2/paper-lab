  results: |-
    式を2通りに計算したときの差は最大でも2.23×10⁻¹⁶未満だった。p=0.89、r=0.12、d=0.56と仮定すると、成功率の期待差は+4.52ポイントになる。50課題の人工試験を2,000回繰り返すと、実際に計算した差が正だったのは73.0%で、下位2.5%点から上位2.5%点までは−6〜+16ポイントだった。0.35%の回では、必要な割合が求められないか、割合の合計が0で、改善の境界を計算できなかった。これは人工試験の分布であり、論文の信頼区間ではない。
  what_we_verified: |-
    介入の有無で最終結果を対応させ、成功率の差と改善の境界を計算した。介入なしの結果が全成功または全失敗の場合と、両方の結果が観測されても変化が0の場合を分けた。50課題の人工試験では、改善が期待されても観測した差が正にならないことがあった。
  what_we_did_not_verify: |-
    Labは失敗予測器の学習、AUROC、LoRA、温度の調整、巻き戻したときの環境の復元、警告を受けたモデルの反応、論文のp値を再現していない。50課題で安全を保証する手法ではない。別の環境やAgentTetherのような別の修復手法にも同じ回復率や成功を崩す割合が当てはまるかは確かめていない。
  method: method.md
  mapping: mapping.md
  implementation: |-
    リポジトリのルートで `uv run papers/intervention-paradox/run.py` を実行する。Pythonの標準ライブラリだけを使い、CPUで計算する。乱数の初期値は固定され、同じフォルダーの `results.json` に結果を書き出す。ダウンロードした `run.py` も単体で動く。
teaching_figures:
- kind: equations
  id: intervention-accounting
  title: 回復した課題から失敗に変わった課題を引く
  after: method
  locator: §1 式1–4
  caption: 介入なしの結果を分母として、それぞれの割合を計算する。
  rationale: 介入なしの結果を分母として、それぞれの割合を計算する。
  steps:
  - name: 失敗側
    formula: p = (A+C)/N, r = C/(A+C)
    explanation: 介入なしで失敗した課題のうち、介入で成功した割合。
  - name: 成功側
    formula: d = B/(B+D)
    explanation: 介入なしで成功した課題のうち、介入で失敗した割合。
  - name: 差分
    formula: ΔSuccess = p r − (1−p)d = (C−B)/N
    explanation: どちらも成功、またはどちらも失敗した課題は成功件数の差を変えない。
  - name: 境界
    formula: p* = d/(r+d), 改善条件 p > p*
    explanation: 両方の割合が求まり、合計が正のときだけ境界を計算する。合計が0なら差は0。介入なしの失敗または成功が1件もなければ、対応する割合を計算できない。
  source: https://arxiv.org/pdf/2602.03338v1
- kind: matrix
  id: paired-outcomes
  title: 同じ課題を介入なしとありで比べる
  after: problem
  locator: §1・付録D
  caption: 表の1件は同じ課題の最終結果の組。途中で何回介入したかは数えない。
  rationale: 表の1件は同じ課題の最終結果の組。途中で何回介入したかは数えない。
  columns:
  - 介入あり：失敗
  - 介入あり：成功
  rows:
  - label: 介入なし：失敗
    cells:
    - A：失敗のまま
    - C：回復
  - label: 介入なし：成功
    cells:
    - B：失敗に変わる
    - D：成功のまま
  source: https://arxiv.org/pdf/2602.03338v1
- kind: logic
  id: pilot-gate
  title: 50タスクは判断の出発点で、安全の保証ではない
  after: executable_understanding
  locator: 図1・§7–8
  caption: 論文の事前試験を図にした。不確かなら追加で試験するという分岐はLabの解釈。
  rationale: 論文の事前試験を図にした。不確かなら追加で試験するという分岐はLabの解釈。
  rows:
  - label: 1 対応比較
    nodes:
    - title: 同じ環境・モデル・介入方法
      text: 50〜100課題を介入なしとありで実行し、最終結果をA・B・C・Dに分けて数える。
  - label: 2 推定できるか
    nodes:
    - title: 介入なしの結果に成功または失敗がない
      text: rかdは求められない。実際の成功件数の差は数えられるが、改善の境界は求めない。
    - title: 両側の観測がある
      text: p、r、dを求める。rとdの合計が正ならp*を求め、その不確かさも調べる。
  - label: 3 判定
    nodes:
    - title: p ≤ p* / 差が不確か
      text: 常に介入する運用は見送り、事前試験の追加や、実行完了後の選択を検討する。
    - title: pがp*を十分に上回る
      text: 条件を限定して検証を進める。境界をどの程度上回ればよいか、一律の値を論文は示していない。
  source: https://arxiv.org/pdf/2602.03338v1
