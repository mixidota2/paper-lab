core_idea:
  author_claim: |-
    著者は小規模な事前試験で、介入なしの失敗率と、介入で失敗から回復する割合、成功が崩れる割合を調べる。両方の割合を求められ、合計が正なら、介入なしの失敗率を改善の境界と比べる。著者はALFWorldの50課題で改善を見込めると判断し、別の202課題の評価で小幅な改善を報告した。
  research_bot_interpretation: |-
    AUROCは失敗した実行に予測器が高い点数を付けられるかを測る。巻き戻しや警告の後に成功が増えるかは測らない。小規模な事前試験は、介入を見送る条件を見つけるのに使える。ただし、同じ結果から2通りの式で同じ差が出ても、条件を変えたときの介入効果まで予測できるとは言えない。
sections:
  overview: |-
    Writerの著者はエージェントの失敗を予測できれば、実行途中に巻き戻したり助言を加えたりして成功率を上げられるかを調べました。失敗を見分けるモデルのAUROCは約0.94でした。著者は同じ課題を介入ありとなしで比べ、介入で失敗から成功に変わった件数と、逆に成功を崩した件数を数えました。

    質問応答のHotPotQAではMiniMax-M2.1の実行を途中で巻き戻すと、成功率は64%から38%に下がりました。一方、ALFWorldでQwen-3-8Bに助言を加えた設定では、成功率は5.8%から8.6%に上がりました。どちらもベンチマークでの結果です。失敗予測の精度だけでは、介入で成功が増えるかは判断できません。
  problem: |-
    予測器が失敗の兆候を見つけても、エージェントが修正に成功するとは限らない。正解に向かっていたエージェントが、警告を受けて検索や試行を繰り返すこともある。失敗を見抜けるかと、介入した結果として成功が増えるかは別に測る必要がある。

    著者は同じ初期条件から、各課題を介入なしの場合とありの場合で実行した。途中の警告回数ではなく、課題ごとの最終結果を対応させた。著者はsmolagentsでHotPotQA、GAIA、ALFWorldを評価した。本番の利用者を無作為に割り付けた実験ではない。
  why_it_might_work: |-
    介入で救えるのは介入なしなら失敗する課題で、逆に成功を崩し得るのは介入なしなら成功する課題。回復率と成功を崩す割合をそのまま比べず、それぞれに対象となる課題の割合を掛けると、全課題でどちらの変化が多いか分かる。予測器の精度が高くても、この母数とエージェントの反応を測らなければ、成功が増えるかは判断できない。
  evidence: |-
    ### 予測器の精度は未使用の1,372サンプルで評価

    著者はHotPotQAとGAIAの7,636ステップを使い、Qwen3-0.6BにLoRA（ランク16）を加えて失敗予測器を学習した。同じ課題の各ステップには、課題全体が最後に成功したか失敗したかを教師ラベルとして付けた。課題単位で学習158、検証19、テスト21に分けた。テストの1,372サンプルで、表1の総合AUROCは0.936、F1は0.963だった。約0.94はこのAUROCの丸め値であり、50課題の事前試験の成功率ではない。

    ### 介入の効果はモデル、課題、手法で異なる

    著者はHotPotQAの100課題で介入の効果を比較した（表4）。温度を調整せずにROLLBACKを使うと、MiniMax-M2.1の成功率は64.0%から38.0%に下がった。GLM-4.7は同じ設定で70.3%のままだった。GAIAの30課題では、MiniMax-M2.1は最も良かった介入設定でも46.7%から16.7%に下がった（30ポイント減）。

    ALFWorldは202課題を乱数の初期値3通りで評価した。温度を調整せずにQwen-3-8BへAPPENDで警告を加えると、成功率は5.8%から8.6%に上がった（2.8ポイント増）。著者は本文でp=0.014と報告した。付録Cでは、同じ課題の結果を対応させたブートストラップを10,000回行い、介入条件の多重比較にはHolm–Bonferroniを使うと説明している。ただしp=0.014が補正後かは明確ではない。改善幅は検出可能幅の約±4ポイントに近く、著者も改善方向の証拠として扱う。

    ### 50課題の事前試験と202課題の本評価

    Qwenを使った事前試験では、著者は介入なしの成功率を10.7%±1.9%、失敗率pを約89%、回復率rを約12%、成功を崩す割合dを約56%、改善の境界p*を約82%と報告した。事前試験の成功率と、202課題の本評価で得た介入なしの成功率5.8%は、別々に集計した。単一の50課題から10.7%を得た集計手順は十分に説明されていない。また、予測器の学習にALFWorldの実行記録は使っていないが、温度の調整にはALFWorldの検証データを使った。[一次資料 §3–4、付録A・C](https://arxiv.org/pdf/2602.03338v1)
  executable_understanding: '同じ課題の最終結果を4種類に分けて、小さな件数の組み合わせを列挙する。成功率の差(C−B)/Nは、介入なしの失敗率・成功率を使った式p r−(1−p)dと一致する。この照合は、どちらの式も計算できる場合に限る。


    操作図では、失敗から回復する割合rを0.12、成功を崩す割合dを0.56に固定し、介入なしの失敗率pだけを変える。100課題あたりに表示する件数は期待値で、実際に観測した整数の件数ではない。この3つの確率から50課題の試験を2,000回作り、少数の課題で見た成功率の差がどの程度ばらつくかを調べる。予測器のAUROCやエージェントの反応は再現しない。


    <div class="paper-probe teaching" data-paper-probe="intervention-paradox"><h3>介入で成功が増える失敗率の境界</h3><p>回復率rを12%、成功を崩す割合dを56%に固定した場合、成功が増える境界p*は82.35%になる。この操作で変わるのは課題全体の失敗率pで、個々の行動に介入するしきい値τではない。</p><label>介入なしの失敗率p：<output
    data-p-value>89%</output><input data-failure type="range" min="0" max="100" value="89"
    step="1"></label>

    <div class="threshold-track" aria-hidden="true"><span style="left:82.352941%">p*</span><i
    data-p-marker style="left:89%"></i></div><div data-probe-output aria-live="polite"><p>100課題あたり、介入で失敗から成功に変わる課題は10.68件、成功から失敗に変わる課題は6.16件と見込む。成功率の差は+4.52ポイントになる。この計算だけでは、少数の課題で試したときの介入の効果までは分からない。</p></div><script
