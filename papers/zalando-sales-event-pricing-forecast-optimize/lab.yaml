- kind: equations
  id: zalando-marginal-tradeoff
  title: 純売上の重みαと長期利益
  after: method
  source: https://arxiv.org/pdf/2606.13741v1
  locator: 式(1)〜(2)、Fig. 4
  rationale: 重みαを変える意味を式で示し、割引率を連続的に選べる場合と、決まった候補から選ぶ場合を分ける。
  caption: 式(2)は、割引率を連続的に変えられ、微分でき、範囲の端ではないところに解がある場合の条件だ。Labの割引率は離散的な候補なので、選択は段階的に変わる。
  steps:
  - name: 商品ごとの目的
    formula: J(d) = LTP(d) + α NMV(d)
    explanation: αを大きくすると、同じ額の純売上の増加に対し、目的関数に足す額も大きくなる。
  - name: 内点解の条件
    formula: LTP′(d) + α NMV′(d) = 0
    explanation: 割引を増やすことで減る利益と、重みを掛けた売上の増加が釣り合う点を表す。
  - name: 限界の交換比率
    formula: −NMV′(d) / LTP′(d) = 1 / α
    explanation: α>0で分母が0でない場合の式だ。γが大きいほど、在庫を今売ると失う将来利益も大きい。
