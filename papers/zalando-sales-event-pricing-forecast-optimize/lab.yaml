question: 需要予測の誤差が小さければ、選んだセール価格で利益も上がるか
summary: Zalandoは需要予測から商品ごとに割引率を選び、実地A/Bテスト23件の統合で利益貢献+6.00%と報告した。どの誤差で比べるかと、選んだ価格でどれだけ利益が出るかを分けて読む。
