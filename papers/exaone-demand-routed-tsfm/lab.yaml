summary: 需要分類を教師信号に、共有LoRAと4専門枝を混ぜる。MASEは1.0667対TiRex 1.0818。木モデル・共変量・在庫指標との比較はない。
question: 需要が途切れる頻度と数量のばらつきで、補正を分ける意味は何か
