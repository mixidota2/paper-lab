source_review:
  checked: '2026-10-23'
  url: https://journals.plos.org/plosmedicine/article?id=10.1371/journal.pmed.1004575
  scope: Labは原論文の方法、結果、考察と改装の実施状況を調べた別論文を確認した。補足S2 Boxは2026-10-23（日本時間）に全1ページを確認した。文書の版とハッシュはmapping.mdに記録している。補足はモデルの項を説明するが、残差の相関や購入確率への変換手順は載せていない。原論文の要旨と§3.2で、導入直後の店舗販売の信頼区間の上限表記が異なる。NIHR報告書は本文を確認していない。
core_idea:
  author_claim: Vogelらは、青果を入口側へ移して品ぞろえを広げると、店舗の青果販売が導入直後に増えたと報告した。その後は店の推定差が小さくなり、増えたかどうかの不確かさも大きくなった。著者は家庭の購買や女性の食事にも改善の可能性があると述べている。
  research_bot_interpretation: 同じ家庭が一度に多く買っても店舗全体の販売数量は増える。そのため、店舗の数量が増えただけでは、青果を買う家庭が増えたとは言えない。著者は店を無作為に割り付けておらず、改装店は置き場所と品ぞろえを同時に変えた。位置だけの効果はこの研究では分からない。
sections:
  overview: |-
    Vogelらは、英国イングランドのディスカウントスーパー36店舗で、青果の売場を入口側に移して品ぞろえを広げると、店舗の販売と家庭の購買がどう変わるかを調べました。著者は、会社が改装した18店を、売上や顧客の特徴が似た18店と一組ずつ比べました。

    主な指標は、家庭が週に青果を買う確率です。6か月後は改装店側が3.3ポイント高い推定でしたが、95%信頼区間は−2.5〜9.2ポイントで、差があるかははっきりしませんでした。店舗全体の青果販売数量は、導入直後に改装しなかった場合の予測を0.32標準偏差上回りましたが、3か月後と6か月後の信頼区間は0を含みました。著者は店を無作為に割り付けていません。また、配置と品ぞろえを同時に変えたため、配置だけの効果は切り分けられません。
  problem: 店舗で青果の販売が増えても、その理由が、もともと青果を買う家庭が多めに買ったからなのか、買う家庭が増えたからなのかは分からない。そこで著者は、店舗全体の販売個数と、家庭が週に一度でも青果を買ったかを分けた。家庭の指標には、18〜60歳の女性の会員カード記録を使った。
  method: method.md
  why_it_might_work: 入口近くに青果売場があれば、買い物の早い段階で客の目に留まりやすい。品ぞろえが増えれば、客が買いたい品を見つけやすくなる。研究では両方を同時に変えたため、どちらがどれだけ効いたかは分からない。また、対照店を使って両店に共通する変化を除けても、改装店だけで起きた別の変化は残りうる。
  evidence: evidence.md
  executable_understanding: experiment.md
  results: 著者の報告値はresults.jsonのreported、教材の結果はsyntheticにある。教材で推定値が設定どおりの+0.20に戻るのは、両店に共通する変化だけを加え、対照店の変化も差し引いた場合である。営業再開時の上振れや改装店だけの変化を加えると、対照店を使っても推定値がずれる。
  what_we_verified: |-
    **CONFIRMED（教材で確認）**。対照店を使うと、両店に共通する変化を差し引ける。教材で改装店だけの変化を加えると、それは残る。再開直後の一時的な上振れを別に扱わなければ、持続する効果の見積もりも変わる。

    **PARTIAL（論文との照合）**。Labは店舗の選び方、モデルの構成、著者の報告値を確認した。著者が使った個別の記録では計算していない。
  what_we_did_not_verify: |-
    店舗の販売個数と家庭の会員カード記録は非公開である。Labは著者の推定を再実行していない。補足S2 Boxにモデルの主な項はあるが、残差の相関、推定時の設定、回帰係数から購入確率の差を求める手順は記載されていない。教材では架空の1組に最小二乗法（OLS）を使うため、論文の推定方法とは異なる。

    著者の分析でも、6か月後の家庭の購入確率差の信頼区間は0を含む。効果がなかったと証明したわけではない。対象外の店での購買を追えないこと、記録がそろった人を中心に分析したこと、同じ店を利用する家庭の相関、後から決めた区分、改装店の選び方は、いずれも結果の解釈に影響する。Labは配置だけの効果、健康への影響、別チェーンに広げたときの結果も検証していない。
  implementation: リポジトリの最上位で `uv run papers/wrapped-produce-placement-controlled-trial/run.py --test` を実行すると、数値を確認するテストが動く。`--test` を外すと、コードはJSONと図を含むMarkdownを同じフォルダーに書く。Pythonの標準ライブラリだけを使い、乱数や外部APIを使わない。READMEにビルド手順、mapping.mdに論文との対応を記載した。
