question: 青果を入口近くに移し、品ぞろえを広げた店では、販売と家庭の購買がどう変わったか
summary: Vogelらは、青果を入口近くに移して品ぞろえを広げた英国イングランドのスーパー18店を、似た18店と比べた。店舗の販売数量は導入直後の予測を0.32標準偏差上回った。家庭の購入確率は6か月後に3.3ポイント高い推定だったが、95%信頼区間は0を含んだ。
