verdict: Worth Reading
status: draft
question: 青果を入口へ移すと、店舗の販売と家庭の購買はどう変わるか
summary: |-
  著者は英国のディスカウントスーパー36店で、青果を入口近くに移し、品ぞろえを広げたときの変化を調べた。導入直後の店舗の青果販売は「導入しなかった場合」の予測を0.32標準偏差上回った。家庭が青果を買う確率は6か月時点で介入店側が3.3ポイント高い推定だったが、95%信頼区間は0をまたいだ。比較は無作為割付ではない。
related_threads: [causal-placement-and-assortment]
verification:
  mechanism: PARTIAL
  performance: NOT TESTED
  scaling: NOT TESTED
  production_applicability: NOT TESTED
source_review:
  checked: '2026-10-23'
  url: https://journals.plos.org/plosmedicine/article?id=10.1371/journal.pmed.1004575
  scope: 本文のMethods・Results・Discussionとプロセス評価は2026-10-15に確認。S2 Boxの全1ページは2026-10-23（日本時間）に確認（版・SHA256はmapping.md）。表示数式や新実験結果はない。残差相関構造・推定設定・確率差変換手順は未記載。NIHR本文は未取得。2026年3月31日公開の既刊論文を扱うLab。
core_idea:
  author_claim: >-
    著者は、青果の位置と品ぞろえを同時に変えると店舗の販売、家庭の購買、女性の食事の質が改善する可能性があると述べた。
    店舗の販売数量は導入直後に増えたが、その後は差が小さくなり、推定の幅も広がった。
  research_bot_interpretation: >-
    店の販売数量は、買う家庭の数が増えても、同じ家庭が多く買っても増える。店舗の増加だけでは家庭の習慣が変わったとは言えない。
    比較は無作為割付ではなく、位置と品ぞろえを同時に変えたので、配置だけの効果も分からない。
sections:
  overview: |-
    著者は英国のスーパー36店舗で、青果売場を入口近くへ移して品揃えを広げると、店の販売数量と家庭の購買がどう変わるかを調べました。会社が改装した18店舗を、売上や顧客の特徴が似た18店舗と比べています。店舗の青果販売数量は導入直後に予測値を0.32標準偏差上回りました。一方、家庭が青果を買った割合は、6か月時点で介入店側が3.3ポイント高いという推定でしたが、95%信頼区間は−2.5〜9.2ポイントで、差があるとは言い切れません。店舗を無作為に割り付けておらず、配置と品揃えを同時に変えたため、配置だけの効果は分かりません。
  problem: |-
    青果を入口近くに移した店で青果が多く売れても、いつもの客が多めに買っただけかもしれない。そこで著者は店全体の販売個数と、家庭が週に一度でも青果を買ったかを分けた。店舗は英国のディスカウントスーパー36店、家庭の指標は18〜60歳の女性が使った会員カードの記録である。
  method: method.md
  why_it_might_work: |-
    入口の近くに青果があれば、客は買い物の早い段階で青果に気付きやすい。品ぞろえが広がれば、買いたい品も見つけやすい。著者は二つを同時に変えたため、どちらがどれだけ寄与したかは分からない。対照店を使えば両店に共通する変化を引けるが、介入店だけに起きた別の変化は残る。
  evidence: evidence.md
  executable_understanding: experiment.md
  results: |-
    著者の報告値は `reported`、Labの人工系列と推定値は `synthetic` に分けて保存している。小実験で対照店を使うと効果が+0.20に戻るのは、両店に共通する変化だけを加え、改装直後の上振れと介入店だけの変化を0にした場合である。
  what_we_verified: |-
    **CONFIRMED（小実験で確認）**。両店に共通する変化は対照店で差し引ける。介入店だけで別の変化が起きると取り除けない。また、一時的な上振れをモデルで分けなければ、持続的な変化の推定にも影響する。
    **PARTIAL（論文との照合）**。Labは研究設計と報告値を確認した。個票や著者の計算は再現していない。
  what_we_did_not_verify: |-
    補足資料S2 Boxには店舗の時系列モデル、追加調整とデルタ法、家庭のロジスティック回帰の構成が書かれている。残差の相関、推定時の設定、確率差への変換手順は書かれていない。回帰が直接出す係数は、報告された購入確率差+3.3ポイントと同じ値ではない。小実験は架空の1組に最小二乗法（OLS）を当てはめたもので、論文の推定方法ではない。
    元の販売・購買データは商業上の契約で非公開である。Labは店舗販売、健康への影響、配置だけの効果を独立に検証していない（NOT TESTED）。家庭の確率差の信頼区間は0を含むため、家庭の購買が持続的に増えたとする根拠は確認できない（NOT OBSERVED）。効果がゼロだと示したわけでもない。他店での購買、データがそろった人だけの解析、同じ店を使う家庭同士の相関、あとから決めた区分、店の選ばれ方も解釈を制限する。
  implementation: |-
    リポジトリの最上位で `uv run papers/wrapped-produce-placement-controlled-trial/run.py --test` を実行すると、数値のテストが動く。`--test` を外すと、同じフォルダーに結果のJSONと操作図のMarkdownを書き出す。Pythonの標準ライブラリだけを使い、乱数、ネットワーク、外部APIは使わない。サイトの生成方法はREADME、論文との違いはmappingに記載した。
