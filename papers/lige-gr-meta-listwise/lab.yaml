question: 既存の動画推薦で、先に選んだ動画を使って次の動画を選べるか
summary: MetaのLIGE-GRは、すでに集めた候補から、先に選んだ動画を見ながら一覧を作る。従来方式と比べた7日間の試験では、視聴時間はInstagram Reelsで1.14%、Facebook Videoで0.72%増えた。Facebook Videoの再生数は0.52%減った。
