question: 既存rankerを残したまま、推薦する順番を学習できるか
summary: LIGE-GRは既存候補poolの中で列を生成する追加型の設計。beam 1の7日A/BでReels視聴時間+1.14%、FB+0.72%。FB視聴回数−0.52%も併記する。
