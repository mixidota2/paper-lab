  steps:
  - name: その位置まで届く確率
    formula: p(Vₜ) = p(Vₜ₋₁) × CAcontinue(u,vₜ | Vₜ₋₁)
    explanation: p(空列)=1。動画単体の確率と累積到達確率を分ける。
  - name: 列の期待価値
    formula: ListVMgolden(V) = Σₜ p(Vₜ₋₁) [itemVM(CAₜ) + CLₜ]
    explanation: CL=−∞の候補は加算前に除外する。
  - name: 探索の判定
    formula: Q(Vₜ) = ListVMgolden(Vₜ) + s̄ Σⱼ qₜ^(j d̄/dₜ)
    explanation: 残り位置j=1…T−t。全長では将来項は0。
