core_idea:
  author_claim: 既存のモデルは候補ごとに反応を予測する。追加のモデルは、同じ一覧ですでに選んだ動画を使って予測を更新する。Paletteは更新後の予測から並び全体を評価する。既存の予測器と業務上のルールを残すので、追加した処理を止めて元の順位付けに戻せる。
  research_bot_interpretation: LIGE-GRは、候補を探す処理を入れ替えず、選んだ候補を並べる処理を変える。[Sona](sona-yandex-music.html)や[Gryphon-v2](gryphon-v2-cascade.html)は複数段の推薦を置き換える。[OGR](ogr-once-generated-ranked.html)や[GenPage](genpage-netflix-homepage.html)と比べるときも、どこから候補を得て、どこまで並びを生成するかを分けて読む。
sections:
  overview: |-
    MetaのLIGE-GRはすでに集めた動画候補から、おすすめに載せる順番を一つずつ決めます。既存のモデルが各動画に対する視聴や反応を個別に予測し、追加したモデルが先に選んだ動画を見て後続の候補の予測を更新する仕組みです。一覧全体を評価する際も、多様性などの既存のルールを使います。

    著者が両サービスの従来方式と7日間比べたのは、各段階で最も評価の高い並びを一つだけ残す基本構成です。視聴面での滞在時間はInstagram Reelsで1.14%、Facebook Videoで0.72%増えましたが、Facebook Videoの再生数は0.52%減りました。Instagram Reelsで複数の並びを残す構成を試したのは別の比較です。
  problem: |-
    動画を1本ずつ採点して高得点順に並べても、同じ話題が続くと、後の動画の価値は変わり得る。従来の配信は、多様性を保つルールや、並べてはいけない動画を除くルールを持つ。既存の予測器そのものは、それまでに選んだ動画を見ない。

    LIGE-GRが変えるのは、すでに集めた数百件の候補から約10件を選んで並べる処理だ。この方法は全カタログから動画を表すコード（SID）を生成するものではない。
  method: method.md
  why_it_might_work: |-
    位置を一つ決めるたびに大きな既存モデルを動かし直す代わりに、追加の小さなモデルが、保存済みの表現から動画同士の関係を予測する。内容が重なる場合や、組み合わせによって価値が上がる場合を扱いながら、既存モデルが持つ予測を使い続けられる。

    後ろの位置の価値には、利用者がそこまで進む確率を掛ける。利用者が見ない位置の価値を過大に見積もりにくくなるが、次の動画に進む確率の予測がずれると、後ろの位置ほどその誤差が積み重なる。最初の候補一覧にない動画は、並びを作る段階で取り戻せない。
  evidence: |-
    一次資料：[原論文の§4–5、表1–4](https://arxiv.org/html/2609.18148v1)。

    ### 両サービスで、並びを1通りだけ残す構成を従来方式と比べた

    著者はInstagram ReelsとFacebook Videoで、それぞれ7日間のA/Bテストを実施した。Reelsでは対照群と処置群に利用者の1.5%ずつを割り当てた。Facebook Videoでは処置群に約2%を割り当て、同程度の規模の対照群と比べた。両サービスの視聴時間の差はp<0.001だった。

    | 指標 | Instagram Reels | Facebook Video |
    | --- | ---: | ---: |
    | 視聴面での滞在時間 | +1.14% | +0.72% |
    | 動画の再生数 | +2.28% | −0.52% |
    | いいね・リアクション | +2.65% | +1.59% |
    | セッション数 | +0.11% | +0.07% |

    Facebook Videoでは滞在時間が増えたが、再生数は減った。また、Reelsで同じリクエストに対する推薦一覧を比べた別の分析では、公開後72時間未満の動画の割合が0.66%下がった（表4）。選んだ動画の内訳を比べた結果であり、上の表のA/B指標ではない。

    ### 追加の費用は既存の予測部分と比べる

    並びを1通りだけ残す基本構成で追加した推論資源は、既存の予測部分（CF）が使う資源の約10%に当たる。サービス全体に対する割合ではない。Reelsのリクエスト全体の応答時間は約7%、Facebook Videoの配信処理の平均レイテンシーは約2.2%増えた。著者は異なる範囲を測っており、2つの比率は直接比べられない。

    追加モデル（CA）へ渡す候補を絞ると、CA経路が単位時間に処理できる件数が約60–80%増えた。応答時間が同じ割合で短くなったわけではない。候補数とトラフィックをそろえると、並びを6通り残す構成が追加で使う推論資源は1通りの場合の約2.1倍だった。CFに対する約20%はこの比較からの推定であり、6通りの場合の同じ定義の応答時間は報告していない。

    ### Reelsでは、残す並びの数だけを変えても滞在時間はほぼ変わらなかった

    表3では、CAと各動画の評価に使う重みをそろえ、1通りだけ残す基本構成と、6通り残す2つの構成をそれぞれ7日間比べた。並びの数だけを6にすると滞在時間は0.05%増えたが、表に統計的に有意な差を示す印はなかった。6通りを残しながら、視聴の継続確率で評価を重み付けし、動画の長さを考慮して残りの価値も見積もると、滞在時間は0.69%増えた。後者は2つの変更を一緒に入れた結果だ。どちらも基本構成と比べた値なので、従来方式に対する1.14%増には足せない。
  executable_understanding: |-
    Labは7件の人工候補から3本を選ぶ。動画を個別に採点する方式、先に選んだ動画も考慮する幅1の探索、視聴が続く確率も使う幅6の探索、候補を上位3本に絞る条件、予算に達して従来方式へ戻る条件を比べる。どの条件にも同じ禁止ルールを適用し、作れる並びをすべて列挙した場合の最大値も求める。

    リポジトリの最上位で `uv run papers/lige-gr-meta-listwise/run.py` を実行する。予測値は固定した人工値で、探索が高い値を返しても、CAを学習できたことにはならない。
  what_we_verified: '**仕組みの検証：一部のみ（Mechanism: PARTIAL）**。Labは候補の重複と禁止された並びを除き、各位置まで視聴が続く確率を掛けて全体の評価値を求めた。探索の候補を絞ると、作れる並びが減ることも確認した。新しい探索を打ち切った場合に、従来の方式と同じ並びを返すことをテストした。この例での打ち切りは評価回数に基づく。'
  what_we_did_not_verify: '**実運用での性能・規模を増やした場合の挙動・本番適用：未検証（NOT TESTED）**。LabはCAの学習、実ログでの正規化エントロピー（NE）、A/Bテストの差、GPUの処理能力、実際の経過時間で打ち切った場合の動作、投稿の鮮度や投稿者の多様性への効果を再現していない。残りの価値の見積もりが真の最大値以上になる保証はなく、有限幅の探索で最適な並びが見つかる保証もない。'
  implementation: |-
    `score()` は各位置まで進む確率を掛けて全体を採点する（式9）。`future()` は残りの価値を見積もる（式12・14）。`decode()` は許可された並びを探索し、予算に達した場合は従来方式に戻る（Algorithm 1・2）。同じグループの候補に減点する規則は、学習したCAの代わりにLabが用意した。Paletteの公式実装ではない。

    Pythonの標準ライブラリだけを用いる。候補と予測値は固定してあり、乱数は使わない。スクリプトは結果をコードと同じフォルダーに保存する。
  results: |-
    Labが選んだ並びをすべて同じ継続確率付きの式で採点すると、動画を個別に評価した並びと、CAを使い1通りだけ残した並びは、どちらも14.732だった。この条件では、CAだけを使った場合の改善は確認できなかった。

    継続確率と残りの価値を使い6通りを残すと、選んだ並びは21.754になった。合法な並びをすべて調べたときの最大値22.512には届かなかった。候補を上位3本に絞っても、この幅6の探索が返す並びの評価値は21.754のままで、評価回数は72回から12回に減った。一方で候補4が外れるため、全候補で最も高かった並びは作れない。比較したのは評価回数で、GPUの処理能力ではない。
  mapping: mapping.md
teaching_figures:
- kind: equations
  id: list-value
  title: 視聴が続く確率から、選んだ動画と残りの枠の価値を求める
  after: method
  caption: 原論文の式9–14を読み解くための図。Labは著者の予測モデルを学習していない。
  source: https://arxiv.org/html/2609.18148v1
  locator: §3.2–3.3、式9–14
  rationale: その位置まで進む確率と、最後に選んだ動画の後に進む確率は区別する。
  steps:
  - name: その位置まで進む確率
    formula: p(Vₜ) = p(Vₜ₋₁) × CAcontinue(u,vₜ | Vₜ₋₁)
    explanation: 空の並びまでは確率1とする。そこから、選んだ各動画の後も視聴を続ける確率を順に掛ける。
  - name: 並び全体の期待値
    formula: ListVMgolden(V) = Σₜ p(Vₜ₋₁) [itemVM(CAₜ) + CLₜ]
    explanation: 各位置にたどり着く確率を、動画の価値とルールによる加減点の合計に掛ける。CLが−∞の候補は足す前に除く。
  - name: どの並びを次の段階に残すか
    formula: Q(Vₜ) = ListVMgolden(Vₜ) + s̄ Σⱼ qₜ^(j d̄/dₜ)
    explanation: 選んだ枠の価値と、残りの枠j=1…T−tの見積もりを足す。最後の枠まで選んだら、残りの見積もりは0になる。
