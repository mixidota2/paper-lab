<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">ILSMは候補を選び、既存の最終順位付けへ渡す</title><desc id="desc">元のGryphon論文の§3〜4をもとに作成。別論文のGryphon-v2と異なり、既存の最終順位付けに1,000曲を渡す。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#59717f"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#193743;font-size:20px}.small{font-size:17px}.head{font-size:25px;font-weight:700}.edge{stroke:#59717f;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="640" height="420" rx="18" fill="#f3f7f8"/><text x="24" y="38" class="head">履歴の計算結果を二つの処理で使う</text><rect x="24" y="63" width="592" height="63" rx="10" fill="#dbeceb"/><text x="40" y="93" class="">履歴を一度読み、表現Eᵤを作る</text><path class="edge" d="M165,126 L165,162"/><path class="edge" d="M480,126 L480,269"/><rect x="24" y="169" width="360" height="65" rx="10" fill="#dbeceb"/><text x="40" y="199" class="">ビーム探索でSIDを生成</text><path class="edge" d="M165,234 L165,270"/><rect x="24" y="277" width="360" height="65" rx="10" fill="#dbeceb"/><text x="40" y="307" class=""><tspan x="40" y="302">各SIDに対応する曲を取り出す</tspan><tspan x="40" y="328">ILSMで曲ごとに採点</tspan></text><path class="edge" d="M480,300 L388,300"/><path class="edge" d="M165,342 L165,362"/><text x="24" y="391" class="">1,000曲を従来の最終順位付けに渡して表示</text></svg>