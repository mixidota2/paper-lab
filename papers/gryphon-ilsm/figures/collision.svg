<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" role="img" aria-labelledby="title desc"><title id="title">曲を個別に採点しても候補外の曲は戻せない</title><desc id="desc">Labが4曲の人工データで比較した。数値は論文の結果ではない。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#59717f"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#193743;font-size:20px}.small{font-size:17px}.head{font-size:25px;font-weight:700}.edge{stroke:#59717f;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="640" height="490" rx="18" fill="#f3f7f8"/><text x="24" y="38" class="head">IDの確率順と曲ごとの採点を比べる</text><rect x="24" y="65" width="592" height="65" rx="10" fill="#dbeceb"/><text x="40" y="95" class="">SID 11：0.6 × 0.8 = 0.48</text><path class="edge" d="M160,130 L160,163"/><path class="edge" d="M475,130 L475,163"/><rect x="24" y="170" width="286" height="65" rx="10" fill="#dbeceb"/><text x="40" y="200" class="">曲Aの点は0.1</text><rect x="330" y="170" width="286" height="65" rx="10" fill="#bfe3d5"/><text x="346" y="200" class="">曲Bの点は0.9</text><text x="24" y="277" class="">AとBは同じIDだが、曲の点ではBが上。</text><rect x="24" y="304" width="592" height="66" rx="10" fill="#dbeceb"/><text x="40" y="334" class="">SID 12は0.6 × 0.2 = 0.12。曲Dの点は0.8。</text><text x="24" y="413" class="">DのSIDが残れば、Dを再採点して上に置ける。</text><text x="24" y="453" class="">DのSIDが落ちると、Dを再採点できない。</text></svg>