core_idea:
  author_claim: 著者は、生成したSIDの確率では曲ごとの違いを表せない場合に、曲を一つずつ採点する部品（ILSM）を使う。候補生成と採点は、利用者の履歴を一度読んで作った表現を共有する。論文は同じ候補を採点し直す比較と、従来の候補生成器と予備順位付けを置き換えたA/Bテストを報告する。
  research_bot_interpretation: 曲を一つずつ採点できても、その曲のSIDが探索から落ちていたら候補には戻せない。Labでは、まず生成でどの曲に到達できるか、次に残った曲をどう並べるかを分けて考える。最終順位付けを置き換えられるかは、教師の点数を学ぶ別論文の[Gryphon-v2](gryphon-v2-cascade.html)が扱った問いだ。
sections:
  overview: |-
    著者は、生成した識別子（SID）に登録されている曲を取り出し、その曲を一曲ずつ採点する方法を提案しました。Gryphonは候補を探す処理と採点する処理で、同じ視聴履歴の表現を使います。同じ識別子の曲でも別々に採点できます。ログを使った比較では、候補を変えずにこの採点を加えると、正解の曲を上位1,000件に含む割合が0.8209から0.8552になりました。

    7日間の本番実験では、15を超える候補生成器と予備順位付けをGryphonに置き換え、同じ最終順位付けモデルに渡す候補を3,000件から1,000件に減らしました。総聴取時間の推定差は0.25%増でしたが、統計的に明確な差は出ませんでした。総聴取時間が改善したとも、従来と同等だったとも、この比較だけでは言えません。
  problem: |-
    曲を短いトークン列で表す識別子をSemantic ID（SID）と呼ぶ。生成器は履歴から次の曲のSIDを予測するが、推薦で表示するのは曲だ。複数の曲に同じSIDが付く場合、生成確率だけではどの曲が利用者に合うかを区別できない。

    IDが曲ごとに異なっていても、生成の途中で選び間違えると、その後に探索する候補も変わる。著者は、IDの末尾に曲を識別するトークンを足す方法も比較した。ただし、新しい曲が追加されるたびに、区別するための語彙が増え続ける方式は、本番では扱いにくいと説明している。
  method: method.md
  why_it_might_work: 曲IDを含む表現で履歴を参照すれば、同じSIDの曲にも別々の点を付けられる。ILSMに履歴を渡し直す際にエンコーダーをもう一度動かさないため、候補生成と採点で計算を共有できる。ただし、曲の違いを表す特徴と、採点を学ぶための信号は必要だ。別の点が付くだけで推薦が良くなるとは限らない。
  evidence: |-
    ### 同じビームから、曲を個別に採点するとどう変わるか

    著者は表2で、ビーム探索が残した同じ2,048件のSIDを使い、IDの確率で比較する場合と、曲を採点する場合を比べた。IDを正解単位とする再現率と、曲を正解単位とする再現率は、測っている対象が異なる。

    | 採点と評価の単位 | Recall@1000 | 何を数えたか |
    | --- | ---: | --- |
    | 生成確率でSIDを評価 | 0.8404 | 正解に対応するSIDが上位1,000件に入ったか。 |
    | 生成確率で曲を評価 | 0.8209 | 各SIDを曲に展開した後の上位1,000曲に、正解曲が入ったか。 |
    | ILSMで曲を採点 | 0.8552 | 同じ候補を曲ごとの点で並べ直し、正解曲が上位1,000曲に入ったか。 |

    曲に対する再現率は0.8209から0.8552へ、3.43ポイント上がった。ILSMは、生成確率の順位が1,000位より下でも、2,048件のビームに残ったSIDから曲を昇格させられる。生成で候補に入らなかった曲まで戻せたわけではない。表1の別モデルとの比較（0.8245、0.8343）は、表2の同じ候補を使う比較とは分けて読む。著者は初期値を変えた予備実験で約±0.003の変動を確認したが、正式な複数回の有意差検定はしていない。

    ### 本番実験で置き換えたのは候補生成と予備順位付け

    著者は7日間、対象利用者の4%を実験群へ無作為に割り当てた。対照群では15を超える候補生成器が約1万曲を集め、予備順位付けで3,000曲に絞った。実験群ではそこまでをGryphonへ置き換え、1,000曲を渡した。最終順位付けモデルは両群で同じだ。

    主指標の総聴取時間（TLT）は+0.25%だったが、統計的に明確な差ではなかった。この実験だけでは総聴取時間が改善したとも、同等だったとも言えない。一方、著者は副指標のアクティブ利用者率が+0.43%、途中で聴くのをやめた曲が−1.3%で、どちらもp<0.001と報告した。

    [一次資料：元のGryphon論文第2版の表1〜3と§4](https://arxiv.org/html/2606.08604v2)
  executable_understanding: |-
    Labは4曲と3個のSIDで計算する。AとBは同じSIDで生成確率は0.48。Cは0.36、Dは0.12の別のSIDを持つ。正解はBとDとし、曲の点数は高い順にB、D、C、Aと固定した。曲の点数は学習していない。

    同じ候補を生成確率で並べる方法と、曲の点で並べる方法を比べた。さらにビーム幅を1、2、3へ変え、生成確率が同じ曲を逆順に並べる条件でも実行した。比較は `uv run papers/gryphon-ilsm/run.py` で実行できる。
  results: |-
    3個すべてのSIDを残すと、正解曲BとDはどちらも候補に入る。生成確率順の上位2曲はAとBで、再現率は0.5。固定した曲の点で並べると上位はBとDになり、再現率は1.0だった。AとBの同点で逆順に並べると、先頭の曲はAからBに変わるが、この例では上位2曲の再現率は変わらない。

    ビーム幅を2にしてDのSIDを落とすと、曲を再採点しても上限は0.5だ。一般に上位N曲の再現率は、Nと候補内の正解曲数のうち小さい方を、全正解曲数で割った値を超えられない。ここで計算できたのは手で決めた点と候補の関係で、モデルを学習した場合の改善率ではない。
  what_we_verified: Labは人工の曲で、同じSIDを持つ曲が生成確率順では同点になることを確かめた。候補集合が同じでも、曲ごとの点を使うと上位に残る曲は変わる。一方、ビーム探索から落ちた正解曲は再採点で戻せない。
  what_we_did_not_verify: LabはILSMを学習していない。曲IDだけで別の曲にも通用するか、新しい曲の扱い、カタログ更新、実際の応答時間や総聴取時間も検証していない。人工例で手で付けた点を、独立したラベルで学習したモデルが出せるかは分からない。
  implementation: Python標準ライブラリだけで `run.py` を実行できる。`experiment()` は各SIDの確率、SIDと曲の対応、同点の扱いを使って再現率を計算する。候補から脱落した正解曲も分母に残す。紙面で説明したクロスアテンションとsampled
    softmaxは実装せず、人工例では曲の点を固定した。
  mapping: |-
    | 論文の箇所 | Labの対応 | 扱わないもの |
    | --- | --- | --- |
    | [元のGryphon論文第2版の§2〜4](https://arxiv.org/html/2606.08604v2) | 手法の式と図。論文の数値と人工の数値は別の節に置く。 | 著者の性能の再現 |
    | §2〜3：同じSIDに対応する曲への展開と曲ごとの採点 | `run.py` で人工例を計算し、`results.json` に保存する。 | ニューラルモデルと本番データ |
    | 公式コード | 論文で実行可能な公開URLを確認できなかった。 | 公式実装との同等性 |
