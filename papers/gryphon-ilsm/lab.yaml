question: 同じIDで生成された曲を、どう区別して上位に残すか
summary: Gryphonは、生成したIDを曲へ展開し、その曲を個別に採点する。候補生成と採点は同じ履歴の表現を使う。本番では選んだ1,000曲を既存の最終順位付けへ渡した。主指標の総聴取時間は、従来方式との差が統計的に明確ではなかった。
