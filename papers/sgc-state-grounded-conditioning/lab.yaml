question: ゲーム中の助言を、持っている技と会話の流れにどう合わせるか
summary: Liuらは、ゲーム中の状況と会話の履歴を読んで、回答の前に調べることと提案する内容を決めました。200セッションを人が採点すると、すべての回答が基準を満たした割合は完全版で83.5%、比較方式で26.5%でした。勝率や継続率の改善幅は報告していません。
