core_idea:
  author_claim: 著者らは、回答を書く前に、使うツール、答えに必要な事実や制約、次に出す提案を三つの処理に分けました。言語モデルは、その結果を受けて文章を書きます。三つの処理を順に加えると、試合と会話の状況に合う回答が増えました。
  research_bot_interpretation: Labでは、[IGPO](igpo-huawei-inventory-grounded-search.html)は検索して確認できる候補を見つける手法、SGCは利用できる候補をどう説明し、いつ再提案するかを決める手法として比べます。著者らは両方式を組み合わせて試していません。プロンプトだけではあらゆる状況に対応できないと結論づけるには、別の設計や同じ量の調整を行った比較が必要です。
sections:
  overview: |-
    TencentのLiuらは、ゲーム中の助言が、プレイヤーの手持ちや直前の会話に合わなくなる問題を調べました。提案したSGCは、どのツールで調べるか、回答に必要な事実や制約は何か、次に何を提案するかを、文章を書く前に決めます。言語モデルは、自分で毎回これらを決め直す代わりに、ゲームと会話の状態をもとに決まった内容を受け取ります。

    著者らは実際のゲームのログをもとにした200セッション、約1,000回答を比較し、人が各回答を採点しました。3つの仕組みをすべて使うと、状況に合う回答の割合はセッションごとの平均で96.7%でした。すべての回答が基準を満たしたセッションは83.5%で、先に計画を作る比較方式の26.5%を上回りました。回答が始まるまでの平均は、最初のトークンで測って1.5秒、比較方式では6.1秒でした。この比較は回答の採点と待ち時間を扱い、勝率や継続率がどれだけ変わったかは示していません。
  problem: 攻略情報では正しい技でも、プレイヤーがまだ解放していなければ、その場では使えません。質問に沿った回答でも、今の所持品を取り違えたり、直前に見送った助言を繰り返したりすると、プレイヤーにとって使いづらくなります。著者らは、状況に合わない方向へ回答が進む失敗をdirection
    driftと呼びます。
  why_it_might_work: 必要条件を先に照らし合わせれば、文章が自然かどうかとは別に、その助言を実行できるかを検査できます。同じ候補、状態、設定、乱数の初期値を使えば、履歴に基づく提案を再現できます。ただし、質問から取り出した条件が間違っていたり、参照した状態が古かったりすると、規則で選んだ助言も間違います。規則だけで最終回答の意味まで保証する方法ではありません。
  evidence: |-
    [一次資料：原論文§7、表3〜4、付録G](https://arxiv.org/pdf/2609.27606v1)。著者らは約4週間分のゲームのログから抽出した200セッションで、同じ言語モデル、ツールの定義、参照証拠を使って5条件を比べました。プロンプトだけの条件は実際にはツールを使いません。2人が独立に採点し、食い違いは3人目が裁定しました。表の採点結果は人の判定に基づきます。応答時間は、同じ機器とネットワークで、準備運転の最初の要求を除いて測りました。

    | 比較した構成 | 最初のトークンまでの平均（秒） | 状況に合う回答（TGA、%） | 全回答が基準を満たしたセッション（SGA、%） | 助言の質／進展／一貫性 |
    | --- | ---: | ---: | ---: | --- |
    | プロンプトのみ | 2.3 | 61.1 | 20.0 | 6.2 / 4.7 / 8.3 |
    | 先に計画してから実行（PE-Agent） | 6.1 | 69.8 | 26.5 | 6.5 / 5.5 / 8.1 |
    | W1 | 1.5 | 89.1 | 46.5 | 8.4 / 7.7 / 9.0 |
    | W1とW2 | 1.5 | 89.9 | 56.5 | 8.4 / 7.7 / 8.9 |
    | W1、W2、W3 | 1.5 | 96.7 | 83.5 | 8.6 / 8.5 / 9.2 |

    TGAは、セッションの中で状況に合う回答が何割かを求め、セッションに同じ重みを付けて平均します。SGAは全回答が基準を満たしたセッションの割合です。右端は、助言の質（TGQ）、対話を通じた進展（DGP）、回答どうしの一貫性（CCC）を1〜10で採点した結果です。比較方式で73.5%だった基準未達のセッションは、完全版で16.5%でした。相対的に約78%減ったのはこの採点上の比率で、製品の障害件数ではありません。

    著者らは、比較方式をSGCと同じ量だけ製品向けに調整していません。差には構成の違いと調整の影響が含まれます。機能を順に足した結果から、各機能を単独で使った効果や、追加する順を変えた結果は分かりません。公開版では、言語モデルの具体名、評定者の一致度の全件集計、一部の統計表は確認できません。
  executable_understanding: |-
    Labは、プレイヤーがA、B、Cを持ち、Aに必要な技skill-Xだけはまだ使えないと仮定します。毎回同じ優先順で選ぶ規則、所持条件を照らし合わせる規則、条件に加えて履歴も見る規則を、同じ12ターンで比べます。言語モデルは使いません。

    <figure class="teaching" data-b21><h3>同じ所持品でも、履歴を読むと提案が変わる</h3><p>プレイヤーはA、B、Cを持っています。Aに必要な技だけが未解放です。BとCは使えます。</p><label>選ぶ規則 <select><option value="0">毎回同じ優先順</option><option value="1">所持条件を確かめる</option><option value="2">所持条件と履歴を確かめる</option></select></label><script type="application/json" data-frames>["<h4>毎回同じ優先順<\/h4><div class=\"b21-tokens\"><span>1: A<\/span><span>2: A<\/span><span>3: A<\/span><span>4: A<\/span><span>5: A<\/span><span>6: A<\/span><span>7: A<\/span><span>8: A<\/span><span>9: A<\/span><span>10: A<\/span><span>11: A<\/span><span>12: A<\/span><\/div><p>使えない提案 12 回 ／ 同じ提案が続く組 11 回 ／ 見送り 0 回<\/p>","<h4>所持条件を確かめる<\/h4><div class=\"b21-tokens\"><span>1: B<\/span><span>2: B<\/span><span>3: B<\/span><span>4: B<\/span><span>5: B<\/span><span>6: B<\/span><span>7: B<\/span><span>8: B<\/span><span>9: B<\/span><span>10: B<\/span><span>11: B<\/span><span>12: B<\/span><\/div><p>使えない提案 0 回 ／ 同じ提案が続く組 11 回 ／ 見送り 0 回<\/p>","<h4>所持条件と履歴を確かめる<\/h4><div class=\"b21-tokens\"><span>1: B<\/span><span>2: C<\/span><span>3: B<\/span><span class=\"muted\">4: 見送り<\/span><span>5: B<\/span><span>6: C<\/span><span>7: B<\/span><span>8: C<\/span><span>9: B<\/span><span>10: C<\/span><span>11: B<\/span><span class=\"muted\">12: 見送り<\/span><\/div><p>使えない提案 0 回 ／ 同じ提案が続く組 0 回 ／ 見送り 2 回<\/p>"]</script><div data-output><h4>毎回同じ優先順</h4><div class="b21-tokens"><span>1: A</span><span>2: A</span><span>3: A</span><span>4: A</span><span>5: A</span><span>6: A</span><span>7: A</span><span>8: A</span><span>9: A</span><span>10: A</span><span>11: A</span><span>12: A</span></div><p>使えない提案 12 回 ／ 同じ提案が続く組 11 回 ／ 見送り 0 回</p></div><figcaption>Labは原論文§5〜6の仕組みを、架空の12ターンで試します。値はrun.pyとresults.jsonに対応し、応答速度は測っていません。</figcaption></figure>
  results: 優先順だけで決める規則は、使えないAを12回提案しました。所持条件を確かめる規則では、使えない提案は0回でしたが、Bを続けて出した組が11ありました。履歴も見る規則では、使えない提案と連続した同じ提案がともに0回で、提案を見送ったのは2回でした。連続した提案は、隣り合うターンで同じ候補を出した組を数え、見送りを挟む再提案は数えません。これはLabの架空の結果で、論文の採点結果を再現したものではありません。
  what_we_verified: '**仕組み：一部確認（PARTIAL）。** Labは、条件を満たせない候補を除き、直前に提案した候補を見送ることを確かめました。乱数の初期値をそろえれば同じ提案になること、選べる候補がなければ提案しないことも確認しました。W1の教材では、必要な試合状態がない場合と、登録していない意図の場合に、ツールを先に確定しません。'
  what_we_did_not_verify: Labは、言葉から意図や条件を読み取る処理、生成中のタグ解析、実ツールの並列実行、最終回答の矛盾のなさを検証していません。著者らの200セッションの採点や最初のトークンまでの1.5秒を再現していません。処理の規模を広げた結果、実製品のA/B結果、ECやコード補完での効果、IGPOとの統合も未検証です。
  implementation: '`run.py` はPythonの標準ライブラリだけで動きます。`freeze_tools()` は登録した意図と試合状態を見て、先にツールを確定するかを返します。`ground()` は必要なもののうち、所持していないものを返します。`schedule()`
    は、見送る候補を除き、抽選して残った候補から選びます。`replay()` は選んだ候補を履歴に記録します。教材は待機を1ターンに固定します。軽い不足や注意の判定、段落の組み合わせの全規則、文章の生成は実装していません。'
  method: method.md
  mapping: mapping.md
teaching_figures:
- kind: matrix
  id: state-contract
  title: 回答前に決める内容は、どの状態を使うかで変わる
  after: core_idea
  columns:
  - 何を読むか
  - 何を決めるか
  - ほかの処理との関係
  rows:
  - label: W1：調べるものを選ぶ
    cells:
    - 質問の意図と試合の状態
    - 先に使うツールを決める
    - 結果c₁をW2とW3に渡す
  - label: W2：条件を照らし合わせる
    cells:
    - 使いたいものと実際に使えるもの
    - 食い違いを分類し、必要な説明を選ぶ
    - W1が取り出した質問の意図を使う
  - label: W3：履歴を使って候補を選ぶ
    cells:
    - 直近20ターンに何を提案したか
    - 待機中の候補を除き、選ぶか見送るかを決める
    - W1の意図と履歴から現在の状態を作る
  locator: Fig. 1 / Eq. 2 / §3–6
  caption: W2とW3は、担当する状態が違っても、どちらもW1の結果を使います。
  source: https://arxiv.org/pdf/2609.27606v1
  rationale: 試合の状態、使えるもの、直前の提案を、どの処理が読むかを示します。
- kind: equations
  id: conditioning
  title: 状態を調べてから、言語モデルに回答を書かせる
  after: method
  steps:
  - name: 回答の内容が、いまの状態と合うかを調べる
    formula: drift(y,s) = I[y is task-complete] × I[y mis-directs s]
    explanation: 式1では、質問への答えが完結したかと、回答が現時点の状態と合わないかを区別します。
  - name: 今の状態から、何を調べ何を提案するか決める
    formula: c₁=W₁(x,sᵢ꜀); c₂=W₂(x,sᶠˢ,c₁); c₃=W₃(x,sˢʰ,c₁)
    explanation: 式2と図1では、W2とW3がW1の結果c₁を使います。三つは独立した計算ではありません。
  - name: 必要な説明を残し、矛盾する段落を選ばない
    formula: Conflicts = diff(QuerySlots, σ(sᶠˢ)); R ⊆ P ⊆ A
    explanation: Aは選んでよい段落、Rは必ず入れる段落、Pは実際に選んだ段落です。同じ制約を満たす文と満たさない文は同時に選びません。
  - name: 言語モデルが決まった内容を受け取り、回答を書く
    formula: y = L(x, s_static, c₁, c₂, c₃)
    explanation: 同じ入力に規則が同じ答えを出しても、言語モデルの意図の読み取りや最終回答が必ず正しくなるわけではありません。
  locator: Eq. 1–4 / Fig. 1 / Table 7
  caption: Lは回答を書く言語モデルです。σは、現在満たせる条件に状態を変換します。
  source: https://arxiv.org/pdf/2609.27606v1
  rationale: 三つの処理の結果が、回答を作る言語モデルにどう渡るかを式で示します。
- kind: chart
  id: session-grounding
  title: 全回答が基準を満たしたセッションを比べる
  after: evidence
  unit: '%'
  maximum: 100
  bars:
  - label: プロンプトのみ
    value: 20
  - label: 先に計画する方式
    value: 26.5
  - label: W1
    value: 46.5
  - label: W1とW2
    value: 56.5
  - label: W1、W2、W3
    value: 83.5
  locator: Table 3 / Eq. 5
  caption: 200セッションを著者らが人手で採点しました。機能を一つずつ追加した比較で、各機能を単独で使った効果ではありません。
  source: https://arxiv.org/pdf/2609.27606v1
  rationale: 一部の回答だけではなく、セッション内の全回答が基準に合ったかを比べます。
