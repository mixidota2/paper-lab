question: 設計時だけ言語モデルを使うと、運用中は何が発注量を決めるか
summary: SabreAgentは、言語モデルが設計時に作った季節性と発注ルールの型を運用に残します。運用中は統計予測を更新し、在庫をもとに発注量を計算します。InventoryBenchでの正規化報酬は0.6311でした。著者の機能比較では、季節性やルールの見直しを加える前から、数理最適化だけで0.6180でした。実行方法の違いは本文で説明します。
