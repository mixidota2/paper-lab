- kind: equations
  id: inventory
  title: 不足と発注上限を別々に計算する
  locator: Eqs. (1), (3), (4); Proposition 8
  after: method
  rationale: 不足と発注上限を別々に計算する
  caption: 一次論文の図・式・表を説明用に再構成。数値は著者報告であり、Labの追試値ではない。
  steps:
  - name: 在庫を進める
    formula: Iₜ₊₁ = max(0, Iₜ + Aₜ − dₜ)
    explanation: 売れた分だけ在庫が減り、欠品後は負の在庫にならない。
  - name: 到着直前の不足
    formula: U = dₜ₊ᴸ − Îₜ₊ᴸ
    explanation: 確定済みの入荷と販売を進めて、今回の注文が届く直前の在庫を求める。
  - name: 決定的納期の限界価値
    formula: m(q) = p P(U ≥ q) − h E[(1 + κ(q−U)⁺/μ) 1{U<q}]
    explanation: m(q)が0へ下がる点を探す。κ=0なら不足Uのp/(p+h)分位点。κ付きの規則は近似である。
  - name: 確率的納期の方策族
    formula: q = min{(θr − IP)⁺, cr}
    explanation: rは局所的な需要予測。θで在庫目標、cで一回の発注上限を調整する。
  source: https://arxiv.org/pdf/2609.19760v2
