- kind: equations
  id: inventory
  title: 在庫不足と発注上限の計算式
  locator: 式(1)・(3)・(4)、命題8
  after: method
  rationale: 納期が決まっている場合と、納期が変わる場合に使う式を比べます。
  caption: 原論文の式を整理しました。Labで計算するのは在庫の推移と、係数を固定した発注上限です。
  steps:
  - name: 期末在庫
    formula: Iₜ₊₁ = max(0, Iₜ + Aₜ − dₜ)
    explanation: 手元在庫に入荷を足し、その週に売れる量だけ減らします。需要が在庫を上回っても在庫は負になりません。
  - name: 到着期の不足量
    formula: U = dₜ₊ᴸ − Îₜ₊ᴸ
    explanation: 今回の注文が届く直前の在庫を計算し、到着期の需要から引きます。
  - name: 納期が決まっている場合の近似
    formula: m(q) = p P(U ≥ q) − h E[(1 + κ(q−U)⁺/μ) 1{U<q}]
    explanation: 発注を増やしたときの売上と保管費の差が0に近づく量を探します。κ=0なら不足Uのp/(p+h)分位点です。κ付きの式は近似です。
  - name: 納期が変わる場合の発注上限
    formula: q = min{(θr − IP)⁺, cr}
    explanation: 需要予測rにθを掛けて在庫の目標を求めます。不足分が1回の発注上限crを上回る場合は、上限まで発注します。
  source: https://arxiv.org/pdf/2609.19760v2
