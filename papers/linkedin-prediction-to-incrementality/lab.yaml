question: 配信してもしなくても行動する会員より、届けることで行動が変わる会員を選べるか
summary: LinkedInは、施策を届けると成果がどれだけ増えるかを予測し、予算と配信回数の上限のもとで届け先を決めた。著者は、Feedの8週間のA/Bで長期価値の指標（LTV）が対照群より7.20%高かったと報告した。比較したのは配信方法の全体である。
