<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 658" role="img" aria-labelledby="title desc"><title id="title">GLIDEの候補も既存のモデルで並べる</title><desc id="desc">論文の§4.4と§5.3に基づきます。候補を集める経路を足し、順位を付けるモデルは変えません。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#26745f"/></marker></defs><rect width="560" height="658" fill="#fbfcf7"/><g font-family="sans-serif"><text x="22" y="35" font-size="25" fill="#183c35" font-weight="bold">候補を集め、既存のモデルで並べる</text><rect x="22" y="68" width="246" height="120" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="38" y="100" font-size="22" fill="#183c35" font-weight="bold">既存の候補経路</text><text x="38" y="130" font-size="19" fill="#183c35" font-weight="normal">従来どおり候補を探す</text><text x="38" y="157" font-size="19" fill="#183c35" font-weight="normal">試験群でも使う</text><rect x="292" y="68" width="246" height="120" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="308" y="100" font-size="22" fill="#183c35" font-weight="bold">GLIDEの候補経路</text><text x="308" y="130" font-size="19" fill="#183c35" font-weight="normal">履歴などからSIDを生成</text><text x="308" y="157" font-size="19" fill="#183c35" font-weight="normal">SIDをエピソードに戻す</text><path d="M145,188 L220,241" stroke="#26745f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M415,188 L340,241" stroke="#26745f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="70" y="250" width="420" height="113" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="86" y="282" font-size="22" fill="#183c35" font-weight="bold">既存の候補に加える</text><text x="86" y="312" font-size="19" fill="#183c35" font-weight="normal">候補の重複と配信条件を確認</text><text x="86" y="339" font-size="19" fill="#183c35" font-weight="normal">同じSIDから条件に合う候補を選ぶ</text><path d="M280,363 L280,400" stroke="#26745f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="70" y="411" width="420" height="90" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="86" y="443" font-size="22" fill="#183c35" font-weight="bold">エピソードの順位を決める</text><text x="86" y="473" font-size="19" fill="#183c35" font-weight="normal">既存のモデルが全経路の候補を採点</text><path d="M280,501 L280,538" stroke="#26745f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="135" y="548" width="290" height="83" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="151" y="580" font-size="22" fill="#183c35" font-weight="bold">ホーム画面に表示</text><text x="151" y="610" font-size="19" fill="#183c35" font-weight="normal">発見の増分はA/Bで測る</text></g></svg>
