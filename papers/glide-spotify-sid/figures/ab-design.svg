<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 648" role="img" aria-labelledby="title desc"><title id="title">再生の増加と、候補の採用割合は別</title><desc id="desc">論文の§5.3に基づきます。再生の変化は二群で比べ、候補の採用割合は試験群の中だけで数えます。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#26745f"/></marker></defs><rect width="560" height="648" fill="#fbfcf7"/><g font-family="sans-serif"><text x="22" y="35" font-size="25" fill="#183c35" font-weight="bold">利用者を無作為に二群に分ける</text><rect x="25" y="65" width="510" height="116" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="41" y="97" font-size="22" fill="#183c35" font-weight="bold">対象と期間</text><text x="41" y="127" font-size="19" fill="#183c35" font-weight="normal">英語圏で直近30日に活動した利用者</text><text x="41" y="154" font-size="19" fill="#183c35" font-weight="normal">21日間、各群の表示は約2,000万回</text><path d="M170,181 L150,220" stroke="#26745f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M390,181 L410,220" stroke="#26745f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="22" y="233" width="246" height="117" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="38" y="265" font-size="22" fill="#183c35" font-weight="bold">比較群</text><text x="38" y="295" font-size="19" fill="#183c35" font-weight="normal">既存経路の候補</text><text x="38" y="322" font-size="19" fill="#183c35" font-weight="normal">既存の順位付け</text><rect x="292" y="233" width="246" height="117" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="308" y="265" font-size="22" fill="#183c35" font-weight="bold">試験群</text><text x="308" y="295" font-size="19" fill="#183c35" font-weight="normal">GLIDEの候補も追加</text><text x="308" y="322" font-size="19" fill="#183c35" font-weight="normal">既存の順位付け</text><text x="25" y="398" font-size="23" fill="#183c35" font-weight="bold">ホーム画面での再生増加（論文の結果）</text><rect x="25" y="425" width="510" height="119" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="41" y="457" font-size="22" fill="#183c35" font-weight="bold">普段は聴いていない番組の再生</text><text x="41" y="487" font-size="19" fill="#183c35" font-weight="normal">利用者当たり +5.4%</text><text x="41" y="514" font-size="19" fill="#183c35" font-weight="normal">初めて聴く番組の再生 +14.3%</text><text x="25" y="584" font-size="21" fill="#183c35" font-weight="normal">試験群の推薦のうち、GLIDEが約34%</text><text x="25" y="618" font-size="21" fill="#a94438" font-weight="normal">推薦の数や、発見が増えた割合ではない</text></g></svg>
