<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 630" role="img" aria-labelledby="title desc"><title id="title">長期はsoft prompt、直近はSID履歴</title><desc id="desc">§4.1–4.3と図2を再構成。SID側の内容ベクトルとユーザーCFを混同しない。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#26745f"/></marker></defs><rect width="560" height="630" fill="#fbfcf7"/><g font-family="sans-serif"><text x="22" y="35" font-size="24" fill="#183c35" font-weight="bold">安定した嗜好と、直近の意図を分ける</text><rect x="25" y="65" width="510" height="116" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="41" y="97" font-size="22" fill="#183c35" font-weight="bold">長期：既存CFのユーザーベクトル</text><text x="41" y="127" font-size="19" fill="#183c35" font-weight="normal">2層MLP → Llamaのhidden dimension</text><text x="41" y="154" font-size="19" fill="#183c35" font-weight="normal">1 soft tokenとして入力（文字列ではない）</text><path d="M280,181 L280,215" stroke="#26745f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="25" y="225" width="510" height="170" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="41" y="257" font-size="22" fill="#183c35" font-weight="bold">モデルへ渡す順序</text><text x="41" y="287" font-size="19" fill="#183c35" font-weight="normal">system instruction → soft token</text><text x="41" y="314" font-size="19" fill="#183c35" font-weight="normal">軽いユーザー文脈 → 時間順の直近SID列</text><text x="41" y="341" font-size="19" fill="#183c35" font-weight="normal">最後に familiar / unfamiliar の指示</text><text x="41" y="368" font-size="19" fill="#183c35" font-weight="normal">同じモデルの条件を切り替える</text><path d="M280,395 L280,430" stroke="#26745f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="25" y="440" width="510" height="120" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="41" y="472" font-size="22" fill="#183c35" font-weight="bold">Llama 3.2 1Bベース</text><text x="41" y="502" font-size="19" fill="#183c35" font-weight="normal">SIDと説明文の双方向grounding</text><text x="41" y="529" font-size="19" fill="#183c35" font-weight="normal">その後、推薦用instruction tuning</text><text x="25" y="601" font-size="18" fill="#183c35" font-weight="normal">注意：1 tokenが全履歴を可逆に保存するわけではない</text></g></svg>
