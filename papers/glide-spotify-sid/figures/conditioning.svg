<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 630" role="img" aria-labelledby="title desc"><title id="title">長期の好みと直近の履歴を別々に渡す</title><desc id="desc">論文の§4.1〜4.3と図2に基づきます。エピソードの内容と利用者の長期的な好みは別々のベクトルです。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#26745f"/></marker></defs><rect width="560" height="630" fill="#fbfcf7"/><g font-family="sans-serif"><text x="22" y="35" font-size="24" fill="#183c35" font-weight="bold">長期の好みと直近の履歴を分ける</text><rect x="25" y="65" width="510" height="116" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="41" y="97" font-size="22" fill="#183c35" font-weight="bold">長期：好みを表す既存のベクトル</text><text x="41" y="127" font-size="19" fill="#183c35" font-weight="normal">2層のMLPでLlamaの入力に合わせる</text><text x="41" y="154" font-size="19" fill="#183c35" font-weight="normal">文字ではなく1トークン分の位置に置く</text><path d="M280,181 L280,215" stroke="#26745f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="25" y="225" width="510" height="170" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="41" y="257" font-size="22" fill="#183c35" font-weight="bold">モデルへ渡す順序</text><text x="41" y="287" font-size="19" fill="#183c35" font-weight="normal">最初の指示の後に長期の好みを置く</text><text x="41" y="314" font-size="19" fill="#183c35" font-weight="normal">地域などの情報と、古い順の直近履歴を渡す</text><text x="41" y="341" font-size="19" fill="#183c35" font-weight="normal">最後に、以前聴いた番組か、初めてかを指示</text><text x="41" y="368" font-size="19" fill="#183c35" font-weight="normal">同じモデルで探す番組の条件を変える</text><path d="M280,395 L280,430" stroke="#26745f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="25" y="440" width="510" height="120" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="41" y="472" font-size="22" fill="#183c35" font-weight="bold">Llama 3.2 1Bベース</text><text x="41" y="502" font-size="19" fill="#183c35" font-weight="normal">SIDと説明を相互に変換する学習</text><text x="41" y="529" font-size="19" fill="#183c35" font-weight="normal">その後で、番組の探し方を学習</text><text x="25" y="601" font-size="18" fill="#183c35" font-weight="normal">長期の好みから元の履歴すべてを復元する方式ではない</text></g></svg>
