question: Spotifyは既存の推薦に、どんなポッドキャスト候補を加えたのか
summary: GLIDEは、長期の好みを表すベクトルと直近の再生履歴を使って、番組を見つけるための候補を生成します。Spotifyはその候補を既存の順位付けに追加し、21日間の比較で普段は聴いていない番組の利用者当たり再生数が5.4%増えたと報告しました。
