  - name: 最も近い重心
    formula: cₘ = argminⱼ ‖rₘ₋₁ − μₘ,ⱼ‖₂
    explanation: 各段には256個の重心があります。前の段までに説明できず残った値に最も近い重心を一つ選びます。
  - name: 説明済みの成分を引く
    formula: rₘ = rₘ₋₁ − μₘ,cₘ ; SID(e) = (c₁,c₂,c₃,c₄)
    explanation: 4段から4個のトークンを得ます。段ごとの番号を区別するため、語彙には4×256＝1,024個を追加します。
- kind: equations
  id: conditioning
  title: 長期の好みと直近の履歴を使って候補を出す
  after: method
  source: https://arxiv.org/html/2603.17540
  locator: §4.1.2–4.3
  rationale: どの情報を入力し、何を出力するのかを順に示します。
  caption: 著者は推薦を学ぶ段階で、好みのベクトルを変換する部分も学習します。元の履歴全体を復元できると仮定していません。
  steps:
  - name: 長期嗜好の射影
    formula: ṽᵤ = MLP₂(vᵤ) ∈ ℝ^(1 × dLLM)
    explanation: 利用者の好みを表す既存のベクトルを、2層のMLPで変換します。文字ではなく1トークン分の位置に置きます。
  - name: 候補の生成
    formula: p(SID(e) | ṽᵤ, SID(Hrecent), context, instruction)
    explanation: 再生履歴は古い順に渡します。利用者の地域と、以前に聴いた番組か、初めての番組かの指示も入力します。
interactives: []
core_idea:
  author_claim: Spotifyの著者は、ポッドキャストの内容を短い番号列にまとめます。利用者の長期的な好み、直近の再生履歴、どんな番組を探すかを入力し、生成した番号を実際の候補に戻して既存の順位付けに渡します。
  research_bot_interpretation: 追加した生成器だけの順位がどれだけ良いかより、既存の候補が拾えなかったものを足せるかが、この事例の問いです。既存の好みを表すモデルも使うため、結果を生成モデルだけの能力には帰せません。
sections:
  overview: |-
    Spotifyの著者は、利用者がまだよく聴いていないポッドキャストを見つけやすくするため、エピソードを内容に応じた短いコードで表すGLIDEを提案しました。モデルは直近の再生履歴、長期の好み、どんな番組を探すかの指示を受け取り、候補のコードを生成します。その候補を既存の順位付けに加えた21日間の比較では、直近28日で10分未満しか聴いていない番組の再生が、利用者当たり5.4%増えました。論文が新番組として集計した再生は、同じ条件で14.3%増えました。比較したのは候補を追加したシステム全体で、個々の工夫の効果を切り分けた結果ではありません。
  problem: |-
    著者は、ある利用者が直近28日で10分以上聴いた番組を、習慣として聴いている番組と定義しました。10分未満の番組のうち、過去に一度も聴いていない番組と、以前に聴いたことがある番組を分けます。前者を見つけることと、後者を久しぶりに聴くことは、どちらも発見として扱いますが、別々に測れます。

    GLIDEが推薦するのは個々のエピソードです。利用者がその番組を聴いたことがあるかは、番組全体の履歴で判断します。聴き慣れた番組で初めてのエピソードを聴いた場合、初めてその番組を聴いたことにはなりません。
  method: method.md
  why_it_might_work: |-
    長期的な好みを表すベクトルには、複数の利用者の再生傾向から学んだ情報があります。直近の履歴は短い番号列で渡すので、どのエピソードをどの順番で聴いたかが残ります。長期と直近の好みを分けて渡せば、過去の履歴を毎回すべて文章にする必要がなくなります。

    ただし、1個のベクトルからすべての再生履歴を取り出せるとは限りません。長期の好みとその場で探したい番組が違う場合にどちらを優先するかは、別に調べたい点です。
  evidence: |-
    ### ホーム画面で、普段は聴いていない番組の再生が増えた

    英語圏の市場で、試験前30日間に活動したポッドキャスト利用者を、著者は利用者単位で無作為に割り付けました。21日間の各群の表示は約2,000万回です。比較群は既存の推薦を使い、試験群はGLIDEの候補も加え、既存のモデルで順位を付けました。

    ホーム画面で、直近28日で10分未満しか聴いていない番組の利用者当たり再生数は、比較群より5.4%増えました。そのうち、著者が新しい番組として数えた再生は14.3%増えました。論文の有意性の表記はα < 0.01です。著者は運用予算に収まったとしていますが、実際に増えた再生の件数、信頼区間、処理時間や費用の詳しい内訳は示していません。

    試験群で表示された推薦の約34%はGLIDEの候補でした。これは表示に採用された経路の割合です。既存経路でも同じ候補が見つかることがあるので、表示数が34%増えたり、発見の増加の34%をGLIDEが生んだりしたことを示す数値ではありません。[一次資料：§5.3](https://arxiv.org/html/2603.17540v1#S5.SS3)。

    ### 量子化方式を変えると、候補の順位と番号の重なり方が変わる

    表1の、以前に聴いたことがある番組だけの評価では、SIDだけで学んだモデルに対し、SIDと文章を渡した方式はNDCG@30が30.5%、GLIDEは28.7%高くなりました。NDCG@30は、正解に近い候補を上位30件の中で上に置けるほど高くなる指標です。この区分では、GLIDEが最良とは限りませんでした。

    表2は、要素を短い番号列に変える三つの方式を比べました。上位30件に正解が入る割合（HR@30）は、RQ-VAEを基準に、R-LFQが4.76%、R-KMeansが9.52%高くなりました。同じ番号を持つエピソード同士の平均コサイン類似度は、RQ-VAE 0.657、R-LFQ 0.713、R-KMeans 0.856でした。著者はこの条件での候補の品質や、学習した番号の使われ方を踏まえてR-KMeansを選びました。別のカタログでも同じ順位になるとは限りません。
  executable_understanding: |-
    Labは、架空の推薦100枠のうち34枠に追加経路の印を付けました。元の各枠で番組を発見する確率を0.1とします。新しい候補の確率を0.05、0.1、0.2の三つに変え、元の経路でも見つかる候補の数も変えます。重複した候補の結果は同じと仮定し、期待される発見の数を計算します。利用者の反応は抽選しません。

    別の計算では、履歴をすべて文章にする場合、すべてSIDにする場合、長期の好みと直近のSIDだけを渡す場合で、入力のトークン数を比べます。文章は1件30トークン、直近の履歴は20件と仮定しました。
  results: |-
    追加経路を34枠に固定しても、新候補が発見につながる確率を変えると、期待される発見数は元より17%減る場合、変わらない場合、34%増える場合がありました。候補がすべて重複する例では、期待される発見数は変わりません。

    古い履歴100件と直近20件を文章で渡すと3,600トークン、すべてSIDなら480トークンです。長期の好みを1トークンとして、直近20件だけを4トークンずつのSIDで渡すと81トークンです。残せる情報や、処理にかかる時間が同じ割合で変わることを確かめたわけではありません。
  what_we_verified: |-
    Labは、追加経路の比率が同じでも、発見の期待件数が変わる例を計算しました。また、決めた履歴の件数から、表現ごとの入力トークン数を再計算し、結果を同じJSONに保存しました。
  what_we_did_not_verify: |-
    LabはLlama、利用者ベクトルの射影や量子化方式を学習していません。番号が重なる頻度、実際のトークナイザー、処理時間、利用者が発見した番組も再現していません。小さな合成計算で、番号が偏る理由やR-KMeansの優位性を確かめたわけではありません。
  implementation: |-
    `run.py` はPythonの標準ライブラリだけで動きます。保存した場所で `python3 run.py` を実行すると、同じ場所に `results.json` を書き出します。`channel_case()` は候補を変えた場合の期待件数を求め、`token_budget()` は履歴を渡すためのトークン数を数えます。実サービスで必要な重複除去、配信条件、順位付け、試験の割付は行いません。
  mapping: mapping.md
