question: 候補を作った途中の情報を順位付けに使いながら、二つの学習が互いを妨げないようにできるか
summary: UniR²はライブ配信の候補を作る途中の情報を使って、候補に点数を付ける。Kuaishouが本番で置き換えたのは、候補を探す処理と最終順位付けの前に候補を絞る処理である。
