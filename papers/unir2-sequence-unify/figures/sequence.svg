<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 490" role="img" aria-labelledby="title"><title id="title">一列の入力から、候補を作り点数を付ける</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#586c78"/></marker></defs><rect width="560" height="490" fill="#f7faf9"/><style>text{font-family:system-ui,sans-serif;fill:#183640;font-size:19px}.small{font-size:16px}.head{font-size:23px;font-weight:700}</style>
<text x="24" y="35" class="head">一列の入力から、候補を作り点数を付ける</text>
<rect x="28" y="62" width="504" height="88" rx="10" fill="#e2efea" stroke="#a6bdb5"/>
<text x="42" y="89" class="">P：履歴とプロフィール</text>
<text x="42" y="116" class="">種類ごとにベクトルへ変換する</text>
<path d="M280 150 L280 176" fill="none" stroke="#586c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="178" width="504" height="88" rx="10" fill="#e2efea" stroke="#a6bdb5"/>
<text x="42" y="205" class="">T_gen：BOS → q1 → q2 → q3</text>
<text x="42" y="232" class="">次の記号を予測し、最後の表現を順位付けへ渡す</text>
<path d="M280 266 L280 292" fill="none" stroke="#586c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="294" width="504" height="88" rx="10" fill="#e2efea" stroke="#a6bdb5"/>
<text x="42" y="321" class="">T_rank：候補の属性、内容、組み合わせの統計</text>
<text x="42" y="348" class="">候補の特徴を起点に、各層で情報を組み合わせる</text>
<text x="38" y="415" class="">h_lastSID ＋ h_rank ＋ 元のu/v特徴</text>
<text x="38" y="445" class="">→ MMoE → CTR / LVTR / GTR</text><text x="24" y="474" class="small">論文の図2をもとにLabが作成</text></svg>
