- kind: equations
  id: gradients
  title: 発注の有無Yと数量Qで勾配の求め方を分ける
  locator: Eqs. (1)–(2); Appendix C.3
  after: method
  rationale: 発注の有無Yと数量Qで勾配の求め方を分ける
  caption: 一次論文の図・式・表を説明用に再構成。数値は著者報告であり、Labの追試値ではない。
  steps:
  - name: 行動
    formula: Y ~ Bernoulli(p), Qᵢ = q̄ᵢ sigmoid(wᵀhᵢ + c)
    explanation: 実際の発注量はYQ。商品ごとの連続量は上限q̄ᵢまで。
  - name: 発注の有無に対する勾配
    formula: ∇ E[C] = E[(C − b) ∇ log π(Y|s)]
    explanation: score gradientの説明用の式。実際の学習にはcriticによる費用の推定と、先の期まで模擬するrolloutを使う。
  - name: 数量の勾配
    formula: ∂C/∂Q → 在庫・未着注文 → 将来の保有費用とbacklog費用
    explanation: サンプルしたYと需要を固定し、数量だけを変えて微分する。発注の有無を直接微分するわけではない。
  source: https://arxiv.org/pdf/2609.01933v2
