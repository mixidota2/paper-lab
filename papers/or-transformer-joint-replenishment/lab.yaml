core_idea:
  author_claim: 著者らは、共同発注するかどうかと商品ごとの候補数量を別々に出すモデルを作りました。発注するかは選んだ行動の確率を使って学習し、数量は、需要と発注の有無を固定し、数量を少し変えたときに後の在庫や費用がどう変わるかを計算して学習しました。
  research_bot_interpretation: Transformer-PPOは同じ種類のモデルで、数量の学び方が異なります。HPOは在庫の計算を通して数量の変化を学ぶ一方、商品間の関係は全結合のネットワークで扱います。費用の差だけでは、Transformerと数量の学び方がそれぞれどれだけ貢献したかは分かりません。
sections:
  overview: |-
    Liuらは、複数の商品をまとめて発注するたびに固定費がかかる場合に、いつ発注し、各商品を何個頼むかを決める方法を提案しました。著者らのOR-Transformerは、全商品の在庫や未着注文を見て、まとめて発注するかと、発注する場合の商品ごとの数量を別々に求めます。学習では、数量を変えたときに、その後の在庫や費用がどう変わるかをシミュレーターの式から計算します。

    著者らは、需要や納期を設定したシミュレーションで、1,024商品を50回の判断にわたって評価しました。平均割引費用はOR-Transformerが約35万、学習する比較手法の中で最も費用が低かったPPOが約139万で、提案手法の費用はPPOより約75%低くなりました。この規模で各手法を学習したのは1回で、128回は評価用の試行数です。著者らは実店舗では検証していません。
  problem: 複数の商品をまとめて発注すると、品目の数や注文量にかかわらず1回分の固定費がかかります。一つの商品を補充するとき、他の商品も同時に頼めば、別々に発注する場合より固定費を抑えられます。一方、必要より早く頼むと保管費が増えます。著者らは、在庫が足りずに満たせなかった分は未納として次期へ繰り越す設定を使いました。棚から商品がなくなった時点で売上が失われる設定ではありません。
  why_it_might_work: 著者らのモデルでは、商品の並び順は判断材料になりません。商品を並べ替えると数量の出力も同じ順に変わり、発注する確率と将来費用の見積もりは変わりません。また、今の発注量が変われば、納期を経て届く量や、その後の未納と在庫も変わります。モデルは、変更の影響を後の期まで追って、数量をどう調整すれば総費用が下がるかを学びます。
  evidence: |-
    ### 1,024商品の50回の判断では、学習する比較手法の中でPPOが最も低コストだった

    著者らは、互いに関連する商品の需要を人工的に作り、納期や保有・未納の費用を商品ごとに変えました。学習には使わなかった128本のシミュレーション経路で、50回の発注判断にかかった割引費用を比較しました。割引費用は、後の期の費用ほど重みを小さくして合計した値です。

    1,024商品では、平均割引費用がOR-Transformerで約35万、学習する比較手法で最も低かったPPOで約139万でした。OR-TransformerはPPOより約75%低い結果でした。1商品と4商品ではHPOが最も低く、16商品以上ではOR-Transformerが最も低くなりました。1,024商品では各手法を学習したのは1回です。128本は学習の繰り返しではなく、評価に使った需要と在庫の経路の数です。

    著者らは、同じ50回の比較で、GurobiとHiGHSにも、100通りの需要を想定して50期先まで計画する問題を解かせました。各発注判断の上限は10分です。1,024商品の場合、両方のソルバーが全6,400回の判断で時間切れになり、毎回発注量0を返しました。そのため、両方の費用は同じ約935万になりました。これは時間制限内に発注できなかった場合との比較です。両ソルバーが最適な発注案を求めたときの成績ではありません（表D.4・D.5）。

    ### 8回の判断では、Gurobiの計算上限を別に設定した

    著者らは1,024商品の別の比較で、発注を8回判断し、Gurobiに1回につき最大6時間を認めました。割引費用は、千単位でOR-Transformerが126.61±4.23、Gurobiが156.58±4.93でした。±は標準誤差です。OR-Transformerが19.1%低い結果でした。

    著者らは、8回の判断にかかった合計時間を、OR-Transformerが0.0432秒、Gurobiが48時間49分と報告しました。400万倍を超える差は、学習を終えたモデルが判断を出す時間と、その条件でソルバーを実行した時間の比較です。モデルの学習時間は含みません。[Gurobiの仕様書](https://docs.gurobi.com/projects/optimizer/en/current/reference/parameters.html#timelimit)によると、終了処理で設定した時間を超える場合があります。ただし、論文の48時間49分の内訳は確認できていません。論文のこの結果から、実店舗で同じ割合の費用が下がるとは分かりません。

    一次資料：[原論文v2の第4節・図4.1・付録D](https://arxiv.org/html/2609.01933v2)。
  executable_understanding: Labは学習していない自己注意を使い、3商品の並びを6通り変えて、出力が対応する順に並び替わるかを確かめます。さらに1商品・2期の人工例で、発注量Qを少し増やした場合と減らした場合の費用から傾きを計算し、式で求めた値と比べます。発注の有無については、0か1を確率で選ぶ小さな例を作り、スコア勾配と、期待費用を直接微分した値を照合します。
  results: |-
    商品を並べ替えると、各商品の出力は同じ順に並び替わり、全体を表す出力は変わりませんでした。ここで比べた出力は計算上の商品表現であり、学習した発注量ではありません。

    1商品・2期の例で、発注量Qが0.5、2.5、4.5のとき、費用の傾きは順に−8、−3、2でした。Qが小さい範囲では、少し多く発注すると未納が減り、費用も下がります。Qが大きく両期で在庫が残る範囲では、多く発注するほど保有費用が上がります。
  what_we_verified: '**CONFIRMED（確認済み）。** Labの固定した自己注意では、商品の入力順と商品別の出力順が対応しました。在庫がゼロをまたがない範囲で、費用を式から微分した値は、数量を前後にずらして計算した中央差分と一致しました。発注の有無を選ぶスコア勾配も、期待費用を直接微分した値と一致しました。原論文の仕組みのうち、この小さな例が扱う範囲だけを確認しています（PARTIAL）。'
  what_we_did_not_verify: '**NOT TESTED（未検証）。** Labは原論文のTransformerを学習させていません。PPOやHPOとの性能比較、1,024商品の割引費用、Gurobiの判断時間も再現していません。在庫がゼロになる境目での微分、納期が長い場合の学習の安定性、実店舗での運用も確認していません。'
  implementation: |-
    `attention()` は、全体を表す入力と商品ごとの入力に同じ処理を行います。`cost()` は、1回分の固定費と2期分の保有費用・未納費用を足します。`derivative()` は、Qを少し動かしたときの費用の傾きを計算します。発注しないと実際の発注量は0です。そのとき候補量Qを変えても、在庫や費用は変わりません。

    `uv run papers/or-transformer-joint-replenishment/run.py` を実行すると、同じフォルダの `results.json` を作り直せます。Pythonの標準ライブラリだけで動きます。
  method: method.md
  mapping: mapping.md
teaching_figures:
- kind: architecture
  id: tokens
  title: 商品を並べ替えると、その商品の数量の出力も同じ順に変わる
  locator: Figure 3.1; Eq. (2)
  after: method
  rationale: ふたつの全体出力は変えず、商品ごとの数量だけを入力と同じ順に入れ替えます。
  caption: 著者らが全体の情報と各商品の情報から、発注確率、数量、将来費用をどう出すかを示します。
  rows:
  - label: 全商品に共通の情報と、商品ごとの情報を渡す
    nodes:
    - title: 全体の状態を表す入力
      text: 発注の固定費や、市場全体の需要の状態など、商品によらない情報を入れます。
    - title: 商品を1つずつ表す入力
      text: 商品ごとに在庫、未着注文、費用、納期などを渡します。商品の一覧の位置は渡しません。
  - label: 3つの別々のTransformerが判断する
    nodes:
    - title: 共同発注する確率
      text: 全体の出力から確率pを求め、その確率で発注するかYを選びます。
    - title: 各商品の候補数量
      text: 商品ごとの出力からQᵢを求めます。商品の順を変えると、数量も同じ順に変わります。
    - title: 将来の割引費用
      text: 将来の費用を見積もるモデル（critic）は、全体の出力を使ってVを求めます。
  source: https://arxiv.org/pdf/2609.01933v2
- kind: equations
  id: gradients
  title: 発注の有無と発注量では、学習に使う勾配が違う
  locator: Eqs. (1)–(2); Appendix C.3
  after: method
  rationale: 発注の有無は0か1で、数量は連続した値です。その違いに合わせて著者らは学習方法を分けました。
  caption: 式(1)・(2)と付録C.3に沿って、発注する判断と数量を出す判断を分けて示します。
  steps:
  - name: 発注する場合だけ、候補の数量を注文する
    formula: Y ~ Bernoulli(p), Qᵢ = q̄ᵢ sigmoid(wᵀhᵢ + c)
    explanation: 実際の発注量はYQです。商品ごとの数量は上限q̄ᵢを超えません。
  - name: 選んだ行動の確率から学ぶ
    formula: ∇ E[C] = E[(C − b) ∇ log π(Y|s)]
    explanation: 行動の対数確率の傾きに、費用と基準の差を掛けます。著者らは将来の費用の推定も使います。
  - name: 数量を変えた場合の費用から学ぶ
    formula: ∂C/∂Q → 在庫・未着注文 → 将来の保有費用とbacklog費用
    explanation: 需要と各期の発注の有無を固定し、Qを変えたときに後の在庫と費用がどう動くかを微分します。
  source: https://arxiv.org/pdf/2609.01933v2
