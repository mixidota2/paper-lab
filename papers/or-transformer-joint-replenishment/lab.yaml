question: "まとめて発注すると固定費がかかるとき、どの商品をいつ、何個発注するか"
summary: "OR-Transformerは複数の商品をまとめて発注するかどうかと、発注する場合の数量を別々に学びます。著者のシミュレーションでは、1,024商品の費用が、学習する比較手法の中で最も費用が低かったPPOより約75%低くなりました。実店舗での検証ではありません。"
