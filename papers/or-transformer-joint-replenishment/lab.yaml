- kind: equations
  id: gradients
  title: "発注するかどうかと数量とでは、費用の傾きの求め方が違う"
  locator: Eqs. (1)–(2); Appendix C.3
  after: method
  rationale: "発注するかどうかと数量とでは、費用の傾きの求め方が違う"
  caption: "原論文の式(1)〜(2)と付録C.3にある学習の考え方を説明します。Labが原論文の学習を再現した結果ではありません。"
  steps:
  - name: "実行する発注量"
    formula: Y ~ Bernoulli(p), Qᵢ = q̄ᵢ sigmoid(wᵀhᵢ + c)
    explanation: "実際の発注量はYQです。発注する場合も、商品ごとの数量は上限q̄ᵢまでです。"
  - name: "発注の有無を学ぶときのスコア勾配"
    formula: ∇ E[C] = E[(C − b) ∇ log π(Y|s)]
    explanation: "選んだ行動の対数確率の傾きに、費用と基準との差を掛けます。原論文は今後の費用の推定と、先の期まで発注を模擬する処理も使います。"
  - name: "数量を学ぶときの経路ごとの勾配"
    formula: ∂C/∂Q → 在庫・未着注文 → 将来の保有費用とbacklog費用
    explanation: "需要と発注の有無Yを変えず、Qが後の在庫や未納に与える影響を微分します。この計算は発注するかどうかの値を微分しません。"
  source: https://arxiv.org/pdf/2609.01933v2
