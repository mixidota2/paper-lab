  after: method
  rationale: Yの離散判断とQの連続経路を分ける
  caption: 一次論文の図・式・表を説明用に再構成。数値は著者報告であり、Labの追試値ではない。
  steps:
  - name: 行動
    formula: Y ~ Bernoulli(p), Qᵢ = q̄ᵢ sigmoid(wᵀhᵢ + c)
    explanation: 実際の発注はYQ。上限q̄ᵢまでの連続量を出す。
  - name: 注文を開く勾配
    formula: ∇ E[C] = E[(C − b) ∇ log π(Y|s)]
    explanation: 説明用のscore推定式。実際の訓練にはcriticとrolloutを使う。
  - name: 数量の勾配
    formula: ∂C/∂Q → 在庫・未着注文 → 将来の保有費用とbacklog費用
    explanation: サンプル済みのYと需要を固定して微分する。離散判断をそのまま微分するわけではない。
