question: '共同発注をするかどうかと、約千商品の発注量をどう分けて学ぶか'
summary: 'OR-Transformerは発注するかどうかと、発注する場合の商品別の数量を分けて学ぶ。商品の並び順に左右されないTransformerを使い、数量を変えると在庫と費用がどう変わるかを計算して学習する。著者の合成環境では、1,024商品を扱うときの費用が、学習を使う比較手法の中で最も費用が低かったPPOより約75%低かった。実店舗で導入した結果ではない。'
