question: |-
  よく見られた作品を外すと、代わりの作品では埋められない差があるか
summary: |-
  Netflixの研究チームは、作品や推薦枠を外して別の候補を出すと、視聴やクリックなどの反応がどれだけ変わるかを探索ログから推定しました。ホーム画面の推薦枠（作品をまとめた1行）の推定を、実際に行を外した11件のA/Bテストで測った反応の減少と照合すると、決定係数R²は0.8212でした。論文が提案したのは、作品を並べる新しいモデルではなく、推薦の貢献と不調の原因を調べる方法です。
