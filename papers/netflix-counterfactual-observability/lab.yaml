core_idea:
  author_claim: |-
    Netflixの著者は、探索中に記録した選択確率から、候補ごとの表示されやすさの違いを補正します。同じ表示位置で別の候補と比べる方法と、対象を取り除いて別の候補を選び直す方法を使い分けます。候補を絞る処理が何段階もある場合は、作品が候補に入ったときの代替しにくさと、そもそも候補に入る頻度に分けて貢献を見積もります。
  research_bot_interpretation: |-
    [Accuracy Is Not Service](accuracy-not-service-intermittent-demand.html)が予測の誤差と発注の成果を分けたように、この論文は実際に見られた量と、代わりを出しても埋まらない差を分けます。[VARG](varg-tmall-value-generative-retrieval.html)や[UNIQUE](unique-baidu-unified-retrieval-ranking.html)のような方式を読むときも、ある経路から何件の候補が採用されたかと、その経路をなくすとどれだけ反応が減るかは別の問いです。他社の実験結果を、この論文の推定値に換算できるわけではありません。
sections:
  overview: |-
    Netflixの著者は、ホーム画面の推薦枠を外したら利用者の反応がどれだけ減るかを、毎回A/Bテストをしなくても見積もりたいと考えました。そこで、どの候補をどんな確率で見せたかが分かる探索ログを使い、枠を残す場合と、外して別の候補を出す場合の反応を推定しました。

    実際にホーム画面の推薦枠を外した11件のA/Bテストと比べると、ログから見積もった反応の減少と実測値の一致を表す決定係数R²は0.8212でした。これはその11件での一致です。新しい枠でも同じ精度で見積もれるとは限りません。
  problem: |-
    作品のクリック率が下がっても、作品そのものが選ばれにくくなったとは限りません。推薦モデルを変えて表示順が下がったのかもしれません。表示した相手や、そもそも候補に入った回数が違えば、作品自体が変わらなくても反応は変わります。クリック率だけを見ると、作品を見直すべきか、推薦の出し方を直すべきかを判断しにくくなります。

    著者は、利用者の状況、候補、選んだ作品、その選択確率、クリックなどの結果を記録します。調べたい方式が選ぶ候補を探索ログが一度も選ばない条件では、その条件で何が起きるかを選択確率の重み付けだけで推定できません。
  why_it_might_work: |-
    探索中に複数の候補を表示しておくと、あとから「別の候補を選んでいたら」を、実際にその候補を選んだ記録から見積もれます。選ばれにくい候補の記録を重く数え、重みの合計で割ると、少数の大きな重みで推定が振れすぎるのを抑える狙いがあります。作品を外したあとに代わりを出す方式まで比べれば、露出が多かったことと、その作品を外すと反応が減ることを分けられます。

    ただし、重みの合計で割る推定は、有限の標本では一般に不偏ではありません。選択確率が小さすぎる場合に下限を置く処理や、候補集合の一部が重なれば一致とみなす処理にも、推定のずれとばらつきの兼ね合いがあります。選択確率が正しく、同じ定義の反応を比べられ、調べたい候補が探索中にも十分に選ばれていることが大切です。
  evidence: |-
    ### 推定値と照合したのは、推薦枠を外した11件の本番テスト

    [一次資料のPDF §4.1〜4.3・図1〜3](https://arxiv.org/pdf/2609.22747v1)に、性質の異なる三つの結果があります。

    - **著者のシミュレーション（§4.1・図1）**：1,000作品を作り、作品ごとのクリック確率の元になる値をBeta(1,8)/4から引きました。探索は温度0.1のBoltzmann分布、利用者が何件見るかはPoisson(10)で表しました。著者はR1またはR2を外した場合のクリック率をシミュレーションで求め、探索ログからの推定と比べました。ノイズが小さいと差は小さく、ノイズが大きくなると差は広がりました。
    - **ホーム画面でのA/Bテスト（§4.2・図2）**：著者は、作品をまとめた1行の推薦枠について、探索ログで求めた増分と、実際に行を外したA/Bテストで測った利用者の反応の減少を照合しました。11件で決定係数R²は0.8212でした。行が候補に入ったときの差の推定には、両群を別々に重み付けするHájek推定量を使いました。選択確率は0.0001から0.9999に収め、各行で少なくとも100観測を求め、長さの異なるホーム画面を集計しました。
    - **監視中に見つけた不具合（§4.3・図3）**：似た作品の推定値が安定する中、作品Aの増分の推定値だけが急に下がりました。開発者が調べると、作品Aの正例ラベルが誤って割り当てられていました。検知率や修正後の反応の回復量は報告されていません。

    R²は、その11件でオフラインの推定とA/Bの実測がどの程度対応したかを表します。個々の予測誤差の大きさや、新しい行や別サービスでも同じ精度になることは示しません。Labは元のログや個別の座標を取得していないため、R²は再計算せず、論文の散布図や監視の時系列も作り直していません。
  executable_understanding: |-
    Labは、2種類の利用者の状況、3候補、表示枠1つを用意しました。選択確率もクリック確率も先に決め、乱数で12万件の記録を作ります。まず探索ログで実際に起きたクリックの割合を数えます。次に、同じログから、元の方式と、作品Aを候補から外して必要なら作品Bを代わりに出す方式のクリック率を推定します。推定には、調べたい方式とログが同じ作品を選んだ記録だけを使います。

    設定した確率から両方式の期待値も直接計算し、ログからの推定との差を確認します。著者の1,000作品のシミュレーションでも、本番のA/Bテストの再現でもありません。

    下の図は別の人工例です。候補に入った場合にだけ見た差と、候補に入る確率を掛けると、作品の比較がどう変わるかを確認できます。

    <figure class="teaching" data-b21><h3>候補に入る頻度を掛けると、作品の比較が逆転する</h3><label>人工例の作品を選ぶ <select><option value="0">候補に入る機会が少ない作品</option><option value="1">候補に入る機会が多い作品</option></select></label><script type="application/json" data-frames>["<div class=\"b21-cards\"><div>候補に入ったとき、代わりでは埋まらない差<br><strong>0.080<\/strong><\/div><div>× 候補に入る確率<br><strong>0.20<\/strong><\/div><div>＝ 全体で見た貢献<br><strong>0.016<\/strong><\/div><\/div><p>候補に入る機会は少ないものの、候補に入ったときは代わりとの差が大きい作品です。<\/p>", "<div class=\"b21-cards\"><div>候補に入ったとき、代わりでは埋まらない差<br><strong>0.030<\/strong><\/div><div>× 候補に入る確率<br><strong>0.80<\/strong><\/div><div>＝ 全体で見た貢献<br><strong>0.024<\/strong><\/div><\/div><p>候補に入ったときの差は小さくても、候補に入る機会が多いため、全体で見た貢献は大きくなります。<\/p>"]</script><div data-output><div class="b21-cards"><div>候補に入ったとき、代わりでは埋まらない差<br><strong>0.080</strong></div><div>× 候補に入る確率<br><strong>0.20</strong></div><div>＝ 全体で見た貢献<br><strong>0.016</strong></div></div><p>候補に入る機会は少ないものの、候補に入ったときは代わりとの差が大きい作品です。</p></div><figcaption>論文の式2を、Labが作った2作品の数値で確かめる図です。実作品の測定値でも、論文のA/Bテストの散布図でもありません。</figcaption></figure>
  results: |-
    人工データの設定から計算した期待クリック率は、作品Aを残す方式で0.36、Aを外して必要な場合にBを出す方式で0.32です。差の0.04（4ポイント）が、この設定でAを外して失う分です。Aそのもののクリック率ではありません。ログから同じ差を推定した値は約0.0427です。探索ログの単純平均や推定誤差はresults.jsonにあります。

    別の掛け算の例では、候補に入ったときの差が0.08の作品と0.03の作品を比べます。候補に入る確率がそれぞれ0.20と0.80なら、全体で見た貢献は0.016と0.024です。条件内の差だけで比べたときと、全体で比べたときで順序が逆になります。
  what_we_verified: |-
    Labは、選択確率が既知で正の人工ログに限り、表示枠が一つのときの推定値を、設定から直接計算した期待値と照合しました。調べたい方式とログで選んだ候補が完全に一致する場合だけを使っています。推定に使う重みをすべて同じ正の数倍にしても、推定値は変わりませんでした。複数段階の貢献を分ける図では、定義どおりに掛け算した結果だけを確かめました。
  what_we_did_not_verify: |-
    Labは、Netflixの探索ログや11件のA/B結果を再現していません。長期の継続利用、表示位置同士の影響、候補集合の重なりで近似する方法、確率の切り詰めが実データで与える影響は未検証です。小実験では調べたい方式と一致する記録がゼロなら、推定値を返しません。現場で必要な探索量や処理規模、本番での効果は検証していません。
  implementation: |-
    配布したコードはPython標準ライブラリだけで動きます。`simulate()`は同じ探索ログで、作品Aを残す方式と外す方式を比べます。`snips()`は選択確率を使った重み付き平均、`exact()`は利用者の状況やクリックの確率を使った厳密な期待値を計算します。このコードは推薦モデルを学習しません。
  method: method.md
  mapping: mapping.md
teaching_figures:
- kind: equations
  id: counterfactual-math
  title: 探索ログから、代わりを出しても失われる反応を見積もる
  after: method
  locator: §3.1–3.3 / Eq. 1–2 / Appendix 6.2
  rationale: 選択確率を使う平均と、対象を外した場合との差を整理します。
  caption: 原論文の式を、表示枠が一つの比較から複数段階の比較へ順に整理しました。
  steps:
  - name: 1. 調べたい方式の反応を見積もる
    formula: SNIPS(π) = Σⱼ rⱼ mⱼ/pⱼ ÷ Σⱼ mⱼ/pⱼ
    explanation: pは探索中にその候補を選んだ確率、mは調べたい方式との選択の一致度です。Labでは完全一致を1、不一致を0とします。一致した記録では、反応に選択確率の逆数を掛けて足し、その重みの合計で割ると推定値になります。
  - name: 2. 対象を外し、次に良い候補を出す
    formula: Δᵢ = Σₖ wₖ [SNIPS(explore,k) − SNIPS(LOOᵢ,k)]
    explanation: 作品iを外す方式全体の推定値を、外さない方式の推定値から引きます。wₖで表示位置ごとの結果を重み付けします。
  - name: 3. 候補に入る頻度を掛ける
    formula: Incrementality(i) = Irreplaceability(i) × Universality(i)
    explanation: 作品が候補に入った場合に限って、代わりでは埋まらない差を見積もります。その差に、作品が候補に入る確率を掛けると、全体で見た貢献になります。
  - name: 4. 候補に入った中で、出した場合と出さない場合を比べる
    formula: Iᵢ = [Σ T r/π ÷ Σ T/π] − [Σ (1−T) r/(1−π) ÷ Σ (1−T)/(1−π)]
    explanation: 作品iが候補に入った記録Eᵢだけを使います。表示ありと表示なしの群ごとに重み付き平均を取り、その差を求めます。
  source: https://arxiv.org/pdf/2609.22747v1
