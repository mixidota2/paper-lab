teaching_figures:
- kind: equations
  id: method-equations
  title: モデルが学ぶことと、配信時に守る規則
  after: method
  caption: 画面を順に作る確率、追加学習の損失、出せない候補を除く計算を分けて示す。
  rationale: どの式が学習に使われ、どの式が配信時に使われるかを区別する。
  source: https://arxiv.org/pdf/2606.31031v2
  locator: §5.2・§6.3（文章の記号化）
  steps:
  - name: 行と作品を順に作る
    formula: p(page|context)=Π_t p(y_t|context,y_<t)
    explanation: 直前までに選んだ行と作品を使って、次の候補を選ぶ。これは配信時の順序を表し、追加学習の損失を表す式ではない。
  - name: 反応の良し悪しを学ぶ（WBC）
    formula: L=−Σ w[b log σ(z)+(1−b)log(1−σ(z))]
    explanation: 著者は報酬の正負から反応のラベルを作り、報酬の大きさで各例の重みを決める。論文§5.2の説明をLabが式にした。
  - name: 配信できない候補を除く
    formula: z′_v=z_v+m_v, m_v∈{0,−∞}
    explanation: 配信できるIDの点数は変えず、候補集合や規則に反するIDは選ばれない点数に変える。
