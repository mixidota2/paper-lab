question: 商品候補を作る前に、クリックや注文などの目標を指定できるか
summary: JD.comのOxygenREC-v2は、目指す行動を指定し、その条件に合う商品候補を生成する。追加学習では実際の記録と生成結果の一致を評価し、将来の行動も見られる教師を使う。配信時に将来の行動は渡さない。
