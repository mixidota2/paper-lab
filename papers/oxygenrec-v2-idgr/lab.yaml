- id: entropy-losses
  kind: equations
  title: 最良軌跡の報酬と、2つの蒸留経路
  after: method
  locator: 式3、5–13 / Algorithm 1
  caption: 原式の条件付けと正規化を保ち、記号をUnicodeで表記。
  rationale: 原式の条件付けと正規化を保ち、記号をUnicodeで表記。
  steps:
  - name: 条件付き生成・式3
    formula: pθ(Y | X, Iₛ, Iᵣ, Iᵦ), Iᵦ = ψ(Emb(b))
    explanation: Iᵦが全生成位置の入力になる。
  - name: 幾何報酬・式5–7
    formula: ωₜ = γᵗ⁻¹ / Σⱼ₌₁ᴸ γʲ⁻¹; Rᵢ = Σₜ₌₁ᴸ ωₜ 𝟙[ŷᵢ,ₜ = y*ₜ]; k = argmaxᵢ Rᵢ; LVR = E[−Rₖ Σₜ log πS(ŷₖ,ₜ | X,
      ŷₖ,<ₜ)]
    explanation: 一致はtoken単位。選択軌跡の全tokenをRₖで重み付けする。
  - name: 教師の確信度・式8–10
    formula: Aₜ = log πT(ŷₜ | X,F,ŷ<ₜ) − log πS(ŷₜ | X,ŷ<ₜ); Hᵀₜ = −Σᵥ πT(v | X,F,ŷ<ₜ) log πT(v | X,F,ŷ<ₜ)
    explanation: gˡₜ=𝟙[Hᵀₜ<τₗ]、gʰₜ=𝟙[Hᵀₜ>τₕ]。各gをΣⱼgⱼ+εで割った値がg̃。
  - name: 低entropy・式11
    formula: LSD = E[−Σₜ g̃ˡₜ sg(Aₜ) log πS(ŷₜ | X,ŷ<ₜ)]
    explanation: advantage側へ勾配を戻さない。負のadvantageもあり得る。
  - name: 高entropy・式12
    formula: LFKL = E[Σₜ g̃ʰₜ DKL(πT(· | X,F,ŷ<ₜ) ∥ πS(· | X,ŷ<ₜ))]
    explanation: 向きはteacherからstudent。複数の妥当な候補の質量を伝える。
  - name: 結合・式13とAlgorithm 1
    formula: LEA-TOSD = λ LVR + β LSD + ζ LFKL
    explanation: 既定λ=.1、β=ζ=.01。Algorithm 1ではさらにλsft LSFTを加える。
  source: https://arxiv.org/html/2607.24255v1
