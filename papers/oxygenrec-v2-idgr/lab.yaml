core_idea:
  author_claim: 著者はIDGR（Internalizing Discrimination into Generative Recommendation）として、入力の行動指示と行動重み付き学習を提案する。追加学習のEA-TOSDは、検証可能な軌跡報酬と、教師のentropyに応じた2種類の自己蒸留を組み合わせる。単一backboneを保ち、外部の行動scorerを不要にするという主張である（§4）。
  research_bot_interpretation: 候補を生成する前に目的を渡す設計と、生成済み候補の採点を分けて読むと違いが明確になる。ただし条件付き生成もログにない選好を保証しない。未来prefixは訓練だけに置く必要があり、外部報酬モデルがなくても、ログの偏りや損失重みの選択は残る。
sections:
  overview: JD.comのOxygenREC-v2は、click・cart・orderの指示でSID生成を条件付ける。学習時には実ログとの一致と、未来行動を見た同一backboneの教師を使う。IDGRの焦点は行動信号を入れる位置にある。6つの配信面のA/Bを読み分け、外部報酬モデルの除去をサービス全体のカスケード撤去へ広げない。
  method: method.md
  problem: クリックされやすい商品と購入されやすい商品は一致しない。生成後にrankerで点を付けても、beamから消えた商品は戻らない。一方、生成損失と識別headの損失を共有backboneで最適化すると、その重みの調整が必要になる。原論文はこの2つの経路と、生成の入口に行動を置く経路を比較する（Figure
    1、Appendix C）。
  why_it_might_work: 行動指示は最初のSID tokenから参照されるため、粗い商品カテゴリを選ぶ段階で目的を変えられる。未来を見た教師は疎な完全一致報酬を補う。低entropy位置では特定tokenの方向を、高entropy位置では複数候補への確率を伝える。ただしentropyは正しさの証明ではない。自信のある誤りや、未来ログ自体の偏りまで自動で除去する機構ではない。
  evidence: '### 全指標でProxy-RMに勝ったわけではない


    Table 1のHR@1はv1 PT-only 4.62%、Proxy-RM 5.54%、v2 5.64%。HR@512は43.24%、43.09%、44.14%である。v1からのHR@1差は**1.02ポイント**で、相対1.02%ではない。v2は7指標中6指標でProxy-RMを上回るが、HR@128は33.76%対33.89%で下回る。


    ### 追加学習のどこが効いたか


    Table 4ではFKL除去でHR@512が44.14%から43.80%へ落ちる。一方、VRだけでもHR@1は5.64%で完全構成と同じ。すべての項がすべての指標を改善したとは読めない。Table 5では低・高entropy各20%の選択が各100%より良いが、20%はこの条件の実測結果であり普遍的な最適値ではない。


    ### 6面のA/Bは母集団と更新内容を分ける


    配信面ごとに5–20%のtraffic、5–8日間。表の比較対象は当時の本番モデルで、要旨ではOxygenREC-v1比と要約される。feed・floorの事前学習更新と、RecForUでの追加学習更新は同じ介入ではない。下表の星印はp<0.05、無印は有意差未確認。特に−2.34%のGMVを「退化なし」と証明したとは扱わない。本文では丸めた−2.3%、p=0.23と説明される。


    要旨のGMV +2.8–6.8%は表6の全範囲ではない。ホーム面の+21.21%や負の面も残す。[一次資料：Tables 1–6、§5–6](https://arxiv.org/html/2607.24255v1#S6)。'
  executable_understanding: '`uv run papers/oxygenrec-v2-idgr/run.py`


    同一文脈の3つの候補群を仮定し、行動別に600件ずつ合成ログを抽出する。平滑化した条件付き頻度と、行動を無視してpoolした頻度を比較する。別の16語彙・3位置の計算では8本の軌跡をstudentから抽出し、幾何重みの報酬で1本を選ぶ。教師分布は人工的に与え、低・中・高entropyの経路と損失を計算する。'
  results: 指示を変えると条件付き頻度が変わり、poolした対照では変わらない。これはデータ生成時に仮定した行動差を学習できるという確認である。教師の低・高entropyの間には蒸留しない帯域がある。表示するVR・SD・FKLは選択軌跡に対する値で、モデル改善量ではない。
  what_we_verified: CONFIRMED：固定seedでの再計算、報酬の正規化、entropy閾値の厳密な不等号、選択token数での損失正規化。MechanismはPARTIAL：式の有限例を確認した範囲に限る。行動指示を学ぶTransformerや、同一backboneから作る教師は実装していない。
  what_we_did_not_verify: Performance / Scaling / Production applicabilityはNOT TESTED。JD.comログ、3B-A1B MoE、近未来prefixの実データ生成、EA-TOSDの勾配学習、オンライン売上は未検証。公式実装へのリンクは確認した原論文・書誌に見当たらない。§5はofflineを3Bと記す一方、Appendix
    G.2は0.7Bとする。この食い違いは解消できず、offline規模を断定しない。
  implementation: '`instruction_probe()` はLaplace平滑化した頻度学習、`reward()` は式6、`gates()` は式9–10の判定、`losses()` は式11–13の数値を返す。教師は固定配列なので自己蒸留そのものの再現ではない。JSONのweighted_without_SFTにはSFT
    anchorを含めない。原論文Algorithm 1はSFTを並行して加えるため、総学習損失と混同しない。'
