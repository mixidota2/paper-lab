core_idea:
  author_claim: 著者は、商品候補を作る前に行動を指定し、学習で行動ごとに重みを変える方式（IDGR）を提案した。追加学習（EA-TOSD）では、実際の記録と一致する生成列に報酬を与え、教師の予測の不確かさに応じて2種類の蒸留を使う。著者は、学習のために外部の報酬モデルを追加する必要がなくなると説明している（§4）。
  research_bot_interpretation: Labは、候補を作る前に行動を指定する処理と、生成した候補を後から採点する処理を区別する。前者は候補そのものを変えられるが、記録にない選好を学べるとは限らない。外部の報酬モデルを使わなくても、行動ログの偏りや損失の重みは残る。将来の行動は教師だけに渡す。
sections:
  overview: |-
    JD.comの著者は、クリック、カートへの追加、注文のうち、どれを狙うかを決めてから商品候補を出すOxygenREC-v2を提案しました。モデルは指定された行動に合わせて、商品の特徴を表すコード（SID）を生成します。同じ利用者でも、注文を狙うときはクリックを狙うときとは異なる商品を候補にできます。追加学習に使うのは、生成結果と記録された行動が一致したかどうかと、後に起きた行動まで見られる同じモデルからの予測です。利用者に推薦を出すときは、将来の行動を入力しません。

    著者はJD.comの6つの配信面で、OxygenREC-v2をそれぞれ従来の本番モデルと比べました。追加学習前の変更を試したホーム画面とチャンネルの一覧では、クリック後の転換率（UCTCVR）が1.61〜4.44%増えました。追加学習の変更を試した商品詳細画面では、取引総額（GMV）が4.25%増えました。著者は追加学習に外部の報酬モデルを使っていませんが、配信時の他の推薦処理まで取り除いたわけではありません。
  method: method.md
  problem: よくクリックされる商品が、よく買われるとは限らない。先に候補を生成し、別のモデルで採点する方式では、候補から外れた商品を後から順位に戻せない。生成と行動予測を同じモデルで学習する方式では、生成と行動予測の損失をどの重みで足すかを決める必要がある。OxygenREC-v2の著者は、これらと、生成前に行動を指定する方式を比較した（図1、付録C）。
  why_it_might_work: |-
    デコーダーは1つ目のSIDトークンを出す前から行動の指示を参照する。候補を絞り込む前に、クリックを狙うか注文を狙うかを反映できる。追加学習では、実際の記録と一致するトークンが少なくても、将来の行動も見た教師から確率を学べる。

    教師の予測の不確かさが低い位置では、生成列で選んだトークンの対数確率の差を使う。不確かさが高い位置では、生徒の確率分布を教師の分布に近づける。教師のエントロピーが低いことは予測が正しいことを意味しない。自信のある誤りや、将来の行動を含むログの偏りは残る。
  evidence: |-
    一次資料：[原論文の§5–6、表1–6](https://arxiv.org/html/2607.24255v1#S6)。

    ### 外部の報酬モデルを使った比較方式より、7指標のうち6指標が高かった

    表1は、事前学習のみのv1、外部の順位付けモデルを報酬に使うProxy-RM、OxygenREC-v2の比較だ。正解が1位に入る割合（HR@1）は順に4.62%、5.54%、5.64%。上位512件では43.24%、43.09%、44.14%だった。v1からのHR@1の差は1.02パーセントポイントで、相対変化の1.02%ではない。上位128件ではv2の33.76%がProxy-RMの33.89%を下回った。

    ### 追加学習の各項がすべての指標を上げたわけではない

    表4では、確率分布全体を近づけるFKLを外すとHR@512が44.14%から43.80%に下がった。一方、追加の3項のうち報酬（VR）だけを残してもHR@1は5.64%で、全項を使う条件と同じだった。表5では、不確かさの低い位置と高い位置をそれぞれ20%選ぶ条件が、それぞれ100%を使う条件より良かった。この比較だけで、20%が他の条件でも最適とは言えない。

    ### JD.comは配信面ごとに、当時の本番方式と比較した

    表6の試験では、配信面ごとに利用者トラフィックの5〜20%を割り当て、5〜8日間比べた。要旨ではv1との比較とまとめているが、表の比較相手は各面で当時動いていた本番モデルだ。ホーム画面とチャンネル一覧では事前学習の変更を試し、商品詳細のRecForUでは追加学習の変更を試した。

    表の星印はp<0.05を示す。カートへの追加時に出るパネルのGMVは2.34%減った。本文では丸めて2.3%減、p=0.23と記す。この試験から有意な減少は確認できないが、悪化しないことを確認した試験でもない。要旨のGMV増加幅2.8〜6.8%は全配信面の範囲ではなく、表6にはホーム画面の21.21%増とマイナスの値も載る。
  executable_understanding: |-
    リポジトリの最上位から `uv run papers/oxygenrec-v2-idgr/run.py` を実行する。Labは同じ文脈に3つの候補群があると仮定し、クリック、カートへの追加、注文の合成ログを各600件作る。行動別に集計した頻度と、行動を区別せずまとめた頻度を比べる。

    別の例では、16種類のトークンで3位置の列を8本生成する。実際の記録との一致を模した報酬を求め、最も高い1本を選ぶ。固定した教師の確率分布を使い、不確かさが低い位置、高い位置、どちらにも入らない位置を分けて損失を計算する。
  results: |-
    行動別に頻度を集計すると、指定する行動によって各候補群の割合が変わった。行動を区別せず集計した頻度は、指定を変えても変わらなかった。この人工例では、ログを作る際に行動ごとの分布を変えている。

    損失の例では、3位置が順に「低い」「どちらにも入らない」「高い」に分かれた。表示するVR、SD、FKLは、選んだ生成列に対する損失で、学習による性能の改善量ではない。
  what_we_verified: '**仕組みの検証：一部のみ（Mechanism: PARTIAL）**。Labは乱数の種を固定して同じ結果を再計算し、報酬の重みの合計が1になること、しきい値と同じ位置を蒸留に入れないこと、選んだ位置の数に応じて損失を正規化することを確かめた。行動指示を学ぶTransformerや、同じ基盤モデルを使う教師は実装していない。'
  what_we_did_not_verify: |-
    **実運用の性能・規模を増やした場合の挙動・本番への適用：未検証（NOT TESTED）**。LabはJD.comのログ、30億パラメータのうち10億を使うMoE、実データから将来の入力を作る処理、EA-TOSDの勾配学習、オンライン売上を検証していない。論文とarXivの書誌情報には公式実装へのリンクが見当たらなかった。

    オフラインのモデル規模は、本文の§5では30億、付録G.2では7億パラメータと記されている。両方の記述が一致しないため、このLabでは規模を断定しない。
  implementation: |-
    `instruction_probe()` は人工ログの頻度をラプラス平滑化して確率を求める。`reward()` は式6の報酬、`gates()` は式9–10のしきい値による判定、`losses()` は式11–13の損失を計算する。教師の確率は固定値で、自己蒸留の学習は再現していない。

    結果ファイルの `weighted_without_SFT` は報酬と2種類の蒸留の重み付き和だ。著者はAlgorithm 1で教師あり学習の損失も加えるため、この値は学習で使う全損失とは異なる。
