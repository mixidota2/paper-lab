- id: entropy-losses
  kind: equations
  title: 選んだ生成列に報酬を与え、位置ごとに蒸留方法を変える
  after: method
  locator: 式3、5–13 / Algorithm 1
  caption: 論文の式3・5–13とAlgorithm 1。報酬、蒸留、教師あり学習の項を分ける。
  rationale: 選んだ列と、各蒸留に使う位置を分けて読む。
  steps:
  - name: 行動を条件にして生成する（式3）
    formula: pθ(Y | X, Iₛ, Iᵣ, Iᵦ), Iᵦ = ψ(Emb(b))
    explanation: Iᵦを最初に渡す。デコーダーはどの位置でもその指示を参照できる。
  - name: トークンが一致した位置から報酬を求める（式5–7）
    formula: ωₜ = γᵗ⁻¹ / Σⱼ₌₁ᴸ γʲ⁻¹; Rᵢ = Σₜ₌₁ᴸ ωₜ 𝟙[ŷᵢ,ₜ = y*ₜ]; k = argmaxᵢ Rᵢ; LVR = E[−Rₖ Σₜ log πS(ŷₖ,ₜ | X, ŷₖ,<ₜ)]
    explanation: 位置ごとの幾何重みを足すと1になる。一致した位置の重みを足して報酬を求める。最後は選んだ列の全トークンに報酬Rₖを掛けるので、一致しなかった位置の対数確率も損失に入る。
  - name: 教師の不確かさで使う位置を選ぶ（式8–10）
    formula: Aₜ = log πT(ŷₜ | X,F,ŷ<ₜ) − log πS(ŷₜ | X,ŷ<ₜ); Hᵀₜ = −Σᵥ πT(v | X,F,ŷ<ₜ) log πT(v | X,F,ŷ<ₜ)
    explanation: 低い位置はHᵀₜ<τₗ、高い位置はHᵀₜ>τₕとする。各経路で選んだ位置の数とεの和で重みを割る。どの位置も選ばれない経路の損失はゼロになる。
  - name: 不確かさが低い位置では選んだトークンを使う（式11）
    formula: LSD = E[−Σₜ g̃ˡₜ sg(Aₜ) log πS(ŷₜ | X,ŷ<ₜ)]
    explanation: 教師と生徒の対数確率の差Aₜは負になる場合もある。学習ではその差に勾配を戻さない。
  - name: 不確かさが高い位置では確率分布を使う（式12）
    formula: LFKL = E[Σₜ g̃ʰₜ DKL(πT(· | X,F,ŷ<ₜ) ∥ πS(· | X,ŷ<ₜ))]
    explanation: 前向きKLを教師の分布から生徒の分布に向けて求め、複数の候補に割り当てた確率を伝える。
  - name: 各項を重み付きで足す（式13とAlgorithm 1）
    formula: LEA-TOSD = λ LVR + β LSD + ζ LFKL
    explanation: 既定の重みはλ=.1、β=ζ=.01。Algorithm 1は、この和に教師あり学習の項λsft LSFTも加える。
  source: https://arxiv.org/html/2607.24255v1
