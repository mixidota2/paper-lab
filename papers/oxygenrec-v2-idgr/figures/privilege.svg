<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 470" role="img" aria-labelledby="title desc">
  <title id="title">将来の行動は学習時の教師だけに渡す</title>
  <desc id="desc">配信に使うモデルは行動指示からSIDを生成する。学習時の教師は同じ基盤モデルに将来の最大2商品のSIDを加え、同じ生成列を評価する。配信時には将来の行動を使わない。</desc>
  <rect width="440" height="470" rx="16" fill="#f4f7f6"/>
  <g font-family="sans-serif" fill="#163b40">
    <text x="22" y="33" font-size="20">将来の行動は学習時の教師だけに渡す</text>
    <text x="22" y="63" font-size="14">OxygenREC-v2の付録E</text>
    <rect x="18" y="88" width="404" height="105" rx="9" fill="#dfede8"/>
    <text x="30" y="113" font-size="17">配信に使うモデル（生徒）</text>
    <text x="30" y="142" font-size="18">BOS → Iₛ → Iᵣ → Iᵦ</text>
    <text x="30" y="171" font-size="16">目標にする行動からSIDを生成する</text>
    <rect x="18" y="217" width="404" height="105" rx="9" fill="#f3e3d3"/>
    <text x="30" y="242" font-size="17">学習時の教師</text>
    <text x="30" y="271" font-size="18">BOS → Iₛ → Iᵣ → Iᵦ</text>
    <text x="250" y="271" font-size="16">→ F（将来の行動）</text>
    <text x="30" y="300" font-size="16">Fに最大2商品を入れ、同じ列を評価する</text>
    <path d="M217 328 L217 348" fill="none" stroke="#628287" stroke-width="2"/>
    <text x="22" y="373" font-size="17">不確かさが低い：選んだトークンを使う</text>
    <text x="22" y="403" font-size="17">不確かさが高い：確率分布全体を使う</text>
    <text x="22" y="439" font-size="15">教師と生徒は同じモデル。生徒にはFを渡さない。</text>
  </g>
</svg>
