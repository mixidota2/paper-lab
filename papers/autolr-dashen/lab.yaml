core_idea:
  author_claim: |-
    DASHENの著者は、専門家役のエージェントが改善案を出し、プログラムが条件を満たした案を選んで評価する仕組みを作りました。2種類の推薦フィードで完了した1,586件の評価を監査し、本番の公開判断記録9件を報告しました。採択（KEEP）するとコードが次の基準になるため、測り直すと再現しない改善が積み重なる可能性があります。

    [一次資料：arXiv v1 本文](https://arxiv.org/html/2609.04871v1)
  research_bot_interpretation: 複数のエージェントを使うこと以上に、案を考える役割と、実験に使う基準コードを変える役割を分ける点が参考になります。過去に試した案や失敗を次の候補選びに使う一方、採択した結果は同じ条件で確認する必要があります。ただし著者は同じ予算で要素を一つずつ外す比較をしておらず、専門家役や候補選択だけの効果は分かりません。
sections:
  overview: |-
    DASHENのAutoLRは、推薦の改善案を考え、コードを変更し、モデルを学習して過去のデータで評価するところまでを自動で進めます。利用者を対象にしたA/Bテストにかけるか、全体に公開するかは、担当者が判断します。

    著者が2種類のフィードの記録を整理すると、重複を除いて1,586件の評価が完了していました。担当者が選んだ施策については、実際に配信した結果を記した公開判断の記録が9件ありました。ただし、過去データでの評価と配信後の結果を候補ごとにすべて結び付ける記録はありません。全候補のうち何割が本番で改善したかは分かりません。
  problem: |-
    推薦モデルの案を出しても、コードを変更し、学習を回し、ログを確認して過去のデータで評価するまで結果は分かりません。数日にわたる実験では、どのコードを出発点にしたかも記録しなければ、次の実験と比べられません。AutoLRが扱うのはこの開発作業で、利用者に直接推薦を返すLLMではありません。
  method: method.md
  why_it_might_work: |-
    試す案の件数と編集範囲を先に決めておけば、モデルの案を実行できる範囲に絞れます。過去に試して効果が出なかった条件を残せば、同じ案に学習の予算を使う回数も減らせるかもしれません。

    反対に、たまたま大きく出た測定値を成功として保存すると、プログラムはそのコードを基準に変え、エージェントはその値を次の案の参考にします。記録の量だけを増やすより、どの測定結果があれば基準を変えてよいかを先に決める必要があります。
  evidence: |-
    ### 完了したオフライン評価の数

    著者は単列・2列フィードと没入型動画フィードの台帳を監査しました（§4.1、図7）。空でない4,250行のうち4,247行を読み取り、推薦の場面、保存先が示す実験セッション、試行回で重複をまとめると3,289件でした。基準モデルの評価を除くと1,586件が完了しており、そのうち1,583件に基準との差が数値で残っていました。再試行や失敗の記録は一つの候補に複数残ることがあり、候補1件あたりの失敗率は分かりません。著者は、同じセッションの試行がデータや基準を共有するため、試行を1件ずつではなくセッションごとに取り直して区間を計算しました。

    ### 人が選んだ候補の公開判断

    表1には、担当者がオンラインA/Bテストへ進めた施策の公開判断（Launch Review）が9件あります。単列・2列フィードが6件、没入型動画フィードが3件です。各施策で同時期の対照群と比べた相対変化を、著者の方法で単純に足すと、コンテンツを利用した人の割合は+5.75%、総利用時間は+10.83%、有効閲覧数（VV）は+5.55%です。表のFlatは変化が報告されていないことを示し、著者は集計でゼロとして扱いました。実測値が厳密にゼロだったという意味ではありません。

    この和は、別々の施策と利用者を一つにまとめた改善率でも、効果を順に積み上げた変化率でもありません。オフライン候補から本番までを一件ずつ追える記録もないため、候補の何割が配信に至ったか、AutoLRが他の開発方法より有効かは判断できません。検索などへの展開は別の進捗報告で、この監査の対象外です。

    ### 採択の下限と評価のばらつき

    過去の評価で実際に使った下限は一部しか分かりません。著者は両フィードに共通の参照値0.001を当てて数え直しました（§5.3、表2）。数値が残る評価は単列・2列が810件、没入型が773件で、参照値を超えた割合はそれぞれ4.7%と8.5%でした。実際のKEEPは、数値がないものも含む完了済み評価を分母にすると3.82%と5.03%です。各回の下限を確認できる記録は480件と0件でした。

    測定差の四分位範囲は単列・2列が1.257×10⁻³、没入型が1.201×10⁻³でした。異なる候補の測定値がどれだけ散らばっているかを示す値で、同じ候補を測り直したときの誤差ではありません。監査から、誤って採択した割合や正しい下限は分かりません。保護指標の記録が残るのは単列・2列フィードの一部だけで、記録がないものを条件に適合したとは数えません。

    ### LLMの利用料

    通常の試行1回あたりのLLMのAPI費用は3〜4人民元と報告されています。Claude Opus級からDeepSeek-V4-ProとFlashの併用に移った後の観察で、2026年8月17日より前の料金に基づきます。学習の計算費用と社内基盤費は含みません。試行の仕組みや対象の作業も同時に変わったため、モデルの切り替えだけでいくら節約できたかは分かりません。

    [一次資料：arXiv v1 本文](https://arxiv.org/html/2609.04871v1)
  executable_understanding: |-
    Labは真の改善量がすべてゼロの候補を1回の試行で100件出します。まず、初回の測定差が0.001を超えた候補だけを採択する規則を試します。比較する規則では、同じ初回条件に加え、独立した追加25回の平均が、0.001と標準誤差の3.5倍のうち大きい方を厳密に超えたときだけ採択します。乱数シード200通りについて、両規則に同じ測定値の列を渡します。

    採択すると基準のIDを変え、初回の測定差をそれまでの採択分に足します。採択に使う追加25回とは別に、確認用の測定値も毎回1つ作り、記録にだけ残します。追加条件はLabが決めたもので、実際のAutoLRとは異なります。図の縦軸は採択した測定差の和です。同じ評価データで毎回測ったAUCの推移ではありません。
  results: |-
    下表は乱数シードを変えて行った200試行の集計です。1試行では候補100件を判定します。初回測定だけで決めると、1試行あたり平均46.685件を採択し、200試行すべてで採択が起きました。追加測定も求めると、平均0.04件を採択し、採択が起きたのは200試行中8試行でした。候補の真の改善はすべてゼロなので、いずれの採択もこの例の条件では誤りです。1試行の中で何度採択しても、この集計では1試行と数えます。これは1試行あたりの採択回数の平均とは別の集計です。

    採択した測定差の和を200試行で平均すると、初回だけでは0.395542、追加測定ありでは0.000253でした。これは確率、割合、測り直したAUCのいずれでもありません。
  what_we_verified: 合成例では真の改善がなくても、採択した差だけを足すと、合計が増えて基準のIDも変わりました。採択とは独立に生成した再評価には合計の上昇が引き継がれません。追加測定を条件にすると、今回の乱数では誤採択の回数と、誤採択が一度でも起きた試行の数の両方が減りました。
  what_we_did_not_verify: |-
    DASHENでの測定値の分布、候補生成、専門家役の働き、GPUによる学習、オンラインの効果は試していません。Labは測定差を独立した正規乱数から作っています。同じ評価データを使って案を繰り返し直すうちに、そのデータだけで良く見える問題は扱いません。

    今回の追加条件だけで長期間の誤採択を防げるとは言えません。実運用では、どの版の校正記録を使うか、保護指標をいつ確認するか、確認した変更をどう確定し、必要なら元に戻すかも決める必要があります。
  implementation: |-
    リポジトリのルートでは `uv run papers/autolr-dashen/run.py` を実行します。配布ファイルだけを使うなら、保存先で `python run.py` を実行します。Pythonの標準ライブラリだけで動き、結果を同じフォルダの `results.json` に保存します。乱数シードは固定しています。
  mapping: mapping.md
