question: 推薦の改善案を繰り返し試すとき、測定のばらつきだけで次の実験の基準を変えてしまわないか
summary: DASHENのAutoLRは、推薦の改善案を考え、実装を変えてオフラインで評価し、候補を提出するまでを自動化します。人はA/Bテストに進める候補と全体配信を判断します。著者は実験の記録を監査し、測定1回で候補を採択すると、再現しない差でも次の実験の基準を変えてしまうことを指摘しました。
