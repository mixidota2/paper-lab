<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" role="img" aria-labelledby="title desc"><title id="title">KEEPで変わる次の実験の基準</title><desc id="desc">真の改善がない候補でも、測定のばらつきで採択されると、そのコードが次の実験の基準になります。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217661"/></marker></defs><rect width="440" height="560" rx="12" fill="#fafcf7"/><rect x="20" y="20" width="400" height="78" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="48" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">真の改善がゼロの候補</text><text x="34" y="77" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">1回の測定差が下限を超えることがある</text><path d="M220,99 L220,123" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="133" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="161" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">KEEPすると基準コードが変わる</text><text x="34" y="190" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">採択した測定差を改善として記録</text><text x="34" y="215" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">採択した変更を基準コードに反映</text><path d="M220,237 L220,261" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="271" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="299" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">新しい基準から次の候補を作る</text><text x="34" y="328" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">採択した正の測定差が積み重なる</text><text x="34" y="353" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">測り直すと改善が再現しないこともある</text><text x="20" y="422" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">監査時は調整せず、固定の下限を使用。</text><text x="20" y="447" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">提案：校正記録がなければ採択を保留し、</text><text x="20" y="472" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">同じ条件で先に測り直す。</text></svg>
