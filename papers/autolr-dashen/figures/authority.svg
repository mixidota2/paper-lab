<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 730" role="img" aria-labelledby="title desc"><title id="title">自律処理と人の承認境界</title><desc id="desc">自律処理と人の承認境界。説明と出典はLab本文と図注を参照。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217661"/></marker></defs><rect width="440" height="730" rx="12" fill="#fafcf7"/><rect x="20" y="20" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="48" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">自律：調査 → Council → 選択</text><text x="34" y="77" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">知識と実験memoryを参照</text><text x="34" y="102" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">LLMは仮説・patch・診断を提案</text><path d="M220,124 L220,147" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="157" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="185" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">controller：実装検証 → 訓練 → 評価</text><text x="34" y="214" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">指標抽出・guardrail・状態遷移</text><text x="34" y="239" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">KEEP / PACK / DISCARD</text><path d="M220,261 L220,284" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="294" width="400" height="78" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="322" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">自律処理の終点：候補の提出</text><text x="34" y="351" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">コード・指標・系譜・証拠を梱包</text><path d="M20,402 L420,402" stroke="#b77925" stroke-width="3" stroke-dasharray="8 5"/><text x="24" y="431" font-family="sans-serif" font-size="19" font-weight="bold" fill="#b77925">ここから人が決める</text><rect x="20" y="452" width="400" height="78" rx="8" fill="#f7edda" stroke="none"/><text x="34" y="480" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">Engineer Review → Online A/B</text><text x="34" y="509" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">候補を選び、限定trafficで検証</text><path d="M220,531 L220,554" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="564" width="400" height="78" rx="8" fill="#f7edda" stroke="none"/><text x="34" y="592" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">Launch Review → 全trafficへ</text><text x="34" y="621" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">結果は次の研究のmemoryへ戻る</text></svg>
