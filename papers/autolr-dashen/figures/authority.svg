<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 730" role="img" aria-labelledby="title desc"><title id="title">AutoLRが行う作業と人の判断</title><desc id="desc">AutoLRは案の作成とオフライン評価を進め、根拠を添えて候補を提出します。人がA/Bテストへの投入と全体配信を判断します。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217661"/></marker></defs><rect width="440" height="730" rx="12" fill="#fafcf7"/><rect x="20" y="20" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="48" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">AutoLRが改善案を考えて選ぶ</text><text x="34" y="77" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">過去の実験とシステムの資料を読む</text><text x="34" y="102" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">LLMは仮説、コードの変更、診断を提案</text><path d="M220,124 L220,147" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="157" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="185" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">制御プログラムが学習と評価を進める</text><text x="34" y="214" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">保護指標を確認し、実験の状態を更新</text><text x="34" y="239" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">KEEP / PACK / DISCARD</text><path d="M220,261 L220,284" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="294" width="400" height="78" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="322" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">AutoLRが評価済みの候補を提出</text><text x="34" y="351" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">コード、指標、変更履歴、根拠を添える</text><path d="M20,402 L420,402" stroke="#b77925" stroke-width="3" stroke-dasharray="8 5"/><text x="24" y="431" font-family="sans-serif" font-size="19" font-weight="bold" fill="#b77925">A/Bテストと全体配信は人が判断</text><rect x="20" y="452" width="400" height="78" rx="8" fill="#f7edda" stroke="none"/><text x="34" y="480" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">技術者がA/Bテストへ進める候補を選ぶ</text><text x="34" y="509" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">一部の利用者を対象に効果を調べる</text><path d="M220,531 L220,554" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="564" width="400" height="78" rx="8" fill="#f7edda" stroke="none"/><text x="34" y="592" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">担当者が全体に配信するか判断</text><text x="34" y="621" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">結果を次の実験で参照できるように残す</text></svg>
