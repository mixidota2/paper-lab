summary: 難しいコード修正45課題では、同じ設定でやり直してもハーネスを替えても、成否が変わった課題は中央値約13%だった。著者の第2版は、使うモデルによって成功率の優劣が逆転し、費用差も1割未満から3〜4倍まで変わると報告した。
question: ハーネスを替えた差は、同じ設定でやり直した差より大きいか
