- kind: equations
  id: paired-resolution
  title: 成功率の差と、成否が変わった割合
  after: why_it_might_work
  locator: Table 1 / Appendix F
  caption: 成否が変わった課題の数は検出力に関わります。比較の幅を判断するときは別に区間を読みます。
  source: https://arxiv.org/html/2610.04433v2
  rationale: 一方だけ成功した課題の数を両方向で数えると、二つの割合を区別できます。
  steps:
  - name: 成否が変わった割合
    formula: q = (b+c)/n
    explanation: Aだけ成功した課題をb、Bだけをcとします。両方が同じだけ勝てば、入れ替わりが多くても成功率差はゼロです。
  - name: 成功率の差
    formula: Δ = (b−c)/n
    explanation: b=26、c=34、n=445なら差は約−1.8ポイントです。
  - name: どこまでの差を除けるか
    formula: 90% CI ⊂ [−5,+5] pp
    explanation: Qwen3.6のClaude Codeとmini-SWE-agentの90%区間は−4.7〜+1.1です。±5の範囲内ですが、差がゼロと分かったわけではありません。
