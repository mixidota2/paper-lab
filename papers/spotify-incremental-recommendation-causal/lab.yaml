  url: https://arxiv.org/abs/2608.26804
  pdf_version: v1
  pdf_sha256: 47214ec295f92aeff1d08d44f3b02ada4104e5008e29ce1f1c235b7d592e8325
core_idea:
  author_claim: 著者は、推薦を無作為に見送って集めた既存の記録も学習に使います。表示後に再生しそうで、表示しなければ再生しにくいと予測した組にだけ推薦します。新たに記録を集める仕組みは作りませんでした。
  research_bot_interpretation: Labは、二つの予測値を使って表示を決め、実際に表示条件を変えて全体の影響を測った事例として読みます。各組で推薦が再生をどれだけ増やすかという推定値ではありません。
sections:
  overview: |-
    Spotifyの研究チームは、推薦しなくても利用者が再生しそうなコンテンツを、ホームでの推薦対象から外す方法を試しました。モデルは、推薦を見た直後に再生する確率と、推薦を受けずに2日以内に自然に再生する確率を別々に予測します。観測期間が違うため、著者は確率を引き算しません。推薦後の確率が高く、自然再生の確率が低いと予測した場合にだけ表示します。

    同じモデルを使った2週間のA/Bテストで、推薦後の確率だけを使う方法と比べると、利用者当たりの推薦表示は7.1%減りました。推薦対象コンテンツの再生時間は0.37%減りましたが、統計的に有意な差はありませんでした。この比較が測ったのは、ホームで表示する条件を変えた効果です。個々の推薦が再生を増やしたかは測っていません。
  problem: |-
    推薦を表示した場合は、アプリ上で表示された直後の短い期間の再生を数えます。推薦を見送った場合は、利用者が別の経路で作品を見つける時間をとり、表示予定から2日間を数えます。論文は前者を数分から数時間程度と説明していますが、正確な長さは載せていません。

    著者によると、配信側で推薦を送った記録とアプリで実際に表示した記録には約30%の差もあります。無作為に見送っても、二つの予測値が同じ期間や同じ記録から得られるわけではありません。
  method: method.md
  why_it_might_work: |-
    推薦しなくても再生しそうな作品を外せば、空いた枠を別の候補に使えます。ただし、自然再生の予測が低いことだけでは、その人にとって推薦が必要だったかは分かりません。図4では、予測確率が実際の再生割合に近づきました。なぜ近づいたかを図だけから特定することはできません。
  evidence: |-
    Spotifyはホームを使う数百万人を対象に、2週間のA/Bテストを行いました。表1では、同じモデルと学習データを使い、表示後の確率だけで選ぶ群（Treatment-Model）と、自然再生の確率も使って選ぶ群（Treatment-Causal）を比べました。従来の別モデルとの比較ではありません。

    | 指標 | 相対差 | 95%信頼区間 |
    | --- | ---: | --- |
    | 利用者当たりの推薦表示 | −7.1% | [−7.2%, −6.9%] |
    | 推薦対象コンテンツの再生時間 | −0.37% | [−0.86%, +0.21%] |

    再生時間の信頼区間はゼロを含みます。再生時間がまったく変わらないことや、許容した減少幅を超えないことの証明ではありません。掲載値からは、その許容幅を確認できません。著者は残った約93%の表示を追加の再生につながる表示と解釈していますが、個々の表示について因果効果を直接測った割合ではありません。

    図4では、同じ予測確率を付けた組が実際にどれくらい再生したかを比べました。推薦後の再生の出力は、従来モデルより予測と実績が近くなりました。推薦を見送った場合の出力について、著者は高い確率で見えるずれを標本の少なさで説明しています。論文の図から誤差の数値は補っていません。

    [一次資料：表1と図4](https://arxiv.org/html/2608.26804v1)
  executable_understanding: |-
    `uv run papers/spotify-incremental-recommendation-causal/run.py`

    Labでは、利用者と作品の架空の4組に予測値を置きました。推薦後の再生を求める下限θ₁は0.4のまま、自然再生を許す上限θ₀だけを0から1まで変えます。画面で、どの条件で表示が減るかを確かめられます。モデルは学習しません。

    この例には、観測期間が異なる二つの確率の差が負でも、同じ期間の再生確率の差は正になる組を含めました。後者の数値は、教材用に別に置いた仮定です。
  results: |-
    推薦後の確率だけで選ぶと、4組のうち3組に表示します。θ₀=0.5を加えると2組です。仮定した確率から計算すると、4組分を合計した期待値は、推薦で増える再生が0.82から0.80、全再生が2.37から2.35に下がります。表示を減らしても、再生をそのまま保てるとは限らない例です。
  what_we_verified: |-
    Labは、式5で二つの境界の値を含むこと、θ₀を上げると表示数は減らないこと、θ₀=1で推薦後の確率だけの条件に戻ることを確認しました。異なる期間の確率を引くと、同じ期間で比べた効果とは符号さえ違う例も再計算しました。
  what_we_did_not_verify: |-
    Spotifyのモデルの学習、図4の確率の評価、本番A/Bテスト、長期の満足度や配信速度は再現していません。推薦してもしなくても再生する人を、個別に確認した正解データもありません。
  implementation: |-
    run.pyは標準ライブラリだけで動きます。evaluate()は固定した4組に表示条件を当てて、表示数と、仮定した確率から平均の再生数を計算します。画面の数値は、その計算を保存したresults.jsonから読み込みます。
  mapping: mapping.md
