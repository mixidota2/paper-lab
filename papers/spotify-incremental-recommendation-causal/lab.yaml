question: 推薦しなくても再生する作品を外すと、表示をどこまで減らせるか
summary: Spotifyは、推薦しなくても再生しそうな作品をホームの表示候補から外しました。同じモデルのまま表示条件を変えると、2週間の比較で表示は7.1%減りました。推薦対象の再生時間は0.37%減りましたが、有意差はありませんでした。
source_review:
  checked: '2026-09-24'
