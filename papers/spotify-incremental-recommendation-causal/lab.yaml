- kind: equations
  id: dual-policy
  title: 二つの表示条件をそれぞれ確かめる
  caption: 図3の学習で得た二つの確率を、式5での表示判断に使います。
  source: https://arxiv.org/abs/2608.26804
  locator: Fig. 3; Eqs. 4–5
  rationale: 確率を学ぶ処理と、表示するか決める処理を分けます。
  after: method
  steps:
  - name: 群別の学習
    formula: L = mean(D₁, BCE(y,p̂₁)) + mean(D₀, BCE(y,p̂₀))
    explanation: 共有する部分は両群の記録から学びます。二つの出力は、それぞれ対応する群の記録だけで更新します。
  - name: 推薦後の反応
    formula: p̂₁ ≥ θ₁
    explanation: 推薦された後に再生する確率が低い組は外します。
  - name: 自然再生の除外
    formula: p̂₀ ≤ θ₀
    explanation: 推薦なしでも再生しそうな組は外します。θ₀を小さくすると、表示の条件は厳しくなります。
- kind: matrix
  id: calibration
  title: 予測確率を、実際の再生割合と比べる
  caption: 論文の図4に書かれた傾向を示します。論文にない点は補っていません。
  source: https://arxiv.org/abs/2608.26804
  locator: Fig. 4; §7
  rationale: 予測と実績が近づいたことと、その理由を分けます。
  after: evidence
  columns:
  - 著者の観測
  - 残る不確実性
  rows:
  - label: 推薦後の再生
    cells:
    - 従来モデルより予測と実測の割合が近い
    - どの変更が改善につながったかは未検証
  - label: 推薦なしの再生
    cells:
    - おおむね予測と実測が近いが、高確率側にずれ
    - 標本数の影響を確かめる元データは未公開
