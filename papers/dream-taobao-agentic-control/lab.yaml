question: いまの買い物の意図に合わせて、既存の推薦をどこまで調整できるか
summary: DREAMはTaobaoの推薦モデルを置き換えず、利用者の意図に合わせて設定だけを変える。ホーム画面のA/Bテストでは、詳しい順位付けまで調整した構成で商品詳細ページへの訪問が従来より2.71%増えた。
