summary: 同じ販売記録でも、売り切れで見えなかった需要をどう考えるかで、最適な発注は変わります。著者は記録と仮定に合う分布を残し、最も不利な候補でも最適な発注との差を抑えられるルールを選びます。
question: 欠品で需要が隠れていても、販売記録から発注を決められるか
source_review:
  checked: '2026-11-26'
  url: https://arxiv.org/html/2611.19323v1
  version: v1
  scope: 第1節と図1、第3〜5節、命題7と図2、第6節の結果を確認しました。全ての証明の独立検証や著者コードの再実行はしていません。
figures: []
core_idea:
  author_claim: 著者は販売記録と観測の偏りに関する仮定に合う分布を候補に残します。候補ごとに、その分布を知って選べる最適なルールとの費用差を計算します。差の最大値が最も小さくなるように、発注量を乱数で変えないルールを一つ選びます。
  research_bot_interpretation: 売り切れた日の需要を一つの値で埋める前に、別の埋め方でも発注の判断が同じかを調べられます。どの程度の偏りを許すかを表すΓや、欠品と保管の費用は、実際の業務に合わせて根拠を確かめる必要があります。
sections:
  overview: |-
    著者は欠品を含む販売履歴から発注ルールを学ぶ際に、どこまで判断できるかを調べました。過去の担当者が記録にない予測を使って在庫を増減した場合、在庫があって需要を観測できた日だけでは、全体の需要構成は分かりません。著者はこの偏りの大きさに上限を置き、記録と仮定に合う需要分布の集合を求めます。そのうえで、各分布を知る最適ルールとの費用差が最悪の場合にも小さくなる、一つの発注ルールを選びます。理論と人工例では、記録を無限に増やしても費用差が残り得ること、各期だけでは最適行動が一致しても在庫の持越しによって判断が分かれることを示しました。有限標本の保証も与えていますが、需要が期間ごとに独立で過去と運用時に分布が変わらないなどの仮定があります。実験は人工例と実販売資料を加工した条件で、実店舗の発注変更による効果は報告していません。
  problem: |-
    閉店までに10個売り切れたとき、買いたい個数がちょうど10個だったのか、もっと多かったのかは販売数に残りません。反対に、担当者が需要の多い日を予想して在庫を増やすと、需要まで分かった日はたまたま集まった標本ではありません。著者は、観測から漏れた需要と、在庫を増やす判断に使った予測の両方が分からない場合を扱います。
  method: method.md
  why_it_might_work: |-
    需要分布を一つに決めなくても、候補のどれを採っても最適な発注が同じなら、分布をこれ以上絞る必要はありません。反対に、候補によって発注が分かれるときは、選んだルールが最適なルールよりいくら余計にかかるかを計算できます。Γが小さすぎると真の分布が候補から外れます。Γを大きくしただけで実際の費用が下がるわけでもありません。
  evidence: |-
    図1では、同じ販売記録に合う二つの需要分布で、安い行動が逆になります。命題7と図2では、各日だけならどの分布でも発注しない方が安くても、在庫を翌日に持ち越せると、二日分の最適な発注が分布によって変わります。

    第6.2節の表2では、著者は加工した販売資料を使い、27通りの費用設定を同じ30組の履歴で比べました。Γは両方法とも10です。一方は需要の観測割合に標本誤差を見込み、もう一方は履歴の割合をそのまま使います。共通の基準で比べると、費用差の上限は誤差を見込む方法で9設定が小さく、18設定が同じでした。ところが、実験で設定した真の分布の下での費用差は、6設定で小さくなり、18設定で変わらず、3設定で大きくなりました。

    この上限は候補の中で不利な場合に備えるための値です。上限を小さくしても、実際に生じる費用が必ず減るわけではありません。著者は観測方法と需要の範囲を人工的に設定しており、実店舗で発注を変えた効果は測っていません。

    [一次資料：図1、命題7・図2、第6.2節・表2](https://arxiv.org/html/2611.19323v1)
  executable_understanding: |-
    図1の例でΓを切り替えます。需要0が分かる記録は20%、需要1が分かる記録は20%、需要が見えない記録は60%のままです。各棒は、選んだ行動が、その需要分布を知る最適な行動よりいくら多くかかるかを示します。棒ごとに最も不利な分布を使うので、二つの棒が同じ需要分布での費用を示すとは限りません。
  results: |-
    Γ=1のとき、この例では需要が0となる確率が0.5に決まり、注文してもしなくても費用は同じです。Γ=11のとき、確率は0.25〜0.75のどこかになり、どちらを選んでも最も不利な場合の費用差は0.25です。別の2期間の例では、先に1個だけ買い、翌日に補充しない方が、最も不利な場合の費用差を0.1225まで抑えられます。
  what_we_verified: |-
    Labは図1のΓを7通り置き、需要確率の範囲と費用を計算しました。命題7ではあり得る発注ルールを全て試しました。需要確率の四つの端点で、全く買わない場合の最大費用差は0.1775、先に買って補充しない場合は0.1225でした。
  what_we_did_not_verify: |-
    Labは有限標本の信頼集合や著者の実験全体を再現していません。大規模な最適化や実店舗への適用も試していません。需要が各期で独立か、過去と運用時で分布が同じか、Γの妥当性は、現場のデータで別に確かめる必要があります。
  implementation: |-
    run.pyはPythonの標準ライブラリで二つの人工例を計算し、results.jsonに保存します。画面ではそのファイルにある7条件を切り替えます。外部APIや実際の在庫、発注システムにはつなぎません。
  mapping: mapping.md
