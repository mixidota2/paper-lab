question: UniRecはカテゴリを予測してから商品を表すコードを生成する
summary: ShopeeのUniRecはカテゴリを先に予測し、その結果を使って商品を識別するSIDを生成する。従来の多段推薦とのA/Bテストで、著者は全体のページビュー当たりのクリック率が5.37%、注文数が4.76%、取引総額が5.60%増えたと報告した。
