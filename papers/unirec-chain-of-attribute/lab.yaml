    [実行コード](../downloads/unirec-chain-of-attribute/run.py)・[全結果](../downloads/unirec-chain-of-attribute/results.json)・[README](../downloads/unirec-chain-of-attribute/README.md)・[方法](../downloads/unirec-chain-of-attribute/method.md)・[対応表](../downloads/unirec-chain-of-attribute/mapping.md)を保存できる。


