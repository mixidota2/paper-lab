core_idea:
  author_claim: 著者は、Chain-of-Attribute（CoA）で属性を先に予測すると、生成モデルが商品の特徴を参照でき、商品を表すコードの予測の不確かさが平均では小さくなると説明する。露出の上限、生成時の条件（CDC）、RFTとDPOによる学習を組み合わせ、OneRec-V2より高いHRとShopeeでの改善を報告した（§3–4）。
  research_bot_interpretation: Labは、属性を先に予測する方式の比較結果と、生成確率だけで判別モデルと同じ順位を出せるという主張を分けて読む。式3には一般に分母p(f|u)が必要だ。また著者が実験で先に生成した属性は中分類と小分類で、出品者やブランドは候補として挙げた例だ。
sections:
  problem: |-
    従来の判別型モデルは、候補商品のカテゴリや出品者を直接参照し、その利用者がどう反応するかを予測できる。商品を短いコード列（SID）に圧縮し、そのコードだけを生成する方式では、SIDに残らなかった属性を予測の途中で参照しにくい。また、よく表示される商品が同じ先頭コードを共有すると、ビーム探索で残す候補が一部のコードに偏る。

    UniRecは、商品属性の不足と露出の集中を別々に扱う。CoAはカテゴリなどの属性をSIDより先に生成する。SIDを作るときは、同じコードに割り当てた商品の露出の合計に上限を設ける。CDCは、推薦を表示する画面と生成済みのトークンの組み合わせをモデルに渡す。属性を先に生成する方式にはGRACEという先行例がある。
  evidence: |-
    ### 上位10%の2段コードの組が全露出の87.9%を占めた

    図2で著者は、露出が多い順に並べた上位10%のコードについて、全露出に占める割合を求めた。1段目だけを数えると33.24%、最初の2段の組では87.90%、3段の組では89.62%だった。商品を露出順に並べた集計ではなく、露出の上限を導入する前のコードの分布だ。

    著者は9日間の本番ログで、どちらも約5,000万パラメータのOneRec-V2とUniRecを比較した。正解が上位50件に入る割合（HR@50）は、全サンプルで0.438から0.537へ（相対22.6%増）、購入サンプルで0.582から0.672へ（相対15.5%増）上がった（表1）。UniRecの設定同士を比べると、属性を生成しない場合は0.458、中分類と小分類を予測してからSIDを生成する場合は0.537だった（表2）。正解の属性をモデルに与えた場合だけを比べた値ではない。表3では、標準のRQ-KMeansに戻すと0.481、画面と目的を伝える開始トークンを外すと0.493、Content Summaryを外すと0.485だった。

    ### Shopeeはメイン画面とランディングページでA/Bテストを行った

    著者は各群に利用者トラフィックの20%を割り当て、UniRecを従来の判別型の多段推薦と比較した（§4.2、表5）。全体ではページビュー当たりのクリック率（PVCTR）が5.37%、注文数が4.76%、取引総額（GMV）が5.60%増えたと報告している。ランディングページ単独のクリック率は公表していない。試験日数、信頼区間、p値、既存の各段を外した後の配信構成の詳細は本文から分からない。

    著者は候補を探す処理と順位付けを統合したと述べている。既存サービスのどのフィルターや後処理まで取り除いたかは確認できない。[OxygenREC-v2](oxygenrec-v2-idgr.html)は推薦の制御と蒸留を扱い、[OneRec](https://arxiv.org/abs/2508.20900)は推薦を系列として生成する。[ISD](understanding-sids-isd.html)はSIDに残る情報を調べる。各論文は別の部分を扱うため、報告値をそのまま比べても手法の優劣は分からない。

    <figure class="teaching batch17"><h3>露出が多い上位10%のコードに、全露出の何割が集まったか</h3><div class="b17-meter"><span>1段目（s₀）</span><meter min="0" max="100" value="33.24">33.24</meter><strong>33.24%</strong></div><div class="b17-meter"><span>1段目と2段目の組（s₀,s₁）</span><meter min="0" max="100" value="87.9">87.9</meter><strong>87.9%</strong></div><div class="b17-meter"><span>3段すべての組（s₀,s₁,s₂）</span><meter min="0" max="100" value="89.62">89.62</meter><strong>89.62%</strong></div><figcaption>原論文の図2。露出上限を導入する前の分布。どの行も全露出を分母にし、上位10%を取り出す単位だけを変えている。</figcaption></figure>

    <figure class="teaching batch17"><h3>表5：従来の多段推薦に対する相対変化</h3><div class="matrix-scroll" tabindex="0" role="region" aria-label="画面別のA/Bテスト結果"><table><thead><tr><th>指標</th><th>全体</th><th>メイン画面</th><th>ランディングページ</th></tr></thead><tbody><tr><td>注文数</td><td>+4.76%</td><td>+4.27%</td><td>+5.78%</td></tr><tr><td>取引総額（GMV）</td><td>+5.60%</td><td>+5.42%</td><td>+6.19%</td></tr><tr><td>ページビュー当たりのクリック率</td><td>+5.37%</td><td>+5.37%</td><td>未報告</td></tr></tbody></table></div><figcaption>原論文の§4.2、表5。各群には利用者トラフィックの20%を割り当てた。全体欄は著者の報告値で、画面別の値の単純平均ではない。</figcaption></figure>

    一次資料：[原論文の第4版PDF](https://arxiv.org/pdf/2604.12234v4)。各節と図表の対応は末尾の対応表に記した。
  overview: |-
    Shopeeの研究チームは、商品を直接当てる代わりに、まず利用者が選びそうな商品のカテゴリなどを予測する推薦モデルを提案しました。UniRecは、予測した属性を手掛かりに商品の識別子（SID）を順に生成します。候補を探してから別のモデルで順位を付ける方式に対し、商品の特徴を生成の途中に入れ、候補を探す処理と順位付けを一つのモデルで扱います。

    Shopeeはメイン画面とランディングページで、各群に利用者トラフィックの20%を割り当て、従来の多段推薦と比べました。著者は全体でページビューあたりのクリック率が5.37%、注文数が4.76%、取引総額が5.60%増えたと報告しています。ただし、ランディングページ単独のクリック率は報告していません。
  why_it_might_work: |-
    【Labの解釈】属性を知った後のエントロピーは、属性ごとの予測の不確かさを、その属性が現れる割合に応じて平均した値だ。同じ履歴と利用者情報の下では、属性を知らない場合より平均が大きくなることはない。属性がSIDの予測に追加の情報を与えるほど平均は小さくなる。ただし、学習時は正解の属性を与えられるのに対し、推論時はモデルが予測する。ビーム探索が属性の段で正しい候補を落とせば、続くSIDの段でその商品を取り戻せない。

    グループに入る商品数をそろえても、よく表示される商品が集まれば露出は偏る。商品の露出を足して上限を設けると、この偏りを扱える。ただし、商品を分割できず、1商品の露出がすべてのグループの上限を超えるなら、どこに割り当てても制約を満たせない。制約を満たす割当がある場合でも、貪欲法で必ず見つかるとは限らない。
  method: method.md
  executable_understanding: Labは正しい属性が分かる4トークンの人工分布で、属性を知る前後のエントロピーを計算する。次に商品の移動で露出上限を守れる例と、1商品の露出が大きすぎて守れない例を比べる。最後に2商品の確率を求め、ベイズの式で分母を省いた順位と残した順位を比べる。
  results: 下の値はLabが人工データで計算した結果だ。ShopeeのA/Bテストで著者が報告した値とは別のものだ。
  what_we_verified: |-
    **仕組みの検証：一部のみ（Mechanism: PARTIAL）**。人工分布では、正しい属性を知るとエントロピーが2ビットから1ビットに下がった。商品の移動で、2グループの露出を8と4から6と6にそろえ、上限6.3を守れた。

    人工例では、分母を省いた生成確率と商品ごとの反応率で順位が逆になった。また、露出20の1商品を上限11.025のグループに収めることはできなかった。これらは `results.json` の `checks` でNOT OBSERVEDとした。CONFIRMEDも個々の計算に対する判定で、UniRec全体の検証結果ではない。
  what_we_did_not_verify: |-
    Labは属性を誤って予測した場合の影響や、ビーム探索で候補を拾う割合を測っていない。モデル全体の学習、RFT・DPOの学習、ShopeeでのA/Bテスト、既存の推薦処理を一段ずつ外す試験も行っていない。人工分布でエントロピーが下がることだけでは、クリック率が上がるか、生成と判別で同じ順位になるかは判断できない。

    **実運用での性能・規模を増やした場合の挙動・本番適用：未検証（NOT TESTED）**。Labは論文の報告値を照合したが、報告された本番効果は独立に再現していない。
  implementation: |-
    実験コードはPythonの標準ライブラリだけを使う。リポジトリの最上位で `uv run papers/unirec-chain-of-attribute/run.py` を実行すると、同じフォルダーの `results.json` が更新される。乱数や外部APIは使わない。

    [実行コード](../downloads/unirec-chain-of-attribute/run.py)、[全結果](../downloads/unirec-chain-of-attribute/results.json)、[README](../downloads/unirec-chain-of-attribute/README.md)、[方法](../downloads/unirec-chain-of-attribute/method.md)、[対応表](../downloads/unirec-chain-of-attribute/mapping.md)をダウンロードできる。

    Labが確認した論文本文とarXiv書誌には、取得できる公式実装への案内が見当たらなかった。公開されていないと断定するものではなく、公式コードは独立に実行していない（NOT TESTED）。
  mapping: mapping.md
teaching_figures:
- kind: equations
  id: method-equations
  title: 露出の上限、属性による不確かさの変化、順位の条件
  after: method
  caption: 論文の式1〜6に対応する。最後の式は、論文の式3で省かれた分母を含めた形だ。
  rationale: どの値を足すのか、どの条件を加えるのか、何で割るのかを分けて示す。
  source: https://arxiv.org/pdf/2604.12234v4
  locator: 式1–6
  steps:
  - name: コードごとの露出上限
    formula: V_k=Σ_{i:z_i=k}w_i ≤ τ·Σ_i w_i/K
    explanation: 同じコードを割り当てた商品の露出を足す。上限は全コードの平均露出に許容倍率を掛けた値で、商品数の上限ではない。
  - name: 属性を知ると減る不確かさ
    formula: H(S|P,U)−H(S|P,A,U)=I(S;A|P,U)
    explanation: 同じ生成済みトークンPと利用者Uの下で、属性Aを知ると、次のSIDの不確かさが平均でどれだけ減るかを表す。
  - name: 商品ごとの反応率に戻す式
    formula: p(y|f,u)=p(f|y,u)p(y|u)/p(f|u)
    explanation: 商品間で順位を比べるときは、各商品が現れる確率p(f|u)を分母に残す。Labは分母の有無で順位が逆になる例を示した。
