teaching_figures:
- kind: equations
  id: method-equations
  title: 式と操作の対応
  after: method
  caption: 各記号が担う役割を分けて読む。
  rationale: 演算と制約の対象を明確にする。
  source: https://arxiv.org/pdf/2604.12234v4
  locator: 式1–6
  steps:
  - name: capacity
    formula: V_k=Σ_{i:z_i=k}w_i ≤ τ·Σ_i w_i/K
    explanation: 商品数ではなく露出重みの合計。
  - name: entropy
    formula: H(S|P,U)−H(S|P,A,U)=I(S;A|P,U)
    explanation: 属性を条件に加えた平均の不確実性低下。
  - name: Bayes補正
    formula: p(y|f,u)=p(f|y,u)p(y|u)/p(f|u)
    explanation: f間のrankingには分母が一般に必要。これは式3へのLabの検討。
