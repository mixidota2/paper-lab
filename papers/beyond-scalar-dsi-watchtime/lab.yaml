question: 平均視聴時間が同じ動画でも、どのくらい見続けるかを区別できるか
summary: 著者は、視聴時間の平均だけでなく、終了付近まで見る確率や動画長の110%を超えて見る確率も推薦に使う方法を提案しました。公開データ3種類で、視聴秒数の平均絶対誤差は最良の比較方式より1.9〜8.5%小さくなりました。本番で推薦を切り替えた結果は報告していません。
