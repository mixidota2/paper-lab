  rows:
  - label: 検索時
    nodes:
    - title: 在庫の観測
      text: probeのscore・カテゴリ・属性充足率とscene profileを統合。
    - title: 段別の規則
      text: 検索と選択に最大3件ずつ。商品IDの存在は記憶しない。
    - title: 回答
      text: 候補を選択、または観測範囲で根拠なしと判断。
  - label: offlineの更新
    nodes:
    - title: 失敗・不確実
      text: 固定snapshotで追加経路を探索。不確実な結果を負例にしない。
    - title: 成功を回収
      text: 同じ要求の失敗と対比して規則候補を作る。未解決なら提案しない。規則は据え置く。
    - title: replay
      text: 対象・背景・固定検証集合を検査。組み合わせた規則も再検査。
- kind: equations
  id: portrait-equations
  title: 観測と方策の入力を式で追う
  after: method
  locator: Eqs. 1, 5, 7, 8
  rationale: 観測と方策の入力を式で追う
  caption: 一次資料を説明用に再構成。商用の報告値と人工実験は別に示す。
  source: https://arxiv.org/pdf/2609.04813v1
  steps:
  - name: 属性の観測
    formula: density(c) = |P_c|; rel(c, f) = filled(P_c, f) / |P_c|
    explanation: 密度はprobe内の商品数。充足率の式はFieldStatsの説明用展開であり、カタログ全件の保証ではない。
  - name: 在庫の要約
    formula: P(q,Iₜ) = Template(confₚ, {(S_c, SP(c))})
    explanation: 検索scoreの統計とカテゴリ内の属性情報に、事前計算した変化・不足の情報を加える。
  - name: 候補と最終選択
    formula: C = f_ret(q, P, G_ret); R = f_sel(q, C, P, G_sel)
    explanation: 重みが固定の二つのモデルへ、現在の観測と段別規則を渡す。Qwen3-8B共通backbone比較では、DeepSeek-V3をofflineのjudgeと規則生成にだけ使う。
