question: 検索で商品が見つからないとき、どこまで「該当なし」と判断できるか
summary: IGPOは商品カタログを検索のたびに調べ、得た情報を候補の探し方と選び方に使います。著者の14日間のA/Bテストでは、クリック率が相対で3.17%上がり、監査で問題と判定された結果は相対で38.9%減りました。調べるのは商品情報で、店舗の在庫数ではありません。
