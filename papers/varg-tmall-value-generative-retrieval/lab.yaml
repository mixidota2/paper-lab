core_idea:
  author_claim: VARGは、検索語に合う商品を選びやすいコードを学び、3番目のトークンで同じ組の商品の価値順位を表す。教師あり微調整とPrefix-GRPOを使い、粗い順位付けを通さなくても最終順位付けへ渡せる候補を選ぶ。
  research_bot_interpretation: VARGは、既存の最終順位付けを残して、その手前で生成経路用の枠を引き受ける。[LIGE-GR](lige-gr-meta-listwise.html)が対象にするのは既存候補の並べ方で、[Sona](sona-yandex-music.html)は推薦の複数段を置き換える。[OGR](ogr-once-generated-ranked.html)は生成と順位付けの統合を扱う。VARGは、追加した枠を評価単位として読む。
sections:
  overview: |-
    Taobao・Tmallの研究チームは、検索の意図に合い、購入にもつながる商品を、生成モデルで早い段階から探す方法を提案しました。VARGは、検索文との関連性、過去のクリックや購入、既存の順位付けモデルの評価を学習に使います。生成した商品は、通常の予備順位付けを通さず、確保した枠から既存の最終順位付けへ渡します。最終順位付けまで置き換える方法ではありません。

    Tmallアプリの検索トラフィックの20%を使った14日間のA/Bテストで、著者は従来方式より取引総額（GMV）が1.45%、利用者あたりの閲覧指標（IPV/user）が0.22%増えたと報告しています。この比較では学習方法と候補を渡す経路をまとめて変えており、商品IDの学び方だけの効果は分かりません。
  problem: |-
    従来の検索は、複数の方式で候補を集め、重複を除き、粗い順位付けで絞ってから最終順位を付ける。VARGが選んだ候補は、確保した枠から最後の処理へ直接入る。従来の経路と、最後に順位を付けるモデルは残る。

    同じ識別子で複数の商品を表すと、生成した識別子だけでは低い価値の商品も区別できず、限られた枠を使う。一方で、価値が変わるたびに全商品の識別子を振り直すと、モデルが覚えたコードと商品の対応が崩れる。著者は候補を選ぶ精度と、識別子を維持する処理を一緒に設計した。
  why_it_might_work: |-
    最初の2トークンが似た商品をまとめ、3番目がその中での価値順位を表す。モデルは意味が近い商品から選ぶときに、この順位を学習の手掛かりにできる。購入数と重み付きカート追加数の合計をクリック数で割る指標は、クリックが少ないと極端な値になりやすい。全商品の値も使って平滑化すると、少ない観測だけで順位が決まりにくい。

    既存の順位付けで平均より高い点が付いた候補には、追加学習で報酬を与えられる。行動が記録されていない候補にも信号が届く一方、既存の順位付けの偏りは引き継ぐ。識別子を固定すると既存商品の対応は保てるが、共有する商品が増えれば、最後に順位を付ける候補が増える。商品の特徴や価値が急に変わると、識別子を保つこととの両立が難しくなる。
  evidence: |-
    一次資料：[原論文の§4、表1–7](https://arxiv.org/pdf/2609.14493v1)。

    著者は5,143万商品を使った。教師あり学習の例は、商品から識別子を出す段階が5,143万件、検索語から出す段階が4,800万件、利用者の情報も使う段階が1億569万件だった。GPUは教師あり学習で128基、強化学習で64基使った。Labの人工例とは規模が異なる。

    | 比較 | 著者の報告値 | 何を測ったか |
    | --- | --- | --- |
    | 最初の割り当てで、同じコードを共有する商品 | RQ-VAE-3は91.25%、VARG-IDは0% | 他の商品とSIDを共有する商品の割合。コードの種類の割合ではない。 |
    | モデルを学習し直さず、3番目のトークンをすべて振り直す | 完全なSIDのHR@100が14.45ポイント低下 | 学習済みモデルとコードの対応がずれた場合の測定。本番売上の変化ではない。 |
    | Prefix-GRPOと教師あり学習の比較 | GMV Recall@1が30.88%から36.35%へ | 商品の30日間のGMVで重み付けした再現率。オンラインの売上とは別だ。 |
    | 同じ比較で検索語と商品の組を重み付け | Q2I-GMV Recall@1が36.12%から38.60%へ | 検索語と商品の組の14日間のGMVで重み付けした再現率。 |
    | 本番14日間、検索トラフィックの20% | GMV +1.45%、利用者あたりの閲覧指標 +0.22%、PCTR +0.31% | 従来の本番方式に対する相対変化。通過する段を変えただけの試験ではない。 |

    利用者単位のクリック率（UCTR）とクリック後の転換率（UCTCVR）はともに0.13%増え、利用者あたりの表示回数の指標（Exp. PV/user）は0.09%減った。表7では、候補枠を絞ったVARGの関連性評価で良好と判定された割合が、2回の評価で76.77%と76.58%だった。従来方式で最も大きい枠を使ったときは76.71%と76.81%で、2回目はVARGがわずかに下回った。候補枠の絶対数や本番A/Bテストの信頼区間は表にない。

    表5の段階的な比較では、行動報酬を加えるとQ2I-GMV Recall@1が2.19ポイント増えた。既存の順位付けと関連性を追加するとさらに0.21ポイント、先頭部分に応じて学習の重みを変えるとさらに0.08ポイント増えた。Prefix-GRPO全体の差を、先頭部分の重みだけの効果とは扱わない。別の軽量な生成方式では、1秒あたりの処理件数が11.1倍になったが、HRは下がった。その方式は主な本番A/Bテストには使っていない。
  executable_understanding: |-
    リポジトリの最上位で `uv run papers/varg-tmall-value-generative-retrieval/run.py` を実行する。Labは、先頭2トークンが同じ3商品に、新商品Dを加える。全商品を並べ直す場合と、既存のコードを固定する場合で、古いコードが残る割合と、他の商品とコードを共有する割合を別々に求める。

    報酬についても、形式が不正な出力、商品がないコード、購入が記録されたコード、行動がない場合の関連性を比べる。正解の順位が端にあるときに、近い順位へ配る確率の合計が1になることを確かめる。
  results: |-
    全商品を並べ直すと、旧3商品のうち元のコードを維持できるのは1商品だった。既存のコードを固定すると3商品とも維持できたが、BとDがコードを共有した。共有したのは4商品のうち2商品だ。追加前は共有していなかった。

    形式が不正な出力の報酬は−2、形式が正しくても商品がない場合は−1だった。どちらも購入や関連性などの点を後から足さない。
  what_we_verified: '**仕組みの検証：一部のみ（Mechanism: PARTIAL）**。Labは人工例で、新商品の順位を既存コードの範囲に収めること、既存商品のコードを変えないこと、共有率を商品単位で数えることを確かめた。報酬を与える条件と、正解が端にある場合の教師分布の正規化も計算した。結果のCONFIRMEDはこの範囲を指す。'
  what_we_did_not_verify: '**実運用の性能・規模を増やした場合の挙動・本番適用：未検証（NOT TESTED）**。LabはRQ-VAEと検索語・商品の表現、Qwen2.5の学習、GRPOの収束、5,143万商品でのコード共有の負荷を検証していない。著者のGMVとHRも再現していない。論文も、日々の更新後にすべての商品が異なるコードを持つとは述べていない。'
  implementation: '`assign()` は式6の割り当て、`eb()` は平滑化、`ordinal()` は式11で正解の近くへ確率を配る処理、`reward()` は式12–15の条件を計算する。商品の先頭2トークンは1種類に固定した。実商品の属性、検索語のエンコーダー、最終順位付けは実装していない。3番目のトークンは同じ組の中の順位に対応する。'
  method: method.md
  mapping: mapping.md
