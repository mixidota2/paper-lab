question: 生成した商品だけが粗い順位付けを省くとき、どこで候補を選ぶか
summary: Tmall Appでは、生成モデルが選んだ候補は確保した枠に入り、粗い順位付けを通らず既存の最終順位付けへ進む。従来の検索経路は残す。14日間のA/Bテストでは、本番対照に比べて取引総額が1.45%増えた。
