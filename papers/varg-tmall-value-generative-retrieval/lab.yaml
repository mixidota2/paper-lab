- kind: equations
  id: value-math
  title: コードの順位と損失の重みは別に決める
  after: method
  locator: Eqs. 2–6, 11, 17
  rationale: どの式が商品のコードを決め、どの式が学習の損失に効くかを分けて読む。
  caption: 原論文の式2–6・11・17。商品のコードを決める式と、モデルの学習に使う式を区別する。
  source: https://arxiv.org/pdf/2609.14493v1
  steps:
  - name: 検索語と商品の表現を近づける
    formula: LID = Lrec + Lcom + λQI · [CE(S,I)+CE(Sᵀ,I)]/2
    explanation: Sは正規化した検索語と商品の埋め込みの内積を温度で割った値。量子化する前に、対応する検索語と商品が近くなるように学習する。
  - name: クリックが少ない商品の価値を平滑化する
    formula: p̃ᵢ = (vᵢ + αID p₀) / (cᵢ + αID)
    explanation: vᵢは購入数bᵢと重み付きカート追加数ηₐaᵢの合計。cᵢはクリック数で、p₀は全商品のvを全クリック数で割った値。
  - name: すでに商品がある組に新商品を加える
    formula: rₜ(i) = min(ρₜ(i), Cₜ₋₁(c) − 1)
    explanation: 既存商品のコードは変えない。この組で新商品の順位を計算し、上限を超えると末尾を使う。新しい組の上限はK₃−1。
  - name: 正解に近い順位にも教師の確率を配る
    formula: q(r|r*) ∝ exp(−|r−r*|/τ) · 1[|r−r*|≤R]
    explanation: 正解の近くにある有効な順位に確率を配り、足すと1にする。正解だけを予測する従来の損失も残す。
  - name: 次に選べる分岐が多い位置を重く扱う
    formula: φ(n;N) = d + (1−d) log(n)/log(N)
    explanation: N=1ならdとする。次の選択肢が多い位置の学習損失を重くする。
- kind: matrix
  id: daily-address
  title: 古いコードを固定すると、新しい商品が番号を共有する
  after: method
  locator: §3.2 / Table 1
  rationale: 古いコードを保てることと、全商品が異なるコードを持つことは別だ。
  caption: 人工4商品の3番目のトークンを比較する。最初の2トークンは全商品で同じ。
  source: https://arxiv.org/pdf/2609.14493v1
