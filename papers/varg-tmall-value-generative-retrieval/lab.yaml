core_idea:
  author_claim: 意味prefixに検索関連性を学ばせ、3番目のtokenへ平滑化した価値順を埋める。SFTとPrefix-GRPOで、最終rankerへ直接渡せる候補を学習する。
  research_bot_interpretation: '[LIGE-GR](lige-gr-meta-listwise.html)は既存候補内の列、[Sona](sona-yandex-music.html)は推薦cascadeの置換、[OGR](ogr-once-generated-ranked.html)は生成列と順位の統合を目指す。VARGは検索の既存final
    rankerを残し、その手前の予約枠を担う。評価すべき移行単位はこの枠である。'
sections:
  overview: 価値の高い商品を生成しても、検索意図から外れれば最終rankerの限られた枠を浪費する。VARGは意味・価値・既存順位モデルとの整合を候補生成へ移す。Taobao
    & Tmall Groupの研究だが、今回のオンライン評価面はTmall App検索である。14日・20%という条件のもと、GMV +1.45%、IPV/user
    +0.22%、PCTR +0.31%を著者が報告した。
  problem: 通常の検索経路は複数retrieval→merge→pre-rank→final rank。VARGの生成SIDは商品へ戻し、予約quotaでpre-rankを通さず合流する。final
    rankerそのものを削除した実験ではない。クラスタ単位の曖昧なIDでは低価値商品も枠を使い、毎日IDを価値順に振り直すと昨日学習した住所が別の商品を指す。選別と住所の安定性を同時に扱う必要がある。
  why_it_might_work: '解釈: 3番目のtokenの局所順序が価値の事前情報になるため、意味的に近い商品から選ぶ最後の判断を補助できる。EB平滑化は少数clickでCVRが極端になる問題を抑える。rankerの正の優位分だけを報酬に加えると、観測行動がない候補にも学習信号が届く。ただし既存rankerの偏りを引き継ぎ、共有slotの増加は候補展開数を増やす。新商品の意味や価値が急変すれば、住所固定との緊張が残る。'
  evidence: '一次資料の著者報告。


    [PDF §4、Tables 1–7](https://arxiv.org/pdf/2609.14493v1) の著者報告。カタログ51.43M商品、SFTはItem2SID
    51.43M、Query2SID 48.00M、個人化105.69M例。SFT 128 GPU、RL 64 GPUであり、Labの小実験とは規模が違う。


    | 比較 | 数値 | 読み方 |

    | --- | --- | --- |

    | 初期collision item率 | RQ-VAE-3 91.25% / VARG-ID 0% | 非singleton SIDを持つ商品の割合 |

    | 3番目を全面並べ替え | complete-SID HR@100 −14.45 pp | 学習済み住所を壊す監査、オンライン損失ではない |

    | Prefix-GRPO vs SFT | GMV Recall@1 30.88→36.35% | +5.47 pp。オンラインGMVとは別 |

    | 同比較のQ2I-GMV Recall@1 | 36.12→38.60% | +2.48 pp。重みがquery–itemの14日GMV |

    | オンライン14日 / 20% | GMV +1.45%、IPV/user +0.22%、PCTR +0.31% | production control比の相対差
    |


    UCTRとUCTCVRは各+0.13%、Exp. PV/userは−0.09%。Table 7のGood rateはVARGの小quotaで76.77/76.58%、従来最大quotaで76.71/76.81%。第2回は従来を少し下回るので「常に上回る」とは読まない。quotaの絶対数やA/Bの信頼区間は表にない。


    Table 5でQ2I-GMV Recall@1は行動報酬だけで+2.19 pp。ranker・関連性追加が+0.21 pp、prefix重みがさらに+0.08
    ppである。Prefix-GRPO全体の改善をprefix重み単独の効果にしない。探索的な軽量decoderの11.1倍QPSは主A/Bに使われておらず、HRも低下する。'
  executable_understanding: '`uv run papers/varg-tmall-value-generative-retrieval/run.py`。同じ人工prefix内で、新商品DをA/B間へ挿入する。全面並べ替えと既存住所固定を比べ、衝突率と旧住所保持率を別々に測る。報酬の書式違反・空slot・購入・関連性の分岐、端点のLO分布も計算する。'
  results: 4商品の例で全面並べ替えは旧住所保持率1/3、固定更新は1。固定更新の衝突item率は1/2になる。これはBとDが住所を共有する設計の代償。初期の衝突率は0。書式が不正な出力に購入情報を与えても報酬−2、空slotなら−1となり、他の信号を加算しない。
  what_we_verified: Mechanism PARTIAL。Eq. 6の範囲切り詰め、既存住所の不変性、item単位の衝突率、報酬gate、LO端点の正規化を人工fixtureで確認した。これらの局所不変条件はCONFIRMED。
  what_we_did_not_verify: Performance / Scaling / Production applicability NOT TESTED。RQ-VAE・Q2I表現、Qwen2.5の学習、GRPOの収束、51.43M商品でのslot負荷、GMV・HRの再現はしていない。日次更新後も全IDがcollision-freeという主張は原論文にもない。
  implementation: '`assign()`がEq. 6、`eb()`が平滑化、`ordinal()`がEq. 11の局所分布、`reward()`がEqs.
    12–15のgateを抜き出す。prefixは1つに固定し、実商品属性・query encoder・最終rankerを省略。第三tokenの番号は同prefix内の順序を表す。'
