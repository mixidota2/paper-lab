  source: https://arxiv.org/pdf/2609.14493v1
  steps:
  - name: Q2Iの双方向整合
    formula: LID = Lrec + Lcom + λQI · [CE(S,I)+CE(Sᵀ,I)]/2
    explanation: Sは正規化query/item embeddingの類似度÷温度。量子化前の検索関連性を学ぶ。
  - name: EB-CVR（記号を簡略化）
    formula: p̃ᵢ = (vᵢ + αID p₀) / (cᵢ + αID)
    explanation: vᵢ=bᵢ+ηₐaᵢ、cᵢはclick数、p₀=Σv/Σc。bは購入、aはcart数。
  - name: 既存prefixの新商品
    formula: rₜ(i) = min(ρₜ(i), Cₜ₋₁(c) − 1)
    explanation: 旧商品は住所を保持。新prefixだけK₃−1を上限にする。
  - name: 局所順序教師
    formula: q(r|r*) ∝ exp(−|r−r*|/τ) · 1[|r−r*|≤R]
    explanation: 合法な近傍で正規化。exact lossを残す。
  - name: 合法枝の重み
    formula: φ(n;N) = d + (1−d) log(n)/log(N)
    explanation: N=1ならd。枝の多い位置のpolicy lossを強める。
