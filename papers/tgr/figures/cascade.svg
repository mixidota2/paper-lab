<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" role="img" aria-labelledby="title">
<title id="title">著者らは推薦の違う部分に四つのモデルを使う</title>
<rect width="600" height="560" fill="#f5f3ec"/>
<g font-family="sans-serif" fill="#172e30">
<rect x="24" y="20" width="552" height="98" rx="7" fill="#e6eee5" stroke="#afc1b4"/>
<text x="48" y="53" font-size="16">1 / 候補を集める</text>
<text x="48" y="90" font-size="22" font-weight="bold">BARGEが別の経路で候補を作る</text>

<rect x="24" y="145" width="552" height="98" rx="7" fill="#e6eee5" stroke="#afc1b4"/>
<text x="48" y="178" font-size="16">2 / 候補に点数を付ける</text>
<text x="48" y="215" font-size="22" font-weight="bold">CCFormerが集めた候補を採点する</text>

<rect x="24" y="270" width="552" height="98" rx="7" fill="#e6eee5" stroke="#afc1b4"/>
<text x="48" y="303" font-size="16">3 / 一覧を直接作る</text>
<text x="48" y="340" font-size="22" font-weight="bold">HiGRが表示する一覧をまとめて作る</text>

<rect x="24" y="395" width="552" height="98" rx="7" fill="#e6eee5" stroke="#afc1b4"/>
<text x="48" y="428" font-size="16">4 / 利用者について事前に推論する</text>
<text x="48" y="465" font-size="22" font-weight="bold">TGR-Reasonが事前に作った情報を渡す</text>
<text x="24" y="540" font-size="17">著者らは四つのモデルを一つずつ比べた。順番に通る処理ではない。</text></g></svg>
