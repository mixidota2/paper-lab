<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180"><rect width="600" height="180" fill="#fbfaf7"/><g font-family="sans-serif" text-anchor="middle"><text x="300" y="28" font-size="18">候補を採点する方式と、表示一覧を作る方式を比べる</text><rect x="45" y="60" width="210" height="70" fill="#dbeafe" stroke="#2563eb"/><rect x="345" y="60" width="210" height="70" fill="#dcfce7" stroke="#16a34a"/><text x="150" y="90" font-size="16">候補に点数を付ける</text><text x="150" y="112" font-size="13">候補ごとに複数の点数を返す</text><text x="450" y="90" font-size="16">表示する一覧を作る</text><text x="450" y="112" font-size="13">複数の候補をまとめて選ぶ</text></g></svg>
