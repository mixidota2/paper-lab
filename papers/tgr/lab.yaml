title: "TGR: Advancing Industrial Recommendation from Generative-Paradigm Ranking toward Unified Generation and Reasoning"
authors: ["Lei Cheng", "Haonan Hu", "Beibei Kong", "Yudong Li", "Zang Li", "Yunsheng Pang", "Hongyang Su", "Jianchao Tu", "Yunlong Wang", "Bing Wen", "Junzhang Zhu", "Shaojie Zhu", "Chengxiang Zhuo"]
year: 2026
topics: [recommender-systems, generative-recommendation, ml-systems]
