teaching_figures:
- kind: logic
  id: families
  title: どのモデルが何を返すか
  after: method
  locator: §3–5
  rationale: 候補ごとの点数、ひとつの候補、表示一覧は異なる出力。
  caption: BARGEとHiGRは候補や一覧を作る別の方法で、一つの処理の前後を担当するわけではない。
  rows:
  - label: 既存の順位付けを改める
    nodes:
    - title: CCFormer / GenRank
      text: 特徴を記号にし、履歴を縮めて候補と照合し、候補ごとの点数を出す。
  - label: 生成へ進む2つの選択肢
    nodes:
    - title: BARGE / NTP
      text: 商品の記号を一つずつ出す。商品内のまとまりと、途中の経路の整合を点検する。
    - title: HiGR / NSP
      text: 一覧の大まかな構成を決めてから、各位置に並べる項目を作る。
  - label: 生成に推論情報を供給
    nodes:
    - title: LatentRec / TGR-Reason
      text: Thinkモデルが配信前に項目の記号を作り、保存する。配信側のGenモデルはその記号を読む。
  source: https://arxiv.org/html/2609.00986
- kind: timeline
  id: reason-refresh
  title: 利用者についての推論は配信前に行う
  after: method
  locator: §5.2–5.4
  rationale: 配信前に計算する内容と、リクエストを受けたあとで行う処理を分ける。
  caption: 保存した情報の新しさと、モデルのバージョンが合っているかを確認する。更新の予約は、その場で推論したことを意味しない。
  rows:
  - label: オフライン
    nodes:
    - title: Thinkモデル
      text: Thinkモデルが利用者に関連しそうな項目の識別子を作り、モデルのバージョンとともに保存する。
  - label: オンライン：リクエスト到着
    nodes:
    - title: Genモデル
      text: 配信時は保存した記号を読み、利用者の履歴などと合わせて、候補を作る。
  - label: 非同期の更新
    nodes:
    - title: Nearline refresh
      text: 必要なときに別の処理へ更新を予約する。更新後の値が届くまでは、保存済みの情報を扱う。
  source: https://arxiv.org/html/2609.00986
- kind: equations
  id: generation
  title: 一つの候補を探す確率と、一覧全体の確率
  after: method
  locator: §4.1
  rationale: 記号を一つずつ選ぶ場合と、表示一覧をまとめて作る場合を比べる。
  caption: Hは利用者の履歴、zは商品の識別子を構成する記号、Sは表示一覧を表す。
  steps:
  - name: NTP：商品の記号を一つずつ選ぶ
    formula: p(z₁,…,zL | H) = ∏ₜ p(zₜ | H,z<t)
    explanation: 途中で記号を選び間違えると、次の段で選べる商品が変わる。BARGEは、商品のまとまりと、途中までの記号列を点検する。
  - name: NSP：表示一覧をまとめて作る
    formula: S* = argmaxₛ p(S | H)
    explanation: HiGRは大まかな一覧を計画し、そのあと各位置の項目を決める。商品ごとに独立して点を付け、上から並べる方法とは違う。
  source: https://arxiv.org/html/2609.00986
