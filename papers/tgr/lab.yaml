summary: TencentのTGRは、集めた候補に点を付ける処理、候補や表示一覧を作る処理、利用者について事前に推論する処理に別々のモデルを使う。著者はモデルごとに別の本番比較を行った。四つを組み合わせた効果は報告していない。
figures: []
core_idea:
  author_claim: Tencentの著者は、順位付けを置き換えるCCFormer、候補を一つずつ作るBARGE、表示一覧をまとめて作るHiGR、配信前に推論するTGR-Reasonを報告した。BARGEは商品の記号をまとめて読む処理、候補の記号列全体を採点する処理、二つの経路で候補を探す処理を組み合わせる。
  research_bot_interpretation: 何をモデルに渡し、モデルが何を返すかを分けると、各結果を比べやすい。候補に点数を付けることと、表示する一覧そのものを作ることは違う。事前に作った情報を使っても、リクエストごとに推論モデルを動かした結果にはならない。
sections:
  overview: |-
    Tencentの研究チームは、推薦のどの段階を変えるかに応じて別々のモデルを作りました。CCFormerは集めた候補に点数を付け、BARGEは推薦候補を一つずつ生成します。HiGRは複数の商品や動画をまとめた表示一覧を作ります。TGR-Reasonは推論で得た情報を事前に保存し、配信時の候補生成に渡します。

    従来方式との本番比較では、CCFormerが動画推薦のクリック率を3.57%改善しました。BARGEは別の配信面でクリック率が0.60%、記事を読んだ総時間が1.70%増えました。HiGRではある配信面の平均視聴時間が1.22%増え、TGR-Reasonでは新規利用者の表示後の転換率が13.09%増えました。各数字は別々のモデルと比較条件の結果です。すべてを組み合わせた一つの仕組みで得た改善ではありません。
  problem: |-
    推薦では、まず候補を集め、その中から表示する順番を決める。候補を探す段階は広い範囲を短時間で調べ、後段では残った候補を詳しく評価する。Tencentの四つのモデルは、この流れの別々の部分を変えている。

    商品の識別子が複数の記号からなる場合、途中で先頭の記号を誤ると、後から目的の商品に戻れないことがある。また、商品を一つ選ぶときのよさと、いくつかを並べた一覧全体のよさは同じではない。
  why_it_might_work: BARGEは、各記号を単独で採点するだけでなく、商品としてまとまりのある記号列かを点検する。一つの経路で見落とした候補を、もう一つの経路で拾える可能性がある。一方、探索幅を増やさない場合は、どの候補に入れ替わったかも見る必要がある。TGR-Reasonでは、事前に用意した情報が利用者の今の関心を表さなくなったとき、どう更新するかが課題になる。
  evidence: |-
    著者は従来の本番システムと、各モデルを別々に比較した。評価したサービス、変えた処理、指標が異なる。

    | モデル | 著者が変えた処理と条件 | 著者が報告した差 |
    | --- | --- | --- |
    | CCFormer | 既存の順位付けを置き換え、5つの配信面で2週間評価。各面の実験群に1日100万人超が接触 | 動画推薦のクリック率が3.57%増。別の広告順位付けでは広告収益が1.71%増（表6） |
    | BARGE | 候補を探す経路の一つに追加し、6%のトラフィックで2週間評価 | クリック率が0.60%、総閲覧時間が1.70%増（§4.2.5） |
    | HiGR | 表示一覧を作る処理を3つの配信面で比較 | 5%のトラフィックを使った最初の配信面で平均視聴時間が1.22%増。別の面ではクリック率が0.68%増（表14） |
    | TGR-Reason | 事前に作った情報を候補生成へ直接渡し、既存の候補生成と比較 | 有効な閲覧・視聴の割合が1.75%増。新規利用者に限ると、表示から目的の行動につながった割合が13.09%増（表17） |

    改善率を足しても、四つのモデルを同じサービスに入れたときの効果にはならない。TGR-Reasonがログ上で新規利用者の候補検索を改善した結果も、本番で利用者が反応した割合とは別である。[一次資料：論文v1の§3.6、§4.2.5、§4.3.5、§5.5](https://arxiv.org/html/2609.00986v1)
  executable_understanding: |-
    Labは、各段で正しい記号を90%の確率で選び、段どうしは独立だと仮定した。全階層で正しい枝を選んだ場合だけ到達成功とする。たとえば3段なら、成功確率は0.9を3回掛けた72.9%になる。この例は誤りが積み重なる様子を示すもので、BARGEを実装したものではない。

    `uv run papers/tgr/run.py` を実行すると、比較した全条件の結果を `results.json` に保存する。
  results: 各段の成功確率を固定すると、選ぶ段が増えるほど、すべての段で正しい記号を選べる割合は下がる。下の図はこの仮定から計算した割合で、論文のモデルを動かして測った値ではない。
  what_we_verified: 'Labは、独立した各段の成功確率を掛け合わせる計算と、階層数を変えたときの変化を確かめた（Mechanism: PARTIAL）。実際の学習では段どうしが独立とは限らず、この例はモデルの推薦品質を示さない。'
  what_we_did_not_verify: Labは本番のデータを使わず、候補の重複や多様性、遅いリクエストの応答時間を測っていない。四つの本番比較は独立に再現していない。TGR-Reasonが配信前にかける計算の費用も測っていない。
  implementation: Pythonの標準ライブラリだけで動く。入口は `run.py`、計算は `papers/_toy_common.py` が行う。図で使う全条件と、最初に表示する条件の表を同時に作る。CCFormer、BARGEの三つの処理、HiGR、事前の推論モデルと実機配信は実装していない。
  mapping: |-
    | 論文の箇所 | Labで説明すること |
    | --- | --- |
    | §2、§3.6 | TGRの全体像と、CCFormerが順位付けを置き換えた結果 |
    | §4.2、§4.3 | BARGEが候補を探す方法と、HiGRが表示一覧を作る方法 |
    | §5 | TGR-Reasonが配信の前と後で何をするか |
    | Labの合成例 | `run.py` から `papers/_toy_common.py` を呼び、階層を増やした場合の確率を `results.json` に保存する |

    [一次資料：論文v1](https://arxiv.org/html/2609.00986v1)。Labの計算は著者の実装ではない。
