question: |-
  短い動画を推薦するとき、表示する動画と順番を一つのモデルで決められるか
summary: |-
  OGRは、動画の組と表示順を一緒に生成する。各動画を表すコードには、動画の内容と視聴履歴での共起を反映する。Kuaishouの本番トラフィックの3%を使った1週間の実験で、既存方式より有効視聴が1.120%増えたと著者は報告した。約2.2倍は理論上の依存経路の比で、本番の応答時間ではない。
