  results: |-
    ここに載せた段数、共起、報酬は、Labが人工入力から計算した結果。論文の実測速度や本番の有効視聴とは別の数値である。
  what_we_verified: |-
    人工入力で、依存関係に沿った段数、主報酬の符号が保たれる条件、正規化した2つの表現を連結したときの長さを確かめた。仕組みの一部だけを確かめたため、MechanismはPARTIALとした。results.jsonのCONFIRMEDは個々の計算に限る。
  what_we_did_not_verify: |-
    論文のモデルや量子化器の学習、SPAによるモデル更新、表示ログの偏り、無効なSIDの処理、本番A/Bテスト、GPUでの処理量は検証していない。無関係な動画が同じ集計枠に入っても、その影響が固定したハッシュで必ず相殺することも示していない。性能、規模を増したときの挙動、本番に適用できるかは未検証（NOT TESTED）。
  implementation: |-
    リポジトリのルートで `uv run papers/ogr-once-generated-ranked/run.py` を実行すると、同じフォルダーの `results.json` を更新する。計算にはPythonの標準ライブラリだけを使う。ページにある選択欄は計算済みの結果を切り替える。操作するたびにモデルを動かしているわけではない。

    [実行コード](../downloads/ogr-once-generated-ranked/run.py)・[全結果](../downloads/ogr-once-generated-ranked/results.json)・[README](../downloads/ogr-once-generated-ranked/README.md)・[手法](../downloads/ogr-once-generated-ranked/method.md)・[lab.yaml](../downloads/ogr-once-generated-ranked/lab.yaml)・[対応表](../downloads/ogr-once-generated-ranked/mapping.md)を保存できる。

    一次PDFとarXivの書誌では、取得可能な公式コードの案内を確認できなかった。公式コードの取得と実行は未検証（NOT TESTED）で、Labのコードは説明のために別に実装したもの。
  mapping: mapping.md
teaching_figures:
- id: ogr-equations
  kind: equations
  title: 動画の表現と報酬を計算する式
  after: method
  caption: 動画の表現を作る式と、モデルを調整する式を示す。
  rationale: 視聴履歴の情報と報酬が、どの条件で計算に入るかを示す。
  locator: 式5–7、15–18
  steps:
  - name: 局所共起
    formula: Cᵢ[h(j)] += σ(j)/|p−q|
    explanation: 同じハッシュで、近くに現れた同じ動画を同じ枠に入れる。無関係な動画が衝突しても平均で打ち消し合うのは、符号を変えた場合の期待値の話。
  - name: 協調の信頼度
    formula: αᵢ = 0.35 log(1+Uᵢ)/(log(1+Uᵢ)+0.5)
    explanation: 集計に寄与した利用者が0人なら、共起の重みαは0。
  - name: 重み付き連結
    formula: eᵤₙᵢ = [√(1−α)eₛₑₘ ; √α e꜀ₒₗ]
    explanation: 動画の内容と共起を表すベクトルを別々に正規化し、重みを掛けてつなぐ。元の長さがどちらも1なら、連結した後も長さは1。
  - name: 報酬の校正
    formula: Δ = δpri + κ δaux
    explanation: 主報酬と補助報酬の符号が同じときだけ、κ=min(|δpri|,|δaux|)/max(|δpri|,|δaux|,ε)を使う。それ以外はκ=0。
  - name: 保守的な更新
    formula: LSPA = Lclip + 0.05 KL(q₀ || qθ) + 0.1 Lsup
    explanation: KLは、同じ候補の組に対する現行モデルと参照モデルの分布を比べる。全動画を対象にした分布は比べていない。
  source: https://arxiv.org/pdf/2608.17613v1
