  scope: 一次PDFの手法、実験、関連図表と付録を照合。著者報告と人工計算を区別し、未公開の設定を補わない。
core_idea:
  author_claim: |-
    著者は、動画を表すコードを作り、表示位置の関係を考えて並びを計画し、動画の組全体への反応をもとにモデルを調整する。この手順で、候補を集めてから別のモデルで並べ直さなくても、順序付きの動画の組を作れると述べている。
  research_bot_interpretation: |-
    ある位置のコードがすべて確定するまで待つ代わりに、その位置の計画を表す途中の値を次の位置に渡す。動画の内容と履歴を使う効果、待ち時間の短縮、報酬の調整は別々に確かめる必要がある。
sections:
  overview: |-
    Kuaishouなどの研究チームは、短い動画を1本ずつ採点して並べる代わりに、画面に出す動画の組とその順番を一緒に作る方法を提案しました。OGRは動画の内容に加え、視聴履歴の近い位置にどんな動画が現れやすいかを使って動画IDを作ります。モデルは表示位置どうしの関係を考えてから各位置の動画IDを生成し、動画の組全体に対する反応をもとに学習します。

    Kuaishouの本番トラフィックの3%を使った1週間のA/Bテストでは、既存方式より有効視聴が1.120%増えたと著者は報告しています。また、論文の約2.2倍という値は、前の計算結果を待つ必要がある処理の長さを理論上で比べたものです。本番の応答時間が約2.2倍速くなったという測定結果ではありません。
  problem: |-
    候補を先に集める方式では、後段の採点や並べ直しで候補にない動画を選ぶことはできない。次に見る動画のコードを生成し、上位候補を順に並べるだけでも、同じ画面で動画どうしが与える影響までは学べない。OGRは、どの動画をどこに表示するかを一つのモデルで決める。

    [GenPage](genpage-netflix-homepage.html)はホーム画面に複数の行を並べ、[UniRec](unirec-chain-of-attribute.html)はECで候補の取得と採点を統合する。OGRが作るのは短い動画を並べた一組で、ページ全体を作る方式や、候補だけを生成する[Gryphon](gryphon-v2-cascade.html)とは対象が異なる。これらの手法をカタログ、表示数、応答時間の制約をそろえて比べた実験ではない。
  method: method.md
  why_it_might_work: |-
    履歴が少ない動画は、少数の同時視聴だけで特徴が偏らないように、共起の情報の重みを下げる。位置の計画とコードの生成を重ねれば、先の位置を待つ時間を短くできる。報酬の調整では、多様性などの補助指標が視聴などの主指標の向きを逆転させない。ただし、計画がよい動画を選ぶことと、表示していない動画の組にも評価が通用することは、これらの設計だけでは分からない。
  evidence: '### オフラインの推薦精度


    表1では、上位5件の順序を評価するNDCG@5をデータごとに比較した。商用データ（Industrial）ではOGRが0.0633、比較手法で最も高いSeq2Slateが0.0427で、約48.2%増えた。公開データ（KuaiRec）ではOGRが0.1303、PRMが0.1024で、約27.2%増えた。どちらもOneRecとの差ではない。著者は時系列の末尾5件を除いて学習し、表示数を5件とし、乱数の初期値2025〜2029で5回測った平均を報告した。観測できる表示は元の推薦方式に依存し、オフラインの順位指標と本番の有効視聴は別の指標である。


    表3では、動画の属性を単純に足した場合、属性を組み合わせないRQ-KMeansよりNDCG@5が下がった。表4では、位置を計画する部分を外して、その分のパラメーターをエンコーダーとデコーダーに振り分けても、指標が下がった。全ての構成の組み合わせを試した実験ではない。


    ### 本番の視聴とベンチマークの処理量


    著者はKuaishouの本番トラフィックの3%を使い、既存方式と1週間比較した。論文の報告では、有効視聴が1.120%、コメントが2.954%、いいねが0.505%、共有が1.255%増えた（Online A/B Testing、表10）。信頼区間、統計検定、指標の絶対値、無効なSIDの割合、本番の応答時間は確認できない。この3%は全利用者への展開を意味しない。


    図3では、OGRが単位時間に処理した組数はTIGER-Beamの2.43倍、OneRec-Beamの2.49倍だった。これとは別に、5位置と4段のコードで、先行結果を待つ処理の段数を理論上20段と9段で比べると、比は約2.22になる。この比は、単位時間の処理量や全演算量の実測値ではない。比較したTop-5方式は、次に見る動画を一つ選ぶときの上位候補を返す。位置どうしの関係を考えて動画の組を作るOGRとは、出力の意味が異なる。


    <figure class="teaching batch18"><h3>構成要素を外したときの推薦精度</h3><div class="matrix-scroll" tabindex="0"
    role="region" aria-label="比較表"><table><thead><tr><th>条件</th><th>評価データ</th><th>NDCG@5</th></tr></thead><tbody><tr><td>base
    RQ-KMeans</td><td>KuaiRec</td><td>0.1162</td></tr><tr><td>属性を単純加算</td><td>KuaiRec</td><td>0.1096</td></tr><tr><td>cross-attention
    + gate</td><td>KuaiRec</td><td>0.1198</td></tr><tr><td>CCE concat、CAWなし</td><td>KuaiRec</td><td>0.1298</td></tr><tr><td>TUSID
    full</td><td>KuaiRec</td><td>0.1303</td></tr><tr><td>GL2P + SPA full</td><td>Industrial</td><td>0.0633</td></tr><tr><td>plannerなし</td><td>Industrial</td><td>0.0359</td></tr><tr><td>SPAなし</td><td>Industrial</td><td>0.0419</td></tr><tr><td>主報酬なし</td><td>Industrial</td><td>0.0467</td></tr><tr><td>補助報酬なし</td><td>Industrial</td><td>0.0554</td></tr><tr><td>保守的正則化なし</td><td>Industrial</td><td>0.0312</td></tr></tbody></table></div><figcaption>表3・4。評価データが異なる行どうしの差は比べない。</figcaption></figure>


    [一次資料：版を固定したPDF](https://arxiv.org/pdf/2608.17613v1)。図・表・式と実装の対応は末尾のmappingを参照。'
  executable_understanding: '最初の図では、表示する動画の数Kとコードの段数Dを変えられる。動画のコードを順番に作る場合と、位置を計画しながら別の位置のコードを並行して作る場合で、最後のコードがそろうまでに何段かかるかを比べる。各処理の時間が等しく、同時に処理できる数に上限がないと仮定している。たとえばD=4でも、K=1では計画が1段加わるため、むしろ終了が遅くなる。


    別の計算では、3人分の人工履歴から動画の共起を数え、近くに別の視聴記録がない動画では、共起情報の重みが0になることを確かめる。2つ目の図では、同じ標準化済みの主報酬と補助報酬に単純な足し算と式15を適用し、主報酬の符号が逆転するかどうかを比べる。


