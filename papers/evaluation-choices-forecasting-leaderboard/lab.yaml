question: 同じ予測を使っても、どの買い手を一緒に集計するかで評価は変わるか
summary: サービス市場の取引額を予測した論文では、共通の19手法のうち、WAPEの中央値で並べると、本番の基準手法は市場全体で2位、買い手を規模で625組に分けると16位でした。Labの4社の例では、予測を固定したまま、誤差が打ち消し合う組とそうでない組を比べます。
