question: 同じ予測でも、買い手の組分けによって最も誤差が小さい手法は変わるか
summary: 市場全体では、買い手ごとの過大予測と過小予測が打ち消し合う。サービス市場の取引額を用いた論文では、共通の19手法を比べると、買い手を1組から625組に分けると、基準手法のWAPE順位の中央値が2位から16位に下がった。
