- kind: equations
  id: pooling
  title: 誤差を足す順番と、改善できる幅の測り方
  steps:
  - name: 市場全体での誤差
    formula: '|Σ eᵢ|'
    explanation: 買い手ごとの誤差を足してから、合計の絶対値を取る。
  - name: 買い手ごとの誤差
    formula: Σ |eᵢ|
    explanation: 先に一人ずつ絶対値を取るので、過大予測と過小予測は打ち消し合わない。
  - name: 改善幅の回収率
    formula: G = (E_base − E_served) / (E_base − E_oracle)
    explanation: 過去の結果で選ぶ手順の改善幅を、評価後に最良と分かる手法（oracle）までの改善幅で割る。
  locator: Figure 1; Table 6
  after: method
  source: https://arxiv.org/pdf/2609.27867
  rationale: 買い手をまとめる評価と、まとめない評価では、絶対値を取る順番が違う。
  caption: 原論文の図1と表6に沿った説明。式を使って、打ち消しと手法選択の回収率を分けて読む。
