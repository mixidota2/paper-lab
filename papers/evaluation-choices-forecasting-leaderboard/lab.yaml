core_idea:
  author_claim: 著者は、予測そのものに加え、どの単位で誤差を数えるか、どうまとめるか、何を指標にするかによって順位が決まると報告した。比べる手法と予測を始める時点をそろえても、順位の逆転は残った。
  research_bot_interpretation: Labの解釈：時系列基盤モデル（TSFM）と勾配ブースティングで作る決定木モデル（GBDT）を比べる前に、予測を何の判断に使うかを決める。全体の売上計画と、店舗・商品ごとの補充では、誤差を数える単位が違う。
sections:
  overview: ある買い手の取引額を多く、別の買い手を同じだけ少なく予測すれば、合計だけは合う。論文の本番基準手法は市場全体で19手法中2位、買い手別で25手法中23位だった（表1）。この比較では指標、予測を始める時点、手法数も違う。集計の影響を読むには、共通条件の表3も見る。主な対象はサービス市場の取引総額（GTV）で、店舗小売の売上ではない。小売の公開データM5でも再評価している。
  problem: 市場全体の合計は滑らかでも、買い手別では取引がない月が挟まり、予測の過不足が目立つ。本番の基準は前年同月の値を直近の伸びに合わせて調整する手法（seasonal naive with drift）。著者はN-HiTS、Chronos T5-Largeなどとも比較した。
  why_it_might_work: Labの解釈：絶対値を取る前に正負の誤差を足すと、誤差どうしが打ち消し合う。人工例で |Σeᵢ| ≤ Σ|eᵢ| を確認する。一方、区間を予測するときは幅と、実績がその区間に入る割合（被覆率）も見るため、1つの値を出す点予測の順位からは決まらない。
  evidence: '一次資料である[原論文の表1・3・5〜7](https://arxiv.org/pdf/2609.27867)で著者が報告した値。


    | 何を比べたか | 結果 | 読むときの注意 |

    | --- | --- | --- |

    | 市場全体と買い手別の基準手法の順位 | 2/19位 → 23/25位 | 表1では指標・評価起点・手法数も変わる |

    | 過去の結果を使う手法選択で、改善できる幅をどれだけ埋めたか | 54.6% | RMSSEで評価 |

    | 同じ考え方を小売データM5で評価した回収率 | 64.7% | 店舗×商品で再評価 |

    | 点予測と区間予測の順位相関 | 0.02 | 間欠需要、25手法の比較 |


    主な買い手別の評価は1,887系列・67か月、8起点・11,516ブロック。表3では共通の19手法を使い、事前データに基づいて5,779買い手を規模順に組み分けた。全体を1組として数えると基準手法は2位、625組に分けると16位（WAPE順位の中央値）。表1だけを読んで集計だけが原因だとは判断しない。'
  method: method.md
  executable_understanding: '`uv run papers/evaluation-choices-forecasting-leaderboard/run.py`。Pythonの標準ライブラリだけで実行でき、同じ場所の `results.json` を更新する。


    実績と予測値を固定し、`score()` に渡す組分けだけを変える。組ごとの誤差を符号付きで合計してから絶対値を取り、全組の絶対値を足し、全買い手の実績合計で割る。この割合をWAPEと呼ぶ。学習やモデル選択は行わない。論文のRMSSE順位を再現する計算でもない。'
  results: 全体を1組にするとAが0%、Bが10%。買い手4人を個別に測るとAが40%、Bが10%になり、誤差の小さい予測が入れ替わった。2組の場合も、過大予測と過小予測を同じ組に入れたときはA、同じ向きの誤差をまとめたときはBが勝つ。何組かに加えて、誰を同じ組にしたかも記録する必要がある。
  what_we_verified: 確認済み（CONFIRMED）：4人の人工例で、同じ値を予測したまま組分けだけを変えるとWAPEの順位が逆転する。仕組みの確認はこの範囲に限る（PARTIAL）。著者の順位や選択方法の性能は追試していない。
  what_we_did_not_verify: 性能、規模拡大、本番への適用は未検証（NOT TESTED）。Field Nationの非公開データ、M5での全手法の再評価、区間予測、統計検定は実行していない。店舗の補充費用を最も下げる手法も決めていない。
  implementation: '`score()` は、表3・図1の評価単位を説明する人工例に使う。`gap_closed_from_rounded_table6` は、表6の丸め済みの値から改善幅の回収率だけを再計算する。'
  mapping: mapping.md
