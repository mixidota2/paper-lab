core_idea:
  author_claim: データや予測値に加え、評価単位・誤差の集約・指標の選択が順位を決める。同じ手法集合と評価起点に絞った比較でも順位の逆転が残る。
  research_bot_interpretation: TSFMとGBDTの比較を始める前に、誰の誤差を一単位として数えるかを固定したい。全体の売上計画に適した評価と、店舗・商品ごとの補充判断に適した評価は一致するとは限らない。
sections:
  overview: 市場全体では2/19位だった本番の基準手法が、買い手別では23/25位になる。対象はサービス市場の取引額GTVで、店舗小売の売上ではない。M5での再評価もあり、手法比較の設計に関わる論文。
  problem: 大きな集計では正負の予測誤差が相殺する。個別系列ではその誤差が残り、間欠的な需要も増える。本番の基準は前年同月を直近の勢いで調整するseasonal
    naive with driftで、比較にはN-HiTSやChronos T5-Largeなどを含む。
  why_it_might_work: 解釈：絶対値を取る前に誤差を足すと相殺が起きるため、集計後の誤差が小さくても個別の予測は良いとは限らない。|Σeᵢ| ≤
    Σ|eᵢ|という性質を最小実験で確認する。区間予測には幅と被覆率が関わり、点予測の順位から一意には決まらない。
  evidence: '一次資料[Tables 1・3・5–7](https://arxiv.org/pdf/2609.27867) の著者報告。


    | 比較 | 値 | 注意 |

    | --- | --- | --- |

    | 市場集計 → 買い手別 | 2/19位 → 23/25位 | Table 1は指標・起点・手法数も異なる |

    | 選択ルールの改善余地回収 | 54.6% | 過去の起点だけで選ぶ、RMSSE基準 |

    | M5の同様の回収率 | 64.7% | 店舗×商品で再評価 |

    | 点予測と区間予測の順位相関 | 0.02 | 間欠需要、25手法間の相関 |


    主要な買い手別評価は1,887系列・67か月、8起点・11,516ブロック。Table 3では共通の19手法を使い、事前データでサイズ順に5,779買い手を分組する。1組から625組への分割で基準手法の中央値WAPE順位は2→16位になる。Table
    1だけから集計単独の効果と断定せず、共通条件の再評価も読む。'
  method: method.md
  executable_understanding: '`uv run papers/evaluation-choices-forecasting-leaderboard/run.py`。標準ライブラリだけで実行でき、同じフォルダーのresults.jsonを更新する。


    同一の実績と予測配列を固定し、score()へ渡すグループだけを変える。モデルの再学習や候補選択は行わない。ここで使う指標はWAPEで、原論文のRMSSE順位そのものは再現しない。'
  results: 全体1系列ではA 0% / B 10%、個別4系列ではA 40% / B 10%となり、勝者が逆転する。同じ2組でも構成によって逆転するため、集計数だけでは評価条件を記述しきれない。
  what_we_verified: CONFIRMED：固定した予測の集計だけで人工例の勝者が入れ替わる。MechanismはPARTIAL。論文表の順位や選択ルールの性能は追試していない。
  what_we_did_not_verify: Performance / Scaling / Production applicabilityはNOT TESTED。Field
    Nationの非公開パネル、M5の全手法再評価、区間予測、統計検定は実行していない。店舗の補充費用を最小化する手法も決めていない。
  implementation: score() → Table 3 / Figure 1の評価粒度を説明する人工例。gap_closed_from_rounded_table6
    → Table 6の丸め済み値による算術確認。
