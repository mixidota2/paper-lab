- kind: equations
  id: pooling
  title: 誤差を足す順番と改善幅の回収率
  steps:
  - name: 市場全体での誤差
    formula: '|Σ eᵢ|'
    explanation: 買い手ごとに予測値から実績を引きます。市場全体では、その差を足してから絶対値を取ります。
  - name: 買い手ごとの誤差
    formula: Σ |eᵢ|
    explanation: 先に買い手ごとの絶対値を取ります。そのため、過大予測と過小予測は打ち消し合いません。
  - name: 改善幅の回収率
    formula: G = (E_base − E_served) / (E_base − E_oracle)
    explanation: 過去の結果で手法を選んだときの改善幅を、評価後に選んだ最良の単独手法（oracle）までの改善幅で割ります。
  locator: Figure 1; Table 6
  after: method
  source: https://arxiv.org/pdf/2609.27867
  rationale: 誤差が打ち消し合う計算と、基準からどれだけ改善したかを測る計算を区別します。
  caption: 上の2式は図1に関わる誤差の数え方です。最後の式は表6の手法選択を別に評価します。
