teaching_figures:
- kind: logic
  id: visibility
  title: 著者らは先に警告を出し、実績が分かってから評価した
  after: method
  locator: 実験設定・実データ評価
  rationale: 警告を判断する段階と、実績を使って警告の意味を確かめる段階を分けます。
  caption: 言語モデルが警告する時点では、将来の実績は渡しません。Labの人工計算は著者の言語モデルを動かすものではありません。
  rows:
  - label: 警告前に渡す情報
    nodes:
    - title: グラフ
      text: 著者らは販売の履歴と、別のモデルが出した予測を一つの図にします。
    - title: 販促日の文章
      text: 販促を扱う人工実験だけで、著者らは予定日を文章で伝えます。
  - label: 警告の判定
    nodes:
    - title: 妥当か不自然か
      text: 言語モデルは、説明と予測が食い違っていないかを読み、点検する予測を選びます。
  - label: 実績が届いてから比較
    nodes:
    - title: 警告あり・なしの比較
      text: 著者らは実績から予測の誤差を計算し、二つの群で比較します。
  source: https://arxiv.org/html/2512.12059v1
- kind: matrix
  id: perturbations
  title: 人工の予測線に4種類の変化を加え、見つけやすさを比べる
  after: method
  locator: Synthetic experiments・付録
  rationale: 同じ判定方法でも、予測のどこを変えたかで見つけやすさは異なります。
  caption: 左は人工データに加えた変更、右は点検するときの着眼点です。外生販促の4条件（Exogenous Feature Injection）は別実験です。販促日の山に基づく判定は、この表のSpikeのラベル作成とは区別する必要があります。
  columns:
  - 著者が加えた変更
  - 点検するときの着眼点
  rows:
  - label: 上下のずれ
    cells:
    - 予測線全体を上下にずらします。
    - 全体の水準が急に変わる理由が、分かっている情報にあるかを見ます。
  - label: 傾きの変更
    cells:
    - 予測線の傾きを変えます。
    - 過去の販売の傾向から、新しい予測の向きを説明できるかを見ます。
  - label: 時間の伸縮
    cells:
    - 時間の間隔を変え、波を伸縮させます。
    - 山と谷が来る間隔が、過去の周期と合っているかを見ます。
  - label: 急な上振れ・下振れ
    cells:
    - 一部に人工的な上振れや下振れを加えます。
    - 人工的に加えた局所的な突出が不自然かを判定します。実際の点検では、急な変化を説明する履歴や補足情報があるかを見ます。
  corner: 条件
  source: https://arxiv.org/html/2512.12059v1
- kind: equations
  id: critic-metric
  title: 不適切な予測に対するF1は、誤警告でも見逃しでも下がる
  after: method
  locator: Synthetic experiments
  rationale: 警告を増やすと見逃しが減る場合がありますが、正しい予測への警告は増えることがあります。
  caption: この式は不適切な予測だけを対象にします。論文の加重F1はクラスごとのF1を件数で重み付けした平均です。TPは正しい警告、FPは誤警告、FNは見逃しです。
  steps:
  - name: 不適切な予測を陽性とするF1
    formula: F1 = 2TP / (2TP + FP + FN)
    explanation: 著者らの人工実験は2件に1件、Labの例では10件中6件を不適切としました。現場で不適切な予測がどれだけあるかによって、警告の正しさや点検件数は変わります。
  source: https://arxiv.org/html/2512.12059v1
