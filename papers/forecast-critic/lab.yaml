summary: 著者は、過去の実績と予測のグラフ、販促の説明を大規模言語モデルに見せ、不自然な予測を見つける方法を提案している。目的は、担当者が点検すべき予測を見つけることであり、予測値を自動で修正することではない。
figures: []
core_idea:
  author_claim: '著者はトレンド、水準、周期、急増を人工的に崩した予測で批評能力を調べる。販促の説明を加える実験と、M5上のChronos予測を点検する実験も行う。言語・画像の文脈から不自然な予測を拾う監視手段として提案する。


    [一次資料：合成実験 / 外生情報の実験 / 実データの実験](https://arxiv.org/html/2512.12059v1)'
  research_bot_interpretation: これは予測精度を直接改善する学習法ではない。警告した後に誰が何を確認し、誤警告をいくつまで許すかが運用を決める。図の描き方や説明文の質に依存するなら、監視器自身も評価対象になる。
sections:
  overview: 著者は、過去の実績と予測のグラフ、販促の説明を大規模言語モデルに見せ、不自然な予測を見つける方法を提案している。目的は、担当者が点検すべき予測を見つけることであり、予測値を自動で修正することではない。
  problem: '平均の誤差が良くても、個別には周期がずれた予測や、不自然に平らな予測が混じる。未来の実績がまだない時点では、通常の誤差指標でその失敗を測れない。


    Forecast Criticは過去と予測の図、必要なら販促に関する文章を見せ、もっともらしい予測かをLLMへ尋ねる。将来の真値を先に見て良否を判定する使い方ではない。'
  why_it_might_work: 数値の誤差だけでは説明しにくい「過去の販促で売上増があり、今回も販促予定があるのに予測に山がない」という矛盾を、文章と図から拾える可能性がある。過去の販促で売上増がなければ、予定があっても山のない予測は原論文の合成条件では妥当とする。一方、新しい現象が過去と違って見えるだけで誤警告することもある。
  evidence: 'Abstractと合成実験では最良モデルのF1が0.88、人が0.97と報告される。Appendix Aのweighted F1はクラス別F1を件数で重み付けした値で、陽性単独F1とは異なる。実データの実験では、怪しいとされた予測群のsCRPSが少なくとも10%高い。これは群の誤差の違いで、監視を導入すれば誤差が10%改善するという結果ではない。


    [一次資料：合成実験 / 外生情報の実験 / 実データの実験](https://arxiv.org/html/2512.12059v1)'
  executable_understanding: 'このLabでは、説明用に作った10件のスコアと正解ラベルを使う。うち6件を『不適切な予測』と設定し、警告を出す基準値を5にしたときの保存済み結果を掲載している。ページに閾値操作UIはない。コードは閾値0〜10の結果を生成する。警告0件の適合率は未定義で、JSONではnullとする。LLMを呼ばない教材である。


    実行：`uv run papers/forecast-critic/run.py`。合成データの作り方と比較条件はコード内に記載し、図の全条件の結果を `results.json` へ保存する。'
  results: 初期条件の計算値と全条件の結果を示す。合成データ上の小実験であり、論文モデルの性能を測った値ではない。
  what_we_verified: '**メカニズム：PARTIAL（部分的）**。このLabで確認したのは、ここに示した仮定に基づく計算結果と、条件を変えたときの結果の変化です。原論文の仕組み全体は検証していません。


    このLabでは、説明用に作った10件のスコアと正解ラベルを使う。うち6件を『不適切な予測』と設定し、警告を出す基準値を5にしたときの保存済み結果を掲載している。ページに閾値操作UIはない。コードは閾値0〜10の結果を生成する。警告0件の適合率は未定義で、JSONではnullとする。LLMを呼ばない教材である。'
  what_we_did_not_verify: 人工的な破損と自然発生する失敗の分布は違う。実務では低い問題発生率の下で誤警告が増えないか、担当者の作業時間が減るか、警告後の修正で費用が下がるかを確認したい。LLMによる図の理解は今回検証していない。
  implementation: '標準ライブラリだけで実行できる。入口は各Labの `run.py`、計算本体は `papers/_toy_common.py` にある。関数は論文IDごとに独立し、ブラウザー用の全条件と初期条件の表を同時に出力する。


    意図して省いたもの：画像理解、LLM、販促の文章、Chronos、M5。'
  mapping: mapping.md
  method: method.md
question: 未来の実績を待たずに、怪しい予測を見つけられるか
