teaching_figures:
- kind: logic
  id: visibility
  title: 判定時に見える情報と、後から評価する情報
  after: method
  locator: 実験設定・実データ評価
  rationale: 情報の境界が方法の理解に直結する。
  caption: LLMへ未来の実績を見せる設計ではない。小実験の閾値判定はLLMの代替実装ではない。
  rows:
  - label: 判定時に渡す
    nodes:
    - title: 画像
      text: 過去の実績線と、今作った予測線。
    - title: テキスト
      text: 予測の見方と、利用可能な販促などの文脈。
  - label: Forecast Criticの判定
    nodes:
    - title: 妥当 / 不自然
      text: 予測の形と文脈が合っているかを判断。
  - label: 実績が届いた後に別途評価
    nodes:
    - title: 未来の正解
      text: 誤差を計算し、flagあり・なしの群を比較する。
  source: https://arxiv.org/html/2512.12059
- kind: matrix
  id: perturbations
  title: 不自然さは1種類ではない
  after: method
  locator: Synthetic experiments・付録
  rationale: 単一スライダーでなく失敗の種類ごとに考える。
  caption: 人工的な変更の整理。右列はLabの解釈で、論文の性能数値ではない。
  columns:
  - 予測線への変更
  - 判定で確認したい点
  rows:
  - label: Translation
    cells:
    - 全体を上または下へずらす
    - 水準変化を説明する文脈があるか
  - label: Trend
    cells:
    - 傾きの大きさを変える
    - 過去から見た傾向が続くか
  - label: Compression
    cells:
    - 周期を圧縮する
    - 山と谷の間隔が不自然か
  - label: Spike
    cells:
    - 局所的な突出を加える
    - 販促予定と時期が合うか
  corner: 条件
  source: https://arxiv.org/html/2512.12059
- kind: equations
  id: critic-metric
  title: 検出能力は適合率と再現率を両方見る
  after: method
  locator: Synthetic experiments
  rationale: 誤検出と見逃しを区別する。
  caption: 標準的なF1の定義を補足。TPは不適切な予測の正しい検出、FPは誤警報、FNは見逃し。
  steps:
  - name: F1
    formula: F1 = 2TP / (2TP + FP + FN)
    explanation: 人工データの不適切率は50%。現場の率が異なると、同じ検出器でも適合率やレビュー量は変わる。
  source: https://arxiv.org/html/2512.12059
