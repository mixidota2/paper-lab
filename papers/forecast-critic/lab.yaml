teaching_figures:
- kind: logic
  id: visibility
  title: 予測を点検するときと、誤差を測るときでは、見える情報が違う
  after: method
  locator: 実験設定・実データ評価
  rationale: 未来の実績を渡す時点を、警告を出す時点から切り離す。
  caption: 言語モデルに未来の実績は渡さない。Labの基準値による判定は言語モデルの代替実装ではない。
  rows:
  - label: 判定時に渡す
    nodes:
    - title: 画像
      text: 過去の実績と今回の予測を線で描く。
    - title: テキスト
      text: 販促予定と、過去の販促で売上が増えたかを文章で添える。
  - label: Forecast Criticの判定
    nodes:
    - title: 妥当 / 不自然
      text: 線の形と説明に食い違いがないかを見る。
  - label: 実績が届いた後に別途評価
    nodes:
    - title: 未来の正解
      text: 実績が得られた後に誤差を求め、警告（flag）の有無で比べる。
  source: https://arxiv.org/html/2512.12059v1
- kind: matrix
  id: perturbations
  title: 傾き・水準・間隔・突出を、一つずつ変えて比べる
  after: method
  locator: Synthetic experiments・付録
  rationale: 変更の種類を分けると、何を不自然とみなすか説明しやすい。
  caption: 人工的に加えた変更（Synthetic perturbations）の例。右列はLabの読み方で、論文の性能値ではない。外生販促の4条件（Exogenous Feature Injection）は別実験で、この表のSpikeのラベル作成とは区別する。
  columns:
  - 予測線への変更
  - 判定で確認したい点
  rows:
  - label: Translation
    cells:
    - 全体を上または下へずらす
    - 上下のずれを説明する出来事があるか
  - label: Trend
    cells:
    - 傾きの大きさを変える
    - 変えた傾きが過去の動きから説明できるか
  - label: Compression
    cells:
    - 周期を圧縮する
    - 山と谷が現れる間隔は過去の周期と合うか
  - label: Spike
    cells:
    - 局所的な突出を加える
    - 人工的に加えた局所的な突出が不自然か
  corner: 条件
  source: https://arxiv.org/html/2512.12059v1
- kind: equations
  id: critic-metric
  title: F1は、誤警告と見逃しの両方で下がる
  after: method
  locator: Synthetic experiments
  rationale: 警告を増やすだけでは、よい判定とは限らない。
  caption: 不適切な予測を陽性としたF1の式。Appendix Aのweighted F1（クラス別F1の件数加重平均）とは異なる。TPは正しく出した警告、FPは誤警告、FNは見逃し。
  steps:
  - name: 陽性単独F1
    formula: F1 = 2TP / (2TP + FP + FN)
    explanation: 論文の選別済み合成評価では不適切な予測が50%、Labの手作りデータでは6/10。同じ判定器でも、現場の不適切率が違えば、適合率と人が点検する件数は変わる。
  source: https://arxiv.org/html/2512.12059v1
