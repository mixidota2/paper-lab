summary: Bhanらは、過去の販売数と将来の予測をグラフで言語モデルに見せ、不自然な予測を点検に回す方法を調べました。警告は予測を点検する順番の判断に使い、予測値そのものは変えません。
figures: []
core_idea:
  author_claim: 著者らは、予測線を意図的に崩した人工例、販促日を文章で伝える人工例、公開データM5でChronosが出した予測の3つを使い、言語モデルで点検候補を選べるか調べました。
  research_bot_interpretation: 実務で使うなら、警告した予測がどれだけ正しく選ばれていたかと、警告しなかった予測に大きな誤りがどれだけ残ったかの両方を調べます。グラフや指示の書き方を変えたときに結果が保たれるかも別の検証が必要です。
sections:
  overview: |-
    Bhanらは、需要予測を出したあと、将来の実績が分かる前に、点検が必要そうな予測を見つける方法を調べました。著者らは、過去の実績と予測を描いたグラフを言語モデルに見せ、予測の形が不自然かを答えさせました。販促の人工実験では、予定日も文章で伝えました。

    明らかな誤りを4種類混ぜた人工実験では、Claude 3.7 Sonnetの加重F1は0.88で、同じ図を読んだ専門の評価者1人は0.97でした。公開データM5の1,000系列では、Claude 3.7 Sonnetが警告した予測の誤差の中央値は0.3417、警告しなかった予測では0.2624でした。誤差は、予測した確率分布と後から分かった実績を比べる指標（sCRPS）で測りました。どのモデルでも、警告した群の中央値は警告しなかった群より少なくとも10%高くなりました。警告しなかった予測にも誤差が大きいものがあり、著者らは警告後に予測を修正した効果までは測っていません。
  problem: 需要予測の平均誤差が小さくても、個別には、急に上がる位置がずれたり、過去の傾向と違う向きに動いたりします。将来の実績が出る前には、その予測が何個外れたかは分かりません。著者らは、それでもいま分かっている販売の履歴や販促情報から、先に見直す予測を選べるかを調べました。
  why_it_might_work: 過去の販促で売上増があり、今回も同じような販促があるなら、予測に増加がないことは点検の手がかりです。一方、過去の販促で売上増がなければ、今回の予測だけに大きな山が出る理由を確かめます。過去にない動きがすべて予測ミスというわけではなく、一見自然な線でも、後から実績と比べると大きく外れることがあります。
  evidence: |-
    [一次資料：人工の予測・販促・M5の実験](https://arxiv.org/html/2512.12059v1)。著者らが変更の種類を混ぜた人工実験では、Claude 3.7 Sonnetの加重F1（weighted F1）は0.88、同じ図を読んだ専門の評価者1人は0.97でした。「妥当」と「不自然」のクラスごとにF1を計算し、各クラスの件数で重みづけして平均した値です。不自然な予測だけのF1ではありません。著者らはSMAPEが大きい例を選び、評価条件の半分を不自然な予測にしました。

    販促の人工実験で最良だったClaude 3.7 SonnetはF1が0.836でした。要旨は四捨五入して0.84と報告しています。過去には販促で売上が増えたのに、今回の予測では増えていない条件を、比較したモデルは最も見落としやすくなりました。

    M5では、無作為に抽出した商品レベルの1,000系列で、過去120日と、Chronosで予測した28日間の分布を見せています。警告率はモデルによって約2%から約40%でした。Claude 3.7 Sonnetの警告率は8.9%です。同モデルが警告した予測では、実績が届いた後に測ったsCRPSの中央値は0.3417、警告しなかった群は0.2624で、差は警告しなかった群を基準に30.2%でした。論文の全モデルで、警告した予測のsCRPSの中央値は、警告しなかった予測より少なくとも10%高くなりました。監視を導入すれば誤差が10%改善するという結果ではないため、警告後に予測を直した効果とは区別します。
  executable_understanding: |-
    Labは架空の10件を用意し、6件を不適切と決めました（陽性6/10）。

    警告を出す基準値を0から10まで変え、正しい警告、誤警告、見逃しを数えます。記事の表は、警告を出す閾値5で保存した結果です。記事を開いても、基準値を変更する操作はありません。

    適合率は、出した警告のうち正しかった割合です。再現率は不適切な予測の総数のうち検出できた割合です。警告が0件の場合は適合率の分母が0になり、値を求められません。JSONには `null` と保存します。

    リポジトリのルートで `uv run papers/forecast-critic/run.py` を実行すると、全条件の結果を `results.json` に作り直せます。計算に言語モデルは使いません。
  results: Labの人工例では、基準値5で正しい警告が5件、誤警告が0件、見逃しが1件でした。適合率は5/5で100.0%、再現率は5/6で83.3333%です。著者らの言語モデルが出した結果ではありません。
  what_we_verified: Labは架空の10件を用意し、6件を不適切と決めました（陽性6/10）。 **仕組みの一部を確認（PARTIAL）。** 設定した基準が不適切な予測を何件拾うかを計算しました。確認したのは基準値と警告の集計の関係です。画像や文章から不自然な予測を見つける言語モデルは再現していません。
  what_we_did_not_verify: Labは、実店舗でどれだけ誤警告や見逃しが出るか、点検にかかる時間、警告を受けて予測を直した場合に費用が減るかを調べていません。人工的に崩した予測の誤りは、店舗で自然に起きる予測の誤りと同じとは限りません。Labは言語モデルの画像理解も検証していません。
  implementation: '`run.py` は共有の `papers/_toy_common.py` を呼び出します。Pythonの標準ライブラリだけで各基準値を計算し、最初に表示する表と全条件の結果を保存します。言語モデル、販促の文章、Chronos、M5は使いません。'
  mapping: mapping.md
  method: method.md
question: 将来の実績が分かる前に、人が点検すべき需要予測をどう見つけるか
