teaching_figures:
- kind: logic
  id: visibility
  title: 警告を出す段階では未来の実績を渡さず、実績が届いてから誤差を測る
  after: method
  locator: 実験設定・実データ評価
  rationale: モデルが予測を点検する段階と、著者が警告の結果を評価する段階を分ける。
  caption: 著者は言語モデルに未来の実績を渡さない。Labの人工例で基準値を使う計算は、言語モデルの再実装ではない。
  rows:
  - label: 判定時に渡す
    nodes:
    - title: 画像
      text: 著者は過去の実績と、別のモデルが作った予測をグラフに描く。
    - title: テキスト
      text: 販促実験では、著者は販促の日付などを文章で添える。
  - label: Forecast Criticの判定
    nodes:
    - title: 妥当 / 不自然
      text: モデルは予測線を読み、説明と食い違いがあれば点検に回す。
  - label: 実績が届いた後に別途評価
    nodes:
    - title: 後から届く実績
      text: 著者は実績が届いてから誤差を計算し、警告が出た群と出なかった群を比べる。
  source: https://arxiv.org/html/2512.12059v1
- kind: matrix
  id: perturbations
  title: 著者は予測線の位置、傾き、周期、一部の山を変えて判定を比べた
  after: method
  locator: Synthetic experiments・付録
  rationale: 変更の種類を分けると、どの違和感を見つけやすいかを比べられる。
  caption: 左列は著者が予測に加えた変更、右列はLabが点検するときに見る点である。論文の性能値を載せた表ではない。外生販促の4条件（Exogenous Feature Injection）は別実験で、販促日の山をどう判定するかを試す。この表のSpikeのラベル作成とは区別する。
  columns:
  - 予測線への変更
  - 判定で確認したい点
  rows:
  - label: Translation
    cells:
    - 著者は予測線全体を上か下へずらす。
    - 線全体がずれる理由を、説明にある出来事から読み取れるか。
  - label: Trend
    cells:
    - 著者は予測線の傾きを変える。
    - 予測の傾きは、過去の売れ方から説明できるか。
  - label: Compression
    cells:
    - 著者は山と谷が現れる間隔を狭める。
    - 予測の山と谷の間隔が、過去の周期と合っているか。
  - label: Spike
    cells:
    - 著者は予測線の一部だけに大きな山を足す。
    - 人工的に加えた局所的な突出が不自然かを判定する。運用で見るときは、過去や補足情報で同様の山を説明できるかを確かめる。
  corner: 条件
  source: https://arxiv.org/html/2512.12059v1
- kind: equations
  id: critic-metric
  title: F1は、誤警告と見逃しの両方で下がる
  after: method
  locator: Synthetic experiments
  rationale: 警告を増やせば見逃しは減りうるが、正しい予測を止めることもある。
  caption: 式は不適切な予測だけを対象としたF1である。付録Aの加重F1はクラス別のF1を件数で重み付けする。TPは正しく出した警告、FPは誤警告、FNは見逃しの件数である。
  steps:
  - name: 陽性単独F1
    formula: F1 = 2TP / (2TP + FP + FN)
    explanation: 論文の選んだ人工データでは50%、Labの人工例では6/10を不適切とした。同じ判定方法でも、現場に不適切な予測がどれだけ混じるかで、適合率と担当者が点検する件数は変わる。
  source: https://arxiv.org/html/2512.12059v1
