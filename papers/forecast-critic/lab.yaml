summary: |-
  著者は、未来の実績が届く前に、言語モデルが予測のグラフを見て、点検が必要な予測を選べるかを調べた。販促実験では、予定を文章で添えた。警告は人が見る予測を選ぶために使い、予測値は修正しない。
figures: []
core_idea:
  author_claim: |-
    著者は、画像と文章を読める言語モデルが不自然な予測を見つけられるかを調べた。予測線の形を崩した人工データ、販促の説明を添えた人工データ、M5でChronosが作った予測を使い、三つの実験で確かめた。

    [一次資料：人工データ・販促・M5の実験](https://arxiv.org/html/2512.12059v1)
  research_bot_interpretation: |-
    現場での使いやすさは、正しい予測にもいくつ警告が出るか、担当者が何件まで確認できるかで変わる。Labは、グラフの描き方や指示の文章が変わっても判定が同じかを別に確かめる必要があると考える。
sections:
  overview: |-
    著者は、実績がまだ観測されていない時点で、点検すべき予測を言語モデルが見つけられるかを調べました。モデルには過去の実績と予測をグラフで見せます。人工データでは、予測の傾きや周期を変えた例などを混ぜ、モデルと人が不自然な予測をどれだけ見つけられるかを比べました。誤警報と見逃しの両方を考慮する加重F1は、最良のモデルが0.88、人が0.97でした。

    小売の公開データM5でChronosの予測を調べると、モデルが警告した予測群では、警告しなかった群よりも予測分布の誤差が少なくとも10%大きくなりました。著者が比べたのは警告の有無による誤差の違いです。警告を出す仕組みで予測自体の誤差を減らせるかは測っていません。
  problem: |-
    予測誤差を全体で平均すると小さくても、個別には山と谷の位置がずれたり、不自然に平らになったりする。未来の実績が届く前には、実績との差を計算できない。そこで著者は、過去の売上や既知の販促予定と食い違う予測を、人が点検する候補にした。
  why_it_might_work: |-
    過去の販促で売上増があり、今回も販促を予定しているなら、予測に山がないことが点検する理由になる。逆に、過去の販促で売上増がなければ、著者は山がない方を妥当とした。一方、過去にない動きまで常に誤りとみなすと、正しい予測にも警告を出すおそれがある。
  evidence: |-
    [一次資料：人工データ・販促・M5の実験](https://arxiv.org/html/2512.12059v1)。著者は、人工的な変更を混ぜた条件で、Claude 3.7 Sonnetの加重F1が0.88、同じ図を見た専門家1人の加重F1が0.97だったと報告した。加重F1（weighted F1）は妥当・不適切の各クラスでF1を求め、件数で重み付けして平均する。不適切な予測だけのF1とは異なる。

    販促の人工例では、論文の要旨がF1を0.84と報告している。過去の販促では売上が増えたのに、今回の予測に山がない条件を、どのモデルも最も見落としやすかった。M5では、警告が出た群は、出なかった群よりsCRPSの中央値が少なくとも10%高かった。警告する割合はモデルによって約2%から約40%まで違った。これは二群の比較であり、監視を導入すれば誤差が10%改善するという結果ではない。
  executable_understanding: |-
    Labは人工の予測10件（うち不適切な予測6件）で、警告を出す基準を変えたときの誤警告と見逃しを数える。

    記事に載せた表は閾値5の保存結果で、記事内に閾値を変える操作はない。コードは0〜10を試す。適合率は警告のうち正しかった割合で、再現率は不適切な予測の総数のうち検出できた割合である。警告が0件なら、適合率は分母が0なので未定義（JSONではnull）になる。

    リポジトリのルートで `uv run papers/forecast-critic/run.py` を実行すると、コードは全条件の結果を `results.json` に保存する。LLMは呼ばない。
  results: |-
    閾値5の人工例では、Labは正しく出した警告5件、誤警告0件、見逃し1件を数えた。適合率は100.0%、再現率は83.3333%だった。著者の言語モデルを動かして得た値ではない。
  what_we_verified: |-
    Labは人工の予測10件（うち不適切な予測6件）で、警告を出す基準を変えたときの誤警告と見逃しを数える。

    **メカニズム：PARTIAL（部分確認）**。Labが確認したのは、基準を変えたときに警告の集計がどう変わるかまでである。論文の言語モデルが画像や文章を読んで予測を選ぶ仕組みは再現していない。
  what_we_did_not_verify: |-
    論文が人工的に崩した予測と、現場で自然に起きる失敗は同じ分布とは限らない。Labは、誤りが少ない環境での誤警告、人が確認にかける時間、警告を受けて予測を直した場合の費用、LLMの画像理解を測っていない。
  implementation: |-
    各Labの `run.py` は共有の `papers/_toy_common.py` を呼び出し、Python標準ライブラリだけで計算する。論文IDごとの関数が初期条件の表と全条件の結果を出す。小実験は、画像理解、言語モデル、販促の文章、Chronos、M5を使わない。
  mapping: mapping.md
  method: method.md
question: 実績がまだない段階で、人が見直すべき予測をどう見つけるか
