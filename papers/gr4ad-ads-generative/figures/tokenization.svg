<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 550" role="img" aria-labelledby="title"><title id="title">UA-SIDは内容と業務上の違いを別々に表す</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#586c78"/></marker></defs><rect width="560" height="550" fill="#f7faf9"/><style>text{font-family:system-ui,sans-serif;fill:#183640;font-size:19px}.small{font-size:16px}.head{font-size:23px;font-weight:700}</style>
<text x="24" y="35" class="head">UA-SIDは内容と業務上の違いを別々に表す</text>
<rect x="24" y="64" width="512" height="88" rx="10" fill="#e2efea" stroke="#a6bdb5"/>
<text x="38" y="91" class="">動画、商品、広告主の情報を使う</text>
<text x="38" y="118" class="">指示と共起した広告の組で学習</text>
<path d="M280 152 L280 178" fill="none" stroke="#586c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="184" width="512" height="60" rx="10" fill="#e2efea" stroke="#a6bdb5"/>
<text x="38" y="211" class="">モデルは広告の連続表現（UAE）を作る</text>
<path d="M280 244 L280 270" fill="none" stroke="#586c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="278" width="512" height="60" rx="10" fill="#e2efea" stroke="#a6bdb5"/>
<text x="38" y="305" class="">第1段は16384個の中心から選ぶ</text>
<path d="M280 338 L280 362" fill="none" stroke="#586c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="370" width="512" height="60" rx="10" fill="#e2efea" stroke="#a6bdb5"/>
<text x="38" y="397" class="">第2段は4096個の中心で残差を表す</text>
<path d="M280 430 L280 454" fill="none" stroke="#586c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="462" width="512" height="52" rx="10" fill="#fff0da" stroke="#a6bdb5"/>
<text x="38" y="489" class="">第3段はIDなどのハッシュで1024通りに分ける</text><text x="24" y="534" class="small">Labが論文をもとに作成</text></svg>
