<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 630" role="img" aria-labelledby="title"><title id="title">LazyAR：直前のトークンを使う計算を後半層へ寄せる</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#586c78"/></marker></defs><rect width="560" height="630" fill="#f7faf9"/><style>text{font-family:system-ui,sans-serif;fill:#183640;font-size:19px}.small{font-size:16px}.head{font-size:23px;font-weight:700}</style>
<text x="24" y="28" style="font-size:19px;font-weight:700"><tspan x="24">LazyAR：直前のトークンを使う計算を</tspan><tspan x="24" y="52">後半層へ寄せる</tspan></text>
<text x="24" y="78" class="">通常AR：各beam・各SID段で全層を計算</text>
<rect x="24" y="94" width="512" height="88" rx="10" fill="#ece7f5" stroke="#a6bdb5"/>
<text x="38" y="121" class="">前token → layers 1–6 → layers 7–9</text>
<text x="38" y="148" class="">全体が前token確定後の処理</text>
<text x="24" y="227" class="">LazyAR：生成位置ごとに前半を先計算</text>
<rect x="24" y="250" width="512" height="87" rx="10" fill="#e2efea" stroke="#a6bdb5"/>
<text x="38" y="277" class="">position ＋ context → layers 1–6</text>
<text x="38" y="304" class="">前tokenに依存せず、beam間で再利用</text>
<path d="M280 337 L280 369" fill="none" stroke="#586c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="377" width="512" height="60" rx="10" fill="#fff0da" stroke="#a6bdb5"/>
<text x="38" y="404" class="">Fuse：前tokenをここで注入</text>
<path d="M280 437 L280 463" fill="none" stroke="#586c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="470" width="512" height="60" rx="10" fill="#e2efea" stroke="#a6bdb5"/>
<text x="38" y="497" class="">layers 7–9 → 候補ごとの次SID確率</text>
<text x="24" y="555" class="small"><tspan x="24">SIDの最初のトークンは全層を通して生成します。</tspan><tspan x="24" y="579">長文生成で同じ効果が得られる保証はありません。</tspan></text><text x="24" y="610" class="small">research_bot · 一次資料を基に説明用に再構成</text></svg>
