<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 630" role="img" aria-labelledby="title"><title id="title">LazyARは直前のトークンを後半の計算で使う</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#586c78"/></marker></defs><rect width="560" height="630" fill="#f7faf9"/><style>text{font-family:system-ui,sans-serif;fill:#183640;font-size:19px}.small{font-size:16px}.head{font-size:23px;font-weight:700}</style>
<text x="24" y="28" style="font-size:19px;font-weight:700"><tspan x="24">LazyARは直前のトークンを</tspan><tspan x="24" y="52">後半の計算で使う</tspan></text>
<text x="24" y="78" class="">通常の自己回帰：候補ごとに全層を計算</text>
<rect x="24" y="94" width="512" height="88" rx="10" fill="#ece7f5" stroke="#a6bdb5"/>
<text x="38" y="121" class="">直前のトークンを第1層の前に入力</text>
<text x="38" y="148" class="">トークンが決まってから第1〜9層を計算</text>
<text x="24" y="227" class="">LazyAR：トークンの位置ごとに前半を計算</text>
<rect x="24" y="250" width="512" height="87" rx="10" fill="#e2efea" stroke="#a6bdb5"/>
<text x="38" y="277" class="">トークンの位置と文脈から第1〜6層を計算</text>
<text x="38" y="304" class="">直前のトークンを使わず、候補間で共有</text>
<path d="M280 337 L280 369" fill="none" stroke="#586c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="377" width="512" height="60" rx="10" fill="#fff0da" stroke="#a6bdb5"/>
<text x="38" y="404" class="">Fuseで候補ごとの直前のトークンを加える</text>
<path d="M280 437 L280 463" fill="none" stroke="#586c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="470" width="512" height="60" rx="10" fill="#e2efea" stroke="#a6bdb5"/>
<text x="38" y="497" class="">第7〜9層から次のトークンの確率を求める</text>
<text x="24" y="555" class="small"><tspan x="24">候補IDの先頭トークンは第1〜9層で生成する。</tspan><tspan x="24" y="579">長文生成でも同じだけ速くなるとは限らない。</tspan></text><text x="24" y="610" class="small">Labが論文をもとに作成</text></svg>
