<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 466" role="img" aria-labelledby="title"><title id="title">UVRは順位の差で学習の重みを変える</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#586c78"/></marker></defs><rect width="560" height="466" fill="#f7faf9"/><style>text{font-family:system-ui,sans-serif;fill:#183640;font-size:19px}.small{font-size:16px}.head{font-size:23px;font-weight:700}</style>
<text x="24" y="35" class="head">UVRは順位の差で学習の重みを変える</text>
<rect x="24" y="65" width="512" height="86" rx="10" fill="#e2efea" stroke="#a6bdb5"/>
<text x="38" y="92" class="">生成確率の順位r_pと報酬の順位r_v</text>
<text x="38" y="119" class="">A = |r_p − r_v| / (n − 1)</text>
<path d="M238 151 L145 192" fill="none" stroke="#586c78" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M321 151 L413 192" fill="none" stroke="#586c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="202" width="246" height="145" rx="10" fill="#e2efea" stroke="#a6bdb5"/>
<text x="38" y="229" class="">順位の差Aが大きい</text>
<text x="38" y="256" class="">VSLの重みを増やす</text>
<text x="38" y="283" class="">価値を考慮して</text>
<text x="38" y="310" class="">行動ログを学ぶ</text>
<rect x="290" y="202" width="246" height="145" rx="10" fill="#fff0da" stroke="#a6bdb5"/>
<text x="304" y="229" class="">順位の差Aが小さい</text>
<text x="304" y="256" class="">RSPOの重みを増やす</text>
<text x="304" y="283" class="">候補の並びを</text>
<text x="304" y="310" class="">報酬の順位に近づける</text>
<text x="24" y="390" class="">順位が合っても、報酬の値が正しいとは限らない。</text>
<text x="24" y="421" class="">報酬モデルが実際の結果と合うかは別に調べる。</text><text x="24" y="450" class="small">Labが論文をもとに作成</text></svg>
