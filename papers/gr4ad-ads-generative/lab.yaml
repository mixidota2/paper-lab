core_idea:
  author_claim: 著者は広告を意味と業務上の識別で表すUA-SID、利用者の関心と広告価値を学ぶVSL・RSPO、生成時の計算を減らすLazyAR・DBSを組み合わせた。Kuaishouの広告システムに0.16Bモデルを展開し、L20
    GPU1台あたり500超QPS、推論は100 ms未満と報告した（§4）。
  research_bot_interpretation: Labでは候補の識別、学習に使う価値、探索に使う計算量を分けて読む。表の構成を一つずつ比べても、各変更が互いにどの程度影響したかは分からない。報酬モデルが誤っている場合や、表示した広告に偏りがある場合は、報酬上の順位に合わせても実際の収益が増えるとは限らない。
sections:
  overview: |-
    Kuaishouの著者は広告候補を生成して収益を増やすことと、配信に必要な処理件数を保つことを同時に扱いました。GR4ADは広告を意味IDで表し、利用者の反応と広告価値に沿って候補の出し方を学びます。配信時はIDの各記号について、前の記号に依存しない計算を先に済ませ、残りは順に計算します。負荷に応じて、生成の途中で残す候補の数も変えます。

    著者が報告した最終構成では、広告収益が従来方式のDLRMより4.28%増え、1秒当たりの処理件数は生成型のOneRec-V2より117%増えました。DLRMとはGPUや運用の条件が異なるため、著者は処理件数には別の比較相手を使いました。二つの差はどちらも、複数の変更を組み合わせた構成で測ったものです。また著者は、4億人超の利用者を抱えるKuaishouの広告システムに導入したと報告しています。
  method: method.md
  problem: 同じ動画を使う広告でも、広告主やコンバージョンの種類が違えば、配信先と広告価値は変わる。動画の内容だけから作ったIDでは区別できないことがある。クリックされた広告だけを学ぶと、配信時に価値が見込める他の候補を探索しにくい。一方、広い探索幅でIDを生成すると、処理する候補が増え、配信の計算量も増える。
  why_it_might_work: |-
    UA-SIDは動画などが表す意味と、業務上の違いを別の段で表す。異なる広告を分けやすくなるが、ハッシュで区別できることと、モデルが広告価値を学べることは別だ。VSLとRSPOは、利用者が反応した広告を学びながら、報酬が高い候補を上に出す。

    LazyARは直前のトークンに依存しない前半の計算を候補間で共有する。DBSは、途中で残す候補の数と、時間帯によって探索に使う量を調整する。こうして計算の使い方を変えるが、最後に残る候補が固定幅と一致するとは限らない。
  evidence: |-
    ### 広告収益と処理件数の比較相手

    第3版の表1では、広告収益の相対差は従来のDLRM、1秒当たりの処理件数（QPS）の相対差は生成型のOneRec-V2を基準にする。DLRM側は複数のモデルを同時に動かしており、GPUなどの運用条件も違うので、著者は単体モデルのQPSをDLRMと直接比べなかった。

    | 構成 | 広告収益の相対差（DLRM比） | QPSの相対差（OneRec-V2比） |
    | --- | ---: | ---: |
    | OneRec-V2 | +1.68% | 基準 |
    | UA-SIDを追加 | +1.92% | 0% |
    | VSLを追加 | +2.80% | −25% |
    | VSL + DPO | +3.16% | −25% |
    | VSL + GRPO | +3.21% | −25% |
    | VSL + RSPO | +3.86% | −25% |
    | UVR（VSLとRSPOを統合） | +4.01% | −25% |
    | UVR + DBS | +4.32% | +20% |
    | UVR + DBS + DeepSeek-MTP | +3.98% | +117% |
    | GR4AD（UVR + DBS + LazyAR） | +4.28% | +117% |

    最終構成は、表で広告収益が最も高い構成ではない。UVR + DBSの行より収益の相対差は0.04ポイント小さく、QPSの増加は大きい。これは表に示された構成間の比較で、LazyARの効果が他の構成でも同じとは限らない。抄録と結論は収益を最大4.2%と記載する。ここでは、構成ごとに比較相手を示した表1の値を掲載した。

    ### どれだけ多くの広告を別のIDに分けられたか

    表2は、使用したIDあたりの広告数Cprと、複数の広告に使ったIDの割合Colを報告する。残差量子化だけの場合は3.54と85.44%、MRを加えた場合は1.78と59.72%、MRとMGを加えた場合は1.07と18.26%だった。語彙の総容量は4096³と16384×4096×1024で同じだ。Colは使用したIDを分母とし、広告の中で同じIDを持つものの割合とは異なる。

    同じ広告とIDを本文の定義どおりに数えるなら、各使用IDに少なくとも1件、衝突のある使用IDにはさらに少なくとも1件の広告がある。したがってCprは1+Col以上になる。表2の最終行では1.07が1+0.1826を下回り、通常の丸めだけでは説明できない。母集団や集計方法が同じだったかは、本文からは確認できない。表の数字は著者報告のまま掲載した。

    同じ広告商品に属する別の画像を探す評価では、R@1がQARMの0.541、論文表記のQwen3-VL-7Bの0.769、指示と共起で学習したUAEの0.896だった。この画像検索の数値は、オンラインの広告収益ではない。

    ### 幅を変えるDBWと、負荷に応じて調整するDBS

    表4で、著者は[512,512,512]を基準に[128,256,512]を比較し、広告収益−0.15%、QPS +45%と報告した。第3段だけを128に狭める条件は、広告収益−0.85%、QPS +5%だった。表1のDBSは時間帯に応じてビームを広げる処理も含む。このため、表4の−0.15%と表1の数値は同じ条件の比較ではない。

    [一次資料：第3版の表1・表2・表4](https://arxiv.org/pdf/2602.22732v3)
  executable_understanding: |-
    Labは160種類の内容それぞれに4つの広告主を割り当て、640件の人工広告を作った。3段の残差量子化で識別子を付ける場合と、最後の段だけを数値IDのSHA-256ハッシュに置き換える場合を比べる。乱数の初期値は10通り、ハッシュで分ける区間は4、16、64通りとした。4通りの条件だけが元の識別子と同じ総容量で、16と64は容量を増やした場合の比較だ。

    実行するには、リポジトリのルートで `uv run papers/gr4ad-ads-generative/run.py` を使う。
  results: |-
    人工データでは、同じ内容から4件の広告を作ったため、内容だけで付けたIDにはすべて衝突があった。ハッシュを使うと別のIDを持つ広告が増えた。一方、ハッシュが取り得る値は有限なので、区別できない広告も残る。結果には、使用したIDを分母にした衝突率と、広告を分母にした割合の両方を保存した。論文の18.26%に合わせて数値を選んではいない。

    探索の仕組みは別の人工例で確認した。途中の親候補を1件だけ残すとAから始まるIDを返し、2件残すとBから始まるIDを返す例を作れる。どちらも最後に返すのは1件だ。同じ生成段で各親から上位k件を残すTopK Pre-Cutは、この幅を縮める操作とは違う。得点と同点時の順序をそろえれば、その段の全体上位k件を変えない。これは配布コードのハッシュ実験とは別の確認である。
  what_we_verified: Labは人工広告で、内容が同じでも数値IDを使えば区別できる場合があること、ハッシュで同じ値に入る場合もあることを確かめた。使用したIDと広告のどちらを分母にするかで、割合が異なることも確認した。
  what_we_did_not_verify: LabはUAEやbalanced k-meansの学習、RSPOによる学習、LazyARの処理時間、実際の広告収益を検証していない。A/Bテストの信頼区間と割り付け期間の詳細は確認できていない。4億人超の利用者を抱えるシステムへの展開は著者報告であり、Labが独立に確認したわけではない。
  implementation: '`nearest()` は固定した中から最も近い中心を返す。`experiment()` は識別子の先頭2段を保ち、末尾だけをハッシュに替える。`collision_metrics()` は使用したIDと広告のそれぞれを分母にした数値を返す。学習で求めた中心を使わないため、GR4ADの識別子全体の性能は測れない。'
