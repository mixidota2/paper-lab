question: 候補の広告価値を学びながら、配信に必要な処理件数をどう保つか
summary: GR4ADは広告のIDを作る方法、広告価値を使う学習、IDの生成と探索を合わせて変えた。論文の最終構成では、広告収益がDLRMより4.28%増え、1秒当たりの処理件数がOneRec-V2より117%増えた。収益と処理件数は比較相手が異なる。
