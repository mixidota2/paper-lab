  title: 履歴が長くなると、省ける計算の割合はどう変わるか
  caption: Labは80リクエストの候補数を固定し、履歴長を変える。履歴を二度処理する場合と、一度処理して共有する場合を比べる。図が示すのは仮定した単位数であり、実際のattention演算数や応答時間ではない。
