- kind: architecture
  id: cache
  title: 候補生成は履歴を一度読み、順位付けに計算結果を渡す
  after: method
  locator: 図2・§3.3
  rationale: 同じ重みを使うことと、履歴を一度だけ計算した結果を共有することは別である。
  caption: 二つの段は同じモデルと履歴入力に対応するKVだけを共有する。Labの小実験は、データの転送や無効化にかかる時間を数えない。
  rows:
  - label: 共有Transformerが履歴を読む
    nodes:
    - title: 商品と行動を同じ位置に入れる
      text: 商品と行動の特徴をつなぎ、行動を当てる位置では行動を[MASK]にする。特徴をつなぐので履歴の位置数は倍にならない。
  - label: 候補生成が候補IDと履歴の計算結果を渡す
    nodes:
    - title: 索引から候補を探す
      text: モデルが次の商品を表すベクトルを作り、ANNが近い商品のIDと保存済みの商品ベクトルを返す。
    - title: 履歴を読んだ結果を残す
      text: 候補生成が履歴のキー・バリュー（KV）の参照先を順位付けに渡す。順位付けは履歴同士の照合をやり直さない。
  - label: 順位付けが候補ごとの行動確率を出す
    nodes:
    - title: 候補と履歴を照合する
      text: 順位付けモデルは、候補のQueryで履歴のKVを読み、クリックや保存などの確率を候補ごとに出す。
  source: https://arxiv.org/html/2606.00422
- kind: equations
  id: cost
  title: 履歴内の照合は一度、候補と履歴の照合は候補ごとに行う
  after: method
  locator: §3.1.1
  rationale: 式が表すのは計算量の目安で、配信で実測した時間とは区別する。
  caption: 主なattention計算だけを数える。nは履歴長、kは候補数。Labの単位数は実機の応答時間ではない。
  steps:
  - name: 履歴を共有した場合に残る計算
    formula: O(n² + nk)
    explanation: 履歴同士の照合n²は一度だけ行う。候補と履歴の照合nkを足す一方、候補同士を参照させないのでk²の項は生じない。
  source: https://arxiv.org/html/2606.00422
