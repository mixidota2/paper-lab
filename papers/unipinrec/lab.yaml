summary: PinterestのUniPinRecは、候補生成が利用者の履歴を読んだ結果を、順位付けに渡す。候補生成は索引で商品を探し、順位付けは候補を履歴に照合して行動確率を出す。二つの仕事を残したまま、履歴だけを読み直さずに済むようにする。
figures: []
core_idea:
  author_claim: |-
    著者は、商品ベクトルと行動を同じ位置の特徴にまとめ、当てたい行動だけを見えなくした。これをMasked Action Modeling（MAM）と呼ぶ。商品と行動を交互に並べないので、系列長を倍にせず同じモデルで学習できる。候補の行動は常に隠す。履歴は候補を読まず、候補同士も互いを読まない。そのため、候補生成が計算した履歴のキー・バリュー（KV）を順位付けで使える。

    [一次資料：§3.1 / §3.3 / §4.2 / §5](https://arxiv.org/html/2606.00422)
  research_bot_interpretation: 論文は「生成推薦」と呼ぶが、モデルは商品IDを一つずつ生成するのではなく、次の商品に近いベクトルを内積で探す（近似近傍検索、ANN）。Labが着目するのは、商品ごとに行う計算と一度だけ行う計算の分け方である。利用者の履歴入力やモデルの版が違う場合は、古いキャッシュをそのまま使わない。
sections:
  overview: |-
    Pinterestの著者は、推薦候補を探す段階と候補を順位付けする段階が、利用者の同じ行動履歴を重複して処理する問題に取り組みました。UniPinRecは、商品の情報と利用者の行動を同じ位置にまとめ、予測したい行動を隠して候補生成と順位付けを一緒に学習します。配信時には、候補生成が処理した履歴を順位付けでも使います。著者はPinterestの主要な推薦面で、利用者の反応を表す指標が約1%上がり、配信の処理時間が11.1%短くなり、1秒あたりに処理できるリクエスト数が63.6%増えたと報告しています。
  problem: |-
    候補生成と順位付けを別々に学習して配信すると、同じ利用者の履歴を各段が計算する。担当者がモデルの形だけをそろえても、履歴の入力形式、学習例、配信プロセスが違えば、同じ計算結果は使えない。

    全商品から広く探すことと、集めた少数の候補を詳しく採点することは別の仕事である。運用上、担当者が別の候補生成器を追加したり、片方の段だけ切り戻したりできることも必要になる。
  why_it_might_work: 履歴を一度だけ読めば、順位付けで増える重い照合は主に候補と履歴の間に限られる。また、著者は実際に表示した候補のうち反応されなかった例も学習に使う。次の商品を当てる学習だけでは得にくかった、表示後の行動に関する信号を同じモデルへ渡せる。
  evidence: |-
    著者は§3.1で、行動を隠す学習と候補同士を参照させないマスクを説明し、§3.3で履歴KVを段間で共有する構成を示している。

    配信比較（§4.2、表3）で、著者は候補生成と順位付けを別々に動かす比較構成に対し、共有や配信設定を組み合わせた構成で、応答時間が11.1%減り、QPSが63.6%増えたと報告した。QPSは1秒当たりのリクエスト数である。この差はキャッシュ共有だけの寄与ではない。§5は実際の利用行動を比較した別の実験なので、二つの改善率を足し合わせない。

    [一次資料：§3.1 / §3.3 / §4.2 / §5](https://arxiv.org/html/2606.00422)
  executable_understanding: |-
    Labは80リクエストについて、候補数を固定して履歴の長さだけを変える。履歴を二つの段が別々に処理する場合と、一度だけ処理して共有する場合で、仮定した処理単位の合計を比べる。これは実際のattention演算数や応答時間を測る実験ではない。

    実行するときは `uv run papers/unipinrec/run.py` を使う。コードは人工入力と比較条件を決め、図で選べる全条件の結果を `results.json` に保存する。
  results: 表と操作図は、初期値と履歴長を変えたときの単位数を示す。論文のモデルを実行した結果ではない。
  what_we_verified: '**メカニズム：PARTIAL（部分的）**。Labは、候補数を固定し、履歴を一度だけ数える場合に、履歴長に応じて省ける単位数がどう変わるかを確認した。原論文のモデルや配信構成を再現したわけではない。'
  what_we_did_not_verify: Labはキャッシュ転送の時間、容量不足での再計算、履歴やモデルを更新した場合の挙動を測っていない。配信速度の改善が共有から来たのか、検索や順位付けの品質の変化が共同学習から来たのかを調べるには、共有と共同学習を別々に止めて比べる。
  implementation: |-
    実行に必要なのはPythonの標準ライブラリだけである。このLabの `run.py` は `papers/_toy_common.py` の論文別の関数を呼び、操作図の全条件と初期条件の表を出力する。

    このコードはMAMを学習せず、attentionの行列計算も行わない。GPU、キャッシュの転送、失効処理も実装していない。
  mapping: |-
    | 読むもの | 原典で確認したこととLabが作ったもの |
    | --- | --- |
    | 原論文 | [§3.1 / §3.3 / §4.2 / §5](https://arxiv.org/html/2606.00422) |
    | 手法の図と数式 | Labは著者の説明から必要な部分を抜き出して図にした。公式実装ではない |
    | 小実験 | `run.py` が `papers/_toy_common.py` の計算を呼び、`results.json` を書く |
    | 公式コード | Labは公式コードと行単位で照合していない |
  method: method.md
question: 候補を探したあと、順位付けは履歴を読み直さずに済むか
interactives:
