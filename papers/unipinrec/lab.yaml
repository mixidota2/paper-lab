figures: []
core_idea:
  author_claim: '商品と行動を特徴の方向に結合し、予測対象の行動を隠すMasked Action Modeling（MAM）を導入する。商品と行動を交互の位置に置かないため、系列を倍の長さにしない。候補位置の行動は常に隠し、候補同士は互いに参照させない。候補に依存しない履歴表現を使い、検索段で作ったキー・バリュー（KV）を順位付けでも再利用する。


    [一次資料：§3.1 / §3.3 / §4.2 / §5](https://arxiv.org/html/2606.00422)'
  research_bot_interpretation: 「生成推薦」という題名でも、候補生成はANNの内積検索である。モデル名に加えて、何を一度だけ計算し、何を候補ごとに計算するかを見たい。共有する履歴やモデル版が一致しなければ、キャッシュを再利用してはいけない。
sections:
  overview: 履歴の表現を共有し、候補生成は近傍検索、順位付けは候補との照合に分ける。統合の狙いは、段を残しながら重複計算を減らすこと。
  problem: '候補生成と順位付けを別モデルにすると、同じ利用者の行動履歴を二度読み直す。モデルの形だけをそろえても、入力形式や学習例、配信プロセスが違えば計算は共有できない。


    統合後も、全商品から広く候補を集める仕事と、少数の候補を詳しく採点する仕事は残る。他の候補生成器を足したり、各段を個別に切り戻したりする運用が必要だからだ。'
  why_it_might_work: 履歴に対する重い計算を共通化できれば、順位付けの追加費用は候補を履歴に照合する部分に寄る。学習でも表示したが反応されなかった候補を含めることで、検索だけでは薄かった行動の教師信号を補えると考えられる。
  evidence: '§3.1にMAMと候補間の参照を遮断するマスク、§3.3に段をまたぐKV共有がある。Abstractは応答時間11.1%減、QPS63.6%増を報告する。QPSは単位時間に処理できるリクエスト数。§4.2の配信比較と§5のオンライン実験は条件が異なるため、これらを同一の改善率として足し合わせない。


    [一次資料：§3.1 / §3.3 / §4.2 / §5](https://arxiv.org/html/2606.00422)'
  executable_understanding: '80リクエストで履歴計算を1回共有する場合と2回行う場合を数える。候補数を固定して履歴長を変え、重複の割合がどう変わるかを見る。


    実行：`uv run papers/unipinrec/run.py`。合成データの作り方と比較条件はコード内に記載し、図の全条件の結果を `results.json` へ保存する。'
  results: 初期条件の計算値と全条件の結果を示す。合成データ上の小実験であり、論文モデルの性能を測った値ではない。
  what_we_verified: '**メカニズム：PARTIAL（部分的）**。確認したのは、このLabで明記した仮定の下での計算と条件による変化。原論文の機構全体を確認した意味ではない。


    80リクエストで履歴計算を1回共有する場合と2回行う場合を数える。候補数を固定して履歴長を変え、重複の割合がどう変わるかを見る。'
  what_we_did_not_verify: キャッシュ転送の時間、容量不足時の再計算、履歴更新、モデル更新を含めて測りたい。共有を止めた場合と共同学習を止めた場合の比較を分けると、速度と品質の改善源を区別しやすい。
  implementation: '標準ライブラリだけで実行できる。入口は各Labの `run.py`、計算本体は `papers/_toy_common.py` にある。関数は論文IDごとに独立し、ブラウザー用の全条件と初期条件の表を同時に出力する。


    意図して省いたもの：MAMの学習、attention演算、GPU、キャッシュ転送と失効。'
  mapping: '| 対象 | 原典とLabの対応 |

    | --- | --- |

    | 原論文 | [§3.1 / §3.3 / §4.2 / §5](https://arxiv.org/html/2606.00422) |

    | 手法の図と数式 | 上記の仕組みを説明用に簡略化。公式実装ではない |

    | 小実験 | `run.py` → `papers/_toy_common.py` → `results.json` |

    | 公式コード | このLabでは公式コードとの行単位の照合はしていない。 |'
  method: method.md
