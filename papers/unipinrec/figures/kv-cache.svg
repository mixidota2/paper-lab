<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230"><style>text{font-family:sans-serif;fill:#18201d}.b{fill:#e9eee7;stroke:#245b49;stroke-width:2}.a{stroke:#ae4e2a;stroke-width:2}</style><text x="35" y="32" font-size="20" font-weight="bold">順位付けは候補検索で読んだ履歴を使う</text><rect class="b" x="45" y="70" width="170" height="50"/><text x="75" y="100">履歴を読む</text><path class="a" d="M215 95h75"/><rect class="b" x="290" y="70" width="160" height="50"/><text x="330" y="100">履歴のKV</text><path class="a" d="M450 95h75"/><rect class="b" x="525" y="70" width="170" height="50"/><text x="550" y="100">候補を採点する</text><text x="45" y="180" fill="#ae4e2a">計算を共有しない場合、順位付けは履歴をもう一度読む。</text></svg>
