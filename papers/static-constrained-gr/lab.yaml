teaching_figures:
- kind: equations
  id: method-equations
  title: 式と操作の対応
  after: method
  caption: 各記号が担う役割を分けて読む。
  rationale: 演算と制約の対象を明確にする。
  source: https://arxiv.org/pdf/2602.22647v2
  locator: §4、Algorithm 1
  steps:
  - name: prefix集合
    formula: 'F(prefix,v)=1{∃c∈C: prefix+v ⊑ c}'
    explanation: 業務で許可した集合Cの中だけを探索。
  - name: CSR
    formula: children(s)=indices[indptr[s]:indptr[s+1]]
    explanation: 遷移先stateを並行した配列から読む。
  - name: mask
    formula: log p′(v)=log p(v) if F=1; −∞ otherwise
    explanation: Algorithm 1はLogSoftmax後にmaskを適用する。
