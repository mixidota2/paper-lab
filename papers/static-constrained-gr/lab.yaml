core_idea:
  author_claim: >-
    著者は、許可されたIDの先頭部分ごとに、次に足せる記号と移動先を配列に保存した。
    これにより、生成中の候補をTPUやGPU上でまとめて調べ、許可集合にないIDの生成を防ぐ（§4）。
  research_bot_interpretation: >-
    同じ許可集合を使うなら、木を配列に置き換えても選べる作品は変わらない。
    高速化により、推論時に鮮度などの条件を厳密に守りながら、追加時間を抑えられる。視聴やクリックの改善は、候補源を加えたA/Bテストの結果として読む。
sections:
  problem: |-
    カタログにある正しいIDでも、古い動画なら「公開から7日以内」の候補にはできない。生成後に条件を掛けると、モデルが残した候補がすべて消える場合がある。生成の途中で条件を掛ける方式は、不許可の候補だけで枠が埋まるのを防ぐ。ただしCPUの木を毎回参照する方式では、TPUとのデータの受け渡しが増える。
  evidence: |-
    ### 候補制限の追加時間：TPUでは1ステップ当たり0.033ミリ秒

    著者は30億パラメータのモデルをTPU v6eで動かし、候補を制限する時間を100回測った。表1では、CPUの木の31.3ミリ秒に対し、STATICは0.033ミリ秒だった。948倍は候補制限の追加時間だけを比べた値で、推薦全体が948倍速くなったわけではない。STATICの追加分は推論時間の約0.25%だった。

    近似PPVは上位50記号だけを調べ、Hash Bitmapは不許可の候補を通す場合がある。これらの方式と比べるときは、追加時間だけでなく、許可集合を厳密に守れるかも見る。

    <figure class="teaching batch17"><h3>制約処理の追加時間だけを比較する</h3><div class="matrix-scroll" tabindex="0" role="region" aria-label="比較表"><table><thead><tr><th>方式</th><th>追加時間（ミリ秒／ステップ）</th><th>候補の調べ方</th></tr></thead><tbody><tr><td>CPU Trie</td><td>31.3</td><td>CPU上で同じ木をたどる</td></tr><tr><td>PPV Exact</td><td>34.1</td><td>全2,048記号を検査する</td></tr><tr><td>Hash Bitmap</td><td>12.3</td><td>許可されない候補を通すことがある</td></tr><tr><td>PPV Approximate</td><td>1.56</td><td>上位50記号だけを調べる</td></tr><tr><td>STATIC</td><td>0.033</td><td>許可された候補だけを残す</td></tr></tbody></table></div><div class="b17-budget"><span style="flex:99.75">候補制限以外の推論時間</span><b style="flex:.25" title="約0.25%">│</b></div><p>棒は論文が報告した追加分の割合を示す。ほかの工程の内訳は示していない。</p><figcaption>§5.1–2・表1。30億パラメータ、TPU v6e、チップ当たりバッチ2、ビーム70、許可集合は約2,000万本。画面に推薦を届けるまでの計測ではない。</figcaption></figure>

    ### YouTubeのA/Bテスト：公開から7日以内の動画の視聴が5.1%増えた

    著者はYouTube短尺動画のホーム画面に、新しい動画だけを出す候補源を加えた。この候補源が出した動画はすべて公開から7日以内だった。7日以内の動画の視聴は5.1%増え（95%信頼区間：5.0〜5.2%）、3日以内の動画は2.9%増えた（2.8〜3.0%）。クリック率（CTR）は0.15%（0.01〜0.29%）、対象の利用者群の満足度も0.15%（0.03〜0.27%）高かった。7日は対象動画の条件で、実験期間ではない（§5.4・表2）。

    ### Amazon Reviews：正解が新しい商品のとき、1位に出せた割合を比べた

    著者は各カテゴリで最初のレビューが新しい側の2%を候補にした条件と、5%を候補にした条件を比べた。たとえば2%に限った美容用品では、正解の商品を1位に出した割合（Recall@1）は、制約なしの生成で0.00%、候補内のランダム選択で0.42%、候補内の二塔モデルで0.88%、STATICで4.29%だった。新しい商品が正解の例に限った評価で、著者は70エポック中の最高値を報告した。全商品に対する推薦や、Amazonでの運用効果を測ったものではない（§6・表3、付録F）。

    ### 比較する仕組みごとに、絞り込む対象と測った時間が違う

    NEZHAは無効なSIDを除く。STATICは、正しいSIDの中から業務上許可した集合に絞って生成する。[UniVA](univa-commercial-sid-gar.html)は利用者ごとに広告の適格性と価値を使って木を作り、[FlashTrie](flashtrie-gpu-beam.html)はGPU上でビーム探索の処理全体をまとめる。対象集合、点数、装置、測定した工程が違うため、処理時間だけで方式を順位付けできない。

    [一次資料：版を固定したPDF](https://arxiv.org/pdf/2602.22647v2)。節・表とPDFのSHA-256は対応表に記載した。
  overview: |-
    著者は、生成推薦が決められた候補集合の外を選ばないようにして、その確認をTPU上で素早く行う方法を提案しました。STATICは、作品識別子（SID）を先頭の記号で分けた木を、まとめて参照できる配列に変えます。モデルが次の記号を出すたび、その先に許可された作品がある記号だけを残します。たとえば直近7日以内の動画に限る、といった条件を強制できます。

    30億パラメータのモデルをTPU v6eで測ると、候補を制限する処理には1ステップあたり0.033ミリ秒かかりました。推論時間全体の約0.25%に当たります。別のYouTubeホーム画面のA/Bテストでは、公開から7日以内の動画の視聴が5.1%増えました。7日は対象動画の条件で、実験期間ではありません。0.033ミリ秒は候補制限だけの時間で、画面を届けるまでの時間ではありません。
  why_it_might_work: |-
    STATICは、IDの先頭部分に状態番号を付け、次に選べる記号を連続した配列からまとめて読む。TPUがCPUの木を見に行かなくてもよい。候補の多い先頭側には密な表を使い、候補の少ない後半には選べる記号だけを保存するCSRを使うため、すべてのIDの組み合わせを表に持つ必要もない。

    一方、論文の方法は候補を調べる表を事前に作る。在庫などの理由で許可集合が頻繁に変わる場合は、表の再作成と読み込みにも時間がかかる。著者は動的な更新を今後の課題としている（§7）。
  method: method.md
  executable_understanding: |-
    Labは架空のIDを5件用意し、001と111の2件だけを許可する。全体から上位1件を出してから絞る方法と、許可した2件の中から上位1件を選ぶ方法を、同じ点数で比べる。

    <figure class="teaching batch17"><h3>許可した2件から、次に選べる記号を読む</h3><div class="matrix-scroll" tabindex="0" role="region" aria-label="比較表"><table><thead><tr><th>配列</th><th>値</th></tr></thead><tbody><tr><td>indptr</td><td>[0, 2, 3, 4, 4, 5, 6, 6]</td></tr><tr><td>tokens</td><td>[0, 1, 0, 1, 1, 1]</td></tr><tr><td>next_state</td><td>[1, 4, 2, 3, 5, 6]</td></tr></tbody></table></div><figcaption>Labは根を状態0とする。indptrの隣り合う二つの値で、次に選べる記号の区間を指定する。原論文の状態0は無効な遷移先を示す。</figcaption></figure>
  results: >-
    全体の上位1件は000で、許可集合に入っていないため、あとから絞ると0件になった。
    先に許可集合に限ると001が残った。いずれもLabの人工例であり、YouTubeのA/Bテストの値ではない。
  what_we_verified: |-
    Labは、空の先頭部分を含む15通りで、配列をたどった結果が許可集合そのものから調べた結果と一致することを確認した。
    **Mechanism: PARTIAL**。小実験が確かめたのは、許可集合と配列の対応、および絞る順序による候補数の違いまでである。
  what_we_did_not_verify: |-
    LabはTPUやGPUを使っていない。先頭の密な表、VNTKによる固定長の読み込み、候補2,000万本のメモリ使用量、本番の候補更新、処理時間、クリック率、新商品の推薦成績は独立に検証していない。
    **Performance / Scaling / Production applicability: NOT TESTED**。
  implementation: |-
    リポジトリの最上位で `uv run papers/static-constrained-gr/run.py` を実行すると、同じフォルダーに `results.json` を書く。Pythonの標準ライブラリだけを使い、乱数や外部APIは使わない。

    [実行コード](../downloads/static-constrained-gr/run.py)・[全結果](../downloads/static-constrained-gr/results.json)・[README](../downloads/static-constrained-gr/README.md)・[方法](../downloads/static-constrained-gr/method.md)・[対応表](../downloads/static-constrained-gr/mapping.md)を保存できる。

    公式コードのコミット `ac18fa1870ac45e0a3559090a0ea9ec005226cf5` を参照し、表を作る処理と推論時に読む処理の位置を確認した。Labは公式のJAX版とPyTorch版を実行していない。
  mapping: mapping.md
teaching_figures:
- kind: equations
  id: method-equations
  title: 次の記号を残す判定と、配列の読み方
  after: method
  caption: 許可された作品につながらない記号を、候補の点数を比べる前に除く。
  rationale: どの記号を残すかと、残せる記号をどこから読むかを分ける。
  source: https://arxiv.org/pdf/2602.22647v2
  locator: §4、Algorithm 1
  steps:
  - name: 接頭辞の判定
    formula: 'F(prefix,v)=1{∃c∈C: prefix+v ⊑ c}'
    explanation: 今あるIDの先頭部分に記号を足した結果が、許可集合Cのどれかの先頭部分であるときだけ、その記号を残す。
  - name: CSRの読み取り
    formula: children(s)=indices[indptr[s]:indptr[s+1]]
    explanation: 状態番号sから、次に足せる記号が入った配列の区間を求める。
  - name: 不許可の記号を除く
    formula: log p′(v)=log p(v) if F=1; −∞ otherwise
    explanation: Algorithm 1では対数確率を計算してから、不許可の記号の値を−∞にする。
