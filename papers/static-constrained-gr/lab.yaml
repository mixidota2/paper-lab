question: STATICは、生成推薦を許可された作品だけに絞る処理をどう速くしたか
summary: >-
  STATICは、許可された作品IDの木を、TPUやGPUがまとめて読める配列に変える。
  YouTubeの測定では、候補を制限する追加処理は1ステップ当たり0.033ミリ秒だった。
  別のA/Bテストでは、公開から7日以内の動画だけを出す候補源を加えると、対象となる動画の視聴が5.1%増えた。
