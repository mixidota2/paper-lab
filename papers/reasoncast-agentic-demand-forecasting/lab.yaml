question: どんなときにイベント情報で予測を補正し、どんなときに元の予測を使うか
summary: ReasonCastは、数値から予測するChronos-2 smallを残し、祝日やセールの情報を使って補正するかどうかを別のモデルで決める。著者の比較では、イベント期間に誤差が下がり、平常期には補正を見送って元の精度を保った。いずれも過去の販売データを使った評価で、発注や在庫の改善を測ったものではない。
