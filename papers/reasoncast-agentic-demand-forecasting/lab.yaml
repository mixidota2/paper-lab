- kind: equations
  id: identity
  title: Skipでは、足す補正も掛ける補正もなくなる
  steps:
  - name: 内部表現を二つに分ける
    formula: Hᴱ = HP, Hᴺ = H(I−P)
    explanation: 分けた成分を足すと元の値に戻る。イベントの因果効果を表す式ではない。
  - name: 日ごとの形を調整する
    formula: H̃ = Hᴺ + Hᴱ + mαgΔH
    explanation: イベント側の成分がテキストを読み、読み取った値を元の表現へ加える。
  - name: 予測値の水準を調整する
    formula: ŷ = ŷ_lat ⊙ exp(mβgρ)
    explanation: mが0なら倍率は1になる。内部への加算も0なので、Skipでは元の予測と一致する。
  locator: Eqs. (6), (8), (11)–(12)
  after: method
