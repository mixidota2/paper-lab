core_idea:
  author_claim: Qwen3-32Bは、元の予測とイベントの情報から、補正しないか、手元の情報で補正するか、追加の情報を調べて補正するかを選ぶ。Chronos-2 smallが数値を予測する。補正する場合は、イベントに合わせて売上の推移と水準を調整する。
  research_bot_interpretation: Labが注目したのは、補正を選ばなければ元の予測を必ず残す点だ。販促の予定と欠品の記録を使って導入を判断するなら、売上と買いたかった数量を分け、同じ情報で予測した場合の誤差と、発注した場合の費用を別々に比べる必要がある。
sections:
  overview: |-
    ReasonCastは、祝日やセールの情報を需要予測に反映するかどうかを、その都度決める方法です。Chronos-2 smallで出した予測をそのまま使うか、手元のイベント情報で補正するか、検索や時系列を調べるツールも使って補正するかを選びます。予測の土台となるChronos-2 smallの重みは変えません。

    公開データM5のイベント前後では、誤差の指標WMAPEが多変量データで追加学習したChronos-2 smallの33.10%に対し、ReasonCastは32.63%でした。一方、著者が調べた平常日の販売データでは、常に補正するとWMAPEが7.91%から9.59%に悪化しました。補正するかを選ぶ方法では補正を見送り、元の7.91%を保ちました。どちらも過去のデータに対する予測の比較で、在庫や発注の改善は測っていません。
  problem: |-
    売上の履歴だけでは、今年の祝日や大型セールで売上がどう変わるかを読み取りにくい。逆に平常日では、関係のない出来事を加えることで予測の誤差が大きくなる場合がある。著者は、イベントを使うかどうかと、使うときにどれだけ予測を変えるかを分けて決めた。

    独自データは、最も細かい商品カテゴリごとの日次売上15,696系列である。一つの商品を一店舗で売った数ではない。著者は予測を出す時点までに分かっていた情報で、その後7日間を予測した。
  why_it_might_work: モデルが補正不要と判断したときは、学習した補正の強さがたまたま小さくなることに任せず、補正の計算を切る。補正する場合は、元の予測の内部表現を二つに分け、イベントに対応する側だけがテキストを読み取る。ただし、読み取った結果を同じ部分空間へ投影し直さないため、結果の影響がそこだけに収まるとは限らない。二つを直交させても、イベントが売上をどれだけ変えたかという因果効果は分からない。
  evidence: |-
    著者は独自データで、2025年8月末までを学習、9〜10月をモデル選択、11月から2026年5月までを評価に使った。評価は各7日間の15区間で、祝日10、大型セール3、平常期2を含む。公開データM5では、10店舗を合計した3,049商品系列で、イベント前後の7日間を14区間調べた。

    WMAPEは、観測ごとの予測誤差を絶対値にして足し、実績の絶対値の合計で割った値だ。以下の差はパーセントポイントであり、誤差の相対変化率ではない。

    | 評価した区間 | 比較対象 | ReasonCast | 誤差の差 |
    | --- | --- | --- | --- |
    | 祝日の影響が大きいカテゴリ | 売上の履歴で追加学習したChronos-2 small（Uni-FT）：42.39% | 39.10% | −3.29ポイント |
    | 大型セールの影響が大きいカテゴリ | 追加情報も使って学習したChronos-2 small（Multi-FT）：22.14% | 20.89% | −1.25ポイント |
    | M5のイベント前後 | 追加情報も使って学習したChronos-2 small（Multi-FT）：33.10% | 32.63% | −0.47ポイント |
    | 独自データの平常期 | 追加学習なしのChronos-2 small：7.91% | 7.91%（補正なし） | 0ポイント |

    平常期で補正を強制すると、誤差は7.91%から9.59%へ1.68ポイント悪化した。別の試験でイベント説明の内容を逆にすると、15区間のうち13区間で悪化した。著者が評価したのは与えられた販売データに対する予測で、在庫や欠品を減らせたかは測っていない。[一次資料：初版 §5.2、表2・3、§5.8](https://arxiv.org/html/2608.15291v1)
  method: method.md
  executable_understanding: Labの画面では、元の予測、実績、補正に使う数値を別々に設定する。7日分の実績を共通にして、元の予測、補正を最大にした予測、指定した強さで補正した予測の誤差を比べる。画面で一つの入力を変えると、その場で結果を計算し直す。実績は採点だけに使い、補正の計算には渡さない。
  results: 7日間ずっと実績が20、元の予測が10なら、元の予測のWMAPEは50%になる。2倍になるという情報を強さ1で使えば0%、強さ0.5なら約29.289322%になる。一方、実績が10なら元の予測の誤差は0%であり、同じ2倍の補正を加えると100%になる。以前の固定例では、不要なBasicで0%から20%に悪化する条件も残している。どの例でも、補正の情報が正しいかどうかはLabが外から決めた。
  what_we_verified: Labの計算を別に求めた値と比べ、誤差、半分の強さで使った補正、間違った情報、イベント日のずれを確認した。実績がすべてゼロの場合や、補正後が負になる場合、不正な入力も区別した。Skipでは補正の演算を通さない。確認したのはこの教材の計算で、論文全体の仕組みは一部のみ（PARTIAL）。画面、キー操作、書き出しは、この計算の検査では確認していない。
  what_we_did_not_verify: LabはChronos-2とQwen3-32Bを動かさず、検索、経路を選ぶ学習、直交射影、強化学習も再現していない。欠品で売上が買いたかった数量を下回る場合、販促の費用、品切れを防げる割合も評価していない。モデルの性能、件数を増やしたときの動作、本番での有用性は未検証（NOT TESTED）。
  implementation: ブラウザーの `model.js` とPythonの `evaluate()` は、予測値に加算と指数の倍率をかける式 `(b + g*a) * exp(g*l)` を計算する。論文の式8のようにモデル内部へ加算する処理は実装していない。論文の式11の倍率と式12のSkipを理解するための簡単な計算だ。BasicとToolは以前の固定例だけに出てくる。同じ入力なら同じ値を返す。言語モデルや検索は動かさない。
  mapping: mapping.md
