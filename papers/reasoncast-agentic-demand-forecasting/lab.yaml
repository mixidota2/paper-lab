- kind: architecture
  id: routing
  title: 補正しないときは元の予測を変えない
  rows:
  - label: 補正を見送るとき
    nodes:
    - title: Skip
      text: イベントによる補正を止めます。
    - title: テキストのマスクを0にする
      text: 内部表現に足す値は0で、出力に掛ける値は1です。
    - title: 最初の予測
      text: Chronos-2 smallの予測をそのまま返します。
  - label: 祝日と大型セール
    nodes:
    - title: BasicかToolを選ぶ
      text: 著者らはこの条件でSkipを選べないようにしました。
    - title: Qwen3-32B
      text: 需要がいつ、どの方向にどれほど動くかを整理します。
    - title: 形と水準を調整する
      text: 日ごとの動きと全体の水準を別々に補正します。
  - label: さらに情報が必要なとき
    nodes:
    - title: Tool
      text: 検索や時系列の統計で、手元にない情報を補います。
    - title: 補正で使うイベントの表現
      text: 予測器が参照できる形に情報をまとめます。
  locator: Figure 1; §4.2
  after: method
  source: https://arxiv.org/pdf/2608.15291
  rationale: 補正しない経路、手元の情報を使う経路、ツールを使う経路を比べます。
  caption: 論文の図1と第4.2節をもとに、経路ごとの違いを示します。Labが著者らのモデルを実行した結果ではありません。
- kind: equations
  id: identity
  title: Skipを選ぶと、足す値は0になり、掛ける値は1になる
  steps:
  - name: 内部表現をイベント側とそれ以外に分ける
    formula: Hᴱ = HP, Hᴺ = H(I−P)
    explanation: 2つを足すと元の表現に戻ります。イベントの因果効果を示す分け方ではありません。
  - name: 内部表現に変化を足す
    formula: H̃ = Hᴺ + Hᴱ + mαgΔH
    explanation: イベント側だけがテキストを参照し、読み取った情報を元の表現に足します。
  - name: 出力に倍率を掛ける
    formula: ŷ = ŷ_lat ⊙ exp(mβgρ)
    explanation: mが0なら倍率は1です。内部にも何も足さないので、Skipで元の予測を返します。
  locator: Eqs. (6), (8), (11)–(12)
  after: method
  source: https://arxiv.org/pdf/2608.15291
  rationale: 補正を止めると、2つの計算が元の予測を変えなくなる仕組みを示します。
  caption: 式6、8、11、12。mは補正を使うかどうか、gは使うときの強さを表します。
