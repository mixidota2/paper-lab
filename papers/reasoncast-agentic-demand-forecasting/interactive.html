<p><strong>合成実験 · Mechanism PARTIAL</strong> — 著者の実測値とは別の教材です。</p>
<h3>予想してから、一つの条件を変える</h3>
<label>変更すると、結果はどうなると思いますか？<select data-guess><option>まだ決めていない</option>改善する</option>同じになる</option>悪化する</option></select></label>
<p>予想は採点されません。まず一つだけ値を変え、表の差と日ごとの動きを見て、予想の理由を確かめてください。</p>
<form><div class="reference-fields"><label>基準予測 b：7日分、カンマ区切り<textarea name="base" rows="2" required></textarea></label><label>実績 y：7日分、0以上<textarea name="actual" rows="2" required></textarea></label><label>信じた情報の加算 a：7日分<textarea name="additive" rows="2" required></textarea></label><label>信じた情報の対数倍率 l：7日分（ln 2 ≈ 0.693147）<textarea name="level" rows="2" required></textarea></label><label>補正の強さ g：0〜1<input name="gate" type="number" step="any" required></label><label>選択する経路<select name="route"><option value="Correct">補正</option><option value="Skip">Skip</option></select></label></div></form><button type="button" data-reset>初期条件に戻す</button>
<p data-error role="alert"></p><div data-output aria-live="polite"></div>
<h4>条件と計算結果を保存する</h4><button type="button" data-export>JSONを書き出す</button>
<label>保存したJSONを貼り付ける<textarea data-json rows="5" spellcheck="false"></textarea></label>
<button type="button" data-import>条件を読み込み、再計算する</button>
<p>読み込みではinputsだけを採用し、保存済みoutputを信用せず再計算します。Tabで移動し、数値欄や選択欄はキーボードでも変更できます。</p>
