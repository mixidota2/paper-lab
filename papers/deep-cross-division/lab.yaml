  arxiv: https://arxiv.org/abs/2611.27514
  official_code: https://github.com/rw404/DCDN
verdict: Worth Reading
status: draft
question: クリック数と表示数があれば、手作りのクリック率をモデルの入力から外せるか
summary: DCDN は、元の入力を掛ける仕組みに、分母として選んだ入力の逆数を掛ける仕組みを足します。自作例で分母を変え、比を表せる範囲を確かめます。論文の本番評価では、入力をそろえた比較と、モデルと入力を同時に変えた比較を分けて読みます。
verification:
  mechanism: PARTIAL
  performance: NOT TESTED
  scaling: NOT TESTED
  production_applicability: NOT TESTED
source_review:
  checked: '2026-11-24'
  url: https://arxiv.org/html/2611.27514v1
  scope: HTML 版の式2–3、§5.1–5.2、§6.1–6.4、表1–3・5–7を確認しました。公式コードは実行していません。
core_idea:
  author_claim: 著者は、クリック数や表示数のような元の値を残せば、計算済みの比率を入力から外せると報告しています。
  research_bot_interpretation: 分母として使う特徴が分かっていて、比率の計算や配信に手間がかかる場合は試す価値があります。分母がゼロやゼロに近い場合は別に評価します。また、比率を使えば必ず予測の精度が上がるわけではありません。
sections:
  overview: |-
    著者はクリック率のような比率をあらかじめ計算して渡さなくても、推薦モデルがクリック数や表示数から比率を学べるかを調べました。提案手法のDCDNは、DCNv2の交差層に、分母として指定した入力の逆数を掛ける項を加えます。著者は短尺動画サービスのログを使い、手作りの比率を両方のモデルに渡す場合と、どちらにも渡さない場合を別々に比べました。入力をそろえたこの比較では、どちらの場合も4つの評価対象すべてでDCDNの順位指標（XAUC）がDCNv2を上回りました。

    14日間の本番A/Bテストでは、対照群はDCNv2に手作りの比率を渡す従来の設定を使いました。もう一方の群では、著者がモデルをDCDNに替え、分子や分母となる元の値を残して、計算済みの比率だけを外しました。この変更で入力の特徴量は40.1%減り、対照群に比べて「いいね」は3.25%、シェアは16.26%、総視聴時間は0.33%増えました。本番で測ったのはモデルと入力を同時に変えた効果です。逆数を掛ける項だけで視聴時間がどれだけ変わるかは、このA/Bテストからはわかりません。
  problem: 手作りの比率を使うには、学習と本番の両方で同じ計算を行い、その値をモデルに渡す必要があります。ただし、比率を外すときに分子や分母まで外すと、モデルはその比を計算できません。
  method: method.md
  why_it_might_work: 分母がゼロでなく大きさの補正も不要なら、分子に分母の逆数を掛けると元の比になります。DCDNの交差層は、この形の項を直接作れます。他のモデルで同じ比を近似できないという意味ではありません。
  evidence: evidence.md
  executable_understanding: experiment.md
  results: Labは架空の6件で、学習に使わなかった分母を使って誤差を比べました。逆数を使う項のRMSEは0でした。積だけの式では、分子を固定して分母を小さくすると予測値も小さくなるため、この6件のRMSEは約20.0でした。
  what_we_verified: Labは論文の式から積と逆数の項を取り出し、正の分母、負の分母、ゼロ、逆数の対象外を分けて計算しました。
  what_we_did_not_verify: Labは著者のモデルを学習し直していません。公開データと本番データの性能、実サービスでの処理時間も測り直していません。
  implementation: Python標準ライブラリだけで、架空の例と論文の表5の値をまとめたJSONを再生成できます。配布版のinteractive.htmlはネットに接続せずに開けます。
