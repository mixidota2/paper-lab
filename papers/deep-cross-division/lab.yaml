- id: original-input-ratio-branch
  kind: logic
  title: 交差層に入る値と掛け合わせる値
  after: method
  source: https://arxiv.org/html/2611.27514v1
  locator: §3.2、式2・3と図1をもとに整理
  rationale: 層はその層への入力を変換し、掛け算には最初の入力を使う。
  caption: 層が逆数を取るのは、最初の入力のうち分母に使うと指定した位置だけ。
  rows:
  - label: 交差層
    nodes:
    - title: 最初の入力
      text: モデルはクリック数や表示数など、比率を計算する前の値を受け取る。
    - title: 二つの交差項
      text: 層は一方の変換結果に最初の入力を掛け、もう一方には指定した最初の入力の逆数を掛ける。
    - title: 出力
      text: 層は受け取った値に二つの交差項を足し、次の層へ渡す。
- id: ranking-evidence-distinction
  kind: logic
  title: オフライン比較と本番のA/Bテスト
  after: evidence
  source: https://arxiv.org/html/2611.27514v1
  locator: §6.2–6.4、表5–7
  rationale: 著者は、どちらにも同じ入力を渡す比較と、実サービスで二つの変更を一緒に試した結果を報告した。
  caption: ランキング処理時間には逆数以外の計算も含まれる。
  rows:
