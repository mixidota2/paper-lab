core_idea:
  author_claim: 利用者の履歴を一度だけ計算し、候補を集める検索と、候補に順位を付ける二つの段階で共有します。検索では、注文・探索・広告などの目的を表す短い記号を先に決めます。DCGRは、その記号を条件に商品コードを作り、業務上の目的に応じた点も加えます。
  research_bot_interpretation: Labは、3段階の仕事を残して計算を共有する方法として整理します。段階をなくすSonaやOneRec、早い段階で情報を合わせるUNIQUE、粗い順位付けを飛ばすVARGとは、何をまとめるかが違います。これらの方法を同じ条件で比べた結果ではありません。
sections:
  overview: |-
    OneTrans-V2は、推薦候補を探す段階、粗く順位を付ける段階、精密に順位を付ける段階を残しながら、3段階を同じTransformerで学習します。候補によらない利用者の情報は一度計算して共有します。一方、候補の特徴や学習の目的は段階ごとに異なります。

    著者は利用者を無作為に分け、新しいモデルと配信の仕組みで3段階すべてを置き換えた場合を、段階ごとに別のモデルを使う従来方式と比べました。利用者当たりの流通取引額（GMV）は9.74%増えました。新しい仕組み全体の比較なので、計算の共有だけでどれだけ増えたかは分かりません。
  problem: |-
    推薦では最初に多数の候補を集め、簡単な情報で候補を絞り、最後に詳しい情報で順番を決めます。処理を別々のモデルに任せると、各モデルが同じ利用者の履歴を読み直し、学習も別々になります。どの段階でも詳しい商品特徴を使うと、多くの候補を扱う段階の計算が重くなります。著者は、候補によらない履歴の計算だけを共有し、段階ごとに必要な処理は残しました。
  why_it_might_work: |-
    同じ要求の中で履歴の計算を共有すると、同じ処理を繰り返さずに済みます。粗い順位付けは、精密な順位付けの点数を手掛かりに学習することで、後から高く評価される商品を落としにくくできます。ただし、全段階で毎秒処理できた要求が3.2倍になったのは、履歴の使い回しと配信時の計算の工夫を合わせた結果です。
  evidence: |-
    | 何を測ったか | 著者の結果 | 比較した条件 |
    | --- | --- | --- |
    | 検索の1位に正解がある割合（HR@1） | OneTrans-GRの0.0545に対し、小型のV2Sは0.0660、大型のV2Lは0.0923 | 過去データを使った検索の評価（表2） |
    | 1要求で行う演算の量 | 3モデルを使う従来方式の合計は275 GFLOPs、V2Sは239、V2Lは662 | 表2の演算量。毎秒処理できる要求の数とは別 |
    | 利用者当たりの流通取引額（GMV）と活動日数 | GMVは9.74%増、活動日数は0.25%増 | 利用者を無作為に半分ずつ分け、V2Lと配信の仕組みで3段階全部を置き換えた比較（§6.3） |
    | 毎秒処理を終えた要求の数（QPS） | 3.2倍 | 同じハードウェア予算で、3段階すべての処理が済んだ要求を数える（§6.3） |

    §7.9で著者は、段階ごとの配信を先に最適化し、さらに履歴計算を3段階で共有したときに、全体の処理件数が1.53倍になったと報告しています。3.2倍は、履歴の共有だけを切り出した数字ではありません。同じ節にある4.4倍は、学習時に同じ利用者への複数の表示で履歴計算を共有した結果です。

    検索のDCGRだけを評価した別の試験では、従来方式の主な検索経路に比べてGMVが48.0%増えました。商品を見せた回数は69.3%増え、1,000回当たりのGMVは13.0%減りました。検索経路だけの比較なので、推薦全体の利用者当たりGMVが9.74%増えた試験とは分けて読みます。

    [一次資料：表2・4、§6.3、§7.9](https://arxiv.org/html/2609.28589v1)
  method: method.md
  executable_understanding: |-
    `uv run papers/onetrans-v2-cascade-unification/run.py`

    人工例では、候補A、B、Cについて、目的の確率と商品コードの確率を固定します。業務上の加点の強さβだけを0、0.5、1、2に変え、順位がどう変わるかを確かめます。もう一つの計算では、履歴を一度処理する手間を100、3段階の作業をそれぞれ10、20、30と置き、履歴を各段階で読む場合と一度だけ読む場合を比べます。
  results: |-
    β=0ではA、β=1ではB、β=2ではCが首位です。履歴を3回計算する場合は360、一度だけ計算する場合は160になりました。360を160で割ると2.25ですが、教材のために置いた計算の単位です。著者が配信で測った3.2倍の処理件数とは比べられません。
  what_we_verified: |-
    Labは、βを0にするとモデルの確率順になり、加点で順位が変わることを確かめました。式4を全候補に適用する部分と、履歴の重複計算を数える部分に限った確認です。
  what_we_did_not_verify: |-
    Labは、学習済みのTransformerやMoE、SNT、商品コード、段階間の蒸留を動かしていません。GPU上で計算を使い回す仕組みも、本番のA/Bテストも、独立には再現していません。
  implementation: |-
    run.pyのrank()は、式4で候補を採点する部分を計算します。cache_costは図2の考え方に沿って、同じ履歴を何回計算するかを教材用の単位で数えます。著者の学習や配信のコードではありません。
  mapping: mapping.md
