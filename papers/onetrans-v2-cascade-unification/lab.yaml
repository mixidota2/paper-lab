status: published
question: 推薦の3段階で、同じ利用者の履歴を一度だけ計算できるか
summary: OneTrans-V2は、推薦の3段階で利用者の履歴を何度も計算する代わりに、一度計算した結果を使い回します。著者が3段階をまとめて置き換えた実験では、利用者当たりの流通取引額が9.74%増えました。同じハードウェア予算で毎秒処理した要求は、配信の工夫も加えて3.2倍でした。
