- kind: equations
  id: dcgr
  title: 目的の得点と商品の得点を足す
  steps:
  - name: 決定
    formula: log P(z|H) + βφ(z)
    explanation: 目的の確率を点に換算し、業務上の加点を加えます。
  - name: 商品
    formula: Σℓ log P(SIDℓ|H,z,SID<ℓ)
    explanation: 目的を条件に、各商品コードが出る確率も点数に含めます。
  - name: 比較
    formula: score = 決定の得点 + 商品の得点
    explanation: βは加点の強さを決めます。特定の商品を必ず表示する条件ではありません。
