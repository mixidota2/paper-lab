status: published
summary: 届いた在庫を一度に配る場合と、到着のたびに配る場合で、拠点ごとの最終在庫は同じになるか。著者は一致する条件を示した。未知の商品と別の期間を使ったオフライン評価では、過去の運用を模した比較方策より、需要を満たした数量当たりの配送・移送費用が5.0%低かった。
question: 入荷を一度に配ったときと、到着のたびに配ったときで、拠点ごとの最終在庫が一致する条件は何か。
verification:
  mechanism: PARTIAL
  performance: NOT TESTED
  scaling: NOT TESTED
  production_applicability: NOT TESTED
core_idea:
  author_claim: 凸な区分線形（PWL）の残差関数に、配置後の累積在庫にかかる項（状態ポテンシャル）を加える。計画でも到着ごとの配置でも、この同じ式で在庫を評価する。滑らかな価値関数では、固定環境でPCSPが成り立つことが、分け方によらず結果が一致するための必要十分条件になる。
  research_bot_interpretation: 長期費用から在庫を評価する式を学び、到着のたびに制約を守って最適な配置を求める。発注量を決める研究や、決めた行動を制約内に収める研究とは、決める内容が異なる。
sections:
  overview: Amazon SCOTの著者らは、拠点ごとの配置後の在庫を評価するState-proxを提案した。区分線形の残差と強凸な状態ポテンシャルを足し、計画と実行で同じ評価式を使う。未知の商品と別の期間を使うオフライン評価で、過去の運用を模した比較方策の費用を1とするとSCPUTは0.950、5.0%低かった。現場のA/Bテストではない。
  problem: この研究が決めるのは、届いた在庫をどの拠点へ何個置くかだ。DeepStockやORPRが決める仕入れ数量とは異なる。計画側は数日ごとに、その後の費用を見積もる式を実行側へ渡す。実行側は到着のたび、そのときの費用と制約も踏まえて置き先を決める。学習時に入荷をまとめると、実行時に小分けにした配置と最終在庫が食い違う場合がある。
  why_it_might_work: '【Labの解釈】各回の移動量に曲率を足すより、配置後の累積在庫に曲率を持たせれば、同じ価値関数を何回の実行にも使える。ただし強凸性が保証するのは解の一意性だ。分割回数に依存しないためには、入荷量を増やしたとき各拠点の最適在庫が減らないという追加条件が要る。


    論文は滑らかな価値関数に対するPCSPの必要十分条件と、PWLの特定の入れ子構造に対する保証を分けている。実験の密な符号付き結合は後者の保証対象外で、整合性は実測した。'
  evidence: '一次資料の[提供PDF](https://arxiv.org/pdf/2609.23242)の§6、表1、図4。100万商品超の基礎データを用い、52週間の運用をオフラインで追った。学習に含まれない商品と別の期間を同時に使って評価した。


    |方策|学習内SCPUT|学習外SCPUT|

    |---|---|---|

    |歴史的運用の代理|1.000|1.000|

    |Direct neural RL|0.881 ± 0.007|1.012 ± 0.002|

    |State-prox＋状態ポテンシャル|0.851 ± 0.022|0.950 ± 0.028|

    |同じState-prox残差から状態ポテンシャルを除去|0.933 ± 0.028|1.070 ± 0.038|


    ±は学習を繰り返したときの標準偏差。SCPUTは充足数量当たりの配送＋移送費用で、容量価格ペナルティを除く。学習時の費用摂動μ=1.349、評価時μ=0。μ=0でも切断正規摂動は消えない。PWL方策はGurobiに再構成して評価した。


    図4の別実験は各分割で5,000 item-weeksを使い、学習μ=0、K=500の学習外TVはState-prox 0.00201、neural 0.12716。厳密な不変性や費用後悔の測定ではない。'
  executable_understanding: '図3・付録C.1の2拠点例を解く。H=[[2,3],[3,5]]、a=(0,1)、線形費用0で、総入荷量2を1・2・5・20・500回に分ける。一度置いた在庫は戻せない。


    同じ初期在庫と総入荷量で、二つの比較例を試せる。一つは区分線形（PWL）の残差に、配置後の在庫にかかる二次の項を加える。もう一つは二次の項をその回に置く量にかける。総入荷量が同じなら一方の拠点への配置量から他方も決まるため、配置は一変数の凸最小化として二分探索で解ける。論文のState-proxソルバー、エントロピー型の項、逆伝播は実装しない。'
  results: 原論文の反例は、一括なら(2,0)、2回なら(1,1)。TVは0.5となる。分離可能PWL＋二次状態ポテンシャルの例は500回まで浮動小数点誤差の範囲で一致した。これは保証が適用できる簡単な族の確認であり、学習済みの密な結合へ拡張できない。
  what_we_verified: '**CONFIRMED — 図3の反例**：正定値Hの下でも配置が一致しないこと、H⁻¹1=(2,−1)の負成分と減少する経路の対応を確認した。


    **PARTIAL — 状態ポテンシャル**：分離可能なPWL残差と二次potentialだけを数値確認した。独自の行動正則化との比較は論文表1の再現ではない。'
  what_we_did_not_verify: '**NOT TESTED**：RL学習、State-proxの陰関数微分、Gurobiへの再構成、0.950という費用改善、100万商品への規模、現場導入。入荷と入荷の間に需要や費用が変わると生じる配置差は、論文でも解決していない。PCSPの定理は、連続量を一つの総量配分制約の下で割り振り、環境が一定の場合に限る。'
  method: method.md
  mapping: mapping.md
  implementation: '`UV_CACHE_DIR=/tmp/uv-cache uv run --no-project papers/proximal-residual-value-inventory-placement/run.py`でresults.jsonを再生成する。Python標準ライブラリのみ。乱数・外部データ・GPUは使わない。


    HTMLはlab.yaml、method.md、mapping.md、run.py、results.jsonから生成する。README.mdは読み方と再実行手順をまとめる。図の生成元はpaper_lab/inventory02.py。公式実装は未実行。'
teaching_figures:
- id: proximal-equations
  kind: equations
  after: method
  title: 各回の配置量と、配置後の在庫を分けて考える
  source: https://arxiv.org/abs/2609.23242
  locator: Equations (6)–(10); Figures 2–3
  caption: 一次資料の式を説明用に書き直した。下の小実験は限定した条件で対応関係を確かめる。
  rationale: 式の変数と図の操作を結び付ける。
  steps:
  - name: 価値関数
    formula: Vη(x) = Σᵢ fᵢ(xᵢ) + Σℓ hℓ(wℓᵀx) + τΣᵢ φ(xᵢ)
    explanation: 前半が学習する凸PWL残差。後半が強凸な状態ポテンシャル。主実験はφ(x)=x log x。
  - name: 実行時の配置
    formula: 'min { cᵀz + Vη(I+z) : z≥0, 1ᵀz=B }'
    explanation: 到着量Bを配り、I+zを次の実行の下限にする。図で経路を進むと置いた在庫を戻せない。
  - name: PCSP
    formula: dx*A/dB = H_A⁻¹1_A / (1_AᵀH_A⁻¹1_A);  H_A⁻¹1_A ≥ 0
    explanation: 滑らかな価値関数と正定値のヘッセ行列を前提とし、費用などを固定する。強凸性だけでは、分子の各成分が0以上とは言えない。
- id: placement-map
  kind: matrix
  after: why_it_might_work
  title: 買う量・置く場所・生産制約を分ける
  caption: Labの解釈。異なる意思決定を補完関係として並べた。
  source: https://arxiv.org/abs/2609.23242
  locator: Sections 2–5; related primary-source Labs
  rationale: 配置を補充数量の成果と誤読させない。
  columns:
  - 意思決定
  - ORと学習の接点
  rows:
  - label: Proximal Residual
    cells:
    - 入荷をどこへ配置するか
    - 学習した凸目的を繰り返し解く
  - label: ORPR / DeepStock
    cells:
    - 何個補充するか
    - 最適化で作った学習用の答えと強化学習／方策に持たせる構造
  - label: Diff Projection
    cells:
    - 共有資材下の生産・在庫行動
    - 微分可能な射影と整数写像
