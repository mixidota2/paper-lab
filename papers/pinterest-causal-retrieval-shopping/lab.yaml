- kind: equations
  id: dr-residual
  title: 観測した側の予測誤差で、二つの予測の差を補う
  caption: e は呼ぶ側への割付確率、y は実際の割付、m は観測した結果である。呼んだ場合は μ₁ の誤差を使い、呼ばなかった場合は μ₀ の誤差を使う。
  source: https://arxiv.org/abs/2607.14161
  locator: Eqs. 3–10; §3.1
  rationale: 追加効果を学習する式と、本番で呼び出しを決める条件を分けて示す。
  after: method
  steps:
  - name: 補正値を求める
    formula: ψ = μ₁ − μ₀ + y(m−μ₁)/e − (1−y)(m−μ₀)/(1−e)
    explanation: 観測できた側の予測誤差を、割付確率で割って足し引きする。
  - name: 追加効果を学習する
    formula: L_DR = mean[ω_DR (τ−ψ)²]
    explanation: 論文は補正項の大きい例を補助損失から外す。合成例はこの処理を含まない。
  - name: 本番で呼ぶかを決める
    formula: 'SV: μ₁ > δ　／　DP: τ > δ'
    explanation: SVは呼んだ場合の予測値を使う。予測値の差を使うDPは診断に使う。
- kind: matrix
  id: offline-online
  title: しきい値を上げると候補を呼ぶ回数が減る
  caption: 基準モデルのSVで、呼び出し率の相対変化を比較した著者の結果（表4）。
  source: https://arxiv.org/abs/2607.14161
  locator: Table 4
