<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 610" role="img" aria-labelledby="title desc"><title id="title">同じ8件を比べる二つの方法</title><desc id="desc">Labの合成例です。同じ課題の8件を、環境別に比べるWithinと、環境を混ぜるCrossで標準化します。元の報酬は変わりません。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217661"/></marker></defs><rect width="440" height="610" rx="12" fill="#fafcf7"/><text x="20" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">同じ課題の出力8件（合成例）</text><rect x="20" y="55" width="400" height="128" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="83" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">Within：環境別に標準化</text><text x="34" y="112" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">A：4件とも成功。係数はすべて0</text><text x="34" y="137" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">B：成功1件、失敗3件</text><text x="34" y="162" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">Bの係数：+1.73／−0.58×3</text><rect x="20" y="240" width="400" height="128" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="268" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">Cross：AとBを一緒に標準化</text><text x="34" y="297" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">成功5件と失敗3件を一組にする</text><text x="34" y="322" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">係数：成功+0.77、失敗−1.29</text><text x="34" y="347" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">Aの成功にも正の係数が付く</text><text x="20" y="434" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">出力と報酬は同じ。変えるのは比較群。</text><text x="20" y="459" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">二値報酬で、成功と失敗の符号が</text><text x="20" y="484" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">逆になる例ではない。Aの成功の係数が</text><text x="20" y="509" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">0から正に変わる。</text><text x="20" y="534" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">数値はrun.pyの固定出力8件から計算</text></svg>
