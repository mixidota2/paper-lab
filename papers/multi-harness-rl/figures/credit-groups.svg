<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 610" role="img" aria-labelledby="title desc"><title id="title">同じ軌跡、異なる比較群</title><desc id="desc">同じ軌跡、異なる比較群。説明と出典はLab本文と図注を参照。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217661"/></marker></defs><rect width="440" height="610" rx="12" fill="#fafcf7"/><text x="20" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">全て同じ課題の8軌跡（合成例）</text><rect x="20" y="55" width="400" height="128" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="83" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">Within：ハーネス別に標準化</text><text x="34" y="112" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">A：成功 成功 成功 成功 → 全て0</text><text x="34" y="137" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">B：成功 失敗 失敗 失敗</text><text x="34" y="162" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">Bのadvantage：+1.73 / −0.58×3</text><rect x="20" y="240" width="400" height="128" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="268" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">Cross：AとBを一緒に標準化</text><text x="34" y="297" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">成功5件 / 失敗3件で一群</text><text x="34" y="322" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">成功：+0.77、失敗：−1.29</text><text x="34" y="347" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">Aの成功にも正の係数が付く</text><text x="20" y="434" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">経験の種類は同じ。変わるのは比較群。</text><text x="20" y="459" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">二値報酬では、成功↔失敗の符号が</text><text x="20" y="484" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">逆転する例ではない。ゼロから正への</text><text x="20" y="509" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">変化に注目する。</text><text x="20" y="534" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">数値：run.py の固定trajectoryから計算</text></svg>
