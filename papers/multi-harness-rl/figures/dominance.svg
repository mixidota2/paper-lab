<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 249" role="img" aria-labelledby="title desc"><title id="title">平均solve rateの変動幅</title><desc id="desc">平均solve rateの変動幅。説明と出典はLab本文と図注を参照。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217661"/></marker></defs><rect width="440" height="249" rx="12" fill="#fafcf7"/><text x="20" y="28" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">平均solve rateの変動幅</text><text x="20" y="54" font-family="sans-serif" font-size="16" font-weight="normal" fill="#193b36">0 → 5 倍（ゼロ起点）</text><text x="20" y="87" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">評価ハーネスの最大／最小</text><rect x="20" y="98" width="350" height="16" rx="8" fill="#e5e9e3" stroke="none"/><rect x="20" y="98" width="301.0" height="16" rx="8" fill="#217661" stroke="none"/><text x="375" y="113" font-family="sans-serif" font-size="16" font-weight="normal" fill="#193b36">4.3</text><text x="20" y="164" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">訓練レシピの最大／最小</text><rect x="20" y="175" width="350" height="16" rx="8" fill="#e5e9e3" stroke="none"/><rect x="20" y="175" width="81.2" height="16" rx="8" fill="#217661" stroke="none"/><text x="375" y="190" font-family="sans-serif" font-size="16" font-weight="normal" fill="#193b36">1.16</text></svg>
