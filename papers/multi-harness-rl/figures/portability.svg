<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 610" role="img" aria-labelledby="title desc"><title id="title">学習から外した環境での比較</title><desc id="desc">論文はSWE-Gymで学習し、SWE-bench Verifiedの課題で評価しました。学習から外した一つの環境でCrossとWithinを比較します。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217661"/></marker></defs><rect width="440" height="610" rx="12" fill="#fafcf7"/><rect x="20" y="20" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="48" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">学習：SWE-Gym</text><text x="34" y="77" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">4環境で集めた同じ記録を使う</text><text x="34" y="102" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">同じ学習済みモデルから2方法を試す</text><path d="M220,124 L220,150" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="160" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="188" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">評価：SWE-bench Verified</text><text x="34" y="217" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">500課題を学習時の4環境と未見環境で</text><text x="34" y="242" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">同じ採点器が非公開テストで判定</text><path d="M220,264 L220,290" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="300" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="328" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">学習から外した1環境で比べる</text><text x="34" y="357" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">8試行：Cross−Withinは+0.25ポイント</text><text x="34" y="382" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">95%信頼区間：−0.48〜+1.02</text><text x="20" y="453" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">学習時の環境では、相性も点数に表れる。</text><text x="20" y="478" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">未見環境での上積みは確認できなかった。</text><text x="20" y="503" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">区間には小さな正負の差も含まれる。</text><text x="20" y="528" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">二つの方法が同等とは言えない。</text></svg>
