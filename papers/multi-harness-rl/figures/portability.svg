<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 610" role="img" aria-labelledby="title desc"><title id="title">未見ハーネスの試験設計</title><desc id="desc">未見ハーネスの試験設計。説明と出典はLab本文と図注を参照。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217661"/></marker></defs><rect width="440" height="610" rx="12" fill="#fafcf7"/><rect x="20" y="20" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="48" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">学習：SWE-Gym</text><text x="34" y="77" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">4 source harness → 同じmanifest</text><text x="34" y="102" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">同じSFT checkpoint → Within / Cross</text><path d="M220,124 L220,150" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="160" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="188" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">評価：SWE-bench Verified</text><text x="34" y="217" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">500課題・source 4種＋未見weak-ReAct</text><text x="34" y="242" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">全checkpointを同じsealed oracleへ</text><path d="M220,264 L220,290" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="300" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="328" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">未見での差を測る</text><text x="34" y="357" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">k=8：Cross−Within = +0.25 pp</text><text x="34" y="382" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">95% CI [−0.48, +1.02]</text><text x="20" y="453" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">sourceでの改善は構成への適応も含む。</text><text x="20" y="478" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">未見で追加効果は検出されなかった。</text><text x="20" y="503" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">区間は小さい正負の効果を許し、</text><text x="20" y="528" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">同等性を証明した結果ではない。</text></svg>
