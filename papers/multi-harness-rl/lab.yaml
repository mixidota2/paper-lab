  steps:
  - name: Within
    formula: A = (r − μ_task,harness) / (σ_task,harness + ε)
    explanation: 同じ課題、同じハーネスの中で報酬を標準化する。
  - name: Cross
    formula: A = (r − μ_task) / (σ_task + ε)
    explanation: 同じ課題の全ハーネスを一群にする。
