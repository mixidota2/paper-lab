question: 同じ学習データでも、異なる実行環境の報酬を一緒に比べると、学習に使わなかった環境で成功しやすくなるか
summary: 同じ四つの実行環境で集めた記録を使い、報酬を同じ環境内で比べる方法と、環境をまたいで比べる方法を評価しました。学習に使わなかった一つの環境では、平均成功率の差は0.25ポイントでしたが、95%信頼区間は差がない場合を含みます。一方、評価する環境を変えた比較では、環境別の平均成功率は2.14〜9.27%でした。
