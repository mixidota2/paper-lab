core_idea:
  author_claim: |-
    著者は複数の実行環境で集めたデータを両方の方法に渡し、学習で報酬を比べる範囲だけを変えました。環境をまたいで比べるCrossの更新係数からは、記録を集めた環境をある程度当てられました。一方、学習に使わなかった一つの環境で、同じ環境内だけで比べるWithinより成功率が高くなるとは確認できませんでした。

    [一次資料：arXiv v1 本文](https://arxiv.org/html/2609.04518v1)
  research_bot_interpretation: Harness-Benchは評価に使う実行環境の違いを扱います。この論文はさらに、学習でどの記録を同じ比較群に入れるかを調べます。結果はQwen3-8Bと今回の実行環境で比べたもので、複数の環境の記録を学習に使うこと自体の効果は否定していません。
sections:
  overview: |-
    著者は、コード修正を学習するエージェントが、訓練に使わなかった実行環境でも同じように働けるかを調べました。二つの学習方法には、同じ複数の環境で集めた実行記録を渡しました。変えたのは、強化学習で同じ環境の結果どうしを比べるか、異なる環境の結果も一緒に比べるかです。

    学習に使わなかった環境で1課題を8回ずつ試した比較では、環境をまたいで結果を比べたモデルの平均成功率が0.25ポイント高くなりました。ただし95%信頼区間は−0.48から+1.02ポイントで、差がない場合を含みます。一方、24,000件の評価では、評価する環境によって平均成功率が2.14%から9.27%まで変わりました。前者は学習方法を変えた差、後者は評価環境を変えた差です。
  problem: |-
    同じエージェントでも、コードを編集する道具、観測の形式、文脈の保持、再試行の規則が変わると、課題の成功率が変わることがあります。論文は、このような道具と実行手順をまとめた環境をハーネスと呼びます。

    学習方法を考えるときは、どの環境で記録を集めるかと、強化学習でどの記録どうしの報酬を比べるかを別々に決めます。二つを同時に変えると、結果の差が記録の違いから出たのか、比べ方から出たのかを切り分けられません。
  method: method.md
  why_it_might_work: |-
    同じ課題の報酬を環境をまたいで比べると、元の環境によって成功しやすさが違う場合、その違いも更新係数に反映されます。学習がその環境で報酬を得やすい行動に寄る可能性があります。ただし、更新係数から環境を当てられることと、環境の情報が他の環境での成功を妨げることは別です。
  evidence: |-
    ### 評価に使う環境を変えた比較

    [一次資料の§4、表1](https://arxiv.org/html/2609.04518v1)では、6つの学習条件、記録の収集に使った4環境、500課題、課題ごとに2試行を掛け合わせ、計24,000回の実行を試みました。隔離した採点器が使える判定を返した割合は99.1%です。基盤の失敗はモデルの不正解に数えず、各環境の比較は6条件すべてで採点できた課題に限ります。

    評価する環境ごとの平均成功率は2.14%から9.27%で、差は7.13ポイント、最大は最小の約4.3倍です。学習条件ごとの平均は5.55%から6.46%で、差は0.91ポイント、最大は最小の約1.16倍でした。比は各軸の最大値と最小値から求めたもので、各要因が結果のばらつきを何割説明したかは示しません。表5の別モデルでは環境を替えたときの変化も異なり、環境の良し悪しをモデルと無関係に順位付けできるとは限りません。

    ### 学習に使わなかった一つの環境での比較

    同じ課題を8回ずつ試したとき、1試行あたりの平均成功率はCrossがWithinより0.25ポイント高く、課題を対応させた95%信頼区間は−0.48から+1.02ポイントでした。これは8回のうち1回でも成功した課題の割合ではありません。別の集計で、3通りの乱数シードで学習し、1課題を4回ずつ試すと、差は+0.16ポイント（95%信頼区間：−0.41から+0.72）でした。表4にある主比較のモデルで4回ずつ試した+0.58ポイントとは異なる集計です。

    どちらの区間もゼロを含みます。今回の環境では上積みを確認できませんでしたが、小さな正負の差は残り得るため、同等だと証明したわけではありません。Crossの学習データの後半だけを、その時点の方策で集め直した補助実験でも、追加改善は確認できませんでした（§5、表2–4）。すべてのデータを学習中の方策で集める方法まで比べたわけではありません。

    ### 更新係数に残る環境の情報

    著者は学習に使った183課題・5,543試行で、更新係数だけを見せた分類器に四つの環境のどれで記録を集めたかを当てさせました。学習と評価で同じ課題を共有しないように分け、各方法で課題内の環境ラベルを混ぜた場合と比較しました。正答率は、ラベルを混ぜた場合よりCrossで4.48ポイント（95%信頼区間：+3.22から+5.83）、Withinで0.02ポイント（−0.38から+0.46）高くなりました。係数が0の記録はWithinで55.1%、Crossで0.0%でした。報酬そのものが0だった記録の割合ではありません。

    これは環境によって成功・失敗が異なる課題を集めた学習用の記録を分析した結果で、未見の課題で行った評価ではありません。係数に環境の情報があることは確かめましたが、それが別の環境での成功を妨げた原因だとは言えません（§6、表7・9）。
  executable_understanding: |-
    Labは「値2を返す」という同じ課題の出力を8件用意します。Aはテキスト、BはJSON、学習に使わない想定の形式はXML風の文字列だけを正解にします。元の形式で採点するとAの4件はすべて成功し、Bの4件は1件だけ成功します。同じ報酬から、WithinとCrossで各出力の係数を計算します。標準偏差は、平均からの差を二乗して群の全件数で平均し、その平方根を取ります。

    次に8件すべてを、受け付ける形式だけを変えて採点します。方策は更新しません。測定前後の出力が同じなので、未見形式での成功数も設計上変わりません。論文で学習後に測った結果を再現したわけではありません。
  results: |-
    WithinではAの係数がすべて0になるため、0でない係数を持つのはBの4件だけです。CrossではAとBの8件を一緒に計算し、8件すべてに0でない係数が付きました。比較前の成功・失敗は変えていません。

    同じ8件を別々の形式で採点したところ、Aで5件、Bで1件、XML風の未見形式で0件が正解でした。学習をしない比較なので、未見形式で0件のままだったことから、新しい環境への適応については判断できません。
  what_we_verified: 同じ記録と報酬でも、比較する範囲を変えると0でない係数の数が変わることを、合成例で確かめました。別の確認では、同じ出力でも、採点が受け付ける形式を変えると成功数が変わりました。
  what_we_did_not_verify: LLMをGRPOで学習したり、SWE-benchの課題を隔離環境で採点したりしていません。実際の環境への適応、学習の乱数による差、未見環境への移植性は未検証です（NOT TESTED）。三つの形式の合成例からハーネス一般の優劣は判断できません。
  implementation: |-
    リポジトリのルートでは `uv run papers/multi-harness-rl/run.py` を実行します。配布したスクリプトだけを使う場合は、保存したフォルダで `python run.py` を実行します。Pythonの標準ライブラリだけで動き、同じフォルダの `results.json` に結果を書き出します。出力文字列は固定で、乱数は使いません。
  mapping: mapping.md
