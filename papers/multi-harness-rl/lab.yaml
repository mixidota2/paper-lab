teaching_figures:
- kind: equations
  id: group-equations
  title: 更新係数を求める比較群
  after: method
  caption: 更新係数は報酬と比較群の平均との差で決まります。異なる環境を混ぜると、環境ごとの成功率の違いが係数に反映されることがあります。
  source: https://arxiv.org/pdf/2609.04518v1
  locator: §3
  rationale: 同じ報酬でも、平均との差を求める範囲を変えると、係数が変わることがあります。
  steps:
  - name: Within
    formula: A = (r − μ_task,harness) / (σ_task,harness + ε)
    explanation: 同じ課題を同じ環境で試した記録だけで平均と標準偏差を求めます。
  - name: Cross
    formula: A = (r − μ_task) / (σ_task + ε)
    explanation: 同じ課題なら環境が違う記録も混ぜて、平均と標準偏差を求めます。
