question: 売れない日が多い商品で、売れる頻度と売れた日の数量をどう予測するか
summary: MușatとCăbuzのSwitch-Hurdleは、1個以上売れる確率と、売れた日の数量の分布を分けた。M5ではWRMSSEがTSMixerの0.6403に対して0.6307だった。誤差の指標によって順位は変わり、欠品や在庫費用は評価していない。
