  scope: 初版の図1と式2〜3・8〜14でモデルの計算を確認し、表4・5で日別数量の予測誤差を照合した。図4・5は学習後の振り分けを検証データで集計した結果として扱う。
core_idea:
  author_claim: 著者のモデルは、過去の各日の入力を1つの処理ネットワーク（expert）に渡す。モデルはその送り先を学習する。デコーダーは前日の予測と、その日に分かっている情報を使い、売上がゼロでない確率と、売れた日の個数の分布を別々に出す。個数の分布は、負の二項分布から0個を除いて作る。
  research_bot_interpretation: 売れる頻度と売れたときの数量を分けると、全日の平均が同じでも、どちらが変わったかを説明できる。一方、著者の比較は数量の予測誤差が対象であり、発注条件を与えて欠品や在庫費用を比べたわけではない。
sections:
  overview: |-
    MușatとCăbuzは、売れない日が続く商品の販売数を、1個以上売れる確率と、売れた日に何個売れるかの二つに分けて予測しました。著者のSwitch-Hurdleは、過去の各日の情報を処理するネットワークを一つ選び、その結果を使って先の日を順に予測します。著者は、M5と社内データで、過去56日から次の28日の日別数量を予測しました。

    M5では、複数の集計単位の誤差を重み付きでまとめたWRMSSEが0.6307で、TSMixerの0.6403より小さくなりました。社内データ全体のWAPEも、Switch-Hurdleの53.99%がTFTの55.60%より小さい一方、MASEはTFTの方が小さい結果でした。著者が比べたのは予測誤差で、欠品や在庫費用が改善したかは調べていません。
  problem: 著者は商品・店舗ごとの日別数量をM5の30,490系列、社内データの約40,000系列で比較した。平均の販売数量だけでは、売れない日がどれくらいあるか、売れた日に何個売れるかを区別できない。
  why_it_might_work: 1個以上売れる確率と、売れた場合の数量の分布が別なら、一方だけが変わった場合を表せる。過去の情報を処理するネットワークは、著者が需要の区分で固定したのではなく、モデルが選び方を学習した。
  evidence: |-
    一次資料は[原論文の表4・表5・図4〜5](https://arxiv.org/pdf/2602.22685v1)である。M5のWRMSSEは、Switch-Hurdleが0.6307、TSMixerが0.6403、TFTが0.6932、DeepARが0.7895だった。一方、RMSEはSwitch-Hurdleの2.4744よりPatchTSTの2.4562が小さく、MASEはSwitch-Hurdleの0.8992よりTFTの0.8983が小さかった。社内全データではWAPEが53.99%と55.60%でSwitch-Hurdleの方が小さく、MASEが0.5865と0.5803でTFTの方が小さかった。予測誤差の比較から、確率が実際の発生頻度にどの程度合うかや、欠品・在庫費用への効果は判断できない。

    著者は検証データで、学習後のモデルがどのネットワークを選んだかを調べた。第0層では、数量がゼロの入力の67.5%をネットワーク3に送り、少量の入力の90.8%と急増の入力の94.0%をネットワーク1に送った。各割合の分母はその数量区分の入力数であり、全入力に占める割合ではない。
  executable_understanding: |-
    リポジトリの最上位で `uv run papers/switch-hurdle-intermittent-demand/run.py` を実行すると、Pythonの標準ライブラリだけで同じフォルダーの `results.json` を作り直せる。

    教材では、負の二項分布の元の平均μとばらつきαを固定し、売れる確率p⁺を0.1、0.5、0.9に変える。各数量の確率を足して合計が1になることを確かめ、売れた日の平均と全日での平均を比べる。p⁺を0.5に固定してμを6に変えた例もある。
  results: 元の負の二項分布をμ=2、α=0.5とすると、0個の確率は0.25である。0個を除いた平均は約2.6667個。売れる確率p⁺を0.5にすると、売れない日も含む平均は約1.3333個になる。p⁺だけを変えても、売れた日の平均は変わらない。
  what_we_verified: Labは、人工例で確率の合計が1になることと、売れる確率だけを変えても売れた日の分布が変わらないことを確かめた（CONFIRMED）。モデルを学習させず、分布を組み立てる計算だけを再現した（PARTIAL）。
  what_we_did_not_verify: Labは、振り分け器の学習、各ネットワークの役割、デコーダーの予測、M5での性能を追試していない。規模を広げた場合や、本番での利用、欠品・充足率・在庫費用への効果は未検証である（NOT TESTED）。
  implementation: '`nb()` は通常の負の二項分布、`hurdle()` は売れる確率を別に設定した分布を計算する。後者は0個以外の確率を1−P_NB(0)で割ってからp⁺を掛ける。スクリプトは0〜999個で確率の合計と平均を照合し、図は0〜20個とその外に残る確率を表示する。'
  method: method.md
  mapping: mapping.md
teaching_figures:
- kind: equations
  id: hurdle
  title: 売れる日の個数を求めるときは、元の分布から0個を除く
  locator: Figure 1; Eqs. (8)–(14)
  after: method
  rationale: 0個の日と売れた日の数量に、確率をどう配るかを示す。
  caption: p⁺は1個以上売れる確率、p₀は元の負の二項分布で0個をとる確率。二つは別の値である。
  steps:
  - name: 売れない日の確率を求める
    formula: P(Y=0) = 1 − p⁺
    explanation: モデルが出した売れる確率p⁺を1から引く。
  - name: 売れた日に何個売れるかを求める
    formula: P(Y=y>0) = p⁺ NB(y; μ,α) / (1−p₀)
    explanation: 元の分布から0個を除き、残った確率を1−p₀で割って合計を1にする。全日での確率に直すため、p⁺を掛ける。
  - name: 売れた日の平均と、すべての日の平均を分ける
    formula: E[Y|Y>0] = μ/(1−p₀), E[Y] = p⁺μ/(1−p₀)
    explanation: μは0個を含む元の分布の平均。売れた日の平均はμを1−p₀で割り、すべての日の平均にはさらにp⁺を掛ける。
  source: https://arxiv.org/pdf/2602.22685v1
- kind: logic
  id: routing
  title: 振り分け器は過去の入力を一つの処理ネットワークに送る
  locator: Figure 1; Eqs. (2)–(3)
  after: method
  rationale: 履歴の処理と、次の日の数量を予測する処理を分けて示す。
  caption: 式は原論文の考え方を示す。Labはモデルの振り分け器やデコーダーを学習していない。
  rows:
  - label: 過去の情報をまとめる
    nodes:
    - title: 振り分け器が送り先の確率を出す
      text: p = softmax(Wg x)
    - title: 学習では、選ぶ前の確率も使う
      text: g = one_hot(argmax p) + p − stopgrad(p)
    - title: 選んだネットワークが入力を処理する
      text: 推論では、モデルは選んだ一つのネットワークだけを実行する。
  - label: 日別に予測する
    nodes:
    - title: 前日の予測を使って次の日に進む
      text: デコーダーは、前日の予測、その日の既知の特徴、エンコーダーがまとめた履歴を使う。
    - title: 売れる確率と、売れた日の数量を出す
      text: モデルはp⁺と、負の二項分布を作るμ、αを出す。
  source: https://arxiv.org/pdf/2602.22685v1
