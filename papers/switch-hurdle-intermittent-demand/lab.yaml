question: |-
  売れない日が多い商品で、売れる確率と売れた日の数量をどう予測するか
summary: |-
  Switch-Hurdleは、1個以上売れる確率と、売れた場合の数量分布を別々に予測する。M5では、複数の集計単位の予測誤差をまとめたWRMSSEが0.6307だった。ほかの指標では最良ではないものもあり、在庫費用や欠品への効果は調べていない。
