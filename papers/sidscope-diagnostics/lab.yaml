question: SIDの対応表を受け取ったら、学習を始める前に何を確かめるか
summary: SIDScopeは、商品と識別子（SID）の対応表を点検する道具です。候補に正解のSIDが残っても、同じSIDを持つ別の商品と区別できるとは限りません。対応表を直したあとに旧モデルを使えるかも、別の検査で確かめます。
