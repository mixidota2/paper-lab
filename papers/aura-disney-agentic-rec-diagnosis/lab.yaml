core_idea:
  author_claim: AURAは似た失敗をまとめ、どのセッションがその説明の根拠になったかを示します。さらに推薦を作るコードや特徴量、学習の処理と照らし合わせて修正案を作り、参照先を確認します。技術者は各工程で根拠を確認できます。
  research_bot_interpretation: '[AgentX](agentx-kuaishou.html)が改善コードを探し、[DREAM](dream-taobao-agentic-control.html)が推薦を実行中に制御し、[PILOT](pilot-experiment-lifecycle.html)が推薦実験を進め、[CORAL](coral-meta-config-harness.html)が実行基盤の設定を探すのに対し、AURAはその前にどんな失敗を調べるかを決めます。失敗の説明がもっともらしくても、修正で利用者に合う推薦が増えるかは別の評価が必要です。'
sections:
  overview: |-
    AURAは動画配信サービスで、推薦が合わなかった場面を調べ、技術者が修正を検討できる形にまとめます。上流の判定モデルは2サービスでそれぞれ約10万件の利用セッションを評価します。AURAが詳しく調べるのは、そのうち判定モデルが問題ありとしたセッションです。似た失敗をまとめ、どの記録やコードを根拠に修正を提案したかを示します。

    著者は一方のサービスで、好みのジャンルと推薦が合わない1,911件を対象に、二つの修正案をオフラインで評価しました。どちらも対象のセッションで順位付けを改善せず、全体の指標も反復実験のばらつきとされた±0.1%の範囲でした。原因候補を調べて修正案を作った事例であり、推薦の改善を確認して本番に出した事例ではありません。
  problem: |-
    全体の順位指標が同じでも、好みと違うジャンルの作品を出した場合と、年齢に合わない作品を出した場合では対策が異なります。約10万件の記録すべてを一度にモデルへ渡せないため、著者はまずセッションごとの判定を使って対象を絞りました。

    最初の判定モデルは、サービスAの96,801件のうち18,901件、Bの101,594件のうち4,154件を問題あり（BAD）としました。AURAが詳しく読むのはこの集合なので、最初の判定で見逃した失敗は診断から漏れる可能性があります。判定の指示はサービスごとに異なり、Bでは調査の途中でも改訂しました。両サービスのBADの割合から、どちらの推薦が優れているかは判断できません。
  why_it_might_work: |-
    似た失敗をひとまとめにすると、詳しい分析に使うモデルに全件を渡さずに済みます。コードを読む前に、どの利用者のどんな記録を説明したいかを決めておくと、なぜその修正を提案したかを技術者が確認できます。

    一方、既存の分類と抽出条件に合わない問題は見落とすことがあります。発生頻度が低くても安全上見過ごせない問題を別に残し、最初にセッションを評価したモデルの判断も点検する必要があります。小売の推薦に応用する考え方はありますが、論文は動画配信の事例で、移植の効果は計測していません。
  evidence: |-
    ### 診断などの出力が満たした基準

    [一次資料の§4と表1–5](https://arxiv.org/html/2609.16625v1)によると、分類からコードの提案までの出力を25項目で評価した結果、基準を満たした数はサービスAで15から23、Bで17から24に増えました。抽出の工程自体は採点対象ではありません。著者は処理の構成やモデルへの指示を見直し、その間も同じ評価基準を使いました。推薦の精度や利用者の満足度を測った結果ではなく、未知の課題でも同じ改善が出るかは分かりません。

    最初のセッション判定を点検した際は、Claude Opus 4.6、GPT-5.5、Gemini 3.1 Proのうち2つ以上が元の判定を正しいとみなした割合が、Aで192/200件（96.0%）、Bで176/201件（87.6%）でした。工程ごとの出力を採点したのはGemini 3.1 ProとGPT-5.5です。人手による独立した正解ではなく、Gemini系を作業と採点の両方に使った影響も排除できません。正しいとみなす回答に偏るこの比較では、偶然の一致を補正する係数κは低い値でした。

    ### ジャンルの修正案を試した結果

    表2で好みと異なるジャンルの推薦に分類されたのは、BADのうちAで9,135件（48.3%）、Bで1,911件（46.0%）です。表に残ったいずれかの分類に入ったのは、Aで17,996/18,901件（95.2%）、Bで2,415/4,154件（58.1%）でした。サービス間で抽出基準は異なり、Aでは一つのセッションに複数の分類が付きます。

    著者はBの1,911セッションで二つの案をオフラインで試しました。一つは利用者と候補作品のジャンルの組み合わせを特徴量にする案で、もう一つは候補作品に応じて利用者のジャンル別視聴履歴の重みを変える案です。どちらも対象の順位付けを改善しませんでした。後者について、表3の3つの学習日では、比較用に複製した基準モデルに対する全体の相対差が、NDCG@10で−0.01%／+0.05%／+0.02%、Click AUCで+0.03%／+0.06%／+0.01%でした。どれも実行を繰り返したときの目安である±0.1%以内です。この範囲は信頼区間ではありません。著者は修正案を未実証の候補として残しました。

    ### 費用に含めた工程

    表5の全工程の費用はAが349.26ドル、Bが252.85ドルです。このうち、最初にセッションを判定する費用がAで320.98ドル、Bで250.21ドル、AURA部分がAで28.28ドル、Bで2.64ドルでした。診断1件あたり約43〜50ドルという値には、最初の判定も含まれます。最初の判定は観測した1セッションあたりの費用を全件に当てはめ、コードの提案は入力と変更案を基にOpus 4.6の料金から推定しました。すべての工程で実際に発生した課金を集計したわけではありません。
  executable_understanding: |-
    `uv run papers/aura-disney-agentic-rec-diagnosis/run.py`

    Labは人工の5分類に、割合が5%以上の分類を選ぶ規則を当てます。比較する規則では、上位2分類、100件以上の分類、安全上の問題に当たる分類も残します。次に、診断が挙げたセッションIDとファイル名を入力と照合します。著者はサービスBの改修前の試行で、モデルが架空のセッションIDを904件挙げたと報告しています。Labでは実データを使わず、架空のIDを1つ入れて調べます。

    別の合成例では、正の差0.0003、0.0006、0.0001の最大値を0.001と比べ、以下なら保留（`hold`）にします。差の絶対値を調べる関数ではなく、AURAの正式な採用基準でもありません。
  results: |-
    割合が5%以上という規則だけでは3分類が残りました。他の条件も加えると5分類が残り、その中には10件しかない年齢に関する分類も含まれます。これはLabの結果です。原論文のサービスBで割合だけを使うと2分類が残るという結果とは、入力が異なります。

    参照の検査では、入力にあるセッションIDとファイル名を挙げた例を通しました。架空のセッションID、架空のファイル名、セッション参照なしの3例は退けました。ここで調べるのは、参照が入力にあるかどうかです。参照先の内容が診断を裏付けるかまでは判定しないため、診断が正しいことや原因を特定できたことは示しません。
  what_we_verified: 仕組みの一部を確かめました（Mechanism PARTIAL）。人工の入力で、頻度が低い分類を残し、入力にない参照と根拠を挙げなかった例を退けました（参照の存在確認のみCONFIRMED）。
  what_we_did_not_verify: |-
    実際の視聴セッションの判定、原因の推定、判定モデル同士の一致、推薦モデルの学習、A/Bテストは試していません。診断出力が満たした項目数の増加は著者の報告です。性能、規模を拡大したときの挙動、実運用への適用は未検証です（NOT TESTED）。

    原論文は、ジャンルの修正案を今後も検討できる候補としています。候補を正式に却下したとまでは読めません。著者が報告した修正作業の自動化は、技術者が確認するプルリクエストを作るところまでです。
  implementation: |-
    `select()` は論文§3.3の抽出を簡略化し、`validate()` は§3.6の検査の一部を小さな入力集合で試します。著者の仕組みは過去の分類、仮説、修正と結果を次の調査に残しますが、Labは永続データベースやエージェントを実装していません。
  method: method.md
  mapping: mapping.md
