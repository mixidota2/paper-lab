core_idea:
  author_claim: 大量のsessionを階層的にまとめ、証拠付きの失敗分類からrankerのcode・feature・trainingに接続した修正案を作る。各段階で参照検証とengineer
    reviewを行う。
  research_bot_interpretation: '[AgentX](agentx-kuaishou.html)のcode探索、[DREAM](dream-taobao-agentic-control.html)の実行時制御、[PILOT](pilot-experiment-lifecycle.html)の実験運用、[CORAL](coral-meta-config-harness.html)の設定探索に、診断対象を決める前段を足す研究と読める。失敗の説明がもっともらしくても修正効果は別途確かめる必要がある。'
sections:
  overview: AURAの成果は「genreの問題を発見したから改善を出荷した」ことではない。約10万sessionをplatformごとに整理し、根拠となるsessionとcodeを辿れる修正案へ変換したことにある。genre
    mismatchの2修正は診断cohortで改善せず、全体の差も±0.1%のnoise内だった。論文は未実証の候補として扱う。
  problem: 集計NDCGが同じでも、家族向けcontentのsubgenre不一致と年齢に合わない推薦では対処が違う。全sessionを一つのLLM contextへ入れることもできない。Platform
    Aは96,801中18,901 BAD、Bは101,594中4,154 BAD。階層集約はこのBAD集合を詳しく調べるので、上流judgeが見逃した失敗が診断から落ちる可能性がある。
  why_it_might_work: '解釈: session→category→検証済みfindingへ圧縮すると、深い分析に使う高価なmodelの呼出しを減らせる。codeを読む前にcohortと失敗を決めることで、平均指標だけの探索より修正の理由が明確になる。ただし分類名と集約時の抽出条件が盲点を作る。低頻度の安全上の失敗を割合閾値で消さず、上流judge自身の誤りも検査する必要がある。'
  evidence: '一次資料の著者報告。


    [PDF §4、Tables 1–5](https://arxiv.org/pdf/2609.16625v1) の著者報告。25項目のGOOD数はA 15→23、B
    17→24。診断出力へのrubricであり、推薦の精度や人間の満足度ではない。同じrubricを使う反復改善なので、未見課題への一般化は別問題となる。


    上流judgeの検査にはClaude Opus 4.6、GPT-5.5、Gemini 3.1 Proの多数決を用い、rubric判定にはGemini 3.1
    ProとGPT-5.5を使う。LLM間の一致を独立した人間正解と同一視できない。Gemini系が上下流に現れる自己選好と、GOOD多数によるκの低さも本文で開示する。


    Genre Preference Mismatchは両面でBADの約46〜48%。Bの1,911 sessionでgenre cross featureとcandidate-aware
    attentionを試したが、診断cohortのrankingは改善しなかった。Table 3は3独立学習日の全体差で、NDCG@10 −0.01/+0.05/+0.02%、Click
    AUC +0.03/+0.06/+0.01%。


    費用はA $349.26、B $252.85（end-to-end）。そのうち上流judgeは$320.98/$250.21、AURA部分は$28.28/$2.64。約$43〜50/findingには上流judgeを含む。上流費用は観測単価の全sessionへの外挿、code
    suggestion費用はOpus 4.6の料金からの推定で、全項目が実測telemetryではない。'
  executable_understanding: '`uv run papers/aura-disney-agentic-rec-diagnosis/run.py`。人工カテゴリを割合のみとtop-N/count/割合＋safety例外で選び、証拠session・code
    pathが存在するかを検査する。noise内の差をholdにする例も示すが、この数値gateはLabの説明用で、AURAの公式出荷規則ではない。'
  results: 5%のみでは5カテゴリ中3つを残し、件数・safety例外を加えると5つが残る。10件のage問題が消えなくなる。架空session、架空path、証拠なしの3変異を拒否し、有効なfindingだけを通した。これは診断内容が正しいことや、genre問題の原因を推定できることの確認ではない。
  what_we_verified: Mechanism PARTIAL。低頻度category保持と参照の存在確認を人工入力で実行した。架空参照の拒否はCONFIRMED。診断品質のrubric上昇は著者報告でありLabではNOT
    TESTED。
  what_we_did_not_verify: Performance / Scaling / Production applicability NOT TESTED。session判定、因果推論、LLM間一致、実rankerの学習、A/Bを実行していない。提示メモの「出荷を拒否」は慎重に読む必要がある。原典は修正を未実証のopen
    candidateとし、現行システムの自動化範囲はengineer-reviewed PRまでである。
  implementation: '`select()`は§3.3の保持規則を単純化し、`validate()`は§3.6の参照検証を再現する。共通memoryは過去のcategory・仮説・修正・結果を蓄える設計だが、Labでは永続DBやagentを実装しない。診断と修正効果の検証が別契約であることを残す。'
