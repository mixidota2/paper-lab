question: 推薦を直す前に、どの利用者がどんな場面で困ったかを記録から説明できるか
summary: Disneyの研究チームは2つの動画配信サービスでそれぞれ約10万件の利用セッションを評価し、問題ありと判定した記録をAURAで分析しました。診断などの出力が満たした評価項目は、25項目中サービスAで15から23、Bで17から24に増えました。一方、ジャンルの修正案をオフラインで試しても、対象では推薦の順位が改善しませんでした。
