- kind: equations
  id: gdr-loss
  title: 検索用モデルが学ぶ三つの判断
  after: method
  locator: 図1・式4〜6
  caption: 原論文はDPO内の尺度と損失を足す重みの両方にβを使います。この図では損失の重みをλで表します。
  rationale: 商用順位を独立した回帰モデルで予測せず、DPOで生成確率を調整します。
  steps:
  - name: 生成
    formula: Lgen = −Σ log πθ(token | query, prefix)
    explanation: 関連ありとされた広告の検索意図と要約だけを、生成の正解に使います。非関連広告を学習全体から捨てるのではなく、関連性の判定には使うという区別です。
  - name: 関連性
    formula: Ldis = −[y log p̂ + (1−y) log(1−p̂)]
    explanation: 検索語に関連するかを、関連ありと関連なしの両方のラベルで学びます（式4）。
  - name: 商用順位
    formula: Ldpo = −log σ(β [log(πθ(yw|x)/πref(yw|x)) − log(πθ(yl|x)/πref(yl|x))])
    explanation: 広告ywをylより優先するように学習します（式5）。§4.1で優先順を決める基準は実際の広告費です。
  - name: 統合
    formula: Lmodel = λg Lgen + λd Ldis + λr Ldpo
    explanation: 三つの損失に重みを掛けて足します（式6）。Labはこの学習を実行していません。
  source: https://arxiv.org/pdf/2609.18296v1
