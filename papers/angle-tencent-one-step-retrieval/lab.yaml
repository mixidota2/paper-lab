sections:
  overview: TencentのANGLEは広告を「広い検索意図 × 商品を特定する短い語句」の組で索引化する。検索用のHunyuan-1Bは、組を生成し、検索語との関連性を判定し、商用価値の高い広告を優先するよう学習する。生成時には、配信できる広告がある組に候補を絞る。WTSの検索広告のA/Bテストで著者はGMV +2.16%を報告した。自然検索や通常の推薦全体を置き換えた研究ではない。
  problem: 従来の多段カスケード（MCA）では、候補の取得、関連性の判定、事前順位付け、最終的な順位付けを別々に最適化する。最初に落とした広告は、後段で商用価値が高いと分かっても候補に戻らない。広告に離散的な意味ID（SID）を付けて生成する方式では、IDと広告の対応を学ぶ必要がある。ANGLEは広告を読める語句にし、新広告を索引に追加する手順を用意する。
  why_it_might_work: 【解釈】広いintentだけでは商品を区別しにくく、商品名に近いabstractだけでは需要の広がりを拾いにくい。両者を組にすると、検索意図を保ちながら商品を絞れる。配信不可の枝を先に外すと、探索で保持できる候補数を有効な組に使える。検索語との意味の一致や商用価値はモデルが学ぶので、索引だけでは保証されない。
  evidence: '### WTSの広告消費額：表では+1.81%、本文では+1.18%


    表3では広告消費額（consumption）+1.81%、GMV +2.16%、クリック +1.50%、コンバージョン +1.44%、露出 +2.49%。§4.2によると、5日間・traffic 20%のA/Bテストだった。同節の広告消費額は+1.18%で、要旨・導入・表3の+1.81%と一致しない。Labでは表3の値を載せ、この違いも残す。信頼区間とp値の記載はない。露出数も増えたので、クリック数の増加からクリック率（CTR）が増えたとは言えない。


    ### 構成を変えたときのHR@100


    表4のHR@100はANGLE 0.5273、intentなし0.4645、abstractなし0.3519、DCBSなし0.2975、GDR-LLMなし0.4412。DCBSなしの構成は、自由に生成してから近似近傍探索（ANN）で近い組を探す。制約の有無だけを変えた比較ではない。表2で最も高かった比較方式はSimBert-v2-Gの0.3095。10,000クエリ、約220,000広告候補で評価し、実ログのクリックを使った。


    ### 「One-Step」で置き換えた範囲


    §4.2ではWTS/QBSのranking queueを補う形で導入した。Limitationsによると、動的クリエイティブ選択と自動入札は引き続き順位付けに依存する。広告側はHunyuan-13B、検索側はHunyuan-1B、beam 64、intentは最大3 token、abstractは最大4 token。§4.1の90 ms以内は生成にかかった時間で、リクエスト全体のend-to-end p99ではない。


    [一次資料：ANGLE v1 表2〜4・§4・Limitations](https://arxiv.org/pdf/2609.18296v1)'
  executable_understanding: '人工の5広告・4組を使い、固定スコアとビーム幅をそろえて比べる。一方はスコア順に組を選んでから配信不可の広告を外し、もう一方は配信できる広告がある組だけに絞ってから選ぶ。1組から複数広告を取得できることと、スコアを変えずに広告Fを索引へ追加できることも確かめる。token単位のDCBSは再現せず、組単位で上位k件を選ぶ。


    <div class="teaching" data-b21="angle"><h3>組を選ぶ前と後で、配信可否を切り替える</h3><p>合成例：AとEは配信不可。Forestの同じ組にB・Cが属する。</p><label>探索条件 <select><option value="0">beam 1 / 後段filter</option><option value="1">beam 1 / 事前filter</option><option value="2">beam 2 / 後段filter</option><option value="3">beam 2 / 事前filter</option><option value="4">beam 3 / 後段filter</option><option value="5">beam 3 / 事前filter</option></select></label><div data-output aria-live="polite"><div class="b21-cards"><div><strong>生成する組</strong><p>survival game / Winter</p></div><div><strong>解決した有効広告</strong><p>なし（0件）</p></div></div></div><script type="application/json" data-frames>["<div class=\"b21-cards\"><div><strong>生成する組</strong><p>survival game / Winter</p></div><div><strong>解決した有効広告</strong><p>なし（0件）</p></div></div>", "<div class=\"b21-cards\"><div><strong>生成する組</strong><p>survival game / Forest</p></div><div><strong>解決した有効広告</strong><p>B・C（2件）</p></div></div>", "<div class=\"b21-cards\"><div><strong>生成する組</strong><p>survival game / Winter → survival game / Forest</p></div><div><strong>解決した有効広告</strong><p>B・C（2件）</p></div></div>", "<div class=\"b21-cards\"><div><strong>生成する組</strong><p>survival game / Forest → mobile game / Winter</p></div><div><strong>解決した有効広告</strong><p>B・C・D（3件）</p></div></div>", "<div class=\"b21-cards\"><div><strong>生成する組</strong><p>survival game / Winter → survival game / Forest → mobile game / Winter</p></div><div><strong>解決した有効広告</strong><p>B・C・D（3件）</p></div></div>", "<div class=\"b21-cards\"><div><strong>生成する組</strong><p>survival game / Forest → mobile game / Winter</p></div><div><strong>解決した有効広告</strong><p>B・C・D（3件）</p></div></div>"]</script><p class="source-note">出所：run.pyの固定スコアとresults.json。JavaScript無効時はbeam 1・後段filterの結果を表示。</p></div>'
  results: ビーム幅1で先に組を選ぶと、配信できないAの組が残るため、取得できる広告は0件になる。先に配信可否を確認するとForestの組からBとCの2件を取得できる。同じ組にFを追加すると3件。ビーム幅3では両方式ともB・C・Dを取得した。差は人工例で配信不可にした候補とビーム幅に左右され、事前に絞ればいつでも改善するとは言えない。
  what_we_verified: CONFIRMED：1組から複数広告を取得する処理、事前に配信可否を調べて組を絞る処理、広告を索引に加えると取得結果が変わること。assertは4件とも通過した。PARTIAL：ANGLE全体の仕組み。生成モデルの出力は固定スコアで置き換えた。
  what_we_did_not_verify: NOT TESTED：Hunyuanの学習、関連性判定、DPO、token単位の動的な木の組み直し、新しい広告への意味的な汎化、実際の遅延、WTS/QBSのA/B。広告Fの組は手で指定したため、LLMが正しい組を生成できることは確認していない。著者の性能報告とLabの結果は別に扱う。
  implementation: リポジトリのルートで `UV_CACHE_DIR=/tmp/paper-lab-uv uv run papers/angle-tencent-one-step-retrieval/run.py` を実行する。Python標準ライブラリを使い、同じディレクトリの `results.json` を更新する。外部データ、GPU、乱数は使わない。
  method: method.md
