- kind: equations
  id: gdr-loss
  title: 生成・関連性・商用順位の教師信号を一つのモデルへ
  after: method
  locator: 図1・式4〜6
  caption: 原論文はβをDPO温度と損失重みで再利用するため、ここでは重みをλに置き換えた。
  rationale: 順位学習は独立した回帰ヘッドではなく、DPOによる生成確率の調整。
  steps:
  - name: 生成
    formula: Lgen = −Σ log πθ(token | query, prefix)
    explanation: 関連広告のintentとabstractを教師にする。非関連広告では生成損失をmaskする。
  - name: 関連性
    formula: Ldis = −[y log p̂ + (1−y) log(1−p̂)]
    explanation: 関連・非関連の教師でdiscriminatorを学習する（式4）。
  - name: 商用順位
    formula: Ldpo = −log σ(β [log(πθ(yw|x)/πref(yw|x)) − log(πθ(yl|x)/πref(yl|x))])
    explanation: 商用価値で優位な広告ywをylより優先する。§4.1では実消費額で並べる（式5）。
  - name: 統合
    formula: Lmodel = λg Lgen + λd Ldis + λr Ldpo
    explanation: 3つの重み付き損失を足す（式6）。Labではこの学習を実行しない。
  source: https://arxiv.org/pdf/2609.18296v1
