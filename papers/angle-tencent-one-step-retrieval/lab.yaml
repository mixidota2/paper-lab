question: 広告IDの代わりに検索意図と商品語を生成すると、どう広告を取得できるか
summary: TencentのANGLEは広告を「広い検索意図 × 商品を特定する短い語句」の組で索引化する。検索用のHunyuan-1Bは、組を生成し、検索語との関連性を判定し、商用価値の高い広告を優先するよう学習する。生成時には、配信できる広告がある組に候補を絞る。WTSの検索広告のA/Bテストで著者はGMV +2.16%を報告した。自然検索や通常の推薦全体を置き換えた研究ではない。
core_idea:
  author_claim: 階層的なテキスト索引、GDR-LLM、動的な制約付きビーム探索（DCBS）を組み合わせると、関連性と商用価値を考慮して広告を取得できる。
  research_bot_interpretation: 広告との対応をテキスト表現と索引の更新で扱い、生成が済む前に広告の配信可否を反映する設計と読める。SID全般より優れることや、多段カスケード全体を不要にできることは示していない。
