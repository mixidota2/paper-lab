question: 広告IDの代わりに検索意図と要約を生成すると、配信できる広告をどう取得できるか
summary: TencentのANGLEは、検索意図と広告の短い要約を組にして索引を引き、配信できる広告を取得します。WTSで著者が報告した流通総額は2.16%増えました。既存の精密ランキングは残るため、検索全体を置き換えた比較ではありません。
core_idea:
  author_claim: 著者は、テキストの組を引く索引、検索用のモデル、検索ごとに変わる探索の制約を組み合わせました。検索語と意味が合う組を生成し、配信できる広告を取得して精密ランキングに渡します。
  research_bot_interpretation: 広告と語句の対応は索引に持たせ、配信可否は組を生成し終える前に反映する設計です。意味IDを使うすべての方式より有効か、既存の精密ランキングが不要かは、この比較から分かりません。
