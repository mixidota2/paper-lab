- kind: equations
  id: gdr-loss
  title: 一つのモデルが生成・関連性・商用順位を学ぶ
  after: method
  locator: 図1・式4〜6
  caption: 原論文のβはDPOの温度と損失の重みを指す。この図では重みにλを使う。
  rationale: 順位は独立した回帰ヘッドでは予測しない。DPOで生成確率を調整する。
  steps:
  - name: 生成
    formula: Lgen = −Σ log πθ(token | query, prefix)
    explanation: 関連する広告のintentとabstractを正解として生成を学ぶ。非関連広告では生成損失を計算しない（mask）。非関連広告を学習全体から捨てるのではなく、関連性の判定には使う。
  - name: 関連性
    formula: Ldis = −[y log p̂ + (1−y) log(1−p̂)]
    explanation: discriminatorは関連・非関連のラベルから判定を学ぶ（式4）。
  - name: 商用順位
    formula: Ldpo = −log σ(β [log(πθ(yw|x)/πref(yw|x)) − log(πθ(yl|x)/πref(yl|x))])
    explanation: 商用価値が高い広告ywをylより優先する。§4.1では実消費額で順序を決める（式5）。
  - name: 統合
    formula: Lmodel = λg Lgen + λd Ldis + λr Ldpo
    explanation: 3つの損失を重み付きで足す（式6）。Labでは学習を実行しない。
  source: https://arxiv.org/pdf/2609.18296v1
