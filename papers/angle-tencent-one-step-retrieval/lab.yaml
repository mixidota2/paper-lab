sections:
  overview: TencentのANGLEは、広告を「広い検索意図 × 商品を特定する短い語句」で索引化する。検索側のHunyuan-1Bに生成・関連性判定・商用順位を学習させ、配信可能な広告に結び付く語句だけを生成する。WTSの広告A/BではGMV
    +2.16%を報告した。対象は検索広告だ。自然検索や通常の推薦全体を置き換えた研究ではない。
  problem: 従来の多段カスケード（MCA）では、候補取得、関連性判定、事前順位付け、順位付けを別々に最適化する。早い段階で落ちた広告は、後段で商用価値が高いと分かっても戻せない。一方、離散的な意味ID（SID）を生成する方式は、IDと広告の対応を学ぶ負担がある。ANGLEは広告の内容を読めるテキストにし、新しい広告を索引へ追加する経路を用意する。
  why_it_might_work: 【解釈】広いintentだけでは商品を区別しにくく、商品名に近いabstractだけでは需要の広がりを拾いにくい。両者を組にすると、検索意図を保ちながら具体的な広告へ到達できる。さらに配信不可の枝を先に除けば、限られたbeamを有効な候補へ使える。ただし意味の一致や商用価値はモデルが学ぶ部分であり、索引だけでは保証されない。
  evidence: '### WTSの表は+1.81%、本文は+1.18%と食い違う


    表3のWTSは広告消費額（consumption）+1.81%、GMV +2.16%、クリック +1.50%、コンバージョン +1.44%、露出 +2.49%。§4.2は5日間・traffic 20%のA/Bと記す。ただし同節のconsumptionは+1.18%で、要旨・導入・表3の+1.81%と一致しない。このLabは表3を採用し、食い違いを残す。信頼区間は非開示。p値もない。露出も増えているため、クリック数の増加をCTRの増加と読み替えない。


    ### 分解実験では動的な制約を外す影響が大きい


    表4のHR@100はANGLE 0.5273、intentなし0.4645、abstractなし0.3519、DCBSなし0.2975、GDR-LLMなし0.4412。DCBSなしは自由生成後にANNで近い組を探す構成であり、制約だけを切り替えた比較ではない。表2の最良baselineのHR@100はSimBert-v2-Gの0.3095。評価は10,000クエリ、約220,000広告候補で、実ログ由来のクリックを使う。


    ### 「One-Step」でも順位付けは残る


    §4.2はWTS/QBSでranking queueの補完として導入したと記す。Limitationsは動的クリエイティブ選択や自動入札が順位付けに依存し、rankingを除去していないと明記する。広告側Hunyuan-13B、検索側Hunyuan-1B、beam
    64、intent最大3 token、abstract最大4 token。§4.1の生成時間は90 ms以内で、全リクエストのend-to-end p99ではない。


    [一次資料：ANGLE v1 表2〜4・§4・Limitations](https://arxiv.org/pdf/2609.18296v1)'
  executable_understanding: '5広告・4組の人工索引で、同じ固定スコアとbeam幅を使う。生成候補を選んだ後で配信不可広告を除く方式と、有効な広告を持つ組へ候補を絞ってから選ぶ方式を比較する。1組が複数広告を返す様子と、モデルのスコアを変更せず広告Fを追加する操作を確認する。token単位のDCBSは省き、組単位のtop-kに縮約した。


    <div class="teaching" data-b21="angle"><h3>組を選ぶ前と後で、配信可否を切り替える</h3><p>合成例：AとEは配信不可。Forestの同じ組にB・Cが属する。</p><label>探索条件
    <select><option value="0">beam 1 / 後段filter</option><option value="1">beam 1 / 事前filter</option><option value="2">beam
    2 / 後段filter</option><option value="3">beam 2 / 事前filter</option><option value="4">beam 3 / 後段filter</option><option
    value="5">beam 3 / 事前filter</option></select></label><div data-output aria-live="polite"><div class="b21-cards"><div><strong>生成する組</strong><p>survival
    game / Winter</p></div><div><strong>解決した有効広告</strong><p>なし（0件）</p></div></div></div><script type="application/json"
    data-frames>["<div class=\"b21-cards\"><div><strong>生成する組</strong><p>survival game / Winter</p></div><div><strong>解決した有効広告</strong><p>なし（0件）</p></div></div>",
    "<div class=\"b21-cards\"><div><strong>生成する組</strong><p>survival game / Forest</p></div><div><strong>解決した有効広告</strong><p>B・C（2件）</p></div></div>",
    "<div class=\"b21-cards\"><div><strong>生成する組</strong><p>survival game / Winter → survival game / Forest</p></div><div><strong>解決した有効広告</strong><p>B・C（2件）</p></div></div>",
    "<div class=\"b21-cards\"><div><strong>生成する組</strong><p>survival game / Forest → mobile game / Winter</p></div><div><strong>解決した有効広告</strong><p>B・C・D（3件）</p></div></div>",
    "<div class=\"b21-cards\"><div><strong>生成する組</strong><p>survival game / Winter → survival game / Forest → mobile
    game / Winter</p></div><div><strong>解決した有効広告</strong><p>B・C・D（3件）</p></div></div>", "<div class=\"b21-cards\"><div><strong>生成する組</strong><p>survival
    game / Forest → mobile game / Winter</p></div><div><strong>解決した有効広告</strong><p>B・C・D（3件）</p></div></div>"]</script><p
    class="source-note">出所：run.pyの固定スコアとresults.json。JavaScript無効時はbeam 1・後段filterの結果を表示。</p></div>'
  results: beam幅1では後段filterが無効なAの組を選ぶため、有効広告は0件。事前filterはForestの組を選び、BとCの2件を返す。Fを同じ組へ追加すると3件になる。幅3では差が消える。両方式ともB・C・Dを返す。差は人工的に置いた無効候補と探索予算に依存し、常に改善するとの証拠ではない。
  what_we_verified: CONFIRMED：人工索引の1対多の解決、配信可否の事前filter、索引への追加による取得集合の変化。assertは4件。すべて通過した。PARTIAL：ANGLEの仕組み全体。生成部分を固定スコアに置き換えている。
  what_we_did_not_verify: NOT TESTED：Hunyuanの学習、関連性判定、DPO、token単位の動的な木の再構成、未見広告への意味的な汎化、実際の遅延、WTS/QBSのA/B。新広告Fの組は手で指定しており、LLMが正しい組を生成できるかは検証していない。著者報告の性能値とLabの確認範囲を分ける。
  implementation: '`UV_CACHE_DIR=/tmp/paper-lab-uv uv run papers/angle-tencent-one-step-retrieval/run.py` をリポジトリのルートで実行する。Python標準ライブラリのみで動作し、同じディレクトリの
    `results.json` を更新する。外部データやGPUは不要。乱数なし。'
