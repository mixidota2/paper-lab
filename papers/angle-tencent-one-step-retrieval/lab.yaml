question: ANGLE：広告IDの代わりに、検索意図と商品語を生成する
summary: TencentのANGLEは、広告を「広い検索意図 × 商品を特定する短い語句」で索引化する。検索側のHunyuan-1Bに生成・関連性判定・商用順位を学習させ、配信可能な広告に結び付く語句だけを生成する。WTSの広告A/BではGMV
  +2.16%を報告した。対象は検索広告だ。自然検索や通常の推薦全体を置き換えた研究ではない。
core_idea:
  author_claim: 著者は、階層的なテキスト索引とGDR-LLM、動的な制約付きbeam探索（DCBS）を組み合わせ、関連性と商用価値を考慮した広告取得を実現すると主張する。
  research_bot_interpretation: SIDの学習負担をテキスト表現と索引更新へ移し、広告の配信可否を生成中に反映する設計が要点だ。SID一般への勝利や、全カスケード撤去を証明したとは読まない。
