sections:
  overview: |-
    Tencentの著者は検索広告を「広い検索意図」と「広告の短い要約」の組で表しました。ANGLEはこの組を検索語に合わせて生成し、関連性を判定してから、広告の価値に応じて候補を並べます。表示できる広告がない組は生成の途中で除きます。広告を表す専用の番号と広告との対応をモデルに覚えさせる代わりに、短いテキストで索引を引く仕組みです。

    著者が報告した本番の比較では、流通総額（GMV）がWTSで2.16%、QBSで5.01%増えました。これらは論文が匿名で示した二つの検索システムです。著者はANGLEを既存のランキングに候補を足す仕組みとして運用しており、精密ランキングまで廃止した比較ではありません。
  problem: |-
    広告検索は通常、候補を取得し、検索語との関連性を確かめ、候補を大まかに並べ、最後に表示順を決めます。各処理が別の目標を持つと、前の段階で落ちた広告を、後から価値が高いと判断しても戻せません。ANGLEは最終順位を決める前の三つの処理を、検索用モデルにまとめます。

    広告に意味ID（SID）を付け、そのIDを生成する方式では、モデルがIDから広告への対応を学びます。ANGLEは広告の内容を短い語句にして索引に登録します。新しい広告は、その語句の組を作って登録できます。
  why_it_might_work: |-
    大まかな検索意図だけでは同じ種類の商品を区別しにくく、商品名に近い語だけでは検索の意図に合う候補を広く拾いにくくなります。二つを組にすると、意図で候補を広く探し、具体的な語句で候補を区別できます。

    配信できる広告が一つもない組を先に除くと、探索で残せる枠を使える組に回せます。ただし配信可否は広告側の条件で、検索語との意味の一致や広告の価値とは別です。索引に対応があるだけでは、両方を満たすとは限りません。
  evidence: |-
    ### 検索ログを使った取得の比較

    著者は過去の表示とクリックから1万件の検索語を選び、各検索の候補を最大1,000件として、無作為に選んだ非関連広告も加えました。評価に使ったのは約22万件の広告候補です（§4.1）。付録CのHR@100は、上位100件に含まれた正解広告の数を、その検索の正解広告全体の数で割る指標です。著者が報告した値はANGLEで0.5273、この列で最も高かった比較先のSimBert-v2-Gで0.3095です。

    表4では、ANGLEの0.5273に対し、検索意図を使わず要約だけにすると0.4645、要約を使わず検索意図だけにすると0.3519でした。動的な制約付き探索（DCBS）を外すと0.2975、GDR-LLMを基盤モデルに替えて制約付きで生成すると0.4412です。DCBSを外す条件では、自由に語句を生成した後、近似近傍検索（ANN）で索引から近い組を探しています。制約だけを切り替えた比較ではありません。

    ### 本番で報告された広告費と件数

    著者はANGLEを、匿名の検索システムWTSとQBSの既存ランキングへ候補を足す形で導入しました。表3の相対変化は次のとおりです。

    | システム | 広告費 | 流通総額（GMV） | クリック数 | コンバージョン数 | 露出数 |
    | --- | ---: | ---: | ---: | ---: | ---: |
    | WTS | +1.81% | +2.16% | +1.50% | +1.44% | +2.49% |
    | QBS | +6.57% | +5.01% | +6.11% | +0.72% | +7.82% |

    §4.2には5日間、全トラフィックの20%を使ったA/Bテストとあります。本文の広告費は+1.18%で、要旨と表3にあるWTSの+1.81%と一致しません。GMVの+2.16%は一致します。QBSにも同じ期間や割り付けを使ったかは分かりません。信頼区間やp値は載っていません。クリック数やコンバージョン数の変化は率の変化ではなく、流通総額はプラットフォームの純売上ではありません。

    ### 生成の所要時間と残した処理

    検索側のHunyuan-1Bはビーム幅64で、検索意図は最大3トークン、要約は最大4トークンです。§4.1には生成1トークンあたり約8ミリ秒、組の生成は90ミリ秒以内とあります。付録Dのリクエスト60ミリ秒以内は別に記載された運用条件で、同じ計測範囲の値とは確認できません。いずれも全リクエストのp99ではありません。広告の精密ランキング、表示素材の選択、入札は引き続き必要です。

    [一次資料：ANGLE v1の§4、表2〜4、Limitations、付録D](https://arxiv.org/html/2609.18296v1)
  executable_understanding: |-
    Labは人工の5広告を4組に対応付け、各組の点数を固定しました。一方は点数順に組を選んでから配信できない広告を除き、もう一方は配信できる広告がある組だけを残してから点数順に選びます。下の操作では最大1〜3組と確認する順序を選べます。トークン単位の探索ではなく、完成した組を比べます。

    <div class="teaching" data-b21="angle"><h3>配信可否を調べる順序と取得できる広告</h3><p>Labの合成例です。AとEは配信できません。BとCは同じForestの組に入っています。</p><label>選ぶ組数と配信可否を調べる順序 <select><option value="0">1組まで：組を選んでから確認</option><option value="1">1組まで：組を選ぶ前に確認</option><option value="2">2組まで：組を選んでから確認</option><option value="3">2組まで：組を選ぶ前に確認</option><option value="4">3組まで：組を選んでから確認</option><option value="5">3組まで：組を選ぶ前に確認</option></select></label><div data-output aria-live="polite"><div class="b21-cards"><div><strong>選んだ組</strong><p>survival game / Winter</p></div><div><strong>取得した配信可能な広告</strong><p>なし（0件）</p></div></div></div><script type="application/json" data-frames>["<div class=\"b21-cards\"><div><strong>選んだ組</strong><p>survival game / Winter</p></div><div><strong>取得した配信可能な広告</strong><p>なし（0件）</p></div></div>", "<div class=\"b21-cards\"><div><strong>選んだ組</strong><p>survival game / Forest</p></div><div><strong>取得した配信可能な広告</strong><p>B・C（2件）</p></div></div>", "<div class=\"b21-cards\"><div><strong>選んだ組</strong><p>survival game / Winter → survival game / Forest</p></div><div><strong>取得した配信可能な広告</strong><p>B・C（2件）</p></div></div>", "<div class=\"b21-cards\"><div><strong>選んだ組</strong><p>survival game / Forest → mobile game / Winter</p></div><div><strong>取得した配信可能な広告</strong><p>B・C・D（3件）</p></div></div>", "<div class=\"b21-cards\"><div><strong>選んだ組</strong><p>survival game / Winter → survival game / Forest → mobile game / Winter</p></div><div><strong>取得した配信可能な広告</strong><p>B・C・D（3件）</p></div></div>", "<div class=\"b21-cards\"><div><strong>選んだ組</strong><p>survival game / Forest → mobile game / Winter</p></div><div><strong>取得した配信可能な広告</strong><p>B・C・D（3件）</p></div></div>"]</script><p class="source-note">run.pyとresults.jsonの合成例です。JavaScriptを使わない場合は、1組を選んでから配信可否を調べた結果を表示します。</p></div>
  results: |-
    1組だけ選ぶときは、先に点数で選ぶと、配信できないAの組が残り、取得数は0件です。配信可否を先に調べると、Forestの組からBとCの2件を取得します。2組まで選ぶと、後から調べる場合は2件、先に調べる場合は3件です。3組までなら両方ともB・C・Dの3件を取得します。

    Forestの組に広告Fを手で追加すると、同じ点数のまま、事前に絞って1組を選ぶ条件で3件になります。この結果は固定した点数と配信可否によるもので、事前に絞ることがどの検索でも改善につながるとは言えません。
  what_we_verified: |-
    合成例で、一つの組から複数の広告が返ること、配信可否を確認する順序で取得数が変わること、既存の組に広告を追加すると取得結果に加わることを確認しました。プログラムの4つの検査が通りました。生成モデルの代わりに固定の点数を使っており、確認したのは仕組みの一部です（Mechanism PARTIAL）。
  what_we_did_not_verify: |-
    Hunyuanの学習、関連性の判定、DPO、トークン単位の探索木の更新、実際の処理時間、WTSやQBSでの効果は試していません。広告Fを手で割り当てたため、新しい広告に適した語句をモデルが作れるかも分かりません。
  implementation: |-
    配布した `run.py` を保存し、同じフォルダで `python run.py` を実行します。標準ライブラリだけで動き、同じフォルダの `results.json` を更新します。リポジトリからは `uv run papers/angle-tencent-one-step-retrieval/run.py` でも実行できます。外部データ、GPU、乱数は使いません。
  method: method.md
  mapping: mapping.md
