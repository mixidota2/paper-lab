<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-labelledby="title"><title id="title">同じモデルを2つの進め方で測る概念図</title><style>text{font-family:sans-serif;fill:#18201d}.b{fill:#e9eee7;stroke:#245b49;stroke-width:2}.a{stroke:#ae4e2a;stroke-width:2}</style><text x="35" y="35" font-size="20" font-weight="bold">同じモデルで、進め方だけを変えて比べる</text><rect class="b" x="55" y="75" width="150" height="65"/><text x="88" y="113">同じモデル</text><rect class="b" x="290" y="60" width="150" height="45"/><text x="325" y="88">ReAct</text><rect class="b" x="290" y="130" width="150" height="45"/><text x="315" y="158">PAR / 計画→実行</text><path class="a" d="M205 105h85M205 105l85 45"/><path class="a" d="M440 82h120M440 152h120"/><text x="575" y="88" font-size="18">正答率 A</text><text x="575" y="158" font-size="18">正答率 B</text><text x="55" y="205" fill="#ae4e2a">同じモデルでも、進め方とツールが変わる。</text></svg>
