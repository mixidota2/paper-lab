<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230"><style>text{font-family:sans-serif;fill:#18201d}.b{fill:#e9eee7;stroke:#245b49;stroke-width:2}.a{stroke:#ae4e2a;stroke-width:2;fill:none}</style><text x="35" y="35" font-size="20" font-weight="bold">途中失敗後の回復とツール呼び出し（概念図）</text><path class="a" d="M90 175 L220 115 L350 160"/><path class="a" d="M90 175 L220 80 L350 80"/><rect class="b" x="370" y="55" width="140" height="45"/><text x="393" y="83">評価・修正</text><rect class="b" x="370" y="135" width="140" height="45"/><text x="403" y="163">試行錯誤</text><text x="90" y="205">失敗</text><text x="220" y="205">次の行動</text><text x="350" y="205">回答</text><text x="540" y="85" fill="#245b49">少ない呼び出しでも回復しうる</text><text x="540" y="163" fill="#ae4e2a">多い呼び出しでも回復は保証しない</text></svg>
