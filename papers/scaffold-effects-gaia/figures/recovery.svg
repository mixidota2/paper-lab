<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-labelledby="title"><title id="title">途中の失敗から回答まで進む道筋</title><style>text{font-family:sans-serif;fill:#18201d}.b{fill:#e9eee7;stroke:#245b49;stroke-width:2}.a{stroke:#ae4e2a;stroke-width:2;fill:none}</style><text x="35" y="35" font-size="20" font-weight="bold">途中の失敗から、どう回答まで進むか</text><path class="a" d="M90 175 L220 115 L350 160"/><path class="a" d="M90 175 L220 80 L350 80"/><rect class="b" x="370" y="55" width="140" height="45"/><text x="393" y="83">確認して修正</text><rect class="b" x="370" y="135" width="140" height="45"/><text x="403" y="163">別の操作を試す</text><text x="90" y="205">失敗</text><text x="220" y="205">次の行動</text><text x="350" y="205">回答</text><text x="540" y="85" fill="#245b49">呼び出しが少なくても<tspan x="540" dy="18">失敗を直せる</tspan></text><text x="540" y="163" fill="#ae4e2a">何度呼び出しても<tspan x="540" dy="18">直るとは限らない</tspan></text></svg>
