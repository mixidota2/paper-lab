summary: 著者はGAIAで5つのモデルと3種類の進め方を比較した。Claude Opus 4.7 の難易度2では、特定の実行エラーを除くと、進め方による正答率の差は最大28ポイントだった。
figures: []
core_idea:
  author_claim: 著者は、同じ言語モデルでも、計画、操作、評価をどう組み合わせるかによって、GAIA の正答率と費用が変わると報告した。
  research_bot_interpretation: モデルを選ぶ際は、実際に使うツールと作業の進め方もそろえて試す。3種類の進め方の順位は、この評価条件での結果として扱う。
sections:
  overview: |-
    著者は、同じ言語モデルでも、調べ物の計画やツールの使い方によって正答率が変わるかを調べた。GAIA の検証用データの難易度1と2で、5つのモデルを、1役で進める ReAct、計画・実行・評価の3役に分ける PAR、先に計画を書いてから実行する方式で比べた。同じ問題に3回の試行を行った。

    Claude Opus 4.7 の難易度2では、特定の実行エラーを除いた集計で、PAR の正答率は84%、ReAct は56%だった。構成による差は最大28ポイントで、全モデルの平均ではない。エラーも不正解に含めた集計では、同じモデルの3構成の差は14ポイントだった。

    難易度2では、作業の役割を分けた2方式の方が、5モデル平均でツールの呼び出しが少なかった。正答率の差はモデルによって変わり、役割を分ければどのモデルでも良くなるわけではなかった。著者の比較では、先に計画する Gemini 3.1 Pro Preview が、両方の難易度で1正答あたりの費用が最も低く、難易度2では正答率も最も高かった。
  problem: 同じモデルでも、調べ物では何を検索するか、いつ操作をやり直すか、どの時点で回答を出すかが結果に影響する。もしモデルごとに別の進め方で評価したら、正答率の差がモデルの違いによるものか、進め方の違いによるものかを区別しにくい。
  why_it_might_work: 評価役が途中の誤りに気づき、間違えた操作だけをやり直せば、最初の誤りを最終回答へ持ち越さずに済むかもしれない。ただし、評価役が誤りを見落としたり、判断が合わずに作業を増やしたりすることもある。論文の回復率だけでは、どの処理が結果を変えたかは分からない。
  evidence: |-
    以下は著者の報告で、Lab の作例の値ではない。[一次資料：本文§3〜6と付録の表](https://arxiv.org/html/2606.08529)。

    | どの比較か | 結果 | 読むときの注意 |
    | --- | --- | --- |
    | 実行の範囲 | 139問を、5モデル、3構成、各3回で調べた。予定6,255試行のうち5,907が完了した。 | 難易度も分けた30条件のうち15に未完了の試行があった。保持していた別の評価用データでは実行していない。 |
    | Opus、難易度2 | 特定のログ処理エラーを除いた場合、3構成の最高正答率と最低正答率の差は28ポイント。全試行では14ポイント。 | 28ポイントは全モデルの平均でも、同じ構成で再試行した差でもない。 |
    | 途中で動かすツールと失敗後の回復、難易度2 | ツールの呼び出しは、5モデル平均で ReAct 22.0回、PAR 8.8回、計画→実行 6.4回。途中のツールエラー後に正答した割合は、順に38%、57%、51%。 | 回復率の分母はツールエラーが一度以上起きた試行。全試行の正答率ではなく、回復を起こした仕組みを証明した値でもない。 |
    | 正答1件あたりの費用 | Gemini 3.1 Pro Preview の計画→実行は、全試行の集計で難易度1が0.14ドル、難易度2が0.23ドル。正答率は順に84.3%、86.0%。 | エラーで終わった試行の費用も含めて正答数で割った。評価当時の価格と対象範囲の値。 |

    Claude 系の難易度2では PAR が ReAct より良かったが、Gemini と GPT-5.5 にも同じ差が出たわけではない。また、ファイルを読む問題で計画を先に書けば有利になるという予想は、比較で支持されなかった。
  executable_understanding: Lab の作例は、同じ60件に成功までの失敗回数を割り当てる。作例は再試行の上限だけを変え、各条件の計算結果を配布ファイルに収める。上限は初回呼出しを含まず、最初の失敗後にやり直せる回数を表す。成功したタスクはそこで止める。論文の各モデルの挙動は再現しない。
  results: この作例で再試行を1回まで認めると、完了は15件から30件になり、ツールの呼び出しは60回から105回になった。3回までなら60件が完了し、呼び出しは150回になった。ここで数えたのは、あらかじめ成功までの回数を決めた作例であり、GAIA
    の結果ではない。
  what_we_verified: Lab は、同じ60件でやり直せる回数を増やすと、仮定した成功条件を満たせる件数と、必要な呼び出しがどう変わるかを確認した。論文の3構成の差を再現したわけではない。
  what_we_did_not_verify: Lab は、5つのモデル、GAIA の問題、外部ツールを使っていない。論文の正答率、実行時間、費用、異なるツール構成をそろえた場合の結果は未検証だ。
  implementation: '`run.py` が共通の計算で作例を実行する。このページは、その結果のうち数字を変えず、読み手に出す説明だけを整理する。コマンドは `README.md` に記載した。'
  mapping: |-
    | 原論文の箇所 | Lab で説明したこと | 再現していないこと |
    | --- | --- | --- |
    | [§3.3、§3.6](https://arxiv.org/html/2606.08529) | ReAct、PAR、計画→実行の違いと、3種類の集計。 | モデル、採点、実ツールは動かしていない。 |
    | [§4.1、§4.3〜4.4](https://arxiv.org/html/2606.08529#S4) | 正答率の差、失敗後の回復、正答1件あたりの費用の分母。 | 著者のログや費用を計算し直していない。 |
    | Lab 独自の作例 | `run.py` が再試行の上限を変え、結果を `results.json` に書く。 | モデルに失敗や回復を起こさせる実験ではない。 |
  method: method.md
