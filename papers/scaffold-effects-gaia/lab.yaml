- kind: equations
  id: gap
  title: 最も高い正答率から、最も低い正答率を引く
  after: method
  locator: §4.1.2–4.1.3
  rationale: モデルや難易度の違いと、進め方の違いを混ぜない。
  caption: 問題を単位に取り直して範囲を求める。同じ問題の3回は、まとめて扱う。
  steps:
  - name: 同じモデル・難易度の中だけで比べる
    formula: Gap(m, l) = maxₛ Accuracy(m, s, l) − minₛ Accuracy(m, s, l)
    explanation: m はモデル、l は難易度、s は進め方。3つの s だけを変える。
  - name: ポイントで差を示す
    formula: 0.70 − 0.50 = 0.20 = 20 percentage points
    explanation: 正答率が50%と70%なら引き算で20ポイント。元の値に対する20%の増加とは異なる。
  source: https://arxiv.org/html/2606.08529
