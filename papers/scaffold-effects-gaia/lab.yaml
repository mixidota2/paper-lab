  title: 構成による差は最大値と最小値の差
  after: method
  locator: §4.1.2–4.1.3
  rationale: 差の定義と誤差の扱いを説明する。
  caption: 記号を整理した定義。信頼区間は問題ID単位のbootstrapで、同一問題の試行をまとめて再標本化する。
  steps:
  - name: 同じモデル・難度で集計
    formula: Gap(m, l) = maxₛ Accuracy(m, s, l) − minₛ Accuracy(m, s, l)
    explanation: mはモデル、lは難度、sは3つの実行構成。別モデル間の差ではない。
  - name: ポイントと相対率を区別する
    formula: 0.70 − 0.50 = 0.20 = 20 percentage points
    explanation: この数値は計算例。20%の相対改善とは異なる。
