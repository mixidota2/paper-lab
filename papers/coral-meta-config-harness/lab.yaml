core_idea:
  author_claim: 著者は、大規模言語モデル（LLM）の提案と別の数値計算を組み合わせ、モデルを再学習せずに推薦設定を繰り返し見直せると報告した（§3–5）。
  research_bot_interpretation: 設定の提案はLLMに任せ、予算を守るかどうかは数値計算で判定する。次の提案には前回の測定を使う。AgentXより変更できる範囲が狭いので、どの設定が予算内に収まるかを判定しやすい。
sections:
  overview: |-
    MetaのCORALが数日ごとに見直すのは、利用者に毎回出す推薦ではなく、既存の推薦システムの設定です。動画サービスでは推薦候補を集める予算を経路ごとに見直します。別のサービスでは、利用者グループごとに配信方法を選びます。言語モデルが運用統計と過去の変更結果を読んで案を出し、別の数値計算がその案に近い設定を予算内で選びます。CORALは設定を自動で適用しますが、人が運用を監督します。

    著者のA/Bテストでは、動画サービスの最終構成で、配信費用を増やさずに総視聴時間が0.15%増えました。動画を1回以上見た訪問の回数も、利用者全体で0.16%増えました。数えたのは訪問で、視聴した人の数ではありません。別のサービスでは、対象グループを広げた2回目に、配信費用を減らせた額が初回より44%増えました。総費用が44%下がったという意味ではありません。このA/Bテストでは利用者の反応に統計的な差を検出できませんでしたが、反応に差がないと証明したわけではありません。
  problem: '利用者や推薦候補の質が変わると、以前はよかった候補数の配分や利用者別の配信方法が合わなくなることがある。推薦モデルを再学習しても、こうした設定を変えない限り、計算量の配分は変わらない。


    CORALは、利用者がアクセスするたびに推薦を作る仕組みではない。既存の推薦システムに対し、候補を集める経路ごとの倍率や、利用者のグループごとに使う配信方法を変更する。稼働中にモデルの重みを更新したり、本番コードを書き換えたりはしない。'
  method: method.md
  why_it_might_work: 'LLMは分析ツールが要約した運用統計と、過去の判断を読み、次の設定を提案する。数値最適化は予算内で提案に最も近い設定を返す。前回の変更と結果を残しておけば、配分を動かしすぎた場合に、次の提案で見直せる。


    予算を守っても、視聴が増えるとは限らない。変更の前後だけを比べると、季節性や上流の変更の影響も混ざる。A/Bテストで比較した効果と、エージェントが観測から推定して記録した効果は、根拠の強さが違う。'
  evidence: '### 動画サービスで候補収集の予算を配り直した結果


    著者は動画サービスで候補を集める経路への予算配分を変え、3回のA/Bテストを報告した（§5.1、表1）。R1では過去の判断を使わず、1期間の統計から設定を提案した。視聴時間は0.13%増え、訪問回数に有意差は出なかった。R2では配分を大きく動かし、視聴時間と訪問回数に有意差が出なかった。複数の更新周期をまとめたR3では、視聴時間は0.15%、動画を見た訪問の回数は全体で0.16%、最大市場では0.77%増えた。著者によると、推薦の配信費用は増えなかった。


    訪問回数（sessions）は、訪問中に動画を1回以上見た場合を数える。表のneutralは、統計的な差を検出しなかったという意味であり、差が厳密に0だったという意味ではない。著者は試験が数百万人規模だったと述べるが、各回の信頼区間、割付比率、試験期間、共通の対照群の詳細は示していない。情報が少ない新規利用者を対象とする後続の配分では訪問が0.23%増えたが、全体を対象とするR3と同じ分母ではない。


    <figure class="teaching batch17"><h3>動画サービスでの3回の比較</h3><div class="matrix-scroll" tabindex="0" role="region" aria-label="比較表"><table><thead><tr><th>指標</th><th>R1</th><th>R2</th><th>R3</th></tr></thead><tbody><tr><td>視聴時間</td><td>+0.13%</td><td>有意差なし（neutral）</td><td>+0.15%</td></tr><tr><td>動画を見た訪問の回数（全体）</td><td>有意差なし（neutral）</td><td>有意差なし（neutral）</td><td>+0.16%</td></tr><tr><td>動画を見た訪問の回数（最大市場）</td><td>有意差なし（neutral）</td><td>有意差なし（neutral）</td><td>+0.77%</td></tr></tbody></table></div><figcaption>出典は§5.1の表1。有意差なしは効果が0%だったという意味ではない。</figcaption></figure>


    ### 別サービスで配信方法を変えたときの費用


    著者は別のサービスで、計算の負荷が異なる複数の配信方法を、利用者グループごとに選んだ。A/Bテストの初回では一部のグループを対象とし、年率換算で数百万USDの推薦配信費用を減らした（§5.2）。次に対象グループを広げたところ、初回の削減額より44%多く減らせた。初回の削減額をSとすると次回は1.44S（`saving₂=1.44×saving₁`）である。総費用が44%減った（`cost₂=0.56×cost₀`）とは読めない。元の総費用が分からないため、総費用に対する削減率は計算できない。著者は利用者の反応に統計的な差を検出しなかったと報告したが、反応が同等だと確認したわけではない。


    <figure class="teaching batch17"><h3>44%の分母を確認する</h3><div class="b17-cards"><div><strong>原論文で増えたのは削減額</strong><p>初回にSを減らせたとすると、次回の削減額は1.44Sになる。</p></div><div><strong>人工例：元費用100、初回の削減額10</strong><p>次回の削減額は14.4になり、費用は85.6残る。この金額は論文の実測値ではない。</p></div></div><figcaption>§5.2の44%は初回削減額に対する割合。右の金額は、分母の違いを示すための例である。</figcaption></figure>


    著者は同じ仕組みを別サービスでも使ったが、同じ学習済み配分を移したわけではない。[AgentX](agentx-kuaishou.html)がコードや専用言語（DSL）を書き、[RecEvolve](recevolve-autonomous-rec.html)がモデル構造を探すのに対し、CORALは既存の選択肢や設定値の範囲で変更する。この報告はRecSys
    2026 OARSに位置付けられている。照合に使った一次資料は[arXiv v1のPDF](https://arxiv.org/pdf/2609.02730v1)である。照合した節と表、PDFのSHA-256は末尾の対応表に示す。'
  executable_understanding: 'この小実験では、人が用意した3つの設定案を使う。各設定値を0以上、合計を10以下にする。提案が条件を満たせば、そのまま採用する。条件を外れた場合は、各設定値と提案値の差を二乗して合計し、その値が最も小さくなる組み合わせを選ぶ。この距離で予算内の点を求める計算をユークリッド射影と呼ぶ。候補が離散的な場合は、実行できる候補をすべて比べて最も近いものを選ぶ。


    <figure class="teaching batch17"><h3>予算に収まる場合と収まらない場合の違い</h3><div class="matrix-scroll" tabindex="0" role="region" aria-label="比較表"><table><thead><tr><th>提案</th><th>適用した設定</th><th>合計費用</th></tr></thead><tbody><tr><td>[4,
    3, 2]</td><td>[4, 3, 2]</td><td>9</td></tr><tr><td>[8, 7, 5]</td><td>[4.667, 3.667, 1.667]</td><td>10.0</td></tr><tr><td>[1,
    1, 1]</td><td>[1, 1, 1]</td><td>3</td></tr></tbody></table></div><figcaption>run.pyで求めた人工例。予算は10、各設定値は0以上、単価は一定とする。もとから予算に収まる2案は変えない。</figcaption></figure>


    別の人工例では、元費用100と初回の削減額10を使って、削減額が44%増える場合と総費用が44%減る場合の違いを確認する。'
  results: 以下は人工データを使った小実験の計算値である。著者が実際のサービスで測った値は「根拠」の節に示した。
  what_we_verified: 'このLabでは、人が用意した条件で予算に収まる設定を選ぶ計算と境界条件を確かめた。仕組み全体を確認したわけではない（Mechanism: PARTIAL）。results.jsonのchecksでCONFIRMEDとしているのは、小実験で確認できた個別の命題に限る。入力と出力はrun.pyとresults.jsonで確認できる。'
  what_we_did_not_verify: 'このLabでは、LLMの提案、前回の変更の効果の推定、人の監督を減らせるかどうか、更新を繰り返すと設定が改善するか、オンラインA/B、実際の配信費用は検証していない。設定を予算に収めたあと、目的関数Jが改善するかも確かめていない。原論文の報告値を照合することと、その効果を独立に再現することは別である。性能、規模を広げたときの挙動、本番への適用は未検証である（Performance
    / Scaling / Production applicability: NOT TESTED）。'
  implementation: '小実験は標準ライブラリだけで動く。リポジトリの最上位で `uv run papers/coral-meta-config-harness/run.py` を実行すると、同じフォルダーのresults.jsonを作り直す。乱数や外部APIは使わない。


    [実行コード](../downloads/coral-meta-config-harness/run.py)・[全結果](../downloads/coral-meta-config-harness/results.json)・[README](../downloads/coral-meta-config-harness/README.md)・[方法](../downloads/coral-meta-config-harness/method.md)・[対応表](../downloads/coral-meta-config-harness/mapping.md)を保存できる。


    確認した論文本文とarXivの書誌情報では、取得できる公式コードへの案内を見つけられなかった。非公開と断定するものではない。公式コードを使った独立検証は未実施である（NOT TESTED）。'
  mapping: mapping.md
teaching_figures:
- kind: equations
  id: method-equations
  title: 推薦の設定・予算・費用を表す式
  after: method
  caption: 何をよくしたいか、何を制約にするか、どの費用を見積もるかを式ごとに読む。
  rationale: 目的の値を上げることと、提案を予算内に収めることを区別する。
  source: https://arxiv.org/pdf/2609.02730v1
  locator: 式1–3、§4.2
  steps:
  - name: 予算内で選びたい設定
    formula: s*_t=argmax J_t(s), c_t(s)≤B
    explanation: 各時点で、費用がB以下の設定から目的の値が最も高いものを考える。論文は最適にできると証明していない。
  - name: Labで予算に収める計算
    formula: s=argmin_{x≥0,Σx≤B} ||x−proposal||²
    explanation: Labでは、この距離と単価を仮定する。論文は最適化の詳細を示していない。
  - name: LLMの呼び出し費用
    formula: Cost=(T/k)C(τ_in p_in+τ_out p_out)
    explanation: 著者は、利用者からのリクエスト数ではなく、設定を更新する周期ごとに見積もった。トークン数は推定値である。
