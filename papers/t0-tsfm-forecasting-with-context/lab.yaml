core_idea:
  author_claim: |-
    t0は、売上などの履歴と、販促日などの追加情報を一緒に読み、将来の値を複数の分位点で予測します。同じ変数の異なる時点を読む層と、同じ時点の異なる変数を読む層を交互に使います。著者は、追加情報によって予測対象が変化する合成データを事前学習に混ぜ、1億200万パラメータのt0-alphaと2億5600万パラメータのt0-betaを公開しました。
  research_bot_interpretation: |-
    [ApolloPFN](apollopfn.html)やChronos-2と同じく、t0も売上履歴以外の情報を使えます。ただし、[Accuracy Is Not Service](accuracy-not-service-intermittent-demand.html)が扱うように、予測誤差が下がっても、欠品や在庫費用が減るとは限りません。小売で採用するかを判断するなら、発注時点で使えた情報をt0と勾配ブースティング決定木（GBDT）にそろえ、販促中や欠品中を分けて比較します。
sections:
  overview: |-
    The Forecasting Companyの研究チームは、学習済みの時系列モデルt0-alphaに、売上や価格の履歴だけでなく、販促や祝日などの情報を渡すと予測が改善するかを調べました。モデルの重みは固定し、同じモデルに追加情報を渡す場合と渡さない場合を比べました。ここで紹介するのはt0-alphaの結果で、後継のt0-betaとの性能比較ではありません。

    将来の予定や予報を使える30課題では、季節のパターンを繰り返す基準に比べ、予測誤差がどれだけ小さいかを表す指標（skill）が36.7から43.0へ、6.3ポイント上がりました。30課題のうち改善したのは19課題で、残り11課題は悪化しました。Rossmannの売上データでは販促、祝日、営業日を追加すると分位点の予測誤差が43%減りましたが、M5の週次と月次では改善も悪化も2%未満でした。6.3ポイントは30課題をまとめた指標の差で、平均絶対誤差（MAE）が6.3%減ったという意味ではありません。
  problem: |-
    売上履歴だけで予測するモデルには、来週の販促や休業日を直接伝えられません。一方、追加情報を受け取れるモデルでも、予測対象に関係のない変数を入れると、かえって誤差が増えることがあります。発注時点で入手できた販促計画や天気予報と、後から分かった実際の売上や天気を区別します。実績を予定や予報の代わりに渡すと、予測時点で知り得なかった情報が混ざります。
  why_it_might_work: |-
    研究チームは、追加情報の変化が売上などの予測対象に伝わる合成データを作り、事前学習に混ぜました。モデルは、異なる変数を読み合わせ、予測対象に関係する情報を拾える設計です。ただし、その情報が役立つかは課題によります。実際、将来の値が分かる情報を渡した30課題のうち、11課題で成績が悪化しました。
  evidence: |-
    #### 同じt0-alphaに追加情報を渡すと、30課題のうち19課題で改善した

    研究チームは、公開ベンチマークfev-benchの各課題で、同じ重みのt0-alphaを2回動かしました。片方には予測対象の履歴だけを、もう片方には履歴に加えて予測対象以外の時系列情報（補助変数）を渡しています。[一次資料PDF v1 §5.1.2・Table 5](https://arxiv.org/pdf/2609.24559v1)

    | 渡せる補助変数 | 渡さない場合のskill | 渡す場合のskill | 差と95%信頼区間 | 改善した課題 |
    | --- | --- | --- | --- | --- |
    | 予測時点で将来の値が分かる30課題 | 36.7 | 43.0 | +6.3ポイント（+2.2〜+10.9） | 19/30 |
    | 過去の値だけが分かる12課題 | 32.9 | 35.6 | +2.7ポイント（+1.0〜+4.2） | 9/12 |
    | 補助変数がない58課題 | 同じ入力 | 同じ入力 | 著者が結果の完全一致を確認 | — |

    skillは、前年同時期などの値を繰り返す季節ナイーブ予測と比べた分位点予測の成績です。著者は課題ごとに、尺度をそろえた分位点損失の比を求め、0.01〜100に収めたうえで幾何平均を取ります。1からその平均を引いて百分率で表すので、高いほど良く、0は基準と同じです。6.3ポイントはこの指標の差で、平均絶対誤差（MAE）が6.3%減ったという意味ではありません。95%信頼区間は、評価した課題を単位に重複を許して引き直す方法（ブートストラップ）で求めています。各店舗の改善幅を予測した区間ではありません。

    #### M5では、補助変数を加えても週次・月次の誤差はほとんど変わらなかった

    ドイツの翌日電力価格では、需要や再生可能エネルギーの発電量の予報を渡すと、分位点損失が51%減りました。Rossmannの日次売上では、販促予定、祝日、営業日を渡すと43%減りました。一方、M5では価格やカレンダーなど8変数を追加しても、週次・月次とも分位点損失の変化は2%未満でした。これらは同じt0-alphaへの入力を変えた結果です。欠品の影響をそろえて、時系列基盤モデルとGBDTを比べた結果ではありません。[一次資料PDF v1 §5.1.2・Fig. 6](https://arxiv.org/pdf/2609.24559v1)

    #### 全100課題でのt0-betaの成績は、補助変数の有無とは別の比較

    全100課題でt0-alpha自身の予測を集計すると、skillは42.9でした。そのうち事前学習と重なった8課題は、ベンチマークの規則に従ってChronos-Boltの成績に置き換えています。置き換え後の報告値は42.2です。一方、著者によるとt0-betaはベンチマークのデータセットを事前学習から除いており、全100課題で46.7でした。2モデルはパラメータ数だけでなく事前学習データも異なります。この差はモデルを大きくした効果だけを測った値ではありません。[一次資料PDF v1 §5.1.2・Table 4](https://arxiv.org/pdf/2609.24559v1)

    <figure class="teaching" data-b21><h3>モデルの重みを変えず、渡す情報だけを切り替える</h3><label>補助変数を渡すか <select><option value="0">渡さない</option><option value="1">渡す</option></select></label><script type="application/json" data-frames>["<div class=\"b21-serving\"><section><h4>将来の値が分かる30課題</h4><p>skill <strong>36.7</strong></p><p>予測対象の履歴だけをモデルに渡します。</p></section><section><h4>過去の値だけが分かる12課題</h4><p>skill <strong>32.9</strong></p><p>予測対象の履歴だけをモデルに渡します。</p></section></div>", "<div class=\"b21-serving\"><section><h4>将来の値が分かる30課題</h4><p>skill <strong>43.0</strong></p><p>予定などを渡すと、19課題で改善し、11課題で悪化しました。</p></section><section><h4>過去の値だけが分かる12課題</h4><p>skill <strong>35.6</strong></p><p>過去の補助変数を渡すと、9課題で改善しました。</p></section></div>"]</script><div data-output><div class="b21-serving"><section><h4>将来の値が分かる30課題</h4><p>skill <strong>36.7</strong></p><p>予測対象の履歴だけをモデルに渡します。</p></section><section><h4>過去の値だけが分かる12課題</h4><p>skill <strong>32.9</strong></p><p>予測対象の履歴だけをモデルに渡します。</p></section></div></div><figcaption><a href="https://arxiv.org/pdf/2609.24559v1">論文のTable 5</a>の数値です。Labはモデルを動かさず、数値の差だけを計算してresults.jsonに保存しました。</figcaption></figure>
  executable_understanding: |-
    Labの小実験は、モデルを使わずに3点を確かめます。まず論文の丸め済みのskillから、ポイント差と分位点損失の比を計算します。次に、2時点の人工例で、将来の値が分かる変数に予測対象の実績を読ませると、未来の実績が過去側へ伝わるかを確かめます。最後に、正の差分を順に足すと分位点が逆転しないことを確認します。実行するには `uv run papers/t0-tsfm-forecasting-with-context/run.py` を使います。
  results: |-
    論文の丸め済みの数値を引くと、将来の値が分かる30課題では+6.3ポイント、過去の値だけが分かる12課題では+2.7ポイントです。この数値から逆算すると、基準に対する損失比の幾何平均はそれぞれ約9.95%、約4.02%減りました。個別の課題を集計し直した値ではありません。

    人工例では、補助変数と予測対象がお互いの値を読める設定にすると、予測対象の未来の実績が過去側へ伝わりました。補助変数が予測対象の実績を読むことを禁止すると、伝わりませんでした。分位点の例では、それぞれの値が直前の分位点より大きくなりました。
  what_we_verified: |-
    Labは、論文の報告値から求める差、人工例で実績が伝わる条件、分位点が逆転しないことを計算で確かめました。確認したのは仕組みの一部です（Mechanism: PARTIAL）。固定コミットのコードを読んだ既存の記録では、論文の参照制限を確認した呼び出し経路に見つけられませんでした。詳細は対応表に記録しました。
  what_we_did_not_verify: |-
    Labは、モデルの予測精度、規模を変えたときの性能、実務での効果を検証していません（いずれもNOT TESTED）。学習済みのt0-alphaやt0-betaは動かしておらず、Chronos-2、ApolloPFN、GBDTとも同じ条件では比較していません。販促中の欠品、売上に表れない需要、在庫費用も対象外です。時点別の分位点を足しても、次の入荷までの合計需要の分位点にはなりません。
  implementation: |-
    `skill_audit()` は報告値の差を計算し、`propagate()` は、各時点と変数の組がどの実績の情報を受け取ったかを集合で記録します。`ordered_quantiles()` はsoftplusで正に変換した差分を順に足します。どれもPython標準ライブラリで動きます。`results.json` にも、公式モデルの重みを使っていないことを明記しています。
  method: method.md
  mapping: mapping.md
