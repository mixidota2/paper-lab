- kind: equations
  id: quantile-math
  title: 同じ重みのモデルに渡す情報を変える
  after: method
  locator: Eqs. 1–3 / §5.1.2
  rationale: 同じ重みのモデルに渡す情報を変える
  caption: 論文の式を説明用に整理しました。ここに示す数値は著者の報告で、Labの追試結果ではありません。
  steps:
  - name: 条件付き予測
    formula: ŷq = fθ(y₁:T, x₁:T, z₁:T+H)
    explanation: モデルの重みθを固定し、補助変数xとzを渡さない場合と比べます。
  - name: 予測時点で固定する統計
    formula: ỹt = asinh((yt−μt)/σt), ỹT+h = asinh((yT+h−μT)/σT)
    explanation: 学習時に将来の正解を変換するときも、平均と標準偏差に予測時点Tより後の実績を加えません。
  - name: 順序を保つ分位点
    formula: q̂k+1 = q̂k + softplus(rk+1)
    explanation: 正の差分を順に足すので、分位点は逆転しません。たとえば、実績が0.9分位点以下になる割合が実際に90%になることまでは保証しません。
  - name: skill
    formula: Skill = 100 × [1 − exp(mean(log(clip(Lmodel/Lseasonal-naive,0.01,100))))]
    explanation: Lは課題ごとに尺度をそろえた分位点損失です。季節ナイーブ予測に対する損失の比を求め、課題間で幾何平均を取ります。
  source: https://arxiv.org/pdf/2609.24559v1
