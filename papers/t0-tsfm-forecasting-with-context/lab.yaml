- kind: matrix
  id: cutoff
  title: 予測時点までに分かる値を渡す
  after: problem
  locator: Eq. 1 / §2 / Fig. 3
  rationale: 観測した値と、先に決まっている予定を分けて入力します。
  caption: 販促や営業の予定は事前に分かる場合があります。将来の売上実績は入力しません。
  columns:
