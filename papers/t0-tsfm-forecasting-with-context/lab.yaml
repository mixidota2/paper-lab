  - label: 将来分も分かる変数z
    cells:
    - すでに分かる値を入力します。
    - 事前に分かる予定や予報を入力します。
  source: https://arxiv.org/pdf/2609.24559v1
- kind: equations
  id: quantile-math
  title: 同じ重みのまま補助変数の有無を変える
  after: method
  locator: Eqs. 1–3 / §5.1.2
  rationale: 同じt0-alphaで、入力を変えたときの比較です。
  caption: 著者らが示した式を整理しました。数値は論文の報告で、Labがモデルを学習・評価した結果ではありません。
  steps:
  - name: 補助変数を含む予測
    formula: ŷq = fθ(y₁:T, x₁:T, z₁:T+H)
    explanation: 重みθを固定し、xとzの入力がある場合とない場合で予測します。
  - name: 予測時点までの値で標準化する
    formula: ỹt = asinh((yt−μt)/σt), ỹT+h = asinh((yT+h−μT)/σT)
    explanation: 学習でも、予測時点Tより後の実績を基準の平均と標準偏差に加えません。
  - name: 小さい分位点へ正の差を足す
    formula: q̂k+1 = q̂k + softplus(rk+1)
    explanation: 分位点の順序は逆転しません。ただし実績が0.9分位点以下になる割合が90%だと保証するわけではありません。
  - name: 季節ナイーブと比べるskill
    formula: Skill = 100 × [1 − exp(mean(log(clip(Lmodel/Lseasonal-naive,0.01,100))))]
    explanation: Lは課題の分位点損失です。基準との比を0.01〜100に収め、課題にわたって幾何平均を取ります。
  source: https://arxiv.org/pdf/2609.24559v1
