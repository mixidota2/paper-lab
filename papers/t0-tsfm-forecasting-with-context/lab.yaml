core_idea:
  author_claim: 著者らは、補助変数の変化が予測対象へ伝わる人工系列を事前学習に加えました。モデルは時系列を区間に分け、一つの変数の前後と、同じ区間にある別の変数を交互に読みます。
  research_bot_interpretation: '[ApolloPFN](apollopfn.html)やChronos-2と同じく、t0は売上履歴以外の情報も使えます。ただし、[Accuracy Is Not Service](accuracy-not-service-intermittent-demand.html)が扱うように、誤差が減っても欠品や在庫費用が減るとは限りません。小売で比べるなら、発注時点までに分かっていた情報をt0と勾配ブースティング決定木（GBDT）にそろえ、販促中と欠品中を分けます。'
sections:
  overview: |-
    Meyerらは、販売数などの履歴に、予測時点で分かっている予定を加えて予測する時系列モデルt0を開発しました。モデルは、時系列を短い区間に区切ります。一つの変数が時間とともにどう動くかと、同じ区間で変数どうしがどう関係するかを交互に読み取り、予測分布の分位点を出します。

    著者らは、学習済みのt0-alphaを変えずに、将来分が事前に分かる変数を渡す場合と渡さない場合を、公開の評価集fev-benchの30課題で比べました。季節ごとの過去の値を繰り返す基準予測と比べた指標skillは36.7%から43.0%に上がりました。差は6.3ポイントで、19課題で改善し、11課題で悪化しました。Rossmannの日次売上では、販促予定などを渡すと分位点損失が43%減りました。一方、M5の週次と月次では変化が2%未満でした。これは入力の有無を比べた結果で、発注や欠品への効果や、GBDTに対する優位性を示す比較ではありません。
  problem: 売上の履歴だけを受け取るモデルには、来週の販促日や休業日を直接伝えられません。一方で、対象と関係のない情報を入れると、予測がかえって外れることがあります。発注時点で分かる販促計画や天気予報と、実際に売れた数やその日の天気を分けます。実績を予定や予報の代わりに渡すと、当時は知り得ない情報を使ってしまいます。
  why_it_might_work: 著者らは、補助変数が変わると、予測対象の値も変わる人工データを作りました。モデルは事前学習でこうした組み合わせを読み、売上の履歴と販促の予定のような、異なる変数どうしの関係を使います。ただし、追加情報を渡せることと、追加情報が役に立つことは別です。同じモデルでも、将来分が分かる変数を渡した30課題のうち11課題で成績が悪化しました。
  evidence: |-
    #### 追加情報の有無を、同じモデルと同じ課題で比較した

    著者らは、公開の評価集fev-benchの各課題で、同じ重みのt0-alphaを2回動かしました。一方は予測対象の履歴だけ、もう一方は予測対象とは別の補助変数も入力します。[一次資料：PDF v1の第5.1.2節・表5](https://arxiv.org/pdf/2609.24559v1)。

    | 課題 | 補助変数なしのskill | 補助変数ありのskill | 差と95%信頼区間 | 改善した課題 |
    | --- | --- | --- | --- | --- |
    | 将来分まで分かる30課題 | 36.7 | 43.0 | +6.3ポイント（+2.2〜+10.9） | 19/30 |
    | 過去分だけが分かる12課題 | 32.9 | 35.6 | +2.7ポイント（+1.0〜+4.2） | 9/12 |
    | 補助変数がない58課題 | 入力は同じ | 入力は同じ | 著者らが出力の完全一致を確認 | — |

    skillは、季節の過去値を繰り返す基準予測（季節ナイーブ）に対して、分位点の予測がどれだけ良いかを表します。著者らは、課題ごとにt0の分位点損失を基準予測の損失で割り、その比を0.01〜100に収めてから幾何平均します。1からその平均を引き、百分率で表します。0は基準と同じで、高いほど良い値です。6.3ポイントはこの指標の差で、平均絶対誤差（MAE）が6.3%減ったという意味ではありません。95%信頼区間は、課題を重複ありで抽出し直すブートストラップで求めています。店舗ごとの改善幅を予測する区間ではありません。

    #### 日次のRossmannでは改善した一方、M5の週次・月次では差が小さかった

    ドイツの翌日電力価格では、需要や再生可能エネルギーの発電量の予報を加えると、分位点損失は51%低くなりました。Rossmannの日次売上では、販促、祝日、営業日の情報を加えると43%低くなりました。M5では価格やカレンダーなど8変数を入力しても、週次・月次での分位点損失の変化は、良化も悪化も2%未満でした。販売数で評価した比較で、欠品や発注費用への影響は測っていません。[一次資料：PDF v1の第5.1.2節・図6](https://arxiv.org/pdf/2609.24559v1)。

    #### 全100課題のt0-alphaとt0-betaは、別の比較

    全100課題でt0-alpha自身の予測を集計したskillは42.9でした。ベンチマークの規則では、事前学習と重なった8課題をChronos-Boltの成績で置き換えるため、報告値は42.2です。一方、著者らはt0-betaの事前学習から、ベンチマークのデータを除いたと報告しています。t0-betaの全100課題でのskillは46.7でした。両モデルはパラメーター数だけでなく事前学習のデータも異なるため、規模だけを変えた比較ではありません。[一次資料：PDF v1の第5.1.2節・表4](https://arxiv.org/pdf/2609.24559v1)。

    <figure class="teaching" data-b21><h3>同じt0-alphaに渡す情報だけを替えて比べる</h3><label>補助変数を入力するか <select><option value="0">渡さない</option><option value="1">渡す</option></select></label><script type="application/json" data-frames>["<div class=\"b21-serving\"><section><h4>将来分が既知の30課題</h4><p>skill <strong>36.7</strong></p><p>モデルに予測対象の履歴だけを入力します。</p></section><section><h4>過去分だけが既知の12課題</h4><p>skill <strong>32.9</strong></p><p>モデルに予測対象の履歴だけを入力します。</p></section></div>", "<div class=\"b21-serving\"><section><h4>将来分が既知の30課題</h4><p>skill <strong>43.0</strong></p><p>予定などを入力すると、19課題で改善し、11課題で悪化しました。</p></section><section><h4>過去分だけが既知の12課題</h4><p>skill <strong>35.6</strong></p><p>過去の補助変数も入力すると、12課題中9課題で改善しました。</p></section></div>"]</script><div data-output><div class="b21-serving"><section><h4>将来分が既知の30課題</h4><p>skill <strong>36.7</strong></p><p>モデルに予測対象の履歴だけを入力します。</p></section><section><h4>過去分だけが既知の12課題</h4><p>skill <strong>32.9</strong></p><p>モデルに予測対象の履歴だけを入力します。</p></section></div></div><figcaption><a href="https://arxiv.org/pdf/2609.24559v1">論文のTable 5</a>の数値です。Labは同じモデルで予測し直さず、丸め済みの数値の差を計算してresults.jsonに保存しました。</figcaption></figure>
  executable_understanding: Labは、公式モデルを実行せずに3つの計算をします。表5の丸め済みの値からskillの差と損失比の変化を求めます。次に、2時点の人工例で、どの条件だと将来の実績が以前の時点へ伝わるかを調べます。最後に、正の差を足すと分位点の順序が逆転しないことを確かめます。実行するには `uv run papers/t0-tsfm-forecasting-with-context/run.py`
    を使います。
  results: |-
    丸め済みの値から計算すると、将来分まで分かる30課題のskillは+6.3ポイント、過去分だけが分かる12課題では+2.7ポイントです。基準予測に対する損失比の幾何平均は、それぞれ約9.95%、約4.02%減ります。Labが個別の課題を集計し直した値ではありません。

    2時点の人工例では、補助変数と予測対象がお互いの値を読めると、将来の実績が以前の時点に伝わりました。補助変数が予測対象を読むことを禁止すると、その実績は伝わりませんでした。分位点は、正の差を順に足したため、それぞれが直前の値より大きくなりました。
  what_we_verified: Labは、論文の丸め値から求めた差と、人工例での情報の伝わり方、分位点の順序を確かめました。原論文の仕組みの一部を確認した結果です（PARTIAL）。以前に固定コミットのコードを確認した際には、読んだ経路で論文どおりの参照制限を見つけられませんでした。そこで確認した範囲は対応表に記載しました。
  what_we_did_not_verify: Labはt0-alphaやt0-betaを実行せず、性能、規模を変えた場合の動作、実店舗での効果は調べていません（NOT TESTED）。Chronos-2、ApolloPFN、GBDTとの同条件の比較も行っていません。欠品時の潜在需要や、発注と在庫の費用への影響は対象外です。時点ごとの分位点を足しても、入荷までの需要合計の分位点にはなりません。
  implementation: '`skill_audit()` は著者らの報告値から差を求めます。`propagate()` は、どの変数がどの時点の実績を受け取るかを集合で記録します。`ordered_quantiles()` はsoftplusで差を正にして順に足します。計算にはPythonの標準ライブラリだけを使います。モデルの重みを使っていないことは
    `results.json` にも記載しています。'
  method: method.md
  mapping: mapping.md
