question: 同じモデルに、予測時点で分かっている予定を渡すと精度は上がるか
summary: 著者は学習済みのt0-alphaを変えず、予測対象以外の変数（covariate）を入力する場合としない場合を比べた。fev-benchで予測時点に将来の値が分かる変数を使った30課題では、評価指標skillが36.7から43.0へ6.3ポイント上がった。改善したのは19課題で、残り11課題では悪化した。この比較からは、販促や欠品がある場合に時系列基盤モデル（TSFM）とGBDTのどちらが優れるかは分からない。
