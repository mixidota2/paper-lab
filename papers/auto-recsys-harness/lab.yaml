question: 学習に数日かかる推薦実験を並行して進めるとき、何を記録すれば別のセッションで作業を続けられるか
summary: Metaの研究チームは、推薦実験の進捗を案ごとに保存するAuto-RecSysを作りました。一つのモデルの運用記録では、実験1回あたりの大きな修正が立ち上げ期の平均4.0回から安定期の1.3回に減りました。基準モデルを変えると5回続けて復旧が必要になり、その後の6回では平均0.5回でした。学習の速さや推薦精度を測った比較ではありません。
