core_idea:
  author_claim: Metaの研究チームは、学習を待つ間に別の実験を進め、各実験の状態を共有領域に保存します。LLMが手順書を読んで次の操作を選び、スクリプトが入力の検査と状態の更新を担当します。著者は、失敗の原因と対処をモデル別の手順書へ残すことで、同じ失敗を避けやすくなり、人が1案に付き添う作業時間を減らせたと報告しています（§2–7）。
  research_bot_interpretation: 著者が減らそうとしたのは、1案を提案から分析まで進める間に人が手を動かす時間です。学習そのものが短くなったか、有益な案が増えたかは別の問いです。AutoLRのKEEPは採用した差分を次の開発の基準に反映します。一方、Auto-RecSysは長期の実験を途中から再開し、次の実験で使う手順を残す方法を示します。
sections:
  overview: |-
    Auto-RecSysは、結果が出るまで数日かかる推薦実験を、複数のサーバーで並行して進める仕組みです。実験ごとに、学習中か結果の確認待ちかといった状態を共有領域に残すので、エージェントのセッションが終わっても別のセッションで続けられます。過去の失敗と対処はモデル別の手順書に残し、状態の更新や入力の検査は決められた処理に任せます。

    著者が1モデルで追った31回の実験では、ジョブの再投入など、運用上の大きな修正が1回の実験あたり平均4.0回から1.3回に減りました。基準モデルが変わった直後には5回続けて復旧が必要になり、その後の6回では平均0.5回でした。対照群のない運用記録なので、手順書だけの効果とは言えず、学習が速くなったことや推薦精度が上がったことを示す数字でもありません。
  method: method.md
  problem: |-
    著者によると、推薦モデルに変更を入れてから結果を評価するまでに3〜7日かかることがあります。大規模な学習を実行するには、モデルの設定だけでなく、GPUの世代、パッケージの版、実行権限、再開に使うチェックポイントもそろえる必要があります。会話の中にしか進捗を残さないと、サーバーの利用期限やセッションの終了を迎えた後に続きが分からなくなります。

    複数の案を並行して試すときは、案ごとの状態に加えて、それぞれがどの基準モデルとどの期間のデータを使ったかも記録します。比較の条件が混ざると、結果の差が案によるものかを判断できません。
  why_it_might_work: |-
    GPUの世代など同じ理由で学習が失敗するなら、原因と対処を手順書に残すと、次に試す設定をエージェントが選びやすくなります。手順書には対処が使える条件を書き、ジョブIDや実験の状態など正確さが要る値はスクリプトで検査して保存します。

    ただし、案ごとに状態を分けても、複数のセッションが実験一覧を同時に更新するときの競合や、古い対処が新しい基準モデルでも使えるかどうかは別に扱う必要があります。
  evidence: |-
    ### 1モデルで記録した運用上の修正

    著者は、途中で基準モデルが変わった一つのモデルを選び、31回の実験ログを調べました。「大きな運用上の修正」（major fix step）は、学習ジョブの再投入、GPUや権限の設定、パッケージの版の不一致、メタデータの修正、基準モデルの更新などに費やしたログ上の1操作です。案を実装する際の推論や通常のデバッグは数えません（§7.2）。

    | 段階 | 実験の回 | 著者が報告した修正 |
    | --- | --- | --- |
    | 立ち上げ（Bootstrap） | 1–4 | 1回あたり平均4.0回 |
    | 安定（Stabilized） | 5–20 | 1回あたり平均1.3回 |
    | 移行（MC3 Revalidation） | 21–25 | 5回すべてで復旧が必要 |
    | 変更後の安定（MC3 Native） | 26–31 | 1回あたり平均0.5回。6回中5回は修正なし |

    21回目に、著者はグラフモードでのコンパイル、新しい埋め込みモジュール、タスク別のアダプターを組み合わせた基準モデルへ切り替えました。必要なGPUや権限、パッケージと上流コードの版も変わり、以前の手順では復旧できない問題が起きました。移行期の平均は論文の本文に明記されていないため、Labの図には載せていません。

    この比較には対照群がなく、案の難しさや人の習熟、実行基盤の変更を切り分けられません。平均4.0回から0.5回への減少を、手順書だけの効果とは判断できません。著者が別の分析で参照した10台超の開発サーバーの46セッションは、改善の具体例を探すための記録で、独立した実運用の追試46回ではありません。

    ### 人が手を動かした時間についての著者報告

    著者は、同程度の案を手作業で進めると数時間から数日かかった人の作業が、案の選択と実装の確認を人が担当し、それ以外をシステムに任せると数分になったと述べています。同じ時間で十数案を扱えたという報告ですが、比較条件をそろえた計時結果や時間のばらつきは載っていません。著者によると、学習そのものは短くなりません（§7.1）。

    §2.1の設計説明は人が確認できる4箇所として案の選択、コードの確認、学習ジョブの投入、結果の確認を挙げます。§7.1が人の作業時間の説明で挙げるのは、そのうち前半の2箇所です。報告した時間にどの設定を使ったかは明確ではありません。また、§7.2にある既知の失敗の表の19項目と、手順書に蓄積した失敗49件・修正パターン17件が、同じ時点や範囲を集計した値かは分かりません。[一次資料：§2.1、§7、図4〜6](https://arxiv.org/html/2609.10922v1)。
  executable_understanding: |-
    `uv run papers/auto-recsys-harness/run.py`

    Labは31件の仮想実験を、原則として同時に動ける4つの実行枠に割り当てます。実行枠とは、学習と復旧が終わるまで一つの実験が使う場所です。学習は1件2,880分で固定し、復旧1件で実験の所要時間に30分を足します。人の作業時間はレビューで8分、復旧1件につき12分です。これらはLabの仮定です。

    21件目で基準モデルをAからBへ変更します。教訓を残さない場合、基準モデルの版を区別して残す場合、版を区別せずに残す場合、版を区別したうえで実行枠を1つにする場合を比べます。
  results: |-
    実行枠が4つの条件では、基準モデルの版ごとに対処を残すと、大きな修正は125件から33件、人の作業時間は1,748分から644分に減りました。学習時間はどの条件でも同じです。基準モデルの変更直後は、新しい版の対処がまだ記録されていないため、再び修正が必要になりました。

    並行する実験は、先に始めた実験が完了するまで、その対処を使えません。実行枠が1つなら次の実験は直前の対処を使えるので、この例では修正は9件に減りました。一方、全実験の経過時間は、版を区別する4枠では23,280分、1枠では89,550分でした。

    版を分けない場合は、失敗の種類が同じならAで登録した対処もBで使えるとみなすため、修正が見かけ上減ります。Labは、版を分けない条件でBの実験に修正が一度もなかった場合に `unsafe_reuse` を付けます。これは古い対処を使う可能性を示す印で、個々の実験が実際に誤ったことを示しません。
  what_we_verified: |-
    仕組みの一部だけを確認しました（Mechanism PARTIAL）。合成例のコードを実行し、実験の完了前は別の実験がその教訓を使わないこと、基準モデルの版を分けると移行時に修正が必要になることを確かめました。人が作業する時間と全実験が終わるまでの経過時間も、別々に算出しました。
  what_we_did_not_verify: |-
    性能、規模を広げた場合の動作、実運用への適用は未検証です（NOT TESTED）。Labは、LLMがログから原因を特定できるか、手順書を読んで実行できるか、人が実際に何分作業するか、複数のサーバーが共有領域へ同時に書き込めるかを試していません。推薦精度や案の新規性も測っていません。著者が使ったLLMの名前と版、再現できるモデル設定、公開ログ、実行できる公式実装のURLは論文で確認できませんでした。
  implementation: |-
    `simulate()` は、実験が扱った失敗の種類に完了時刻を添えて記録します。次の実験が参照するのは、自分の開始時刻までに完了した実験の記録だけです。実行中の別ジョブが後で得る知識は先取りしないため、実行時間が重なる実験では同じ復旧が必要になることがあります。

    この例では、条件に合う記録が見つかれば対処できると仮定し、文章の手順書を読み取る処理は実装していません。基準モデルの版を記録の検索条件に使うのはLab独自の規則です。
