<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 602" role="img" aria-labelledby="title"><title id="title">LLMが操作を選び、スクリプトが状態を更新</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#586c78"/></marker></defs><rect width="560" height="602" fill="#f7faf9"/><style>text{font-family:system-ui,sans-serif;fill:#183640;font-size:19px}.small{font-size:16px}.head{font-size:23px;font-weight:700}</style>
<text x="24" y="35" class="head">LLMが操作を選び、スクリプトが状態を更新</text>
<rect x="24" y="64" width="512" height="88" rx="10" fill="#e2efea" stroke="#a6bdb5"/>
<text x="38" y="91" class="">LLMが読む手順書（skill / playbook）</text>
<text x="38" y="118" class="">LLMは目的と条件を読んで次の操作を選ぶ</text>
<path d="M280 152 L280 179" fill="none" stroke="#586c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="187" width="512" height="87" rx="10" fill="#e2efea" stroke="#a6bdb5"/>
<text x="38" y="214" class="">入力を確認するスクリプト</text>
<text x="38" y="241" class="">前提を確認し、APIを呼んで状態を更新</text>
<path d="M280 274 L280 302" fill="none" stroke="#586c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="311" width="512" height="87" rx="10" fill="#e2efea" stroke="#a6bdb5"/>
<text x="38" y="338" class="">共有領域に案ごとの状態と実験一覧を保存</text>
<text x="38" y="365" class="">ジョブID、コミット、実験履歴、操作ログ</text>
<text x="24" y="440" class="">人が確認できる4箇所（§2.1）</text>
<rect x="24" y="462" width="246" height="60" rx="10" fill="#fff0da" stroke="#a6bdb5"/>
<text x="38" y="489" class="">案の選択・コードの確認</text>
<rect x="290" y="462" width="246" height="60" rx="10" fill="#fff0da" stroke="#a6bdb5"/>
<text x="304" y="489" class="">学習の投入・結果の確認</text>
<text x="24" y="559" class="">§7.1は案の選択とコードの確認を挙げている。</text><text x="24" y="586" class="small">Labが原論文を基に作成</text></svg>
