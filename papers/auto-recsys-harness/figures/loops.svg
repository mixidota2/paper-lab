<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 554" role="img" aria-labelledby="title"><title id="title">実験を終えた後に残す二つの記録</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#586c78"/></marker></defs><rect width="560" height="554" fill="#f7faf9"/><style>text{font-family:system-ui,sans-serif;fill:#183640;font-size:19px}.small{font-size:16px}.head{font-size:23px;font-weight:700}</style>
<text x="24" y="35" class="head">実験を終えた後に残す二つの記録</text>
<rect x="24" y="66" width="512" height="60" rx="10" fill="#e2efea" stroke="#a6bdb5"/>
<text x="38" y="93" class="">発案 → 実装 → 検証 → 学習 → 分析</text>
<path d="M236 126 L145 165" fill="none" stroke="#586c78" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M324 126 L413 165" fill="none" stroke="#586c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="178" width="246" height="145" rx="10" fill="#e2efea" stroke="#a6bdb5"/>
<text x="38" y="205" class="">ジョブを動かす手順</text>
<text x="38" y="232" class="">失敗の原因と対処</text>
<text x="38" y="259" class="">学習を投入できた手順</text>
<text x="38" y="286" class="">→ モデル別の手順書</text>
<rect x="290" y="178" width="246" height="145" rx="10" fill="#fff0da" stroke="#a6bdb5"/>
<text x="304" y="205" class="">案を試した結果</text>
<text x="304" y="232" class="">基準モデルとの差</text>
<text x="304" y="259" class="">結果の理由と条件</text>
<text x="304" y="286" class="">→ 実験履歴</text>
<path d="M145 323 L145 358" fill="none" stroke="#586c78" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M413 323 L413 358" fill="none" stroke="#586c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="368" width="246" height="88" rx="10" fill="#e2efea" stroke="#a6bdb5"/>
<text x="38" y="395" class="">次の実行で手順を読む</text>
<text x="38" y="422" class="">同じ失敗を避ける</text>
<rect x="290" y="368" width="246" height="88" rx="10" fill="#fff0da" stroke="#a6bdb5"/>
<text x="304" y="395" class="">次の提案で履歴を読む</text>
<text x="304" y="422" class="">試した案を繰り返さない</text>
<text x="24" y="504" class="">手順書で失敗を防ぎ、実験履歴で案を見直す。</text><text x="24" y="538" class="small">Labが原論文を基に作成</text></svg>
