teaching_figures:
- kind: architecture
  id: prior-and-model
  title: 人工データでの事前学習と新しい系列での予測
  after: method
  locator: 図3・§3.2–3.3
  rationale: PFNが学習するときと、重みを固定して予測するときを分けます。
  caption: 人工データを作るグラフと、データから学ぶ予測モデルは別の構成要素です。矢印は値や内部表現の受け渡しを示します。
  rows:
  - label: 学習データを作る
    nodes:
    - title: 時間の信号を一つの根から流す
      text: 正弦波と余弦波の信号をグラフに伝え、説明変数xと予測する値yを取り出します。
  - label: 各層の最初の処理
    nodes:
    - title: 特徴どうしの参照（AttnFeat）
      text: 同じ時刻の説明変数と予測対象の関係をモデルが捉えます。
  - label: 次の処理
    nodes:
    - title: 時刻どうしの参照（AttnSamp）
      text: 時刻の順番や距離を、絶対位置とRoPEで表します。
  - label: 各層の出力
    nodes:
    - title: 全結合のネットワーク
      text: 特徴、時刻、全結合の各処理で、入力を出力に足して正規化します。
  - label: 学習済みモデルで予測する
    nodes:
    - title: 過去の値と分かっている将来情報を渡す
      text: 将来の実績は隠し、モデルの重みを変えずに将来の値の分布を求めます。
  source: https://arxiv.org/html/2603.15802v2
- kind: matrix
  id: visible-input
  title: 予測時にモデルへ渡す情報
  after: method
  locator: §3.1・3.3
  rationale: 将来の時刻を参照できることと、将来の実績を渡すことは異なります。
  caption: 将来の価格や販促を入力にする場合、予測時点ですでに分かっていた値かを確認します。
  columns:
  - 過去1…T
  - 将来T+1…T+H
  rows:
  - label: 予測する値y
    cells:
    - 観測した値を渡す
    - 実績を隠す
  - label: 説明変数x
    cells:
    - 観測した値を渡す
    - 予測時に分かっている値を渡す
  - label: 時刻どうしの参照
    cells:
    - 各時刻の表現を参照できる
    - 他の将来時刻の表現も参照できる
  corner: モデルへの入力と参照
  source: https://arxiv.org/html/2603.15802v2
- kind: equations
  id: pfn-loss
  title: 人工課題で予測分布を学ぶ目的
  after: method
  locator: §3.1
  rationale: 重みを調整するのは事前学習であり、実際に新しい系列を予測するときではありません。
  caption: 論文の条件付き負の対数尤度を短い記号で表します。Dpastは過去の(x,y)、xfutureは予測時に分かっている将来の説明変数です。
  steps:
  - name: 事前学習
    formula: L(θ) = − Esynthetic [ log qθ(yfuture | xfuture, Dpast) ]
    explanation: 多数の人工課題で、正解に高い確率を付けるよう重みθを調整します。新しい系列を予測するときはθを固定します。
  source: https://arxiv.org/html/2603.15802v2
