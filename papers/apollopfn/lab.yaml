summary: ApolloPFNは、人工的な時系列の課題で事前学習し、過去の実績と予測時点で分かる価格や販促予定を使って将来を予測します。小売データM5では、表の12条件を平均したRMSSEがTabPFN-TSより約5.7%小さくなりました。対象の系列では追加学習しません。
figures: []
core_idea:
  author_claim: |-
    著者は、時間とともに変わる信号を一つの根からグラフに伝え、説明変数と予測したい値を人工的に作りました。そのデータで学習したモデルは、特徴どうしの関係と時刻どうしの関係を別々に処理します。新しい系列では、過去に観測した値を入力に使い、モデルの重みは変えません。

    [一次資料：原論文v2の§3.2、§3.3、§4.2、表1](https://arxiv.org/html/2603.15802v2)
  research_bot_interpretation: 実務で使うモデルを選ぶなら、同じ予測時点に使えた価格と販促予定を、木モデルと時系列モデルの両方に渡して比べます。片方だけに将来の販促予定を与える比較では、モデルの構造と使える情報の差を切り分けられません。
sections:
  overview: |-
    ApolloPFNは、過去の販売実績に加えて価格や販促日程などを使い、将来の値がどの範囲になりそうかを予測します。著者は、複数の変数が影響し合う時系列を人工的に作り、モデルを事前学習させました。新しい系列を予測するときは、過去の実績や予測対象期間に使える情報を渡し、モデルの重みは更新しません。

    小売の公開データM5では、商品別や店舗別など複数の集計水準で比較しました。予測誤差の尺度をそろえる指標RMSSEは、TabPFN-TSと比べて平均5.7%小さくなりました。すべての集計水準で上回ったわけではなく、販促による売上の増分や発注に使ったときの効果も測っていません。
  problem: |-
    来週に販促を行うことは、過去の販売数だけを見ても分かりません。予定を入力しても、どの時刻の販売とどの予定が関係するかをモデルが捉えられなければ、販促前後の変化を取り違えることがあります。

    PFNは、多数の人工課題で事前学習したモデルに、予測したい系列の過去の観測と説明変数を与えて使う方法です。ゼロショットで省くのは対象の系列での追加学習で、過去の観測や事前学習は使います。ApolloPFNはこの方法を、観測の順序が意味を持つ時系列向けに変えました。
  why_it_might_work: |-
    事前学習で、説明変数と予測したい値が時間に沿って一緒に変わる例を見せると、新しい系列でも過去の組み合わせから関係を読み取れる可能性があります。ただし、人工課題で使う関係が、実店舗の欠品や店舗ごとに異なる販促の反応を表しているとは限りません。
  evidence: |-
    [一次資料：原論文v2の§4.2、表1、付録B・C.2・D](https://arxiv.org/html/2603.15802v2)。小売データM5の比較は、日・週・月、カテゴリ・SKU、州・店舗を組み合わせた12条件です。予測期間は日次で28日、週次で52週、月次で24か月です。著者は頻度と地域集計の組み合わせごとに一つの予測起点を評価しました。

    [M5競技の論文§3.4](https://doi.org/10.1016/j.ijforecast.2021.11.013)に従うと、RMSSEは予測期間の平均二乗誤差を、過去の単純な基準予測の平均二乗誤差で割り、平方根を取った値です。[ApolloPFN論文v2の付録B](https://arxiv.org/html/2603.15802v2)がRMSSEと呼ぶ式には、分母に過去の1期差の二乗平均があり、平方根は書かれていません。Labは表1の値がどちらの計算によるかを確かめていないため、表の掲載値をそのまま比べます。12条件の平均を比べると、ApolloPFNはTabPFN-TSより約5.7%小さくなりました。条件別に改善率を求めてから平均した値ではありません。

    TabPFN-TSとの比較では12条件中11条件でApolloPFNのRMSSEが小さくなりました。州・月次・カテゴリはApolloPFNが2.088、TabPFN-TSが2.599です。店舗・週次・カテゴリは1.663対1.667と近く、州・週次・カテゴリでは1.275対1.251でApolloPFNの方が大きくなりました。TabPFN-TSも外生変数を使います。表1のすべての比較モデルが同じ外生変数を扱えるわけではありません。
  executable_understanding: |-
    Labは、季節性に販促の上乗せを加えて16期の需要を作ります。第9〜11期に需要が12ずつ増える設定です。販促効果の大きさは既知と仮定し、データから推定しません。

    配布した `results.json` には、販促予定を何期早めたか、または遅らせたかに応じた予測と誤差があります。負の値は前倒し、正の値は後ろ倒しです。平均絶対誤差（MAE）は予測誤差の絶対値を全期間で平均した値です。季節性だけの予測と、販促予定がある期に12を足す予測を比べます。

    リポジトリでは `uv run papers/apollopfn/run.py` で実行し、9つの条件の結果を `results.json` に保存します。
  results: |-
    季節性だけで予測した場合のMAEは、どの設定でも2.25です。正しい販促予定を使うとMAEは0で、予定が前後1期ずれると1.5、2期ずれると3.0、3期か4期ずれると4.5でした。この例では2期以上ずれると、予定を使った方が季節性だけの予測より誤差が大きくなります。ApolloPFNを実行して得た性能差ではありません。
  what_we_verified: |-
    16期の合成需要を使って、予定を前後4期まで動かす9条件を確認しました。販促が実際にある期と予定にある期の片方にしか入らない期が増えると、予測がずれます。この例ではその期数に12を掛け、16で割るとMAEになります。季節性だけのMAEは2.25です。原論文のモデルは検証していません。
  what_we_did_not_verify: |-
    Labは、同じ将来情報を使ったLightGBMやChronos-2との比較、欠品時に観測できなかった需要の推定、発注費用を測っていません。合成例で使う販促の上乗せは仮定であり、実店舗の売上に対する販促の効果でもありません。

    現場で検証するなら、価格や販促予定、天候予報は、予測を出した時点で入手できた版を保存して使う必要があります。後から更新された予定や観測された天候を当時の入力として使うと、実際には使えない情報で評価することになります。
  implementation: |-
    `run.py` は `_toy_common.py` にある `apollo()` を使います。配布物だけで動かす場合は、`_toy_common.py` と同じ場所に `apollopfn` フォルダを作り、その中に `run.py` を置いて実行します。標準ライブラリだけで動き、同じフォルダに `results.json` ができます。初期条件の表と販促予定をずらした9条件を同じ関数で計算します。

    PFNの事前学習、人工時系列を作るグラフ、Transformerの処理、M5での評価は実装していません。
  mapping: |-
    | 原論文の箇所 | Labで説明または計算したこと | Labで再現していないこと |
    | --- | --- | --- |
    | §3.1–3.3 | 本文と図が、人工課題による事前学習、特徴方向と時間方向の処理、予測時に使う情報を説明します。 | 公式実装との行単位の照合やモデルの実行はしていません。 |
    | §4.2、表1 | 著者が報告したM5のRMSSEを比較します。 | 評価は再実行していません。 |
    | 将来の説明変数 | `run.py` が、販促予定だけをずらしたときの誤差を `results.json` に保存します。 | Lab独自の合成例です。論文の性能比較ではありません。 |
  method: method.md
question: 予測時点で分かる価格や販促予定を使って、新しい系列を追加学習なしで予測できるか
