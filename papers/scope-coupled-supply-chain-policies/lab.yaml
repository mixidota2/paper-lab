question: 品揃えや補充の間隔を変えると、配送計画と全体の評価値はどう変わるか
summary: SCOPEは、品揃え、供給元、補充の間隔を決めてから、その結果を使って配送経路を作ります。JD.comの物流データでは、計画全体の評価値が、工程ごとに判断する最良の比較手法より1.58%高くなりました。実現利益や売上を測った結果ではありません。
