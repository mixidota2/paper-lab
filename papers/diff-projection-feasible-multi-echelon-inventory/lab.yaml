verdict: Worth
status: published
summary: 資材や設備を製品間で分け合いながら、実際に作れる整数の生産量を決める。2製品の例で、どの上限に達しているかによって、目標の変化が決定にどう伝わるかを確かめる。
question: 設備や資材の上限を越えない整数の生産量を選びながら、モデルの学習に必要な勾配をどう返すか。
verification:
  mechanism: PARTIAL
  performance: NOT TESTED
  scaling: NOT TESTED
  production_applicability: NOT TESTED
core_idea:
  author_claim: 【著者の主張】ニューラルネット（NN）が出した連続値の生産目標を、強凸二次計画（QP）で制約内の近い点に移す。次に、その制約の厳しさを表す双対価格を使って整数にする。学習時は射影の解析Jacobianと、整数化を通る勾配を近似するSTEを組み合わせ、微分可能なシミュレーターの費用からNNを更新する。
  research_bot_interpretation: 【Labの解釈】DeepStockが在庫の構造を手がかりに方策を探すのに対し、この研究は複数製品で共有する資材や設備の上限を、各期の整数の生産判断に直接反映する。Constrained
    FBSDEが在庫などの時間変化を制約するのとは、守る対象が異なる。性能の優劣を比べたわけではない。
sections:
  overview: 例えば2製品に同じ設備を使うとき、一方を増産すれば他方に使える時間が減る。この研究は、モデルが出した生産目標を共有制約の範囲に収め、整数の生産量に変える。著者は小規模24条件で平均最適性ギャップ0.91%、ASML
    Research Challengeの14品目では最良のechelon DBS比で2設定それぞれ3.22%／2.54%の費用削減を報告した。Labでは、この費用を再現せず、射影の勾配と整数化を2製品で検算する。
  problem: 多段階の生産計画では、製品ごとの上限を守っても、全製品で同じ資材や設備を使い過ぎることがある。すべての製品の生産量をまとめて決める必要がある。満たせなかった需要は、次期以降に届ける注文（バックオーダー）として残す。欠品でその場の売上を失う小売モデルや、食品売場の棚割りを無作為化して効果を測る試験（RCT）とは別の設定だ。
  why_it_might_work: '【Labの解釈】勾配には、目標を少し変えたとき、実際に選んだ量がどの方向に動くかが表れる。上下限から離れているFreeでは目標どおりに動く。製品1が個別上限に達したPinnedでは、その量をこれ以上増やせない。2製品で共有上限に達したCompetingでは、製品1を増やすには製品2を減らす。


    著者の補題1では、資材残量などで上限が変わる場合、目標側では失われた方向の情報が、制約式の右辺bへの勾配に現れる。残量を変えた過去の判断にも学習信号を返せる。固定容量にはこの補償がない。等号になっている制約の組（活性集合）が切り替わる点で、通常の微分が常に存在するという主張でもない。'
  evidence: '以下は著者のシミュレーション結果。Labで再現した値ではない。一次資料の[著者PDF](https://arxiv.org/pdf/2608.02343)で、§4–6、図3–6、表1–5を確認した。


    |条件|著者報告|出典|

    |---|---|---|

    |小規模24条件|平均最適性ギャップ0.91%、22/24で最適化SBSを上回る|表1|

    |Tempelmeier型ネットワーク|最良echelon base-stock比で最大9.75%削減、rolling MSP比で少なくとも7.7%削減|表2・§6.3|

    |ASML 14品目、設定1／2|最良echelon DBS比3.22%／2.54%削減|表4|

    |整数化をfloorに替える−IM|費用が11.83%／15.79%増加|表5|


    ASMLの設定1では、複数段階の在庫を見て補充するechelon DBS、複数段階の確率的計画（MSP）、提案法を比較した。平均総費用はechelon DBS 286.99、MSP 289.25、提案法277.74。提案法はDBSより保有費用が低く、MSPよりバックオーダー費用が低い。表4には通常のDBS列もある。削減率の比較先は最良のechelon
    DBSの列。'
  executable_understanding: '2製品の目標をz、生産量をxとする。x₁≥0、x₂≥0、x₁≤3、x₁+x₂≤6を満たす多角形の中から、zに一番近い点を選ぶ（射影）。重みはW=diag(1/2,1/2)。すべての辺の最近点を調べて厳密解を選ぶので、外部QPソルバーは不要。制約のかかり方を3通り選び、連続出力をどれだけ動かすかを表す解析Jacobianを、目標を両側にわずかに動かす中心差分と照合する。


    次に§4.1.2に沿って、小数点以下を切り捨てた量（floor）から始める。双対価格を使った優先順位で、各製品の量を1単位だけ増やせるか調べる。制約を守り、目標からのずれを評価する目的関数を悪化させない増分だけを採用する。6,561個の目標を同条件でfloorと比べ、すべての整数点を調べた解とも照合する。図5に対応する別実験では、x₁+x₂≤2の下で(1,1)を選ぶ目標の範囲を調べる。'
  results: '6,561個の目標のうち、整数化した後の制約違反は0件。3,915件で単なる切り捨てより目的関数の値が改善した。この2製品の設定では、すべての整数点を列挙した最適解との差も0だった。整数写像は一般には近似であり、この一致は一般の整数QPでは保証されない。


    図5の縮約では、1,600個の目標のうち、切り捨てで(1,1)になったのは0件、提案の整数化では1,600件だった。(1,1)に写る目標が面積を持ちうる例で、論文の完全性定理の証明ではない。完全性は、各整数行動に写る目標の集合が、単に空でないだけでなく、Lebesgue測度で正の大きさを持つ条件を指す。'
  what_we_verified: '**CONFIRMED — 局所計算**：Free／Pinned／Competingの各例で、Jacobianが中心差分と一致した。全サンプルの整数行動が制約を守り、切り捨てよりも目的関数を悪化させないことをassertで確かめた。


    **PARTIAL — 一部だけ実装**：QPによる射影と整数化を2製品に縮約した。NN、経路微分による方策学習（HDPO）、整数化を逆伝播するときに恒等写像とみなすSTEは、学習実験に含めていない。'
  what_we_did_not_verify: '**NOT TESTED**：多段階在庫の長期費用、小規模の最適性ギャップ0.91%、ASMLの費用削減、規模を大きくしたときの挙動、現場導入。STEは真の微分を計算しないため偏りがあり、学習にどれだけ有効かは未検証。一般制約での完全性や誤差の上限は論文の主張として紹介する。'
  implementation: '`UV_CACHE_DIR=/tmp/uv-cache uv run --no-project papers/diff-projection-feasible-multi-echelon-inventory/run.py`を実行すると、results.jsonを作り直せる。Python標準ライブラリを使い、乱数、GPU、外部データは使わない。


    HTMLはlab.yaml、README.md、method.md、mapping.md、run.py、results.jsonから生成し、図はpaper_lab/projection01.pyで表示する。提供PDFでは公式コードへのリンクを確認できず、公式実装は実行していない。'
  method: method.md
  mapping: mapping.md
teaching_figures:
- id: projection-equations
  kind: equations
  after: method
  title: 実際に選ぶ生産量と、学習で返す勾配は別に計算する
  caption: 式(2)、補題1、§4.1.2。図3の学習経路に対応する。
  source: https://arxiv.org/abs/2608.02343
  locator: Equation (2), Lemma 1, Figure 3
  rationale: 生産量を制約内に収める計算と、学習用の勾配を近似する計算を区別する。
  steps:
  - name: 強凸二次計画（QP）で制約内の点を選ぶ
    formula: 'x* = argmin { ½(x−z)ᵀW(x−z) : Mx ≤ r }'
    explanation: Wは正定値。非空な実行可能集合では解が一意に定まる。
  - name: 目標を少し動かしたときの出力の変化
    formula: Jz = I − W⁻¹ M̃ᵀ(M̃W⁻¹M̃ᵀ)⁻¹M̃
    explanation: 線形独立で等号になっている制約の組が、目標を少し動かしても同じ場合に使える。
  - name: 整数写像の近似微分
    formula: ∂̂x/∂x* = I; ∂̂x/∂z = 0; ∂̂x/∂λ* = 0
    explanation: 実際に採用するのは整数の生産量。逆伝播のSTEは、整数化による変化を真に微分した値ではない。
- id: constraint-map
  kind: matrix
  after: why_it_might_work
  title: 手法ごとに、何を守るかは異なる
  caption: 本Labの整理。手法間の直接比較結果ではない。
  source: https://arxiv.org/abs/2608.02343
  locator: Sections 2, 4; comparison is Lab interpretation
  rationale: 毎期の行動を制約する場合と、在庫などの状態の推移を制約する場合を分ける。
  columns:
  - 制約の対象
  - このLabとの関係
  rows:
  - label: Diff Projection
    cells:
    - 各製品の整数の生産量と、共有する資材・設備の上限
    - QPで制約内に移し、整数にした後も毎期の制約を守る
  - label: Constrained FBSDE
    cells:
    - 連続時間での在庫と排出予算
    - 状態の推移を制約する。発注遅延と時間の離散化も扱う
  - label: OR-Transformer
    cells:
    - 在庫の運用にかかる費用
    - 費用を減らす判断と、共有制約を満たす整数の判断は別の課題
