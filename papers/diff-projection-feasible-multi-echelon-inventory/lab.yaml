id: diff-projection-feasible-multi-echelon-inventory
title: 'Hard Constraints, Smooth Gradients: Learning Feasible Inventory Policies via Differentiable Projection'
authors:
- Patrick P. Helm
- Jan-Niklas Doerr
- Joren Gijsbrechts
- Stefan Minner
year: 2026
arxiv_id: '2608.02343'
submitted: '2026-08-03'
topics:
- retail-supply
- ml-systems
urls:
  paper: https://arxiv.org/abs/2608.02343
  arxiv: https://arxiv.org/abs/2608.02343
  pdf: https://arxiv.org/pdf/2608.02343v1
verdict: Worth
status: published
summary: 著者は、連続値の生産目標を、設備や資材の上限を守る整数の生産量に直します。学習時は、制約を守る連続値を選ぶ計算と、そこから整数にする計算を分けて扱います。Labでは2製品の例で、目標を少し変えると生産量がどう動くかを確かめます。
question: 設備や資材の上限を守る整数の生産量を決めながら、学習に必要な勾配をどう計算するか
verification:
  mechanism: PARTIAL
  performance: NOT TESTED
  scaling: NOT TESTED
  production_applicability: NOT TESTED
core_idea:
  author_claim: ニューラルネットワークが各製品の連続的な生産目標を出し、二次計画が制約を守る最も近い点を選びます。著者はそこから整数を選び、学習では連続値の厳密な局所勾配と、整数化の近似勾配を使ってモデルを更新します。
  research_bot_interpretation: この論文は、毎期の整数の生産量で共有資材や設備の上限を守ります。DeepStockは在庫の関係式を強化学習に組み込み、Constrained FBSDEは在庫などの状態の推移を制約します。異なる判断を扱う研究で、同じ条件で性能を比べた結果ではありません。
sections:
  overview: |-
    複数の製品で設備や資材を分け合うときは、製品ごとの生産量を別々に決めると、全体の上限を超えることがあります。著者は、学習モデルが出した目標を上限内の近い値に移し、整数の生産量に直す方法を提案しました。学習時は整数化を通る勾配を近似し、将来の在庫費用から生産目標の出し方を学びます。

    論文の改訂版では、ASMLの研究課題をもとに14品目の生産と在庫をシミュレーションしました。予測に応じて在庫目標を変える最良の比較手法に対し、平均費用は基本設定で0.9%、設備容量が厳しい設定で1.8%低くなりました。これは実際の工場で生産計画を変えた結果ではありません。初版とは評価の条件が違うため、数値を区別して紹介します。
  problem: |-
    多段階の生産では、製品ごとの上限を守っても、設備や資材を合計すると使いすぎることがあります。そのため、担当者は複数製品の生産量をまとめて決めます。論文は、満たせなかった最終製品の需要を次期以降に引き渡す注文（バックオーダー）として扱います。その場で売上を失う小売モデルとは異なります。段取り替えにかかる時間や費用は扱いません。実際の食品売場で棚割りを変える無作為試験でもありません。
  why_it_might_work: |-
    制約に達していない例では、目標を変えた分だけ、整数にする前の生産量も変わります。製品1の個別上限に達した例では、目標を増やしても製品1の量は変わりません。2製品で共有上限に達した例では、製品1を増やすと製品2が同じだけ減ります。

    著者は、この連続値の変化を、等号になっている制約の組（活性集合）が近くで変わらない場合に計算します。制約が切り替わる点では、通常の微分が常にあるわけではありません。資材残量によって制約の右辺が変わる場合、右辺を通じて過去の生産判断にも勾配が戻ります。容量が固定なら、この経路では過去の判断まで勾配は伝わりません。整数化だけを恒等写像のように扱う近似とは別の計算です。
  evidence: |-
    一次資料は[改訂版（v2）§6.4、表5](https://arxiv.org/html/2608.02343v2#S6.SS4)と§6.5の表6です。著者は各設定で1,000通りの需要経路を使い、DBSで30期間を動かして得た初期状態と、その後の需要を各手法でそろえました。表5では、最良の比較手法DBSに対し、平均費用は基本設定で278.0から275.4へ0.9%、容量が厳しい設定k−で299.6から294.3へ1.8%下がりました。削減率の対応のある99%信頼区間の半幅はそれぞれ0.3、0.6ポイントです。

    表5の4設定とは別に、本文には、さらに容量が厳しいk−−でDBSより3.1%低くなったという比較があります（対応のある99%信頼区間の半幅は0.6ポイント）。これは表5の主要4設定の数字ではありません。

    改訂版の表6では、提案した整数化を切り捨てに替えると、全機能を使う方式に比べて基本設定で11.9±2.0%、k−で35.9±6.9%費用が増えました。±の幅は対応のある99%信頼区間の半幅です。整数化の近似勾配（STE）だけを学習から外し、評価時には同じ整数化を使った場合、平均費用の差は最大0.6%で、区間は0に届きました。連続値を選ぶ射影の勾配までSTEに置き換えた試行では学習が発散しましたが、他の設定でも学習できないと示したわけではありません。

    以下は[初版の一次資料PDF（v1）](https://arxiv.org/pdf/2608.02343v1)の著者報告です。Labの費用図はこの版の表4の設定1を使い、改訂版の結果とは比べません。

    | 初版の条件 | 著者が報告した結果 | 出典 |
    | --- | --- | --- |
    | 小規模24条件 | 平均の最適性ギャップは0.91%。最適化したSBSより22/24条件で低費用 | 表1 |
    | Tempelmeier型ネットワーク | 最良のechelon base-stockより最大9.75%、rolling MSPより少なくとも7.7%低費用 | 表2、§6.3 |
    | ASMLの研究課題、14品目の設定1と2 | 最良のechelon DBSより順に3.22%／2.54%低費用 | 表4 |
    | 整数化を切り捨てに替える（−IM） | 提案法より順に11.83%／15.79%高費用 | 表5 |

    初版の設定1の平均総費用は、複数段階の在庫を見て補充するechelon DBSが286.99、複数段階の確率計画（MSP）が289.25、提案法が277.74です。提案法はechelon DBSより保有費用が低く、MSPよりバックオーダー費用が低くなりました。削減率の比較相手は表の中で最も費用が低かったechelon DBSです。どちらの版もシミュレーションで、実際の工場で計画を変えた結果ではありません。
  executable_understanding: |-
    Labでは2製品の目標をz、生産量をxとします。生産量が非負、製品1は3以下、2製品の合計は6以下という制約の中で、目標に最も近い連続値を選びます。重みはW=diag(1/2,1/2)です。Labは辺ごとの最近点を調べて解を求め、外部の二次計画ソルバーは使いません。図で制約のかかり方を変えると、目標を少し動かした場合の勾配を比べられます。Labは、この勾配を目標を両側へ少し動かして求めた値と照合しました。

    次に、小数点以下を切り捨て、優先度に沿って各製品を1個ずつ増やせるか調べます。制約を守り、目的値も悪化しない場合だけ増やします。Labは6,561個の目標で、提案された整数化を切り捨てや、整数解をすべて列挙した最適値と比べました。別の計算では、共有上限を2として、(1,1)を返す目標がどれだけあるかを調べます。
  results: |-
    6,561個の目標では、整数化の後も制約違反はありませんでした。3,915件で切り捨てより目的値が低くなり、この格子では、整数解をすべて列挙したときの最適値との差も0でした。ただし、各製品が使う資材の量が異なる例では、優先度順の整数化が最適にならない場合があります。手法の説明に、同じ目的関数で二つの整数解を比較する例を載せました。

    共有上限が2のとき、格子上の1,600個の目標のうち、提案された整数化は全件で(1,1)を返し、切り捨ては0件でした。切り捨てで(1,1)になる目標もありますが、それらは面積が0の半直線に限られ、この格子はそこを避けています。この例は、すべての実行可能な整数解に、正の面積を持つ目標の集合があるという論文の一般の証明ではありません。
  what_we_verified: |-
    CONFIRMED（確認済み）：3種類の制約のかかり方で、連続値の勾配が中心差分と一致しました。Labで試したすべての目標について、整数化した解が制約を守り、切り捨てに比べて目的値を悪化させないことも確認しました。

    PARTIAL（一部確認）：Labで実装したのは、2製品の射影と整数化です。ニューラルネットワーク、経路微分による方策学習（HDPO）、整数化の近似勾配を使う学習は動かしていません。
  what_we_did_not_verify: |-
    NOT TESTED（未検証）：Labは多段階在庫の長期費用、小規模問題の最適性ギャップ0.91%、ASMLの研究課題の費用削減、規模を広げたときの性能、現場導入を検証していません。整数化のSTEは真の勾配ではなく、学習にどれだけ役立つかも、この例では確かめていません。一般の制約や重みでの完全性や誤差の上限は、Labの結果ではありません。
  implementation: |-
    リポジトリの直下で次を実行すると、外部ライブラリを用いずに `results.json` を作り直せます。乱数、GPU、外部データは使いません。

    ```bash
    UV_CACHE_DIR=/tmp/uv-cache uv run --no-project papers/diff-projection-feasible-multi-echelon-inventory/run.py
    ```

    `run.py` が射影と整数化を計算し、`paper_lab/projection01.py` が図を描きます。サイトは `lab.yaml`、`method.md`、`mapping.md`、計算結果からHTMLを生成します。配布の `README.md` にも手法と結果を載せています。提供PDFでは公式コードへのリンクを確認できず、著者の実装は動かしていません。
  method: method.md
  mapping: mapping.md
teaching_figures:
- id: projection-equations
  kind: equations
  after: method
  title: 生産量を選ぶ式と、学習で返す勾配
  caption: 初版の式(2)、補題1、§4.1.2をもとに、図3の学習手順を整理しました。
  source: https://arxiv.org/abs/2608.02343v1
  locator: 初版の式(2)、補題1、図3
  rationale: 制約を守る連続値を求める計算と、整数化を通じて返す近似勾配を分けます。
  steps:
  - name: 制約内で目標に近い量を選ぶ
    formula: 'x* = argmin { ½(x−z)ᵀW(x−z) : Mx ≤ r }'
    explanation: 目標zとの差に重みWをかけます。Wが正定値で、制約を守る点が少なくとも一つあれば、解は一つに決まります。
  - name: 目標を少し動かしたときの変化を求める
    formula: Jz = I − W⁻¹ M̃ᵀ(M̃W⁻¹M̃ᵀ)⁻¹M̃
    explanation: 目標を少し動かしても、等号になる独立な制約が変わらない範囲で、この式を使います。
  - name: 整数化に近似の勾配を使う
    formula: ∂̂x/∂x* = I; ∂̂x/∂z = 0; ∂̂x/∂λ* = 0
    explanation: 実際の生産量には整数を使います。学習では整数化だけを恒等写像とみなし、真の微分の代わりに使います。
- id: constraint-map
  kind: matrix
  after: why_it_might_work
  title: 研究によって異なる制約の対象
  caption: Labが各論文をもとに整理しました。同じ条件で性能を比較した表ではありません。
  source: https://arxiv.org/abs/2608.02343v1
  locator: 初版の§2・4、関連研究の一次資料
  rationale: 毎期の生産量を制約する場合と、時間とともに変わる状態を制約する場合を区別します。
  columns:
  - 何を制約するか
  - どのように扱うか
  rows:
  - label: Diff Projection
    cells:
    - 製品別の整数の生産量と、共有資材や設備の上限。
    - 二次計画で制約内に移し、整数にした後も毎期の上限を守ります。
  - label: Constrained FBSDE
    cells:
    - 連続時間での在庫や排出予算。
    - 状態の推移を制約します。発注が届くまでの遅れと、時間を区切って計算する方法も扱います。
  - label: OR-Transformer
    cells:
    - 在庫運用の費用を減らす判断。
    - 費用を減らす判断と、共有上限を守る整数の生産量を選ぶ判断は別です。
