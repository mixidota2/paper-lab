verdict: Worth
status: published
summary: 共有資材・生産能力を守るQP射影と整数写像。Free／Pinned／Competingの勾配を2変数で追う。
question: 整数の生産制約を守りながら、学習信号をどう返すか。
verification:
  mechanism: PARTIAL
  performance: NOT TESTED
  scaling: NOT TESTED
  production_applicability: NOT TESTED
core_idea:
  author_claim: 【著者の主張】NNの連続目標を強凸QPで実行可能領域へ射影し、双対価格を使う整数写像で離散行動に変える。解析JacobianとSTEを組み合わせ、微分可能なシミュレーター上で端から端まで学習する。
  research_bot_interpretation: 【Labの解釈】DeepStockが方策の探索を在庫構造で整えるのに対し、本手法は品目間の結合制約と整数実行可能性を学習経路へ組み込む。Constrained
    FBSDEの経路上の状態制約とは守る対象が異なる。直接の優劣比較ではない。
sections:
  overview: 連続値の生産目標を、資材・共有設備の制約を守る整数行動に変換する研究。著者は小規模24条件で平均最適性ギャップ0.91%、ASML Research
    Challengeの14品目で最良のechelon DBS比3.22%／2.54%の費用削減を報告した。本Labでは、射影の勾配と整数化だけを2変数で検算する。
  problem: 対象は生産計画だ。複数段階の在庫を扱う。複数の製品が資材や生産能力を共有するため、品目ごとの上限処理では実行可能性を保てない。需要未充足はバックオーダーとして繰り越す。売り逃しを扱う小売モデルや、食品売場の棚割りRCTへの実証ではない。
  why_it_might_work: '【Labの解釈】共有制約に当たった目標の勾配を、他品目との配分変更へ変換できる点が効きそうだ。Freeでは勾配を通し、Pinnedでは対象座標が動かず、Competingでは一方の増加が他方の減少になる。


    著者の補題1では、状態に依存する制約で失われた目標側の方向が、制約右辺bへの勾配に現れる。資材を不足させた過去の意思決定へ学習信号を返せる。一方、固定容量の制約にはこの補償がない。活性集合の切替点で通常の微分が常に存在するという主張でもない。'
  evidence: '一次資料は[著者PDF](https://arxiv.org/pdf/2608.02343)の§4–6、図3–6、表1–5。いずれも著者によるシミュレーション評価で、本Labの再現値ではない。


    |条件|著者報告|出典|

    |---|---|---|

    |小規模24条件|平均最適性ギャップ0.91%、22/24で最適化SBSを上回る|表1|

    |Tempelmeier型ネットワーク|最良echelon base-stock比で最大9.75%削減、rolling MSP比で少なくとも7.7%削減|表2・§6.3|

    |ASML 14品目、設定1／2|最良echelon DBS比3.22%／2.54%削減|表4|

    |整数化をfloorに替える−IM|費用が11.83%／15.79%増加|表5|


    ASML設定1の平均総費用はechelon DBS 286.99、MSP 289.25、提案法277.74。提案法はDBSより保有費用が低く、MSPよりバックオーダー費用が低い。単純なDBS列と最良のechelon
    DBS列を混同しない。'
  executable_understanding: '2変数の目標zを、x₁≥0、x₂≥0、x₁≤3、x₁+x₂≤6の多角形へ射影する。W=diag(1/2,1/2)。全辺への最近点から厳密解を選ぶため、外部QPソルバーは不要。3つの活性集合を選び、解析Jacobianを中心差分と照合する。


    次に§4.1.2どおり、floorを初期値にして双対価格を使う優先順位で各座標を1回ずつ増やす。実行可能で射影目的を悪化させない増分だけを採用する。6,561個の目標を同条件でfloorと比較し、整数点の全探索とも照合する。図5に対応するx₁+x₂≤2の別実験では、境界の整数点(1,1)に到達する目標領域を調べる。'
  results: '6,561目標で整数行動の制約違反は0件。3,915件でfloorより射影目的が改善し、この2変数設定では整数全探索との差も0だった。一般には近似解だ。この一致を一般の整数QPの最適性保証へ広げられない。


    図5の縮約では1,600目標のうち、floorが(1,1)を選んだのは0件、整数写像では1,600件だった。これは正の面積を持つ到達領域の数値例であり、論文の完全性定理の証明ではない。完全性は単に点へ到達できることではなく、各整数行動へ写る目標の集合について、Lebesgue測度が正となる条件を指す。'
  what_we_verified: '**CONFIRMED — 局所計算**：Free／Pinned／CompetingのJacobianと中心差分の一致、全サンプルでの整数実行可能性、floorからの非悪化をassertで確認した。


    **PARTIAL — メカニズム全体**：QPと整数写像の縮約だけを実装した。NN、経路微分による方策学習（HDPO）、整数写像の逆伝播を恒等写像とみなすSTEは学習実験に含めていない。'
  what_we_did_not_verify: '**NOT TESTED**：多段階在庫の長期費用、最適性ギャップ0.91%、ASML費用削減、スケーリング、現場導入。STEには偏りがある。学習効果も未検証。一般制約での完全性・誤差境界は論文の主張として紹介した。'
  implementation: '`UV_CACHE_DIR=/tmp/uv-cache uv run --no-project papers/diff-projection-feasible-multi-echelon-inventory/run.py`でresults.jsonを再生成する。Python標準ライブラリだけを使用。乱数、GPU、外部データは使わない。


    HTMLはlab.yaml、README.md、method.md、mapping.md、run.py、results.jsonから生成する。図の表示はpaper_lab/projection01.py。提供PDF内で公式コードへのリンクを確認できず、公式実装は未実行。'
  method: method.md
  mapping: mapping.md
teaching_figures:
- id: projection-equations
  kind: equations
  after: method
  title: 射影から整数行動へ、順方向と逆方向を分ける
  caption: 式(2)、補題1、§4.1.2。図3の学習経路に対応する。
  source: https://arxiv.org/abs/2608.02343
  locator: Equation (2), Lemma 1, Figure 3
  rationale: 実行可能性を守る順方向と、近似勾配の境界を明示する。
  steps:
  - name: 強凸QP
    formula: 'x* = argmin { ½(x−z)ᵀW(x−z) : Mx ≤ r }'
    explanation: Wは正定値。非空な実行可能集合では解が一意に定まる。
  - name: 目標へのJacobian
    formula: Jz = I − W⁻¹ M̃ᵀ(M̃W⁻¹M̃ᵀ)⁻¹M̃
    explanation: 独立な活性制約が局所的に変わらない条件で使う。
  - name: 整数写像の近似微分
    formula: ∂̂x/∂x* = I; ∂̂x/∂z = 0; ∂̂x/∂λ* = 0
    explanation: 順方向は整数行動。逆方向のSTEは真の微分ではない。
- id: constraint-map
  kind: matrix
  after: why_it_might_work
  title: 何を制約し、どこへ勾配を返すか
  caption: 本Labの整理。手法間の直接比較結果ではない。
  source: https://arxiv.org/abs/2608.02343
  locator: Sections 2, 4; comparison is Lab interpretation
  rationale: 異なる制約を同じ安全性として扱わない。
  columns:
  - 制約の対象
  - このLabとの関係
  rows:
  - label: Diff Projection
    cells:
    - 離散生産行動と共有資材・設備
    - QPと整数写像で毎期の実行可能性を守る
  - label: Constrained FBSDE
    cells:
    - 連続時間の在庫・排出予算
    - 状態の経路制約。遅延と離散化も課題
  - label: OR-Transformer
    cells:
    - 費用を考慮した在庫意思決定
    - 結合した整数行動の保証とは別軸
