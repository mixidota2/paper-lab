question: kernelが速くなっても、配信全体が速くならなければ棄却できるか
summary: UnityのFlashVectorはNsight/eBPFの測定から層ごとの変更を提案し、本番traffic replayで全体のthroughputとlatencyを検証する。model serverは最大2×
  throughput・1.98× latency speedup、feature処理は約1.6×。局所速度と採択条件を分けて読む。
