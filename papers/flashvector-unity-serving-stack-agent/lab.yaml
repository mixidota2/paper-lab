core_idea:
  author_claim: 著者らは、GPUの演算、モデルの計算、モデルサーバー、要求時の特徴量処理に、計測・診断・変更・検証の同じ手順を使います。出力と局所の計測結果を確認した後、配信全体でも負荷をかけて調べます。採用した変更と採用しなかった変更を記録し、次の試行に使います。
  research_bot_interpretation: Labでは、[AURA](aura-disney-agentic-rec-diagnosis.html)が扱う推薦品質の診断と、FlashVectorが扱う配信性能の変更を分けて考えます。[AgentX](agentx-kuaishou.html)、[CORAL](coral-meta-config-harness.html)、[DREAM](dream-taobao-agentic-control.html)、[PILOT](pilot-experiment-lifecycle.html)とも、変更できる対象と、何を確かめて採用するかを比べます。配信の処理能力を、研究コードの採否・設定探索・実行時の制御・実験運用に続く5つ目の役割と位置付けるのは、このLabの整理です。
sections:
  overview: |-
    Wuらは、Unityの広告配信でモデルを速くするために、FlashVectorを開発しました。FlashVectorはGPUの演算だけでなく、モデルサーバーの入力変換や、要求を受けてから特徴量を作る処理も調べます。時間がかかる箇所を測って変更案を出し、変更後の出力を確かめます。そのうえで実際の配信要求を再生し、応答時間と配信全体の処理件数を測って、変更を残すか判断します。

    同じ環境で変更前後を比べると、ある順位付けモデルでは同じ時間に処理できる件数が2.00倍になりました。別の候補検索モデルで最大30倍速くなったのは入力変換だけで、配信全体で処理できる件数は1.10倍でした。著者らが示したのは個別のモデルでの比較です。全モデルの平均や、広告のクリック率が改善したことを示す結果ではありません。
  problem: モデル配信が遅くなる原因は、GPUの演算にも、PythonやC++で動くサーバーにもあります。処理によって必要な計測器が異なります。モデルを学習し直したり、機器を更新したりすると、前に効いた設定が効かなくなることもあります。コードを生成するだけでは、遅い箇所を間違えたり、出力を壊したり、別の処理に負荷を移したりしたことに気づけません。
  why_it_might_work: FlashVectorは、実行時に測った時間や、入力の配列の形を変えると処理がどう変わるかを調べます。こうした情報があれば、汎用のコンパイラだけでは見つけにくい重複処理も候補にできます。試行の記録は次に同じモデルを見直すときに使えます。ただし著者らは、熟練者と同じ予算で比較した結果、基盤の言語モデルを変えた比較、すべての試行に対する成功率を示していません。報告した速度の改善だけから、人手がどれだけ減ったかは判断できません。
  evidence: |-
    [一次資料：原論文 §4.2〜5.4・表1〜4](https://arxiv.org/pdf/2609.17391v1)を基に、著者らが比べた数値を整理します。

    | 著者らが測った対象 | 改良前との比較 | 比較した条件 |
    | --- | --- | --- |
    | 順位付けモデル2 | 処理件数2.00倍、応答時間は元の1/1.98 | 表1のモデル配信。全モデルの平均ではない |
    | 候補検索モデル | 処理件数1.10倍、応答時間は元の1/1.67 | 表1の別モデル。次行の入力変換だけの値とは別 |
    | 入力変換 | 最大30倍速くなった | TritonサーバーからPython側に入力を渡すための変換 |
    | attentionの計算 | 996.5 μsから279.8 μsへ短縮。約3.56倍の速度 | FP16、AOTInductorとの比較、RTX PRO 6000 Blackwell、1要求あたり2,000候補 |
    | 特徴量を作るサービスの一単位 | 1秒あたり940件、約1,200件、約1,500件と順に増えた | 14 vCPUとPythonの12プロセス。同じ応答時間の条件で変更を順に追加 |

    Cythonで書き換えた関数は、単体で最大350倍速くなりました。特徴量を作るサービスの一単位で処理できる件数は約1.6倍のため、両者を同じ倍率として扱えません。表3の値は前の変更を残したまま次の変更を加えた結果です。それぞれを独立した改善として足せません。

    表4のModel Bでは、選ばれた設定のp99が271 msと書かれています。p99は99%の要求がその時間までに終わる値です。表にある目標は250 msなので、目標内の候補を採用するとした本文の説明と一致しません。記載の誤りなのか、測定条件の違いなのかは原論文では分かりません。選ばれた設定がすべて目標を満たしたとは言えません。
  executable_understanding: |-
    `uv run papers/flashvector-unity-serving-stack-agent/run.py` を実行すると、コードは5つの架空の変更案を判定します。出力が合うか、数字がすべて有限か、応答時間が上限内か、配信全体の処理件数が落ちないか、局所と全体の両方で改善幅が測定の揺れを超えたかを順に確かめます。途中で不合格になれば、以降の判定へ進まない仕組みです。実際に要求を流したり、言語モデルで変更案を作ったりする教材ではありません。

    <figure class="teaching" data-b21><h3>変更案を選ぶと、採否の理由が分かる</h3><label>架空の変更案 <select><option value="0">一部だけ2倍速い</option><option value="1">応答時間が上限を超える</option><option value="2">全体で3%改善</option><option value="3">出力が変わる</option><option value="4">すべての条件を満たす</option></select></label><script type="application/json" data-frames>["<div class=\"b21-frontier\"><div>一部の処理の速度（元を1とする） <strong>2<\/strong><\/div><div>全体の処理件数（元を1とする） <strong>0.98<\/strong><\/div><div>p99 <strong>220 ms<\/strong> / 目標は250 ms<\/div><div>出力一致：はい<br><strong>全体の処理件数が落ちたため不採用<\/strong><\/div><\/div>","<div class=\"b21-frontier\"><div>一部の処理の速度（元を1とする） <strong>1.3<\/strong><\/div><div>全体の処理件数（元を1とする） <strong>1.2<\/strong><\/div><div>p99 <strong>270 ms<\/strong> / 目標は250 ms<\/div><div>出力一致：はい<br><strong>p99が目標を超えたため不採用<\/strong><\/div><\/div>","<div class=\"b21-frontier\"><div>一部の処理の速度（元を1とする） <strong>1.1<\/strong><\/div><div>全体の処理件数（元を1とする） <strong>1.03<\/strong><\/div><div>p99 <strong>230 ms<\/strong> / 目標は250 ms<\/div><div>出力一致：はい<br><strong>改善が測定の揺れの範囲内なので再測定<\/strong><\/div><\/div>","<div class=\"b21-frontier\"><div>一部の処理の速度（元を1とする） <strong>1.4<\/strong><\/div><div>全体の処理件数（元を1とする） <strong>1.3<\/strong><\/div><div>p99 <strong>200 ms<\/strong> / 目標は250 ms<\/div><div>出力一致：いいえ<br><strong>出力が合わないため不採用<\/strong><\/div><\/div>","<div class=\"b21-frontier\"><div>一部の処理の速度（元を1とする） <strong>1.3<\/strong><\/div><div>全体の処理件数（元を1とする） <strong>1.2<\/strong><\/div><div>p99 <strong>230 ms<\/strong> / 目標は250 ms<\/div><div>出力一致：はい<br><strong>すべての条件を満たしたため採用<\/strong><\/div><\/div>"]</script><div data-output><div class="b21-frontier"><div>一部の処理の速度（元を1とする） <strong>2</strong></div><div>全体の処理件数（元を1とする） <strong>0.98</strong></div><div>p99 <strong>220 ms</strong> / 目標は250 ms</div><div>出力一致：はい<br><strong>全体の処理件数が落ちたため不採用</strong></div></div></div><figcaption>Labが用意した測定値で判定します。Unityが実際に見送った変更案ではありません。</figcaption></figure>
  results: 5案のうち、すべての条件を満たしたのは1案です。一部が2倍速くなっても全体の処理件数が0.98倍の案、処理件数が1.2倍でもp99が270 msで上限を超えた案、出力が変わった案は不採用です。処理件数の改善が3%の案は、揺れの目安6%を超えないため、再測定が必要と判定しました。Labは2〜6%の改善を実際に再測定してはいません。
  what_we_verified: '**仕組み：一部確認（PARTIAL）。** Labは、出力が合わない、応答時間が上限を超える、全体が遅くなる、改善が測定の揺れを超えない場合に採用しない規則を、架空の数字で確認しました。一部の処理が速くなっても、配信全体が速くなるとは限らないことを例で示します。'
  what_we_did_not_verify: Labでは、Unityの実際の配信要求、NsightやeBPFの計測、GPUの実行、配信先に結果を返さないシャドー試験、言語モデルによるコードの変更を試していません。配信性能、規模を広げたときの動作、本番で使えるかも未検証です。著者らは基盤の言語モデル名と版、全試行の内訳を公表していません。人手でレビューする負担、運用費、再学習後にも改善が続く割合は確認できません。
  implementation: '`decide()` は、論文のAlgorithm 1で分けている局所の確認と配信全体の負荷試験を、教材の一つの判定にまとめています。コードは実際の要求を送らず、あらかじめ用意した測定値で出力の一致、応答時間、処理件数を比べて採否を返します。'
  method: method.md
  mapping: mapping.md
