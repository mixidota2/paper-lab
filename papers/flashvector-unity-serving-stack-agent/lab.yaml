question: 一部を速くした変更でも、配信全体が速くならなければ見送れるか
summary: Wuらは、広告のモデル配信で時間がかかる処理を見つけ、変更後の出力と配信全体の性能を確かめる仕組みを作りました。順位付けモデルの一例では処理件数が2.00倍になりました。別の検索モデルでは入力変換が最大30倍速くなりましたが、配信全体の処理件数は1.10倍でした。順位付けモデルの応答時間は元の1/1.98、特徴量を作るサービスで処理できる件数は約1.6倍でした。
