verdict: Worth Reading
status: draft
question: 商品ごとに予測手法を選ぶと、全商品で同じ手法を使うより在庫費用は下がるか
summary: >
  Walmartの公開売上データを使った在庫シミュレーションでは、商品ごとに予測手法を選ぶ方法と、全商品に単純指数平滑法を使う方法の総費用に、統計的にはっきりした差はありませんでした。
  欠品費用を変えた4条件でも、この2つの手法の費用差はどの条件でも2%未満でした。
verification:
  mechanism: PARTIAL
  performance: NOT TESTED
  scaling: NOT TESTED
  production_applicability: NOT TESTED
source_review:
  checked: '2026-11-24'
  url: https://www.tandfonline.com/doi/pdf/10.1080/21681015.2026.2750831
  scope: 出版社が公開した論文の手法と表2・4・5・7。著者コードとPDF原本のハッシュは未確認。
core_idea:
  author_claim: 著者は、商品と州の組み合わせごとに、在庫費用を抑えられそうな予測手法を選ぶ方法（CFMS）を提案しました。費用と、発注サイクルのうち一度も欠品しなかった割合の両方で、単純指数平滑法（SES）など成績のよい方法と統計的にはっきりした差はありませんでした。
  research_bot_interpretation: 手法の切り替えを検討するなら、まずSESなど成績のよかった単純な方法を基準にします。補充ルールをそろえ、予測手法を替えたときの費用と欠品を両方比べます。この研究だけでは、複雑な手法に替えると費用が下がるとは言えません。
sections:
  overview: |-
    Onoらは、予測誤差ではなく、予測を使って発注したあとの費用を基準に予測手法を選ぶ方法を提案しました。著者らは、商品と州の組み合わせごとに、売れ方や補充条件から各候補の在庫費用の相対成績をLightGBMで見積もり、予測手法を選びました。WalmartのM5公開売上データを使い、仮想の倉庫で発注・保管・欠品の費用を比べました。

    主な比較の総費用は、提案手法が85,056、すべての系列に単純指数平滑法を使った場合が85,093で、差は約0.04%でした。提案手法は発注と保管の費用を抑えた一方、欠品費用は増えました。著者らが総費用で各手法の順位を比べると、両手法に統計的にはっきりした差はありませんでした。実店舗の発注を変えて測った結果ではありません。
  problem: '同じ補充ルールでも、予測が変われば発注する量や欠品する数量も変わります。著者は、全商品を一つの方法で予測する場合に比べ、商品の売れ方に合わせて手法を選ぶと補充費用が下がるかを調べました。'
  method: method.md
  why_it_might_work: '毎日売れる商品と、たまにまとまって売れる商品では、費用を抑えやすい予測手法が異なることがあります。候補を替えるたびに補充後の費用を計算して、その差を学習すれば、商品の売れ方を手がかりに手法を選べる可能性があります。'
  evidence: |
    ### 主な比較の費用内訳

    著者のシミュレーションでは、CFMSの総費用は85,056、SESは85,093でした。総費用欄では、CFMSが37少なく、SESを基準に約0.04%の差でした。内訳では、CFMSは発注費用が424、保管費用が13少ない一方で、欠品費用は401多くかかりました（§5.1・表2）。Labは総費用の差を、表示された内訳からではなく報告された総費用欄から計算しています。いずれの値も、実店舗が支払った金額ではありません。

    ### 欠品費用を変えた比較

    一次資料の表7では、著者は一度も欠品しない発注サイクルの割合の目標を95%、保管費用の率を商品価格の年1%に固定しました。120系列それぞれに、納品までの日数2通りと発注量を見直す間隔3通りを組み合わせ、720ケースを比べました。
    欠品費用の率が1%のとき、CFMSの費用はSESより1.74%低くなりました。欠品費用の率が25%のときは0.54%低くなりました。
  executable_understanding: '画面で欠品費用の率を選ぶと、論文の報告値と、SESを基準にした費用差が表示されます。次の架空の例では、欠品が何サイクルで起きたかと、合計で何個欠品したかを分けて数えます。'
  results: '表4では、CFMSが目標を下回ったケースは、目標が90%なら50.3%、95%なら56.0%でした。いずれも全評価ケースに占める割合で、欠品した発注サイクルの割合ではありません。表5では別の指標として、その場で在庫から満たせた需要数量の割合を報告しています。CFMSでは平均96.0%でした。'
  what_we_verified: 'Labは論文の報告値から、SESを基準にした費用差を計算しました。架空の例では、欠品する合計数量を同じにして、欠品が何サイクルで起きるかを変えました。欠品がなかったサイクルの割合だけが変わることを確認しました。'
  what_we_did_not_verify: 'Labは著者のモデルを学習せず、在庫シミュレーションや統計検定も再実行していません。対象商品を増やした場合の処理時間や、実店舗で発注方法を替えたときの効果も確かめていません。'
  implementation: 'run.pyはPythonの標準ライブラリだけを使います。論文の報告値から費用差を求め、架空の例から2種類のサービス指標を計算します。画面を操作してもモデルは学習し直さず、論文にない条件の費用も計算しません。'
  mapping: mapping.md
teaching_figures:
- id: selector-and-inventory-policy
  kind: logic
  title: 補充をシミュレーションして予測手法を選ぶ
  after: method
  source: https://www.tandfonline.com/doi/pdf/10.1080/21681015.2026.2750831
  locator: §3–4をもとに整理
  rationale: 著者は予測手法を選ぶ処理と、予測を使って発注する処理を分けた。
  caption: 著者は商品と州の組み合わせを仮想倉庫の需要として扱った。実店舗への導入ではない。
  rows:
  - label: 著者の比較
    nodes:
    - title: 予測して発注する
      text: 著者は候補の手法で売上を予測し、同じ補充ルールで在庫を動かした。
    - title: 費用を比べる
      text: 著者は候補ごとに、発注・保管・欠品の費用を集計した。
    - title: 未学習の商品で試す
      text: 著者は系列の特徴から費用を抑えられそうな手法を選び、学習に使わなかった商品で比べた。
- id: two-service-metrics
  kind: equations
  title: 欠品の回数と数量
  after: evidence
  source: https://www.tandfonline.com/doi/pdf/10.1080/21681015.2026.2750831
  locator: §4.5の指標、表4・5の結果、Labの架空の例
  rationale: 欠品がなかったサイクルの割合と、在庫で満たせた需要数量の割合は別の指標だ。
  caption: 架空の例では合計の需要と欠品の数量をそろえ、欠品が起きるサイクルの数だけを変えた。
  steps:
  - name: サイクルサービス水準
    formula: 欠品しなかった周期数 ÷ 全周期数
    explanation: 各発注サイクルで一度でも欠品したかを確認し、欠品しなかったサイクルを数える。
  - name: 数量充足率
    formula: 満たした数量の合計 ÷ 需要数量の合計
    explanation: 需要と欠品の合計数量が同じなら、欠品が起きたサイクルの数が違っても、この割合は変わらない。
