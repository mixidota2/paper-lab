- kind: equations
  id: trajectory-accounting
  title: 削る量と、作業全体で減る量は別
  after: method
  steps:
  - name: 削った履歴で次の行動を選ぶ
    formula: H̃ₖ → Aₖ → Oₖ₊₁ → H̃ₖ₊₁
    explanation: 図 2。次のツール呼び出しが変わると、返る情報も変わる。
  - name: 全呼び出しの入出力を足す
    formula: T = Σₖ₌₁ᴷ (Iₖ + Oₖ)
    explanation: 式 B.13。I は入力、O は出力。キャッシュ読み出しは入力に再加算しない。
  - name: 呼び出し回数の差も含める
    formula: ΔT = Σₖ≤K* (ΔIₖ + ΔOₖ) + unmatched suffix
    explanation: 式 B.14。両方にある呼び出しの差を足し、片方にしかない後続の呼び出しは別に加減する。
  locator: Fig. 2 / Eq. B.13–14
  caption: 前の推論を消すと、残りの入力だけでなく、その先の判断と呼び出し回数も変わりうる。
  source: https://arxiv.org/pdf/2609.29875v1
  rationale: 直接減った文章と、その先のやり取りで増減したトークンを分けて数える。
