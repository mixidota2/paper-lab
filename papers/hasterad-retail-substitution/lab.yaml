status: draft
question: |-
  棚から商品を一つ外すと、顧客は同じブランドの商品へ移るか
summary: |-
  Flickerらは実店舗の週次販売記録から、どの商品が互いの代わりになるかを推定しました。Labでは、全商品が買える間は同じ確率を出す二つのモデルで、一部を外したときに買い替え先の予測と期待粗利がどう変わるかを確かめます。
verification:
  mechanism: PARTIAL
  performance: NOT TESTED
  scaling: NOT TESTED
  production_applicability: NOT TESTED
source_review:
  checked: '2026-11-23'
  url: https://onlinelibrary.wiley.com/doi/full/10.1002/joom.70058
  scope: Labは公開本文の§3で式(1)と式(2)、§4で図2aを確認しました。評価は§5.1.4、§5.3の表4、§7を確認しました。補足資料、原本のハッシュ、著者のコードは確認していません。
core_idea:
  author_claim: |-
    著者は、週次の販売、価格、販促の記録を使い、どの属性で商品を分けると販売数量を説明しやすいかを調べました。選んだ属性で商品を順に分け、得られた階層に沿って需要を推定します。人工データでは、その需要推定を使って品ぞろえを決め、期待利益を比べました。
  research_bot_interpretation: |-
    いま売場にある商品で売上予測が当たっていても、商品を外した場合の買い替え先まで当たるとは限りません。品ぞろえを変える判断では、販売数量への適合度と、需要を移す先の予測を分けて確かめます。
sections:
  overview: |-
    著者は、ある商品を棚から外したとき、顧客がどの商品へ移りやすいかを販売データから調べました。商品同士の代わりやすさを表すために、商品をブランドなどの属性で順に分ける方法を提案しました。米国54店舗のビール195商品の週次データでは、最初の分け方にブランドを選びました。別の人工実験では、棚の費用が高く人気商品ほど粗利が低い条件で、商品の代わりやすさを週次データから、需要を欠品が分かる日次データから推定しました。期待利益は最適案を平均10.9%下回りました。この差は人工データでの比較で、実店舗で測った値ではありません。
  problem: |-
    全商品が買える売場の販売記録だけでは、商品を一つ外したあとに顧客が何を選ぶかまでは分かりません。例えば同じブランドの別商品を買う人が多いのか、別のブランドを買うのか、何も買わずに売場を離れるのかで、どの商品を残すべきかは変わります。
  method: method.md
  why_it_might_work: |-
    価格や販促が変わったとき、どの商品で販売数量が動いたかを見ると、どの商品が代わりになりやすいかを推定する手がかりになります。ただし店が需要に合わせて価格、販促、品ぞろえを変えることもあるので、この関係だけから、どの施策が売上をどれだけ動かしたかは判断できません。
  evidence: evidence.md
  executable_understanding: |-
    まず例1で、全4商品と「なし」がいずれも20%になることを確かめます。例2でA1を外し、A2と「なし」の確率を二つのモデルで比べます。例3ではブランドAをすべて外します。例4と例5では、同じブランドから2品を残す場合と、別々のブランドから1品ずつ残す場合の、来店1回当たりに見込む粗利を比べます。
  results: |-
    A1を外したとき、残ったA2を選ぶ確率は、階層なしで25.0%、ブランド別で約32.0%です。逆に、何も買わない確率は階層なしで25.0%、ブランド別で約22.7%になります。

    4品から2品を残す全6案では、階層なしのモデルでA1とA2、ブランド別のモデルでA1とB1の期待粗利が最も高くなりました。どちらも架空の商品と粗利を使った結果です。論文の期待利益や、実店舗で測った粗利ではありません。
  what_we_verified: |-
    架空の商品で計算し、すべての選択確率を足すと1になることを確認しました。全商品があるときは予測が同じですが、A1を外すとA2と非購入の予測が分かれ、2品を残す全6案の首位も変わりました（CONFIRMED）。論文と対応するのは、代替先の予測次第で品ぞろえの判断が変わるという考え方の一部です（PARTIAL）。
  what_we_did_not_verify: |-
    Labは実データから階層を作ったり、著者の需要モデルを学習し直したりしていません。論文の人工実験での利益評価も再現していません。規模を大きくしたときの性能や、実店舗で粗利や欠品がどう変わるかは未検証です（NOT TESTED）。
  implementation: |-
    `run.py` は追加ライブラリや乱数を使わず、各条件を計算して `results.json` に保存します。画面で例を選ぶと、保存された確率と粗利を表示します。
  mapping: mapping.md
interactives:
- kind: explorer
  title: 棚から商品を外すと、顧客はどの商品を選ぶか
  caption: 例1には全4商品があります。例2でA1だけを外し、例3ではブランドAをすべて外します。例4はA1とA2、例5はA1とB1だけを残す案です。「なし」は、顧客が何も買わない選択です。
teaching_figures:
- id: recover-then-choose
  kind: timeline
  title: 代替の階層を調べてから、需要を推定し、品ぞろえを決める
  after: method
  source: https://onlinelibrary.wiley.com/doi/full/10.1002/joom.70058
  locator: §3、§5.1
  rationale: 最初のモデルは、商品を何で分けるかを選ぶために使います。選んだ階層で需要を推定するのは次の段階です。
  caption: 著者は階層の推定、需要の推定、品ぞろえ選びを順に行います。Labはこの一連の手順を再現せず、ブランド別の階層をあらかじめ固定します。
  rows:
  - label: 著者の方法
    nodes:
    - title: どの属性で商品を分けるかを決める
      text: 著者は属性ごとにモデルを当てはめ、記録された販売数量に対する対数尤度を比べます。その値が最大になる属性で分け、分けた先では使っていない属性を比べます。
    - title: 決めた階層に沿って需要を推定する
      text: 著者は、商品を分けて得た階層に沿う選択モデルで、どの商品を売場に置くとどれだけ売れるかを推定します。
    - title: 売場にどの商品を置くかを決める
      text: 著者は売れる数量から粗利を見積もり、商品を1品扱うごとの費用を引いて、期待利益が高い品ぞろえを選びます。
- id: retained-a2-probability
  kind: equations
  title: A1を外すと、なぜA2が選ばれる確率は変わるのか
  after: evidence
  source: https://onlinelibrary.wiley.com/doi/full/10.1002/joom.70058
  locator: §5.1.4の品ぞろえ評価を手がかりに、Labが計算例を作成
  rationale: A1を外すと、A2がどれくらい選ばれるかを二つの式で比べます。
  caption: Labは全4商品が買えるとき、各商品と非購入の確率がそれぞれ20%になるように重みを設定しました。ビールの実店舗データから求めた値ではありません。
  steps:
  - name: 階層なし
    formula: P(A2) = 0.2 / (0.2 + 0.4 + 0.2) = 25%
    explanation: 分母はA2、ブランドBの2品、非購入の重みの合計です。A2、B1、B2、非購入は同じ重みなので、いずれも確率は25%です。
  - name: ブランド別
    formula: P(A2) = (0.4 × √0.5) / (0.4 × √0.5 + 0.4 + 0.2) ≈ 32.0%
    explanation: ブランドAは1品だけになりますが、選ばれやすさの重みは半分まで下がりません。ブランドAを選んだ場合、その中で買えるのはA2だけです。
