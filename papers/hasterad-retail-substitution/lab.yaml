core_idea:
  author_claim: 著者は、週次の販売データから、商品をどの属性で分けると代替関係を説明しやすいかを調べ、その分け方を木で表しました。次に人工データを使って、その木に基づく品ぞろえの期待利益を評価しました。
  research_bot_interpretation: 観測した売上によく合うモデルでも、まだ試していない品ぞろえについて、利益が最も高い組み合わせを選べるとは限りません。
sections:
  overview: |-
    著者は、ある商品を棚から外したとき、顧客がどの商品へ移りやすいかを販売データから調べました。商品同士の代わりやすさを表すために、商品をブランドなどの属性で順に分ける方法を提案しました。米国54店舗のビール195商品の週次データでは、最初の分け方にブランドを選びました。別の人工実験では、棚の費用が高く人気商品ほど粗利が低い条件で、商品の代わりやすさを週次データから、需要を欠品が分かる日次データから推定しました。期待利益は最適案を平均10.9%下回りました。この差は人工データでの比較で、実店舗で測った値ではありません。
  problem: 店が商品を一つ外すと、顧客は同じブランドの商品に移るでしょうか。別のブランドを買う人や、何も買わない人はどのくらいいるでしょうか。各商品がそろった状態の売上だけでは、外した後の選択を見分けられません。
  method: method.md
  why_it_might_work: 同じ特徴を持つ商品で価格や販促が変わったときに、どの商品で販売数量が動いたかを見ると、代替関係を推定する手がかりになります。店舗が需要に合わせて価格、販促、売場の構成を決めている場合は、その関係を施策の因果効果としては扱えません。
  evidence: evidence.md
  executable_understanding: 例1と例2を切り替えると、A1を外した後に、同じブランドのA2を買う確率と、何も買わない確率をモデル別に比べられます。例4と例5では、2品だけを残す条件で、同じブランドから2品を残す案と別々のブランドから1品ずつ残す案を比べられます。
  results: >-
    A1を外したとき、顧客がA2を選ぶ確率は、階層なしのモデルで25.0%、ブランド別のモデルで約32.0%です。
    Labは4品から2品を残す全6案を比べました。階層なしのモデルではA1とA2、ブランド別のモデルではA1とB1の期待粗利が最も高くなりました。いずれも架空の商品の計算結果です。
  what_we_verified: Labは架空の商品の計算で、選択確率の合計が1になること、全商品があると両モデルの予測が一致すること、1品を外すと予測が分かれること、4品から2品を残す全6案を比べると期待粗利が最も高い組み合わせが異なることを確認しました（CONFIRMED）。論文と対応するのは考え方の一部です（PARTIAL）。
  what_we_did_not_verify: Labは、データから代替関係の木を推定する処理、著者のモデルの再学習、論文の利益評価の再現を検証していません。規模を大きくしたときの動作や、実店舗の粗利・欠品への効果も調べていません（NOT TESTED）。
  implementation: run.pyは追加ライブラリや乱数を使わず、各条件を計算してresults.jsonに書き出します。Web画面は、選んだ条件に対応する保存済みの値を表示します。
  mapping: mapping.md
interactives:
- kind: explorer
  title: 棚から商品を外すと、顧客はどの商品を選ぶか
  caption: 例1では全4品を並べます。例2ではA1を、例3ではブランドAの全品を外します。例4ではA1とA2、例5ではA1とB1だけを残します。グラフの「なし」は、顧客が何も買わない場合です。
teaching_figures:
- id: recover-then-choose
  kind: timeline
  title: 商品をどう分けるかを調べ、その結果から品ぞろえを選ぶ
  after: method
  source: https://onlinelibrary.wiley.com/doi/full/10.1002/joom.70058
  locator: §3、§5.1
  rationale: 著者が商品を分ける属性を探す工程と、需要を推定して品ぞろえを選ぶ工程を区別します。
  caption: 論文の手順は3段階です。Labの小実験ではこの全工程を実行せず、商品をブランドで分ける構造を先に与えます。
  rows:
  - label: 著者の方法
    nodes:
    - title: どの属性で商品を分けるかを決める
      text: 著者はブランドや容量などを一つずつ試し、販売数量を最もよく説明する属性で商品を分けます。分けた先の各グループで、残った属性を再び比べます。
    - title: 各商品が選ばれる確率を求める
      text: 著者は、決まった分け方に沿って、顧客が各商品を選ぶ確率を推定します。
    - title: 売場にどの商品を置くかを決める
      text: 著者は、商品を棚に置く費用と、商品が売れる確率に応じた利益を比べて品ぞろえを選びます。
- id: retained-a2-probability
  kind: equations
  title: A1を外すと、なぜA2が選ばれる確率は変わるのか
  after: evidence
  source: https://onlinelibrary.wiley.com/doi/full/10.1002/joom.70058
  locator: §5.1.4の品ぞろえ評価を手がかりに、Labが計算例を作成
  rationale: 1品目のA1を外した後のA2の確率を、2本の式で計算します。
  caption: これは、全4品があるときは各商品と非購入の確率がそれぞれ20%になるように重みを決めた人工例です。論文が分析したビールの売上から計算した値ではありません。
  steps:
  - name: 階層なし
    formula: P(A2) = 0.2 / (0.2 + 0.4 + 0.2) = 25%
    explanation: 分母はA2、ブランドBの2品、非購入の重みの合計です。A2、B1、B2、非購入は同じ重みなので、いずれも確率は25%です。
  - name: ブランド別
    formula: P(A2) = (0.4 × √0.5) / (0.4 × √0.5 + 0.4 + 0.2) ≈ 32.0%
    explanation: ブランドAは2品のうち1品を失いますが、ブランドの重みはもとの半分より大きく残ります。ブランドAを選んだ顧客は、残ったA2を選びます。
