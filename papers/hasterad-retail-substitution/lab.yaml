question: 全商品が売場にあるときの予測が同じでも、なぜ一部を外すと購入先の予測が分かれるのか
summary: >-
  Flickerらは、店舗の週次の販売数量、価格、販促記録を使い、どの商品が互いの代わりになるかを推定します。
  Labでは、全商品が売場にあるときは同じ選択確率を予測する二つのモデルを用意し、一部の商品を外すと、顧客の購入先と期待粗利が最も高い品ぞろえがどう変わるかを比べます。
verification:
  mechanism: PARTIAL
  performance: NOT TESTED
