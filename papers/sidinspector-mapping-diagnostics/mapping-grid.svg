<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 490" role="img" aria-label="同じ6商品の3通りのSID対応表"><title>SIDで商品を区別できるか、関連商品が同じ色に残るか</title><rect width="670" height="490" fill="#f8fafc"/><g font-family="sans-serif" font-size="15" fill="#17324d"><text x="24" y="30" font-size="20">SIDが重ならなくても、関連商品が別々になる例</text><text x="24" y="60">同じ6商品。関連する対は a–b、c–d、e–f</text><text x="24" y="95">完全SIDを共有 / D2=0.667, D3=1</text><rect x="24" y="107" width="92" height="65" rx="6" fill="#dbedf6" stroke="#789"/><text x="70" y="131" text-anchor="middle">a</text><text x="70" y="158" text-anchor="middle">0 : 0</text><rect x="128" y="107" width="92" height="65" rx="6" fill="#dbedf6" stroke="#789"/><text x="174" y="131" text-anchor="middle">b</text><text x="174" y="158" text-anchor="middle">0 : 0</text><rect x="232" y="107" width="92" height="65" rx="6" fill="#f8e3cb" stroke="#789"/><text x="278" y="131" text-anchor="middle">c</text><text x="278" y="158" text-anchor="middle">1 : 0</text><rect x="336" y="107" width="92" height="65" rx="6" fill="#f8e3cb" stroke="#789"/><text x="382" y="131" text-anchor="middle">d</text><text x="382" y="158" text-anchor="middle">1 : 1</text><rect x="440" y="107" width="92" height="65" rx="6" fill="#e4dff7" stroke="#789"/><text x="486" y="131" text-anchor="middle">e</text><text x="486" y="158" text-anchor="middle">2 : 0</text><rect x="544" y="107" width="92" height="65" rx="6" fill="#e4dff7" stroke="#789"/><text x="590" y="131" text-anchor="middle">f</text><text x="590" y="158" text-anchor="middle">2 : 0</text><text x="24" y="215">全商品を区別、関連する対は別の色 / D2=0, D3=0</text><rect x="24" y="227" width="92" height="65" rx="6" fill="#dbedf6" stroke="#789"/><text x="70" y="251" text-anchor="middle">a</text><text x="70" y="278" text-anchor="middle">0 : 0</text><rect x="128" y="227" width="92" height="65" rx="6" fill="#f8e3cb" stroke="#789"/><text x="174" y="251" text-anchor="middle">b</text><text x="174" y="278" text-anchor="middle">1 : 0</text><rect x="232" y="227" width="92" height="65" rx="6" fill="#e4dff7" stroke="#789"/><text x="278" y="251" text-anchor="middle">c</text><text x="278" y="278" text-anchor="middle">2 : 0</text><rect x="336" y="227" width="92" height="65" rx="6" fill="#dbedf6" stroke="#789"/><text x="382" y="251" text-anchor="middle">d</text><text x="382" y="278" text-anchor="middle">0 : 1</text><rect x="440" y="227" width="92" height="65" rx="6" fill="#f8e3cb" stroke="#789"/><text x="486" y="251" text-anchor="middle">e</text><text x="486" y="278" text-anchor="middle">1 : 1</text><rect x="544" y="227" width="92" height="65" rx="6" fill="#e4dff7" stroke="#789"/><text x="590" y="251" text-anchor="middle">f</text><text x="590" y="278" text-anchor="middle">2 : 1</text><text x="24" y="335">全商品を区別、関連する対は同じ色 / D2=0, D3=1</text><rect x="24" y="347" width="92" height="65" rx="6" fill="#dbedf6" stroke="#789"/><text x="70" y="371" text-anchor="middle">a</text><text x="70" y="398" text-anchor="middle">0 : 0</text><rect x="128" y="347" width="92" height="65" rx="6" fill="#dbedf6" stroke="#789"/><text x="174" y="371" text-anchor="middle">b</text><text x="174" y="398" text-anchor="middle">0 : 1</text><rect x="232" y="347" width="92" height="65" rx="6" fill="#f8e3cb" stroke="#789"/><text x="278" y="371" text-anchor="middle">c</text><text x="278" y="398" text-anchor="middle">1 : 0</text><rect x="336" y="347" width="92" height="65" rx="6" fill="#f8e3cb" stroke="#789"/><text x="382" y="371" text-anchor="middle">d</text><text x="382" y="398" text-anchor="middle">1 : 1</text><rect x="440" y="347" width="92" height="65" rx="6" fill="#e4dff7" stroke="#789"/><text x="486" y="371" text-anchor="middle">e</text><text x="486" y="398" text-anchor="middle">2 : 0</text><rect x="544" y="347" width="92" height="65" rx="6" fill="#e4dff7" stroke="#789"/><text x="590" y="371" text-anchor="middle">f</text><text x="590" y="398" text-anchor="middle">2 : 1</text><text x="24" y="465">色は最初の符号。数値は run.py で計算した架空の例。</text></g></svg>