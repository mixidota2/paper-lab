  - name: alias集合
    formula: 'A(c) = {i : z(i)=c}'
    explanation: 同じfull SIDを共有するitemを集める。
  - name: item単位の衝突率
    formula: D2 = |I|⁻¹ Σᵢ 1[|A(z(i))|>1]
    explanation: 3 itemが1 codeを共有すれば、3 itemすべてを数える。
  - name: weighted prefix recovery
    formula: D3ℓ = Σᵢⱼ wᵢⱼ 1[pℓ(i)=pℓ(j)] / Σᵢⱼ wᵢⱼ
    explanation: 近傍edgeとdepthを揃えて比較する。
