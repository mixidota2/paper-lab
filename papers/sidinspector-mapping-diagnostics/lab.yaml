  source: https://arxiv.org/pdf/2606.10375v1
  steps:
  - name: 完全SIDを共有する商品の集合
    formula: 'A(c) = {i : z(i)=c}'
    explanation: 符号列全体が同じ商品を、符号列ごとにまとめる。
  - name: 完全SIDを共有する商品の割合
    formula: D2 = |I|⁻¹ Σᵢ 1[|A(z(i))|>1]
    explanation: 3商品が同じ完全SIDを共有していれば、3商品すべてを数える。
  - name: 先頭が一致する商品対の重み付き割合
    formula: D3ℓ = Σᵢⱼ wᵢⱼ 1[pℓ(i)=pℓ(j)] / Σᵢⱼ wᵢⱼ
    explanation: 先頭の符号が一致した商品対の重みを足す。それを、全近傍edgeの重み合計で割る。ここでのedgeは商品対。同じ商品対を使い、先頭から何段見るかもそろえる。
