core_idea:
  author_claim: |-
    著者らは、商品とSIDの対応表を、同じ商品IDで結び付く利用履歴や商品情報とともに検証し、推薦モデルの学習とは別にD1〜D5を計算する。更新前後の対応表があればD6を計算できる。D7には生成モデルの出力や探索ログが必要で、論文の主な比較には含まれない。
  research_bot_interpretation: |-
    [SIDScope](sidscope-diagnostics.html)とは、SIDの重複や先頭の符号のまとまりを調べる点が共通する。この論文は新しい符号化方式を提案していない。Labでは、各商品を完全なSIDで区別できるかと、一緒に選ばれやすい商品が先頭の符号を共有するかを、同じ商品集合で別々に調べる。
sections:
  overview: |-
    商品ごとに符号列（Semantic ID）を割り当てると、異なる商品が完全に同じ符号を持つことがあります。SIDInspectorは推薦モデルを学習させる前に、その割り当てを調べる道具です。符号を共有する商品の割合と、履歴でよく一緒に現れる商品どうしが符号の先頭が一致するかを別々に測ります。

    著者が同じ23,742商品を使って比べると、GRIDを模した出力では97.7%の商品が別の商品と同じ符号を共有しました。ReSID/GAOQの出力では共有がありませんでした。これは書き出した符号の比較です。推薦したときの順位や、本番での利用者の反応を比べた結果ではありません。
  problem: |-
    推薦モデルは、商品を直接選ぶ代わりに、いくつかの符号を並べたSemantic ID（SID）を生成できる。SIDと商品を対応させる表に登録漏れや重複があると、学習後のRecallだけを見ても、問題が対応表にあるかは分からない。

    先に、全商品を同じ商品IDで突き合わせ、どの商品にも離散的な符号が割り当てられているかを確認する。商品によって符号列の長さが違う場合は、表の列をそろえるために補った位置と実際の長さを記録する。この表で索引の構造は調べられるが、生成モデルが本番でどう探索するかを知るには、実際の探索ログが要る。
  why_it_might_work: |-
    SIDの完全な符号列を共有する商品が多い場合と、一緒に選ばれやすい商品が符号列の先頭を共有しない場合では、直す箇所が違う。前者はD2、後者はD3で見分けられる。商品を区別するために末尾の符号を増やしても、先頭のまとまりが良くなるとは限らない。モデルの学習前に確かめれば、対応表の不備による手戻りを減らせる。

    一緒に現れた回数は、過去に何が表示されたかにも影響される。商品分類と一致しているだけでも、D3が高くなる場合がある。D3の差だけで、推薦の改善を引き起こしたとは言えない。
  evidence: |-
    [論文初版の§4・表2](https://arxiv.org/pdf/2606.10375v1)では、同じMusicalの23,742商品に対し、書き出した対応表を比べた。D2は完全なSIDをほかの商品と共有する商品の割合、D3は一緒に現れた商品対の重みのうち、最初の符号が一致する対の重みの割合だ。

    | Musicalの対応表 | 異なる完全SIDの数 | D2 | D3（第1段） |
    | --- | ---: | ---: | ---: |
    | GRID型の処理で商品説明を符号化 | 3,749 | 0.977 | 0.055 |
    | GRID型で使える符号を増やした場合 | 9,874 | 0.779 | 0.080 |
    | ReSID/GAOQ | 23,742 | 0 | 0.154 |
    | 商品分類を先頭の符号に使う対照 | 23,742 | 0 | 0.447 |

    GRID型の例では、使える符号を増やすと共有する商品は減ったが、D3は0.055から0.080になった。ReSID/GAOQと商品分類を使う対照は、どちらも商品を完全なSIDで区別できたが、D3は異なった。商品分類を使う対照は学習した符号化器ではない。この結果は、対照が推薦モデルとして優れていたという意味ではない。GRID型も、商品説明の表現を残差k-meansに渡した条件付きの比較であり、公式の学習手順全体を再現したものではない。

    LETTERとLC-Recは、別のInstrumentsの9,922商品で配布済みの索引を読み込んだ例だ。異なる完全SIDはどちらも9,897、D3は順に0.109と0.052だった。Musicalとは商品集合が違うため、上の表には入れない。

    並べ替えの条件を固定した補助実験では、D3と正解商品が候補に入る度合いに関連があった。ただし、候補に入ることと上位に並ぶことは別である。生成モデルの学習結果や、利用者を対象にしたA/Bテストの結果ではない。

    論文初版の§5は公開版を `sidinspector-cikm2026-resource-v0.6` と記している。以前確認した公式リポジトリのREADMEにはv1.0とあった。上の報告値は論文初版のもので、v1.0で計算し直してはいない。
  executable_understanding: |-
    `uv run papers/sidinspector-mapping-diagnostics/run.py` を実行すると、同じ6商品と同じ商品対を使った3通りの対応表を比べられる。完全なSIDを共有する表と、各商品が異なるSIDを持つ表を用意する。一意の2表では、一緒に現れる商品対を先頭の符号でまとめた場合と、別々に分けた場合を比べる。

    診断を始める前に、登録漏れ、商品IDの重複、符号列の長さの不一致を検出し、不備があれば入力を拒否する。通過した表からD1〜D5を計算する。
  results: |-
    架空の6商品では、完全なSIDを共有する商品の割合（D2）が2/3だった表に対し、一意の2表はいずれも0だった。ただし、商品対が異なる先頭の符号に分かれた表のD3は0、全対を同じ先頭の符号にまとめた表は1だった。完全なSIDで商品を区別できることと、一緒に現れる商品対が同じグループに残ることは別である。
  what_we_verified: |-
    Labの人工例で、商品IDや符号列の長さが条件に合わない入力を拒否できることを確かめた。完全なSIDを共有する商品の割合、同じ先頭の符号に残った商品対の重みの割合、不人気側の商品数に対する、異なる完全SIDの数の割合、先頭から各段までの符号列の数と分岐数も確認した。局所計算は確認済み（CONFIRMED）。論文の仕組み全体は一部のみ確認した（PARTIAL）。
  what_we_did_not_verify: |-
    公式パッケージの検証項目をすべて回してはいない。GRID、ReSID、LETTER、LC-Recの対応表を再出力したり、利用履歴から商品対を選び直したりもしていない。生成モデルのRecallやNDCG、応答時間、本番のA/Bテストも測っていない。性能、規模を広げた場合の動作、本番での有用性は未検証（NOT TESTED）。D2だけでは、重複によってどれだけ推薦が悪化するかは分からない。
  implementation: |-
    `validate()` は入力条件の一部を検査し、`probe()` は人工の対応表からD1〜D5を計算する。D1では使われた符号を数えるが、使える符号の総数を設定していないので利用率には換算しない。D5の分岐数も応答時間に換算しない。D3は固定した商品対を重み付きで合計した値で、商品ごとに求めた割合の平均とは異なる。
  method: method.md
  mapping: mapping.md
