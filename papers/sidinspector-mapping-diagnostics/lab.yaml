question: 推薦モデルを学習させる前に、商品と識別子の対応表から何が分かるか
summary: SIDInspectorは推薦モデルの学習前に、商品に割り当てた符号を調べます。符号が重複していないか、利用履歴で一緒に現れる商品が同じグループに入るかを別々に測ります。符号の使われ方や、人気別の割り当て、索引の枝分かれも確認できます。
