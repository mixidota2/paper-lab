sections:
  overview: |
    **EXAMPLE / 架空。** このページは標準ラボの全セクションを示し、ジェネレータと
    テンプレートを確認するためのものです。ここにある内容は実世界についての主張では
    ありません。

    本物の概要なら、このラボから人間が短時間で得られる「信頼できる理解」が何かを、
    数段落で述べます。
  problem: |
    **EXAMPLE / 架空。** 架空の問題設定は次のとおりです。セッションランカーはしばしば
    長期嗜好と一時的意図をひとつのユーザーベクトルに混ぜてしまい、単純な近接減衰で
    十分かどうかが不明です。

    本物の「問題設定」では、論文が変えようとしている意思決定、自明なベースラインの
    失敗モード、仮説を切り分ける証拠は何かを — 宣伝抜きで — 書きます。
  core_idea:
    author_claim: |
      **架空の著者主張（論文は存在しない）:** 履歴に対する学習済みアテンション混合を、
      セッションイベント上の固定の加法的指数減衰に置き換えても、次アイテム順位付けは
      保たれ、サービングコストは下がる。
    research_bot_interpretation: |
      **私たちの解釈（著者のものではない）:** もしこれが実在なら、興味深い点は減衰式
      そのものではなく、1パラメータの減衰が短期意図の十分統計量になり得るかどうか、です。
      このラボではそれを**検証していません**。このページの左右分割がフォーマットです。
      左に著者の主張、右に私たちの読み。
  why_it_might_work: |
    **推論（その旨を明示）。** 一時的意図がセッションに対して短く、長期嗜好がゆっくり
    更新されるユーザータワーで既に捉えられているなら、近接カーネルが*効く可能性*は
    あります。これは推測であり、根拠でも著者の引用でもありません。

    本物のラボなら、反証を試みるメカニズムの物語を書き、推論であることを明示します。
  evidence: |
    **EXAMPLE / 架空。**（存在しない）著者は通常、オフライン表と任意のオンライン切片を
    指すでしょう。ここには根拠はありません。`results.json` は結果レンダラが描画できる
    よう、漫画的な指標を入れてあります。
  executable_understanding: |
    **EXAMPLE / 架空。** 実行可能な理解とは、*メカニズム*が見える小さな実験です。特徴を
    固定し、履歴混合だけを加法的減衰に差し替え、物語が誤っていれば実際に動く指標を見ます。

    この例は `baseline.py` / `proposed.py` / `run.py` を同梱しません。科学的実行を
    捏造しないためです。
  what_we_verified: |
    **何もありません。** 検証の4観点はすべて `NOT TESTED`（未検証）です。

    本物のラボなら、小さな実験が実際に何を確立したかを平易に書きます（例:「この合成構成では、
    提案項を外すと意図した差分が潰れる」）。
  what_we_did_not_verify: |
    **本物の論文で重要になることすべて**、例えば:

    - 加法的減衰が実セッションでアテンションと一致するか
    - オフライン ↔ オンラインの対応
    - 本番 QPS でのレイテンシ
    - コールドスタート、人気バイアス、フィードバックループ

    スケーリングと本番適用性は意図的に `NOT TESTED`（未検証）です。
