  results: 合成疎報酬群で全advantageがゼロになる割合はK=0で84.2%、K=2/4で0%。positive SIDのlogit勾配合計の平均は0.053388→0.390471→0.437070だった。これは初期勾配の計算であり、収束や多様性改善は測っていない。商品展開の例ではtarget=23がbeam=3/4で残り、beam=6でtop-20から落ちる。
  what_we_verified: クラスタからの商品展開、後段の件数制限による非単調なtarget保持、同報酬群のadvantage消失、expert注入時の報酬差と一歩の勾配を確認した。群分割では上限100群のため、5,001商品なら最大51商品が残る境界も確認する。
  what_we_did_not_verify: カテゴリ表現学習、EMA codebook、Qwen2.5-0.5BのSFT、複数stepのEG-GRPO、GRPO
    collapseの実際の発生、CTR/CVR/GMV、40msのservingは未再現。ログのselection bias、商品展開の重複帰属、オンラインrankingの実装は不明。
  method: method.md
  mapping: mapping.md
  implementation: '`uv run papers/cq-sid-eg-grpo-tmall/run.py` をリポジトリのルートで実行する。Python標準ライブラリのみを使い、CPUで完了する。結果はコードと同じ場所の
    `results.json` に保存する。乱数を使う箇所はseedを固定した。ダウンロードしたrun.pyも単体で動く。'
teaching_figures:
- kind: equations
  id: cq-quantization
  title: カテゴリ制約とexpertの役割を分ける
  after: method
  locator: 式1・7・9–10
  caption: 記号を分けて、どの量を学習・計算するかを追う。
  rationale: 記号を分けて、どの量を学習・計算するかを追う。
  steps:
  - name: 第1段
    formula: kᵢ¹ = CategoryID(i)（既知）; argminⱼ ‖rᵢ⁰−eⱼ¹‖²（未知）
    explanation: 残差の近さだけに任せず、既知のカテゴリを固定する。
  - name: 学習
    formula: L = L_recon + β L_commit + γ L_Bi-InfoNCE
    explanation: 表現を復元し、queryと商品を近づける。
  - name: 群のadvantage
    formula: A(oᵢ) = (R(oᵢ) − mean R)/(std R + ε)
    explanation: 生成群とexpert群を一緒に正規化。全報酬が同じならA=0。
  - name: 更新
    formula: L = −mean min(ρᵢ Aᵢ, clip(ρᵢ,1−ε,1+ε) Aᵢ)
    explanation: ρは新旧方策の出力確率比。toyはρ=1の初期勾配だけを調べる。
  source: https://arxiv.org/pdf/2605.14434v1
