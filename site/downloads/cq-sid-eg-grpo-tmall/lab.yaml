core_idea:
  author_claim: 著者はCategory-and-Query constrained Semantic ID（CQ-SID）とExpert-Guided
    GRPO（EG-GRPO）により、検索召回の精度・候補の広がり・計算量を両立できると主張する。生成召回は既存のmulti-channel recallとrankingへ組み込む（§1、§3–4）。
  research_bot_interpretation: ここでの設計判断は「IDの衝突をすべてなくす」より、意味の近い商品を一緒に呼ぶことにある。後段の選別が前提なので、beamを減らせても商品展開やrankingの費用は残る。専門家SIDの注入は教師信号の補強であり、未知の良い商品を発見できた証拠とは分ける。
sections:
  overview: TmallAPPのCQ-SIDは、一つのSIDから意味の近い商品群を取り出す召回チャネルだ。カテゴリ制約とquery-item対照学習で群を作り、EG-GRPOで既存の露出・クリックに合わせる。2週間のA/BでGMV
    +1.15%、UCTCVR +0.40%。購入の72.63%という値はチャネル構成比で、改善率ではない。
  problem: '巨大な検索商品集合から最終表示までを直接生成すると、必要な精度を低遅延で保ちにくい。本論文は生成を召回段に限定し、既存の粗いranking・精密rankingを使うhybrid構成を採る。SIDを一意IDにすると、小さなbeamでは呼び出せる商品数も少ない。逆に群を大きくし過ぎると、人気群が候補枠を占める。


    学習ログの購入・クリックは疎で、同じ報酬ばかりの生成群ではGRPOの相対advantageがなくなる。群の意味構造と学習信号の薄さを別々に扱う必要がある。'
  why_it_might_work: カテゴリで大枠を揃え、queryと商品の表現を近づけると、同じSIDを共有する商品の検索意図が揃いやすい。一つの生成で複数商品を出せるため、同じ候補件数を得るbeamを減らせる。expert
    SIDは低品質な生成群にも報酬差を作る。ただし注入により学習分布が変わり、ログ方策が選んだ商品への依存も残る。
  evidence: '### beamを揃える比較と商品数を揃える比較を分ける


    CQ-SIDは37.5Mサンプルで学習し、query評価201k、個人化評価170kを用いる。表1の非個人化click hitrateはbeam=100でRQ-VAE
    0.5199、CQ-SID 0.6181。ただし同じbeamでも候補商品数は一致しない。表2のtop-1K truncationではCQ-SIDがbeam=30で0.4422、RQ-VAEが65で0.4275。商品効率scoreで切るオフライン評価と、粗rankingで切るオンライン処理も同一ではない。


    個人化した表3のtop-1KではCQ-SIDがbeam=160で0.7984、RQ-VAEが195で0.7607。beam削減は17.95%。これをそのまま遅延削減率に換算しない。


    ### EG-GRPOの改善幅は小さい


    表4では標準GRPO（K=0）のclk@1は0.1510→0.1519だが、clk@10は0.5206→0.5196、平均露出coverage pvr@10は0.4371→0.4360と下がる。K=2では0.1524
    / 0.5221 / 0.4377。著者は深いbeamでのmode concentrationをcollapseと解釈するが、表は小幅な指標差を示すもので、全面的な学習破綻を測ったものではない。


    ### オンラインのliftとチャネル構成比は別の分母


    §4.5は2週間のA/BでGMV +1.15%、UCTCVR +0.40%を報告する。UCTCVRの詳細な集計定義や割付比率、区間推定は本文に明記されない。全面展開後の生成チャネル比率は露出50.25%、クリック58.96%、購入72.63%。この構成比をA/B
    liftや独占的な因果寄与と扱わない。平均end-to-end latencyは約40ms、8 GPUで200 QPS超、availability 99.9%、動的beamは20/50/100。p95遅延やGPU機種別の曲線はない。[一次資料
    §4](https://arxiv.org/pdf/2605.14434v1)


    <figure class="teaching"><h3>生成チャネルの構成比と、残りのチャネル</h3><p>著者報告 §4.5。各行の分母は全チャネルの露出・クリック・購入。A/Bの改善率ではない。</p><div
    class="share-row"><p>露出：生成 50.25% / その他 49.75%</p><div class="share-track" role="img"
    aria-label="露出の生成チャネル構成比50.25%"><span style="width:50.25%"></span><span style="width:49.75%"></span></div></div><div
    class="share-row"><p>クリック：生成 58.96% / その他 41.04%</p><div class="share-track" role="img"
    aria-label="クリックの生成チャネル構成比58.96%"><span style="width:58.96%"></span><span style="width:41.04%"></span></div></div><div
    class="share-row"><p>購入：生成 72.63% / その他 27.37%</p><div class="share-track" role="img"
    aria-label="購入の生成チャネル構成比72.63%"><span style="width:72.63%"></span><span style="width:27.370000000000005%"></span></div></div><figcaption>濃色＝生成、淡色＝その他（100%から計算）。複数チャネル間の重複帰属の詳細は本文にない。<a
    href="https://arxiv.org/pdf/2605.14434v1">出典：§4.5</a></figcaption></figure>'
  executable_understanding: '6つの人工クラスタを作り、各クラスタを10商品へ展開する。生成beamを増やした後、商品効率を模した固定scoreで20商品に切る。beamを増やすとtargetが落ちる反例を追う。別の実験では5つのSIDに報酬0.1/0.5/1.0を与え、8生成サンプルへK=0/2/4のexpertを加える。2,000群のadvantageと、旧方策上の一歩のlogit勾配を計算する。


    <div class="paper-probe teaching" data-paper-probe="cq-sid-eg-grpo-tmall"><h3>商品を群で呼び、20件へ切り詰める</h3><p>合成6クラスタ×10商品。targetは23。商品番号が大きいほど高い効率scoreを与えた反例である。</p>

    <div class="probe-controls"><label>生成beam<select data-cluster-beam><option>1</option><option>2</option><option
    selected>3</option><option>4</option><option>6</option></select></label></div><div
    data-probe-output aria-live="polite"><p>初期値：beam=3。30商品へ展開し、20商品へ制限。target=23は残る。</p></div>

    <h4>expert SIDを混ぜると、群の報酬差が生まれる</h4><label>注入数K<select data-expert><option>0</option><option
    selected>2</option><option>4</option></select></label><p>この例の生成8件はすべて報酬0.1、expertは報酬1.0。値は正規化advantage。</p><div
    data-expert-output aria-live="polite">K=2：生成のadvantageは−0.5、expertは2.0。</div><script
    type="application/json" data-probe-data>{"note": "人工SID群で展開件数と正規化advantageを計算。学習崩壊や実際の検索精度は再現していない。",
