    {"beam": 4, "unique_items": 4, "cluster_items": 40, "after_cap": 20, "target_retained":
    true, "selected": [39, 38, 37, 36, 35, 34, 33, 32, 31, 30, 29, 28, 27, 26, 25,
    24, 23, 22, 21, 20]}, {"beam": 6, "unique_items": 6, "cluster_items": 60, "after_cap":
    20, "target_retained": false, "selected": [59, 58, 57, 56, 55, 54, 53, 52, 51,
