question: CQ-SID：商品群を生成し、Tmallの既存ランキングにつなぐ
summary: TmallAPPのCQ-SIDは、一つのSIDから意味の近い商品群を取り出す召回チャネルだ。カテゴリ制約とquery-item対照学習で群を作り、EG-GRPOで既存の露出・クリックに合わせる。2週間のA/BでGMV
  +1.15%、UCTCVR +0.40%。購入の72.63%という値はチャネル構成比で、改善率ではない。
