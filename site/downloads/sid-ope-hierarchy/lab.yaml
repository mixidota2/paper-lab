question: SIDの木は、ログで見えていない商品の評価をどこまで助けるか
summary: 商品単位の重要度重みが不安定なとき、SIDの接頭辞ごとに確率を合算すれば、有効な標本が増える。精度改善の中心は粗粒度化で、木の固有の利点はdecoderから群の確率を安く取り出せることにある。
