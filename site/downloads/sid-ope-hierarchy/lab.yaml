teaching_figures:
- kind: equations
  id: bias-bound
  title: 粗くすると消えるのは群内の方策差
  after: method
  caption: 上限の対象はraw cluster IPS。平均量子化誤差だけでは上限を決められない。
  source: https://arxiv.org/pdf/2608.28905v1
  locator: 命題3.1
  rationale: 上限の対象はraw cluster IPS。平均量子化誤差だけでは上限を決められない。
  steps:
  - name: 重要度重み
    formula: wᵢ = πₑ(Cᵢ|xᵢ) / π₀(Cᵢ|xᵢ)
    explanation: 群の出現率をtargetに合わせる。群内の商品選択はlogging側のまま。
  - name: 条件付きバイアス上限
    formula: '|Bias| ≤ 2 L_q δ_max,ℓ E[TV_in,ℓ]'
    explanation: 群内の報酬変動と群内方策差の両方が小さければ偏りも小さい。既知確率・positivity・埋め込み仮定が必要。
