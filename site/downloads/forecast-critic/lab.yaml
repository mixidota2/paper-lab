core_idea:
  author_claim: '著者はトレンド、水準、周期、急増を人工的に崩した予測で批評能力を調べる。販促の説明を加える実験と、M5上のChronos予測を点検する実験も行う。言語・画像の文脈から不自然な予測を拾う監視手段として提案する。


    [一次資料：合成実験 / 外生情報の実験 / 実データの実験](https://arxiv.org/html/2512.12059)'
  research_bot_interpretation: これは予測精度を直接改善する学習法ではない。警告した後に誰が何を確認し、誤警告をいくつまで許すかが運用を決める。図の描き方や説明文の質に依存するなら、監視器自身も評価対象になる。
sections:
  overview: '予測を作るモデルとは別に、履歴・予測図・販促の説明を読む批評器を置く。狙いは誤予測の自動修正より、点検すべき系列の発見。


    このLabでは「未来の実績を待たずに、怪しい予測を見つけられるか」を考える。論文の主張を押さえたうえで、下の図で条件を変え、どこから結論が変わりそうか確かめる。'
  problem: '平均の誤差が良くても、個別には周期がずれた予測や、不自然に平らな予測が混じる。未来の実績がまだない時点では、通常の誤差指標でその失敗を測れない。


    Forecast Criticは過去と予測の図、必要なら販促に関する文章を見せ、もっともらしい予測かをLLMへ尋ねる。将来の真値を先に見て良否を判定する使い方ではない。'
  why_it_might_work: 数値の誤差だけでは説明しにくい「販促予定があるのに山がない」という矛盾を、文章と図から拾える可能性がある。一方、新しい現象が過去と違って見えるだけで誤警告することもある。
  evidence: 'Abstractと合成実験では最良モデルのF1が0.88、人が0.97と報告される。F1は警告の適合率と再現率をまとめる値。実データの実験では、怪しいとされた予測群のsCRPSが少なくとも10%高い。これは群の誤差の違いで、監視を導入すれば誤差が10%改善するという結果ではない。


    [一次資料：合成実験 / 外生情報の実験 / 実データの実験](https://arxiv.org/html/2512.12059)'
  executable_understanding: '10件の合成スコアと正解ラベルを用意する。警告閾値を変え、適合率・再現率・誤警告・見逃しを再計算する。LLMを呼ばず、監視運用の判断を学ぶための実験。


    実行：`uv run papers/forecast-critic/run.py`。合成データの作り方と比較条件はコード内に記載し、図の全条件の結果を `results.json` へ保存する。'
  results: 図のスライダーは、同じ実験コードが計算した各条件を表示する。初期条件の値を下表に示す。値の大小を論文モデルの優劣へ読み替えない。
  what_we_verified: '**メカニズム：PARTIAL（部分的）**。確認したのは、このLabで明記した仮定の下での計算と条件による変化。原論文の機構全体を確認した意味ではない。


    10件の合成スコアと正解ラベルを用意する。警告閾値を変え、適合率・再現率・誤警告・見逃しを再計算する。LLMを呼ばず、監視運用の判断を学ぶための実験。'
  what_we_did_not_verify: 人工的な破損と自然発生する失敗の分布は違う。実務では低い問題発生率の下で誤警告が増えないか、担当者の作業時間が減るか、警告後の修正で費用が下がるかを確認したい。LLMによる図の理解は今回検証していない。
  implementation: '標準ライブラリだけで実行できる。入口は各Labの `run.py`、計算本体は `papers/_toy_common.py` にある。関数は論文IDごとに独立し、ブラウザー用の全条件と初期条件の表を同時に出力する。


    意図して省いたもの：画像理解、LLM、販促の文章、Chronos、M5。'
  mapping: '| 対象 | 原典とLabの対応 |

    | --- | --- |

    | 原論文 | [合成実験 / 外生情報の実験 / 実データの実験](https://arxiv.org/html/2512.12059) |

    | 処理図 | 上記の仕組みを説明用に簡略化。公式実装ではない |

    | 条件探索 | `run.py` → `papers/_toy_common.py` → `results.json` |

    | 公式コード | このLabでは公式コードとの行単位の照合はしていない。 |'
question: 未来の実績を待たずに、怪しい予測を見つけられるか
interactives:
- kind: flow
  title: 処理と設計の違いを追う
  caption: 段を選ぶと説明が切り替わる。比較側は論点を示す簡略化で、統制実験の実装ではない。
  source: https://arxiv.org/html/2512.12059
  stages:
  - title: 予測を受け取る
    baseline: 平均誤差を後から測る
    proposed: 履歴と予測を図にする
    detail: 未来の実績はまだ見えない時点を想定する。
  - title: 状況を加える
    baseline: 数値だけを確認
    proposed: 販促などの説明を加える
    detail: 説明文に未来の正解が漏れていないかを確認する。
  - title: 不自然さを判定する
    baseline: 誤差の大きい順に並べる
    proposed: 図と文脈から批評する
    detail: 周期、水準、急増などが妥当かを見る。図は論文システムの概念説明。
  - title: 人が点検する
    baseline: 全件を読む
    proposed: 警告した系列を点検
    detail: 批評器が予測を自動修正するとは限らない。見逃しと誤警告の両方を数える。
- kind: explorer
  title: 警告を厳しくすると何を見逃すか
  caption: 10件の合成スコアと正解ラベルを用意する。警告閾値を変え、適合率・再現率・誤警告・見逃しを再計算する。LLMを呼ばず、監視運用の判断を学ぶための実験。
