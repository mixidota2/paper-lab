  steps:
  - name: 採用
    formula: KEEP ⇒ effect≥δ ∧ significant ∧ acceptable_guardrails
    explanation: 観測窓と例外審査の情報も判定に残す。
  - name: paired replay
    formula: ΔJ=mean_j[J(h′,task_j)−J(h,task_j)]
    explanation: 同じtaskで新旧のharnessを比較する。
  - name: 更新
    formula: accept ⇔ ΔJ>ε ∧ Safe(Δh)
    explanation: 自然言語の診断を利用する。数値gradientでLLM重みを更新しない。
