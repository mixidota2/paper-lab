core_idea:
  author_claim: 著者は、Brainstorm、Developing、Evaluation、Harness Evolutionの四段階により、経験を再利用しながら推薦開発の処理量を増やせると主張する。負のA/Bも次の探索の制約へ変換する（§3–7）。
  research_bot_interpretation: 価値は「毎案が優秀」より、production契約を守って多数の案を試し、失敗を記憶する仕組みにある。著者もsenior engineerの1案あたりhit rateが約1.9倍高いと認めている。開発ループ内のA/Bと、開発者としての人間対agentの因果比較を区別する。
sections:
  problem: '推薦の改善案があっても、実装、dry-run、trafficの確保、A/Bの観測、採用判断が詰まれば実験数は増えない。AgentXはこの実行待ちを並列化する。変更対象はproductionのcodeやDSL、戦略parameterで、会話で推薦結果を返すagentではない。


    発案の良さと実行速度は別の軸だ。人間が選び抜いた案の採用率を、agentが大量生成した案の採用率と直接比較して、能力全般の優劣は決められない。'
  evidence: '### 観察された処理量と1案の質


    §8・表5–8。3 workersで3週間、Main Feed 361案→8 LR、Life Service 13案→2 LR。worker-week単位の比較では同時実験12対1.5（8倍）、LR 1.1対0.08、累積app-time
    gain 0.0623%対0.0167%（約3.7倍）。1案あたりrollout率は2.7%対5.1%で人間が高い。


    これは同じ案集合、同じtraffic予算、同じ経験年数を揃えたrandomized human-agent比較ではない。期間中のskill蓄積や運用改善も含む。SGPOのpaired replayと、この生産性比較は評価単位が異なる。


    ### business impactと再現の境界


    Main Feedの累積user app consumption time +0.561%、Life Serviceの年率換算revenueはRMB 100 million超（§8）。一つの共通A/B treatmentの効果量として合算し直さず、累積運用成果として扱う。年率換算は実現済みの1年分売上ではない。元データ、CI、個々のrollout間の重なりは公開されず、このLabでは独立検証できない。


    [AutoLR](autolr-dashen.html)のKEEPと比較すると、AgentXは発案からproduction投入までを広く扱う。[RecEvolve](recevolve-autonomous-rec.html)と共通するのは、offline
    scoreだけで採用を決めず、実行可能性と本番評価を閉ループに入れる点だ。


    [一次資料：版を固定したPDF](https://arxiv.org/pdf/2606.26859v2)。図表の箇所とSHA-256は末尾の対応表を参照。'
  overview: 'AgentXは発案、実装、オンライン評価、harness更新を閉じた開発ループにする。3 workers・3週間で374案から10件のlaunchable results。8倍の同時実験と3.7倍のworker-weekあたり価値は運用観察であり、同じ案を人とagentへ割り付けた比較ではない。


    <figure class="teaching batch17"><h3>374案のどこで止まったか</h3><div class="b17-funnel"><div style="--stage:100%"><strong>374</strong>
    発案</div><div style="--stage:75%"><strong>106</strong> review通過</div><div style="--stage:65%"><strong>100</strong>
    code・launch</div><div style="--stage:35%"><strong>10</strong> launchable result</div></div><p>374→106：28.34%
    ／ 106→100：94.3% ／ 100→10：表の報告9.9%</p><figcaption>§8・表5・式10。棒幅は段階を見分ける模式表現で、件数に比例しない。整数からの最終比率は10%。丸め・集計差は本文で解消されていない。</figcaption></figure>'
  why_it_might_work: '【解釈】検証済みのrepository知識、実験lock、dry-run、観測窓を明示すると、実装のやり直しと同じ失敗の再発を減らせる。独立した工程へ案を流すため、一本ずつ完了を待つ手順より同時実験を持ちやすい。


    ただしworkerを増やしてもtraffic、parameter lock、レビュー帯域は有限だ。表6では却下268案の64.7%がparameter-resource conflict。著者の「platform側の問題」という分類は、agentの事前確認能力を改善する余地がないことを意味しない。'
