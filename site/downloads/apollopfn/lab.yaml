teaching_figures:
- kind: architecture
  id: prior-and-model
  title: 合成課題で学び、利用時は履歴を文脈にする
  after: method
  locator: 図3・§3.2–3.3
  rationale: 事前学習と利用時を分離してPFNの意味を教える。
  caption: 合成SCMと予測器は別の構成要素。矢印はデータまたは表現の受け渡し。
  rows:
  - label: 事前学習データ
    nodes:
    - title: 時間信号 → SRNGNのSCM
      text: sin/cosの根 → ランダムMLPで伝播 → xとyを選択
  - label: 各層：まず特徴を照合
    nodes:
    - title: 特徴方向 AttnFeat
      text: 同じ時刻の外生変数と目的変数の関係を照合。
  - label: 次に時間を照合 ↓
    nodes:
    - title: 時間方向 AttnSamp
      text: RoPEと絶対位置表現で時刻を扱う。
  - label: 各層の出力 ↓
    nodes:
    - title: MLP ＋ 残差・LayerNorm
      text: 特徴attention、時間attention、MLPの各段で残差を足して正規化する。
  - label: 新しい系列での利用
    nodes:
    - title: 過去(x,y) ＋ 将来x → 予測分布
      text: 将来yはマスク。対象データでの勾配更新は行わない。
  source: https://arxiv.org/html/2603.15802
- kind: matrix
  id: visible-input
  title: 未来の外生変数は見せても、正解は見せない
  after: method
  locator: §3.1・3.3
  rationale: full attentionを情報漏洩と混同しないため。
  caption: 価格・販促が予測時点で確定している例。実際の利用可能時刻の確認は別途必要。
  columns:
  - 過去1…T
  - 将来T+1…T+H
  rows:
  - label: 目的変数y
    cells:
    - 観測値を入力
    - マスクする
  - label: 説明変数x
    cells:
    - 観測済みの値
    - 予測時に既知の値
  - label: 時間方向attention
    cells:
    - 全時刻の表現を参照
    - 他の将来時刻の表現も参照
  corner: 条件
  source: https://arxiv.org/html/2603.15802
- kind: equations
  id: pfn-loss
  title: 合成課題上の予測分布を学習する
  after: method
  locator: §3.1
  rationale: zero-shotが何を省くのかを学習目的で示す。
  caption: 論文の条件付き負の対数尤度を短い記号で表す。Dpastは過去の(x,y)、xfutureは既知の将来説明変数。
  steps:
  - name: 事前学習
    formula: L(θ) = − Esynthetic [ log qθ(yfuture | xfuture, Dpast) ]
    explanation: 合成課題を多数サンプルし、未来の正解に高い確率を付けるようにθを学ぶ。実データ利用時はθを固定する。
  source: https://arxiv.org/html/2603.15802
