core_idea:
  author_claim: 'ApolloPFNは時間依存の信号を根に持つ合成グラフで、目的変数と説明変数を生成する。さらに特徴間の照合と時間方向の照合を分け、時間順序を表現する仕組みを持たせる。表データ向けPFNの枠組みを、順序に意味がある時系列へ合わせる提案。


    [一次資料：§3.2 / §3.3 / §4.2・表1](https://arxiv.org/html/2603.15802)'
  research_bot_interpretation: 実務上の比較相手は、同じ販促予定を渡した木モデルや時系列モデルになる。外生変数を使えない相手に勝っても、モデル構造の優位と情報量の優位は切り分けられない。
sections:
  overview: 'ApolloPFNは時間の順序と外生変数を扱う事前学習モデル。予測の差を読むには、将来情報がいつ利用可能だったかを押さえる必要がある。


    このLabでは「将来の価格や販促を、再学習せず予測へ使えるか」を考える。論文の主張を押さえたうえで、下の図で条件を変え、どこから結論が変わりそうか確かめる。'
  problem: '来週の販促は、過去の販売だけからは分からない。価格や販促予定を入力できるモデルでも、時間の前後関係や最近の変化を捉えにくければ、販促前後の動きを取り違える。


    PFNは、多数の人工的な予測課題で事前学習し、利用時には観測データを文脈として与えて予測する方式。zero-shotは対象データで重みを更新しない意味で、過去データや事前学習が不要という意味ではない。'
  why_it_might_work: 人工課題の中で外生変数と時間変化の関係を学べば、未知の系列でも文脈から関係を読み取れると考えられる。ただし人工的な事前分布が、欠品や店舗ごとの販促反応まで代表するとは限らない。
  evidence: '§3.2–3.3は合成データ生成と時間・特徴を分ける構造を説明する。§4.2・表1はM5の複数集計水準でTabPFN-TSに対し平均5.7%のRMSSE改善を報告する。全水準で一律に勝つという意味ではない。ここでは掲載誌の認定を根拠にせず、確認したarXiv本文の実験条件を参照する。


    [一次資料：§3.2 / §3.3 / §4.2・表1](https://arxiv.org/html/2603.15802)'
  executable_understanding: '季節性と販促の上乗せから16期の人工需要を作る。販促予定の時期をずらし、情報が正しい場合と誤っている場合の平均絶対誤差を比べる。


    実行：`uv run papers/apollopfn/run.py`。合成データの作り方と比較条件はコード内に記載し、図の全条件の結果を `results.json` へ保存する。'
  results: 図のスライダーは、同じ実験コードが計算した各条件を表示する。初期条件の値を下表に示す。値の大小を論文モデルの優劣へ読み替えない。
  what_we_verified: '**メカニズム：PARTIAL（部分的）**。確認したのは、このLabで明記した仮定の下での計算と条件による変化。原論文の機構全体を確認した意味ではない。


    季節性と販促の上乗せから16期の人工需要を作る。販促予定の時期をずらし、情報が正しい場合と誤っている場合の平均絶対誤差を比べる。'
  what_we_did_not_verify: 予測時点で利用できる価格、販促、天候予報だけを渡す必要がある。Chronos-2や同条件のGBDTを含む比較、欠品時の需要推定、発注費用はこのLabでは確認していない。
  implementation: '標準ライブラリだけで実行できる。入口は各Labの `run.py`、計算本体は `papers/_toy_common.py` にある。関数は論文IDごとに独立し、ブラウザー用の全条件と初期条件の表を同時に出力する。


    意図して省いたもの：PFNの事前学習、合成グラフ、attention、M5。'
  mapping: '| 対象 | 原典とLabの対応 |

    | --- | --- |

    | 原論文 | [§3.2 / §3.3 / §4.2・表1](https://arxiv.org/html/2603.15802) |

    | 処理図 | 上記の仕組みを説明用に簡略化。公式実装ではない |

    | 条件探索 | `run.py` → `papers/_toy_common.py` → `results.json` |

    | 公式コード | このLabでは公式コードとの行単位の照合はしていない。 |'
question: 将来の価格や販促を、再学習せず予測へ使えるか
interactives:
- kind: flow
  title: 処理と設計の違いを追う
  caption: 段を選ぶと説明が切り替わる。比較側は論点を示す簡略化で、統制実験の実装ではない。
  source: https://arxiv.org/html/2603.15802
  stages:
  - title: 課題を準備する
    baseline: 独立した表の人工課題
    proposed: 時間依存の人工課題
    detail: 事前学習段階。時間の根信号から目的変数と説明変数を作る。
  - title: 事前学習する
    baseline: 表の関係を学ぶ
    proposed: 特徴と時間を分けて学ぶ
    detail: 時間方向の構造を学習に含める。ここは利用時とは別の計算。
  - title: 予測時に入力する
    baseline: 過去の販売だけ
    proposed: 過去と既知の将来変数
    detail: 将来の売上は渡さない。販促予定は予測時点で分かるものに限る。
  - title: 未来を予測する
    baseline: 過去の形を外挿
    proposed: 文脈から条件付き予測
    detail: 対象データで重みを更新しない。予測の妥当性は予定の正確さにも依存する。
- kind: explorer
  title: 販促予定がずれると予測はどうなるか
  caption: 季節性と販促の上乗せから16期の人工需要を作る。販促予定の時期をずらし、情報が正しい場合と誤っている場合の平均絶対誤差を比べる。
