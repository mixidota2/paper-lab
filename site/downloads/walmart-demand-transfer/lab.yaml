question: 商品を棚から外したとき、その需要はどの商品へ移るか
summary: Walmartは独立に作る需要予測へ、代替商品の需要流入を足すための係数を推定する。カテゴリ単位のlogitと代替候補への制限で100万超の商品規模を扱うが、検証は予測誤差の改善であり、棚変更の因果実験ではない。
