    formula: Hᴱ = HP, Hᴺ = H(I−P)
    explanation: 直交射影の和は元の表現。因果的な分離の保証ではない。
  - name: 形状を直す
    formula: H̃ = Hᴺ + Hᴱ + mαgΔH
    explanation: イベント成分をqueryとして意味情報を参照する。
  - name: 水準を直す
    formula: ŷ = ŷ_lat ⊙ exp(mβgρ)
    explanation: m = 0なら指数項は1。Skipで元の予測へ戻る。
