core_idea:
  author_claim: Qwen3-32Bが介入の有無と意味情報を決め、Chronos-2 smallが数値予測を担う。イベントに関係する表現でテキストを参照し、加算補正と乗算補正を使い分ける。
  research_bot_interpretation: 注目点は文章を常に足すことより、介入しない経路を明示した点にある。販促・欠品を同条件で扱うTSFMとGBDTの比較には、需要の打切りと在庫費用を別途組み込む必要がある。
sections:
  overview: ReasonCastは凍結したChronos-2に対し、Skip・Basic・Toolで意味情報の介入を選ぶ。イベント区間では誤差を減らし、Skipでは元の予測を厳密に保つ。欠品を含む需要予測手法の優劣は未決着。
  problem: 安定した売上に不要な意味情報を加えると、時系列モデルが捉えた規則性を壊す。一方、祝日や大型セールの水準変化は過去の波形だけでは捉えにくい。論文の独自データは商品単位ではなく、末端カテゴリ単位の日次15,696系列。予測期間は7日である。
  why_it_might_work: 解釈：Skipを明示的な分岐にすれば、学習したゲートが小さくなることに頼らず元の出力を守れる。直交分解は表現の幾何学的な制約であり、イベントの因果効果を同定する保証ではない。注意出力を再射影しないため、補正全体がイベント部分空間に留まるとも限らない。
  evidence: '一次資料[Table 2・3](https://arxiv.org/pdf/2608.15291) の著者報告。差はWMAPEのパーセントポイント（pp）で、相対改善率ではない。


    | 区間 | 最良比較手法 | ReasonCast | 差 |

    | --- | --- | --- | --- |

    | 祝日・高感応 | Uni-FT 42.39% | 39.10% | −3.29 pp |

    | 大型セール・高感応 | Multi-FT 22.14% | 20.89% | −1.25 pp |

    | M5イベント窓 | Multi-FT 33.10% | 32.63% | −0.47 pp |

    | 平常期 | Chronos-2 small 7.91% | Skip 7.91% | 0 pp |


    平常期の常時介入は9.59%で、元の7.91%より1.68 pp悪化する。学習は2025年8月末まで、モデル選択は同年9–10月、評価は同年11月から2026年5月。M5は10店舗を合算した3,049商品系列の14個のイベント窓であり、店舗別の欠品対策を直接評価していない。'
  method: method.md
  executable_understanding: '`uv run papers/reasoncast-agentic-demand-forecasting/run.py`。標準ライブラリだけで実行でき、同じフォルダーのresults.jsonを更新する。


    correct()で同じ基準値に補正を加え、Skip・不要な介入・正しいイベント情報・誤った情報を比較する。WMAPEは Σ|y−ŷ| / Σ|y| × 100。全ゼロ需要は未定義としてNoneを返す。'
  results: 人工の平常期ではSkipのWMAPEは0%、不要なBasicは20%。誤ったTool補正では100%まで悪化する。正しい情報を与えたイベント例の改善は、情報を正しく推論できる証拠にはならない。
  what_we_verified: CONFIRMED：人工例のSkip分岐で出力の浮動小数点表現を保つ。PARTIAL：加算・乗算の役割と不要な介入による悪化を確認した。
  what_we_did_not_verify: Performance / Scaling / Production applicabilityはNOT TESTED。Chronos-2、Qwen3-32B、検索道具、学習されたルータ、直交射影、GRPOは実行していない。欠品で観測売上が潜在需要を下回る条件、販促費用、在庫サービス水準も未評価。
  implementation: correct() → 式(8), (11), (12)の簡略化。wmape() → 式(16)。ルータと潜在表現、学習は省略。
  mapping: mapping.md
