teaching_figures:
- kind: equations
  id: prefix-support
  title: アイテム順位を削減前のprefixへ戻す
  after: method
  source: https://arxiv.org/html/2607.24995
  locator: §5.1–5.2・式(15)–(16)
  rationale: 入力、演算、出力と適用条件を具体化する。
  caption: 診断用の全アイテムscoreの線形混合（§4.3）とは異なり、ISDは順位を融合する。
  steps:
  - name: 1回だけ支援集合を作る
    formula: Q(h) = TopJᵢ s(h,i),  i ∉ h
    explanation: 観測履歴hから未消費アイテムを順位付け。test targetの正体は入力しない。
  - name: prefixを支える最上位
    formula: 'rᵢₜₑₘ(p) = min { rQ(i) : i ∈ Q(h) ∩ Sₚ }'
    explanation: Sₚはprefix pを持つアイテム集合。該当なしなら∞。
  - name: 順位融合してからbeam削減
    formula: F(p) = 1/(κ + rdec(p)) + 1/(κ + rᵢₜₑₘ(p))
    explanation: ∞の項は0。rdecは累積系列確率での順位。上位B個を残す。
- kind: equations
  id: post-order
  title: 候補を残すことと上位へ置くことを分ける
  after: method
  source: https://arxiv.org/html/2607.24995
  locator: §4.1・§5.2.2・式(9)・(17)
  rationale: 入力、演算、出力と適用条件を具体化する。
  caption: prefix救済と最終orderingを別々に評価する理由。
  steps:
  - name: 生存集合
    formula: 'Rℓ = ⋃ { Sₚ : p ∈ Bℓ }'
    explanation: prefixが落ちると、その下の全アイテムが以後の生成対象から外れる。
  - name: 生成済みアイテムを並べ替える
    formula: Fitem(i) = 1/(κ + rSID(i)) + 1/(κ + rQ(i))
    explanation: Qにないアイテムの第2項は0。並べ替えだけでは未生成のアイテムを復活させない。
interactives: []
core_idea:
  author_claim: SIDは大まかなアイテムのまとまりを保つ一方、encoderの細かい近傍や、同じ事実の並べ替えに対する完全なコード不変性を失う。著者は、生成途中のprefix削除をアイテムの不可逆な除外として測り、外部順位で支えるISDを提案する。[一次資料：§3–5](https://arxiv.org/html/2607.24995)
  research_bot_interpretation: 「意味が近い番号」を作ることと「必要な候補を落とさない探索」を実現することは別の設計課題である。SIDを捨てる結論ではなく、どの段で何件の候補が消えたかを観測する根拠として読む。SpotifyのR-KMeansにも問いは適用できるが、Amazonの測定率を本番へそのまま当てはめられない。
sections:
  overview: SIDの粗い意味構造、個体識別、探索中の絞り込みを分けて考える。ISDは外部のアイテム順位をbeam削減の前と生成完了後に使うが、失われた識別子の学習まで直す手法ではない。
  problem: あるprefixをbeamから外すと、そのprefixを持つ全アイテムが候補から消える。後で強いrankerを使っても、入力されなかったアイテムは救えない。問題は生成した最終リストの精度だけでなく、その前段でどの候補の到達可能性を失ったかにある。[一次資料：§4.1](https://arxiv.org/html/2607.24995)
  why_it_might_work: 外部rankerが好むアイテムを残すprefixに加点すれば、tokenだけの判断で起こる取りこぼしを減らせると考えられる。ただし上位の1アイテムがprefix全体を支えるため、外部rankerが誤るとその誤りも広がる。多くのアイテムを抱えるbucketの有利さ、支援集合に入らない新規アイテムへの影響も測りたい。
  evidence: '### 平均値だけでSIDの性質を決めない


    Abstractはencoderのtop-10近傍回復を平均32.2%、同じ事実の並べ替えによる完全SIDの変化を38.4%と報告する。表2では、近傍回復は構築法・領域ごとに13.8–45.1%、SID変化は14.0–73.5%に広がる。例えばSentence-T5とOfficeのRQ-VAEでは近傍回復13.8%、変化53.9%。同じencoderのRQ-KMeansでは31.5%、29.3%となる。


    同一性の対照実験について、Abstractと§3.1.4は99.57%とするが、表1のSentence-T5のOffice / Scientificはともに99.51%。集計範囲の差が明記されていないため同じ値として統合しない。[一次資料：Abstract・表1・2](https://arxiv.org/html/2607.24995)


    ### 改善は外部順位と指標に依存する


    Amazon ReviewsのBaby / Office / Scientificで、時系列の最後をtest、その前をvalidationとする。表3の最大+31.2%はBabyのTIGER +
    ISD(UniSRec)のNDCG@10であり、0.0295から0.0387への相対改善。statistics版ではBabyのRecall@20が0.0866から0.0745へ下がる。


    表5の段階別実験では、TIGERの改善は主にorderingから来る条件もある。「prefix救済だけが性能改善の原因」とは言えない。§6.4では変更後のsemantic prefixを残しても、未学習の衝突解決suffixのため完全取得がゼロの実験も報告する。[一次資料：§6・表3–5](https://arxiv.org/html/2607.24995)'
  executable_understanding: '`uv run papers/understanding-sids-isd/run.py`


    8アイテムに3桁の固定SIDと正の生成確率を与える。外部順位は別に用意した学習遷移表の頻度から求める。9件の評価targetは順位作成にもdecode関数にも渡さない。通常beam、生成後の並べ替えだけ、prefix支援だけ、両段階、意図的な逆順位支援を同じbeam幅で比較する。


    幅1・2・4・8で、各桁の残存target率とtoy NDCG@2を計算する。評価は各例に関連アイテム1つ、残れば1/log₂(rank+1)、上位2件に入らなければ0。残存率の母集団は9例すべてで、論文の外部ranker
    top-kに条件付けたKℓとは異なる。'
  results: beam幅2では最終残存率が通常beamの3/9から両段階の5/9へ増え、toy NDCG@2は0.292326から0.473540となった。逆順位の支援では0に下がる。幅8で全アイテムを残すとprefix支援は残存率を改善できず、並べ替えの効果だけが残る。これらは手で定めた小さな確率表の結果である。
  what_we_verified: Mechanism PARTIAL。累積生成確率によるbeam探索、式(15)–(17)の順位融合、候補脱落後の復帰不能を有限の木で確認した。外部順位が誤る条件と、全葉が残る条件も実行した。
  what_we_did_not_verify: Performance / Scaling / Production applicabilityはNOT TESTED。encoder、量子化学習、同事実の並べ替え、SASRec
    / UniSRec、TIGER / LIGERの学習、Amazonでの精度、実サービスの負荷は未検証。衝突解決suffixもtoyにはない。
  implementation: run.pyのSIDSとPROBSがカタログと固定decoder、TRAINが外部順位の学習データ、TESTが評価例である。decodeは各段の全beam拡張を累積確率で順位付けし、支援を加えてから削減する。最終候補だけを再順位付けし、未生成アイテムは追加しない。results.jsonには各prefixの確率・融合値・残存集合も残す。
  method: method.md
  mapping: mapping.md
