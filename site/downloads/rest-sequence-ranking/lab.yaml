teaching_figures:
- kind: architecture
  id: asymmetric
  title: 履歴は重く1回、候補は軽く何回も
  after: method
  locator: 図1・§2.3–2.6
  rationale: 非対称な計算配置と学習用の枝を明示する。
  caption: TとCの機能を再構成した図。候補側は同じ履歴メモリを読む。
  rows:
  - label: ユーザー単位の共有処理
    nodes:
    - title: 行動履歴 → T
      text: DGA・RoPE/RoTE・SRNを備えた系列encoder → H
  - label: HをKey/Valueとして共有 ↓
    nodes:
    - title: 候補A → C
      text: 少数のQueryでHを読む。
    - title: 候補B → C
      text: 同じHを読み、候補別表現を作る。
  - label: 出力と学習専用の枝
    nodes:
    - title: 本番：CVR head
      text: 系列表現と非系列DLRM特徴を合わせる。
    - title: 学習のみ：補助head
      text: 系列CVRと表現整合でTへ直接学習信号を送る。
  source: https://arxiv.org/html/2609.01240
- kind: equations
  id: dual-gates
  title: Valueを絞ってから集約し、出力をもう一度調整する
  after: method
  locator: 式(2)・(3)・(6)
  rationale: 二重ゲートがattentionのどこに作用するかを示す。
  caption: Xは入力系列、σはsigmoid、⊙は要素ごとの積。Wは学習する射影行列。
  steps:
  - name: 集約前のValueゲート
    formula: V′ = σ(XWgv) ⊙ (XWV)
    explanation: 個々の行動特徴が集約へ入る強さを調整する。
  - name: 因果attentionで集約
    formula: H = softmax(QKᵀ / √d + Mcausal) V′
    explanation: 未来位置をMcausalで遮断する。ゲートはsoftmax自体を置き換えない。
  - name: 集約後の出力ゲート
    formula: DGA(X) = (H ⊙ σ(XWgo)) Wo
    explanation: 集約された文脈が出力へ寄与する強さを調整する。2つのゲートは別のパラメータを持つ。
  source: https://arxiv.org/html/2609.01240
