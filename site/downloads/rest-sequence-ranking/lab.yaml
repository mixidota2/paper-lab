summary: 系列の枝へ学習信号を届かせ、重い履歴計算を候補間で共有する。ReSTは学習の不足と配信の重複を一緒に扱う。
figures: []
core_idea:
  author_claim: 'ReSTは情報を集める前と後にゲートを置いてノイズを抑え、順序と実時間を別の回転埋込みで扱う。残差の正規化で深い層を安定させ、系列単独の購入率予測と枝間の整合を学習時に補助する。配信では重い履歴エンコーダーを1回動かし、軽い候補別デコーダーから共有表現を読む。


    [一次資料：§2.3–2.6 / §3.4 / §3.5](https://arxiv.org/html/2609.01240)'
  research_bot_interpretation: 履歴長を増やす前に、系列の枝が何を学び、どれほど勾配を受けているかを確かめたい。UniPinRecが段をまたぐ共有を狙うのに対し、ここは順位付けの候補間での共有が中心。両者は競合するとは限らない。
sections:
  overview: 系列の枝へ学習信号を届かせ、重い履歴計算を候補間で共有する。ReSTは学習の不足と配信の重複を一緒に扱う。
  problem: '推薦の履歴は文章とは違う。クリックには偶然が混じり、隣り合う行動が数秒差のことも数日差のこともある。正解ラベルも各行動に密に付くわけではない。


    属性などを読む非系列の枝が強いと、モデルはそこだけで損失を下げられる。履歴に情報があっても系列の枝が育たない状態を、著者はsequence starvationと呼ぶ。系列を長くするだけでは解決しない。'
  why_it_might_work: 補助損失があれば、非系列の枝が主損失をほぼ解いてしまった後も、系列へ直接学習信号を送れる。これが将来の汎化に役立つかはデータ次第であり、補助損失を強めるほどよいとは限らない。
  evidence: '§2.3–2.6が各部品と共有計算、§3.4が部品を外す比較を扱う。§3.5では1週間の本番A/BでオンラインAUC+1.31%、収益指標+11.93%を報告し、P99の応答時間を50ms以内に収める。複数部品を含むシステム全体の著者報告で、補助損失だけの効果ではない。


    [一次資料：§2.3–2.6 / §3.4 / §3.5](https://arxiv.org/html/2609.01240)'
  executable_understanding: '非系列の予測が正解に近い1例で、系列枝へ届く二乗損失の勾配を解析的に計算する。補助損失の重みを変え、勾配がどう変わるかを見る。


    実行：`uv run papers/rest-sequence-ranking/run.py`。合成データの作り方と比較条件はコード内に記載し、図の全条件の結果を `results.json` へ保存する。'
  results: 初期条件の計算値と全条件の結果を示す。合成データ上の小実験であり、論文モデルの性能を測った値ではない。
  what_we_verified: '**メカニズム：PARTIAL（部分的）**。確認したのは、このLabで明記した仮定の下での計算と条件による変化。原論文の機構全体を確認した意味ではない。


    非系列の予測が正解に近い1例で、系列枝へ届く二乗損失の勾配を解析的に計算する。補助損失の重みを変え、勾配がどう変わるかを見る。'
  what_we_did_not_verify: 履歴の長さだけでなく期間、情報の鮮度、ノイズ量をそろえたい。補助損失が効く理由は簡略な勾配計算だけでは確認できず、系列を入れ替える・削除する実験で実際の依存を測る必要がある。
  implementation: '標準ライブラリだけで実行できる。入口は各Labの `run.py`、計算本体は `papers/_toy_common.py` にある。関数は論文IDごとに独立し、ブラウザー用の全条件と初期条件の表を同時に出力する。


    意図して省いたもの：Transformer学習、DGA・RoTE・SRN、実データとGPU。'
  mapping: '| 対象 | 原典とLabの対応 |

    | --- | --- |

    | 原論文 | [§2.3–2.6 / §3.4 / §3.5](https://arxiv.org/html/2609.01240) |

    | 手法の図と数式 | 上記の仕組みを説明用に簡略化。公式実装ではない |

    | 小実験 | `run.py` → `papers/_toy_common.py` → `results.json` |

    | 公式コード | このLabでは公式コードとの行単位の照合はしていない。 |'
  method: method.md
question: 行動履歴を長くしても順位付けが良くならないのはなぜか
