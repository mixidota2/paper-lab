core_idea:
  author_claim: '基礎需要の滑らかさと一時変化の疎らさを制約にし、観測系列を説明する分解を求める。販促の応答を表す作用素はデータから推定し、商品間で情報を部分的に共有する。未来は基礎需要の外挿と既知の販促効果を組み合わせる。


    [一次資料：§3.1–3.3 / §4 / Appendix R.6](https://arxiv.org/html/2607.25664)'
  research_bot_interpretation: 低い変動率だけでは良い発注とは判断できない。急増を抑えた結果の欠品が高くつくなら、予測が安定して見えても損失は増える。費用の内訳まで示す点に読む価値がある。
sections:
  overview: '平常時の需要と販促の一時的な動きを分ける。変動を抑える利点はあるが、欠品損失が重い条件では総費用が悪化する。


    このLabでは「予測を滑らかにすると、在庫費用は本当に下がるか」を考える。論文の主張を押さえたうえで、下の図で条件を変え、どこから結論が変わりそうか確かめる。'
  problem: '販促の急増を新しい平常水準だと思うと、販促が終わっても高い予測が残る。一方、全体を滑らかにするだけでは、本当に必要な販促在庫も削ってしまう。


    CDは観測系列を、滑らかな基礎需要と一時的な変化に分解する。販促の効果が何日残るかを表す応答形を使うが、持続が見られない商品にまで長い効果を押し付けない。'
  why_it_might_work: 一時的な増加を平常水準へ混ぜなければ、上流へ不要な変動を伝えずに済むと考えられる。ただし分解は正則化なしには一意に決まらない。販促効果の持続が短いデータでは、複雑な応答形より基礎需要を安定させる部分が効いている可能性がある。
  evidence: 'Abstractと§4の在庫評価は、M5とFavoritaで保管費用/欠品費用が約0.20を超えるときに総費用の優位が出ると報告し、その境界の95%区間を0.17〜0.25とする。業態に共通の閾値ではない。§3.3は、M5で販促後の負の応答は観測上回復されず、応答形の仮定として残ると説明する。


    [一次資料：§3.1–3.3 / §4 / Appendix R.6](https://arxiv.org/html/2607.25664)'
  executable_understanding: '8期の需要に対して、変動を追う在庫と一定の在庫を置く。余剰と不足を実際に数え、費用比を動かして総費用の順位が反転するか確かめる。


    実行：`uv run papers/contextual-deconvolution/run.py`。合成データの作り方と比較条件はコード内に記載し、図の全条件の結果を `results.json` へ保存する。'
  results: 図のスライダーは、同じ実験コードが計算した各条件を表示する。初期条件の値を下表に示す。値の大小を論文モデルの優劣へ読み替えない。
  what_we_verified: '**メカニズム：PARTIAL（部分的）**。確認したのは、このLabで明記した仮定の下での計算と条件による変化。原論文の機構全体を確認した意味ではない。


    8期の需要に対して、変動を追う在庫と一定の在庫を置く。余剰と不足を実際に数え、費用比を動かして総費用の順位が反転するか確かめる。'
  what_we_did_not_verify: 同じ将来カレンダーを比較モデルへ渡すこと、実際の欠品率も見ることが必要。滑らかさの指標は発注分散そのものとは違う。作用素の推定、凸最適化、M5/Favorita、論文の費用境界は再現していない。
  implementation: '標準ライブラリだけで実行できる。入口は各Labの `run.py`、計算本体は `papers/_toy_common.py` にある。関数は論文IDごとに独立し、ブラウザー用の全条件と初期条件の表を同時に出力する。


    意図して省いたもの：分解の推定、販促応答の学習、在庫持越し、論文データ。'
  mapping: '| 対象 | 原典とLabの対応 |

    | --- | --- |

    | 原論文 | [§3.1–3.3 / §4 / Appendix R.6](https://arxiv.org/html/2607.25664) |

    | 処理図 | 上記の仕組みを説明用に簡略化。公式実装ではない |

    | 条件探索 | `run.py` → `papers/_toy_common.py` → `results.json` |

    | 公式コード | このLabでは公式コードとの行単位の照合はしていない。 |'
question: 予測を滑らかにすると、在庫費用は本当に下がるか
interactives:
- kind: flow
  title: 処理と設計の違いを追う
  caption: 段を選ぶと説明が切り替わる。比較側は論点を示す簡略化で、統制実験の実装ではない。
  source: https://arxiv.org/html/2607.25664
  stages:
  - title: 需要を観測する
    baseline: 変動をまとめて学習
    proposed: 平常と一時変化を分ける
    detail: 分解は観測値だけでは一意に決まらず、滑らかさなどの仮定が必要。
  - title: 販促を表現する
    baseline: 当日のフラグだけ
    proposed: 持続時間を含む応答
    detail: 効果が即日で終わる商品では、作用素はほぼ恒等写像へ戻る。
  - title: 未来を組み立てる
    baseline: 一つの系列を外挿
    proposed: 基礎需要と既知の販促を合成
    detail: カレンダーが誤れば一時変化の予測も誤る。
  - title: 在庫を評価する
    baseline: 誤差や変動率を見る
    proposed: 余剰と不足の費用を見る
    detail: 安定化で減る保管費用と、増える欠品費用を同時に計算する。
- kind: explorer
  title: 保管と欠品の費用比を動かす
  caption: 8期の需要に対して、変動を追う在庫と一定の在庫を置く。余剰と不足を実際に数え、費用比を動かして総費用の順位が反転するか確かめる。
