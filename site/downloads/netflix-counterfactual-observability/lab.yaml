core_idea:
  author_claim: 探索時の選択確率を記録し、SNIPSで表示の偏りを補正する。同じ位置の代替候補との比較と、対象を除いたLeave-One-Outを使い分ける。cascade全体の貢献はIrreplaceabilityとUniversalityへ分解する。
  research_bot_interpretation: '[Accuracy Is Not Service](accuracy-not-service-intermittent-demand.html)が予測誤差と発注成果を分けたように、ここでは観測engagementと代替後に失う価値を分ける。[VARG](varg-tmall-value-generative-retrieval.html)や[UNIQUE](unique-baidu-unified-retrieval-ranking.html)のオンライン改善を読む際も、候補経路の採用率だけで増分貢献を判断しない。ただし他社のliftをこの論文の推定量へ換算はできない。'
sections:
  overview: 高CTRの作品でも、ほぼ同じ満足を与える代替があれば除去損失は小さい。逆に、限られた視聴者にだけ届く作品は全体CTRで埋もれても、その視聴者には代えがたい。この論文は制作者に向けた価値評価と、モデル開発者に向けた診断を同じ探索ログから作る。RecSys
    CONSEQUENCES 2026の6ページ論文で、Netflix全体の売上やretentionを新たに改善したA/Bを報告するものではない。
  problem: 観測clickには、内容の質、表示位置、対象者の選び方、候補に入る頻度が混ざる。順位が落ちたためのCTR低下を内容の劣化と受け取ると、制作者も開発者も誤った修正へ向かう。必要なのは「誰に、何が候補として入り、どの確率で選ばれ、何が起きたか」のログである。選択確率がゼロの候補については逆確率重みだけでは反実仮想を回復できない。
  why_it_might_work: 探索が比較対象を観測可能にし、自己正規化が極端な重みの分散を抑える。代替込みの差を取れば、単なる露出の多さと、失うと困る価値を区別しやすい。ただしSNIPSは有限標本で一般に不偏ではない。確率のclipやJaccardによる近似matchにもbias–varianceの交換がある。正しいpropensity、比較可能な報酬、十分なsupportがなければ「因果」という名前だけでは救えない。
  evidence: '[一次資料PDF §4.1–4.3 / Figs. 1–3](https://arxiv.org/pdf/2609.22747v1) の著者報告。


    | 検証 | 条件と結果 | 確かめた範囲 |

    | --- | --- | --- |

    | 単段simulation | 1,000内容、intrinsic CTRはBeta(1,8)/4、Boltzmann温度0.1、閲覧深さPoisson(10) | R1/R2除去の真値とLOOの整合。noise増加で差も増える
    |

    | homepage row除去 | 11件のA/B、R²=0.8212 | 行のincrementalityと実除去によるengagement損失の対応 |

    | 行の推定条件 | Hájek、propensityを[0.0001,0.9999]へclip、行ごと100観測以上 | 長さの違うhomepageを集計 |

    | 監視事例 | content Aだけが急落、類似内容は安定 | positive labelの誤帰属を発見 |


    R²は11件での整合であり、任意の新しいrowや別サービスへの精度保証ではない。Fig. 2の個別座標と元ログは提供されていないため、本Labは散布点を作らず、R²も再計算しない。Fig. 3の時系列も推測で描かない。監視が問題発見につながったことは報告されるが、修正後のengagement回復量や検知率は示されない。'
  executable_understanding: '`uv run papers/netflix-counterfactual-observability/run.py`。2種類の利用者、3候補、各contextで既知の選択確率という人工世界で、ログの単純平均とSNIPSを比較する。Aを除いた後にBへ置き換えるtarget
    policyも同じログで評価する。乱数で作ったBernoulli rewardに加え、確率で厳密に積分した真値を残す。Netflixの1,000内容simulationの再現ではない。


    <figure class="teaching" data-b21><h3>代替困難度と到達範囲を掛ける</h3><label>人工作品 <select><option value="0">狭い対象の作品</option><option
    value="1">広く届く作品</option></select></label><script type="application/json" data-frames>["<div class=\"b21-cards\"><div>候補に入った条件での差<br><strong>0.080<\/strong><\/div><div>×
    候補になる確率<br><strong>0.20<\/strong><\/div><div>＝ 全体の増分<br><strong>0.016<\/strong><\/div><\/div><p>狭い対象の作品。人工例であり、実作品の測定値ではない。<\/p>",
    "<div class=\"b21-cards\"><div>候補に入った条件での差<br><strong>0.030<\/strong><\/div><div>× 候補になる確率<br><strong>0.80<\/strong><\/div><div>＝
    全体の増分<br><strong>0.024<\/strong><\/div><\/div><p>広く届く作品。人工例であり、実作品の測定値ではない。<\/p>"]</script><div data-output><div
    class="b21-cards"><div>候補に入った条件での差<br><strong>0.080</strong></div><div>× 候補になる確率<br><strong>0.20</strong></div><div>＝
    全体の増分<br><strong>0.016</strong></div></div><p>狭い対象の作品。人工例であり、実作品の測定値ではない。</p></div><figcaption>Eq. 2の掛け算を可視化。値はrun.py
    / results.jsonの人工例。A/B散布図の代用品ではない。</figcaption></figure>'
  results: 人工設定では元policyの期待CTRは0.36、A除去後は0.32で、増分は0.04。AのCTRそのものを増分と呼ばない。実行JSONには標本推定の誤差とログの単純平均も保存する。別の人工例では、代替困難度0.08×候補率0.20=0.016、0.03×0.80=0.024となり、代替困難度だけの順序と全体貢献の順序が逆転する。
  what_we_verified: Mechanism PARTIAL。既知の正のpropensityを使う単段・exact matchでSNIPSとLOOを計算し、解析的な期待値と照合した。全contextに同じ重み倍率を掛けてもSNIPSが変わらない局所条件はCONFIRMED。cascadeの掛け算は定義の算術確認にとどまる。
  what_we_did_not_verify: Performance / Scaling / Production applicability NOT TESTED。Netflixログ、11件のA/B、長期retention、位置間干渉、候補集合のJaccard近似、clipの実データ感度は未検証。最小実験でsupportが消えれば推定不能になるが、実システムで十分な探索量をどう維持するかは別課題。
  implementation: '`snips()`はmatch/propensityの自己正規化、`simulate()`は同一ログでfullとLOOを比較する。`exact()`はcontextの確率とreward表から期待値を独立に計算する。学習モデルを置かず、target
    policyを明示することで、選択と測定の違いを確認する。'
