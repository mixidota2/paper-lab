teaching_figures:
- kind: equations
  id: counterfactual-math
  title: 観測報酬から、代替後に失う分へ
  after: method
  locator: §3.1–3.3 / Eq. 1–2 / Appendix 6.2
  rationale: 観測報酬から、代替後に失う分へ
  caption: 一次資料を説明用に再構成。数値は著者報告であり、Labの追試結果ではない。
  steps:
  - name: 1. 対象policyの値
    formula: SNIPS(π) = Σⱼ rⱼ mⱼ/pⱼ ÷ Σⱼ mⱼ/pⱼ
    explanation: pはlogging propensity、mはtargetとのmatch。以下の小実験は0/1のexact match。
  - name: 2. 次善候補で埋める
    formula: Δᵢ = Σₖ wₖ [SNIPS(explore,k) − SNIPS(LOOᵢ,k)]
    explanation: 作品iの報酬だけを引かず、除去したpolicyの報酬を引く。
  - name: 3. 到達範囲を戻す
    formula: Incrementality(i) = Irreplaceability(i) × Universality(i)
    explanation: eligible内での差とeligibleになる頻度を区別する。
  - name: 4. 条件内のHájek差
    formula: Iᵢ = [Σ T r/π ÷ Σ T/π] − [Σ (1−T) r/(1−π) ÷ Σ (1−T)/(1−π)]
    explanation: 和はiが候補に入る標本Eᵢ上。両群を別々に自己正規化する。
  source: https://arxiv.org/pdf/2609.22747v1
