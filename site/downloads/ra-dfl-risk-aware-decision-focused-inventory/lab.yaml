id: ra-dfl-risk-aware-decision-focused-inventory
title: Risk-Aware Decision-Focused Demand Forecasting for Multi-Channel Inventory Optimization under Promotion
  and Stock-Out Constraints
authors:
- Xuguang Zhang
- Yongbin Yang
- Ying Wang
