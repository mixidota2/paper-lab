teaching_figures:
- id: proximal-equations
  kind: equations
  after: method
  title: 配置後の状態に曲率を置く
  source: https://arxiv.org/abs/2609.23242
  locator: Equations (6)–(10); Figures 2–3
  caption: 一次資料の式を説明用に書き直した。下の小実験は限定した条件で対応関係を確かめる。
  rationale: 式の変数と図の操作を結び付ける。
  steps:
  - name: 価値関数
    formula: Vη(x) = Σᵢ fᵢ(xᵢ) + Σℓ hℓ(wℓᵀx) + τΣᵢ φ(xᵢ)
    explanation: 前半が学習する凸PWL残差。後半が強凸な状態potential。主実験はφ(x)=x log x。
  - name: 実行時の配置
    formula: 'min { cᵀz + Vη(I+z) : z≥0, 1ᵀz=B }'
    explanation: 到着量Bを配り、I+zを次の実行の下限にする。図で経路を進むと置いた在庫を戻せない。
  - name: PCSP
    formula: dx*A/dB = H_A⁻¹1_A / (1_AᵀH_A⁻¹1_A);  H_A⁻¹1_A ≥ 0
    explanation: 滑らか・正定値Hessian・固定環境で使う。強凸性だけでは分子の非負性は保証されない。
