- kind: equations
  id: quantile-math
  title: covariateの有無だけを変えて同じcheckpointを読む
  after: method
  locator: Eqs. 1–3 / §5.1.2
  rationale: covariateの有無だけを変えて同じcheckpointを読む
  caption: 一次資料を説明用に再構成。数値は著者報告であり、Labの追試結果ではない。
  steps:
  - name: 条件付き予測
    formula: ŷq = fθ(y₁:T, x₁:T, z₁:T+H)
    explanation: θを固定してx/zを落とした対照と比べる。
  - name: causalな入力と固定教師
    formula: ỹt = asinh((yt−μt)/σt), ỹT+h = asinh((yT+h−μT)/σT)
    explanation: future targetの値で正規化統計を更新しない。
  - name: 順序を保つ分位点
    formula: q̂k+1 = q̂k + softplus(rk+1)
    explanation: 正の差分を足す。calibrationまで保証する式ではない。
  - name: skill
    formula: Skill = 100 × [1 − exp(mean(log(clip(Lmodel/Lseasonal-naive,0.01,100))))]
    explanation: Lはtaskのscaled quantile loss。seasonal naive比をtask間で幾何平均する。
  source: https://arxiv.org/pdf/2609.24559v1
