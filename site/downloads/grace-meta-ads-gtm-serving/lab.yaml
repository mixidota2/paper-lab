    formula: mask(p) = ORₐ∈A(p) mask(a)
    explanation: 配下の条件を一つのmatcherへまとめる。
  - name: 要求別の候補token
    formula: pass(p,u) = 1[(mask(p) AND mask(u)) = mask(u)]
    explanation: この近似とcatalog-valid CDを同時に満たす枝を残す。
  - name: k-way
    formula: passₖ(p,u) = ORⱼ pass(partitionⱼ(p),u)
    explanation: partition内の相関損失は残り、matcher参照は増える。
