core_idea:
  author_claim: Generative Target Matching（GTM）はSID prefixへ広告のtargeting条件をまとめ、request別maskをconstrained
    decodingへ加える。別に広いbeamと短い系列向けのGPU kernelを最適化する。
  research_bot_interpretation: '[STATIC](static-constrained-gr.html)がカタログ内で成立するSID
    pathを高速に判定し、[FlashTrie](flashtrie-gpu-beam.html)がTrie制約とbeam処理のGPU効率を問うのに対し、GRACEは「そのrequestで配信可能か」を追加する。合法性・適格性・計算効率を別々の検証項目にできる。'
sections:
  overview: 生成した広告が存在していても、地域や年齢など広告主の条件を満たすとは限らない。後から大半を捨てるとbeam枠を浪費する。GRACEは広告の条件をSIDの途中prefixへ集約し、配信できそうな枝にbeamを使う。集約は保守的な近似なので、最終広告単位の検査を残す。
  problem: カタログのvalidityは「SIDが広告へ戻るか」、eligibilityは「今回のuser/requestが広告の条件を満たすか」。後者は要求ごとに変わる。prefixに複数広告を集約すると属性間の相関が失われ、各属性の条件を満たす広告が別々に存在するだけでもprefixが通る。この偽陽性を管理しつつ、広いbeamを低遅延で処理するのが問題となる。
  why_it_might_work: '解釈: 完全に不適格な枝を早く落とせば、同じbeam数でも最終検査を通る候補へ探索資源を使える。bitmaskとBloomはpacked演算に向く。一方、集約ORが飽和すると枝刈りは効かず、細かく分割するとmatcher参照が増える。低いmask
    fill率だけを最適化しても、全体のpass率やlatencyがよくなるとは限らない。'
  evidence: '一次資料 [PDF §6、Tables 2–6](https://arxiv.org/pdf/2608.00938v1) の著者報告。CD
    onlyからCD+GTMへ、全requestの最終ad-level pass率は23.55→40.42%（+16.87 pp）。これは広告のengagementや売上のA/Bではない。


    Table 6はNVIDIA GH200、batch 16のP50/P99。固定beam (1,1024,1024,1024)でdecoder P99 197.7→17.8
    ms、所要時間は約1/11.1。full model P99は220.1→40.5 ms。この行には完全なGTM費用は入っていない。


    動的beam (1,512,1024,1024)へ移し、lookup・CD・bitmask・Bloomを含めたD3はdecoder P50/P99 25.0/27.3
    ms、full model 51.0/53.6 ms。したがって「GTM込みdecoderが17.8 ms」とは書けない。cross-attentionはFA3比68.0倍、self-attentionは強いbaseline比23.4〜25.8倍というkernel測定で、サービス全体の倍率ではない。


    static k-wayはmaskの飽和を減らしても、未分割CD+GTMを最終pass率で上回らなかった。細分化の追加照会費用もあり、著者は未分割を運用点として選ぶ。'
  executable_understanding: '`uv run papers/grace-meta-ads-gtm-serving/run.py`。4広告の国×年齢条件をprefixでORし、属性相関による偽陽性と最終広告検査の必要性を確かめる。同じscore・beam
    2でCD onlyとGTMを比較。8-bitに縮小したBloomではhash偽陽性も観測する。'
  results: 人工例でCD onlyは上位2prefixを取り、exact検査後の適格広告は0。GTMは明らかに不適格な枝を除き、適格広告cを含むprefixへ枠を使って1広告が残る。US若年とCA成人のORはUS成人requestを通すが、その混合prefixのexact結果は空。GTMが最終判定を置換しないことが分かる。
  what_we_verified: Mechanism PARTIAL。人工4要求で、適格広告を持つprefixがOR検査を通ることはCONFIRMED。属性相関の偽陽性、Bloomの偽陽性、同一beamの枠再配分を実行した。
  what_we_did_not_verify: Performance / Scaling / Production applicability NOT TESTED。GH200
    kernel、KV cache、production targeting全条件、実pass率、広告A/Bは未実行。CPUの4広告を23.55→40.42%の再現とは呼ばない。
  implementation: '`match()`はpacked subset検査、`union()`はprefixへのOR、`bloom()`は固定SHA-256由来の3
    hash位置を持つ説明用実装。論文の実Bloom hash設計を復元したものではない。exact検査はこのLabの国・年齢属性に限定する。'
