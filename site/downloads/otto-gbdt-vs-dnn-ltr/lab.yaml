question: 本番の木モデルを超えるために、ランキングを複雑にする必要はあるか
summary: OTTOではTwo-Tower＋CEが本番LambdaMARTを上回った。8週間のA/Bでクリックは1.86%、売上は0.56%増え、販売点数は同水準だった。候補同士を比較するTransformerは、オフラインの注文指標で不利だった。
