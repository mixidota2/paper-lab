  steps:
  - name: 最適化対象・式1
    formula: M* = argmax M∈ℳ f(M,𝒟)
    explanation: 評価が高価なので全構成は試せない。
  - name: 知識に条件付けた探索・式2
    formula: Mₜ ← π(𝒦ₜ, {M₁,…,Mₜ₋₁})
    explanation: πは論文の抽象表現。特定の強化学習algorithmが実装されたという意味ではない。
  - name: 採択・Algorithm 1 line 20
    formula: γ(ΦNS) > τ + ε  ∧  γ(ΦAux) ≥ Threshold
    explanation: 採択時にM*とτを更新し、VCS_Commit()とLog KEEP。事前検証失敗、job失敗、条件未達はVCS_Rollback()。
  - name: 候補数の効果・Labの導出
    formula: rank = 1 + Σⱼ 𝟙[sⱼ ≥ s⁺]; NDCG@K = 𝟙[rank ≤ K] / log₂(rank+1)
    explanation: 正例1件の合成評価。負例を除くだけでrankは悪化しない。これは原論文の番号付き式ではない。
