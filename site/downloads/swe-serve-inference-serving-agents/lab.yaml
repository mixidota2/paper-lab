question: 局所テストを通った変更は、推論サーバーでも動くか
summary: SGLangの53課題で、局所的に動く変更がサーバー全体でも動くかを測る。E2E対象19課題では、同じパッチの採点からE2Eを外すと成功率が45.9%から69.4%へ上がった。
