- kind: equations
  id: paired-resolution
  title: 課題の反転と、成功率の差は別の量
  after: why_it_might_work
  locator: Table 1 / Appendix F
  caption: 反転率から検出力を計算し、等価性は別の許容幅で判定する。
  source: https://arxiv.org/pdf/2610.04433v1
  rationale: 反転率から検出力を計算し、等価性は別の許容幅で判定する。
  steps:
  - name: 反転する課題
    formula: q = (b+c)/n
    explanation: Aだけ成功b、Bだけ成功c。反転が多くても差が相殺される。
  - name: 成功率の差
    formula: Δ = (b−c)/n
    explanation: 例：b=26,c=34,n=445なら−1.8ポイント。
  - name: 等価性
    formula: 90% CI ⊂ [−5,+5] pp
    explanation: Qwen3.6 CC−miniは[−4.7,+1.1]。ゼロ差を証明した意味ではない。
