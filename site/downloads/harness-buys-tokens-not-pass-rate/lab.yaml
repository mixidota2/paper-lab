summary: Worth Reading：harnessの差を、同じ構成の再実行の差と並べる。 SWE-bench Verifiedのhard45では、成否が入れ替わる課題の割合は再実行もharness交換も中央値13%。モデル交換は約22%だった。pool447の2つのQwenモデルでは、Claude
  Codeとmini-SWE-agentの差は±5ポイント内で等価と判定された。
question: その得点差は、再実行の揺れより大きいか
