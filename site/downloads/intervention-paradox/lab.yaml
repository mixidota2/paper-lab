core_idea:
  author_claim: 著者は失敗率p、失敗から回復する率r、成功を壊す率dをpilotで推定し、p > d/(r+d)を介入導入の判断に使う。50タスクのALFWorld
    pilotで改善方向を予測し、202タスクの評価で小幅な改善を報告した。
  research_bot_interpretation: AUROCは失敗の順序づけを評価するが、警告や巻き戻しを受けたモデルがどう振る舞うかは測らない。pilotの主目的を「介入しない方がよい条件を見つける」と置く点が有用だ。ただし同じデータから計算した式の一致は会計恒等式で、別の分布への予測能力をそれだけで証明しない。
sections:
  overview: Writerの研究は、失敗予測のAUROCが約0.94でも実行途中の介入が有害になり得ると示す。必要なのは救えた失敗と壊した成功の対応比較だ。MiniMax-M2.1のHotPotQAでは64%→38%（−26ポイント）、Qwen-3-8BのALFWorldでは5.8%→8.6%（+2.8ポイント）。いずれもベンチマーク実験で、稼働中の製品全体の成功率ではない。
  problem: '予測器が「この行動は失敗につながる」と正しく警告しても、agentが修正に成功するとは限らない。正解へ進んでいた実行が警告で迷い、検索や再試行を繰り返す場合もある。したがって、失敗を見抜く能力と介入後の成功率を別々に測る必要がある。


    同じ初期条件のtaskで、介入なし・ありの二つを実行する。途中の警告数ではなく、最終成功の組を数える。比較対象はsmolagents上のHotPotQA、GAIA、ALFWorldで、業務fleetへの無作為割付ではない。'
  why_it_might_work: 失敗が多い環境では救える軌跡の母数が大きく、成功が多い環境では壊し得る軌跡の母数が大きい。rとdだけを比べず、それぞれに失敗率pと成功率1−pを掛けると、どちらが最終件数を支配するかが分かる。高精度なcriticでも、この母数とagentの反応を飛ばして導入可否は決められない。
  evidence: '### 0.94は1,372個のheld-out sample上の識別性能


    Qwen3-0.6B＋LoRA rank 16のcriticを、HotPotQA/GAIAの7,636 trajectory stepsで学習する。最終taskの成功・失敗を各軌跡の教師に使い、task単位で158/19/21にtrain/validation/testを分ける。表1の総合AUROCは0.936、F1は0.963（held-out
    1,372 samples）。0.94は丸めた値であり、50タスクpilotの成績ではない。


    ### −26ポイントはMiniMax、+2.8ポイントはQwenの別条件


    表4のHotPotQA 100タスクではMiniMax-M2.1が64.0%から非較正ROLLBACKの38.0%へ下がる。GLM-4.7の同条件は70.3%→70.3%。GAIAは30タスクで、MiniMaxの最良介入でも46.7%→16.7%（−30ポイント）。モデルにより反応は大きく違う。


    ALFWorldは202タスク×3 seeds。Qwen-3-8Bの非較正APPENDが5.8%→8.6%、+2.8ポイント、本文報告p=0.014。paired
    task bootstrapを10,000回行い、介入条件間の多重比較にはHolm–Bonferroniを使うと付録Cに記す。ただしこのp値の補正状態は明確でなく、検出可能幅約±4ポイントに近い改善として著者も方向性の証拠に留める。


    ### 50タスクpilotの率を、本評価の率へ置き換えない


    pilotはQwenで成功10.7%±1.9%、p≈89%、r≈12%、d≈56%、p*≈82%と報告。202タスク評価のbaseline 5.8%とは別の集計である。単一の50タスクから10.7%が出る集計の詳細も十分でない。criticはALFWorld軌跡で学習していないが、温度較正には同domainのvalidationを使う。[一次資料
    §3–4、付録A/C](https://arxiv.org/pdf/2602.03338v1)'
  executable_understanding: 'A/B/C/Dの小さい整数組を列挙し、直接の成功率差(C−B)/Nとp r−(1−p)dが一致するか検証する。操作図ではr=0.12、d=0.56を固定し、baseline失敗率pだけを動かす。さらに、この既知の確率から50タスクのpilotを2,000回生成し、有限標本で判断が揺れる程度を見る。AUROCやLLMの振る舞いは生成しない。


    <div class="paper-probe teaching" data-paper-probe="intervention-paradox"><h3>失敗率pと、介入の損益分岐点</h3><p>r=12%、d=56%を固定した感度分析。p*は82.35%。criticのaction閾値τを調節する操作ではない。</p><label>介入なしの失敗率p：<output
    data-p-value>89%</output><input data-failure type="range" min="0" max="100" value="89"
    step="1"></label>

    <div class="threshold-track" aria-hidden="true"><span style="left:82.352941%">p*</span><i
    data-p-marker style="left:89%"></i></div><div data-probe-output aria-live="polite"><p>初期値：100タスク当たり回復10.68、破壊6.16、差分+4.52ポイント。有限標本での安全保証ではない。</p></div><script
