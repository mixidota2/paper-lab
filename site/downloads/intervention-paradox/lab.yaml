question: 介入の逆説：失敗を当てても、止めるほど成功が減ることがある
summary: Writerの研究は、失敗予測のAUROCが約0.94でも実行途中の介入が有害になり得ると示す。必要なのは救えた失敗と壊した成功の対応比較だ。MiniMax-M2.1のHotPotQAでは64%→38%（−26ポイント）、Qwen-3-8BのALFWorldでは5.8%→8.6%（+2.8ポイント）。いずれもベンチマーク実験で、稼働中の製品全体の成功率ではない。
source_review:
  checked: '2026-09-15'
  scope: 一次PDF v1の本文・全付録を確認。著者報告と合成実験を分離。
  pdf_sha256: a931d7be1fd2904ba11264008e135511376446530503d0635e34d6dc6bc9c3f4
