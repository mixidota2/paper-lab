  results: 恒等式の最大誤差は2.23×10⁻¹⁶未満。仮定したp=0.89、r=0.12、d=0.56では真の成功率差は+4.52ポイントだが、50タスクpilotで観測差が正だったのは73.0%。観測差の経験的2.5〜97.5
    percentileは−6〜+16ポイント。0.35%では条件付き率または閾値を推定できなかった。この範囲は論文の信頼区間ではない。
  what_we_verified: 対応した最終結果の数え方と閾値を計算し、全成功・全失敗・変化ゼロの境界を分けた。合成pilotで、正の期待効果があっても50タスクでは導入判断を誤り得ることを確かめた。
  what_we_did_not_verify: criticの学習、AUROC、LoRA、温度較正、ROLLBACKの環境復元、APPENDの実際のLLM反応、論文p値は未再現。50タスクで安全を保証する手法ではない。domain移行時にr/dを持ち越せるか、AgentTether等の複雑な修復でも同じ率になるかは未検証。
  method: method.md
  mapping: mapping.md
  implementation: '`uv run papers/intervention-paradox/run.py` をリポジトリのルートで実行する。Python標準ライブラリのみを使い、CPUで完了する。結果はコードと同じ場所の
    `results.json` に保存する。乱数を使う箇所はseedを固定した。ダウンロードしたrun.pyも単体で動く。'
teaching_figures:
- kind: equations
  id: intervention-accounting
  title: 回復の利益から、壊した成功を引く
  after: method
  locator: §1 式1–4
  caption: 記号を分けて、どの量を学習・計算するかを追う。
  rationale: 記号を分けて、どの量を学習・計算するかを追う。
  steps:
  - name: 失敗側
    formula: p = (A+C)/N, r = C/(A+C)
    explanation: 介入なしで失敗したtaskのうち何割を救ったか。
  - name: 成功側
    formula: d = B/(B+D)
    explanation: 介入なしなら成功したtaskのうち何割を壊したか。
  - name: 差分
    formula: ΔSuccess = p r − (1−p)d = (C−B)/N
    explanation: 両方成功・両方失敗は差分から消える。
  - name: 境界
    formula: p* = d/(r+d), 改善条件 p > p*
    explanation: r+d=0なら差分0で閾値未定義。F=0またはS=0なら対応する条件付き率は推定不能。
  source: https://arxiv.org/pdf/2602.03338v1
- kind: matrix
  id: paired-outcomes
  title: 同じtaskを介入なし・ありで比べる
  after: problem
  locator: §1・付録D
  caption: 表の1件は最終task結果の対応組。途中の介入回数を入れない。
  rationale: 表の1件は最終task結果の対応組。途中の介入回数を入れない。
  columns:
  - 介入あり：失敗
  - 介入あり：成功
  rows:
  - label: 介入なし：失敗
    cells:
    - A：失敗のまま
    - C：回復
  - label: 介入なし：成功
    cells:
    - B：破壊
    - D：成功のまま
  source: https://arxiv.org/pdf/2602.03338v1
- kind: logic
  id: pilot-gate
  title: 50タスクは判断の出発点で、安全の保証ではない
  after: executable_understanding
  locator: 図1・§7–8
  caption: 著者のpilot手順を再構成。不確かなら追加検証する分岐はLabの運用上の解釈。
  rationale: 著者のpilot手順を再構成。不確かなら追加検証する分岐はLabの運用上の解釈。
  rows:
  - label: 1 対応比較
    nodes:
    - title: 同じdomain・モデル・介入
      text: 50〜100 taskを介入あり/なしで実行し、A/B/C/Dを数える。
  - label: 2 推定できるか
    nodes:
    - title: 成功側か失敗側が空
      text: rかdを推定できない。効果差は数えられるが閾値には外挿しない。
    - title: 両側の観測がある
      text: p、r、d、p*と不確かさを計算する。
  - label: 3 判定
    nodes:
    - title: p ≤ p* / 差が不確か
      text: 常時介入を見送り、追加pilotや完了後の選択を検討する。
    - title: p > p* + 安全余裕
      text: 限定した条件で検証を進める。余裕の普遍的な値は論文にない。
  source: https://arxiv.org/pdf/2602.03338v1
