core_idea:
  author_claim: '著者はGAIAの検証用問題で、モデルを固定しても実行手順により正答率が変わると報告する。計画と評価を分ける利点は一様でなく、難しい問題における複数役割の優位はAnthropic系列で観測され、他社モデルにはそのまま広がらない。強いモデルほど手順の影響が小さくなる、という事前の予想も支持されなかった。


    [一次資料：§3.3 / §3.6 / §4.1.3 / §6](https://arxiv.org/html/2606.08529)'
  research_bot_interpretation: モデルを購入・採用するときは、普段使うツールと回復手順を含めて評価したい。ただし「人数を増やせば改善する」と結論づけるのは早い。役割分担、プロンプト、検索手段、失敗処理がまとめて変わっているため、効いた部品は追加実験で切り分ける必要がある。
sections:
  overview: 'GAIAの成績はモデルと実行手順の組合せで変わる。複数役割に分ける効果も、モデルの系列や問題の難しさに左右される。


    このLabでは「モデルが同じでも、仕事の進め方で成績はどこまで変わるか」を考える。論文の主張を押さえたうえで、下の図で条件を変え、どこから結論が変わりそうか確かめる。'
  problem: 'エージェントは回答文を作るだけでなく、検索し、ファイルを読み、失敗した操作をやり直す。その進め方を決める外側の仕組みを、この論文ではscaffoldと呼ぶ。異なる仕組みで測った成績をそのまま比べると、モデルの差と実行環境の差が混ざる。


    比較対象は、考える・動くを交互に繰り返すReAct、計画・実行・採点の3役を持つPAR、先に計画を書いてから実行する方式。ただしReActと他方式ではツールの構成まで完全には同じでない。この差は結論を読む際に残る。'
  why_it_might_work: 途中の失敗を評価役が発見し、必要な操作だけやり直せれば、最初の誤りを最終回答まで引きずらずに済む。一方、評価役も誤るし、毎回の確認には費用がかかる。下の実験は「回復機会を増やすと何が変わるか」に絞り、役割の優劣は仮定しない。
  evidence: '§3.5–3.6は3方式×5モデル、各問題3試行の計画と未完了試行を記載する。§4.1.3の最大28ポイント差はOpusのLevel 2で、特定のSDK不具合を除いたrobust集計。全条件の平均改善ではない。§6にはツール差、公開された検証問題、未実施の非公開テストなどの制約がある。


    [一次資料：§3.3 / §3.6 / §4.1.3 / §6](https://arxiv.org/html/2606.08529)'
  executable_understanding: '同じ60件の人工タスクに、初回から成功するものと数回失敗するものを置く。再試行上限を変え、完了件数と呼出し回数を数える。


    実行：`uv run papers/scaffold-effects-gaia/run.py`。合成データの作り方と比較条件はコード内に記載し、図の全条件の結果を `results.json` へ保存する。'
  results: 図のスライダーは、同じ実験コードが計算した各条件を表示する。初期条件の値を下表に示す。値の大小を論文モデルの優劣へ読み替えない。
  what_we_verified: '**メカニズム：PARTIAL（部分的）**。確認したのは、このLabで明記した仮定の下での計算と条件による変化。原論文の機構全体を確認した意味ではない。


    同じ60件の人工タスクに、初回から成功するものと数回失敗するものを置く。再試行上限を変え、完了件数と呼出し回数を数える。'
  what_we_did_not_verify: ツールの種類をそろえた比較と、誤りからの回復だけを無効化する比較が必要。再試行が多いほど課金も増えるため、正答率だけでなく正解1件あたりの費用を見る。今回、GAIA・LLM呼出し・統計的な信頼区間は再現していない。
  implementation: '標準ライブラリだけで実行できる。入口は各Labの `run.py`、計算本体は `papers/_toy_common.py` にある。関数は論文IDごとに独立し、ブラウザー用の全条件と初期条件の表を同時に出力する。


    意図して省いたもの：LLM、GAIA、PARのプロンプト、外部ツール。'
  mapping: '| 対象 | 原典とLabの対応 |

    | --- | --- |

    | 原論文 | [§3.3 / §3.6 / §4.1.3 / §6](https://arxiv.org/html/2606.08529) |

    | 処理図 | 上記の仕組みを説明用に簡略化。公式実装ではない |

    | 条件探索 | `run.py` → `papers/_toy_common.py` → `results.json` |

    | 公式コード | このLabでは公式コードとの行単位の照合はしていない。 |'
question: モデルが同じでも、仕事の進め方で成績はどこまで変わるか
interactives:
- kind: flow
  title: 処理と設計の違いを追う
  caption: 段を選ぶと説明が切り替わる。比較側は論点を示す簡略化で、統制実験の実装ではない。
  source: https://arxiv.org/html/2606.08529
  stages:
  - title: 問題を受け取る
    baseline: その場で次の操作を考える
    proposed: 計画を明示する
    detail: まず必要な資料と作業順を決める。計画の品質自体は保証されない。
  - title: 操作する
    baseline: 単一のループで実行
    proposed: 実行役が操作
    detail: ツールの応答が期待と違うとき、作業を止めて確認できるかが分岐点。
  - title: 失敗を見つける
    baseline: 次の推論に任せる
    proposed: 評価役が点検
    detail: PARの評価役は完了か修正かを判断する。これは研究の役割構成の説明。
  - title: 回答を確定する
    baseline: 回答を提出
    proposed: 修正後に提出
    detail: 評価基準を満たす回答だけを正解とする。途中の説明の長さは正解の代用にならない。
- kind: explorer
  title: 回復の予算と完了件数
  caption: 同じ60件の人工タスクに、初回から成功するものと数回失敗するものを置く。再試行上限を変え、完了件数と呼出し回数を数える。
