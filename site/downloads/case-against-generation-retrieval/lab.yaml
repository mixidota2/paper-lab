core_idea:
  author_claim: 'ユーザーと商品を同時に読むCross-Encoderを教師にし、その候補間の好みをTwo-Towerへ学習させる。教師は関連性のYes/No判定と商品テキストの予測で訓練する。生徒は共有エンコーダーと文末位置の表現を使い、ユーザー側には潜在表現による追加推論も入れる。推論時の商品ベクトルは事前計算のまま保つ。


    [一次資料：§4 / §5 / §6 / §7.2](https://arxiv.org/html/2607.25346)'
  research_bot_interpretation: この研究が示す選択肢は、豊かな意味理解と索引検索を組み合わせること。生成推薦全体への決着とは読まない。教師が高性能でも、その順位を生徒が完全には保持できず、索引更新の遅れも残る。
sections:
  overview: '言語モデルをユーザーと商品の表現作りに使い、検索はベクトル索引に任せる。重い教師の判断を、軽い検索経路へ移す設計。


    このLabでは「言語モデルの知識を使うために、商品IDまで生成する必要はあるか」を考える。論文の主張を押さえたうえで、下の図で条件を変え、どこから結論が変わりそうか確かめる。'
  problem: '数百万件の商品から候補を選ぶ段階では、候補ごとに言語モデルを動かす費用を払えない。商品IDを順番に生成する方式には、途中の枝選択や実在商品との対応付けという別の課題もある。


    Two-Towerは、ユーザーと商品を別々にベクトルへ変換して近いものを探す。商品側を事前計算できるため、利用者が来るたびに全商品を言語モデルへ入力せずに済む。'
  why_it_might_work: 教師はユーザーと商品を直接照合できるので、単純な内積では見えにくい関連性を教えられる。生徒へ移せた分だけ検索品質が上がると考えられるが、圧縮には限界がある。狭い候補集合上の蒸留と、全商品からの候補生成を同じ評価にしないことが大切。
  evidence: '§7.2.1では、生徒が本番DLRMの正規化エントロピー（NE）と同程度に達するのに使った学習データは0.5%と報告する。NEは小さいほどよい予測損失で、クリック率の改善幅ではない。§7.2.2の古いモデルへの耐性は主に教師CEの結果であり、生徒TTの結果へ読み替えない。公開データの比較は§6、運用経路は§5。


    [一次資料：§4 / §5 / §6 / §7.2](https://arxiv.org/html/2607.25346)'
  executable_understanding: '16候補を4つの枝に分け、全候補の最高点と、枝の平均点で絞ってから選ぶ最高点を比べる。枝幅を増やすと取り逃しと探索量がどう変わるかを計算する。


    実行：`uv run papers/case-against-generation-retrieval/run.py`。合成データの作り方と比較条件はコード内に記載し、図の全条件の結果を `results.json` へ保存する。'
  results: 図のスライダーは、同じ実験コードが計算した各条件を表示する。初期条件の値を下表に示す。値の大小を論文モデルの優劣へ読み替えない。
  what_we_verified: '**メカニズム：PARTIAL（部分的）**。確認したのは、このLabで明記した仮定の下での計算と条件による変化。原論文の機構全体を確認した意味ではない。


    16候補を4つの枝に分け、全候補の最高点と、枝の平均点で絞ってから選ぶ最高点を比べる。枝幅を増やすと取り逃しと探索量がどう変わるかを計算する。'
  what_we_did_not_verify: 同じ商品集合、更新頻度、応答時間上限で生成検索と比較したい。公開ベンチマークの教師の成績と、生徒を本番で動かす結果は分けて見る。事前学習の費用は0.5%という学習データ比に含まれるとは限らない。
  implementation: '標準ライブラリだけで実行できる。入口は各Labの `run.py`、計算本体は `papers/_toy_common.py` にある。関数は論文IDごとに独立し、ブラウザー用の全条件と初期条件の表を同時に出力する。


    意図して省いたもの：言語モデル、学習、蒸留、近似近傍索引、実測の応答時間。'
  mapping: '| 対象 | 原典とLabの対応 |

    | --- | --- |

    | 原論文 | [§4 / §5 / §6 / §7.2](https://arxiv.org/html/2607.25346) |

    | 処理図 | 上記の仕組みを説明用に簡略化。公式実装ではない |

    | 条件探索 | `run.py` → `papers/_toy_common.py` → `results.json` |

    | 公式コード | このLabでは公式コードとの行単位の照合はしていない。 |'
question: 言語モデルの知識を使うために、商品IDまで生成する必要はあるか
interactives:
- kind: flow
  title: 処理と設計の違いを追う
  caption: 段を選ぶと説明が切り替わる。比較側は論点を示す簡略化で、統制実験の実装ではない。
  source: https://arxiv.org/html/2607.25346
  stages:
  - title: 学習用の入力
    baseline: ID系列を学ぶ
    proposed: ユーザーと商品を教師が照合
    detail: 教師は両者の情報を一緒に読めるが、全候補に適用するには重い。
  - title: 知識を圧縮する
    baseline: 次のIDを予測
    proposed: 教師の順位を生徒へ蒸留
    detail: 候補集合上のスコア分布を近づける。教師と生徒の表現力は同じではない。
  - title: 商品を準備する
    baseline: IDと商品を対応付ける
    proposed: 商品ベクトルを事前計算
    detail: 索引に実在商品を登録する。新商品・削除商品への更新は別途必要。
  - title: 候補を取り出す
    baseline: IDの枝を順に選ぶ
    proposed: ユーザーベクトルから近傍検索
    detail: 生成の枝選択と索引検索は異なる経路。どちらも候補の取り逃しは起こり得る。
- kind: explorer
  title: 枝を絞ると、最良候補を落とすか
  caption: 16候補を4つの枝に分け、全候補の最高点と、枝の平均点で絞ってから選ぶ最高点を比べる。枝幅を増やすと取り逃しと探索量がどう変わるかを計算する。
