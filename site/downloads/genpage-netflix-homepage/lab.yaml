core_idea:
  author_claim: 著者は、文脈とホーム全体をtoken列へ変換すれば、個別のランキングモデル群を一つのTransformerへ集約できると主張する。WBCで即時の作品価値を学び、将来はRLでページ全体の価値を最適化する（§4–6）。
  research_bot_interpretation: このオンライン結果の焦点は、候補集合内の選択とレイアウトの統合にある。学習目的がWBCなら、出力を逐次生成していても目的関数はtoken単位だ。ページ相互作用を直接最適化したRLの成果として+0.24%を扱わない。
sections:
  problem: 'Netflixのホームでは、作品単体の良さに加え、どの行を先に置くか、同じ作品が重複しないか、直前の行で視聴が始まるかが効く。行と作品を別々に評価する多段構成では、各段の目的が揃わず、特徴計算も重くなる。GenPageはこの組み立てを一つの系列予測へ寄せる。


    ただし「end-to-end」の範囲が重要だ。§8のA/Bでは既存productionのrow/entity候補集合を引き継ぐ。候補の適格性判断には依然として外側の仕組みがある。Gryphon型のopen-catalog
    SID生成を唯一のcandidate generatorにした試験、と読み替えられない。'
  evidence: '### 14日A/B：最良variantとその区間


    §8・図6。約200MのWBCを成熟したproductionホーム推薦と比較した。5 variantsは負例量や学習impressionの選別が異なる。全variantでp<0.001、最良variantは相対+0.24%、95%
    CI [0.17%, 0.30%]。図は14日間の推移だが、このLabでは日次点を推測して描かず、最終値だけを使う。主指標はlaunch判断に使うcore engagementで、詳細な定義、割付比率、ユーザー数は開示されない。


    遅延−20%はbaseline比のend-to-end serving latency。mask単体の高速化率やGPU kernelの時間ではない。著者はランキング段数と特徴計算の削減、tokenization、hybrid
    decodeを理由に挙げるが、各要因の寄与を分離したオンライン試験ではない。


    ### 事前学習と文脈の効果は比較条件を読む


    表1では事前学習あり/なしのWBC lossが0.321/0.333、row AUC 0.884/0.879、entity AUC 0.920/0.910。図3–4の容量と文脈の比較は同一snapshotの一つの実験ではなく、文脈側は段階ごとの相対改善を累積している。RLの多様性上昇（図5）はオフライン。作品カテゴリの露出配分にも意図しない変化があり、著者自身が調査課題としている。


    <figure class="teaching batch17"><h3>14日目の相対liftと95% CI</h3><div class="b17-ci" role="img" aria-label="最良variantの相対lift0.24%、95%信頼区間0.17から0.30%。0から0.35%の軸"><span
    class="b17-ci-range"></span><span class="b17-ci-point">●</span></div><div class="b17-ci-labels"><span>0%</span><strong>0.24%
    [0.17, 0.30]</strong><span>0.35%</span></div><p>最良variant / p&lt;0.001 / baseline＝productionホーム推薦</p><figcaption>§8・図6の最終値。5
    variantsの日次点は復元していない。横棒は95% CIで、個々の利用者の効果分布ではない。</figcaption></figure>


    [一次資料：版を固定したPDF](https://arxiv.org/pdf/2606.31031v2)。図表の箇所とSHA-256は末尾の対応表を参照。'
  overview: 'GenPageは行と作品の並びをdecoder-only Transformerで生成する。オンラインで試した約200MのWBCモデルは、既存の行・作品候補集合を使う。14日A/Bの最良variantで主指標+0.24%、end-to-end遅延−20%。候補生成まで全面置換した証拠とは分けて読む。


    <figure class="teaching batch17"><h3>既存pipelineを、どこまで一つに畳むか</h3><div class="b17-cards"><div><strong>既存の候補集合</strong><p>行・作品の適格性と候補生成を継承する。ここがonline試験の外側の境界。</p></div><div><strong>GenPage
    約200M / WBC</strong><p>promptと既出ページを読む → 行を選ぶ → 先頭作品を逐次生成 → 行末をまとめて選ぶ。</p></div><div><strong>配信するホーム</strong><p>重複・位置固定・カテゴリ制約を適用した行の並び。次のpaginationは直近反応を含む。</p></div></div><details><summary>promptの中身を開く</summary><div
    class="b17-cards"><div><strong>履歴</strong><p>作品ID / 行動 / 時間bucket / 継続時間bucket</p></div><div><strong>profile・request</strong><p>言語
    / kids・adult / device / 時間帯</p></div><div><strong>既出のページ</strong><p>直前の行と作品、最新の反応</p></div></div></details><figcaption>§2・図1、§6.3–4、§8をもとにした説明図。GryphonのSID候補生成を組み込んだ図ではない。</figcaption></figure>'
  why_it_might_work: '【解釈】先に選んだ行・作品が次の予測に入るため、独立したスコアの足し算より文脈を使いやすい。作品と行を各1 tokenにすれば、業務制約をlogit maskに直結できる。モデルを大きくする前に文脈を豊かにするという観察も、この情報不足の説明と整合する。


    一方、WBCは露出ログと内部reward systemを受け継ぐ。ランダム負例は未露出作品の過大評価を抑えるが、人気への事前バイアスも入る。RLのオフライン報酬上昇は、学習に使ったreward modelで評価しているため独立した裏付けには弱い。'
  method: method.md
  executable_understanding: '2行×3作品の人工ホームに候補外の高score作品を置く。同じscore関数で無制約、全逐次、先頭1件のみ逐次、行全体一括を比較する。Aを選ぶとCのscoreが上がる設定により、行内条件付けが変わる場面を作る。forward回数は計算手順の数で、20%の遅延再現ではない。


    <figure class="teaching batch17"><h3>同じscoreで生成手順を変える</h3><div class="matrix-scroll" tabindex="0" role="region"
    aria-label="比較表"><table><thead><tr><th>設定</th><th>行ごとの作品</th><th>forward回数</th><th>候補違反</th></tr></thead><tbody><tr><td>無制約</td><td>OUT,OUT,OUT
    / OUT,OUT,OUT</td><td>8</td><td>6</td></tr><tr><td>全逐次</td><td>A,C,B / D,E,F</td><td>8</td><td>0</td></tr><tr><td>先頭1件のみ逐次</td><td>A,C,B
    / D,E,F</td><td>6</td><td>0</td></tr><tr><td>行全体を一括</td><td>A,B,C / D,E,F</td><td>4</td><td>0</td></tr></tbody></table></div><figcaption>run.pyの実行結果。OUTは候補外の人工作品。回数の削減を実測遅延の削減率には換算しない。</figcaption></figure>'
