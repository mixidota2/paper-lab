- kind: equations
  id: dr-residual
  title: 予測を残差で補正し、方策は別に選ぶ
  caption: 式は切り詰め前。e は発火確率、y は実際の割当、m は観測結果であり、推薦しなかったリクエストでは μ₀の誤差、推薦したリクエストでは μ₁の誤差だけを補正に使う。
  source: https://arxiv.org/abs/2607.14161
  locator: Eqs. 3–10; §3.1
  rationale: DR 学習と SV 配信の違いを明示する。
  after: method
  steps:
  - name: DR 信号
    formula: ψ = μ₁ − μ₀ + y(m−μ₁)/e − (1−y)(m−μ₀)/(1−e)
    explanation: 観測できた群の予測誤差を、割当確率で補正する。
  - name: uplift の補助学習
    formula: L_DR = mean[ω_DR (τ−ψ)²]
    explanation: 論文は大きい補正項を切り詰める。toy では切り詰めを省く。
  - name: 本番の主方策
    formula: 'SV: μ₁ > δ　／　DP: τ > δ'
    explanation: SV は結果確率を閾値にかける。DP は追加効果の診断に使う。
- kind: matrix
  id: offline-online
  title: Table 4：閾値を厳しくすると両環境で発火が減る
