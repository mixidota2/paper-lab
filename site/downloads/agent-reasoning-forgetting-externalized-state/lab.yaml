- kind: equations
  id: trajectory-accounting
  title: 総費用は、残る履歴と後続の要求回数で決まる
  after: method
  steps:
  - name: 削除後の次の判断
    formula: H̃ₖ → Aₖ → Oₖ₊₁ → H̃ₖ₊₁
    explanation: Fig. 2。一度変わったtool呼び出しは、次に読む情報も変える。
  - name: 作業全体で集計
    formula: T = Σₖ₌₁ᴷ (Iₖ + Oₖ)
    explanation: Eq. B.13。Iは入力、Oは出力のtoken数。cache readを二重加算しない。
  - name: 削除率から総節約率は出ない
    formula: ΔT = Σₖ≤K* (ΔIₖ + ΔOₖ) + unmatched suffix
    explanation: Eq. B.14。K*は両条件の要求回数の小さい方。後続の長さと回数も差に含まれる。
  locator: Fig. 2 / Eq. B.13–14
  caption: 文章を削る直接効果と、後続の作業が変わる効果を一緒に測る。
  source: https://arxiv.org/pdf/2609.29875v1
  rationale: 局所的な剪定と総費用の違いを式で追う。
