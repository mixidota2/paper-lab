  scope: 一次PDFの本文・数式・実験表と限界を確認。提示メモとの差分は本文に明記。
core_idea:
  author_claim: 各runの完了やlineageだけでは比較の妥当性を保証しない。承認済みcontrastとartifactから実現した条件を照合し、比較単位でfail-closedに受理する。
  research_bot_interpretation: '[AURA](aura-disney-agentic-rec-diagnosis.html)は何を直すべきかを診断し、EvoPilotは修正を比べた測定が有効かを検査する。[PILOT](pilot-experiment-lifecycle.html)の非同期実験運用や[AgentX](agentx-kuaishou.html)のkeep判定にも、比較条件が揃ったかという前提を追加できる。'
sections:
  overview: interaction headで精度が22 pp落ちたという結論は、controlだけ3,000件を評価していたため無効だった。宣言は両群K=600でも、実現した出力数が違った。EvoPilotの中心はagentを増やすことより、承認した差分とartifactの実現値を比較して記録することにある。最初に問題を捕まえたのはhuman
    gateで、自動identity guardは事後強化だった。
  problem: 長いML実験はsource、data、training、publish、index、evaluatorをまたぐ。各runが成功し、どのrevisionで実行したか分かっても、二つのrunが同じ測定をしているとは限らない。code変更がno-op、eval日がtrainに混入、K/Pが宣言と不一致、といった問題を「modelが悪い」という結果から切り分ける必要がある。
  why_it_might_work: '解釈: proposalを実行権限や証拠と混同せず、typed adapterで実行し、artifactを独立verifierへ渡すと、agentの説明だけで比較を通しにくくなる。前回の失敗をmemoryに保存するだけでは防止策にならない。次回のartifactや状態遷移に適用できる検査へ変換して初めて強制力を持つ。evaluatorの意味自体が正しいかは人間の確認が残る。'
  evidence: '一次資料 [PDF §5、Tables 1–6](https://arxiv.org/pdf/2609.21257v1) の著者報告。37日・7方向・20承認round。記録が揃う部分集合は9
    round・29 variantで、22 train、22 publish、27 evaluateの計71論理stage。27/29はこの部分集合でscientific
    resultまで完了した割合であり、20 round全体の成功率ではない。


    −22 ppの旧比較はcontrol K_eff=3000、treatment K_eff=600。宣言は両方600だった。修正後の同じ(P,K)=(3000,600)再試験は+4.8
    ppだが、base modelも変わりbundled effect。後のmatched-lineage比較はcheckpointとK=3000を固定し、control
    P=3000/head off、treatment P=6000/head onで+3.20 pp。head offのtop-KはPに不変という性質を使った、選定運用点でのhead効果である。


    別のaccount-randomized A/BはUS/Canada VDD-pivot slice、7日観測＋別の7日pre-period。GSRR +0.66%相対差で、著者は統計的有意と報告する。guardrail結果は保存datasetにない。これは選ばれたmodel変更の効果であり、EvoPilotを使うことの生産性や因果的優位性のRCTではない。


    10組のclean/fault replayは全clean受理・全fault拒否。ただしfunnel/evaluator identity等3組はpost-study強化の検査で、全37日間に自動検知していたわけではない。'
  executable_understanding: '`uv run papers/evopilot-verify-dont-trust-autoresearch/run.py`。出力Kを無視する壊れたevaluatorと修正版へK=1/600を与える。別に同じbase/data/evaluatorと承認差分を照合し、depth不一致・evaluator変更・data変更・no-op・証拠欠落を注入して拒否を確かめる。'
  results: 壊れた人工evaluatorはK=1と600で同じhit率1.0。修正版は0.01/0.20へ分かれる。5種類のfaultはすべて拒否し、clean
    pairだけ機械検査を通過。human_reviewはpendingのまま記録するので、機械検査の成功を人間の承認済みと扱わない。原典の−22 ppを人工実験で再現するよう値を設定していない。
  what_we_verified: Mechanism PARTIAL。実現Kの反証probeと、pairの許可外差分・no-op・欠落の拒否は人工artifactでCONFIRMED。canonical
    recordのhashも計算する。
  what_we_did_not_verify: Performance / Scaling / Production applicability NOT TESTED。本番MBR学習、数億動画index、37日agent運用、offline
    +3.20 pp、online +0.66%は再現していない。local hashは遠隔artifactの真正性を保証しない。
  implementation: '`evaluate()`がK契約の破壊・修正、`verify()`が承認差分と必須証拠の確認。`durable_record`はcontrol/treatment・allowed_diff・判定・human
    statusを一緒に保存する。実際のworkflow adapter、atomic state更新、remote再開・tool権限は省略する。'
