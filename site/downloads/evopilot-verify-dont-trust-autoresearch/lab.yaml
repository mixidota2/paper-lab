  steps:
  - name: 比較の受理
    formula: A(c,t;R) = 1[VerifyR(c,t)] × 1[ReviewR(c,t)]
    explanation: run単位の成功だけでは両項を満たせない。
  - name: オンライン指標
    formula: GSRR = qualifying eligible pivot sessions / eligible pivot sessions
    explanation: offline hit-rateとは母集団も意味も違う。
  - name: 相対lift
    formula: lift = (GSRRt − GSRRc) / GSRRc
    explanation: +0.66%を+0.66 percentage pointへ変換しない。
