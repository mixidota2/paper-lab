question: 完了した二つの実験を、比較してよい証拠にする条件は何か
summary: 37日間のVDD研究で、−22 ppという誤った比較をhuman gateが棄却。評価器修正後、matched-lineageで+3.20 pp、別の7日A/BでGSRR
  +0.66%相対差。
