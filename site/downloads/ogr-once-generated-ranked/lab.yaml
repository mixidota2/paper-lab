teaching_figures:
- id: ogr-equations
  kind: equations
  title: TUSIDとSPAの式を分解する
  after: method
  caption: 式の対象と仮定を分けて読む。
  rationale: 演算と制御の境界を具体化する。
  locator: 式5–7、15–18
  steps:
  - name: 局所共起
    formula: Cᵢ[h(j)] += σ(j)/|p−q|
    explanation: shared hashで共通近傍を保存。無関係な衝突項が0になるのは符号乱数に関する期待値。
  - name: 協調の信頼度
    formula: αᵢ = 0.35 log(1+Uᵢ)/(log(1+Uᵢ)+0.5)
    explanation: distinct usersが0ならα=0。
  - name: 重み付き連結
    formula: eᵤₙᵢ = [√(1−α)eₛₑₘ ; √α e꜀ₒₗ]
    explanation: 各枝が単位normなら連結後も単位norm。
  - name: 報酬の校正
    formula: Δ = δpri + κ δaux
    explanation: 同符号ならκ=min(|δpri|,|δaux|)/max(|δpri|,|δaux|,ε)、それ以外0。
  - name: 保守的な更新
    formula: LSPA = Lclip + 0.05 KL(q₀ || qθ) + 0.1 Lsup
    explanation: 候補slate集合上のKL。全catalog分布の厳密なKLではない。
  source: https://arxiv.org/pdf/2608.17613v1
