  overview: FlashTrieは圧縮trieとbeam展開・検査・選別をGPU内へまとめる。800M keyword列の測定では平均0.6–1.9ms、p99は最大3.3ms。オンラインEnglish revenue
    +0.71%、遅延−32%は、backendと実行可能なbeam構成を同時に変えた比較である。
  why_it_might_work: '【解釈】上位のprefixはbeam間で共有されやすく、GPUにindexを常駐させると再利用しやすい。beam間と各beam内のtop-K候補の二方向に並列性を出せる。幅を増やすと、ボトルネックはtrie
    traversalからcandidate validation側へ移る（図4）。


    ただしbeamを広げれば必ず事業価値が増えるわけではない。候補品質、teacherとの整合、後段の上限に依存する。p99と平均を取り違えるとSLOの余裕も過大評価する。'
  method: method.md
  executable_understanding: 2段の固定NAR確率表からprefix制約付きbeam searchをCPUで実行する。beam1で落ちる最適系列がbeam2で残る例と、depth-only filterが無効な組合せを返す例を比べる。GPUの時間を測った実験ではない。
  results: 人工実験の計算値を下に示す。著者のオンライン報告とは別のデータである。
