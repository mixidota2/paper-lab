teaching_figures:
- kind: equations
  id: method-equations
  title: 式と操作の対応
  after: method
  caption: 各記号が担う役割を分けて読む。
  rationale: 演算と制約の対象を明確にする。
  source: https://arxiv.org/pdf/2607.10044v1
  locator: §2、Algorithm 1
  steps:
  - name: score
    formula: σ′=σ+log p(x_t|x_<t)
    explanation: synthetic実験はprefix非依存のNAR確率表を使う。
  - name: 制約
    formula: 'next={prefix+v : child(prefix,v) exists}'
    explanation: 深さごとのtoken集合だけでは不十分。
  - name: beam
    formula: active=TopB(next)
    explanation: GPUでは候補のmergeと選別までdevice内に保つ。
