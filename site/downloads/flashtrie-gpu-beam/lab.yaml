question: FlashTrie：beam幅を広げる余裕を、GPUのtrie探索で作る
summary: FlashTrieは圧縮trieとbeam展開・検査・選別をGPU内へまとめる。800M keyword列の測定では平均0.6–1.9ms、p99は最大3.3ms。オンラインEnglish revenue
  +0.71%、遅延−32%は、backendと実行可能なbeam構成を同時に変えた比較である。
