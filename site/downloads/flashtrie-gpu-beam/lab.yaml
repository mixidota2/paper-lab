core_idea:
  author_claim: 著者は整数token向けNarrow-LOUDSとpersistent cooperative CUDA kernelを組み合わせ、同じ探索品質を保ちながら遅延を削減し、より大きいbeamを使えると主張する（§2–4）。
  research_bot_interpretation: ここではtrieだけを速くするのではなく、beamの展開・検査・pruneまでGPUで処理する点が重要だ。online改善は同じ探索結果を安く出した効果だけでなく、広い候補集合を後段rankingへ渡せた効果を含む。
sections:
  problem: '生成したID列が登録集合に属するかを確かめるtrieは、beam幅が増えるほど多くの枝を読む。CPUの圧縮trieは省メモリでも、pointer追跡、子の探索、beam用heap、GPUとの往復がボトルネックになる。


    検索広告では遅延上限を守ったまま候補を増やせるかが重要だ。同じbeamでGPUが正確に動くことと、広いbeamにより収益が伸びることは別の検証になる。'
  evidence: '### 実測点だけでbeamとSLOを比較する


    表6の800M workloadはBW100→1000でCPU平均9.0→46.3ms、GPU平均0.6→1.9ms、GPU p95 0.6→2.8ms、p99 0.7→3.3ms（丸め値）。「約3ms未満」は全percentileの上限ではない。図の点は表6と表1から取り、間のbeam幅や新hardwareの値を補間で捏造しない。


    表1のP@100は0.53→0.78。teacher cross-encoderによる候補評価であり、利用者CTRではない。CPUとGPUは各BWで0.001以内の一致。P@200についてはcaptionにBW100でP@100と同じとある一方、表は0.52対0.53なので、このLabの比較図には整合するP@100系列だけを使う。


    ### オンラインは探索設定も変わる


    §4.8・表3。Englishはrevenue +0.71%、coverage +0.22%、impression +0.21%、clicks +0.17%、latency −32%。Non-ENは+0.68%、+0.25%、+0.37%、+0.20%、−32%。有意水準α=0.05、defect指標は±1%内で有意差なし。後段auction・pacing・rankingなどは共有し、retrieval
    backendとその時間内で維持できるbeam構成が異なる。


    [STATIC](static-constrained-gr.html)の0.033msは1 stepの制約追加分。本論文の数msはrequestのtrie-search、−32%はretrieval service入出力間の時間である。NEZHAのinvalid-SID処理とも、validity定義と計測範囲を揃えて比較する必要がある。


    <figure class="teaching batch17"><h3>実測点から、許容できるbeam幅を読む</h3><div data-b17="slo"><label>trie-searchのp99上限（Labで選ぶ条件）<select
    data-control><option value="1">1 ms</option><option value="2">2 ms</option><option value="3" selected>3 ms</option><option
    value="4">4 ms</option></select></label><p data-output aria-live="polite">上限3msなら、表のGPU p99が条件を満たす最大BWは700。P@100は0.77。</p><script
    type="application/json" data-values>[[100, 9, 0.6, 0.7, 0.53], [200, 14.9, 0.7, 0.9, 0.68], [300, 20.1, 0.9,
    1.2, 0.72], [400, 25.3, 1.1, 1.6, 0.74], [500, 29.5, 1.4, 2, 0.75], [600, 33.4, 1.6, 2.6, 0.76], [700, 36.3,
    1.6, 2.8, 0.77], [800, 40.5, 1.9, 3.2, 0.77], [900, 42.9, 1.9, 3.3, 0.78], [1000, 46.3, 1.9, 3.3, 0.78]]</script></div><div
    class="matrix-scroll" tabindex="0" role="region" aria-label="比較表"><table><thead><tr><th>BW</th><th>CPU平均ms</th><th>GPU平均ms</th><th>GPU
    p99 ms</th><th>P@100</th></tr></thead><tbody><tr><td>100</td><td>9</td><td>0.6</td><td>0.7</td><td>0.53</td></tr><tr><td>200</td><td>14.9</td><td>0.7</td><td>0.9</td><td>0.68</td></tr><tr><td>300</td><td>20.1</td><td>0.9</td><td>1.2</td><td>0.72</td></tr><tr><td>400</td><td>25.3</td><td>1.1</td><td>1.6</td><td>0.74</td></tr><tr><td>500</td><td>29.5</td><td>1.4</td><td>2</td><td>0.75</td></tr><tr><td>600</td><td>33.4</td><td>1.6</td><td>2.6</td><td>0.76</td></tr><tr><td>700</td><td>36.3</td><td>1.6</td><td>2.8</td><td>0.77</td></tr><tr><td>800</td><td>40.5</td><td>1.9</td><td>3.2</td><td>0.77</td></tr><tr><td>900</td><td>42.9</td><td>1.9</td><td>3.3</td><td>0.78</td></tr><tr><td>1000</td><td>46.3</td><td>1.9</td><td>3.3</td><td>0.78</td></tr></tbody></table></div><figcaption>表1・表6の丸め済み実測値。SLO上限はLabの操作条件。productionの30ms
