teaching_figures:
- kind: architecture
  id: zalando-grid-decoupling
  title: 需要表を保存し、値付けを何度も計算する
  after: core_idea
  source: https://arxiv.org/pdf/2606.13741v1
  locator: Fig. 3、§3.1
  rationale: 学習の頻度と意思決定の頻度を分ける設計を示す。
  caption: 原論文Fig. 3を再構成。LightGBMの再学習なしにαを変えた候補を計算する。
  rows:
  - label: 予測を保存する
    nodes:
    - title: 日次LightGBM
      text: 市場・予測日ごとのモデル。価格、過去販売、閲覧、イベントなどを入力。
    - title: 割引×日の需要表
      text: 割引候補ごとの予測をデータ層に保存。割引が深いほど需要予測は減らない。
  - label: 担当者が候補を選ぶ
    nodes:
    - title: 在庫・返品・費用
      text: 販売数を在庫で切り、純売上と長期利益に変換。
    - title: 商品別の採点
      text: LTP + α NMVを割引ごとに計算。αを振って複数案を提示する。
- kind: equations
  id: zalando-marginal-tradeoff
  title: αは追加の売上と引き換えに許す利益減少
  after: method
  source: https://arxiv.org/pdf/2606.13741v1
  locator: 式(1)〜(2)、Fig. 4
  rationale: 重みの操作を式の限界条件と対応づけ、離散グリッドとの違いも示す。
  caption: 式(2)は連続・微分可能な内点解の説明。最小実験の割引候補は離散なので、選択は段階的に変わる。
  steps:
  - name: 商品ごとの目的
    formula: J(d) = LTP(d) + α NMV(d)
    explanation: αが大きいほど、追加の純売上を重く評価する。
  - name: 内点解の条件
    formula: LTP′(d) + α NMV′(d) = 0
    explanation: 割引を増やしたときの利益減少と、重みを掛けた売上増加を釣り合わせる。
  - name: 限界の交換比率
    formula: −NMV′(d) / LTP′(d) = 1 / α
    explanation: α>0で分母が0でない場合。γが残在庫を高く評価するほど、今売るために失う将来利益も大きくなる。
