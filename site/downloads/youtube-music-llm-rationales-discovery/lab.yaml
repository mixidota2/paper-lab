core_idea:
  author_claim: 非同期でDiscovery Profileを生成し、KG照合と既聴artistの除外後にcacheへ保存する。オンラインでは候補の追加と理由の付与を軽い取得処理として行い、未知artistを選ぶ心理的障壁を下げる。
  research_bot_interpretation: 読むべき点はLLMを置いたこと以上に、候補追加と説明付与を分けたholdbackである。[Netflixの反実仮想観測](netflix-counterfactual-observability.html)とも、目立つ出力の採用数と全体の増分を区別する点でつながる。YDDは理由文を付けられる候補だけを並べる面なので、この設計を一般feedの説明効果へそのまま広げない。
sections:
  overview: 対象はYouTube Music homepageの発見用YDD棚。従来は「好きなartistのfan向け」などの定型理由を、co-watchやaudio embeddingの類似度閾値から付ける。LLMはtaste
    groupに基づくartist候補と自然言語の理由をofflineで作り、候補追加と既存候補への理由付与の両方に使う。
  problem: 未知のartistが候補にいても、利用者が選ぶ根拠を持たなければ聴かれない。一方、requestごとのLLM生成は費用とlatencyが重い。さらに架空artistや既聴artistが混じると、発見という目的を満たせない。候補の実在性と理由の妥当性は別々に確認する必要がある。
  why_it_might_work: 利用者の好みとの接点を理由文で示せば、未知の曲を選ぶ負担が下がると考えられる。offline生成は履歴を長く読み、品質検査をrequest外へ移せる。ただし心理的信頼そのものを直接測定した実験ではない。KGに実在するartistでも、理由文の音楽的説明が正しいとは限らない。
  evidence: '[一次資料PDF §3–4 / Table 1](https://arxiv.org/pdf/2609.23877v1) の著者報告。


    | 測定 | 著者値 | 境界 |

    | --- | --- | --- |

    | YDD shelf engagement | +22.43%、95% CI [16.93,27.93]% | 2週間、棚に限定 |

    | YDD discovery / retention metric | +8.07%、CI [0.90,15.24]% | サービス全体のretentionとは同一視しない |

    | new nominator | views 4.1%、uniqueness 74.00% | Tableのviewsの分母は十分明確でない |

    | mean online latency | +0.3% | 絶対msとp99は未提示 |

    | judgeのpassing rate | 64.8→74.4% | prompt改善、本文のpass条件はscore >3 |


    multi-arm holdbackで、候補poolとvisual interfaceを維持してLLM理由だけを外すと、full holdbackに近いengagement低下が起きた。新nominatorだけを外すとengagementはneutral。一方、discovery指標はどちらを外しても部分的に低下する。各holdbackの数値・CIは本文にないため、架空の棒の高さは付けない。judgeはscore
    <3で修正を促し、score=3の扱いはpass率の記述から確定できない。'
  executable_understanding: '`uv run papers/youtube-music-llm-rationales-discovery/run.py`。架空のartist辞書と既聴履歴で、未知文字列の除外、既聴artistの除外、cache未生成時のfallbackを実行する。holdbackは本文の定性的な実験設計を表で追う。架空clickを発生させて+22.43%を再現する実験は行わない。'
  results: 人工の3候補から、KG相当の辞書に存在し、まだ聴いていない1候補だけが残る。初回はfallback、profile準備後は保存済み候補を返す。理由を隠しても候補IDの集合は変わらない。この機構上の分離と、実利用者が理由に反応するかは別の検証である。
  what_we_verified: Mechanism PARTIAL。canonical IDの存在、novelty filter、理由holdback時の候補不変性、cold cacheのfallbackは人工fixtureでCONFIRMED。LLM生成の正しさは未検証。
  what_we_did_not_verify: Performance / Scaling / Production applicability NOT TESTED。Gemini、judge、人間の信頼、engagement、TPU費用、本番cacheは実行・測定していない。理由文の全誤りを防げるとの保証もしない。
  implementation: '`canonicalize()`は小さい辞書で実在確認を代理し、`serve()`はprofile有無と理由表示を分ける。これらは論文の境界を説明する独自コードで、GoogleのKGやproduction実装ではない。'
