core_idea:
  author_claim: 統計的な予測精度と在庫KPIを結ぶ公開基盤を提供する。人工実験では、精度改善が費用改善へ直結せず、シナリオごとに両者の関係も変わる。
  research_bot_interpretation: Accuracy Is Not Serviceの問題意識を、費用と充足率を測る再利用可能な試験環境へ進める仕事と読む。現場での優位性の証拠はまだ薄く、需要生成と在庫方策の仮定を差し替える将来の実験基盤として位置づける。
sections:
  overview: MAEが最小の予測モデルが、在庫費用も最小にするとは限らない。TruckPartsは、トラック補修部品の人工需要、予測、在庫費用計算をつなぐ公開ソフトウェアである。著者実験では木モデルがMAEで強く、Crostonが総費用で最良だった。将来の比較実験に使う基盤として読む。
  problem: 需要がない日が多い補修部品では、誤差の小ささと欠品回避の価値がずれる。対象は48の人工シナリオ。4種類のドリフト条件、4種類の車両数範囲、3種類の部品寿命範囲を組み合わせ、4販売店で3年間を生成する。実測の需要系列による評価ではない。
  why_it_might_work: 解釈：MAEは過剰予測と過小予測を同じ単価で数える。一方、在庫費用は保管、発注、緊急便、輸送、サービス不足の費用を通じて予測を評価する。ゼロ需要をよく当てても、稀な需要で補充が足りなければ費用が増える。この接続を固定条件で調べられる点に価値がある。
  evidence: '一次資料の著者報告（v2 Table 1）：XGBoostとRandom ForestのMAEは丸め値で0.43、Crostonは0.52。総費用はそれぞれ約8.2×10⁵、7.5×10⁵、7.4×10⁵である。MAEはシナリオ平均と標準偏差、費用は全シナリオの合計。図では平均MAEと総費用を切り替え、同じモデルの順番を見る。


    Figure 6のMAE–費用の順位相関は全体0.95に対し、シナリオ内の平均が−0.16。本文はRMSEでも平均−0.06と報告する。集計すると関係が変わるため、需要規模が異なるシナリオをまとめた相関だけでモデルを選ばない。これらは著者の報告値であり、Labで再計算した相関ではない。'
  executable_understanding: '`UV_CACHE_DIR=/tmp/uv-cache uv run --no-project papers/bridging-forecast-accuracy-inventory-kpis/run.py`


    同じ人工需要と同じ補充規則でZeroとCrostonを比較する。最初の730日でCrostonを推定し、残る365日では固定予測を使う。欠品単価を1、5、20、50に切り替える。Zeroは木モデルの代理ではない。この小実験は、評価指標による順位逆転の仕組みだけを切り出す。'
  results: 人工実験のMAEはZeroが0.537、Crostonが0.855。欠品単価50では総費用が9,800対3,395となり、予測誤差と費用の優劣が逆転した。充足率は0%対75%。単価1では196対994となり、費用でもZeroが低い。Crostonが常に有利という結果ではなく、欠品と保管の単価に依存する。
  what_we_verified: CONFIRMED：人工実験の各日で在庫の収支と需要の分解を照合した。欠品単価50でのMAEと費用の順位逆転も確認した。MechanismはPARTIAL。論文全体の需要生成と費用計算の一部だけを、独立した説明用コードで扱っている。
  what_we_did_not_verify: Performance / Scaling / Production applicabilityはNOT TESTED。公式の48シナリオ、7予測モデル、費用シミュレータは再実行していない。実験は全て人工需要で、論文も在庫方策のパラメータを全販売店・部品で固定する。価格、初期在庫、納期なども共通で、供給者の容量は無制限。販促と欠品を含むTSFM対GBDTの比較や、実店舗の棚割りRCTの証拠には使えない。
  implementation: run.pyはPython標準ライブラリだけで動く。croston()が非ゼロ需要量と間隔を学習し、simulate()が共通の補充規則と費用を計算する。results.jsonは論文の転記値reportedと人工実験framesを分けて保存する。ページはlab.yaml、method.md、mapping.md、results.jsonから生成する。
  method: method.md
  mapping: mapping.md
