  steps:
  - name: 予測誤差
    formula: MAE = mean(|d − f|)
    explanation: 過大・過小の誤差を対称に数える。
  - name: 説明用の在庫目標
    formula: S = ceil(5f)
    explanation: Lab独自の固定規則。両予測へ同じ係数を使う。
  - name: 説明用の費用
    formula: C = Σ I + p Σ U
    explanation: Iは日末在庫、Uは欠品個数。欠品単価pで費用順位が変わる。
