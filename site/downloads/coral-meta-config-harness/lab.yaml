  - name: 目的
    formula: s*_t=argmax J_t(s), c_t(s)≤B
    explanation: 時点ごとに最適設定は変わる。最適性保証は未提示。
  - name: Labの射影
    formula: s=argmin_{x≥0,Σx≤B} ||x−proposal||²
    explanation: この距離と単価はLabの仮定。原論文のoptimizer詳細は非公開。
  - name: 費用
    formula: Cost=(T/k)C(τ_in p_in+τ_out p_out)
    explanation: request数には比例しないLLM費用。token数は著者推定。
