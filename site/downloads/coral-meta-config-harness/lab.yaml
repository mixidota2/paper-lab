core_idea:
  author_claim: 著者は、観測・記憶・LLM提案・数値optimizer・配信・効果測定を固定周期で回せば、追加のモデル学習なしに設定を継続改善できると主張する（§3–5）。
  research_bot_interpretation: 中心はLLMだけの最適化能力より、何を変えられるか、予算を誰が保証するか、測定結果をどう戻すかという契約だ。AgentXより変更範囲が狭く、その分、数値的な実行可能性を保証しやすい。
sections:
  problem: '候補源の質やユーザー構成は変わるが、候補数の配分やserving treatmentは手作業で決めたまま残りやすい。モデル自体を再学習しても、この設定が古ければ計算予算を使う場所がずれる。


    CORALは個々のrequestで推薦を生成しない。既存の推薦器を囲むcontrol planeとして、連続値の予算multiplierや離散的なtreatmentを変更する。online学習器の重み更新や自律的なproductionコード書換えとも区別する。'
  evidence: '### videoのR1→R3は単調な改善ではない


    §5.1・表1。R1はzero-shotでwatch time +0.13%、sessionsはneutral。R2は配分を動かしすぎて両指標neutral。複数decision cyclesをまとめたR3はwatch
    time +0.15%、全ユーザーのvideo-viewing sessions +0.16%、largest marketのsessions +0.77%。neutralは有意差を検出しなかった意味で、効果が厳密に0だった証明ではない。


    sessionsは少なくとも1回video viewを含むapp visit。A/Bは数百万人規模と記されるが、各roundのCI、割付比率、試験期間、共通controlの細部は非公開。new low-signal
    cohortのsessions +0.23%は後続のsegment別配分であり、global R3と分母が違う。


    ### 別surfaceの44%は削減額の増加


    §5.2。初回は一部segmentへのtreatment配分で、年率換算数百万USDのserving費用を削減。2回目に対象segmentを広げ、初回の節約額を44%増やした。engagementは統計的に変わらなかった。したがって
    `saving₂=1.44×saving₁` であり、`cost₂=0.56×cost₀` とは読めない。総費用に対する削減率は算出できない。


    これは別serviceへ同じharnessの構成を適用した事例で、同じ学習済み配分をそのまま移した実験ではない。RecSys 2026 OARSの位置付けを持つ報告だが、ここで照合した資料はarXiv v1。[AgentX](agentx-kuaishou.html)のcode/DSL開発、[RecEvolve](recevolve-autonomous-rec.html)のarchitecture探索と比べ、CORALは既存の設定menuの内側で変更する。


    <figure class="teaching batch17"><h3>R2のneutralも残して、roundを読む</h3><div class="matrix-scroll" tabindex="0" role="region"
    aria-label="比較表"><table><thead><tr><th>指標</th><th>R1</th><th>R2</th><th>R3</th></tr></thead><tbody><tr><td>watch
    time</td><td>+0.13%</td><td>neutral</td><td>+0.15%</td></tr><tr><td>sessions / 全体</td><td>neutral</td><td>neutral</td><td>+0.16%</td></tr><tr><td>sessions
    / 最大市場</td><td>neutral</td><td>neutral</td><td>+0.77%</td></tr></tbody></table></div><div class="b17-cards"><div><strong>別surfaceの初回節約額をSとすると</strong><p>次回は1.44S。元費用Cに対する削減率は、S/Cがないと分からない。</p></div><div><strong>人工例：C=100、S=10</strong><p>次回節約14.4、残る費用85.6。論文の実金額ではない。</p></div></div><figcaption>§5.1・表1、§5.2。neutralを0%の棒として描かない。44%の分母は初回節約額。</figcaption></figure>


    [一次資料：版を固定したPDF](https://arxiv.org/pdf/2609.02730v1)。図表の箇所とSHA-256は末尾の対応表を参照。'
  overview: CORALは候補源の予算やsegment別のserving処理を、数日ごとに更新するMetaのharness。videoのR3でsessions +0.16%、watch time +0.15%、追加serving費用なし。別surfaceの44%は初回の削減額の増加率であり、総費用−44%ではない。
  why_it_might_work: '【解釈】言語モデルは定性的な運用情報を解釈し、数値ツールは予算を保証する、という分業に意味がある。過去の提案と結果を記憶すれば、前回のやりすぎを戻す判断もできる。


    ただし予算内であることはengagement改善の保証ではない。before/afterだけのattributionは季節性や上流変更と混ざる。A/Bが利用可能な場合のtreatment effectと、記憶に残るagent自身の解釈を同じ確度で扱わない。'
  method: method.md
  executable_understanding: '3つの手作り予算提案を、非負・合計10以下の集合へEuclidean projectionする。既に実行可能な提案は保存する。離散menuも全列挙で最も近い実行可能な構成を選ぶ。初回節約10・元費用100という人工値で「節約額44%増」の分母を示す。


    <figure class="teaching batch17"><h3>提案を変えると、予算超過分だけ射影される</h3><div class="matrix-scroll" tabindex="0" role="region"
    aria-label="比較表"><table><thead><tr><th>提案</th><th>適用した設定</th><th>合計費用</th></tr></thead><tbody><tr><td>[4, 3,
