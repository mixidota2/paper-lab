core_idea:
  author_claim: '全系列を使うCatBoostで複数の先の週を予測する。欠品週を欠損として扱った実効需要から履歴特徴を作り、系列ごとの規模で正規化する。発注時は到着までの在庫を見積もり、欠品と保管の費用比に応じた目標在庫から注文量を決める。


    [一次資料：§2 / §6.2 / §7](https://arxiv.org/html/2601.18919)'
  research_bot_interpretation: 欠品を除外する処理は、潜在需要を復元する因果モデルではない。むしろ「確かに需要を観測できた期間はどこか」を区別する実用策。非欠品の週だけが平穏な週に偏っていれば、その平均にも下方の偏りは残る。
sections:
  overview: '欠品週の販売を需要の真値として使わず、予測と発注を分ける。VN2の勝者報告は、特徴量と費用に合わせた注文規則の組合せを示す。


    このLabでは「売れた数しか分からないとき、必要な在庫をどう決めるか」を考える。論文の主張を押さえたうえで、下の図で条件を変え、どこから結論が変わりそうか確かめる。'
  problem: '在庫が8個しかなければ、20個欲しい人がいても販売は8個で止まる。販売をそのまま需要として学習すると、よく欠品する商品ほど低く予測し、次も在庫を減らす循環が起こる。


    VN2では週末に注文した商品が2週間の配送期間を経て、t+3週の開始に届く。今日の棚を埋めるのでなく、到着時の残在庫と需要を見越して発注する問題だ。'
  why_it_might_work: 規模の違う商品を正規化すると、大量販売の商品だけに学習が寄るのを抑えられると考えられる。予測器を固定しても、欠品損失が高い商品へ厚く在庫を置く規則で総費用は変わる。予測精度と注文品質を別々に検証したい。
  evidence: '§2.3とAbstractは公式シミュレーション6ラウンドでの優勝を報告する。特徴量と規模調整は§6.2、到着週の目標在庫と注文規則は§7。競技の条件下でのシステム評価であり、CatBoost単体が他の全予測器より優れているという比較ではない。


    [一次資料：§2 / §6.2 / §7](https://arxiv.org/html/2601.18919)'
  executable_understanding: '同じ8期の潜在需要に異なる在庫上限を適用する。販売平均と、上限に達した期間を除いた平均を計算し、除外しても真値に戻るとは限らないことを見る。


    実行：`uv run papers/vn2-stockout-catboost/run.py`。合成データの作り方と比較条件はコード内に記載し、図の全条件の結果を `results.json` へ保存する。'
  results: 図のスライダーは、同じ実験コードが計算した各条件を表示する。初期条件の値を下表に示す。値の大小を論文モデルの優劣へ読み替えない。
  what_we_verified: '**メカニズム：PARTIAL（部分的）**。確認したのは、このLabで明記した仮定の下での計算と条件による変化。原論文の機構全体を確認した意味ではない。


    同じ8期の潜在需要に異なる在庫上限を適用する。販売平均と、上限に達した期間を除いた平均を計算し、除外しても真値に戻るとは限らないことを見る。'
  what_we_did_not_verify: 全期間で欠品している商品には、除外後の情報が残らない。代替購買、失注数、発注の最小単位、配送の遅れを含む現場への適用は別途検証が必要。公式シミュレーターとCatBoostの学習は実行していない。
  implementation: '標準ライブラリだけで実行できる。入口は各Labの `run.py`、計算本体は `papers/_toy_common.py` にある。関数は論文IDごとに独立し、ブラウザー用の全条件と初期条件の表を同時に出力する。


    意図して省いたもの：CatBoost、動的正規化、2週の配送期間、費用最適化、公式競技。'
  mapping: '| 対象 | 原典とLabの対応 |

    | --- | --- |

    | 原論文 | [§2 / §6.2 / §7](https://arxiv.org/html/2601.18919) |

    | 処理図 | 上記の仕組みを説明用に簡略化。公式実装ではない |

    | 条件探索 | `run.py` → `papers/_toy_common.py` → `results.json` |

    | 公式コード | このLabでは公式コードとの行単位の照合はしていない。 |'
question: 売れた数しか分からないとき、必要な在庫をどう決めるか
interactives:
- kind: flow
  title: 処理と設計の違いを追う
  caption: 段を選ぶと説明が切り替わる。比較側は論点を示す簡略化で、統制実験の実装ではない。
  source: https://arxiv.org/html/2601.18919
  stages:
  - title: 販売を観測する
    baseline: 販売を需要とみなす
    proposed: 欠品の有無を確認
    detail: 販売=min(潜在需要,利用可能在庫)という観測上の上限を意識する。
  - title: 履歴を作る
    baseline: 欠品週も平均へ入れる
    proposed: 実効需要から特徴を作る
    detail: 欠品週を欠損扱いにする。未知の需要が既知になるわけではない。
  - title: 未来を予測する
    baseline: 商品ごとの単純予測
    proposed: 全系列のCatBoost
    detail: 規模を調整し、複数の予測先を扱う。
  - title: 発注を決める
    baseline: 予測値だけ注文
    proposed: 到着時在庫と費用から注文
    detail: 残在庫、入荷、欠品と保管の費用を考慮する。図の小実験は第1〜2段だけを扱う。
- kind: explorer
  title: 欠品を除けば需要は分かるか
  caption: 同じ8期の潜在需要に異なる在庫上限を適用する。販売平均と、上限に達した期間を除いた平均を計算し、除外しても真値に戻るとは限らないことを見る。
