  source: https://arxiv.org/abs/2608.10182
  locator: Fig. 1; Eq. 1, 3; §2.2.1
  rationale: 予測、探索、制約が扱う量を分ける。
  steps:
  - name: 反実仮想の差
    formula: τ(X) = μ₁(X) − μ₀(X)
    explanation: 共有表現から処置あり・なしの成果とpropensity e(X)を推定する。
  - name: 不確実性から探索
    formula: f̃(x) ∼ Normal(f_MAP(x), σ₀² + g(x)ᵀΩ⁻¹g(x))
    explanation: 本番ではlast-layer LLAを使う。logitをsampleしてsigmoidへ通し、増分scoreを作る。
  - name: 全体配分
    formula: maxₓ Σᵤᵢ τ̃ᵤᵢ xᵤᵢ ;  Ax ≤ b, Σᵢ xᵤᵢ ≤ C_fcap
    explanation: 共有guardrailと会員の頻度上限を守る。実装では連続緩和と平滑化を行い、双対変数を更新する。
