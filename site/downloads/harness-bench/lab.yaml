teaching_figures:
- kind: equations
  id: score
  title: 完了度が同じでも過程の採点で差が出る
  after: method
  locator: §3.4
  rationale: 合成スライダーより採点の積構造を直接示す。
  caption: 論文の採点式。Security以外は0〜1へ正規化する。
  steps:
  - name: 過程の3軸を平均
    formula: P = (Robustness + ToolUse + Consistency) / 3
    explanation: 障害への対処、ツールの適切さ、状態と行動の整合性を評価する。PはLLM評価を含む。
  - name: 許可違反をゲートにする
    formula: TaskScore = Security × Completion × P
    explanation: Securityは0または1。明示された許可・セキュリティ制約に違反すれば、完了度が高くても総合点は0になる。
  - name: 集計は各タスクの積から
    formula: MeanScore = (Σᵢ TaskScoreᵢ) / N
    explanation: 平均完了度と平均過程点を後から掛けても、一般には同じ平均点にならない。
  source: https://arxiv.org/html/2605.27922
- kind: chart
  id: harness-scores
  title: 6構成の総合点：同じタスクとモデル群で比較
  after: evidence
