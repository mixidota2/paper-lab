question: UniVA：広告の価値を、SID・枝選び・配信制約で揃える
summary: 広告の生成確率が高くても、配信できて収益につながるとは限らない。TencentのUniVAは商用属性をSIDの末尾へ入れ、生成と価値の2ヘッドを融合し、リクエスト別の有効な枝だけを探索する。WeChat
  ChannelsでGMV +1.50%を報告。実験比率はv1の5%からv2の20%へ記述が変わっており、版を区別して読む。
