core_idea:
  author_claim: 著者はCommercial SID、Generation-as-Ranking（GAR）、personalized trieを組み合わせ、商用価値が符号化・探索・配信の途中で失われる問題を抑えると主張する。工業データのHR@100はGPRベースに対して相対37.04%改善した（v2
    表2）。
  research_bot_interpretation: 読む価値は「生成後に高価値広告を探す」前に、価値のある枝を残す設計にある。ただし比較対象は先行する広告GRのGPRであり、複数候補生成器を揃えた従来カスケード全体の削除実験ではない。後段をすべて撤去できた証拠と読むのは広げ過ぎだ。
sections:
  overview: 広告の生成確率が高くても、配信できて収益につながるとは限らない。TencentのUniVAは商用属性をSIDの末尾へ入れ、生成と価値の2ヘッドを融合し、リクエスト別の有効な枝だけを探索する。WeChat
    ChannelsでGMV +1.50%を報告。実験比率はv1の5%からv2の20%へ記述が変わっており、版を区別して読む。
  problem: '広告の内容が似ていても、最適化目標、ROI目標、業種、bidは違う。意味だけのSIDでは同じ葉に価値の違う広告が集まる。さらに生成尤度だけで枝を切ると、高い収益が見込める広告を早い段階で落とす。グローバルな木で候補を出してから配信可否を調べる方式では、無効候補がbeamを消費する。


    UniVAが対象にするのは広告の生成推薦系である。GMVは広告経由の取引総額で、広告主の入札額やプラットフォームの収益そのものとは区別する。'
  why_it_might_work: 商用属性の似た広告を同じ入札分布内で区切れば、末尾tokenの教師信号が混ざりにくい。価値推定をprefixの選択へ戻すと、最後まで生成される前に消えていた枝へ計算を配れる。有効性のmaskは価値を推定せず、探索予算を配信可能な枝へ限定する。この3つは別の失敗を減らすため、組み合わせに意味がある。
  evidence: '### オフラインの増分にはモデル拡張も含まれる


    v2 表2は累積構成の比較だ。CSIDのみの相対HR@100は+5.78%、Sparse MoEまでで+18.40%、eCPM-aware RLとGARを加えると+32.01%、Full
    UniVAで+37.04%。最後の差にはdecoderの62M→80M、8.5G→23.2G FLOPsも含む。GAR単独の寄与へ分解できない。AmazonのIndustrial/Officeでは広告属性がないためCSIDを構築せず、ratingを効用の代理として使う。


    ### 同じbeamでも、無効枝を切る時点で残る数が変わる


    v2 §4.4は同じfused scorer、beam=300で比較し、global探索後のfilterは有効SID 48、personalized trieは300と報告する。平均bidは1.29→11.44。これは有効SID経路数とbidの診断であり、GMVの直接測定でも全リクエストでの保証でもない。


    ### 5%と20%は原論文の版差


    [初版v1 表3](https://arxiv.org/pdf/2605.05803v1)は2026年3月7〜11日、5% traffic、GARなし+1.03%、あり+1.50%
    GMV。指定された[v2 表4・§4.5](https://arxiv.org/pdf/2605.05803v2)は同じ期間を20%と記し、V0 +0.22%、V1
    +0.36%、V2 +1.03%、V3 +1.50%を示す。比率変更の理由は本文から確定できない。v2のV3はPPO化とGAR導入を同時に含む。GMV(normal)はROI広告を除いた指標で、Fullは+1.42%。各値は同時期のproduction
    baselineに対する相対liftである。


    [一次資料：UniVA v2 本文・付録](https://arxiv.org/pdf/2605.05803v2)'
  executable_understanding: '16広告を同じ意味prefixに置き、商用属性2群と群内の等頻度2binで分ける。入札の群内二乗偏差を比較する。別の深さ2の人工木では、生成logitと与えた価値を加え、softmaxの対数を累積してbeamを選ぶ。α、beam幅、事前の有効性maskを変えて、残る経路を表示する。価値は手で与えた説明用の値で、学習済みqではない。


    <div class="paper-probe teaching" data-paper-probe="univa-commercial-sid-gar"><h3>GARの枝選びを操作する</h3><p>合成した木：Aは生成logitが高く、Bは価値が高い。Xは配信不可。深さ2でlog確率を累積する。</p>

