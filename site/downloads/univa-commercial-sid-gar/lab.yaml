  results: 合成16広告の群内分散は675.1875→63.125。意味prefixを固定して商用群を細分化したため小さくなる。人工木ではα=0・beam=1のglobal探索が無効なX/x1を残す一方、personalized探索はA/a1を返す。α=0.5ではpersonalized探索がB/b1へ切り替わる。価値と有効性は独立に効いている。
  what_we_verified: 等頻度binの構成、固定価値を使うGARの加算、prefixごとの正規化、有効prefixのmask、beam幅と経路の関係を実行した。比較の入力と結果はresults.jsonに残す。
  what_we_did_not_verify: RQ-KMeans+、HSTU、MoE/MoR、PPO、MCTS、商用語彙の最適配分は学習・再現していない。実入札、配信filter、eCPM
    simulator、オンラインGMV、遅延、全カスケード削除は未検証。CSID更新に伴うbid変動、長期満足度、公平性も実験していない。
  method: method.md
  mapping: mapping.md
  implementation: '`uv run papers/univa-commercial-sid-gar/run.py` をリポジトリのルートで実行する。Python標準ライブラリのみを使い、CPUで完了する。結果はコードと同じ場所の
    `results.json` に保存する。乱数を使う箇所はseedを固定した。ダウンロードしたrun.pyも単体で動く。'
teaching_figures:
- kind: architecture
  id: csid-anatomy
  title: CSIDの上位は意味、末尾は商用の区分
  after: problem
  locator: 図2・式1–8
  caption: 原論文v2を説明用に再構成。入札binは属性の組の内側で決める。
  rationale: 原論文v2を説明用に再構成。入札binは属性の組の内側で決める。
  rows:
  - label: 意味の2段
    nodes:
    - title: SID₁ / SID₂
      text: multimodal表現 → RQ-KMeans+。粗い意味のまとまりを保つ。
  - label: 商用の末尾
    nodes:
    - title: 属性の組 k
      text: 最適化目標 × ROI目標 × 業種。希少な組はfallbackへ。
    - title: 組ごとのbid分位点
      text: 等頻度binを割り当て、ψ(k, bin)を末尾tokenにする。
  - label: 葉の解決
    nodes:
    - title: 複数広告 → 適格集合
      text: I(x)と交差を取り、残った広告の最大bidで解決する。
  source: https://arxiv.org/pdf/2605.05803v2
- kind: equations
  id: gar-math
  title: 価値を足し、有効な枝で正規化する
  after: method
  locator: v2 式6・16・19・23–24
  caption: 記号を分けて、どの量を学習・計算するかを追う。
  rationale: 記号を分けて、どの量を学習・計算するかを追う。
  steps:
  - name: CSID
    formula: sᴸ = ψ(k, bₖ(bid))
    explanation: 上位L−1段は意味。末尾は属性群と群内binの一組。
  - name: GAR
    formula: ℓ_GAR[a] = o_gen[a] + αₗ qφ(s<l,a;x)
    explanation: qはrequest条件付きの将来return。α=0でもRL済み生成方策は残る。
  - name: 配信
    formula: log π̃(a) = log softmax(ℓ_GAR + mₓ)[a]
    explanation: mₓは有効なら0、無効なら−∞。各prefixで正規化し、log確率の和でbeamを選ぶ。
  - name: RL
    formula: L_RL = L_PPO + λᵥ E[(qφ − Ĝ)²]
    explanation: 終端eCPM由来の固定targetへ回帰。生成方策と価値を同時に学ぶ。
  source: https://arxiv.org/pdf/2605.05803v2
