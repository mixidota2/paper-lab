teaching_figures:
- kind: logic
  id: families
  title: 順位付け・商品生成・一覧生成は別の設計
  after: method
  locator: §3–5
  rationale: 総合報告を1本のパイプラインに誤って直列化しない。
  caption: 3つの用途の整理。BARGEとHiGRは生成方式の選択肢で、常に順番に通す段ではない。
  rows:
  - label: 既存の順位付けを改める
    nodes:
    - title: CCFormer / GenRank
      text: 特徴をtoken化 → 履歴を圧縮・照合 → 商品別スコア
  - label: 生成へ進む2つの選択肢
    nodes:
    - title: BARGE / NTP
      text: 商品IDのtoken列を順に生成。境界と経路を補正。
    - title: HiGR / NSP
      text: 一覧のprefix計画 → 商品ごとの詳細生成。
  - label: 生成に推論情報を供給
    nodes:
    - title: LatentRec / TGR-Reason
      text: オフラインのThinkモデル → 保存したreason token → Genモデル
  source: https://arxiv.org/html/2609.00986
- kind: timeline
  id: reason-refresh
  title: 遅い推論をオンライン経路から外す
  after: method
  locator: §5.2–5.4
  rationale: 処理時間帯の分離が方法の運用上の核心。
  caption: 保存レコードの鮮度とモデル版の整合が前提。近傍更新を即時の推論実行と混同しない。
  rows:
  - label: オフライン
    nodes:
    - title: Thinkモデル
      text: LatentRecの潜在多段学習でreason tokenを作り、版付きレコードに保存。
  - label: オンライン：リクエスト到着
    nodes:
    - title: Genモデル
      text: 保存tokenを読み、履歴やmemoryと合わせて候補を生成。
  - label: 非同期の更新
    nodes:
    - title: Nearline refresh
      text: リクエストを契機に更新を予約。完了前は既存レコードの鮮度を管理する。
  source: https://arxiv.org/html/2609.00986
- kind: equations
  id: generation
  title: 何を生成するかで確率の単位が変わる
  after: method
  locator: §4.1
  rationale: 商品tokenと一覧の目的を区別する。
  caption: 論文のNTP/NSPの違いを記号を整理して表す。Hは履歴、zはID token、Sは一覧。
  steps:
  - name: NTP：IDの次token
    formula: p(z₁,…,zL | H) = ∏ₜ p(zₜ | H,z<t)
    explanation: 早いprefixの誤りが後続へ伝わる。BARGEは商品境界と経路の扱いを改める。
  - name: NSP：一覧全体を対象にする
    formula: S* = argmaxₛ p(S | H)
    explanation: HiGRは粗い一覧計画と局所の商品生成へ分ける。各商品を独立に上位から並べる操作とは目的が異なる。
  source: https://arxiv.org/html/2609.00986
