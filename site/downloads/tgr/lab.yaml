core_idea:
  author_claim: 'CCFormerは順位付けを担う。BARGEは商品内のIDをまとめた文脈を各トークンへ戻すICA、経路全体の整合性を評価するHPR、別の生成経路を持つDPDでID生成の失敗に対処する。HiGRは一覧全体を生成する。TGR-Reasonは推論を事前計算し、圧縮した表現を配信時に参照する。


    [一次資料：§2 / §3.6 / §4.2 / §4.3 / §5](https://arxiv.org/html/2609.00986)'
  research_bot_interpretation: 既存の段構成を捨てるかどうかと、生成モデルを採用するかどうかは別の判断になる。BARGEが候補源の一つとして導入された点は、他の候補源と混ぜながら増分を確かめる設計例として読める。
sections:
  overview: 'TGRは順位付け、商品候補の生成、一覧の生成、事前の推論を分けて設計する。導入箇所と出力形式を押さえると、報告された改善を読み違えにくい。


    このLabでは「生成推薦を、既存システムのどこへ組み込むか」を考える。論文の主張を押さえたうえで、下の図で条件を変え、どこから結論が変わりそうか確かめる。'
  problem: '推薦システムは、候補生成から詳細な順位付けへ順に候補を絞る。各段は使える計算量も、返すものも異なる。候補ごとの点数を返すモデルと、表示する一覧を直接作るモデルは、同じ「生成」という言葉でも交換可能ではない。


    商品を階層的なID列に変えると、モデルが見る単位はトークンになり、利用者が選ぶ商品単位とのずれが生じる。先頭のIDを誤ると、その後を正しく選んでも目的の商品へたどり着けない。'
  why_it_might_work: 商品単位の文脈と経路全体の点検を足せば、局所的にはもっともらしいIDの誤りを減らせると考えられる。ただし探索幅を固定したまま、どの候補を救い、どれを落としたかを見る必要がある。事前推論には古くなった利用者情報をどう更新するかという課題も残る。
  evidence: '§4.2.5はBARGEを候補生成チャネルとして導入した2週間・6%トラフィックのA/B実験を記載する。CTRは+0.60%、総閲覧時間は+1.70%という著者報告。§3.6のCCFormer、§4.3のHiGR、§5の推論部分の結果は別の部品・条件であり、改善率を合算しない。


    [一次資料：§2 / §3.6 / §4.2 / §4.3 / §5](https://arxiv.org/html/2609.00986)'
  executable_understanding: '各ID階層が独立に90%の確率で正しい枝を選ぶ仮定を置き、階層を深くしたときの到達率を計算する。BARGEの改善率を作り込まず、早い段の誤りの蓄積だけを見る。


    実行：`uv run papers/tgr/run.py`。合成データの作り方と比較条件はコード内に記載し、図の全条件の結果を `results.json` へ保存する。'
  results: 図のスライダーは、同じ実験コードが計算した各条件を表示する。初期条件の値を下表に示す。値の大小を論文モデルの優劣へ読み替えない。
  what_we_verified: '**メカニズム：PARTIAL（部分的）**。確認したのは、このLabで明記した仮定の下での計算と条件による変化。原論文の機構全体を確認した意味ではない。


    各ID階層が独立に90%の確率で正しい枝を選ぶ仮定を置き、階層を深くしたときの到達率を計算する。BARGEの改善率を作り込まず、早い段の誤りの蓄積だけを見る。'
  what_we_did_not_verify: IDの到達可能性、候補の重複、多様性、遅いリクエストの応答時間を比較したい。論文の産業データや複数シナリオのA/Bを外部で再検証してはいない。推論の事前計算費用も、配信経路から外れただけでは消えない。
  implementation: '標準ライブラリだけで実行できる。入口は各Labの `run.py`、計算本体は `papers/_toy_common.py` にある。関数は論文IDごとに独立し、ブラウザー用の全条件と初期条件の表を同時に出力する。


    意図して省いたもの：ICA・HPR・DPD、CCFormer、HiGR、事前推論、実機配信。'
  mapping: '| 対象 | 原典とLabの対応 |

    | --- | --- |

    | 原論文 | [§2 / §3.6 / §4.2 / §4.3 / §5](https://arxiv.org/html/2609.00986) |

    | 処理図 | 上記の仕組みを説明用に簡略化。公式実装ではない |

    | 条件探索 | `run.py` → `papers/_toy_common.py` → `results.json` |

    | 公式コード | このLabでは公式コードとの行単位の照合はしていない。 |'
question: 生成推薦を、既存システムのどこへ組み込むか
interactives:
- kind: flow
  title: 処理と設計の違いを追う
  caption: 段を選ぶと説明が切り替わる。比較側は論点を示す簡略化で、統制実験の実装ではない。
  source: https://arxiv.org/html/2609.00986
  stages:
  - title: 候補源を作る
    baseline: 既存の複数候補源
    proposed: BARGEを候補源へ追加
    detail: BARGEは商品IDの生成を改善する。推薦全体を丸ごと置き換えたという意味ではない。
  - title: 候補を採点する
    baseline: 既存の順位付け
    proposed: CCFormerで順位付け
    detail: 入力を統一したTransformerで候補の点数を出す。出力は一覧のID生成と区別する。
  - title: 一覧を考える
    baseline: 商品ごとの判断を集約
    proposed: HiGRで一覧を生成
    detail: 一覧内の関係と位置、生成時間を扱う独立した設計。前段から必ず直列につながる図ではない。
  - title: 推論を渡す
    baseline: 履歴の直接参照
    proposed: 事前推論の表現を参照
    detail: TGR-Reasonは共有の追加情報を提供する。4段は部品の配置を比較する図で、固定の実行順ではない。
- kind: explorer
  title: IDの途中の誤りはどこまで残るか
  caption: 各ID階層が独立に90%の確率で正しい枝を選ぶ仮定を置き、階層を深くしたときの到達率を計算する。BARGEの改善率を作り込まず、早い段の誤りの蓄積だけを見る。
