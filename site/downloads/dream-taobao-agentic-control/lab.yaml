  what_we_verified: '**Mechanism: PARTIAL**。人工条件の計算と境界条件を確認した。results.jsonのCONFIRMEDは小さな計算命題にだけ適用する。原論文の学習済みモデルや産業環境を再現した意味ではない。'
  what_we_did_not_verify: 'GRU・Intent Agent・Qwen3の学習、LLMのstrategy品質、TTL最適化、memory更新、実service replay、端末費用、online
    liftは検証していない。toyの失敗閉鎖はschemaの小部分だけであり、本番の安全性を保証しない。


    **Performance / Scaling / Production applicability: NOT TESTED**。'
  implementation: '標準ライブラリだけの独立した小実験。リポジトリのルートで `uv run papers/dream-taobao-agentic-control/run.py` を実行すると、同じフォルダーの
    `results.json` を更新する。外部APIやモデル取得は不要。UIはその計算済み結果を表示し、別の推定器をJavaScriptで動かさない。


    [実行コード](../downloads/dream-taobao-agentic-control/run.py)・[全結果](../downloads/dream-taobao-agentic-control/results.json)・[README](../downloads/dream-taobao-agentic-control/README.md)・[手法](../downloads/dream-taobao-agentic-control/method.md)・[lab.yaml](../downloads/dream-taobao-agentic-control/lab.yaml)・[対応表](../downloads/dream-taobao-agentic-control/mapping.md)を保存できる。


