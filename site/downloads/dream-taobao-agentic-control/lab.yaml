core_idea:
  author_claim: 著者は、知覚・strategyの編成・監査を可能にするpolicy層を既存cascadeへ重ね、モデルの置換なしにユーザー価値とbusiness指標を改善できると主張する。
  research_bot_interpretation: 学ぶべき境界は、LLMが意図と意味的なactionを提案し、決定的なTool Processが実行可能な設定へ変換する点にある。モデルを変えずに制御可能性を増やせるが、変更可能なmenuが狭ければ効果もその範囲に限られる。
sections:
  overview: DREAMはTaobaoの既存cascadeにintent認識とstrategy制御を重ねる。rerank制御でIPV +2.06%、fine rankまで広げて+2.71%。中心はL0/L1/L2のintent、M1/M2/M3の変換契約、defaultへ戻せる局所overrideである。agent対人の探索能力を揃えた比較ではない。
  problem: 'click最適化の履歴表現だけでは、閲覧から比較、購入へ移るsession内の変化を捉えにくい。しかもretrieval・ranking・rerankingは別の目的や規則を持つ。DREAMはintentを共有し、その解釈を各stageの設定へ配る制御層を足す。


    [AgentX](agentx-kuaishou.html)がcode / DSLの開発を回し、[CORAL](coral-meta-config-harness.html)が予算や設定を継続更新するのに対し、DREAMはユーザー状態に応じたruntimeのstrategyを扱う。[PILOT](pilot-experiment-lifecycle.html)はそのような変更を実験として運営する層に近い。この分類は各システムの責務に基づくLabの整理である。著者は4システムを組み合わせた実装や性能比較を示していない。'
  method: method.md
  why_it_might_work: 【解釈】端末で細かな行動を集め、変化点だけを推論へ送れば、sessionの新しさと推論費用を両立しやすい。nearline cacheとdefaultへの復帰は遅延経路を保護する。ただしgateの見逃しや古いintentの維持には損失があり、報告量の小ささだけでは品質を判断できない。
  evidence: '### 共通baselineに対する、段階を広げた2つのtreatment


    Taobao Homepage Guess You Likeのproduction A/B（§5.1・表7）。rerankのみの制御でPV +1.03%、IPV +2.06%、Core IPV +2.39%、GMV
    +0.88%。fine rankにも広げるとPV +1.04%、IPV +2.71%、Core IPV +3.06%、GMV +1.31%。IPVはitem詳細ページへの帰属visit、Core
    IPVはそのうちcore item、PVは有効な推薦露出event、GMVは帰属した支払済み注文金額。


    後段の+2.71%を前段の+2.06%へ足して+4.77%としない。baselineを100と置いた指数なら102.06と102.71で、差はbaseline比0.65 percentage points、両treatmentの比は約0.637%になる。この算術だけでは、独立した因果効果の標準誤差や有意差は得られない。


    絶対値は機密として省略される。表7には各liftの信頼区間、割付人数、期間の詳細がない。同じintent・MetaModel・guardを用いて制御stageを追加した比較なので、既存cascadeへの制御追加の根拠にはなる。一方、agentと人が同じidea集合を同じ予算で探索したA/Bではなく、LLM自体の純粋な寄与は分離されていない。


    付録B・表11の4B replay-RLはpCTR +2.42%、pIPV −0.99%、pGMV +1.38%など、proxy間で改善の向きも揃わない。offline勝率やproxy scoreを、実測IPVの上昇と同一視しない。


    <figure class="teaching batch18"><h3>累積liftを並べる：baselineは共通</h3><div class="matrix-scroll" tabindex="0"
    role="region" aria-label="比較表"><table><thead><tr><th>指標</th><th>rerank</th><th>rerank + fine rank</th><th>差
    / baseline比pp</th></tr></thead><tbody><tr><td>PV</td><td>+1.03%</td><td>+1.04%</td><td>0.01</td></tr><tr><td>IPV</td><td>+2.06%</td><td>+2.71%</td><td>0.65</td></tr><tr><td>Core
    IPV</td><td>+2.39%</td><td>+3.06%</td><td>0.67</td></tr><tr><td>GMV</td><td>+0.88%</td><td>+1.31%</td><td>0.43</td></tr></tbody></table></div><figcaption>表7。差は表の数値の引き算で、独立A/Bの追加効果推定ではない。</figcaption></figure>


    [一次資料：版を固定したPDF](https://arxiv.org/pdf/2608.09408v3)。図・表・式と実装の対応は末尾のmappingを参照。'
  executable_understanding: '同じ既定設定に、手作りのM2風bundleを与える。有効ならIPVだけを補正し、期限切れ・範囲外・未知field・bool値ならdefaultへ戻す。既定値を全書換えしないことと、失敗したproposalが配信値に漏れないことを確認する。TTL=120、基準重み、予算2はLab独自の小さな条件であり、本番の値ではない。


    閾値0.7を超えるscoreでも予算が尽きれば呼び出さない人工traceも出す。scoreからintent品質やbusiness liftは求めない。replayの同点は報酬0になる。


