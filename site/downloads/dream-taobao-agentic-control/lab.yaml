teaching_figures:
- id: dream-contract
  kind: equations
  title: M3の契約と二値replay報酬
  after: method
  caption: 式の対象と仮定を分けて読む。
  rationale: 演算と制御の境界を具体化する。
  locator: 式9、16–19、24
  steps:
  - name: default + override
    formula: pˢexec = Guardˢ(pˢ₀ ⊕ Tˢ(aᵤ))
    explanation: ⊕はstage局所の上書き。全設定の置換ではない。
  - name: rank補正
    formula: δᵢ=wᵢ⁰bᵢ ; frank=fltr ∏ᵢ(1+δᵢv̂ᵢ)
    explanation: bは−2〜2のsemantic level、v̂は本番で校正した予測値。
  - name: 呼び出し
    formula: a*=1[Δ̂ ≥ λc C + λl L + μ]
    explanation: 推定更新価値が費用・遅延・容量の価格を超えたら呼ぶ。
  - name: offline報酬
    formula: r(x,a)=1[mean(E(strategy)) > mean(E(default))]
    explanation: 同点は0。取引の実測結果をofflineで生成した報酬ではない。
