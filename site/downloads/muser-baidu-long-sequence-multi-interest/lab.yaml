question: 昔の履歴を粗く残し、複数の関心を配信時間内に使えるか
summary: MuSeRはBaiduのretrievalに、時間別の履歴圧縮・6つのinterest query・意味表現・非同期cacheを統合する。homepageの同一A/BでDAU +0.26%、session
  duration +0.89%。圧縮は非圧縮のrecallを完全には保たない。
