teaching_figures:
- kind: equations
  id: history-budget
  title: 1万件を残しながら、入力を1,000 tokenへ縮める
  after: method
  locator: Eqs. 3–6 / Fig. 2
  rationale: 1万件を残しながら、入力を1,000 tokenへ縮める
  caption: 一次資料を説明用に再構成。数値は著者報告であり、Labの追試結果ではない。
  steps:
  - name: early
    formula: 8,000 ÷ 64 = 125 token
    explanation: 古い履歴。pool内の順序は保持しない。
  - name: middle
    formula: 1,200 ÷ 16 = 75 token
    explanation: 中期をほどほどの解像度へ。
  - name: recent
    formula: 800 ÷ 1 = 800 token
    explanation: 直近を細かく保つ。
  - name: 合計
    formula: L꜀ = Nᵣ + (Nₘ−Nᵣ)/16 + (T−Nₘ)/64 = 1,000
    explanation: T=10,000、Nᵣ=800、Nₘ=2,000。全10万件で常に1,000になる式ではない。
  source: https://arxiv.org/pdf/2609.23677v1
