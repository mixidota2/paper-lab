- kind: equations
  id: interest-queries
  title: 複数interestをcandidateに合わせて混ぜる
  after: method
  locator: Eqs. 9–14
  rationale: 複数interestをcandidateに合わせて混ぜる
  caption: 一次資料を説明用に再構成。数値は著者報告であり、Labの追試結果ではない。
  steps:
  - name: 抽出
    formula: uₘ = softmax(qₘ Hᵀ/√d) H
    explanation: M個のqueryが圧縮履歴を読む。
  - name: 候補に応じた混合
    formula: αₘ = softmaxₘ(cos(uₘ,eᵢ)/τ), u = Σₘ αₘuₘ
    explanation: 単一の平均を全候補へ共用しない。
  - name: head重複へのpenalty
    formula: Lorth = (1/M²) Σₘ≠ₙ (uₘᵀuₙ)²
    explanation: 数学的な非相関を促す。意味の解釈可能性を保証しない。
  source: https://arxiv.org/pdf/2609.23677v1
