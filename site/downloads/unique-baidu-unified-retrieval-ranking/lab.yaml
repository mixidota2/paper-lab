  scope: 保存済み一次PDFの本文・式・表を確認。著者報告と合成実験を分離。
core_idea:
  author_claim: 行動feedbackを含むEQNでflat codeを学び、UIGNの利用者prefixとTDNのitem/code targetをearly fusionする。code予測と複数のranking教師を同じ表現へ流し、階層量子化の誤差伝播とretrieval/ranking間の情報損失を抑える。
  research_bot_interpretation: '[Sona](sona-yandex-music.html)のcascade置換、[VARG](varg-tmall-value-generative-retrieval.html)のpre-rank迂回、[LIGE-GR](lige-gr-meta-listwise.html)の追加listwiseとは導入単位が違う。UNIQUEはretrieval段に内側の粗・精rankingを持つ共有モデル。[GenPage](genpage-netflix-homepage.html)や[OGR](ogr-once-generated-ranked.html)の列・page最適化とも区別したい。[UniRec](unirec-chain-of-attribute.html)との共通点は統合だが、何を共有し何を出力するかを比較する必要がある。'
sections:
  overview: Mobile Baiduのhomepage、discovery page、short videoが対象。意味codeを予測して候補を展開した後、user–item内積による粗ranking、候補targetを入れる精rankingが続く。統合されるのは表現と学習・配信部品であり、カタログ全件を一度に精rankingする方式でも、下流の推薦処理をすべて削除した方式でもない。
  problem: RQ-VAE型の階層codeは最初の粗い割当が後段の残差に影響し、人気itemへcode利用が偏る。さらに独立したretrieverとrankerでは、最終判断の教師が候補生成の表現へ届きにくい。flat化だけで目的のずれが消えるわけではないため、codeを学ぶ時点のfeedbackと、ranking教師を共有表現へ返す経路も設計する。
  why_it_might_work: flat codeは階層間の依存を除き、候補codeそのものと利用者履歴を交差させるため、単独user vectorとの内積だけより細かな候補選択が可能になる。target同士を見せないmaskは、候補をまとめて計算しながら他候補の混入を避ける。ただしcode数分のscore計算、candidate
    fan-out、code/item更新の同期が必要になる。均衡化は意味的な最近傍を変えうるので、分散が下がったことだけで推薦の質を結論しない。
  evidence: '[一次資料PDF §4 / Tables 2–6](https://arxiv.org/pdf/2609.23718v1) の著者報告。


    | 評価 | 結果 | 条件 |

    | --- | --- | --- |

    | オンライン | watch +0.96%、distribution +1.08%、retention +0.70% | Mobile Baidu、1週間、旧production retrieval比、内部検定p<0.05
    |

    | 配信 | P80 35 ms / P99 89 ms、MFU 44.23% | 約400 NVIDIA L20、1 instance/GPU、TensorRT FP16 |

    | peak | 約10,000 QPS、平均37 ms | retrieval service、全推薦応答のlatencyとは同一視しない |

    | KuaiRand-Pure | HR@50 0.1510、CTR-AUC 0.7252 | 27,285 users、7,583 items、時系列leave-one-out |

    | flat→階層へ置換 | HR@50 0.1421、AUC 0.7190 | Table 3、他lossと設定を維持 |

    | codebook | item数の分散1510.85→389.57、top-1 category share 65.43→78.08% | production、同容量16,384 code |


    early fusionを外すとHR@50 0.1398、generative objectiveを外すと0.1374。全要素の寄与は見えるが、同じA/Bで個別要素の因果効果まで分離してはいない。新規userのwatch
    +1.44%、高activity +1.11%に対し低activityは+0.29%。集計改善を全利用者の同じ便益と読まない。


    本文§1は導入をFebruary、§4.1.2はJanuary 2026とし、開始月に不整合がある。ここでは月を確定しない。traffic割付比や信頼区間、MFUの算定内訳は明記されず、89 msを他方式と同一hardware・同一負荷の比較値にはしない。'
  executable_understanding: '`uv run papers/unique-baidu-unified-retrieval-ranking/run.py`。2次元の正規化itemと4 codeでEq.
    11の距離補正を動かす。別の小計算ではtargetがprefixだけを見るattentionと、別targetも混ぜるattentionを比較し、無関係なtargetの追加が既存scoreを変えるか確認する。学習済みUNIQUEやRQ-VAEの優劣を測る実験ではない。'
  results: results.jsonはτ=0とτ=1の割当、元の距離、補正後の距離を記録する。人工頻度を与えると候補codeが切り替わり、均衡化には距離の代償があることが見える。prefixのみ参照するtarget出力は別target追加で不変、targetを混ぜた対照は変化する。これをHR/AUCの改善へ読み替えない。
  what_we_verified: Mechanism PARTIAL。Eq. 11のτ=0が通常の最近傍へ戻ること、正の頻度倍率による割当変化、target-to-prefixの他候補からの独立性を人工値で確認した。これらの局所条件はCONFIRMED。モデル全体のearly
    fusionの効果は未検証。
  what_we_did_not_verify: Performance / Scaling / Production applicability NOT TESTED。DSSMの学習、EMA codebookの収束、RQ-VAEとの公平比較、GPU
    MFU、A/Bは実行していない。全codeのscore費用や、同じcodeへ属するitem数の偏りがtail latencyへ与える影響も未測定。
  implementation: '`assign()`は正規化済みitemとcodeの距離へ相対使用率のτ乗を掛ける。`attention()`は学習projectionを恒等写像にした単頭attention。教師なしの4
    codeだけなので、productionのflat化による分散低下は再現対象外。'
