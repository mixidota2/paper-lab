question: 実験を自動で続ける仕組みは、誤った改善まで積み上げないか
summary: AutoLRは推薦改善の調査からオフライン候補の提出までを自動化する。オンラインA/Bへの投入とLaunch Reviewは人が判断する。採択した測定値とコードを次の基準にするKEEPには、ノイズを進歩として固定する危険がある。
