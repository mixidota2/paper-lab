core_idea:
  author_claim: '著者はDASHENの2推薦場面で1,586件の完了評価を監査し、9件の本番Launch Reviewを報告した。専門家Council、証拠に基づく決定的な候補選択、層に分けた知識を組み合わせる一方、KEEPによる非再現的な改善の累積を問題として特定した。


    [一次資料：arXiv v1 本文](https://arxiv.org/pdf/2609.04871v1)'
  research_bot_interpretation: 価値は「多数のエージェント」より、提案と確定操作の権限を分け、過去の失敗を次の選択へ戻す設計にある。ただしCouncilやselectorの単独効果を同じ予算の対照実験で示した研究ではない。自動化の成功と、採択規則の妥当性は別々に監査したい。
sections:
  overview: AutoLRは推薦改善の調査からオフライン候補の提出までを自動化する。オンラインA/Bへの投入とLaunch Reviewは人が判断する。採択した測定値とコードを次の基準にするKEEPには、ノイズを進歩として固定する危険がある。
  problem: 推薦モデルの改善は、論文を読むだけでもコードを書くだけでも完了しない。実装、訓練、ログ調査、オフライン評価を数日にわたってつなぎ、次の実験が使う基準を管理する必要がある。AutoLRが扱うのは、この長い開発過程だ。利用者へ直接推薦するLLMではない。
  method: method.md
  why_it_might_work: 有限の候補windowと機械的な検証は、モデルの提案を実行可能な範囲へ制限する。過去の失敗を残せば同じ無効案への再投資も減らせそうだ。一方、採択されたノイズがmemoryへ成功例として戻ると、次の提案まで偏る。記録を増やすだけでは信頼性は上がらず、どの証拠でtrunkを変えるかが要になる。
  evidence: '### 本番の記録はあるが、効果を一つに合算できない

    単列／2列feedと没入型video feedの記録を、実験pathの重複を除いて1,586件に整理した。9件のLaunch Reviewの相対liftを算術的に足すと、消費浸透率+5.75%、消費時間+10.83%、有効閲覧数VV+5.55%になる（§5、表1）。異なる施策・母集団の記述的な和であり、利用者全体への処置効果でも、複利の増加率でもない。


    通常iterationのAPI費はRMB 3–4と報告する。Claude Opus級からDeepSeek-V4-Pro/Flashの混成へ移行した後の観測で、2026年8月17日より前のAPI価格に基づく。モデル訓練計算と社内基盤費は含めない。harnessやloopも同時に変わっており、モデル変更だけの節約効果は識別できない。


    KEEP監査では過去の閾値情報が揃わず、10⁻³を共通の参照値として再評価した。これは各実験で実際に使われた閾値の復元ではない。欠けたguardrail payloadも「違反なし」と補完しない（§5.3、表2）。


    [一次資料：arXiv v1 本文](https://arxiv.org/pdf/2609.04871v1)'
  executable_understanding: '真の改善がゼロの候補を100回提案する。1回のノイズ付き差分が0.001を越えたら採択し、その差分を累積してtrunk IDを更新する規則と、独立25回の確認評価を追加する規則を比べる。200seedで同じノイズ列を両規則に渡す。


    追加gateはLabの例で、AutoLRの稼働実装ではない。表示するのは採択差分の和であり、同じ評価集合で直接測ったAUCの推移とは区別する。'
  results: 下表は200seedの平均。one_run_keepの見かけの累積改善が正でも、全候補の真の改善はゼロのままだ。追加確認を使うrepeat_evidence_gateと、偽のKEEPを一度でも起こしたrun数を比較する。
  what_we_verified: 真値が改善しなくても、採択差分の累積は単調に増え、コード系譜が更新される。独立した再評価にはその上昇が引き継がれない。追加証拠のgateで偽のKEEPが減るかを、全seedの件数と平均で確認する。
  what_we_did_not_verify: 実DASHENの指標分布、候補生成、Council、GPU訓練、オンライン効果は未検証。toyの正規ノイズと独立反復は理想化で、共有データを繰り返し見る適応的過学習を表していない。反復評価gateだけで永続的な安全性を保証しない。実運用では校正profileの版、guardrail、確認後のcommitとrollbackまで設計する必要がある。
  implementation: 'リポジトリのルートで `uv run papers/autolr-dashen/run.py` を実行する。Python標準ライブラリだけを使い、CPUで完了する。結果は同じディレクトリの
    `results.json` に保存する。


    乱数を使う実験はseedを固定した。数値は論文の測定値と別に集計している。'
  mapping: mapping.md
