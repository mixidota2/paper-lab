question: 候補生成から最終順位まで、長い履歴を一度だけ読んで決められるか
summary: Sonaは8,192件の履歴を共有し、深い処理を直近2,048件へ集中する。My Vibeの各群15%・7日A/BでAU +4.53%。全流量展開とcatalog coverageは未解決。
