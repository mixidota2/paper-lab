  steps:
  - name: 正例SIDの生成
    formula: L = L_NTP + L_rollout + L_impression
    explanation: NTPはpositive impressionsのみ。
  - name: 候補源ごとの平均
    formula: L_source = Σ_head mean_c |RM(c) − Teacher(c)|
    explanation: rolloutとimpressionは別々に平均する。教師は凍結。
  - name: 教師との順序一致
    formula: TeacherRecall@k = |Topk(RM) ∩ Topk(Teacher)| / k
    explanation: 同じ生成候補pool内で測る。catalog全体の正解recallとは異なる。
