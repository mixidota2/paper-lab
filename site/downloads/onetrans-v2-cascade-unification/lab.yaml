core_idea:
  author_claim: 段階ごとのトークンと候補特徴を保ちつつ、ユーザー履歴を一度符号化する。DCGRは複数の検索目的を決定接頭辞で表し、業務上の重みを生成時に加える。
  research_bot_interpretation: 本ライブラリでは「段階を保つ統合」に位置づける。Sona/OneRec型の段階廃止、UNIQUEの早期融合、VARGの粗い順位付けの迂回とは、統合する境界が異なる。この分類はLabの整理であり、これらとの同条件の優劣は示していない。
sections:
  overview: OneTrans-V2は検索・粗い順位付け・精密な順位付けを残し、ユーザー文脈とTransformerを共有する。著者はオンラインGMV/user
    +9.74%、同じハードウェア予算で3.2倍のQPSを報告する。
  problem: 段階別モデルは同じユーザー履歴を繰り返し符号化し、学習信号も分断する。一方、全段階に最も重い候補特徴を使えば費用が膨らむ。共有する文脈と段階固有の処理を分ける必要がある。
  why_it_might_work: 解釈：同一要求の履歴計算を共有すると重複を減らせる。精密な順位付けから粗い順位付けへ知識を蒸留すれば、候補を早期に落とす判断も合わせやすい。ただし3.2倍のQPSには配信側の共同設計が含まれ、キャッシュ単独の寄与ではない。
  evidence: '一次資料[Table 2・§6.3](https://arxiv.org/pdf/2609.28589) の著者報告。


    | 評価 | 比較と結果 | 範囲 |

    | --- | --- | --- |

    | 検索HR@1 | OneTrans-GR 0.0545 → V2L 0.0923 | オフライン |

    | GMV/user | +9.74% | 全段階を置換したオンラインA/B |

    | ユーザーの活動日数 | +0.25% | 同A/B |

    | QPS | 3.2倍 | 同じハードウェア予算、配信設計込み |

    | GFLOPs | V2S 239 / 分業方式275 | V2LのHR値と規模を混同しない |


    DCGR単独のチャネル比較（Table 4）のGMV +48.0%は、システム全体の+9.74%と分母が異なる。SNTの学習高速化4.4倍も、配信QPSとは別の測定である。'
  method: method.md
  executable_understanding: '`uv run papers/onetrans-v2-cascade-unification/run.py`。標準ライブラリだけで実行でき、同じフォルダーのresults.jsonを更新する。


    rank()でβを0・0.5・1・2に変え、同じ候補の決定確率・商品確率を固定したまま順位を計算する。文脈計算100、段階処理10+20+30という人工の費用も、3回符号化する場合と1回共有する場合で比較する。'
  results: β=0ではA、β=1ではB、β=2ではCが首位になる。人工の計算費用は360から160へ減るが、これは2.25倍という仮定上の比であり、実測3.2倍の説明や再現ではない。
  what_we_verified: CONFIRMED：β=0で確率順へ戻ることと、加点による候補順位の変化。MechanismはPARTIAL。
  what_we_did_not_verify: Performance / Scaling / Production applicabilityはNOT TESTED。Transformer、MoE、SNT、学習されたsemantic
    ID、段階間蒸留、GPUキャッシュ、オンラインA/Bは実行していない。
  implementation: rank() → 式(4)の全候補得点。cache_cost → Figure 2の共有の教育用費用計算。公式のモデル学習・配信コードには対応させていない。
  mapping: mapping.md
