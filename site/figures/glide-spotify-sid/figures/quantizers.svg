<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 665" role="img" aria-labelledby="title desc"><title id="title">量子化の選択は衝突後の候補にも効く</title><desc id="desc">§5.2.2・表2の報告値。R-KMeansの採用はこの運用条件での判断で、一般的な優劣を保証しない。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#26745f"/></marker></defs><rect width="560" height="665" fill="#fbfcf7"/><g font-family="sans-serif"><text x="22" y="35" font-size="25" fill="#183c35" font-weight="bold">同じ内容embeddingからの分岐</text><rect x="25" y="65" width="510" height="75" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="41" y="97" font-size="22" fill="#183c35" font-weight="bold">タイトル・説明 → 内容ベクトル</text><path d="M160,140 L150,178" stroke="#26745f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M400,140 L410,178" stroke="#26745f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="22" y="190" width="246" height="193" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="38" y="222" font-size="22" fill="#183c35" font-weight="bold">R-KMeans</text><text x="38" y="252" font-size="19" fill="#183c35" font-weight="normal">残差 → 最近傍重心</text><text x="38" y="279" font-size="19" fill="#183c35" font-weight="normal">重心を引き、次段へ</text><text x="38" y="306" font-size="19" fill="#183c35" font-weight="normal">元の内容空間を近似</text><text x="38" y="333" font-size="19" fill="#183c35" font-weight="normal">本番採用</text><rect x="292" y="190" width="246" height="193" rx="12" fill="#eaf0f8" stroke="#183c35" stroke-width="1.3"/><text x="308" y="222" font-size="22" fill="#183c35" font-weight="bold">RQ-VAE</text><text x="308" y="252" font-size="19" fill="#183c35" font-weight="normal">学習した潜在空間</text><text x="308" y="279" font-size="19" fill="#183c35" font-weight="normal">学習codebookで離散化</text><text x="308" y="306" font-size="19" fill="#183c35" font-weight="normal">再構成などの目的</text><text x="308" y="333" font-size="19" fill="#183c35" font-weight="normal">調整・使用率が課題</text><text x="28" y="425" font-size="21" fill="#183c35" font-weight="bold">同じSID内の平均cosine類似度（表2）</text><text x="28" y="467" font-size="21" fill="#183c35" font-weight="normal">R-KMeans</text><text x="434" y="467" font-size="21" fill="#183c35" font-weight="normal">0.856</text><rect x="28" y="479" width="500" height="16" fill="#dce4d9"/><rect x="28" y="479" width="428.0" height="16" fill="#26745f"/><text x="28" y="536" font-size="21" fill="#183c35" font-weight="normal">RQ-VAE</text><text x="434" y="536" font-size="21" fill="#183c35" font-weight="normal">0.657</text><rect x="28" y="548" width="500" height="16" fill="#dce4d9"/><rect x="28" y="548" width="328.5" height="16" fill="#26745f"/><text x="28" y="603" font-size="19" fill="#183c35" font-weight="normal">0〜1の共通尺度。衝突があるbucketに限る。</text><text x="28" y="634" font-size="19" fill="#183c35" font-weight="normal">collapseをtoyで再現した比較ではない。</text></g></svg>
