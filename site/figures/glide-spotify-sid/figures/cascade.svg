<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 658" role="img" aria-labelledby="title desc"><title id="title">生成器は追加の候補経路になる</title><desc id="desc">§4.4・§5.3の処置を再構成。候補の採用比率と発見の因果効果は別の量。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#26745f"/></marker></defs><rect width="560" height="658" fill="#fbfcf7"/><g font-family="sans-serif"><text x="22" y="35" font-size="25" fill="#183c35" font-weight="bold">候補は合流し、既存rankerで競う</text><rect x="22" y="68" width="246" height="120" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="38" y="100" font-size="22" fill="#183c35" font-weight="bold">既存の候補経路</text><text x="38" y="130" font-size="19" fill="#183c35" font-weight="normal">従来の取得候補</text><text x="38" y="157" font-size="19" fill="#183c35" font-weight="normal">処置群でも使う</text><rect x="292" y="68" width="246" height="120" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="308" y="100" font-size="22" fill="#183c35" font-weight="bold">GLIDE経路</text><text x="308" y="130" font-size="19" fill="#183c35" font-weight="normal">文脈 → SID生成</text><text x="308" y="157" font-size="19" fill="#183c35" font-weight="normal">SID → episode ID</text><path d="M145,188 L220,241" stroke="#26745f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M415,188 L340,241" stroke="#26745f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="70" y="250" width="420" height="113" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="86" y="282" font-size="22" fill="#183c35" font-weight="bold">同じ候補poolへ追加</text><text x="86" y="312" font-size="19" fill="#183c35" font-weight="normal">SID衝突を解決・候補の資格を判定</text><text x="86" y="339" font-size="19" fill="#183c35" font-weight="normal">経路の重複と採用を追う</text><path d="M280,363 L280,400" stroke="#26745f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="70" y="411" width="420" height="90" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="86" y="443" font-size="22" fill="#183c35" font-weight="bold">既存の下流episode ranker</text><text x="86" y="473" font-size="19" fill="#183c35" font-weight="normal">他経路の候補と一緒に採点・順位付け</text><path d="M280,501 L280,538" stroke="#26745f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="135" y="548" width="290" height="83" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="151" y="580" font-size="22" fill="#183c35" font-weight="bold">Homeの推薦</text><text x="151" y="610" font-size="19" fill="#183c35" font-weight="normal">発見の増分はA/Bで測る</text></g></svg>
