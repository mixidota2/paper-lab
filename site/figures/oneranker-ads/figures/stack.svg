<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 585" role="img" aria-labelledby="title"><title id="title">生成とランキングの接続</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#53758b"/></marker></defs><rect width="440" height="585" rx="12" fill="#f5f8fb"/><g font-family="sans-serif" fill="#183447"><text x="20" y="30" font-size="20" fill="#183447">基準系：生成 → 別学習ランカー</text><rect x="20" y="48" width="400" height="60" rx="9" fill="#e0edf2"/><text x="32" y="73" font-size="16" fill="#183447">候補だけを渡す</text><text x="32" y="96" font-size="16" fill="#183447">生成の途中状態を共有しない</text><text x="20" y="147" font-size="20" fill="#183447">OneRanker：3段を接続</text><rect x="20" y="166" width="320" height="65" rx="9" fill="#e0edf2"/><text x="32" y="191" font-size="16" fill="#183447">Step 1 · 履歴 → 複数の興味表現</text><path d="M180 232L180 255" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="259" width="320" height="92" rx="9" fill="#e0edf2"/><text x="32" y="284" font-size="16" fill="#183447">Step 2 · Task + Fake Item Tokens</text><text x="32" y="307" font-size="16" fill="#183447">興味／価値の別ヘッドでSID生成</text><text x="32" y="330" font-size="16" fill="#183447">中心との照合で粗い対象意識</text><path d="M180 352L180 379" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="382" width="320" height="85" rx="9" fill="#e0edf2"/><text x="32" y="407" font-size="16" fill="#183447">Step 3 · 実候補 + ranking token</text><text x="32" y="430" font-size="16" fill="#183447">Step 1 / 2 のKVを再利用</text><text x="32" y="453" font-size="16" fill="#183447">候補ごとの価値スコア</text><path d="M345 426L395 426L395 300L345 300" fill="none" stroke="#b95a43" stroke-width="3" marker-end="url(#arrow)"/><text x="356" y="369" font-size="18" fill="#b95a43">DC</text><text x="20" y="510" font-size="16" fill="#183447">DC：候補集合内の教師分布を戻す</text><text x="20" y="540" font-size="16" fill="#183447">Gryphon-v2の全カスケード置換とは</text><text x="20" y="563" font-size="16" fill="#183447">比較基準も、示している範囲も違う。</text></g></svg>