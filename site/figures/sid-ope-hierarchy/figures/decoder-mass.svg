<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 460" role="img" aria-labelledby="title desc"><title id="title">群の確率はtoken確率の積</title><desc id="desc">群の確率はtoken確率の積。説明と出典はLab本文と図注を参照。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217661"/></marker></defs><rect width="440" height="460" rx="12" fill="#fafcf7"/><rect x="20" y="20" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="48" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">decoderが出す条件付き確率</text><text x="34" y="77" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">P(c₁=0)=0.4</text><text x="34" y="102" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">P(c₂=1 | c₁=0)=0.25</text><path d="M220,124 L220,148" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="158" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="186" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">接頭辞01の確率</text><text x="34" y="215" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">P(01)=0.4 × 0.25 = 0.10</text><text x="34" y="240" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">01の下にある全商品の確率和と一致</text><text x="20" y="323" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">数値は説明用。正規化treeを仮定。</text><text x="20" y="348" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">flatな群では葉の確率和が必要になる。</text><text x="20" y="373" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">木の利点：群を安く評価できる。</text></svg>
