<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 682" role="img" aria-labelledby="title desc"><title id="title">SIDの3役は同じ保証ではない</title><desc id="desc">§2–3を踏まえた概念図。粗い組織化を保つことと、完全SIDや細かな近傍を保つことを分ける。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#26745f"/></marker></defs><rect width="560" height="682" fill="#fbfcf7"/><g font-family="sans-serif"><text x="22" y="35" font-size="23" fill="#183c35" font-weight="bold">近い点でも、境界を越えると番号は変わる</text><rect x="30" y="75" width="250" height="200" fill="#e5f1e8"/><rect x="280" y="75" width="250" height="200" fill="#eaf0f8"/><path d="M280 75V275" stroke="#315e94" stroke-width="3" stroke-dasharray="7 5"/><text x="48" y="107" font-size="21" fill="#183c35" font-weight="normal">SID側の領域A</text><text x="304" y="107" font-size="21" fill="#183c35" font-weight="normal">領域B</text><circle cx="249" cy="171" r="8" fill="#26745f"/><circle cx="297" cy="185" r="8" fill="#315e94"/><circle cx="232" cy="209" r="8" fill="#26745f"/><circle cx="321" cy="146" r="8" fill="#315e94"/><circle cx="245" cy="143" r="8" fill="#26745f"/><circle cx="336" cy="220" r="8" fill="#315e94"/><path d="M249,171 L290,183" stroke="#26745f" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="48" y="252" font-size="19" fill="#183c35" font-weight="normal">同じ事実の順序変更 → 小さな移動</text><text x="30" y="320" font-size="19" fill="#183c35" font-weight="normal">概念図。点・距離・境界は合成。</text><rect x="25" y="347" width="510" height="91" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="41" y="379" font-size="22" fill="#183c35" font-weight="bold">① 組織化</text><text x="41" y="409" font-size="19" fill="#183c35" font-weight="normal">近いアイテムを同じprefixへ集める</text><rect x="25" y="456" width="510" height="91" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="41" y="488" font-size="22" fill="#183c35" font-weight="bold">② 個体の識別</text><text x="41" y="518" font-size="19" fill="#183c35" font-weight="normal">完全SIDの一致は連続近傍の一致と別</text><rect x="25" y="565" width="510" height="91" rx="12" fill="#e5f1e8" stroke="#183c35" stroke-width="1.3"/><text x="41" y="597" font-size="22" fill="#183c35" font-weight="bold">③ 探索中の選択</text><text x="41" y="627" font-size="19" fill="#183c35" font-weight="normal">prefixを捨てると、その下の候補も消える</text></g></svg>
