<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 690" role="img" aria-labelledby="title desc"><title id="title">採択と復元が分かれる研究ループ</title><desc id="desc">採択と復元が分かれる研究ループ。詳細は図の説明と本文を参照。</desc><rect width="440" height="690" rx="16" fill="#f4f7f6"/><g font-family="sans-serif" fill="#163b40"><text x="22" y="33" font-size="20" fill="#163b40">採択と復元が分かれる研究ループ</text><text x="22" y="62" font-size="14" fill="#163b40">RecEvolve / Algorithm 1</text><rect x="20" y="83" width="400" height="81" rx="9" fill="#dfede8"/><text x="33" y="112" font-size="18" fill="#163b40">01 仮説と批評</text><text x="33" y="141" font-size="15" fill="#163b40">Ideator ↔ Critic / 履歴を注入</text><path d="M220 166 L220 182" fill="none" stroke="#628287" stroke-width="2"/><rect x="20" y="186" width="400" height="81" rx="9" fill="#dfede8"/><text x="33" y="215" font-size="18" fill="#163b40">02 事前検証</text><text x="33" y="244" font-size="15" fill="#163b40">失敗 → VCS rollback</text><path d="M220 269 L220 285" fill="none" stroke="#628287" stroke-width="2"/><rect x="20" y="289" width="400" height="81" rx="9" fill="#dfede8"/><text x="33" y="318" font-size="18" fill="#163b40">03 branch → 分散job</text><text x="33" y="347" font-size="15" fill="#163b40">FAILED → logを知識へ → rollback</text><path d="M220 372 L220 388" fill="none" stroke="#628287" stroke-width="2"/><rect x="20" y="392" width="400" height="81" rx="9" fill="#dfede8"/><text x="33" y="421" font-size="18" fill="#163b40">04 指標を取り出す</text><text x="33" y="450" font-size="15" fill="#163b40">主指標の改善 ∧ 補助指標の条件</text><rect x="20" y="500" width="193" height="103" rx="9" fill="#c9e7db"/><rect x="226" y="500" width="194" height="103" rx="9" fill="#f3e3d3"/><text x="33" y="528" font-size="17" fill="#163b40">条件を満たす</text><text x="33" y="555" font-size="17" fill="#163b40">VCS commit</text><text x="33" y="581" font-size="16" fill="#163b40">KEEP・基準更新</text><text x="239" y="528" font-size="16" fill="#163b40">条件を満たさない</text><text x="239" y="555" font-size="17" fill="#163b40">VCS rollback</text><text x="239" y="581" font-size="16" fill="#163b40">最良状態へ戻す</text><path d="M115 608 L115 630" fill="none" stroke="#628287" stroke-width="2"/><path d="M324 608 L324 630" fill="none" stroke="#628287" stroke-width="2"/><path d="M115 630 L324 630" fill="none" stroke="#628287" stroke-width="2"/><text x="45" y="660" font-size="18" fill="#163b40">記録を残し、次の仮説へ戻る ↺</text></g></svg>
