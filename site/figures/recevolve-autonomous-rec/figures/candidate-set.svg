<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 463" role="img" aria-labelledby="title desc"><title id="title">scoreが同じでも、競争相手が減る</title><desc id="desc">scoreが同じでも、競争相手が減る。詳細は図の説明と本文を参照。</desc><rect width="440" height="463" rx="16" fill="#f4f7f6"/><g font-family="sans-serif" fill="#163b40"><text x="22" y="33" font-size="20" fill="#163b40">scoreが同じでも、競争相手が減る</text><text x="22" y="62" font-size="16" fill="#163b40">8k → 1k / in-batch negatives</text><rect x="20" y="83" width="400" height="122" rx="9" fill="#e5e9f0"/><text x="32" y="110" font-size="17" fill="#163b40">8,000候補 = 正例1 + 負例7,999</text><circle cx="35" cy="136" r="4" fill="#6f839c"/><circle cx="56" cy="136" r="4" fill="#6f839c"/><circle cx="77" cy="136" r="4" fill="#6f839c"/><circle cx="98" cy="136" r="4" fill="#6f839c"/><circle cx="119" cy="136" r="4" fill="#6f839c"/><circle cx="140" cy="136" r="4" fill="#6f839c"/><circle cx="161" cy="136" r="4" fill="#6f839c"/><circle cx="182" cy="136" r="4" fill="#6f839c"/><circle cx="203" cy="136" r="4" fill="#6f839c"/><circle cx="224" cy="136" r="4" fill="#6f839c"/><circle cx="245" cy="136" r="4" fill="#6f839c"/><circle cx="266" cy="136" r="4" fill="#6f839c"/><circle cx="287" cy="136" r="4" fill="#6f839c"/><circle cx="308" cy="136" r="4" fill="#6f839c"/><circle cx="329" cy="136" r="4" fill="#6f839c"/><circle cx="350" cy="136" r="4" fill="#6f839c"/><circle cx="371" cy="136" r="4" fill="#6f839c"/><circle cx="392" cy="136" r="4" fill="#6f839c"/><circle cx="35" cy="159" r="4" fill="#6f839c"/><circle cx="56" cy="159" r="4" fill="#6f839c"/><circle cx="77" cy="159" r="4" fill="#6f839c"/><circle cx="98" cy="159" r="4" fill="#6f839c"/><circle cx="119" cy="159" r="4" fill="#6f839c"/><circle cx="140" cy="159" r="4" fill="#6f839c"/><circle cx="161" cy="159" r="4" fill="#6f839c"/><circle cx="182" cy="159" r="4" fill="#6f839c"/><circle cx="203" cy="159" r="4" fill="#6f839c"/><circle cx="224" cy="159" r="4" fill="#6f839c"/><circle cx="245" cy="159" r="4" fill="#6f839c"/><circle