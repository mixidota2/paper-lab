<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 470" role="img" aria-labelledby="title desc"><title id="title">教師にだけ、未来の6 tokenを足す</title><desc id="desc">教師にだけ、未来の6 tokenを足す。詳細は図の説明と本文を参照。</desc><rect width="440" height="470" rx="16" fill="#f4f7f6"/><g font-family="sans-serif" fill="#163b40"><text x="22" y="33" font-size="20" fill="#163b40">教師にだけ、未来の6 tokenを足す</text><text x="22" y="63" font-size="14" fill="#163b40">OxygenREC-v2 / Appendix E</text><rect x="18" y="88" width="404" height="105" rx="9" fill="#dfede8"/><text x="30" y="113" font-size="17" fill="#163b40">Student · 配信する方策</text><text x="30" y="142" font-size="18" fill="#163b40">BOS → Iₛ → Iᵣ → Iᵦ</text><text x="30" y="171" font-size="16" fill="#163b40">SIDを生成</text><rect x="18" y="217" width="404" height="105" rx="9" fill="#f3e3d3"/><text x="30" y="242" font-size="17" fill="#163b40">Teacher · 訓練時のみ</text><text x="30" y="271" font-size="18" fill="#163b40">BOS → Iₛ → Iᵣ → Iᵦ</text><text x="30" y="300" font-size="16" fill="#163b40">同じ軌跡を評価</text><text x="250" y="271" font-size="16" fill="#163b40">→ F（2商品）</text><path d="M217 328 L217 348" fill="none" stroke="#628287" stroke-width="2"/><text x="22" y="373" font-size="17" fill="#163b40">低entropy → advantage付きSD</text><text x="22" y="403" font-size="16" fill="#163b40">高entropy → teacher ∥ student のKL</text><text x="22" y="439" font-size="15" fill="#163b40">共有backbone。Fはstudentへ渡さない。</text></g></svg>
