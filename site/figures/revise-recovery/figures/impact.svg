<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" role="img" aria-labelledby="title desc"><title id="title">実行順の後半より、依存の枝をたどる</title><desc id="desc">Lab の6ノード DAG。赤は budget 変更の影響範囲。青緑の枝は有効性を確認できるときだけ保持する。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#59717f"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#193743;font-size:20px}.small{font-size:17px}.head{font-size:25px;font-weight:700}.edge{stroke:#59717f;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="640" height="540" rx="18" fill="#f3f7f8"/><text x="24" y="38" class="head">変更 Δ={budget} → A, C, F が無効</text><rect x="24" y="68" width="180" height="65" rx="10" fill="#f3cfca"/><text x="40" y="98" class="">A：budget</text><rect x="230" y="68" width="180" height="65" rx="10" fill="#dbeceb"/><text x="246" y="98" class="">B：city</text><rect x="436" y="68" width="180" height="65" rx="10" fill="#dbeceb"/><text x="452" y="98" class="">E：style</text><path class="edge" d="M114,133 L114,207"/><path class="edge" d="M320,133 L320,207"/><rect x="24" y="214" width="180" height="65" rx="10" fill="#f3cfca"/><text x="40" y="244" class="">C：Aを読む</text><rect x="230" y="214" width="180" height="65" rx="10" fill="#dbeceb"/><text x="246" y="244" class="">D：Bを読む</text><path class="edge" d="M114,279 L260,350"/><path class="edge" d="M320,279 L320,350"/><path class="edge" d="M526,133 L390,350"/><rect x="230" y="358" width="180" height="65" rx="10" fill="#f3cfca"/><text x="246" y="388" class="">F：結合</text><text x="24" y="460" class="">順序 A,B,C,D,E,F の suffix は6個を再計算。</text><text x="24" y="495" class="">selective は3個。B,D,E は再利用または継続。</text></svg>