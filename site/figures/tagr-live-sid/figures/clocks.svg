<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 655" role="img" aria-labelledby="title"><title id="title">対象・意図・方策の更新周期</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#53758b"/></marker></defs><rect width="440" height="655" rx="12" fill="#f5f8fb"/><g font-family="sans-serif" fill="#183447"><text x="20" y="30" font-size="22" fill="#183447">TAGRの3つの時間軸</text><rect x="20" y="50" width="400" height="136" rx="9" fill="#e0edf2"/><text x="32" y="75" font-size="16" fill="#183447">対象の更新 · 毎分</text><text x="32" y="98" font-size="16" fill="#183447">scene + products → 固定語彙へ再割当</text><text x="32" y="121" font-size="16" fill="#183447">LiveID A : (a,b,c) → (a,d,e)</text><text x="32" y="144" font-size="16" fill="#183447">LSID ↔ LiveID 索引へ数秒で伝播</text><rect x="20" y="205" width="400" height="135" rx="9" fill="#e0edf2"/><text x="32" y="230" font-size="16" fill="#183447">意図の更新 · 新しい行動が来た時</text><text x="32" y="253" font-size="16" fill="#183447">入室：stride 1 / 2 / 10でブロック化</text><text x="32" y="276" font-size="16" fill="#183447">like / cart / order：別々に符号化</text><text x="32" y="299" font-size="16" fill="#183447">長期profileと一緒にdecoderへ</text><text x="30" y="376" font-size="18" fill="#183447">方策の更新 · warm-up → 間欠RL</text><rect x="20" y="394" width="61" height="43" rx="9" fill="#cbe6df"/><text x="32" y="419" font-size="16" fill="#183447">NTP</text><rect x="88" y="394" width="61" height="43" rx="9" fill="#cbe6df"/><text x="100" y="419" font-size="16" fill="#183447">NTP</text><rect x="156" y="394" width="61" height="43" rx="9" fill="#f1d7bf"/><text x="168" y="419" font-size="16" fill="#183447">RL</text><rect x="224" y="394" width="61" height="43" rx="9" fill="#cbe6df"/><text x="236" y="419" font-size="16" fill="#183447">NTP</text><rect x="292" y="394" width="61" height="43" rx="9" fill="#cbe6df"/><text x="304" y="419" font-size="16" fill="#183447">NTP</text><rect x="360" y="394" width="61" height="43" rx="9" fill="#f1d7bf"/><text x="372" y="419" font-size="16" fill="#183447">RL</text><text x="20" y="470" font-size="16" fill="#183447">RL時：現方策で候補群を新しく生成</text><text x="20" y="498" font-size="16" fill="#183447">合間：ログのNTPで実行動へつなぐ</text><path d="M220 521L220 545" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="550" width="400" height="85" rx="9" fill="#e0edf2"/><text x="32" y="575" font-size="16" fill="#183447">Serving：beam searchで256 LSID</text><text x="32" y="598" font-size="16" fill="#183447">稼働中LiveIDへ解決</text><text x="32" y="621" font-size="16" fill="#183447">下流 filtering → ranking は残る</text></g></svg>