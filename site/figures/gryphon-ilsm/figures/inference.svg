<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">ILSM は候補の選別、最終 ranker は残る</title><desc id="desc">原典 §3–4 の配信図を再構成。v2 と異なり、同じ本番 ranker に1000候補を渡す。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#59717f"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#193743;font-size:20px}.small{font-size:17px}.head{font-size:25px;font-weight:700}.edge{stroke:#59717f;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="640" height="420" rx="18" fill="#f3f7f8"/><text x="24" y="38" class="head">一度の履歴計算を二つの経路で共有</text><rect x="24" y="63" width="592" height="63" rx="10" fill="#dbeceb"/><text x="40" y="93" class="">履歴 → 共有 encoder → Eᵤ</text><path class="edge" d="M165,126 L165,162"/><path class="edge" d="M480,126 L480,269"/><rect x="24" y="169" width="360" height="65" rx="10" fill="#dbeceb"/><text x="40" y="199" class="">decoder / beam → SID 候補</text><path class="edge" d="M165,234 L165,270"/><rect x="24" y="277" width="360" height="65" rx="10" fill="#dbeceb"/><text x="40" y="307" class="">衝突を曲へ展開 → ILSM 採点</text><path class="edge" d="M480,300 L388,300"/><path class="edge" d="M165,342 L165,362"/><text x="24" y="391" class="">1000候補 → 既存の最終 ranker → 表示</text></svg>