<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-labelledby="title">
<title id="title">論文の設計を簡略化した処理図</title>
<rect width="600" height="520" fill="#f5f3ec"/>
<g font-family="sans-serif" fill="#172e30">
<rect x="24" y="20" width="552" height="98" rx="7" fill="#e6eee5" stroke="#afc1b4"/>
<text x="48" y="53" font-size="16">01 / 履歴を入力する</text>
<text x="48" y="90" font-size="22" font-weight="bold">商品と行動を同じ系列へ</text>
<path d="M300 120 v20 m-5 -6 l5 6 5 -6" fill="none" stroke="#086b5e" stroke-width="2"/>
<rect x="24" y="145" width="552" height="98" rx="7" fill="#e6eee5" stroke="#afc1b4"/>
<text x="48" y="178" font-size="16">02 / 履歴を計算する</text>
<text x="48" y="215" font-size="22" font-weight="bold">共有バックボーンで計算</text>
<path d="M300 245 v20 m-5 -6 l5 6 5 -6" fill="none" stroke="#086b5e" stroke-width="2"/>
<rect x="24" y="270" width="552" height="98" rx="7" fill="#e6eee5" stroke="#afc1b4"/>
<text x="48" y="303" font-size="16">03 / 候補を集める</text>
<text x="48" y="340" font-size="22" font-weight="bold">共有表現からANN</text>
<path d="M300 370 v20 m-5 -6 l5 6 5 -6" fill="none" stroke="#086b5e" stroke-width="2"/>
<rect x="24" y="395" width="552" height="98" rx="7" fill="#e6eee5" stroke="#afc1b4"/>
<text x="48" y="428" font-size="16">04 / 候補を採点する</text>
<text x="48" y="465" font-size="22" font-weight="bold">保存したKVで候補を照合</text>
</g></svg>
