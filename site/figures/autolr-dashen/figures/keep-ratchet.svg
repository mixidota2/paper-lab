<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" role="img" aria-labelledby="title desc"><title id="title">KEEPは選択誤差を状態へ残す</title><desc id="desc">KEEPは選択誤差を状態へ残す。説明と出典はLab本文と図注を参照。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#217661"/></marker></defs><rect width="440" height="560" rx="12" fill="#fafcf7"/><rect x="20" y="20" width="400" height="78" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="48" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">真の改善がゼロの候補</text><text x="34" y="77" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">1回の測定：Δ̂ &gt; τ になることがある</text><path d="M220,99 L220,123" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="133" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="161" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">KEEP：新しいtrunkへ</text><text x="34" y="190" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">測定された差分を進歩として記録</text><text x="34" y="215" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">採択したコードが次の出発点になる</text><path d="M220,237 L220,261" fill="none" stroke="#217661" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="271" width="400" height="103" rx="8" fill="#e9f1ea" stroke="none"/><text x="34" y="299" font-family="sans-serif" font-size="19" font-weight="bold" fill="#193b36">次の候補も、そのtrunkから作る</text><text x="34" y="328" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">選択された正の差分が累積する</text><text x="34" y="353" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">独立に再測定すると進歩は消えうる</text><text x="20" y="422" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">監査時：校正profile不足でも固定閾値。</text><text x="20" y="447" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">提案：校正不足なら昇格を保留し、</text><text x="20" y="472" font-family="sans-serif" font-size="17" font-weight="normal" fill="#193b36">互換のある反復評価を先に得る。</text></svg>
